01：gb 38031-2025（快充循环后安全要求，细节待核对 → p-05） s-16：g. plett《battery management systems》（模型框架，充电约束建模） 析锂机理为电化学共识表述；本课倍率地图全部为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 [待补链] — 析锂机理经典综述（具体篇目核实后补） gb 38031-2025 原文（s-01） a 快充循环安全底线 [待补链] — 电芯厂商快充技术白皮书（公开级） 待核对项（本课） 示意倍率地图与真实电芯标定数据的差距（真实数据属企业机密，仅作量级教学） ~~电压弛豫判据的文献支撑~~ → 2026-11-23 已核实（p-43 关闭，s-91） ：vrp 电压弛豫平台法（koleti 2020）检测 可逆析锂 （剥离平台），注意负极相变可致误报；车载早期检测（huang 2022，277 引用）；mscc 多段恒流曲线使检测更稳健（schmidt 2023）； 不可逆析锂（死锂）无剥离平台，需库仑效率/容量衰减长期跟踪 。80/50/20 mv 阈值仍为示意 gb 38031-2025 快充循环条款细节（→ 已有 p-05） soh 修正倍率地图的公开文献 "}, {"id": "CHG-04", "title": "课程 CHG-04：充电安全", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-04<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a> ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；GB 38031-2025 条款细节待逐条核对（→ P-05）。<\/p><\/blockquote>\n<h3>1. 为什么充电是独立的安全场景<\/h3>\n<p>行车工况的能量闭环在车内；充电工况是<strong>外部电源长时间向车注入能量、且往往无人值守<\/strong>——风险面完全不同：<\/p>\n<ul>\n<li>能量供给方（桩）不理解电池，只执行需求报文；<\/li>\n<li>通信可能超时、被干扰、被伪造（<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a> 的国标报文无加密）；<\/li>\n<li>充电拓扑引入新暴露面：充电口、枪线、桩侧（<a class=\"xlink\" href=\"#/lesson/HV-03\">HV-03<\/a> 的监测对象变了）；<\/li>\n<li>快充本身是电化学应力最大的工况（<a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a>）。<\/li>\n<p>所以充电安全的原则是：<strong>车端 BMS 必须具备不依赖通信、不依赖桩的独立保护能力。<\/strong><\/p>\n<\/ul>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）风险清单与对策映射<\/strong>（示意框架）：<\/p>\n<table><thead><tr><th>风险<\/th><th>场景<\/th><th>车端独立对策<\/th><\/tr><\/thead><tbody><tr><td>过充<\/td><td>桩输出失控/报文伪造<\/td><td>BMS 独立电压采样 + 过压判据 → 请求停机/分断接触器<\/td><\/tr><tr><td>过温<\/td><td>端子劣化、冷却失效<\/td><td>电芯温度 + 充电口/端子温度双监测 → 分级降流<\/td><\/tr><tr><td>绝缘劣化<\/td><td>枪线破损、雨天<\/td><td>充电中绝缘复测（拓扑变化需重建等效，见 HV-03）<\/td><\/tr><tr><td>通信丢失<\/td><td>线束/干扰<\/td><td>车端超时 → 主动断充电回路（不等桩自觉）<\/td><\/tr><tr><td>反向灌流<\/td><td>桩故障<\/td><td>车端防逆流判据 + 接触器分断<\/td><\/tr><\/tbody><\/table>\n<p><strong>（2）分层防线（纵深防御）<\/strong>：桩端保护（GB/T 18487.1 框架）→ 车端 BMS 独立保护 → 电芯级安全设计（泄压阀、隔膜、正极热稳定性）→ 系统级标准（GB 38031-2025，S-01）。<\/p>\n<p><strong>（3）标准新动态（2026-11-16 核实，P-05 关闭）<\/strong>：GB 38031-2025（S-01）新增<strong>快充循环后安全测试——300 次快充循环后进行外部短路，仍需不起火、不爆炸<\/strong>；把\"快充加速老化是否埋雷\"变成可试验验证的底线（条款号待原文）。<\/p>\n<h3>3. 手算实例：快充产热与热管理需求<\/h3>\n<p>给定（全部教学示意值）：快充电流 500 A，包直流内阻 25 mΩ，包重 600 kg、等效比热 0.9 kJ/(kg·K)。<\/p>\n<p><strong>（1）产热功率<\/strong>：P = I²R = 500² × 0.025 = <strong>6.25 kW<\/strong>——快充时电池包是一台 6 kW 的\"电暖器\"。<\/p>\n<p><strong>（2）绝热温升速率<\/strong>：热容 = 600 × 0.9 = 540 kJ/K → 6250 J/s ÷ 540000 J/K ≈ 0.0116 K/s ≈ <strong>42 K/h<\/strong>。快充 30 min 的绝热自发热贡献约 21 K——没有液冷直接冲出安全温度窗。<\/p>\n<p><strong>（3）液冷需求<\/strong>：维持温差需带走 6.25 kW。冷却液比热 4.18 kJ/(kg·K)、允许水温升 5 K → 流量 ṁ = 6.25/(4.18×5) ≈ 0.30 kg/s ≈ <strong>18 L/min<\/strong>（示意）——快充车型的冷板/水泵规格为什么激进，这就是定量原因。<\/p>\n<p><strong>结论：热管理不是舒适性配置，是把电芯维持在\"不析锂 + 不热失控\"窗口的生存条件。<\/strong><\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>充电中 BMS 持续独立判单体过压/过温，触发即\"停机三连\"：发 BST → 分断充电接触器 → 记 DTC；<\/li>\n<li>充电口与端子测温接入同一分级降流逻辑；<\/li>\n<li>桩车绝缘检测时序协同（分步注入、避免双方互相干扰）按 GB/T 18487.1 框架执行（细节待核对）；<\/li>\n<li>充电场景单独纳入整车功能安全分析——\"充电中过充\"是 HARA 的经典危害条目（参见 <a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"桩会保护我的电池\"——桩只保护电网与自己，电池安全只能车端兜底；<\/li>\n<li>通信超时后等桩先动作——车端必须有独立超时断电，这是\"不依赖外部\"原则的底线；<\/li>\n<li>快充安全只盯电芯——端子/枪线的接口级发热是运维故障率最高的点（<a class=\"xlink\" href=\"#/lesson/CHG-01\">CHG-01<\/a>）；<\/li>\n<li>把 GB 38031-2025\"不起火不爆炸\"理解为电池绝不起火——它是热失控触发后的<strong>试验要求<\/strong>（2 小时观察期 + 监测点 ≤60 ℃），设计上仍靠预警与结构抑制达成（已核实 2026-11-16，P-05 关闭）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：实例中内阻老化上升 40%（35 mΩ），同样 500 A 下产热与温升速率变多少？ <strong>Q2<\/strong>：为什么充电中绝缘监测不能直接沿用行车工况的等效模型？ <strong>Q3<\/strong>：车端与桩端的过压保护判据应如何错开？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：P = 500² × 0.035 = <strong>8.75 kW<\/strong>；速率 = 8750/540000 ≈ 0.0162 K/s ≈ <strong>58 K/h<\/strong>。老化让同样快充变成更强热负荷——SOH 联动充电限值（衔接 <a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）的定量理由。<\/li>\n<li>Q2：充电时充电口、桩侧电缆与接触器状态并入高压回路，泄漏路径与对地电容都变了；且桩侧可能有自己的绝缘注入信号——沿用旧模型会误判（双向干扰）。<\/li>\n<li>Q3：车端判据必须<strong>严于<\/strong>桩端（电芯级上限早于桩输出上限触发，示意原则），保证任何故障下\"车先断、桩后知\"——保护权不能交给不懂电池的一方。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-01：GB 38031-2025（300 次快充循环后短路测试等要点，2026-11-16 汇总级核实；条款号待原文）<\/li>\n<li>S-02：GB 38031-2020（对照旧版）<\/li>\n<li>S-04：GB 18384-2020（整车安全要求）<\/li>\n<li>GB/T 18487.1-2023（充电系统安全框架，版本存在待逐条核对）<\/li>\n<li>本课 25 mΩ、6.25 kW、42 K/h、18 L/min 等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB 38031-2025 原文（S-01）<\/td><td>A<\/td><td>快充循环安全条款唯一权威<\/td><\/tr><tr><td>GB/T 18487.1-2023 原文<\/td><td>A<\/td><td>桩车协同安全时序（版本已核实存在）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>充电安全/热失控传播公开研究综述<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~GB 38031-2025 快充循环试验~~ → <strong>2026-11-16 已核实<\/strong>（300 次循环 + 外部短路；条款号待原文，P-05 关闭）。<\/li>\n<li>桩车绝缘检测分步时序的标准依据（GB/T 18487.1-2023 具体条款）。<\/li>\n<li>充电口温度传感的主流方案与典型阈值。<\/li>\n<\/ul>", "text": " 对应节点 chg-04 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置： chg-03 ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；gb 38031-2025 条款细节待逐条核对（→ p-05）。 1. 为什么充电是独立的安全场景 行车工况的能量闭环在车内；充电工况是 外部电源长时间向车注入能量、且往往无人值守 ——风险面完全不同： 能量供给方（桩）不理解电池，只执行需求报文； 通信可能超时、被干扰、被伪造（ chg-02 的国标报文无加密）； 充电拓扑引入新暴露面：充电口、枪线、桩侧（ hv-03 的监测对象变了）； 快充本身是电化学应力最大的工况（ chg-03 ）。 所以充电安全的原则是： 车端 bms 必须具备不依赖通信、不依赖桩的独立保护能力。 2. 机制展开 （1）风险清单与对策映射 （示意框架）： 风险 场景 车端独立对策 过充 桩输出失控/报文伪造 bms 独立电压采样 + 过压判据 → 请求停机/分断接触器 过温 端子劣化、冷却失效 电芯温度 + 充电口/端子温度双监测 → 分级降流 绝缘劣化 枪线破损、雨天 充电中绝缘复测（拓扑变化需重建等效，见 hv-03） 通信丢失 线束/干扰 车端超时 → 主动断充电回路（不等桩自觉） 反向灌流 桩故障 车端防逆流判据 + 接触器分断 （2）分层防线（纵深防御） ：桩端保护（gb/t 18487.1 框架）→ 车端 bms 独立保护 → 电芯级安全设计（泄压阀、隔膜、正极热稳定性）→ 系统级标准（gb 38031-2025，s-01）。 （3）标准新动态（2026-11-16 核实，p-05 关闭） ：gb 38031-2025（s-01）新增 快充循环后安全测试——300 次快充循环后进行外部短路，仍需不起火、不爆炸 ；把\"快充加速老化是否埋雷\"变成可试验验证的底线（条款号待原文）。 3. 手算实例：快充产热与热管理需求 给定（全部教学示意值）：快充电流 500 a，包直流内阻 25 mω，包重 600 kg、等效比热 0.9 kj/(kg·k)。 （1）产热功率 ：p = i²r = 500² × 0.025 = 6.25 kw ——快充时电池包是一台 6 kw 的\"电暖器\"。 （2）绝热温升速率 ：热容 = 600 × 0.9 = 540 kj/k → 6250 j/s ÷ 540000 j/k ≈ 0.0116 k/s ≈ 42 k/h 。快充 30 min 的绝热自发热贡献约 21 k——没有液冷直接冲出安全温度窗。 （3）液冷需求 ：维持温差需带走 6.25 kw。冷却液比热 4.18 kj/(kg·k)、允许水温升 5 k → 流量 ṁ = 6.25/(4.18×5) ≈ 0.30 kg/s ≈ 18 l/min （示意）——快充车型的冷板/水泵规格为什么激进，这就是定量原因。 结论：热管理不是舒适性配置，是把电芯维持在\"不析锂 + 不热失控\"窗口的生存条件。 4. 工程实态 充电中 bms 持续独立判单体过压/过温，触发即\"停机三连\"：发 bst → 分断充电接触器 → 记 dtc； 充电口与端子测温接入同一分级降流逻辑； 桩车绝缘检测时序协同（分步注入、避免双方互相干扰）按 gb/t 18487.1 框架执行（细节待核对）； 充电场景单独纳入整车功能安全分析——\"充电中过充\"是 hara 的经典危害条目（参见 safe-02 ）。 5. 常见误区 \"桩会保护我的电池\"——桩只保护电网与自己，电池安全只能车端兜底； 通信超时后等桩先动作——车端必须有独立超时断电，这是\"不依赖外部\"原则的底线； 快充安全只盯电芯——端子/枪线的接口级发热是运维故障率最高的点（ chg-01 ）； 把 gb 38031-2025\"不起火不爆炸\"理解为电池绝不起火——它是热失控触发后的 试验要求 （2 小时观察期 + 监测点 ≤60 ℃），设计上仍靠预警与结构抑制达成（已核实 2026-11-16，p-05 关闭）。 6. 自测 q1 ：实例中内阻老化上升 40%（35 mω），同样 500 a 下产热与温升速率变多少？ q2 ：为什么充电中绝缘监测不能直接沿用行车工况的等效模型？ q3 ：车端与桩端的过压保护判据应如何错开？ 答案 q1：p = 500² × 0.035 = 8.75 kw ；速率 = 8750/540000 ≈ 0.0162 k/s ≈ 58 k/h 。老化让同样快充变成更强热负荷——soh 联动充电限值（衔接 alg-05 ）的定量理由。 q2：充电时充电口、桩侧电缆与接触器状态并入高压回路，泄漏路径与对地电容都变了；且桩侧可能有自己的绝缘注入信号——沿用旧模型会误判（双向干扰）。 q3：车端判据必须 严于 桩端（电芯级上限早于桩输出上限触发，示意原则），保证任何故障下\"车先断、桩后知\"——保护权不能交给不懂电池的一方。 来源 s-01：gb 38031-2025（300 次快充循环后短路测试等要点，2026-11-16 汇总级核实；条款号待原文） s-02：gb 38031-2020（对照旧版） s-04：gb 18384-2020（整车安全要求） gb/t 18487.1-2023（充电系统安全框架，版本存在待逐条核对） 本课 25 mω、6.25 kw、42 k/h、18 l/min 等均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb 38031-2025 原文（s-01） a 快充循环安全条款唯一权威 gb/t 18487.1-2023 原文 a 桩车协同安全时序（版本已核实存在） [待补链] — 充电安全/热失控传播公开研究综述 待核对项（本课） ~~gb 38031-2025 快充循环试验~~ → 2026-11-16 已核实 （300 次循环 + 外部短路；条款号待原文，p-05 关闭）。 桩车绝缘检测分步时序的标准依据（gb/t 18487.1-2023 具体条款）。 充电口温度传感的主流方案与典型阈值。 "}, {"id": "CHG-05", "title": "课程 CHG-05：车桩匹配与即插即充", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-05<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a> ｜ 预计用时 35 min 数字规则：文中时序与耗时均为<strong>教学示意值<\/strong>；证书体系沿 ISO 15118（S-10）框架描述。<\/p><\/blockquote>\n<h3>1. 为什么\"插枪即充\"不简单<\/h3>\n<p>传统充电认证：刷卡 / APP 扫码 / 输密码——身份属于\"人\"，操作繁琐，且存在卡盗刷、二维码被覆盖等攻击面。<\/p>\n<p>即插即充（PnC，Plug &amp; Charge）：<strong>身份与授权内置于车<\/strong>——插枪瞬间，车用密码学证书向桩证明\"我是谁、谁替我付钱\"，全程无感。这是充电体验的终局形态，但依赖一整套 PKI（Public Key Infrastructure，公钥基础设施）证书体系——正是节点约束说的\"依赖 ISO 15118 证书体系；桩端支持率是落地瓶颈\"。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）证书角色分工<\/strong>（ISO 15118 框架，S-10）：<\/p>\n<table><thead><tr><th>证书<\/th><th>持有方<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>V2G Root CA<\/td><td>行业信任锚<\/td><td>全体系信任根，预置在车与桩<\/td><\/tr><tr><td>Contract Certificate（合同证书）<\/td><td>车辆/用户<\/td><td>证明\"有权充电 + 计费账户\"，含公钥<\/td><\/tr><tr><td>OEM Certificate<\/td><td>车厂<\/td><td>设备层身份<\/td><\/tr><tr><td>桩侧运营证书<\/td><td>桩/运营商<\/td><td>证明桩合法<\/td><\/tr><\/tbody><\/table>\n<p><strong>（2）即插即充流程推演<\/strong>（步骤语义沿 ISO 15118，耗时为教学示意值）：<\/p>\n<ol>\n<li>物理连接 + <strong>SLAC<\/strong>（Signal Level Attenuation Characterization，信号衰减匹配，建立 PLC 链路，ISO 15118-3）：~2~3 s；<\/li>\n<li>TCP/TLS 会话建立（双向认证、交换证书链）：~0.3~0.5 s（假设 RTT 50 ms 量级，示意）；<\/li>\n<li><code>PaymentDetailsReq/Res<\/code>：车出示合同证书链：~50 ms 级；<\/li>\n<li><code>AuthorizationReq/Res<\/code>：车用合同证书<strong>私钥<\/strong>签名挑战，桩/后台验证——证明\"持证者本人在场\"（防证书复制）：~0.2~1 s（含后台在线校验）；<\/li>\n<li>参数协商 → 充电 → 结算记录绑定 EVCCID（车端通信控制器 ID）。<\/li>\n<p>从插入到开始充电合计 <strong>~3~5 s<\/strong>（示意），与传统刷卡相当，但零人工操作。<\/p>\n<p><strong>（3）私钥安全<\/strong>：合同证书私钥必须存于 HSM（Hardware Security Module，硬件安全模块）/ SE（Secure Element，安全元件），不可导出——证书可以公开，私钥泄露即身份失窃。<\/p>\n<p><strong>（4）证书生命周期<\/strong>：有效期（1~3 年量级，示意）→ 到期在线更新（CertificateUpdate 流程）；失窃证书走吊销机制（具体报文名待核对）。<\/p>\n<\/ol>\n<h3>3. 工程案例：国内落地路线推演（工程现状概述，细节待核对）<\/h3>\n<ul>\n<li><strong>GB/T 27930 没有证书体系<\/strong>（<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a>），所以国内\"即插即充\"目前主流是<strong>平台级变通<\/strong>：车联网平台预绑定 VIN 与支付账户，插枪后识别 VIN → 平台授权。体验接近 PnC，但认证强度是\"平台信用\"，不是端到端密码学；<\/li>\n<li><strong>真正 PnC 的落地条件<\/strong>：行业级 PKI（根 CA 运营方）+ 桩端证书栈支持 + 车端 HSM 与证书 OTA 管理——三者缺一不可，这就是\"桩端支持率是落地瓶颈\"的含义；<\/li>\n<li>过渡期：车端同时支持 27930 + 15118 双栈（出口车型已是常态）。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>欧洲 CCS 网络 PnC 支持率持续提升（ISO 15118-2 桩侧逐步铺开，具体渗透率待核对）；<\/li>\n<li><strong>ISO 15118-20 已核实（2026-11-23，S-92）<\/strong>：2022-04 出版，为<strong>替代而非扩展<\/strong>——-20 与 -2 报文集不可互通，桩需双栈并协商回退（EU AFIR 推动落地）；新能力：真双向 V2G/V2H/V2L（DC 为主）、DC 动态充电、无线充电支持、TLS 1.3 + 新证书体系；<\/li>\n<li>车端供应链新三件：EVCC（车侧通信控制器）+ SE 芯片 + 证书 OTA 管理平台；<\/li>\n<li>计费合规：PnC 结算数据须满足计量认证与税务要求（国内特有约束）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把\"免扫码充电\"当 PnC——平台 VIN 绑定没有端到端密码学认证，安全模型完全不同；<\/li>\n<li>认为 PnC = 免费/自动优惠——认证与计费策略是两层，价格照常执行；<\/li>\n<li>忽略证书运维成本——到期、吊销、跨运营商互认是持续运营问题，不是一次性开发问题；<\/li>\n<li>把插枪慢归咎 SLAC——多数耗时在后台在线授权往返（流程第 4 步）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：AuthorizationReq 用私钥签名是为了证明什么？只出示证书为什么不够？ <strong>Q2<\/strong>：在 GB/T 27930 上做\"真 PnC\"缺什么？ <strong>Q3<\/strong>：合同证书在充电中过期，合理处理策略是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：证明请求方<strong>持有<\/strong>与证书公钥配对的私钥（防复制证书重放）。证书是公开的\"身份证\"，任何人都能出示；只有真正持有人能完成签名挑战——非对称认证的基本逻辑。<\/li>\n<li>Q2：缺证书体系本身：27930 是明文 CAN 报文，没有证书格式、信任链、密钥存储规范，也没有行业根 CA 与桩端验证栈——需要\"通信协议 + PKI + 硬件\"三层同时补齐。<\/li>\n<li>Q3：进行中的会话不受影响（授权在开始时完成）；下次插枪触发在线更新（CertificateUpdate）或降级到 APP 认证；运营方应在到期前推送证书 OTA。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-10：ISO 15118 系列（含 Plug &amp; Charge 证书体系）<\/li>\n<li>S-08 / S-14：ISO/SAE 21434、UN R155（车端证书管理与网络安全的体系框架）<\/li>\n<li>本课耗时数值、证书有效期均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 15118-2 / -20 原文（S-10）<\/td><td>A<\/td><td>PnC 报文与证书流程唯一权威<\/td><\/tr><tr><td>ISO 15118-3 原文（S-10）<\/td><td>A<\/td><td>PLC 物理层与 SLAC<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>openV2G 开源实现（V2G/EXI 报文编解码）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>国内平台级\"即插即充\"方案的技术细节与渗透率（本文为工程现状概述）<\/li>\n<li>证书更新报文的准确名称（-20 新证书体系细节待逐条）<\/li>\n<li>合同证书有效期的行业惯例数值（1~3 年为示意）<\/li>\n<li>国内 PnC 的 PKI 运营方与政策进展<\/li>\n<\/ul>", "text": " 对应节点 chg-05 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置： chg-02 ｜ 预计用时 35 min 数字规则：文中时序与耗时均为 教学示意值 ；证书体系沿 iso 15118（s-10）框架描述。 1. 为什么\"插枪即充\"不简单 传统充电认证：刷卡 / app 扫码 / 输密码——身份属于\"人\"，操作繁琐，且存在卡盗刷、二维码被覆盖等攻击面。 即插即充（pnc，plug &amp; charge）： 身份与授权内置于车 ——插枪瞬间，车用密码学证书向桩证明\"我是谁、谁替我付钱\"，全程无感。这是充电体验的终局形态，但依赖一整套 pki（public key infrastructure，公钥基础设施）证书体系——正是节点约束说的\"依赖 iso 15118 证书体系；桩端支持率是落地瓶颈\"。 2. 机制展开 （1）证书角色分工 （iso 15118 框架，s-10）： 证书 持有方 作用 v2g root ca 行业信任锚 全体系信任根，预置在车与桩 contract certificate（合同证书） 车辆/用户 证明\"有权充电 + 计费账户\"，含公钥 oem certificate 车厂 设备层身份 桩侧运营证书 桩/运营商 证明桩合法 （2）即插即充流程推演 （步骤语义沿 iso 15118，耗时为教学示意值）： 物理连接 + slac （signal level attenuation characterization，信号衰减匹配，建立 plc 链路，iso 15118-3）：~2~3 s； tcp/tls 会话建立（双向认证、交换证书链）：~0.3~0.5 s（假设 rtt 50 ms 量级，示意）； paymentdetailsreq/res ：车出示合同证书链：~50 ms 级； authorizationreq/res ：车用合同证书 私钥 签名挑战，桩/后台验证——证明\"持证者本人在场\"（防证书复制）：~0.2~1 s（含后台在线校验）； 参数协商 → 充电 → 结算记录绑定 evccid（车端通信控制器 id）。 从插入到开始充电合计 ~3~5 s （示意），与传统刷卡相当，但零人工操作。 （3）私钥安全 ：合同证书私钥必须存于 hsm（hardware security module，硬件安全模块）/ se（secure element，安全元件），不可导出——证书可以公开，私钥泄露即身份失窃。 （4）证书生命周期 ：有效期（1~3 年量级，示意）→ 到期在线更新（certificateupdate 流程）；失窃证书走吊销机制（具体报文名待核对）。 3. 工程案例：国内落地路线推演（工程现状概述，细节待核对） gb/t 27930 没有证书体系 （ chg-02 ），所以国内\"即插即充\"目前主流是 平台级变通 ：车联网平台预绑定 vin 与支付账户，插枪后识别 vin → 平台授权。体验接近 pnc，但认证强度是\"平台信用\"，不是端到端密码学； 真正 pnc 的落地条件 ：行业级 pki（根 ca 运营方）+ 桩端证书栈支持 + 车端 hsm 与证书 ota 管理——三者缺一不可，这就是\"桩端支持率是落地瓶颈\"的含义； 过渡期：车端同时支持 27930 + 15118 双栈（出口车型已是常态）。 4. 工程实态 欧洲 ccs 网络 pnc 支持率持续提升（iso 15118-2 桩侧逐步铺开，具体渗透率待核对）； iso 15118-20 已核实（2026-11-23，s-92） ：2022-04 出版，为 替代而非扩展 ——-20 与 -2 报文集不可互通，桩需双栈并协商回退（eu afir 推动落地）；新能力：真双向 v2g/v2h/v2l（dc 为主）、dc 动态充电、无线充电支持、tls 1.3 + 新证书体系； 车端供应链新三件：evcc（车侧通信控制器）+ se 芯片 + 证书 ota 管理平台； 计费合规：pnc 结算数据须满足计量认证与税务要求（国内特有约束）。 5. 常见误区 把\"免扫码充电\"当 pnc——平台 vin 绑定没有端到端密码学认证，安全模型完全不同； 认为 pnc = 免费/自动优惠——认证与计费策略是两层，价格照常执行； 忽略证书运维成本——到期、吊销、跨运营商互认是持续运营问题，不是一次性开发问题； 把插枪慢归咎 slac——多数耗时在后台在线授权往返（流程第 4 步）。 6. 自测 q1 ：authorizationreq 用私钥签名是为了证明什么？只出示证书为什么不够？ q2 ：在 gb/t 27930 上做\"真 pnc\"缺什么？ q3 ：合同证书在充电中过期，合理处理策略是什么？ 答案 q1：证明请求方 持有 与证书公钥配对的私钥（防复制证书重放）。证书是公开的\"身份证\"，任何人都能出示；只有真正持有人能完成签名挑战——非对称认证的基本逻辑。 q2：缺证书体系本身：27930 是明文 can 报文，没有证书格式、信任链、密钥存储规范，也没有行业根 ca 与桩端验证栈——需要\"通信协议 + pki + 硬件\"三层同时补齐。 q3：进行中的会话不受影响（授权在开始时完成）；下次插枪触发在线更新（certificateupdate）或降级到 app 认证；运营方应在到期前推送证书 ota。 来源 s-10：iso 15118 系列（含 plug &amp; charge 证书体系） s-08 / s-14：iso/sae 21434、un r155（车端证书管理与网络安全的体系框架） 本课耗时数值、证书有效期均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 15118-2 / -20 原文（s-10） a pnc 报文与证书流程唯一权威 iso 15118-3 原文（s-10） a plc 物理层与 slac [待补链] — openv2g 开源实现（v2g/exi 报文编解码） 待核对项（本课） 国内平台级\"即插即充\"方案的技术细节与渗透率（本文为工程现状概述） 证书更新报文的准确名称（-20 新证书体系细节待逐条） 合同证书有效期的行业惯例数值（1~3 年为示意） 国内 pnc 的 pki 运营方与政策进展 "}, {"id": "CHG-06", "title": "课程 CHG-06：充电末端控制", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-06<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a> ｜ 预计用时 40 min 数字规则：文中电芯参数与曲线数值均为<strong>教学示意值<\/strong>；CATL 末端速率保持宣称挂 P-02（C 级，不作事实引用）。<\/p><\/blockquote>\n<h3>1. 为什么充电末端\"必然变慢\"<\/h3>\n<p>充电的主流形态是 CC-CV（恒流-恒压）：恒流充到电芯电压上限 → 转恒压，电流自然衰减。<\/p>\n<p>末端必须降流的物理原因（把 <a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a> 的机理翻译成端电压语言）：<\/p>\n<div class=\"math\">V_{terminal} = OCV(SOC) + I \\times R_{int}<\/div>\n<p>电芯电压不许超上限 V_max。SOC 上升时 OCV 逼近 V_max，留给\"极化压降 I×R\"的空间被压缩 → 允许电流 I_max = (V_max − OCV)/R 必然递减。<strong>末端慢不是策略保守，是电压上限下的算术必然。<\/strong> 节点约束点题：CV 段降流直接影响充电时间；末端速率保持能力是厂商算法差异点。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）谁来执行降流<\/strong>：车端 BMS 按\"SOC × 温度 × SOH\"算出目标电流，经 BCL 报文下发（<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a>），桩执行电流跟踪——<strong>降流曲线是车端资产<\/strong>，桩只是执行器。<\/p>\n<p><strong>（2）三种策略形态<\/strong>（示意分类）：<\/p>\n<ul>\n<li><strong>纯 CC-CV<\/strong>：转 CV 后桩恒压、电流自由衰减——简单但末端拖沓；<\/li>\n<li><strong>多段降流（车端查表）<\/strong>：量产主流，折线式收紧，让电流始终贴着 I_max 边界走；<\/li>\n<li><strong>模型/多参量法<\/strong>：按等效电路或电化学模型实时逼近边界——\"末端速率保持\"宣称属此类（CATL 多尺度参量耦合算法，P-02，C 级待验证）。<\/li>\n<p><strong>（3）末端还并行做两件事<\/strong>：单体均衡（均衡多在充电末端启用，见 <a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>）与满充标定（LFP 车型的满充锚点，见 <a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>）——末端时间也是它们的工作窗口。<\/p>\n<\/ul>\n<h3>3. 手算实例：降流曲线与末端时间预算<\/h3>\n<p>设定（全部教学示意值）：单芯 2 Ah，V_max = 4.25 V，R_int = 10 mΩ；OCV 顶端近似线性：80% SOC 处 OCV = 4.15 V，斜率 k = 4.67 mV/%SOC。<\/p>\n<p><strong>（1）降流曲线<\/strong>：I_max(SOC) = (4.25 − OCV)/0.01<\/p>\n<table><thead><tr><th>SOC<\/th><th>OCV（V）<\/th><th>I_max（A）<\/th><th>倍率<\/th><\/tr><\/thead><tbody><tr><td>80%<\/td><td>4.150<\/td><td>10.0<\/td><td>5C<\/td><\/tr><tr><td>85%<\/td><td>4.173<\/td><td>7.7<\/td><td>3.8C<\/td><\/tr><tr><td>90%<\/td><td>4.197<\/td><td>5.3<\/td><td>2.7C<\/td><\/tr><tr><td>95%<\/td><td>4.220<\/td><td>3.0<\/td><td>1.5C<\/td><\/tr><tr><td>100%<\/td><td>4.243<\/td><td>0.7<\/td><td>0.35C<\/td><\/tr><\/tbody><\/table>\n<p><strong>（2）末端时间估算<\/strong>（CV 段等效一阶模型，时间常数 τ = R·C/k_v，k_v = 0.467 V 每满量程 SOC）：<\/p>\n<ul>\n<li>τ = 0.01 Ω × 2 Ah / 0.467 V ≈ 0.0429 h ≈ <strong>154 s<\/strong>；<\/li>\n<li>电流从 10 A 衰减到 3 A（80%→95%）：t = τ·ln(10/3) ≈ 154 × 1.204 ≈ <strong>185 s ≈ 3.1 min<\/strong>，充入 0.3 Ah；<\/li>\n<li>交叉验证：平均电流 = (10−3)/ln(10/3) ≈ 5.8 A → 0.3 Ah ÷ 5.8 A ≈ 3.1 min ✓<\/li>\n<p><strong>（3）量级结论<\/strong>：CC 段 0→80% 用 1.6 Ah ÷ 10 A = 9.6 min；末端 15% SOC 花了 3.1 min ≈ <strong>总时间 12.7 min 的 24%<\/strong>——\"最后 15% 占 1/4 时间\"，这就是厂商死磕末端算法的定量动机。<\/p>\n<p><strong>（4）差异点的算术<\/strong>：若把 V_max 放宽到 4.30 V，80% 处 I_max = (4.30−4.15)/0.01 = <strong>15 A<\/strong>（提升 50%）——<strong>末端速率的秘密一半在电压上限的取舍<\/strong>，代价是高 SOC 存储应力与寿命（衔接 <a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>降流查表随 SOH/温度在线修正（低温下 R_int 增大，末端更慢）；<\/li>\n<li>营销口径普遍报\"30%~80% 时间\"、回避末端——用户\"充满还要等\"的感知即来自末端段；<\/li>\n<li>截止判据：电流降到截止值（如 0.05C，示意）判满充；仪表 SOC 提前显示 100% 是常见做法（显示与实际满充有时差）；<\/li>\n<li>\"末端速率保持\"宣称（P-02，C 级）：本质是更贴边界的模型化降流 + 电压上限协商，待一手来源验证。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"末端故意慢是保护电池的营销设计\"——是 V_max 约束下的算术必然，不是自由选择；<\/li>\n<li>把 CV 段电流衰减当故障——那是指数衰减的本征形态；<\/li>\n<li>降流表只按 SOC 一维设计——低温 R_int 可翻倍量级（示意），同一 SOC 的安全电流完全不同；<\/li>\n<li>认为桩决定充电曲线——车端 BCL 才是需求方，桩只跟踪（桩上限只是天花板）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：用实例参数算 SOC 92% 时的 I_max。 <strong>Q2<\/strong>：R_int 低温翻倍到 20 mΩ，80% 处 I_max 变多少？末端时间常数 τ 变多少？ <strong>Q3<\/strong>：为什么\"提高 V_max\"能加速末端却伤寿命？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：OCV(92%) = 4.15 + 4.67 mV × 12 = 4.206 V；I_max = (4.25 − 4.206)/0.01 = <strong>4.4 A<\/strong>。<\/li>\n<li>Q2：I_max = (4.25−4.15)/0.02 = <strong>5 A<\/strong>（减半）；τ = 0.02×2/0.467 ≈ <strong>309 s<\/strong>（翻倍），末端从 5 A 降到 1.5 A 需 309×ln(10/3) ≈ 372 s——低温末端慢是\"入口更低 + 时间常数更长\"的双重叠加。<\/li>\n<li>Q3：V_max 提高 → 同 SOC 下 (V_max − OCV) 余量更大 → I_max 更高；但高电压（高 SOC）下负极嵌锂过满、电解液氧化应力增大，日历与循环老化都加速（高压存储应力为电化学共识，量级随电芯而异）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett《Battery Management Systems》（等效电路与充电约束建模框架）<\/li>\n<li>S-01：GB 38031-2025（过充安全上下文）<\/li>\n<li>P-02：CATL\"多尺度参量耦合算法\"末端速率保持宣称（C 级，仅作待验证线索，不作事实引用）<\/li>\n<li>本课 2 Ah、4.25 V、10 mΩ、4.67 mV/% 等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 27930 原文（S-05）<\/td><td>A<\/td><td>BCL 需求报文机制<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>CC-CV 充电与析锂边界的经典综述（篇目核实后补）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>开源 BMS 项目的充电控制实现（如 Libre Solar BMS）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>4.67 mV/% 的 OCV 顶端斜率、2 Ah/10 mΩ 等均为教学示意值（真实值随电芯而异）<\/li>\n<li>充电末端截止电流的行业惯例取值（0.05C 为示意）<\/li>\n<li>CATL 末端速率保持算法的一手技术来源（→ 已有 P-02）<\/li>\n<li>充电末端启用均衡的通用性（各厂策略差异）<\/li>\n<\/ul>", "text": " 对应节点 chg-06 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置： chg-02 ｜ 预计用时 40 min 数字规则：文中电芯参数与曲线数值均为 教学示意值 ；catl 末端速率保持宣称挂 p-02（c 级，不作事实引用）。 1. 为什么充电末端\"必然变慢\" 充电的主流形态是 cc-cv（恒流-恒压）：恒流充到电芯电压上限 → 转恒压，电流自然衰减。 末端必须降流的物理原因（把 chg-03 的机理翻译成端电压语言）： v_{terminal} = ocv(soc) + i \\times r_{int} 电芯电压不许超上限 v_max。soc 上升时 ocv 逼近 v_max，留给\"极化压降 i×r\"的空间被压缩 → 允许电流 i_max = (v_max − ocv)/r 必然递减。 末端慢不是策略保守，是电压上限下的算术必然。 节点约束点题：cv 段降流直接影响充电时间；末端速率保持能力是厂商算法差异点。 2. 机制展开 （1）谁来执行降流 ：车端 bms 按\"soc × 温度 × soh\"算出目标电流，经 bcl 报文下发（ chg-02 ），桩执行电流跟踪—— 降流曲线是车端资产 ，桩只是执行器。 （2）三种策略形态 （示意分类）： 纯 cc-cv ：转 cv 后桩恒压、电流自由衰减——简单但末端拖沓； 多段降流（车端查表） ：量产主流，折线式收紧，让电流始终贴着 i_max 边界走； 模型/多参量法 ：按等效电路或电化学模型实时逼近边界——\"末端速率保持\"宣称属此类（catl 多尺度参量耦合算法，p-02，c 级待验证）。 （3）末端还并行做两件事 ：单体均衡（均衡多在充电末端启用，见 hw-01 ）与满充标定（lfp 车型的满充锚点，见 alg-01 ）——末端时间也是它们的工作窗口。 3. 手算实例：降流曲线与末端时间预算 设定（全部教学示意值）：单芯 2 ah，v_max = 4.25 v，r_int = 10 mω；ocv 顶端近似线性：80% soc 处 ocv = 4.15 v，斜率 k = 4.67 mv/%soc。 （1）降流曲线 ：i_max(soc) = (4.25 − ocv)/0.01 soc ocv（v） i_max（a） 倍率 80% 4.150 10.0 5c 85% 4.173 7.7 3.8c 90% 4.197 5.3 2.7c 95% 4.220 3.0 1.5c 100% 4.243 0.7 0.35c （2）末端时间估算 （cv 段等效一阶模型，时间常数 τ = r·c/k_v，k_v = 0.467 v 每满量程 soc）： τ = 0.01 ω × 2 ah / 0.467 v ≈ 0.0429 h ≈ 154 s ； 电流从 10 a 衰减到 3 a（80%→95%）：t = τ·ln(10/3) ≈ 154 × 1.204 ≈ 185 s ≈ 3.1 min ，充入 0.3 ah； 交叉验证：平均电流 = (10−3)/ln(10/3) ≈ 5.8 a → 0.3 ah ÷ 5.8 a ≈ 3.1 min ✓ （3）量级结论 ：cc 段 0→80% 用 1.6 ah ÷ 10 a = 9.6 min；末端 15% soc 花了 3.1 min ≈ 总时间 12.7 min 的 24% ——\"最后 15% 占 1/4 时间\"，这就是厂商死磕末端算法的定量动机。 （4）差异点的算术 ：若把 v_max 放宽到 4.30 v，80% 处 i_max = (4.30−4.15)/0.01 = 15 a （提升 50%）—— 末端速率的秘密一半在电压上限的取舍 ，代价是高 soc 存储应力与寿命（衔接 alg-05 ）。 4. 工程实态 降流查表随 soh/温度在线修正（低温下 r_int 增大，末端更慢）； 营销口径普遍报\"30%~80% 时间\"、回避末端——用户\"充满还要等\"的感知即来自末端段； 截止判据：电流降到截止值（如 0.05c，示意）判满充；仪表 soc 提前显示 100% 是常见做法（显示与实际满充有时差）； \"末端速率保持\"宣称（p-02，c 级）：本质是更贴边界的模型化降流 + 电压上限协商，待一手来源验证。 5. 常见误区 \"末端故意慢是保护电池的营销设计\"——是 v_max 约束下的算术必然，不是自由选择； 把 cv 段电流衰减当故障——那是指数衰减的本征形态； 降流表只按 soc 一维设计——低温 r_int 可翻倍量级（示意），同一 soc 的安全电流完全不同； 认为桩决定充电曲线——车端 bcl 才是需求方，桩只跟踪（桩上限只是天花板）。 6. 自测 q1 ：用实例参数算 soc 92% 时的 i_max。 q2 ：r_int 低温翻倍到 20 mω，80% 处 i_max 变多少？末端时间常数 τ 变多少？ q3 ：为什么\"提高 v_max\"能加速末端却伤寿命？ 答案 q1：ocv(92%) = 4.15 + 4.67 mv × 12 = 4.206 v；i_max = (4.25 − 4.206)/0.01 = 4.4 a 。 q2：i_max = (4.25−4.15)/0.02 = 5 a （减半）；τ = 0.02×2/0.467 ≈ 309 s （翻倍），末端从 5 a 降到 1.5 a 需 309×ln(10/3) ≈ 372 s——低温末端慢是\"入口更低 + 时间常数更长\"的双重叠加。 q3：v_max 提高 → 同 soc 下 (v_max − ocv) 余量更大 → i_max 更高；但高电压（高 soc）下负极嵌锂过满、电解液氧化应力增大，日历与循环老化都加速（高压存储应力为电化学共识，量级随电芯而异）。 来源 s-16：g. plett《battery management systems》（等效电路与充电约束建模框架） s-01：gb 38031-2025（过充安全上下文） p-02：catl\"多尺度参量耦合算法\"末端速率保持宣称（c 级，仅作待验证线索，不作事实引用） 本课 2 ah、4.25 v、10 mω、4.67 mv/% 等均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb/t 27930 原文（s-05） a bcl 需求报文机制 [待补链] — cc-cv 充电与析锂边界的经典综述（篇目核实后补） [待补链] — 开源 bms 项目的充电控制实现（如 libre solar bms） 待核对项（本课） 4.67 mv/% 的 ocv 顶端斜率、2 ah/10 mω 等均为教学示意值（真实值随电芯而异） 充电末端截止电流的行业惯例取值（0.05c 为示意） catl 末端速率保持算法的一手技术来源（→ 已有 p-02） 充电末端启用均衡的通用性（各厂策略差异） "}, {"id": "CHM-01", "title": "课程 CHM-01：主流锂电体系差异（LFP/NCM/NCA）", "dom": "CHM", "verified": false, "html": "<blockquote><p>对应节点 <code>CHM-01<\/code>（../domains/11-化学体系.md <span class=\"fileref\">（项目文件 ../domains/11-化学体系.md）<\/span>）｜ 前置：<code>ALG-01<\/code>（OCV 概念）｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>或\"常见典型值（随厂家有差异）\"。<\/p><\/blockquote>\n<h3>1. 为什么 BMS 要关心化学体系<\/h3>\n<p>BMS 的软件框架是\"化学体系无关\"的（安时积分、EKF、均衡框架通用），但<strong>参数与策略侧重点完全由化学决定<\/strong>：把 NCM 的参数灌进 LFP 的车，SOC 会跳变；把 LFP 的安全策略照搬给 NCM，热事件监测可能太迟缓。做 BMS 不需要当电化学家，但必须知道三大体系在哪里\"硌手\"。<\/p>\n<h3>2. 机制：三体系对比（BMS 视角）<\/h3>\n<table><thead><tr><th>维度<\/th><th>LFP（磷酸铁锂）<\/th><th>NCM（三元，镍钴锰）<\/th><th>NCA（镍钴铝）<\/th><\/tr><\/thead><tbody><tr><td>标称电压<\/td><td>≈3.2 V<\/td><td>≈3.6~3.7 V<\/td><td>≈3.6 V（常见典型值，随厂家有差异）<\/td><\/tr><tr><td>OCV-SOC 形状<\/td><td>中段长平台 + 滞回明显<\/td><td>全程斜率可观<\/td><td>斜率可观（类似 NCM）<\/td><\/tr><tr><td>SOC 估计难度<\/td><td>高（平台期电压法失效）<\/td><td>中低<\/td><td>中低<\/td><\/tr><tr><td>热稳定性<\/td><td>好（定性）<\/td><td>中，镍含量越高越差（定性）<\/td><td>偏差（与高镍 NCM 相当或更差，定性）<\/td><\/tr><tr><td>循环寿命<\/td><td>长（定性）<\/td><td>中<\/td><td>中，日历老化偏快（定性）<\/td><\/tr><tr><td>能量密度<\/td><td>中低<\/td><td>中~高<\/td><td>高<\/td><\/tr><tr><td>BMS 策略侧重<\/td><td>满充锚定、均衡靠容量法、平台段降精度承诺<\/td><td>热事件监测灵敏度、充电截止管理<\/td><td>同 NCM + 更保守的日历老化模型<\/td><\/tr><\/tbody><\/table>\n<p>表中定性判断为工程共识级；具体温度与数值随电芯设计差异很大，引用须回到具体电芯规格书（建模框架依据 S-16，LFP 电量计实践依据 S-34）。<\/p>\n<h4>手算实例：平台期\"电压 → SOC\"翻译能力（核心案例，教学示意值）<\/h4>\n<p>设 AFE（模拟前端芯片）单体电压采样误差 ±2 mV，看它能翻译成多少 SOC 误差：<\/p>\n<ul>\n<li>NCM 中段：dOCV/dSOC ≈ 5 mV/%（示意，呼应 <code>ALG-01<\/code> 的 P-14 待核对）→ SOC 误差 ≈ 2 ÷ 5 = <strong>0.4%<\/strong>，可用；<\/li>\n<li>LFP 平台段：dOCV/dSOC ≈ 0.5 mV/%（示意）→ 名义误差 4%，且平台内近乎平坦 + 滞回（充放电 OCV 不重合，差值可达数十 mV 量级，示意）→ <strong>翻译失效<\/strong>。<\/li>\n<p>同一套 BMS、同一个 AFE，化学体系一换，\"电压法校正\"从主锚点变废棋——这就是 LFP 车改用\"满充端点锚定 + 周期充满\"的根源（工程实践观点，官方手册来源待核对 → P-15）。这也是 <code>ALG-02<\/code>（EKF）在 LFP 上吃力的源头。<\/p>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li><strong>LFP 车<\/strong>：仪表 SOC 在平台段\"横盘\"、满充后跳变是正常现象；用户手册常建议定期充满（P-15）；均衡多按容量/库仑差而非电压差（平台期压差不反映 SOC 差）。<\/li>\n<li><strong>NCM/NCA 车<\/strong>：SOC 中段即可用电压校正；热事件监测（温升率、压降异常）设计更敏感；高镍系充电上限电压管理更严格。<\/li>\n<li>同平台的\"磷酸铁锂版/三元版\"通常共用硬件、维护两套标定与策略参数（<code>DEV-05<\/code> 标定矩阵按体系分开）。<\/li>\n<li>硬件连锁效应：同容量包，LFP 单体电压低（≈3.2 V）→ 串数更多 → 采样通道数、采样线束与均衡通道数相应增加（定性）——化学体系差异在硬件选型阶段就传导进 BMS。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>\"LFP 安全，BMS 可以省功能\"——热失控风险低不等于 SOC/均衡难题消失，LFP 的难点换了位置而不是消失。<\/li>\n<li>把 NCA 参数并入 NCM 一套——日历老化与热稳定性差异会让 SOH/安全阈值错位（定性）。<\/li>\n<li>用静态 OCV 表处理滞回——平台段充放电曲线不重合，单纯查表会在充→放切换后系统性偏移（滞回建模见 <code>ALG-10<\/code>）。<\/li>\n<li>\"电压越高越危险\"的线性思维——安全边界是温度 + 电压 + 内阻的联合域，不是单电压红线。<\/li>\n<li>\"循环寿命长 = 不用管 SOH\"——LFP 的日历老化与容量\"台阶\"现象（容量恢复/跳变，机理待文献入库）同样需要 SOH 跟踪（<code>ALG-05<\/code>）。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：若 AFE 误差改善到 ±1 mV，LFP 平台段电压法就能用了吗？为什么？ <strong>Q2<\/strong>：LFP 均衡为什么\"看容量不看电压\"？用一个数字例子说明。 <strong>Q3<\/strong>：高镍 NCM/NCA 的热策略相比中低镍应向哪个方向收紧？给两个可操作例子。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：名义误差降到 2%（示意），仍远差于 NCM 的 0.4%，且滞回未解决——\"能读\"但\"不可信\"，策略上仍应放弃平台段锚定。<\/li>\n<li>Q2（示例）：平台段两颗电芯电压几乎相同（差 2 mV，示意），但安时积分显示一颗已充入 3 Ah、另一颗 2.5 Ah（示意）——电压差 ≈ 0 而容量差 0.5 Ah；按电压均衡会漏判，按容量/库仑差才能均衡。<\/li>\n<li>Q3（示例）：①热事件监测的温升率触发阈值下调、监测频率提高；②长期满电停放的管理（高 SOC + 日历老化叠加），充电策略引导避免满电久停。（方向性示例，具体数值按电芯规格与整车策略定）<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett《Battery Management Systems》Vol. I/II（OCV 形状、滞回与建模框架）<\/li>\n<li>S-34：TI SLUA364 / SLYT402（Impedance Track 及 LFP 平台期的量产电量计处理，厂商官方文档）<\/li>\n<li>P-14：LFP/NCM 平台段 dOCV/dSOC 典型数值（待文献核对）<\/li>\n<li>P-15：\"LFP 车型建议定期满充\"的官方手册来源（待核对）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>TI SLYT402（S-34）<\/td><td>LFP 对电量计的特殊处理，与第 2 节直接对应<\/td><\/tr><tr><td>Plett Vol. I（S-16）<\/td><td>OCV 与等效电路的系统教材<\/td><\/tr><tr><td>[待补链] 三体系参数横向对比的可追溯综述<\/td><td>待雷达捕获公开对比数据后入库<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>dOCV/dSOC 的文献典型值（对应已有 P-14）与滞回幅度（\"数十 mV 量级\"为示意）。<\/li>\n<li>LFP/NCM/NCA 热失控触发温度的公开可比数据（本课只给定性）。<\/li>\n<li>\"定期满充\"建议的官方用户手册实例（对应已有 P-15）。<\/li>\n<\/ul>", "text": " 对应节点 chm-01 （../domains/11-化学体系.md （项目文件 ../domains/11-化学体系.md） ）｜ 前置： alg-01 （ocv 概念）｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 或\"常见典型值（随厂家有差异）\"。 1. 为什么 bms 要关心化学体系 bms 的软件框架是\"化学体系无关\"的（安时积分、ekf、均衡框架通用），但 参数与策略侧重点完全由化学决定 ：把 ncm 的参数灌进 lfp 的车，soc 会跳变；把 lfp 的安全策略照搬给 ncm，热事件监测可能太迟缓。做 bms 不需要当电化学家，但必须知道三大体系在哪里\"硌手\"。 2. 机制：三体系对比（bms 视角） 维度 lfp（磷酸铁锂） ncm（三元，镍钴锰） nca（镍钴铝） 标称电压 ≈3.2 v ≈3.6~3.7 v ≈3.6 v（常见典型值，随厂家有差异） ocv-soc 形状 中段长平台 + 滞回明显 全程斜率可观 斜率可观（类似 ncm） soc 估计难度 高（平台期电压法失效） 中低 中低 热稳定性 好（定性） 中，镍含量越高越差（定性） 偏差（与高镍 ncm 相当或更差，定性） 循环寿命 长（定性） 中 中，日历老化偏快（定性） 能量密度 中低 中~高 高 bms 策略侧重 满充锚定、均衡靠容量法、平台段降精度承诺 热事件监测灵敏度、充电截止管理 同 ncm + 更保守的日历老化模型 表中定性判断为工程共识级；具体温度与数值随电芯设计差异很大，引用须回到具体电芯规格书（建模框架依据 s-16，lfp 电量计实践依据 s-34）。 手算实例：平台期\"电压 → soc\"翻译能力（核心案例，教学示意值） 设 afe（模拟前端芯片）单体电压采样误差 ±2 mv，看它能翻译成多少 soc 误差： ncm 中段：docv/dsoc ≈ 5 mv/%（示意，呼应 alg-01 的 p-14 待核对）→ soc 误差 ≈ 2 ÷ 5 = 0.4% ，可用； lfp 平台段：docv/dsoc ≈ 0.5 mv/%（示意）→ 名义误差 4%，且平台内近乎平坦 + 滞回（充放电 ocv 不重合，差值可达数十 mv 量级，示意）→ 翻译失效 。 同一套 bms、同一个 afe，化学体系一换，\"电压法校正\"从主锚点变废棋——这就是 lfp 车改用\"满充端点锚定 + 周期充满\"的根源（工程实践观点，官方手册来源待核对 → p-15）。这也是 alg-02 （ekf）在 lfp 上吃力的源头。 3. 工程实态 lfp 车 ：仪表 soc 在平台段\"横盘\"、满充后跳变是正常现象；用户手册常建议定期充满（p-15）；均衡多按容量/库仑差而非电压差（平台期压差不反映 soc 差）。 ncm/nca 车 ：soc 中段即可用电压校正；热事件监测（温升率、压降异常）设计更敏感；高镍系充电上限电压管理更严格。 同平台的\"磷酸铁锂版/三元版\"通常共用硬件、维护两套标定与策略参数（ dev-05 标定矩阵按体系分开）。 硬件连锁效应：同容量包，lfp 单体电压低（≈3.2 v）→ 串数更多 → 采样通道数、采样线束与均衡通道数相应增加（定性）——化学体系差异在硬件选型阶段就传导进 bms。 4. 常见误区 \"lfp 安全，bms 可以省功能\"——热失控风险低不等于 soc/均衡难题消失，lfp 的难点换了位置而不是消失。 把 nca 参数并入 ncm 一套——日历老化与热稳定性差异会让 soh/安全阈值错位（定性）。 用静态 ocv 表处理滞回——平台段充放电曲线不重合，单纯查表会在充→放切换后系统性偏移（滞回建模见 alg-10 ）。 \"电压越高越危险\"的线性思维——安全边界是温度 + 电压 + 内阻的联合域，不是单电压红线。 \"循环寿命长 = 不用管 soh\"——lfp 的日历老化与容量\"台阶\"现象（容量恢复/跳变，机理待文献入库）同样需要 soh 跟踪（ alg-05 ）。 5. 自测 q1 ：若 afe 误差改善到 ±1 mv，lfp 平台段电压法就能用了吗？为什么？ q2 ：lfp 均衡为什么\"看容量不看电压\"？用一个数字例子说明。 q3 ：高镍 ncm/nca 的热策略相比中低镍应向哪个方向收紧？给两个可操作例子。 答案 q1：名义误差降到 2%（示意），仍远差于 ncm 的 0.4%，且滞回未解决——\"能读\"但\"不可信\"，策略上仍应放弃平台段锚定。 q2（示例）：平台段两颗电芯电压几乎相同（差 2 mv，示意），但安时积分显示一颗已充入 3 ah、另一颗 2.5 ah（示意）——电压差 ≈ 0 而容量差 0.5 ah；按电压均衡会漏判，按容量/库仑差才能均衡。 q3（示例）：①热事件监测的温升率触发阈值下调、监测频率提高；②长期满电停放的管理（高 soc + 日历老化叠加），充电策略引导避免满电久停。（方向性示例，具体数值按电芯规格与整车策略定） 来源 s-16：g. plett《battery management systems》vol. i/ii（ocv 形状、滞回与建模框架） s-34：ti slua364 / slyt402（impedance track 及 lfp 平台期的量产电量计处理，厂商官方文档） p-14：lfp/ncm 平台段 docv/dsoc 典型数值（待文献核对） p-15：\"lfp 车型建议定期满充\"的官方手册来源（待核对） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 ti slyt402（s-34） lfp 对电量计的特殊处理，与第 2 节直接对应 plett vol. i（s-16） ocv 与等效电路的系统教材 [待补链] 三体系参数横向对比的可追溯综述 待雷达捕获公开对比数据后入库 待核对项 docv/dsoc 的文献典型值（对应已有 p-14）与滞回幅度（\"数十 mv 量级\"为示意）。 lfp/ncm/nca 热失控触发温度的公开可比数据（本课只给定性）。 \"定期满充\"建议的官方用户手册实例（对应已有 p-15）。 "}, {"id": "CHM-02", "title": "课程 CHM-02：钠离子电池 BMS 适配", "dom": "CHM", "verified": false, "html": "<blockquote><p>对应节点 <code>CHM-02<\/code>（../domains/11-化学体系.md <span class=\"fileref\">（项目文件 ../domains/11-化学体系.md）<\/span>）｜ 前置：<code>CHM-01<\/code> ｜ 预计用时 40 min 证据状态更新（2026-11-10）：S-24 已完整核实（<strong>P-10 关闭<\/strong>）——CATL <strong>TENER Sodium<\/strong> 钠离子储能系统（2026-06-22 慕尼黑发布）：BMS 利用钠电<strong>连续斜坡电压曲线<\/strong>实现更精确 SOC 估计；钠电<strong>过充 SOC 容忍度比锂电高 20%<\/strong>（=给 BMS 额外 20% 安全运行裕度）；应用场景为<strong>储能<\/strong>（非车用）。行业标准化仍未收敛（P-57 保留）。涉及具体数值处均标注教学示意值。<\/p><\/blockquote>\n<h3>1. 为什么钠电值得单独一课<\/h3>\n<p>钠离子电池（sodium-ion battery，Na-ion）正进入量产窗口：储能与入门级电动车对成本与低温敏感，而钠资源不受锂价波动约束。产业信号：CATL 于 2026-06-22 发布 TENER Sodium（\"全球首个经实地验证的钠离子储能方案\"，S-24 已核实）——BMS 适配点已官方确认（见页首证据更新）。<\/p>\n<p>读这条信号的关键不是\"钠电有 BMS\"，而是<strong>厂商做的是\"钠电专用 BMS\"，不是\"给锂电 BMS 换参数\"<\/strong>——适配差异大到值得专用开发，这本身就是硬证据。<\/p>\n<h3>2. 机制：钠电适配差异清单（核心框架）<\/h3>\n<p>钠电正极三大路线：层状氧化物、聚阴离子、普鲁士蓝（白）类似物（行业通行分类，定性）；体系不同、电压窗口不同。BMS 适配按清单逐项核对：<\/p>\n<table><thead><tr><th>#<\/th><th>适配项<\/th><th>与锂电的差异<\/th><th>BMS 动作<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>电压窗口<\/td><td>层状氧化物标称约 3.0~3.2 V、上限约 3.8~4.0 V 级（常见值，示意，随体系差异大）<\/td><td>过压/欠压阈值、AFE 量程与告警表重标定<\/td><\/tr><tr><td>2<\/td><td>OCV-SOC 形状<\/td><td><strong>连续斜坡<\/strong>（无 LFP 式长平台），电压信息量接近三元<\/td><td>OCV 表全曲线重测；SOC 校正可全程锚定，策略简化<\/td><\/tr><tr><td>3<\/td><td>滞回<\/td><td>存在但幅度待测（定性，文献待入库）<\/td><td>不能默认零滞回，保留充放电分支处理<\/td><\/tr><tr><td>4<\/td><td>均衡<\/td><td>斜坡下压差直接反映 SOC 差 → 电压法均衡重新可用（与 LFP 相反）<\/td><td>均衡启判条件改回电压差驱动（阈值重标定）<\/td><\/tr><tr><td>5<\/td><td>低温<\/td><td>低温放电保持率为厂商主打卖点（宣称级，待核对）<\/td><td>低温放电功率 map 可放宽；<strong>低温充电仍需析钠防护<\/strong>（类比析锂，机理证据待文献入库）<\/td><\/tr><tr><td>6<\/td><td>满充定义<\/td><td>满充电压不同 + 斜坡曲线无 LFP 式\"平台末端\"参照<\/td><td>满充判定与端点校正逻辑重写<\/td><\/tr><tr><td>7<\/td><td>SOH 模式<\/td><td>老化/退役数据积累少，失效模式谱不完整<\/td><td>SOH 阈值保守化 + 收窄运行域，随数据迭代<\/td><\/tr><tr><td>8<\/td><td>热管理<\/td><td>产热/内阻温度特性与锂电不同（定性）<\/td><td>热模型参数重辨识（与 <code>THM-*<\/code> 联动）<\/td><\/tr><\/tbody><\/table>\n<h4>手算实例：斜坡曲线的\"电压 → SOC\"翻译能力（教学示意值）<\/h4>\n<p>沿用 <code>CHM-01<\/code> 的方法，设 AFE 误差 ±2 mV：<\/p>\n<ul>\n<li>钠电（层状氧化物）中段 dOCV/dSOC ≈ 4 mV/%（教学示意值）→ 电压法 SOC 名义误差 ≈ 2 ÷ 4 = <strong>0.5%<\/strong>，全程可用；<\/li>\n<li>对照 LFP 平台段（≈0.5 mV/%，示意）：0.5% vs 4% 且失效——<strong>钠电的 SOC 估计难度更接近三元而不是 LFP<\/strong>。<\/li>\n<p>这是清单第 2、4 项的定量根据：斜坡曲线是钠电 BMS 的\"红利\"，也是厂商重构 SOC/均衡策略的原因。<\/p>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li><strong>S-24 衔接（已核实）<\/strong>：CATL TENER Sodium（储能）官方确认两条 BMS 适配：①斜坡电压曲线 → SOC 估计更精确（与清单第 2 项一致）；②过充 SOC 容忍度 +20% → 安全裕度扩大（超出本清单的<strong>安全策略差异<\/strong>新证据——钠电的热失控/过充失效边界与锂电不同）。储能与车规共享的适配项是清单 1/2/4/6；差异在倍率与循环模式。<\/li>\n<li>关联动态：radar/2026-11-04.md 方向 4 已登记 CATL/Hithium 两条动态（C 级解读在 radar/leads/，未达登记 S 编号标准）。<\/li>\n<li><strong>标准化未收敛<\/strong>（域约束）：钠电专用标准体系仍在建设中（相关国标/行标编号与进度待核对，见文末），当前适配更多依赖电芯规格书 + 企业标准。<\/li>\n<li>供应链现实：不少项目走\"钠电电芯 + 现有锂电 BMS 硬件（AFE 量程内）+ 重标定软件\"路线，硬件改动集中在阈值与保护表（观点级，项目案例待入库）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>\"钠电 = 换个参数的 LFP\"——两者曲线形状根本不同（平台 vs 斜坡），SOC/均衡策略方向相反。<\/li>\n<li>锂电过压阈值直接搬用——钠电上限电压窗口不同（清单第 1 项），搬用会长期过充或浪费性能。<\/li>\n<li>\"斜坡 = 没有滞回\"——滞回仍存在（幅度待测），OCV 表必须分充放电支路。<\/li>\n<li>\"低温好 = 低温随便充\"——低温放电是红利，低温充电的析钠（类比析锂）防护不能省（机理证据待入库）。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：把一辆 LFP 车 BMS 改配钠电（层状氧化物），按差异清单列出必须重做的 4 项工作。 <strong>Q2<\/strong>：若某聚阴离子路线钠电中段斜率只有 2 mV/%（示意），电压法 SOC 名义误差多大？策略上怎么处理？ <strong>Q3<\/strong>：为什么说 S-24 是\"适配差异存在\"的证据，而不只是\"钠电有 BMS\"的新闻？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1（示例）：①过压/欠压与告警阈值表按钠电窗口重写；②OCV-SOC 表全曲线重测（含充放电分支）；③均衡启判从容量法改回电压差法；④满充判定与端点校正逻辑重写；⑤低温放电 map 放宽 + 低温充电析钠防护标定（任答 4 项）。<\/li>\n<li>Q2：2 ÷ 2 = 1%（AFE ±2 mV 时），比 0.5% 差但仍远好于 LFP 平台段；可继续用电压法，但加密 OCV 标定点并做滞回分支处理。<\/li>\n<li>Q3：若钠电只是\"换参数\"，厂商不会开发<strong>专用<\/strong> BMS 并以\"现场验证\"为卖点；专用 BMS 的存在说明电压窗口/曲线/策略差异已超出纯标定可覆盖的范围（P-10 核对细节后可进一步坐实）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-24：CATL 官网新闻：TENER Sodium（2026-06-22 慕尼黑；2026-11-10 完整核实，P-10 关闭）<\/li>\n<li>S-16：Plett《Battery Management Systems》Vol. I（OCV/滞回建模的通用方法论，跨体系适用）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-10 已核实一手链接）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.catl.com/en/news/6861.html\" target=\"_blank\" rel=\"noopener\">CATL：TENER Sodium 发布新闻（一手）<\/a><\/td><td>B<\/td><td>✅<\/td><td>本课核心证据（S-24）：斜坡电压 SOC 适配 + 过充容忍 +20%<\/td><\/tr><tr><td>Plett Vol. I（S-16）<\/td><td>B<\/td><td>—<\/td><td>OCV 建模通用方法<\/td><\/tr><tr><td>[待补链] 钠电正极三路线对比的权威综述<\/td><td>—<\/td><td>—<\/td><td>待雷达捕获可追溯文献后入库<\/td><\/tr><tr><td>[待补链] 钠电专用标准（国标/行标）原文<\/td><td>—<\/td><td>—<\/td><td>标准化进展核对后回填（P-57）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>~~S-24 新闻稿细节~~ → <strong>2026-11-10 已核实<\/strong>（P-10 关闭）。<\/li>\n<li>各正极路线的电压窗口与标称电压典型值（本课用示意值）。<\/li>\n<li>钠电 OCV 滞回幅度的文献数据。<\/li>\n<li>钠电低温充电析钠的机理与防护阈值文献证据。<\/li>\n<li>钠电池相关标准（GB/T 或行标）的编号与制定进度（P-57）。<\/li>\n<\/ul>", "text": " 对应节点 chm-02 （../domains/11-化学体系.md （项目文件 ../domains/11-化学体系.md） ）｜ 前置： chm-01 ｜ 预计用时 40 min 证据状态更新（2026-11-10）：s-24 已完整核实（ p-10 关闭 ）——catl tener sodium 钠离子储能系统（2026-06-22 慕尼黑发布）：bms 利用钠电 连续斜坡电压曲线 实现更精确 soc 估计；钠电 过充 soc 容忍度比锂电高 20% （=给 bms 额外 20% 安全运行裕度）；应用场景为 储能 （非车用）。行业标准化仍未收敛（p-57 保留）。涉及具体数值处均标注教学示意值。 1. 为什么钠电值得单独一课 钠离子电池（sodium-ion battery，na-ion）正进入量产窗口：储能与入门级电动车对成本与低温敏感，而钠资源不受锂价波动约束。产业信号：catl 于 2026-06-22 发布 tener sodium（\"全球首个经实地验证的钠离子储能方案\"，s-24 已核实）——bms 适配点已官方确认（见页首证据更新）。 读这条信号的关键不是\"钠电有 bms\"，而是 厂商做的是\"钠电专用 bms\"，不是\"给锂电 bms 换参数\" ——适配差异大到值得专用开发，这本身就是硬证据。 2. 机制：钠电适配差异清单（核心框架） 钠电正极三大路线：层状氧化物、聚阴离子、普鲁士蓝（白）类似物（行业通行分类，定性）；体系不同、电压窗口不同。bms 适配按清单逐项核对： # 适配项 与锂电的差异 bms 动作 1 电压窗口 层状氧化物标称约 3.0~3.2 v、上限约 3.8~4.0 v 级（常见值，示意，随体系差异大） 过压/欠压阈值、afe 量程与告警表重标定 2 ocv-soc 形状 连续斜坡 （无 lfp 式长平台），电压信息量接近三元 ocv 表全曲线重测；soc 校正可全程锚定，策略简化 3 滞回 存在但幅度待测（定性，文献待入库） 不能默认零滞回，保留充放电分支处理 4 均衡 斜坡下压差直接反映 soc 差 → 电压法均衡重新可用（与 lfp 相反） 均衡启判条件改回电压差驱动（阈值重标定） 5 低温 低温放电保持率为厂商主打卖点（宣称级，待核对） 低温放电功率 map 可放宽； 低温充电仍需析钠防护 （类比析锂，机理证据待文献入库） 6 满充定义 满充电压不同 + 斜坡曲线无 lfp 式\"平台末端\"参照 满充判定与端点校正逻辑重写 7 soh 模式 老化/退役数据积累少，失效模式谱不完整 soh 阈值保守化 + 收窄运行域，随数据迭代 8 热管理 产热/内阻温度特性与锂电不同（定性） 热模型参数重辨识（与 thm-* 联动） 手算实例：斜坡曲线的\"电压 → soc\"翻译能力（教学示意值） 沿用 chm-01 的方法，设 afe 误差 ±2 mv： 钠电（层状氧化物）中段 docv/dsoc ≈ 4 mv/%（教学示意值）→ 电压法 soc 名义误差 ≈ 2 ÷ 4 = 0.5% ，全程可用； 对照 lfp 平台段（≈0.5 mv/%，示意）：0.5% vs 4% 且失效—— 钠电的 soc 估计难度更接近三元而不是 lfp 。 这是清单第 2、4 项的定量根据：斜坡曲线是钠电 bms 的\"红利\"，也是厂商重构 soc/均衡策略的原因。 3. 工程实态 s-24 衔接（已核实） ：catl tener sodium（储能）官方确认两条 bms 适配：①斜坡电压曲线 → soc 估计更精确（与清单第 2 项一致）；②过充 soc 容忍度 +20% → 安全裕度扩大（超出本清单的 安全策略差异 新证据——钠电的热失控/过充失效边界与锂电不同）。储能与车规共享的适配项是清单 1/2/4/6；差异在倍率与循环模式。 关联动态：radar/2026-11-04.md 方向 4 已登记 catl/hithium 两条动态（c 级解读在 radar/leads/，未达登记 s 编号标准）。 标准化未收敛 （域约束）：钠电专用标准体系仍在建设中（相关国标/行标编号与进度待核对，见文末），当前适配更多依赖电芯规格书 + 企业标准。 供应链现实：不少项目走\"钠电电芯 + 现有锂电 bms 硬件（afe 量程内）+ 重标定软件\"路线，硬件改动集中在阈值与保护表（观点级，项目案例待入库）。 4. 常见误区 \"钠电 = 换个参数的 lfp\"——两者曲线形状根本不同（平台 vs 斜坡），soc/均衡策略方向相反。 锂电过压阈值直接搬用——钠电上限电压窗口不同（清单第 1 项），搬用会长期过充或浪费性能。 \"斜坡 = 没有滞回\"——滞回仍存在（幅度待测），ocv 表必须分充放电支路。 \"低温好 = 低温随便充\"——低温放电是红利，低温充电的析钠（类比析锂）防护不能省（机理证据待入库）。 5. 自测 q1 ：把一辆 lfp 车 bms 改配钠电（层状氧化物），按差异清单列出必须重做的 4 项工作。 q2 ：若某聚阴离子路线钠电中段斜率只有 2 mv/%（示意），电压法 soc 名义误差多大？策略上怎么处理？ q3 ：为什么说 s-24 是\"适配差异存在\"的证据，而不只是\"钠电有 bms\"的新闻？ 答案 q1（示例）：①过压/欠压与告警阈值表按钠电窗口重写；②ocv-soc 表全曲线重测（含充放电分支）；③均衡启判从容量法改回电压差法；④满充判定与端点校正逻辑重写；⑤低温放电 map 放宽 + 低温充电析钠防护标定（任答 4 项）。 q2：2 ÷ 2 = 1%（afe ±2 mv 时），比 0.5% 差但仍远好于 lfp 平台段；可继续用电压法，但加密 ocv 标定点并做滞回分支处理。 q3：若钠电只是\"换参数\"，厂商不会开发 专用 bms 并以\"现场验证\"为卖点；专用 bms 的存在说明电压窗口/曲线/策略差异已超出纯标定可覆盖的范围（p-10 核对细节后可进一步坐实）。 来源 s-24：catl 官网新闻：tener sodium（2026-06-22 慕尼黑；2026-11-10 完整核实，p-10 关闭） s-16：plett《battery management systems》vol. i（ocv/滞回建模的通用方法论，跨体系适用） 延伸资源（2026-11-10 已核实一手链接） 资源 级别 免费 说明 catl：tener sodium 发布新闻（一手） b ✅ 本课核心证据（s-24）：斜坡电压 soc 适配 + 过充容忍 +20% plett vol. i（s-16） b — ocv 建模通用方法 [待补链] 钠电正极三路线对比的权威综述 — — 待雷达捕获可追溯文献后入库 [待补链] 钠电专用标准（国标/行标）原文 — — 标准化进展核对后回填（p-57） 待核对项 ~~s-24 新闻稿细节~~ → 2026-11-10 已核实 （p-10 关闭）。 各正极路线的电压窗口与标称电压典型值（本课用示意值）。 钠电 ocv 滞回幅度的文献数据。 钠电低温充电析钠的机理与防护阈值文献证据。 钠电池相关标准（gb/t 或行标）的编号与制定进度（p-57）。 "}, {"id": "CHM-03", "title": "课程 CHM-03：固态/半固态电池 BMS 适配", "dom": "CHM", "verified": false, "html": "<blockquote><p>对应节点 <code>CHM-03<\/code>（../domains/11-化学体系.md <span class=\"fileref\">（项目文件 ../domains/11-化学体系.md）<\/span>）｜ 前置：<code>CHM-01<\/code> ｜ 预计用时 45 min 证据状态提醒：图谱中本节点标记为 <code>frontier<\/code> 且<strong>暂无 A/B 级直接来源<\/strong>（域约束 [需补约束]：现有 SOC/SOH 模型对固态的适配性未知）。本课是\"建模挑战框架\"，用于组织待补证据，具体数值全部为教学示意值。<\/p><\/blockquote>\n<h3>1. 为什么固态要提前学<\/h3>\n<p>固态电池（solid-state battery）被普遍视为下一代方向；半固态（semi-solid，仍含少量液态电解质）已在国内量产示范装车（2024 年前后的公开报道级信息，待入库来源）。对 BMS 的现实问题是：<strong>现有 SOC/SOH 模型与安全策略围绕液态电解液电芯建立，固态的界面行为不同，\"模型还能不能用\"没有现成答案<\/strong>。<\/p>\n<p>先建立挑战清单，等量产数据与文献进来时逐项回填——比空谈\"固态革命\"有用得多。<\/p>\n<h3>2. 机制：固态对模型的挑战清单（核心框架）<\/h3>\n<table><thead><tr><th>#<\/th><th>挑战<\/th><th>机理（定性）<\/th><th>对 BMS 的具体冲击<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>界面阻抗大且随状态漂移<\/td><td>固-固界面接触随温度/压力/循环变化<\/td><td>等效电路（<code>ALG-10<\/code>）参数不再是缓变查表量，可能需要在线辨识<\/td><\/tr><tr><td>2<\/td><td>压力成为新的状态量<\/td><td>固态界面需维持堆叠压力（stack pressure，定性）<\/td><td>状态向量可能要加\"压力\"维，传感与建模同步扩展<\/td><\/tr><tr><td>3<\/td><td>运行温度窗口不同<\/td><td>部分路线（如硫化物全固态）设计工作温度偏高（路线相关，待核对）<\/td><td>热管理逻辑与功率 map 重构；\"低温不可用区\"扩大<\/td><\/tr><tr><td>4<\/td><td>失效模式谱变化<\/td><td>硫化物遇水汽产生 H₂S（机理明确，定性）；枝晶/内短路早期特征与液态不同<\/td><td>热事件监测特征库重造，不能沿用液态的温升/压降阈值<\/td><\/tr><tr><td>5<\/td><td>OCV 曲线不同<\/td><td>锂金属/无石墨负极改变曲线形状<\/td><td>OCV-SOC 表、满充端点逻辑重测重写<\/td><\/tr><tr><td>6<\/td><td>老化数据真空<\/td><td>车规量产老化数据几乎没有<\/td><td>SOH 模型先保守 + 快速迭代（参考 <code>DEV-05<\/code> 老化档思路）<\/td><\/tr><tr><td>7<\/td><td>半固态过渡态<\/td><td>仍含液态电解质，行为介于两者之间<\/td><td>可部分沿用液态模型，但\"沿用多少\"需逐项验证，不能默认<\/td><\/tr><\/tbody><\/table>\n<h4>手算实例：内阻结构变化对 SOP 的影响（教学示意值）<\/h4>\n<p>设某液态电芯直流内阻 1.0 mΩ，某全固态同容量电芯 3.0 mΩ，其中固-固界面贡献 2.0 mΩ、温度敏感性是液态的 3 倍（均为示意值）：<\/p>\n<ul>\n<li>同样 200 A 放电：压降 0.2 V vs 0.6 V——<strong>3 倍<\/strong>；<\/li>\n<li>若沿用液态内阻表做 SOP 功率限值（<code>ALG-06<\/code> 思路），会系统性高估固态电芯可用功率约 3 倍量级；<\/li>\n<li>更麻烦的是界面阻抗随温度/压力漂移 → 静态查表法的误差带变宽 → 要么在线辨识，要么大幅收窄运行域。<\/li>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>路线图谱（行业通行分类，定性）：氧化物 / 硫化物 / 聚合物 / 卤化物（较新），加\"半固态\"过渡路线；各路线的 BMS 冲击权重不同（挑战清单第 3/4 项差异最大）。<\/li>\n<li>落地节奏：半固态先行示范（公开报道级，待入库），全固态车规量产仍在爬坡（观点级，随雷达更新）。<\/li>\n<li>数据策略：先小批量示范车队 + 影子模式（<code>DEV-06<\/code>）积累真实工况，再迭代模型——这是\"模型适配性未知\"下的现实路径（观点级）。<\/li>\n<li>术语提醒：全固态（无液态电解质）与半固态（凝胶态/含少量液态）常被混用——挑战清单第 1~3 项主要打全固态，半固态的冲击强度介于两者之间，适用对象要分清（定性）。<\/li>\n<li>压力监测是否进入量产 BMS 传感器清单，目前没有行业收敛答案（见待核对项）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li><strong>\"固态 = 绝对安全，BMS 可以减配\"<\/strong>——热失控机制改变不等于消失；硫化物的水汽敏感性反而带来新的监测维度（H₂S、气密性，定性）。<\/li>\n<li>\"半固态可整套沿用液态模型\"——过渡态恰恰最危险：曲线看起来眼熟，参数却在漂；必须逐项过挑战清单。<\/li>\n<li>把固态当\"只影响电芯厂\"——运行域、热管理、功率策略、监测特征全是 BMS/整车侧的工作量。<\/li>\n<li>用实验室小电芯数据直接外推车规大电芯——界面/压力效应随尺寸放大不可忽略（定性）。<\/li>\n<li>以为固态只是\"换一张 OCV 表\"——清单 7 项里至少 5 项（界面阻抗/压力/温度窗口/失效模式/老化）与 OCV 无关，适配是系统级的。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：挑战清单第 2 项（压力状态量）为什么是\"建模层\"冲击，加传感器解决不了？ <strong>Q2<\/strong>：若界面阻抗温度敏感性是液态的 5 倍（示意），工程上有哪两条出路？各自代价？ <strong>Q3<\/strong>：半固态包的 SOC 估计，哪些环节可沿用液态方法，哪些必须重新验证？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：压力影响的是模型参数本身（界面阻抗随压力变化）。加传感器只是拿到自变量，还必须把压力项写进等效电路/状态估计器（<code>ALG-02<\/code>/<code>ALG-10<\/code> 的结构扩展），否则传感器数据无法被模型利用——传感与建模要一起改。<\/li>\n<li>Q2（示例）：①在线辨识界面阻抗（代价：算力与辨识激励设计，收敛性需验证）；②大幅收窄运行域 + 保守功率限值（代价：性能与体验损失）。两条路都需示范车队数据闭环（<code>DEV-06<\/code>）支撑。<\/li>\n<li>Q3（示例）：可沿用——安时积分骨架、总压/电流采集链路、满充端点校正的流程框架；必须重验——OCV 表（曲线形状）、滞回与极化参数、内阻/功率 map、SOH 定义与老化速率假设、热事件监测特征库。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>暂无 A/B 级直接来源（域约束：界面阻抗适配性未知 = [需补约束]）；本课为挑战框架，待雷达捕获文献/报道后逐项挂来源。<\/li>\n<li>方法论间接依据：S-16（等效电路与状态估计框架——挑战清单的\"被冲击方\"）。<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>[待补链] 固态电池经典综述（如 Janek &amp; Zeier 于 Nature Energy 的固态电池综述，标题卷期页待核对）<\/td><td>机理背景，联网核实后补链接<\/td><\/tr><tr><td>[待补链] 半固态量产装车的公开报道<\/td><td>待入库为可引用来源<\/td><\/tr><tr><td>Plett Vol. I/II（S-16）<\/td><td>现有建模框架——固态适配的对照基准<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>半固态量产示范装车的可靠报道（补 S 编号入库）。<\/li>\n<li>硫化物全固态的设计工作温度窗口（路线与厂家相关）。<\/li>\n<li>固-固界面阻抗量级与温度系数的公开数据（本课用示意值演示影响路径）。<\/li>\n<li>堆叠压力是否进入量产 BMS 传感清单（行业动态跟踪）。<\/li>\n<li>硫化物 H₂S 风险对应的车规安全条款（若有标准引用，回填）。<\/li>\n<\/ul>", "text": " 对应节点 chm-03 （../domains/11-化学体系.md （项目文件 ../domains/11-化学体系.md） ）｜ 前置： chm-01 ｜ 预计用时 45 min 证据状态提醒：图谱中本节点标记为 frontier 且 暂无 a/b 级直接来源 （域约束 [需补约束]：现有 soc/soh 模型对固态的适配性未知）。本课是\"建模挑战框架\"，用于组织待补证据，具体数值全部为教学示意值。 1. 为什么固态要提前学 固态电池（solid-state battery）被普遍视为下一代方向；半固态（semi-solid，仍含少量液态电解质）已在国内量产示范装车（2024 年前后的公开报道级信息，待入库来源）。对 bms 的现实问题是： 现有 soc/soh 模型与安全策略围绕液态电解液电芯建立，固态的界面行为不同，\"模型还能不能用\"没有现成答案 。 先建立挑战清单，等量产数据与文献进来时逐项回填——比空谈\"固态革命\"有用得多。 2. 机制：固态对模型的挑战清单（核心框架） # 挑战 机理（定性） 对 bms 的具体冲击 1 界面阻抗大且随状态漂移 固-固界面接触随温度/压力/循环变化 等效电路（ alg-10 ）参数不再是缓变查表量，可能需要在线辨识 2 压力成为新的状态量 固态界面需维持堆叠压力（stack pressure，定性） 状态向量可能要加\"压力\"维，传感与建模同步扩展 3 运行温度窗口不同 部分路线（如硫化物全固态）设计工作温度偏高（路线相关，待核对） 热管理逻辑与功率 map 重构；\"低温不可用区\"扩大 4 失效模式谱变化 硫化物遇水汽产生 h₂s（机理明确，定性）；枝晶/内短路早期特征与液态不同 热事件监测特征库重造，不能沿用液态的温升/压降阈值 5 ocv 曲线不同 锂金属/无石墨负极改变曲线形状 ocv-soc 表、满充端点逻辑重测重写 6 老化数据真空 车规量产老化数据几乎没有 soh 模型先保守 + 快速迭代（参考 dev-05 老化档思路） 7 半固态过渡态 仍含液态电解质，行为介于两者之间 可部分沿用液态模型，但\"沿用多少\"需逐项验证，不能默认 手算实例：内阻结构变化对 sop 的影响（教学示意值） 设某液态电芯直流内阻 1.0 mω，某全固态同容量电芯 3.0 mω，其中固-固界面贡献 2.0 mω、温度敏感性是液态的 3 倍（均为示意值）： 同样 200 a 放电：压降 0.2 v vs 0.6 v—— 3 倍 ； 若沿用液态内阻表做 sop 功率限值（ alg-06 思路），会系统性高估固态电芯可用功率约 3 倍量级； 更麻烦的是界面阻抗随温度/压力漂移 → 静态查表法的误差带变宽 → 要么在线辨识，要么大幅收窄运行域。 3. 工程实态 路线图谱（行业通行分类，定性）：氧化物 / 硫化物 / 聚合物 / 卤化物（较新），加\"半固态\"过渡路线；各路线的 bms 冲击权重不同（挑战清单第 3/4 项差异最大）。 落地节奏：半固态先行示范（公开报道级，待入库），全固态车规量产仍在爬坡（观点级，随雷达更新）。 数据策略：先小批量示范车队 + 影子模式（ dev-06 ）积累真实工况，再迭代模型——这是\"模型适配性未知\"下的现实路径（观点级）。 术语提醒：全固态（无液态电解质）与半固态（凝胶态/含少量液态）常被混用——挑战清单第 1~3 项主要打全固态，半固态的冲击强度介于两者之间，适用对象要分清（定性）。 压力监测是否进入量产 bms 传感器清单，目前没有行业收敛答案（见待核对项）。 4. 常见误区 \"固态 = 绝对安全，bms 可以减配\" ——热失控机制改变不等于消失；硫化物的水汽敏感性反而带来新的监测维度（h₂s、气密性，定性）。 \"半固态可整套沿用液态模型\"——过渡态恰恰最危险：曲线看起来眼熟，参数却在漂；必须逐项过挑战清单。 把固态当\"只影响电芯厂\"——运行域、热管理、功率策略、监测特征全是 bms/整车侧的工作量。 用实验室小电芯数据直接外推车规大电芯——界面/压力效应随尺寸放大不可忽略（定性）。 以为固态只是\"换一张 ocv 表\"——清单 7 项里至少 5 项（界面阻抗/压力/温度窗口/失效模式/老化）与 ocv 无关，适配是系统级的。 5. 自测 q1 ：挑战清单第 2 项（压力状态量）为什么是\"建模层\"冲击，加传感器解决不了？ q2 ：若界面阻抗温度敏感性是液态的 5 倍（示意），工程上有哪两条出路？各自代价？ q3 ：半固态包的 soc 估计，哪些环节可沿用液态方法，哪些必须重新验证？ 答案 q1：压力影响的是模型参数本身（界面阻抗随压力变化）。加传感器只是拿到自变量，还必须把压力项写进等效电路/状态估计器（ alg-02 / alg-10 的结构扩展），否则传感器数据无法被模型利用——传感与建模要一起改。 q2（示例）：①在线辨识界面阻抗（代价：算力与辨识激励设计，收敛性需验证）；②大幅收窄运行域 + 保守功率限值（代价：性能与体验损失）。两条路都需示范车队数据闭环（ dev-06 ）支撑。 q3（示例）：可沿用——安时积分骨架、总压/电流采集链路、满充端点校正的流程框架；必须重验——ocv 表（曲线形状）、滞回与极化参数、内阻/功率 map、soh 定义与老化速率假设、热事件监测特征库。 来源 暂无 a/b 级直接来源（域约束：界面阻抗适配性未知 = [需补约束]）；本课为挑战框架，待雷达捕获文献/报道后逐项挂来源。 方法论间接依据：s-16（等效电路与状态估计框架——挑战清单的\"被冲击方\"）。 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 [待补链] 固态电池经典综述（如 janek &amp; zeier 于 nature energy 的固态电池综述，标题卷期页待核对） 机理背景，联网核实后补链接 [待补链] 半固态量产装车的公开报道 待入库为可引用来源 plett vol. i/ii（s-16） 现有建模框架——固态适配的对照基准 待核对项 半固态量产示范装车的可靠报道（补 s 编号入库）。 硫化物全固态的设计工作温度窗口（路线与厂家相关）。 固-固界面阻抗量级与温度系数的公开数据（本课用示意值演示影响路径）。 堆叠压力是否进入量产 bms 传感清单（行业动态跟踪）。 硫化物 h₂s 风险对应的车规安全条款（若有标准引用，回填）。 "}, {"id": "CHM-04", "title": "课程 CHM-04：梯次利用电池 BMS", "dom": "CHM", "verified": false, "html": "<blockquote><p>对应节点 <code>CHM-04<\/code>（../domains/11-化学体系.md <span class=\"fileref\">（项目文件 ../domains/11-化学体系.md）<\/span>）｜ 前置：<code>CHM-01<\/code>、<code>ALG-05<\/code>（SOH）｜ 预计用时 45 min 关联：与 <code>GEN-2<\/code>（回收/后市场）、<code>ALG-09<\/code>（云 BMS/SOH）共同构成后市场技术栈。 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>或\"惯例值（待核对）\"。<\/p><\/blockquote>\n<h3>1. 为什么梯次电池需要\"另一种 BMS\"<\/h3>\n<p>动力电池退役（行业常见以剩余容量约 70~80% 为参考退役线，惯例值待核对）后，进入储能、备电、低速车等低倍率场景二次利用（second-life，梯次利用）。它的\"人生履历\"有三条硬伤：<\/p>\n<ol>\n<li><strong>一致性差<\/strong>：不同车型、批次、工况史的电芯被重新组合；<\/li>\n<li><strong>历史数据缺失<\/strong>：原车 BMS 数据多数拿不到，经历过快充滥用、深放、高温停放与否无从得知；<\/li>\n<li><strong>老化继续且机制更复杂<\/strong>：已有析锂/微短路痕迹的电池，衰减路径与新品不同。<\/li>\n<p>新电池 BMS 的隐含假设——\"同批一致性可控 + 出厂参数有效 + 历史干净\"——全部失效，这就是专用 BMS 存在的理由。<\/p>\n<\/ol>\n<h3>2. 机制：四个重构<\/h3>\n<ol>\n<li><strong>SOH 基准重定义<\/strong>：新电池 SOH = 当前满容量 ÷ 出厂额定容量。梯次电池若沿用原厂额定值，SOH 永远\"不及格\"，依赖 SOH 的降额/告警逻辑全错。工程做法：<strong>以入厂检测容量（或重组目标容量）为新基准定义\"梯次 SOH\"<\/strong>，另把\"相对原厂的退化率\"作为独立记录量。<\/li>\n<li><strong>分选与重组<\/strong>：按容量/内阻/自放电率分选（screening）后组串——BMS 面对的\"初始一致性\"是分选工艺给的，不是电芯给的。<\/li>\n<li><strong>上电自诊断 + 初期特征化<\/strong>：历史缺失 → 首次满充/静置做 OCV 校正（<code>ALG-01<\/code>）、小电流工况辨识内阻（<code>ALG-10<\/code>），把\"未知履历\"转成\"可测现状\"。<\/li>\n<li><strong>阈值收紧<\/strong>：对可能含析锂/内短路隐患的电池，充电倍率、温度窗口、压差告警整体保守化。<\/li>\n<\/ol>\n<h4>手算实例：梯次 SOH 基准重定义（核心案例，教学示意值）<\/h4>\n<p>一批退役 LFP 模组，原厂额定 100 Ah，入厂实测可用容量 72 Ah：<\/p>\n<ul>\n<li><strong>沿用原基准<\/strong>：SOH = 72% → 按新车逻辑持续告警/降额——逻辑前提错了；<\/li>\n<li><strong>重组后<\/strong>：以 72 Ah 为新基准 → 梯次 SOH = 100%；运行在 0.3C 低倍率（示意，梯次常用），SOP/告警按新基准重标定；另立\"相对原厂退化率 28%\"作寿命预期输入；<\/li>\n<li><strong>串联一致性<\/strong>：10 组串联，最弱一组实测 68 Ah（离散 -5.6%）→ 系统可用容量受最弱环节限制，系统梯次 SOH 基准应取 68 Ah（= 68 ÷ 72 ≈ 94.4% 新基准），而不是均值 100%；<\/li>\n<li><strong>均衡账<\/strong>：最强/最弱差 4 Ah，按 2 A 均衡电流需 4 ÷ 2 = <strong>2 h<\/strong> 量级——均衡电流配置要按实际离散度算，不能沿用新车假设。<\/li>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>标准侧：车用动力电池回收利用有国标系列（GB/T 34015《车用动力电池回收利用》系列，含余能检测等；具体部分号与年份待核对），梯次企业普遍要求溯源（电池编码/白名单，观点级）。<\/li>\n<li>储能 BMS 形态参照：LG Energy Solution 的 ESS BMS 产品线（B.once/B.around 等，S-20；产品现状待核对 → P-03）——低倍率、长时序、云联动，与梯次场景高度重叠。<\/li>\n<li>云平台角色吃重：梯次电站的 SOH 跟踪、一致性/安全预警高度依赖云 BMS（<code>ALG-09<\/code>），站级数据比单包更能暴露系统性离散。<\/li>\n<li>经济性现实：分选/重组/检测成本决定梯次是否划算；BMS\"能测多准\"直接影响可接受离散度与收益（观点级）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>\"SOH &lt; 80% = 报废\"——80% 是动力场景的常见退役参考线（惯例，待核对），不是梯次报废线；梯次的报废判据按梯次工况重新定义。<\/li>\n<li>车用 BMS 参数整体平移——倍率、温度窗口、告警阈值、SOH 基准都要重构（本课四个重构）。<\/li>\n<li>\"入厂检测一次就够了\"——梯次电池衰减快且离散，特征化必须周期性重复。<\/li>\n<li>忽视安全阈值收紧的必要性——\"能用\"和\"敢用\"之间隔着一层履历未知带来的保守裕度。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：手算实例改为\"容量中位数 72 Ah、最弱 60 Ah\"的批次（示意），系统基准与均衡账怎么变？这批货该不该接？ <strong>Q2<\/strong>：为什么\"相对原厂退化率\"要与\"梯次 SOH\"分开记录？ <strong>Q3<\/strong>：梯次电芯首次上电后，设计一个最小特征化流程（至少 4 步）。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：系统基准取最弱 60 Ah（= 60 ÷ 72 ≈ 83.3% 新基准）；最大容量差 12 Ah、按 2 A 均衡需 6 h 量级——离散度恶化使均衡耗时大增，通常说明分选不合格或履历太杂，商业上应拒收/降级重组（工程权衡的示例结论）。<\/li>\n<li>Q2：两者回答不同问题——梯次 SOH 回答\"系统现在的健康度\"（运行决策用）；相对原厂退化率回答\"距离寿命终点还有多远\"（残值与更换计划用）。混在一个数里，运行告警与资产管理会互相干扰。<\/li>\n<li>Q3（示例）：①静置至极化弛豫 → OCV 初校正；②小电流充放一圈 → 容量标定（新基准）；③脉冲工况 → 内阻/RC 辨识；④静置监测自放电率（压降/容量滑落）；⑤结果写档案并分级（可用/降额/剔除）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-20：LG Energy Solution ESS BMS 官方资料（B.once/B.around 等；产品现状待核对 → P-03）<\/li>\n<li>S-28：K. Yang et al. SOH 综述（<em>Batteries<\/em> 2023；SOH 方法可迁移至梯次场景）<\/li>\n<li>S-16：Plett《Battery Management Systems》Vol. I/II（容量/参数辨识方法论）<\/li>\n<li>GB/T 34015《车用动力电池回收利用》系列——标准编号直引（具体部分号与年份待核对，未登记 S 编号）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 34015 系列原文<\/td><td>回收利用/余能检测的标准依据（部分号待核对）<\/td><\/tr><tr><td>[待补链] 梯次利用储能系统的公开综述或白皮书<\/td><td>待雷达捕获可追溯来源<\/td><\/tr><tr><td>Plett Vol. II（S-16）<\/td><td>容量估计方法（梯次特征化的算法基础）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>\"70~80% 退役线\"的行业惯例出处（是否有标准/白皮书明确）。<\/li>\n<li>GB/T 34015 系列的具体部分号、名称与年份。<\/li>\n<li>梯次场景典型运行倍率（0.3C 为示意值）与均衡电流配置的行业数据。<\/li>\n<li>S-20 产品线现状（对应已有 P-03）。<\/li>\n<\/ul>", "text": " 对应节点 chm-04 （../domains/11-化学体系.md （项目文件 ../domains/11-化学体系.md） ）｜ 前置： chm-01 、 alg-05 （soh）｜ 预计用时 45 min 关联：与 gen-2 （回收/后市场）、 alg-09 （云 bms/soh）共同构成后市场技术栈。 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 或\"惯例值（待核对）\"。 1. 为什么梯次电池需要\"另一种 bms\" 动力电池退役（行业常见以剩余容量约 70~80% 为参考退役线，惯例值待核对）后，进入储能、备电、低速车等低倍率场景二次利用（second-life，梯次利用）。它的\"人生履历\"有三条硬伤： 一致性差 ：不同车型、批次、工况史的电芯被重新组合； 历史数据缺失 ：原车 bms 数据多数拿不到，经历过快充滥用、深放、高温停放与否无从得知； 老化继续且机制更复杂 ：已有析锂/微短路痕迹的电池，衰减路径与新品不同。 新电池 bms 的隐含假设——\"同批一致性可控 + 出厂参数有效 + 历史干净\"——全部失效，这就是专用 bms 存在的理由。 2. 机制：四个重构 soh 基准重定义 ：新电池 soh = 当前满容量 ÷ 出厂额定容量。梯次电池若沿用原厂额定值，soh 永远\"不及格\"，依赖 soh 的降额/告警逻辑全错。工程做法： 以入厂检测容量（或重组目标容量）为新基准定义\"梯次 soh\" ，另把\"相对原厂的退化率\"作为独立记录量。 分选与重组 ：按容量/内阻/自放电率分选（screening）后组串——bms 面对的\"初始一致性\"是分选工艺给的，不是电芯给的。 上电自诊断 + 初期特征化 ：历史缺失 → 首次满充/静置做 ocv 校正（ alg-01 ）、小电流工况辨识内阻（ alg-10 ），把\"未知履历\"转成\"可测现状\"。 阈值收紧 ：对可能含析锂/内短路隐患的电池，充电倍率、温度窗口、压差告警整体保守化。 手算实例：梯次 soh 基准重定义（核心案例，教学示意值） 一批退役 lfp 模组，原厂额定 100 ah，入厂实测可用容量 72 ah： 沿用原基准 ：soh = 72% → 按新车逻辑持续告警/降额——逻辑前提错了； 重组后 ：以 72 ah 为新基准 → 梯次 soh = 100%；运行在 0.3c 低倍率（示意，梯次常用），sop/告警按新基准重标定；另立\"相对原厂退化率 28%\"作寿命预期输入； 串联一致性 ：10 组串联，最弱一组实测 68 ah（离散 -5.6%）→ 系统可用容量受最弱环节限制，系统梯次 soh 基准应取 68 ah（= 68 ÷ 72 ≈ 94.4% 新基准），而不是均值 100%； 均衡账 ：最强/最弱差 4 ah，按 2 a 均衡电流需 4 ÷ 2 = 2 h 量级——均衡电流配置要按实际离散度算，不能沿用新车假设。 3. 工程实态 标准侧：车用动力电池回收利用有国标系列（gb/t 34015《车用动力电池回收利用》系列，含余能检测等；具体部分号与年份待核对），梯次企业普遍要求溯源（电池编码/白名单，观点级）。 储能 bms 形态参照：lg energy solution 的 ess bms 产品线（b.once/b.around 等，s-20；产品现状待核对 → p-03）——低倍率、长时序、云联动，与梯次场景高度重叠。 云平台角色吃重：梯次电站的 soh 跟踪、一致性/安全预警高度依赖云 bms（ alg-09 ），站级数据比单包更能暴露系统性离散。 经济性现实：分选/重组/检测成本决定梯次是否划算；bms\"能测多准\"直接影响可接受离散度与收益（观点级）。 4. 常见误区 \"soh &lt; 80% = 报废\"——80% 是动力场景的常见退役参考线（惯例，待核对），不是梯次报废线；梯次的报废判据按梯次工况重新定义。 车用 bms 参数整体平移——倍率、温度窗口、告警阈值、soh 基准都要重构（本课四个重构）。 \"入厂检测一次就够了\"——梯次电池衰减快且离散，特征化必须周期性重复。 忽视安全阈值收紧的必要性——\"能用\"和\"敢用\"之间隔着一层履历未知带来的保守裕度。 5. 自测 q1 ：手算实例改为\"容量中位数 72 ah、最弱 60 ah\"的批次（示意），系统基准与均衡账怎么变？这批货该不该接？ q2 ：为什么\"相对原厂退化率\"要与\"梯次 soh\"分开记录？ q3 ：梯次电芯首次上电后，设计一个最小特征化流程（至少 4 步）。 答案 q1：系统基准取最弱 60 ah（= 60 ÷ 72 ≈ 83.3% 新基准）；最大容量差 12 ah、按 2 a 均衡需 6 h 量级——离散度恶化使均衡耗时大增，通常说明分选不合格或履历太杂，商业上应拒收/降级重组（工程权衡的示例结论）。 q2：两者回答不同问题——梯次 soh 回答\"系统现在的健康度\"（运行决策用）；相对原厂退化率回答\"距离寿命终点还有多远\"（残值与更换计划用）。混在一个数里，运行告警与资产管理会互相干扰。 q3（示例）：①静置至极化弛豫 → ocv 初校正；②小电流充放一圈 → 容量标定（新基准）；③脉冲工况 → 内阻/rc 辨识；④静置监测自放电率（压降/容量滑落）；⑤结果写档案并分级（可用/降额/剔除）。 来源 s-20：lg energy solution ess bms 官方资料（b.once/b.around 等；产品现状待核对 → p-03） s-28：k. yang et al. soh 综述（ batteries 2023；soh 方法可迁移至梯次场景） s-16：plett《battery management systems》vol. i/ii（容量/参数辨识方法论） gb/t 34015《车用动力电池回收利用》系列——标准编号直引（具体部分号与年份待核对，未登记 s 编号） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 gb/t 34015 系列原文 回收利用/余能检测的标准依据（部分号待核对） [待补链] 梯次利用储能系统的公开综述或白皮书 待雷达捕获可追溯来源 plett vol. ii（s-16） 容量估计方法（梯次特征化的算法基础） 待核对项 \"70~80% 退役线\"的行业惯例出处（是否有标准/白皮书明确）。 gb/t 34015 系列的具体部分号、名称与年份。 梯次场景典型运行倍率（0.3c 为示意值）与均衡电流配置的行业数据。 s-20 产品线现状（对应已有 p-03）。 "}, {"id": "DEV-01", "title": "课程 DEV-01：V 模型开发流程——需求到测试的对应关系", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-01<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：无 ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要 V 模型<\/h3>\n<p>BMS 是安全相关系统：误切断高压有车辆失控风险，漏保护有热失控风险。ISO 26262:2018（S-07）把开发组织成一条<strong>双向可追溯<\/strong>的链：左臂逐层分解需求，右臂逐层集成验证，每一层都能回答\"这个测试验证哪条需求、这条需求被哪些测试覆盖\"。<\/p>\n<p>没有这条链的团队，会反复踩三个坑：<\/p>\n<ol>\n<li>改了一个保护阈值，忘了同步改测试用例与标定文档，问题在路试才炸出来；<\/li>\n<li>需求写了\"及时切断\"，没人说清\"及时\"是 100 ms 还是 5 s，测试无从判定；<\/li>\n<li>法规试验（<code>DEV-04<\/code>）前才发现某个保护功能从未被集成测试过。<\/li>\n<\/ol>\n<h3>2. 机制：V 的左右两臂（框架依据 S-07）<\/h3>\n<p>``<code> 车辆需求 ──→ 系统需求/架构 ──→ 软/硬件设计 ──→ 单元实现 │               │                │              │ 验收测试 ←── 系统集成测试 ←── 集成测试 ←──── 单元测试 <\/code>``<\/p>\n<ul>\n<li><strong>左臂<\/strong>：需求分解 + 架构设计。每层输出\"下一层的输入\"，同时输出\"对本层的验证准则\"。<\/li>\n<li><strong>右臂<\/strong>：集成与验证，顺序与左臂相反（单元 → 集成 → 系统 → 验收）。<\/li>\n<li><strong>双向追溯<\/strong>（bidirectional traceability）：需求 ↔ 设计 ↔ 代码 ↔ 测试用例；任何变更做<strong>影响分析<\/strong>（impact analysis）。<\/li>\n<\/ul>\n<h4>手算实例 1：安全需求的时间预算分解<\/h4>\n<p>需求 REQ-SYS-012（编号示意）：\"电芯电压 &gt; 4.25 V（教学示意值）持续时，BMS 应在 500 ms（教学示意值）内请求停止充电。\"<\/p>\n<p>把 500 ms 分配到架构（全部教学示意值）：<\/p>\n<table><thead><tr><th>环节<\/th><th>预算<\/th><\/tr><\/thead><tbody><tr><td>AFE 采样周期<\/td><td>100 ms<\/td><\/tr><tr><td>滤波/防抖（连续 3 次超限）<\/td><td>200 ms<\/td><\/tr><tr><td>判断与通信<\/td><td>10 ms<\/td><\/tr><tr><td>继电器动作<\/td><td>50 ms<\/td><\/tr><tr><td>余量<\/td><td>140 ms<\/td><\/tr><tr><td><strong>合计<\/strong><\/td><td><strong>500 ms<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>每个子预算变成下层需求与下层测试的判据——这就是\"需求可测化\"。<\/p>\n<h4>手算实例 2：V 模型左右对应表<\/h4>\n<table><thead><tr><th>左臂产出<\/th><th>右臂对应验证<\/th><th>暴露的典型错误<\/th><\/tr><\/thead><tbody><tr><td>系统需求（含安全需求）<\/td><td>整车/台架验收（含法规试验，<code>DEV-04<\/code>）<\/td><td>需求错漏、场景缺失<\/td><\/tr><tr><td>系统架构（采样/控制/执行链路）<\/td><td>系统集成测试（<code>DEV-03<\/code> HIL）<\/td><td>接口/时序不匹配<\/td><\/tr><tr><td>软件架构与详细设计<\/td><td>集成测试<\/td><td>模块间资源冲突<\/td><\/tr><tr><td>单元（函数/任务）<\/td><td>单元测试（覆盖率见 <code>DEV-02<\/code>）<\/td><td>逻辑边界错误<\/td><\/tr><\/tbody><\/table>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>流程框架普遍参考 <strong>ISO 26262<\/strong>（S-07）与 <strong>Automotive SPICE<\/strong>（ASPICE，汽车行业过程评估模型）；国内团标 S-19 提供设计规范层面的落地要求。<\/li>\n<li>追溯矩阵用需求管理工具维护（DOORS、Polarion 一类，行业通用工具，仅点名）；追溯矩阵是审核（audit）的第一检查物。<\/li>\n<li>变更不是禁区：需求变更 → 影响分析 → 追溯链上所有受影响项（设计、代码、测试、标定）重开；量产阶段的变更评审更重。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li><strong>\"V 模型 = 瀑布模型\"<\/strong>——V 强调对应与追溯，不要求左臂全部冻结才开右臂；迭代开发同样必须维护追溯。<\/li>\n<li><strong>\"测试是右臂的事\"<\/strong>——右臂测什么由左臂的验证准则决定；需求不可测，右臂必漏测。<\/li>\n<li>追溯矩阵只为应付审核——它的真价值是变更时自动圈出受影响范围；事后补的追溯链在变更时会大面积失效。<\/li>\n<li>把\"演示功能可用\"当\"验证通过\"——没有预定义判据的演示不属于验证（对 S-07 验证定义的转述，原文表述待核对）。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：手算实例 1 中，防抖从\"连续 3 次\"改成\"连续 5 次\"（采样周期 100 ms 不变），时间预算要怎么调？ <strong>Q2<\/strong>：为什么\"需求可测化\"是 V 模型左臂的硬要求？ <strong>Q3<\/strong>：软件工程师把过压阈值从 4.25 V 改成 4.22 V，按 V 流程应触发哪些动作？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：防抖 5 次占 400 ms，只剩 90 ms 给采样/判断/执行，预算表必须重排（或提高采样频率），否则 500 ms 总预算失守——防抖次数是左右臂联动的典型参数。<\/li>\n<li>Q2：右臂每个测试的判据来自左臂需求；不可测的需求产不出判据，该需求的验证悬空，追溯链在此断裂。<\/li>\n<li>Q3：发起变更单 → 影响分析（涉及该阈值的设计文档、代码、单元/集成/系统测试用例、标定条目、FMEA 等安全分析）→ 全链更新并重跑受影响测试 → 评审关闭。只改代码不改用例就是追溯链断裂。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018《道路车辆 功能安全》（V 流程、追溯与验证框架；分部分条款细节待逐条核对）<\/li>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》（BMS 产品级要求）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（编号年份待核对 → P-01）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 第 2/3/4/6 部分<\/td><td>V 流程与管理/概念/系统/软件层的原始出处（原文付费）<\/td><\/tr><tr><td>Automotive SPICE（VDA 过程评估模型）<\/td><td>行业普遍采用的过程评估框架 [待补链]<\/td><\/tr><tr><td>V-Modell XT（德国官方项目管理方法）<\/td><td>V 模型的公共部门版本 [待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>ISO 26262 各部分对\"验证（verification）/确认（validation）\"的定义原文（本课为转述）。<\/li>\n<li>ASPICE 过程组与左右臂的精确对应关系。<\/li>\n<li>\"量产 BMS 团队普遍采用 ISO 26262 + ASPICE 框架\"为观点级概括，未做行业统计。<\/li>\n<\/ul>", "text": " 对应节点 dev-01 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置：无 ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要 v 模型 bms 是安全相关系统：误切断高压有车辆失控风险，漏保护有热失控风险。iso 26262:2018（s-07）把开发组织成一条 双向可追溯 的链：左臂逐层分解需求，右臂逐层集成验证，每一层都能回答\"这个测试验证哪条需求、这条需求被哪些测试覆盖\"。 没有这条链的团队，会反复踩三个坑： 改了一个保护阈值，忘了同步改测试用例与标定文档，问题在路试才炸出来； 需求写了\"及时切断\"，没人说清\"及时\"是 100 ms 还是 5 s，测试无从判定； 法规试验（ dev-04 ）前才发现某个保护功能从未被集成测试过。 2. 机制：v 的左右两臂（框架依据 s-07） `` 车辆需求 ──→ 系统需求/架构 ──→ 软/硬件设计 ──→ 单元实现 │ │ │ │ 验收测试 ←── 系统集成测试 ←── 集成测试 ←──── 单元测试 `` 左臂 ：需求分解 + 架构设计。每层输出\"下一层的输入\"，同时输出\"对本层的验证准则\"。 右臂 ：集成与验证，顺序与左臂相反（单元 → 集成 → 系统 → 验收）。 双向追溯 （bidirectional traceability）：需求 ↔ 设计 ↔ 代码 ↔ 测试用例；任何变更做 影响分析 （impact analysis）。 手算实例 1：安全需求的时间预算分解 需求 req-sys-012（编号示意）：\"电芯电压 &gt; 4.25 v（教学示意值）持续时，bms 应在 500 ms（教学示意值）内请求停止充电。\" 把 500 ms 分配到架构（全部教学示意值）： 环节 预算 afe 采样周期 100 ms 滤波/防抖（连续 3 次超限） 200 ms 判断与通信 10 ms 继电器动作 50 ms 余量 140 ms 合计 500 ms 每个子预算变成下层需求与下层测试的判据——这就是\"需求可测化\"。 手算实例 2：v 模型左右对应表 左臂产出 右臂对应验证 暴露的典型错误 系统需求（含安全需求） 整车/台架验收（含法规试验， dev-04 ） 需求错漏、场景缺失 系统架构（采样/控制/执行链路） 系统集成测试（ dev-03 hil） 接口/时序不匹配 软件架构与详细设计 集成测试 模块间资源冲突 单元（函数/任务） 单元测试（覆盖率见 dev-02 ） 逻辑边界错误 3. 工程实态 流程框架普遍参考 iso 26262 （s-07）与 automotive spice （aspice，汽车行业过程评估模型）；国内团标 s-19 提供设计规范层面的落地要求。 追溯矩阵用需求管理工具维护（doors、polarion 一类，行业通用工具，仅点名）；追溯矩阵是审核（audit）的第一检查物。 变更不是禁区：需求变更 → 影响分析 → 追溯链上所有受影响项（设计、代码、测试、标定）重开；量产阶段的变更评审更重。 4. 常见误区 \"v 模型 = 瀑布模型\" ——v 强调对应与追溯，不要求左臂全部冻结才开右臂；迭代开发同样必须维护追溯。 \"测试是右臂的事\" ——右臂测什么由左臂的验证准则决定；需求不可测，右臂必漏测。 追溯矩阵只为应付审核——它的真价值是变更时自动圈出受影响范围；事后补的追溯链在变更时会大面积失效。 把\"演示功能可用\"当\"验证通过\"——没有预定义判据的演示不属于验证（对 s-07 验证定义的转述，原文表述待核对）。 5. 自测 q1 ：手算实例 1 中，防抖从\"连续 3 次\"改成\"连续 5 次\"（采样周期 100 ms 不变），时间预算要怎么调？ q2 ：为什么\"需求可测化\"是 v 模型左臂的硬要求？ q3 ：软件工程师把过压阈值从 4.25 v 改成 4.22 v，按 v 流程应触发哪些动作？ 答案 q1：防抖 5 次占 400 ms，只剩 90 ms 给采样/判断/执行，预算表必须重排（或提高采样频率），否则 500 ms 总预算失守——防抖次数是左右臂联动的典型参数。 q2：右臂每个测试的判据来自左臂需求；不可测的需求产不出判据，该需求的验证悬空，追溯链在此断裂。 q3：发起变更单 → 影响分析（涉及该阈值的设计文档、代码、单元/集成/系统测试用例、标定条目、fmea 等安全分析）→ 全链更新并重跑受影响测试 → 评审关闭。只改代码不改用例就是追溯链断裂。 来源 s-07：iso 26262:2018《道路车辆 功能安全》（v 流程、追溯与验证框架；分部分条款细节待逐条核对） s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》（bms 产品级要求） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（编号年份待核对 → p-01） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 iso 26262:2018 第 2/3/4/6 部分 v 流程与管理/概念/系统/软件层的原始出处（原文付费） automotive spice（vda 过程评估模型） 行业普遍采用的过程评估框架 [待补链] v-modell xt（德国官方项目管理方法） v 模型的公共部门版本 [待补链] 待核对项 iso 26262 各部分对\"验证（verification）/确认（validation）\"的定义原文（本课为转述）。 aspice 过程组与左右臂的精确对应关系。 \"量产 bms 团队普遍采用 iso 26262 + aspice 框架\"为观点级概括，未做行业统计。 "}, {"id": "DEV-02", "title": "课程 DEV-02：MIL/SIL/PIL/HIL 验证阶梯", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-02<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-01<\/code> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要验证阶梯<\/h3>\n<p>控制策略先以模型出现（MBD，model-based development，基于模型的开发），最后以代码跑在目标 MCU 上。每换一个\"载体\"，就引入一类新误差：<\/p>\n<ul>\n<li>模型 → 代码：代码生成/移植引入实现错误；<\/li>\n<li>代码 → 目标芯片：单精度/定点字长效应、编译器优化；<\/li>\n<li>芯片 → 完整 ECU：任务调度、外设时序、总线负载。<\/li>\n<p>验证阶梯（verification ladder）让每一级只暴露、只排查一类误差，避免把所有问题堆到实车联调才炸。<\/p>\n<\/ul>\n<h3>2. 机制：四级阶梯<\/h3>\n<table><thead><tr><th>级<\/th><th>全称<\/th><th>被测物<\/th><th>运行环境<\/th><th>主要抓什么错<\/th><\/tr><\/thead><tbody><tr><td>MIL<\/td><td>Model-in-the-Loop（模型在环）<\/td><td>控制算法模型<\/td><td>PC + 被控对象模型<\/td><td>算法逻辑与参数<\/td><\/tr><tr><td>SIL<\/td><td>Software-in-the-Loop（软件在环）<\/td><td>生成的产品代码<\/td><td>PC 上编译运行<\/td><td>代码与模型不一致<\/td><\/tr><tr><td>PIL<\/td><td>Processor-in-the-Loop（处理器在环）<\/td><td>目标芯片（或等效核）上的代码<\/td><td>板卡 + 主机数据交换<\/td><td>字长/定点化、编译器、算力时延<\/td><\/tr><tr><td>HIL<\/td><td>Hardware-in-the-Loop（硬件在环）<\/td><td>完整真 ECU<\/td><td>实时仿真器模拟电池（<code>DEV-03<\/code>）<\/td><td>调度、通信、故障响应时序<\/td><\/tr><\/tbody><\/table>\n<p>命名陷阱：这里的 SIL（软件在环）与功能安全的 SIL（Safety Integrity Level，安全完整性等级，IEC 61508 体系）<strong>同缩写不同概念<\/strong>，读文献要靠上下文分辨。<\/p>\n<h4>通过准则与覆盖率（S-07）<\/h4>\n<ul>\n<li>每级预定义<strong>通过准则<\/strong>：如背靠背测试（back-to-back，同输入比输出）中 SIL 与 MIL 输出偏差 &lt; 容差（容差按功能定，示意）。<\/li>\n<li>单元测试覆盖率按 ASIL 分级递进：语句覆盖（statement）→ 分支覆盖（branch）→ <strong>MC/DC<\/strong>（Modified Condition/Decision Coverage，修正条件判定覆盖）。ISO 26262-6 给出按 ASIL 的方法推荐（ASIL D 通常对应 MC/DC；表格条目待逐条核对 → 见待核对项）。<\/li>\n<\/ul>\n<h4>手算实例 1：MC/DC 用例数<\/h4>\n<p>判定 <code>过压告警 = (V&gt;4.25 V) &amp;&amp; (I&gt;0) &amp;&amp; (T&gt;45 ℃)<\/code>（阈值均为教学示意值），3 个条件：<\/p>\n<ul>\n<li>语句覆盖最少 1 个用例；分支覆盖最少 2 个（判定真/假各一次）；<\/li>\n<li><strong>MC/DC 要求每个条件都能独立影响判定结果<\/strong>，最少用例数 = 条件数 + 1 = <strong>4 个<\/strong>（示意推导，组合方式不唯一）。<\/li>\n<\/ul>\n<h4>手算实例 2：定点化的量级感<\/h4>\n<p>SOP 限功率算得 29.6 A（教学示意值），标定变量按 0.5 A 步长（LSB，最小量化单位）存储（示意）：<\/p>\n<ul>\n<li>29.6 / 0.5 = 59.2 → 量化为 59 → 回算 59 × 0.5 = <strong>29.5 A<\/strong>，偏差 0.1 A（约 0.3%）；<\/li>\n<li>MIL（双精度）上不存在此偏差，PIL/目标机上才出现——这正是 PIL 存在的理由。<\/li>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>量产 BMS 普遍\"模型开发（MIL/SIL）+ 手写驱动层\"混合；MIL/SIL 回归常进 CI（持续集成）流水线，每次提交自动执行（工程共识级概括）。<\/li>\n<li>工具链本身要评估置信度（ISO 26262-8 的工具置信度 TCL 思路；条款细节待核对）。<\/li>\n<li>跳级是常态而非违规——小改动可只做 SIL 回归 + 局部 HIL 用例，但<strong>升级条件要写清<\/strong>：如\"改动安全机制必须重跑全部 HIL 故障注入\"（工程惯例表述）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>\"SIL 通过 = HIL 通过 = 实车没问题\"——每级只覆盖各自误差类；调度与时序问题只有 HIL 及以后才暴露。<\/li>\n<li>混淆两个 SIL（见上）。<\/li>\n<li>省掉 PIL 直接上 HIL——定点/字长问题会在 HIL 上以\"莫名偏差\"出现，定位成本远高于 PIL 的背靠背对比。<\/li>\n<li>覆盖率只统计语句级就宣布达标——高 ASIL 的分支/MC/DC 要求未满足。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：过压告警逻辑 MIL/SIL 输出完全一致，实车却偶发漏报。列至少两个 MIL/SIL 覆盖不到的嫌疑环节。 <strong>Q2<\/strong>：判定含 4 个条件时，MC/DC 最少多少用例？分支覆盖最少多少？ <strong>Q3<\/strong>：为什么\"背靠背零偏差\"适合 SIL 级，却不适合作为 HIL 级的主要判据？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：任务调度/执行时序（告警任务被抢占）、总线延迟或丢帧、AFE 采样链路的真实噪声/毛刺、看门狗与中断配置。MIL/SIL 的理想化环境不含这些。<\/li>\n<li>Q2：MC/DC 最少 4 + 1 = 5 个；分支覆盖最少 2 个（真/假各一次）。<\/li>\n<li>Q3：HIL 的价值恰是真 ECU + 实时环境的非理想性（调度、总线、时序），输出与理想模型本来就应有受控偏差；应改用时序/行为判据（响应时间、故障注入后的动作序列）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（验证方法分级、覆盖率推荐、工具置信度；具体表格条目待逐条核对）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 产品试验条件，作为验证需求输入）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（编号年份待核对 → P-01）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 第 6、8 部分<\/td><td>软件级验证方法与工具置信度的原始出处<\/td><\/tr><tr><td>MathWorks 官方文档\"MIL/SIL/PIL Simulations\"（Simulink）<\/td><td>MBD 流程的厂商参考实现 [待补链]<\/td><\/tr><tr><td>开源项目：GoogleTest<\/td><td>C++ 单元测试框架，SIL/单元回归的常用基础设施<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>ISO 26262-6 覆盖率方法与 ASIL 推荐对应表原文（本课只保留\"ASIL D 通常对应 MC/DC\"的通行说法）。<\/li>\n<li>ISO 26262-8 工具置信度（TCL）分级条款原文。<\/li>\n<li>\"量产 BMS 普遍采用模型开发混合模式、MIL/SIL 进 CI\"为工程共识级概括，未做统计。<\/li>\n<\/ul>", "text": " 对应节点 dev-02 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-01 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要验证阶梯 控制策略先以模型出现（mbd，model-based development，基于模型的开发），最后以代码跑在目标 mcu 上。每换一个\"载体\"，就引入一类新误差： 模型 → 代码：代码生成/移植引入实现错误； 代码 → 目标芯片：单精度/定点字长效应、编译器优化； 芯片 → 完整 ecu：任务调度、外设时序、总线负载。 验证阶梯（verification ladder）让每一级只暴露、只排查一类误差，避免把所有问题堆到实车联调才炸。 2. 机制：四级阶梯 级 全称 被测物 运行环境 主要抓什么错 mil model-in-the-loop（模型在环） 控制算法模型 pc + 被控对象模型 算法逻辑与参数 sil software-in-the-loop（软件在环） 生成的产品代码 pc 上编译运行 代码与模型不一致 pil processor-in-the-loop（处理器在环） 目标芯片（或等效核）上的代码 板卡 + 主机数据交换 字长/定点化、编译器、算力时延 hil hardware-in-the-loop（硬件在环） 完整真 ecu 实时仿真器模拟电池（ dev-03 ） 调度、通信、故障响应时序 命名陷阱：这里的 sil（软件在环）与功能安全的 sil（safety integrity level，安全完整性等级，iec 61508 体系） 同缩写不同概念 ，读文献要靠上下文分辨。 通过准则与覆盖率（s-07） 每级预定义 通过准则 ：如背靠背测试（back-to-back，同输入比输出）中 sil 与 mil 输出偏差 &lt; 容差（容差按功能定，示意）。 单元测试覆盖率按 asil 分级递进：语句覆盖（statement）→ 分支覆盖（branch）→ mc/dc （modified condition/decision coverage，修正条件判定覆盖）。iso 26262-6 给出按 asil 的方法推荐（asil d 通常对应 mc/dc；表格条目待逐条核对 → 见待核对项）。 手算实例 1：mc/dc 用例数 判定 过压告警 = (v&gt;4.25 v) &amp;&amp; (i&gt;0) &amp;&amp; (t&gt;45 ℃) （阈值均为教学示意值），3 个条件： 语句覆盖最少 1 个用例；分支覆盖最少 2 个（判定真/假各一次）； mc/dc 要求每个条件都能独立影响判定结果 ，最少用例数 = 条件数 + 1 = 4 个 （示意推导，组合方式不唯一）。 手算实例 2：定点化的量级感 sop 限功率算得 29.6 a（教学示意值），标定变量按 0.5 a 步长（lsb，最小量化单位）存储（示意）： 29.6 / 0.5 = 59.2 → 量化为 59 → 回算 59 × 0.5 = 29.5 a ，偏差 0.1 a（约 0.3%）； mil（双精度）上不存在此偏差，pil/目标机上才出现——这正是 pil 存在的理由。 3. 工程实态 量产 bms 普遍\"模型开发（mil/sil）+ 手写驱动层\"混合；mil/sil 回归常进 ci（持续集成）流水线，每次提交自动执行（工程共识级概括）。 工具链本身要评估置信度（iso 26262-8 的工具置信度 tcl 思路；条款细节待核对）。 跳级是常态而非违规——小改动可只做 sil 回归 + 局部 hil 用例，但 升级条件要写清 ：如\"改动安全机制必须重跑全部 hil 故障注入\"（工程惯例表述）。 4. 常见误区 \"sil 通过 = hil 通过 = 实车没问题\"——每级只覆盖各自误差类；调度与时序问题只有 hil 及以后才暴露。 混淆两个 sil（见上）。 省掉 pil 直接上 hil——定点/字长问题会在 hil 上以\"莫名偏差\"出现，定位成本远高于 pil 的背靠背对比。 覆盖率只统计语句级就宣布达标——高 asil 的分支/mc/dc 要求未满足。 5. 自测 q1 ：过压告警逻辑 mil/sil 输出完全一致，实车却偶发漏报。列至少两个 mil/sil 覆盖不到的嫌疑环节。 q2 ：判定含 4 个条件时，mc/dc 最少多少用例？分支覆盖最少多少？ q3 ：为什么\"背靠背零偏差\"适合 sil 级，却不适合作为 hil 级的主要判据？ 答案 q1：任务调度/执行时序（告警任务被抢占）、总线延迟或丢帧、afe 采样链路的真实噪声/毛刺、看门狗与中断配置。mil/sil 的理想化环境不含这些。 q2：mc/dc 最少 4 + 1 = 5 个；分支覆盖最少 2 个（真/假各一次）。 q3：hil 的价值恰是真 ecu + 实时环境的非理想性（调度、总线、时序），输出与理想模型本来就应有受控偏差；应改用时序/行为判据（响应时间、故障注入后的动作序列）。 来源 s-07：iso 26262:2018（验证方法分级、覆盖率推荐、工具置信度；具体表格条目待逐条核对） s-03：gb/t 38661-2020（bms 产品试验条件，作为验证需求输入） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（编号年份待核对 → p-01） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 iso 26262:2018 第 6、8 部分 软件级验证方法与工具置信度的原始出处 mathworks 官方文档\"mil/sil/pil simulations\"（simulink） mbd 流程的厂商参考实现 [待补链] 开源项目：googletest c++ 单元测试框架，sil/单元回归的常用基础设施 待核对项 iso 26262-6 覆盖率方法与 asil 推荐对应表原文（本课只保留\"asil d 通常对应 mc/dc\"的通行说法）。 iso 26262-8 工具置信度（tcl）分级条款原文。 \"量产 bms 普遍采用模型开发混合模式、mil/sil 进 ci\"为工程共识级概括，未做统计。 "}, {"id": "DEV-03", "title": "课程 DEV-03：HIL 台架与电池仿真器", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-03<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-01<\/code>、<code>DEV-02<\/code> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要 HIL<\/h3>\n<p>真电池台架做不了（或不划算做）的实验占了 BMS 测试的大头：<\/p>\n<ul>\n<li><strong>故障类<\/strong>：采样线断路、传感器漂移、接触器粘连、绝缘失效——真电池上注入故障代价高且危险；<\/li>\n<li><strong>边界类<\/strong>：极寒 + 满 SOC + 大电流叠加工况，真电池反复跑边界加速损耗；<\/li>\n<li><strong>回归类<\/strong>：每次软件更新都上真电池跑全量用例，时间与电池都不够。<\/li>\n<p>HIL（Hardware-in-the-Loop，硬件在环）的解法：<strong>真 BMS 控制器<\/strong>接<strong>实时仿真器<\/strong>，仿真器用电池模型实时生成 BMS 期望看到的电压/电流/温度/绝缘信号，让 BMS\"以为\"自己接了真电池。<\/p>\n<\/ul>\n<h3>2. 机制：三层组成<\/h3>\n<ol>\n<li><strong>实时目标机<\/strong>：硬实时运行电池模型（典型为 OCV + RC 等效电路，见 <code>ALG-10<\/code>；参数用 HPPC 程序辨识，程序见 S-26）。仿真步长要远小于被测 BMS 的采样周期，通行做法是至少小一个量级。<\/li>\n<li><strong>电池仿真器<\/strong>：<\/li>\n<\/ol>\n<ul>\n<li><strong>电芯级（cell simulator）<\/strong>：每通道一个可编程电压源，接在 BMS 的电压采样线上，可逐通道设电压、注入断线/漂移；<\/li>\n<li><strong>包级高压源<\/strong>：模拟高压母线，配合可编程源/载实现充放电；<\/li>\n<li><strong>温度通道<\/strong>：可编程电阻模拟 NTC；<strong>绝缘电阻<\/strong>用可切换电阻网络模拟。<\/li>\n<\/ul>\n<ol>\n<li><strong>总线仿真与故障注入（fault injection）<\/strong>：CAN 报文仿真（协议环境见 S-11）、接触器状态模拟、故障用例自动执行与判定。<\/li>\n<\/ol>\n<h4>手算实例 1：通道规模估算（全部教学示意值）<\/h4>\n<p>96 串电池包，BMS 采样：单体电压 96 节 + 总压 2 路 + 温度 12 路：<\/p>\n<ul>\n<li>电芯仿真通道：96（每通道 0~5 V 级可编程源）；<\/li>\n<li>温度通道：12（NTC 阻值模拟）；高压通道：1 套；<\/li>\n<li>合计 I/O 约 <strong>110 路<\/strong>。通道数直接决定台架价格量级——HIL 立项的第一笔账。<\/li>\n<\/ul>\n<h4>手算实例 2：实时性核算（教学示意值）<\/h4>\n<p>BMS 电压采样周期 10 ms → 仿真步长取 100 µs（小两个量级）。2 阶 RC 模型每步约 30~50 次浮点运算 → 单模型需求 0.3~0.5 MFLOPS，现代实时目标机（GFLOPS 级）算力余量巨大；真正的挑战不是算力而是<strong>时序确定性<\/strong>——一步超时（overrun）整个用例作废。<\/p>\n<h4>手算实例 3：故障注入用例表（工程案例）<\/h4>\n<table><thead><tr><th>用例<\/th><th>注入方式<\/th><th>期望 BMS 响应<\/th><th>判据（示意）<\/th><\/tr><\/thead><tbody><tr><td>单体采样线断路<\/td><td>某通道切为高阻<\/td><td>识别断线并报故障，不误判为过压<\/td><td>响应 ≤ 200 ms<\/td><\/tr><tr><td>电压漂移<\/td><td>某通道叠加 +50 mV 斜坡<\/td><td>一致性诊断隔离坏点<\/td><td>标记正确、无误保护<\/td><\/tr><tr><td>充电过压<\/td><td>单体升至 4.28 V<\/td><td>请求断开充电继电器<\/td><td>动作序列与时间符合需求<\/td><\/tr><tr><td>CAN 断线<\/td><td>停发充电机报文<\/td><td>进入通信超时策略（<code>S-05<\/code> 相关）<\/td><td>按标定策略降功率/停机<\/td><\/tr><\/tbody><\/table>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>商用平台以 Vector CANoe、dSPACE、NI、ETAS 等为代表（行业通用工具，仅点名）；电芯通道数与故障注入矩阵是选型核心指标。<\/li>\n<li>模型保真度按需取舍：验证保护逻辑用 OCV+RC 足够；验证 SOC 算法要叠加滞回与容量特性。<strong>\"模型越准越好\"是伪需求，保真度由被测功能定义。<\/strong><\/li>\n<li>HIL 通过是软件发布的门禁之一，但替代不了法规型式试验（<code>DEV-04<\/code>）与实车标定（<code>DEV-05<\/code>）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>只验\"正常功能\"不验故障注入——BMS 的价值恰在故障路径；无故障注入的 HIL 只是一个昂贵的功能演示台。<\/li>\n<li>忽略采样线开路/对地短路的注入——量产问题的高频根因类型（观点级概括，待案例来源支撑）。<\/li>\n<li>模型与真电池\"对不上\"就全面升级模型——先确认被测功能需要哪层保真度。<\/li>\n<li>继电器/预充电路只用理想开关模拟——粘连、弹跳、时序漏掉，高压时序策略（<code>HV-*<\/code>）没被真正测到。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：手算实例 1 改为 192 串储能场景（温度 24 路，示意），通道规模与成本趋势如何？ <strong>Q2<\/strong>：为什么仿真步长要远小于 BMS 采样周期？\"恰好等于\"会发生什么？ <strong>Q3<\/strong>：设计一个\"接触器粘连\"故障注入用例（注入方式、期望响应、判据）。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：192 + 24 + 2 ≈ 220 路，接近翻倍；台架价格随通道数近线性上涨（工程经验，示意），预算需同步考虑。<\/li>\n<li>Q2：步长=采样周期时模型更新与 BMS 采样同相/反相拍频，BMS 可能采到\"过期\"或跳变值，边界工况复现不稳定；小步长保证每个采样点间模型已收敛多步，时序可复现。<\/li>\n<li>Q3（示例）：注入——BMS 发出断开命令后，仿真器保持接触器闭合反馈且母线电压不消失；期望——N 次重试后进入粘连故障处理（禁止下一次预充、上报故障）；判据——重试次数、进入故障态时间、禁止预充标志符合需求（数值按项目需求定）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-26：INL《FreedomCAR Battery Test Manual》(2014)（HPPC 程序——HIL 电池模型参数的规范来源）<\/li>\n<li>S-07：ISO 26262:2018（安全机制验证与故障注入的框架要求）<\/li>\n<li>S-11：ISO 11898 系列（CAN/CAN FD——总线仿真的协议层）<\/li>\n<li>S-05：GB/T 27930（充电通信——充电 HIL 用例的协议依据；版本年份待核对 → P-06）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>INL HPPC 手册（S-26，公开 PDF）<\/td><td>电池模型参数辨识的权威程序<\/td><\/tr><tr><td>Plett《Battery Management Systems》Vol. I（S-16）<\/td><td>等效电路建模的系统教材<\/td><\/tr><tr><td>开源项目：PyBaMM<\/td><td>电池仿真模型库，可用于离线生成 HIL 模型参数 [待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>量产项目 HIL 仿真步长与通道规模的典型取值（本课用 100 µs、110 路教学示意值）。<\/li>\n<li>\"采样线开路是量产问题高频根因\"需要召回/售后数据证据（观点级）。<\/li>\n<li>商用 HIL 平台的当前主流配置与价格区间。<\/li>\n<\/ul>", "text": " 对应节点 dev-03 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-01 、 dev-02 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要 hil 真电池台架做不了（或不划算做）的实验占了 bms 测试的大头： 故障类 ：采样线断路、传感器漂移、接触器粘连、绝缘失效——真电池上注入故障代价高且危险； 边界类 ：极寒 + 满 soc + 大电流叠加工况，真电池反复跑边界加速损耗； 回归类 ：每次软件更新都上真电池跑全量用例，时间与电池都不够。 hil（hardware-in-the-loop，硬件在环）的解法： 真 bms 控制器 接 实时仿真器 ，仿真器用电池模型实时生成 bms 期望看到的电压/电流/温度/绝缘信号，让 bms\"以为\"自己接了真电池。 2. 机制：三层组成 实时目标机 ：硬实时运行电池模型（典型为 ocv + rc 等效电路，见 alg-10 ；参数用 hppc 程序辨识，程序见 s-26）。仿真步长要远小于被测 bms 的采样周期，通行做法是至少小一个量级。 电池仿真器 ： 电芯级（cell simulator） ：每通道一个可编程电压源，接在 bms 的电压采样线上，可逐通道设电压、注入断线/漂移； 包级高压源 ：模拟高压母线，配合可编程源/载实现充放电； 温度通道 ：可编程电阻模拟 ntc； 绝缘电阻 用可切换电阻网络模拟。 总线仿真与故障注入（fault injection） ：can 报文仿真（协议环境见 s-11）、接触器状态模拟、故障用例自动执行与判定。 手算实例 1：通道规模估算（全部教学示意值） 96 串电池包，bms 采样：单体电压 96 节 + 总压 2 路 + 温度 12 路： 电芯仿真通道：96（每通道 0~5 v 级可编程源）； 温度通道：12（ntc 阻值模拟）；高压通道：1 套； 合计 i/o 约 110 路 。通道数直接决定台架价格量级——hil 立项的第一笔账。 手算实例 2：实时性核算（教学示意值） bms 电压采样周期 10 ms → 仿真步长取 100 µs（小两个量级）。2 阶 rc 模型每步约 30~50 次浮点运算 → 单模型需求 0.3~0.5 mflops，现代实时目标机（gflops 级）算力余量巨大；真正的挑战不是算力而是 时序确定性 ——一步超时（overrun）整个用例作废。 手算实例 3：故障注入用例表（工程案例） 用例 注入方式 期望 bms 响应 判据（示意） 单体采样线断路 某通道切为高阻 识别断线并报故障，不误判为过压 响应 ≤ 200 ms 电压漂移 某通道叠加 +50 mv 斜坡 一致性诊断隔离坏点 标记正确、无误保护 充电过压 单体升至 4.28 v 请求断开充电继电器 动作序列与时间符合需求 can 断线 停发充电机报文 进入通信超时策略（ s-05 相关） 按标定策略降功率/停机 3. 工程实态 商用平台以 vector canoe、dspace、ni、etas 等为代表（行业通用工具，仅点名）；电芯通道数与故障注入矩阵是选型核心指标。 模型保真度按需取舍：验证保护逻辑用 ocv+rc 足够；验证 soc 算法要叠加滞回与容量特性。 \"模型越准越好\"是伪需求，保真度由被测功能定义。 hil 通过是软件发布的门禁之一，但替代不了法规型式试验（ dev-04 ）与实车标定（ dev-05 ）。 4. 常见误区 只验\"正常功能\"不验故障注入——bms 的价值恰在故障路径；无故障注入的 hil 只是一个昂贵的功能演示台。 忽略采样线开路/对地短路的注入——量产问题的高频根因类型（观点级概括，待案例来源支撑）。 模型与真电池\"对不上\"就全面升级模型——先确认被测功能需要哪层保真度。 继电器/预充电路只用理想开关模拟——粘连、弹跳、时序漏掉，高压时序策略（ hv-* ）没被真正测到。 5. 自测 q1 ：手算实例 1 改为 192 串储能场景（温度 24 路，示意），通道规模与成本趋势如何？ q2 ：为什么仿真步长要远小于 bms 采样周期？\"恰好等于\"会发生什么？ q3 ：设计一个\"接触器粘连\"故障注入用例（注入方式、期望响应、判据）。 答案 q1：192 + 24 + 2 ≈ 220 路，接近翻倍；台架价格随通道数近线性上涨（工程经验，示意），预算需同步考虑。 q2：步长=采样周期时模型更新与 bms 采样同相/反相拍频，bms 可能采到\"过期\"或跳变值，边界工况复现不稳定；小步长保证每个采样点间模型已收敛多步，时序可复现。 q3（示例）：注入——bms 发出断开命令后，仿真器保持接触器闭合反馈且母线电压不消失；期望——n 次重试后进入粘连故障处理（禁止下一次预充、上报故障）；判据——重试次数、进入故障态时间、禁止预充标志符合需求（数值按项目需求定）。 来源 s-26：inl《freedomcar battery test manual》(2014)（hppc 程序——hil 电池模型参数的规范来源） s-07：iso 26262:2018（安全机制验证与故障注入的框架要求） s-11：iso 11898 系列（can/can fd——总线仿真的协议层） s-05：gb/t 27930（充电通信——充电 hil 用例的协议依据；版本年份待核对 → p-06） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 inl hppc 手册（s-26，公开 pdf） 电池模型参数辨识的权威程序 plett《battery management systems》vol. i（s-16） 等效电路建模的系统教材 开源项目：pybamm 电池仿真模型库，可用于离线生成 hil 模型参数 [待补链] 待核对项 量产项目 hil 仿真步长与通道规模的典型取值（本课用 100 µs、110 路教学示意值）。 \"采样线开路是量产问题高频根因\"需要召回/售后数据证据（观点级）。 商用 hil 平台的当前主流配置与价格区间。 "}, {"id": "DEV-04", "title": "课程 DEV-04：合规测试——从法规条款到开发验证项", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-04<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-01<\/code> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>；试验项名称以标准原文为准。<\/p><\/blockquote>\n<h3>1. 为什么需要合规测试<\/h3>\n<p>型式试验（type test，法规指定的正式试验）是产品准入门槛：GB 38031 管电池包安全（S-01/S-02），GB/T 38661 管 BMS 产品技术条件（S-03），出口对应 UN R100（S-13）。<\/p>\n<p>关键是别把合规当开发后期的一次性考试：<strong>法规试验项必须在开发验证中提前覆盖<\/strong>——样件进了认证实验室才暴露问题，返工成本极高。工程上叫\"法规项左移\"。<\/p>\n<h3>2. 机制：试验项 → 开发验证项的映射<\/h3>\n<p>GB 38031 的试验按滥用类型分组：机械滥用（振动、冲击、挤压等）、电滥用（过充、过放、外短路等）、热滥用（加热、热扩散等）。GB 38031-2025（S-01）替代 2020 版（S-02），实施日期 2026-07-01（见 S-01 登记）；公开报道其新增底部撞击、快充循环后安全等试验项（条款细节待逐条核对 → 已有 P-05）。<\/p>\n<p>映射表（教学示意，逐条以标准原文为准）：<\/p>\n<table><thead><tr><th>法规试验项<\/th><th>验证目的<\/th><th>开发侧对应验证项<\/th><th>层级<\/th><\/tr><\/thead><tbody><tr><td>振动/机械冲击<\/td><td>机械与电气连接可靠性<\/td><td>样件振动试验 + 采样线间歇故障 HIL 用例（<code>DEV-03<\/code>）<\/td><td>样件 + 台架<\/td><\/tr><tr><td>过充/过放<\/td><td>充放电保护功能有效<\/td><td>保护阈值/时序 HIL 注入 + 标定核查（<code>DEV-05<\/code>）<\/td><td>台架 + 系统<\/td><\/tr><tr><td>外短路<\/td><td>短路保护与熔断配合<\/td><td>保护链路时序仿真 + 样件试验<\/td><td>样件<\/td><\/tr><tr><td>热扩散<\/td><td>热失控不扩散/预警（2025 版判定准则待核对）<\/td><td>预警算法标定 + 模组隔热设计联合验证<\/td><td>模组/包级<\/td><\/tr><tr><td>绝缘（配合 GB 18384，S-04）<\/td><td>高压安全<\/td><td>绝缘监测功能 HIL 注入<\/td><td>台架<\/td><\/tr><\/tbody><\/table>\n<p>GB/T 38661（S-03）把 BMS 当\"产品\"提要求（精度、通信、电气环境适应性等；SOC 精度具体数值条款待核对 → 已有 P-13）。<\/p>\n<h4>手算实例：过充保护的时间裕度（全部教学示意值）<\/h4>\n<p>法规过充试验隐含的问题是\"保护动作要赶在危险之前\"，可先做量级核算：<\/p>\n<ul>\n<li>1C 充电末端，电压爬升率约 20 mV/min；<\/li>\n<li>充电过压一级阈值 4.25 V，危险区取 4.35 V，可用窗口 100 mV ≈ <strong>5 min<\/strong>；<\/li>\n<li>BMS 保护链路：AFE 采样 100 ms + 滤波 200 ms + 判断/通信 10 ms + 继电器动作 50 ms ≈ <strong>0.4 s<\/strong>；<\/li>\n<li>时间裕度 ≈ 5 min ÷ 0.4 s ≈ <strong>750 倍<\/strong> → 设计合理。若滤波改成 30 s 级，裕度缩到 10 倍量级，就要重新评估。<\/li>\n<p>结论：合规条款可翻译成开发侧的<strong>时间预算与阈值核算<\/strong>，而不是到试验台上见真章。<\/p>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>国内准入：强检目录 + 公告制度；认证检测由专业机构执行（如中汽中心等，仅点名）。<\/li>\n<li>出口欧洲走 UN R100（S-13）；整车安全要求见 GB 18384（S-04）。<\/li>\n<li>量产一致性（CoP，Conformity of Production）：型式试验通过后量产件仍须持续满足试验条件——企业保留内部 DV/PV 能力的原因。<\/li>\n<li>标准切换期盯版本：2026-07-01 起按 GB 38031-2025 执行（过渡细则以主管部门文件为准 → 待核对）。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>\"过了型式试验 = 电池安全\"——型式试验是抽样条件下的底线，不是设计上限；极端工况组合仍需开发侧自行覆盖。<\/li>\n<li>合规测试与开发验证混为一谈——前者是第三方按标准条文执行，后者是企业自定义的完整验证体系，法规项只是其子集。<\/li>\n<li>拿 2020 版经验直接套 2025 版项目——新增试验项（底部撞击等）对结构与采样布局有传导影响，映射要重做。<\/li>\n<li>只映射到\"包级试验\"——与 BMS 关联的条款（热扩散预警、充电保护）要落到软件需求与标定，不是包级测一次了事。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：把\"热扩散试验\"翻译成 BMS 开发侧至少三项验证工作。 <strong>Q2<\/strong>：手算实例中充电倍率降到 0.5C，末端电压爬升率变缓，裕度如何变化？说明什么设计权衡？ <strong>Q3<\/strong>：为什么 UN R100 与 GB 38031 不能互相\"免试\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1（示例）：①热失控预警算法的触发阈值与提前量标定；②预警信号上报整车/云端的数据链路测试；③HIL 中模拟单电芯温度/电压异常的注入用例；④与隔热设计联合验证（预警能提前多少取决于设计，待实测确定）。<\/li>\n<li>Q2：爬升率减半 → 窗口约 10 min，裕度约 1500 倍。说明低速充电对保护时序宽松、快充才紧；保护链路严苛度应按最快充电工况核算。<\/li>\n<li>Q3：两套法规的适用范围、试验条件与判定准则不同（国内强标 vs UN 型式认证框架），条款不互认；出口项目分别满足（具体互认安排以法规原文与主管部门文件为准）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-01：GB 38031-2025《电动汽车用动力蓄电池安全要求》（实施 2026-07-01；条款细节待逐条核对 → P-05）<\/li>\n<li>S-02：GB 38031-2020（对照用）<\/li>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》（SOC 精度数值待核对 → P-13）<\/li>\n<li>S-04：GB 18384-2020《电动汽车安全要求》<\/li>\n<li>S-13：UN R100（蓄电池安全型式认证）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB 38031-2025 / GB/T 38661-2020 标准原文<\/td><td>映射工作的唯一依据，务必以原文为准<\/td><\/tr><tr><td>UN R100 原文（UNECE 发布）<\/td><td>出口认证试验项清单 [待补链]<\/td><\/tr><tr><td>ISO 16750（道路车辆电气电子环境条件与试验）<\/td><td>开发侧环境试验的常用参考标准体系<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>GB 38031-2025 逐条试验项清单与判定准则（对应已有 P-05，核对后回填映射表）。<\/li>\n<li>GB/T 38661-2020 中 SOC 精度等具体数值条款（对应已有 P-13）。<\/li>\n<li>2025 版过渡期执行细则（以主管部门发布文件为准）。<\/li>\n<li>热扩散试验对 BMS 预警提前量的具体要求（若标准有明确规定，按原文回填）。<\/li>\n<\/ul>", "text": " 对应节点 dev-04 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-01 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ；试验项名称以标准原文为准。 1. 为什么需要合规测试 型式试验（type test，法规指定的正式试验）是产品准入门槛：gb 38031 管电池包安全（s-01/s-02），gb/t 38661 管 bms 产品技术条件（s-03），出口对应 un r100（s-13）。 关键是别把合规当开发后期的一次性考试： 法规试验项必须在开发验证中提前覆盖 ——样件进了认证实验室才暴露问题，返工成本极高。工程上叫\"法规项左移\"。 2. 机制：试验项 → 开发验证项的映射 gb 38031 的试验按滥用类型分组：机械滥用（振动、冲击、挤压等）、电滥用（过充、过放、外短路等）、热滥用（加热、热扩散等）。gb 38031-2025（s-01）替代 2020 版（s-02），实施日期 2026-07-01（见 s-01 登记）；公开报道其新增底部撞击、快充循环后安全等试验项（条款细节待逐条核对 → 已有 p-05）。 映射表（教学示意，逐条以标准原文为准）： 法规试验项 验证目的 开发侧对应验证项 层级 振动/机械冲击 机械与电气连接可靠性 样件振动试验 + 采样线间歇故障 hil 用例（ dev-03 ） 样件 + 台架 过充/过放 充放电保护功能有效 保护阈值/时序 hil 注入 + 标定核查（ dev-05 ） 台架 + 系统 外短路 短路保护与熔断配合 保护链路时序仿真 + 样件试验 样件 热扩散 热失控不扩散/预警（2025 版判定准则待核对） 预警算法标定 + 模组隔热设计联合验证 模组/包级 绝缘（配合 gb 18384，s-04） 高压安全 绝缘监测功能 hil 注入 台架 gb/t 38661（s-03）把 bms 当\"产品\"提要求（精度、通信、电气环境适应性等；soc 精度具体数值条款待核对 → 已有 p-13）。 手算实例：过充保护的时间裕度（全部教学示意值） 法规过充试验隐含的问题是\"保护动作要赶在危险之前\"，可先做量级核算： 1c 充电末端，电压爬升率约 20 mv/min； 充电过压一级阈值 4.25 v，危险区取 4.35 v，可用窗口 100 mv ≈ 5 min ； bms 保护链路：afe 采样 100 ms + 滤波 200 ms + 判断/通信 10 ms + 继电器动作 50 ms ≈ 0.4 s ； 时间裕度 ≈ 5 min ÷ 0.4 s ≈ 750 倍 → 设计合理。若滤波改成 30 s 级，裕度缩到 10 倍量级，就要重新评估。 结论：合规条款可翻译成开发侧的 时间预算与阈值核算 ，而不是到试验台上见真章。 3. 工程实态 国内准入：强检目录 + 公告制度；认证检测由专业机构执行（如中汽中心等，仅点名）。 出口欧洲走 un r100（s-13）；整车安全要求见 gb 18384（s-04）。 量产一致性（cop，conformity of production）：型式试验通过后量产件仍须持续满足试验条件——企业保留内部 dv/pv 能力的原因。 标准切换期盯版本：2026-07-01 起按 gb 38031-2025 执行（过渡细则以主管部门文件为准 → 待核对）。 4. 常见误区 \"过了型式试验 = 电池安全\"——型式试验是抽样条件下的底线，不是设计上限；极端工况组合仍需开发侧自行覆盖。 合规测试与开发验证混为一谈——前者是第三方按标准条文执行，后者是企业自定义的完整验证体系，法规项只是其子集。 拿 2020 版经验直接套 2025 版项目——新增试验项（底部撞击等）对结构与采样布局有传导影响，映射要重做。 只映射到\"包级试验\"——与 bms 关联的条款（热扩散预警、充电保护）要落到软件需求与标定，不是包级测一次了事。 5. 自测 q1 ：把\"热扩散试验\"翻译成 bms 开发侧至少三项验证工作。 q2 ：手算实例中充电倍率降到 0.5c，末端电压爬升率变缓，裕度如何变化？说明什么设计权衡？ q3 ：为什么 un r100 与 gb 38031 不能互相\"免试\"？ 答案 q1（示例）：①热失控预警算法的触发阈值与提前量标定；②预警信号上报整车/云端的数据链路测试；③hil 中模拟单电芯温度/电压异常的注入用例；④与隔热设计联合验证（预警能提前多少取决于设计，待实测确定）。 q2：爬升率减半 → 窗口约 10 min，裕度约 1500 倍。说明低速充电对保护时序宽松、快充才紧；保护链路严苛度应按最快充电工况核算。 q3：两套法规的适用范围、试验条件与判定准则不同（国内强标 vs un 型式认证框架），条款不互认；出口项目分别满足（具体互认安排以法规原文与主管部门文件为准）。 来源 s-01：gb 38031-2025《电动汽车用动力蓄电池安全要求》（实施 2026-07-01；条款细节待逐条核对 → p-05） s-02：gb 38031-2020（对照用） s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》（soc 精度数值待核对 → p-13） s-04：gb 18384-2020《电动汽车安全要求》 s-13：un r100（蓄电池安全型式认证） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 gb 38031-2025 / gb/t 38661-2020 标准原文 映射工作的唯一依据，务必以原文为准 un r100 原文（unece 发布） 出口认证试验项清单 [待补链] iso 16750（道路车辆电气电子环境条件与试验） 开发侧环境试验的常用参考标准体系 待核对项 gb 38031-2025 逐条试验项清单与判定准则（对应已有 p-05，核对后回填映射表）。 gb/t 38661-2020 中 soc 精度等具体数值条款（对应已有 p-13）。 2025 版过渡期执行细则（以主管部门发布文件为准）。 热扩散试验对 bms 预警提前量的具体要求（若标准有明确规定，按原文回填）。 "}, {"id": "DEV-05", "title": "课程 DEV-05：标定与耐久验证", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-05<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-01<\/code>~<code>DEV-04<\/code>、<code>ALG-01<\/code> ｜ 预计用时 50 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要标定与耐久<\/h3>\n<p>算法框架是通用件，<strong>参数才是产品<\/strong>：同一套 BMS 软件，LFP 与 NCM、南方与北方、新车与旧车，表现天差地别，差别全在标定（calibration）参数——OCV-SOC 表、内阻/RC 参数表、功率 map、充电曲线、保护阈值、均衡策略。<\/p>\n<p>耐久验证回答另一个问题：<strong>这些参数在多年/十几万公里后还对吗？<\/strong>（里程为行业常见量级，示意）老化让容量缩水、内阻上升；标定若不为老化留好档位，车会越开越\"难用\"甚至误保护。<\/p>\n<h3>2. 机制：标定矩阵与耐久工况<\/h3>\n<h4>标定矩阵 = 温度点 × SOC 点 × 老化档<\/h4>\n<p>所有查表类参数（OCV、内阻、功率限值）都在这个三维空间取值；点数的选取是\"精度需求 × 台架成本\"的权衡。<\/p>\n<h4>手算实例 1：标定矩阵规模与台架时间（核心案例，全部教学示意值）<\/h4>\n<p>一次 OCV + HPPC 参数标定（程序依据 S-26）：<\/p>\n<ul>\n<li>温度点：-30、-20、-10、0、10、25、45、60 ℃ → 8 点；<\/li>\n<li>SOC 点：0~100%、步长 5% → 21 点；<\/li>\n<li>老化档：SOH = 100% / 90% / 80% → 3 档；<\/li>\n<li>全组合：8 × 21 × 3 = <strong>504 个工况点<\/strong>；<\/li>\n<li>每点含静置弛豫 + HPPC ≈ 40 min → 504 × 40 min ≈ <strong>336 h ≈ 14 天连续台架<\/strong>；8 通道并行测试仪可压到约 2 天。<\/li>\n<p>真正的瓶颈在<strong>老化工序<\/strong>：按 1C 循环、每循环 2.5 h（含休息）、每循环衰减 0.01% 计，做到 SOH 90% 需约 1000 次循环 ≈ <strong>2500 h ≈ 3 个多月<\/strong>。所以工程上常用\"外购不同寿命阶段的电芯/模组\"或加速老化凑齐老化档，而不是慢慢循环。<\/p>\n<\/ul>\n<h4>手算实例 2：查表插值误差（教学示意值）<\/h4>\n<p>功率 map 在 10 ℃ 与 25 ℃ 各存一点：10 ℃ 允许 40 A、25 ℃ 允许 100 A。电池实际在 17.5 ℃，线性插值得 70 A。若真实曲线在该区间上凸（低温端衰减更陡），线性插值会<strong>高估<\/strong>可用功率——低温端加密温度点比高温端更重要。<\/p>\n<h3>3. 耐久验证（三高 + 路试）<\/h3>\n<ul>\n<li><strong>三高试验<\/strong>：高温（吐鲁番）、高寒（黑河/漠河一带）、高原（格尔木一带）——行业惯例地点，用于暴露全温域与低气压问题（海拔与散热的耦合，定性）。<\/li>\n<li><strong>耐久路试<\/strong>：按企业规范跑数万至十几万公里强化路况（里程为企业标准，示意），持续记录 SOC 精度、功率限值触发频次、故障码，比对\"参数老化的实际轨迹\"与\"标定矩阵假设的老化档\"是否吻合。<\/li>\n<li>数据回流：路试/车队数据反哺场景库与标定更新（衔接 <code>DEV-06<\/code>）。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>标定管理：标定变量经 A2L 文件（ASAM ASAP2 描述格式）与标定工具（INCA、CANape 一类，仅点名）读写；<strong>标定版本与软件版本、车型严格绑定<\/strong>，发布时冻结。<\/li>\n<li>分工：电芯级参数（OCV/RC/HPPC）多由电芯厂提供，整车级策略标定（充电曲线、功率 map 的驾驶性权衡）在整车厂——边界因项目而异（观点级）。<\/li>\n<li>量产后的标定演进靠 OTA：流程受 UN R156（S-15）软件升级管理体系约束。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li><strong>用全新电
