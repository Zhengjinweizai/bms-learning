p>\n<\/ul>\n<h4>实例 2：双指数的\"永不到寿\"陷阱<\/h4>\n<p>已拟合参数（教学示意值）：a = 3.5%、τ₁ = 0.8 年（SEI 快相）；b = 9%、τ₂ = 6 年（慢相）。<\/p>\n<ul>\n<li>外推 5 年：loss = 3.5(1−e^(−5/0.8)) + 9(1−e^(−5/6)) = 3.5×0.998 + 9×0.565 = 3.49 + 5.09 = <strong>8.6%<\/strong> → SOH ≈ 91.4%；<\/li>\n<li>但双指数的渐近极限 = a + b = <strong>12.5% &lt; 20%<\/strong> → 该模型下<strong>永远到不了 EOL<\/strong>（RUL = ∞）——荒谬结论；<\/li>\n<li>处理：外推前必须检查模型渐近行为；饱和型经验式只适合预测\"近期\"，长周期要换含线性/加速项的模型或分段建模。<\/li>\n<\/ul>\n<h4>实例 3：置信区间决定商业决策<\/h4>\n<p>GPR/集成模型给出 5 年后 SOH = 91.4%，95% CI ±3%（示意）：<\/p>\n<ul>\n<li>均值口径：距 80% 还有 11.4% 余量；<\/li>\n<li><strong>下界口径<\/strong>：91.4 − 3 = 88.4%，余量只剩 8.4%；<\/li>\n<li>保修预留金必须按<strong>下界<\/strong>计提，而不是均值——差的 3 个点就是财务口径与工程口径的分界线。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>主战场在云端（GEN-2/<a class=\"xlink\" href=\"#/lesson/ARCH-CE\">ARCH-CE<\/a>）：车端只存 SOH 轨迹与工况统计特征，训练与外推在云端；量产现状以\"保守经验式 + 云端统计修正\"为主，学术上的 LSTM/Transformer 尚未大规模上车（工程实践观察，综述 S-28/S-29）；<\/li>\n<li>RUL 输出下游：残值评估、保修精算、梯次筛选、召回预警（成批车辆的衰减轨迹整体漂移 = 设计/工况问题）；<\/li>\n<li>数据基础依赖公开数据集（S-32/S-33）与车队真实数据闭环（DEV-06）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>拿出厂典型衰减曲线外推个体、又忽略膝点（knee point，老化后期衰减加速的拐点）——个体差异与非线性拐点都会让预测严重偏离，LFP 平台段容量估计本就失真（ALG-01），RUL 会在膝点跳变；<\/li>\n<li>把 RUL 当保证值对用户承诺——商用必须用置信下界（实例 3）；<\/li>\n<li>训练分布外硬预测——新体系/新快充策略没有数据支撑，预测就是编造；<\/li>\n<li>混淆容量口径与功率口径的 EOL——动力电池也可能\"功率先到寿\"（ALG-05/ALG-06）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么平方根式外推长周期必然偏乐观？ <strong>Q2<\/strong>：实例 2 中 RUL = ∞ 暴露了经验式建模的什么问题？工程上怎么处理？ <strong>Q3<\/strong>：一辆车 3 年 SOH_C = 95%，能否直接回答\"还能用几年\"？缺什么信息？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：√t 的斜率随时间递减（老化\"越老越慢\"），而真实老化有膝点加速项；且平方根式只描述 SEI 类单一机理，循环老化、LAM 加速等未进入方程。<\/li>\n<li>Q2：经验式只保证\"拟合段\"行为，外推段的渐近行为未经验证——饱和模型给出永不到寿的荒谬输出。处理：外推前检查渐近值与曲率，长周期换模型（含线性项/膝点项）或分段建模，并全程带置信区间。<\/li>\n<li>Q3：不能。SOH 是单点截面；需要衰减轨迹（多时点）、该车的工况特征（温度/倍率/DOD 分布）、体系先验与不确定性——即本课 2.1 的完整输入，才能给出带区间的 RUL。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-28：K. Yang et al., <em>Batteries<\/em> 9(7):351, 2023（SOH/机器学习方法谱系）<\/li>\n<li>S-29：X. Lei et al., SOH/RUL 文献计量综述，<em>Green Energy &amp; Environment<\/em>, 2024<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（老化机理与建模框架）；S-22：数字孪生综述（云端寿命预测的架构背景，Frontiers, DOI 10.3389/fbael.2026.1764210）<\/li>\n<li>S-32 / S-33：CalCE / NASA 公开老化数据集<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>K. A. Severson et al., \"Data-driven prediction of battery cycle life before capacity degradation\", <em>Nature Energy<\/em>, 2019<\/td><td>A<\/td><td>数据驱动循环寿命预测的里程碑论文（链接 [待补链]）<\/td><\/tr><tr><td>Yang et al.（S-28）/ Lei et al.（S-29）综述<\/td><td>A<\/td><td>均开放获取：SOH/机器学习方法谱系 + RUL 文献计量<\/td><\/tr><tr><td>NASA PCoE / CalCE 数据集（S-33/S-32）<\/td><td>B<\/td><td>RUL 模型的标准练习场<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>膝点（knee point）检测方法的代表性文献<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>\"EV 容量 80% 为 EOL\"的行业惯例出处（质保条款/标准原文）<\/li>\n<li>平方根式与双指数的典型拟合参数区间（本课数值为示意）<\/li>\n<li>量产云端 RUL 服务的公开案例（BaaS/残值评估产品）；LFP 膝点前后 SOH 估计失真的定量文献<\/li>\n<\/ul>", "text": " 对应节点 alg-09 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-05 （必看）、 alg-03 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 soh 是\"现在\"，rul（remaining useful life，剩余寿命）是\"未来\"： 电池离失效阈值还有多久 。它不直接保护电池，却直接定价电池： 保修预留金 ：8 年质保的钱按 rul 分布提取； 残值、baas 与二手定价 ：换电/租赁月费与二手车价本质都是\"卖剩余寿命\"（ gen-2 云端价值的主要兑现点，域六导语）——soh 是截面，rul 才是趋势； 梯次利用决策 ：车用到几成退役、还能干几年，决定 chm-04 的经济账。 ev 惯例取容量衰减到 80% 为 eol（end of life）阈值（工程共识，示意）。 2. 机制展开 2.1 输入与输出 输入 ：soh 轨迹（alg-05 在线估计的历史序列）+ 工况统计特征（温度分布、倍率分布、吞吐电量）+ 化学体系先验； 输出 ：到达 eol 的时间 分布 （rul = t_eol − t_now）——不是点估计，置信区间随预测视界（horizon）变宽（节点约束）。 2.2 模型族（由简到繁） 模型族 形式 适用 经验式 平方根式 q_loss = k√t（扩散控制 sei 生长的经典形式）；双指数 a(1−e^(−t/τ₁)) + b(1−e^(−t/τ₂))（快+慢两过程） 少数据起步、可解释 半经验 线性基底 × 工况加速因子（温度用 arrhenius 型、倍率/dod 修正） 车端可算的工程折中 数据驱动 soh 序列 + 特征 → lstm/gpr 预测轨迹与区间（s-28/s-29 综述谱系） 云端、大数据在手的场景 2.3 两条铁律（节点约束点题） 外推即风险 ：用 2 年数据预测 8 年 = 4 倍外推，且\"膝点\"（knee point，老化后期衰减加速的非线性拐点）可能在数据之外； 分布外泛化差 ：训练集没有的工况/新体系（ chm-02 / chm-03 ）预测无依据。 3. 手算实例（数字自洽，全为教学示意值） 实例 1：平方根式外推 某车观测（教学示意数据）：1 年容量损失 4.2%、2 年 6.0%、4 年 8.4%。验证平方根式 q_loss = k√t：k = 4.2/√1 = 4.2；6.0/√2 = 4.24；8.4/√4 = 4.2 → 拟合极佳， k ≈ 4.2 %/√年 。 外推 8 年：loss = 4.2×√8 = 11.9% → soh ≈ 88.1%； rul（到 20% 损失）：√t = 20/4.2 = 4.76 → t = 22.7 年 → rul ≈ 22.7 − 4 = 18.7 年。 教学警示 ：这个\"18.7 年\"几乎肯定是乐观的——平方根式越老越慢，且未建模膝点与工况突变。经验式外推必须叠加不确定性，不能当承诺。 实例 2：双指数的\"永不到寿\"陷阱 已拟合参数（教学示意值）：a = 3.5%、τ₁ = 0.8 年（sei 快相）；b = 9%、τ₂ = 6 年（慢相）。 外推 5 年：loss = 3.5(1−e^(−5/0.8)) + 9(1−e^(−5/6)) = 3.5×0.998 + 9×0.565 = 3.49 + 5.09 = 8.6% → soh ≈ 91.4%； 但双指数的渐近极限 = a + b = 12.5% &lt; 20% → 该模型下 永远到不了 eol （rul = ∞）——荒谬结论； 处理：外推前必须检查模型渐近行为；饱和型经验式只适合预测\"近期\"，长周期要换含线性/加速项的模型或分段建模。 实例 3：置信区间决定商业决策 gpr/集成模型给出 5 年后 soh = 91.4%，95% ci ±3%（示意）： 均值口径：距 80% 还有 11.4% 余量； 下界口径 ：91.4 − 3 = 88.4%，余量只剩 8.4%； 保修预留金必须按 下界 计提，而不是均值——差的 3 个点就是财务口径与工程口径的分界线。 4. 工程实态 主战场在云端（gen-2/ arch-ce ）：车端只存 soh 轨迹与工况统计特征，训练与外推在云端；量产现状以\"保守经验式 + 云端统计修正\"为主，学术上的 lstm/transformer 尚未大规模上车（工程实践观察，综述 s-28/s-29）； rul 输出下游：残值评估、保修精算、梯次筛选、召回预警（成批车辆的衰减轨迹整体漂移 = 设计/工况问题）； 数据基础依赖公开数据集（s-32/s-33）与车队真实数据闭环（dev-06）。 5. 常见误区 拿出厂典型衰减曲线外推个体、又忽略膝点（knee point，老化后期衰减加速的拐点）——个体差异与非线性拐点都会让预测严重偏离，lfp 平台段容量估计本就失真（alg-01），rul 会在膝点跳变； 把 rul 当保证值对用户承诺——商用必须用置信下界（实例 3）； 训练分布外硬预测——新体系/新快充策略没有数据支撑，预测就是编造； 混淆容量口径与功率口径的 eol——动力电池也可能\"功率先到寿\"（alg-05/alg-06）。 6. 自测 q1 ：为什么平方根式外推长周期必然偏乐观？ q2 ：实例 2 中 rul = ∞ 暴露了经验式建模的什么问题？工程上怎么处理？ q3 ：一辆车 3 年 soh_c = 95%，能否直接回答\"还能用几年\"？缺什么信息？ 答案 q1：√t 的斜率随时间递减（老化\"越老越慢\"），而真实老化有膝点加速项；且平方根式只描述 sei 类单一机理，循环老化、lam 加速等未进入方程。 q2：经验式只保证\"拟合段\"行为，外推段的渐近行为未经验证——饱和模型给出永不到寿的荒谬输出。处理：外推前检查渐近值与曲率，长周期换模型（含线性项/膝点项）或分段建模，并全程带置信区间。 q3：不能。soh 是单点截面；需要衰减轨迹（多时点）、该车的工况特征（温度/倍率/dod 分布）、体系先验与不确定性——即本课 2.1 的完整输入，才能给出带区间的 rul。 来源 s-28：k. yang et al., batteries 9(7):351, 2023（soh/机器学习方法谱系） s-29：x. lei et al., soh/rul 文献计量综述， green energy &amp; environment , 2024 s-16：g. plett, battery management systems vol. i（老化机理与建模框架）；s-22：数字孪生综述（云端寿命预测的架构背景，frontiers, doi 10.3389/fbael.2026.1764210） s-32 / s-33：calce / nasa 公开老化数据集 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 k. a. severson et al., \"data-driven prediction of battery cycle life before capacity degradation\", nature energy , 2019 a 数据驱动循环寿命预测的里程碑论文（链接 [待补链]） yang et al.（s-28）/ lei et al.（s-29）综述 a 均开放获取：soh/机器学习方法谱系 + rul 文献计量 nasa pcoe / calce 数据集（s-33/s-32） b rul 模型的标准练习场 [待补链] — 膝点（knee point）检测方法的代表性文献 待核对项（本课） \"ev 容量 80% 为 eol\"的行业惯例出处（质保条款/标准原文） 平方根式与双指数的典型拟合参数区间（本课数值为示意） 量产云端 rul 服务的公开案例（baas/残值评估产品）；lfp 膝点前后 soh 估计失真的定量文献 "}, {"id": "ALG-10", "title": "课程 ALG-10：等效电路模型（ECM）与参数辨识", "dom": "ALG", "verified": true, "html": "<blockquote><p>对应节点 <code>ALG-10<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a> ｜ 预计用时 45 min 文中具体数字除特别标注外均为<strong>教学示意值<\/strong>（量级参考典型 18650 电芯）。<\/p><\/blockquote>\n<h3>1. 为什么需要模型<\/h3>\n<p>上一课的 OCV 校正要\"等静置机会\"。要<strong>边开车边校正<\/strong>，就必须让 BMS 能预测电池行为——这就是模型的三用：<\/p>\n<ol>\n<li><strong>SOC 校正<\/strong>：模型预测端电压 vs 实测电压，差值反推状态（下一课 EKF）；<\/li>\n<li><strong>SOP 计算<\/strong>（<code>ALG-06<\/code>）：预测\"如果现在抽 X kW，端电压会不会跌破下限\"；<\/li>\n<li><strong>故障诊断<\/strong>（<code>ALG-08<\/code>）：实测长期偏离模型预测 = 有异常（残差诊断）。<\/li>\n<p>没有模型，三件事都做不了。等效电路模型（ECM, Equivalent Circuit Model）是量产 BMS 的主流选择。<\/p>\n<\/ol>\n<h3>2. 模型演进：Rint → 1RC → 2RC<\/h3>\n<table><thead><tr><th>模型<\/th><th>结构<\/th><th>能描述 / 不能描述<\/th><\/tr><\/thead><tbody><tr><td>Rint<\/td><td>OCV + 一个欧姆电阻<\/td><td>能：瞬时压降；不能：撤负载后电压慢慢恢复<\/td><\/tr><tr><td>Thevenin（1RC）<\/td><td>OCV + R0 + 一条 R//C<\/td><td>能：极化的建立与弛豫（秒级）；不能：更慢的扩散尾<\/td><\/tr><tr><td>2RC<\/td><td>OCV + R0 + 两条 R//C<\/td><td>能：快（秒级）+ 慢（分钟级）两段动态——<strong>量产主流<\/strong>（精度/算力平衡，工程观点，框架依据 S-16）<\/td><\/tr><\/tbody><\/table>\n<p>2RC 结构方程：<\/p>\n<div class=\"math\">U_t = OCV(SOC,T) - I R_0 - U_1 - U_2<\/div>\n<div class=\"math\">\\frac{dU_k}{dt} = -\\frac{U_k}{R_k C_k} + \\frac{I}{C_k}, \\quad k=1,2<\/div>\n<h3>3. 元件的物理对应<\/h3>\n<ul>\n<li><strong>OCV(SOC,T)<\/strong>：热力学电动势，随 SOC 与温度变化；<\/li>\n<li><strong>R0<\/strong>：欧姆内阻 = 电解液 + 接触 + 集流体电阻 → <strong>瞬时<\/strong>压降；<\/li>\n<li><strong>R1//C1<\/strong>：电荷转移电阻 + 双电层电容 → <strong>秒级<\/strong>极化；<\/li>\n<li><strong>R2//C2<\/strong>：扩散过程 → <strong>分钟级<\/strong>极化。<\/li>\n<\/ul>\n<h3>4. HPPC 参数辨识：手算全流程<\/h3>\n<p>HPPC（Hybrid Pulse Power Characterization，混合脉冲功率特性测试）：在不同 SOC/温度点打电流脉冲，从电压响应提取参数。这是行业通行方法（方法框架依据 S-16）。<\/p>\n<p><strong>示例<\/strong>（教学示意值）：2 Ah 电芯，25°C，50% SOC，1C=2 A 放电脉冲 10 s。<\/p>\n<p><strong>Step 1 — R0（瞬时跳变）<\/strong> 电流接通瞬间（t=0⁺），电容来不及动作，全部压降落在 R0： 实测瞬间跳降 40 mV → R0 = 0.040 V ÷ 2 A = <strong>20 mΩ<\/strong><\/p>\n<p><strong>Step 2 — 极化分量<\/strong> 脉冲结束时刻（t=10 s）总压降 61 mV → 极化部分 = 61 − 40 = <strong>21 mV<\/strong><\/p>\n<p><strong>Step 3 — 拟合 R1、C1<\/strong> 极化建立规律：<code>U_1(t) = I R_1 (1 - e^{-t/\\tau_1})<\/code>，τ1 = R1C1。 从恢复段曲线拟合出 τ1 = 8 s，结合 U1(10s)=21 mV 解得 R1 ≈ <strong>15 mΩ<\/strong>，C1 = τ1/R1 = 8/0.015 ≈ <strong>533 F<\/strong>。<\/p>\n<p>验证自洽：U1(10) = 2 × 0.015 × (1 − e^(−10/8)) = 0.03 × 0.7135 ≈ 21.4 mV ✓<\/p>\n<p><strong>Step 4 — 慢支路<\/strong> 撤流后若电压弛豫尾段仍留有分钟级慢分量，再加一条 R2//C2 重复上述拟合。<\/p>\n<h3>5. 参数是三维的：SOC × 温度 × 老化<\/h3>\n<p>辨识不是做一次就完：<\/p>\n<ul>\n<li>R0 在 −20°C 可达常温的数倍（示意量级）→ <strong>这就是冬季充电功率骤降、SOP 收紧的直接原因<\/strong>；<\/li>\n<li>老化使 R0 缓慢上涨 → 与 <code>ALG-05<\/code> 的功率型 SOH 对应。<\/li>\n<p>量产做法：<strong>网格化标定 + 运行时插值<\/strong>（温宽 × SOC 区间 × 老化维度）。代价是标定矩阵爆炸（示意：13 个温度点 × 11 个 SOC 点 × 老化档位），因此进阶方案是在线参数更新（联合估计，见下一课）——对应开发域 <code>DEV-05<\/code> 的标定工作量。<\/p>\n<\/ul>\n<h3>6. 局限（诚实清单）<\/h3>\n<ol>\n<li><strong>无机理外推能力<\/strong>：参数是拟合出来的，对没标定过的新工况外插不可信；<\/li>\n<li><strong>滞回未建模<\/strong>：LFP 充/放电 OCV 不重合，需附加滞回状态；<\/li>\n<li><strong>参数物理意义弱耦合<\/strong>：R1 实际混合了电荷转移与双电层两种效应。<\/li>\n<p>这三条正是电化学模型（<code>ALG-11<\/code>）存在的理由——精度更高，但算力与参数获取代价大，量产车端多为降阶使用。<\/p>\n<\/ol>\n<h3>7. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么撤掉负载后端电压不是瞬间恢复，而是指数回升？ <strong>Q2<\/strong>：某电芯 HPPC 中 R0 半年内从 20 mΩ 涨到 28 mΩ（+40%），这对整车的直接影响是什么？ <strong>Q3<\/strong>：为什么 2RC 比 1RC 更适合 SOP 计算？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：极化电容通过 R 放电，时间常数 τ=RC，属于电路惯性而非测量延迟。<\/li>\n<li>Q2：同等脉冲电流下瞬时压降增大 40% → 电压下限更早触及 → SOP 放电功率受限、冬季更明显（功率型老化）。<\/li>\n<li>Q3：SOP 需要预测\"持续 X 秒的脉冲后电压是否越限\"，1RC 只有一个时间常数，无法同时拟好秒级与分钟级响应，长时间脉冲预测会失真。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（模型族、HPPC 辨识方法框架）<\/li>\n<li>HPPC 各数字：教学示意值，量级参考常见 18650 电芯规格书习惯表达，非特定厂商数据<\/li>\n<\/ul>\n<h3>延伸资源（链接已于 2026-11-04 联网核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://inldigitallibrary.inl.gov/sites/sti/sti/6308373.pdf\" target=\"_blank\" rel=\"noopener\">INL《FreedomCAR Battery Test Manual》(2014, PDF)<\/a><\/td><td>A<\/td><td>✅<\/td><td>HPPC 测试的权威公开程序（美国能源部国家实验室，83 页）<\/td><\/tr><tr><td><a href=\"https://inldigitallibrary.inl.gov/sites/sti/sti/4655291.pdf\" target=\"_blank\" rel=\"noopener\">INL《Battery Test Manual for Plug-In Hybrid Electric Vehicles》(2010, PDF)<\/a><\/td><td>A<\/td><td>✅<\/td><td>HPPC 在插混电池上的扩展版（70 页）<\/td><\/tr><tr><td><a href=\"http://mocha-java.uccs.edu/dossier/RESEARCH/2004jps2-.pdf\" target=\"_blank\" rel=\"noopener\">Plett 2004 Part 2: Modeling and identification（作者自托管 PDF）<\/a> ｜ <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S037877530400360X\" target=\"_blank\" rel=\"noopener\">ScienceDirect 页面<\/a><\/td><td>A<\/td><td>✅<\/td><td>ECM 建模与辨识的原始文献（<em>J. Power Sources<\/em> 134: 262–276）<\/td><\/tr><tr><td><a href=\"https://calce.umd.edu/battery-data\" target=\"_blank\" rel=\"noopener\">CalCE Battery Data（马里兰大学公开数据集）<\/a><\/td><td>B<\/td><td>✅<\/td><td>公开实测数据——可下载后自己跑一遍本课的 HPPC 辨识（动手练习）<\/td><\/tr><\/tbody><\/table>", "text": " 对应节点 alg-10 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 ｜ 预计用时 45 min 文中具体数字除特别标注外均为 教学示意值 （量级参考典型 18650 电芯）。 1. 为什么需要模型 上一课的 ocv 校正要\"等静置机会\"。要 边开车边校正 ，就必须让 bms 能预测电池行为——这就是模型的三用： soc 校正 ：模型预测端电压 vs 实测电压，差值反推状态（下一课 ekf）； sop 计算 （ alg-06 ）：预测\"如果现在抽 x kw，端电压会不会跌破下限\"； 故障诊断 （ alg-08 ）：实测长期偏离模型预测 = 有异常（残差诊断）。 没有模型，三件事都做不了。等效电路模型（ecm, equivalent circuit model）是量产 bms 的主流选择。 2. 模型演进：rint → 1rc → 2rc 模型 结构 能描述 / 不能描述 rint ocv + 一个欧姆电阻 能：瞬时压降；不能：撤负载后电压慢慢恢复 thevenin（1rc） ocv + r0 + 一条 r//c 能：极化的建立与弛豫（秒级）；不能：更慢的扩散尾 2rc ocv + r0 + 两条 r//c 能：快（秒级）+ 慢（分钟级）两段动态—— 量产主流 （精度/算力平衡，工程观点，框架依据 s-16） 2rc 结构方程： u_t = ocv(soc,t) - i r_0 - u_1 - u_2 \\frac{du_k}{dt} = -\\frac{u_k}{r_k c_k} + \\frac{i}{c_k}, \\quad k=1,2 3. 元件的物理对应 ocv(soc,t) ：热力学电动势，随 soc 与温度变化； r0 ：欧姆内阻 = 电解液 + 接触 + 集流体电阻 → 瞬时 压降； r1//c1 ：电荷转移电阻 + 双电层电容 → 秒级 极化； r2//c2 ：扩散过程 → 分钟级 极化。 4. hppc 参数辨识：手算全流程 hppc（hybrid pulse power characterization，混合脉冲功率特性测试）：在不同 soc/温度点打电流脉冲，从电压响应提取参数。这是行业通行方法（方法框架依据 s-16）。 示例 （教学示意值）：2 ah 电芯，25°c，50% soc，1c=2 a 放电脉冲 10 s。 step 1 — r0（瞬时跳变） 电流接通瞬间（t=0⁺），电容来不及动作，全部压降落在 r0： 实测瞬间跳降 40 mv → r0 = 0.040 v ÷ 2 a = 20 mω step 2 — 极化分量 脉冲结束时刻（t=10 s）总压降 61 mv → 极化部分 = 61 − 40 = 21 mv step 3 — 拟合 r1、c1 极化建立规律： u_1(t) = i r_1 (1 - e^{-t/\\tau_1}) ，τ1 = r1c1。 从恢复段曲线拟合出 τ1 = 8 s，结合 u1(10s)=21 mv 解得 r1 ≈ 15 mω ，c1 = τ1/r1 = 8/0.015 ≈ 533 f 。 验证自洽：u1(10) = 2 × 0.015 × (1 − e^(−10/8)) = 0.03 × 0.7135 ≈ 21.4 mv ✓ step 4 — 慢支路 撤流后若电压弛豫尾段仍留有分钟级慢分量，再加一条 r2//c2 重复上述拟合。 5. 参数是三维的：soc × 温度 × 老化 辨识不是做一次就完： r0 在 −20°c 可达常温的数倍（示意量级）→ 这就是冬季充电功率骤降、sop 收紧的直接原因 ； 老化使 r0 缓慢上涨 → 与 alg-05 的功率型 soh 对应。 量产做法： 网格化标定 + 运行时插值 （温宽 × soc 区间 × 老化维度）。代价是标定矩阵爆炸（示意：13 个温度点 × 11 个 soc 点 × 老化档位），因此进阶方案是在线参数更新（联合估计，见下一课）——对应开发域 dev-05 的标定工作量。 6. 局限（诚实清单） 无机理外推能力 ：参数是拟合出来的，对没标定过的新工况外插不可信； 滞回未建模 ：lfp 充/放电 ocv 不重合，需附加滞回状态； 参数物理意义弱耦合 ：r1 实际混合了电荷转移与双电层两种效应。 这三条正是电化学模型（ alg-11 ）存在的理由——精度更高，但算力与参数获取代价大，量产车端多为降阶使用。 7. 自测 q1 ：为什么撤掉负载后端电压不是瞬间恢复，而是指数回升？ q2 ：某电芯 hppc 中 r0 半年内从 20 mω 涨到 28 mω（+40%），这对整车的直接影响是什么？ q3 ：为什么 2rc 比 1rc 更适合 sop 计算？ 答案 q1：极化电容通过 r 放电，时间常数 τ=rc，属于电路惯性而非测量延迟。 q2：同等脉冲电流下瞬时压降增大 40% → 电压下限更早触及 → sop 放电功率受限、冬季更明显（功率型老化）。 q3：sop 需要预测\"持续 x 秒的脉冲后电压是否越限\"，1rc 只有一个时间常数，无法同时拟好秒级与分钟级响应，长时间脉冲预测会失真。 来源 s-16：g. plett, battery management systems vol. i（模型族、hppc 辨识方法框架） hppc 各数字：教学示意值，量级参考常见 18650 电芯规格书习惯表达，非特定厂商数据 延伸资源（链接已于 2026-11-04 联网核实） 资源 级别 免费 说明 inl《freedomcar battery test manual》(2014, pdf) a ✅ hppc 测试的权威公开程序（美国能源部国家实验室，83 页） inl《battery test manual for plug-in hybrid electric vehicles》(2010, pdf) a ✅ hppc 在插混电池上的扩展版（70 页） plett 2004 part 2: modeling and identification（作者自托管 pdf） ｜ sciencedirect 页面 a ✅ ecm 建模与辨识的原始文献（ j. power sources 134: 262–276） calce battery data（马里兰大学公开数据集） b ✅ 公开实测数据——可下载后自己跑一遍本课的 hppc 辨识（动手练习） "}, {"id": "ALG-11", "title": "课程 ALG-11：电化学机理模型（SPM/P2D）——从\"拟合外特性\"到\"算出物理\"", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-11<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a>（必看）、<a class=\"xlink\" href=\"#/lesson/ALG-04\">ALG-04<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>ALG-10 结尾留了三条\"诚实清单\"：ECM 无机理外推能力、滞回未建模、参数物理意义弱。要回答<strong>\"为什么\"与\"如果……会怎样\"<\/strong>的问题，必须下到机理层：<\/p>\n<ol>\n<li><strong>设计<\/strong>：电芯厂用机理模型定材料参数与极片厚度——没有 ECM 能干这个；<\/li>\n<li><strong>快充边界<\/strong>：析锂发生在负极表面电位跌破 0 V（vs Li/Li⁺）时——只有机理模型能算出这个\"看不见的电位\"（<a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a> 的理论地基，衔接 eSOC 视角）；<\/li>\n<li><strong>健康归因<\/strong>：把容量衰减分解成 LLI/LAM（ALG-04/05 的机理名词）——ECM 的 R0 涨了给不出原因。<\/li>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 P2D：准二维模型（Doyle-Fuller-Newman 框架）<\/h4>\n<p>P2D（pseudo-two-dimensional）在<strong>两个维度<\/strong>上解物理方程：<\/p>\n<ul>\n<li><strong>x 维（电极厚度方向）<\/strong>：液相锂浓度扩散、电荷守恒（液相欧姆 + 固相导电网络）；<\/li>\n<li><strong>r 维（颗粒径向）<\/strong>：活性材料颗粒内部的固相锂扩散（Fick 定律）；<\/li>\n<li><strong>界面<\/strong>：两相接触面用 Butler-Volmer 方程描述电化学反应动力学。<\/li>\n<p>参数 20~40 个量级（示意）：固相扩散系数 D_s、反应速率常数、孔隙率、活性面积、电导率……——<strong>全部要靠实验标定<\/strong>（拆解电极、GITT/EIS/HPPC 类测试），且强相关参数之间存在<strong>可辨识性（identifiability）问题<\/strong>：拟合得好不代表每个参数都物理正确。<\/p>\n<\/ul>\n<h4>2.2 SPM：单颗粒模型（降阶第一刀）<\/h4>\n<p>SPM（single particle model）假设：电解液浓度处处均匀、每种电极压缩成<strong>一个大颗粒<\/strong> → 只解固相扩散，算力降几个数量级。适用低倍率；倍率高时颗粒表面与本体浓度差被低估——表面\"吃紧\"的时刻看不见（实例 1 的后果）。改进路线：SPMe（加电解液浓度修正）、PGM 等；进一步的降阶还有谱方法与数据驱动代理模型（用神经网络学 P2D 的输入输出映射，<a class=\"xlink\" href=\"#/lesson/ALG-03\">ALG-03<\/a> 思想的模型侧应用）。<\/p>\n<h4>2.3 车载现实<\/h4>\n<p>P2D 需要数值求解偏微分方程组（状态变量数百个，示意），车端 MCU 无法实时——量产车端仍是 ECM（ALG-10）的天下；机理模型在<strong>设计端、台架、云端<\/strong>（<a class=\"xlink\" href=\"#/lesson/GEN-3\">GEN-3<\/a> 数字孪生的物理内核）发挥价值。<\/p>\n<h3>3. 手算实例（数字自洽，均为教学示意值）<\/h3>\n<h4>实例 1：SPM 颗粒扩散时间常数——快充为什么难<\/h4>\n<p>石墨负极颗粒半径 R_s = 5 μm，固相扩散系数 D_s = 1×10⁻¹⁴ m²/s（均为示意值，量级参考常见石墨材料）：<\/p>\n<div class=\"math\">\\tau_{diff} \\approx \\frac{R_s^2}{D_s} = \\frac{(5\\times10^{-6})^2}{10^{-14}} = \\frac{2.5\\times10^{-11}}{10^{-14}} = 2500\\ \\text{s} \\approx 42\\ \\text{min}<\/div>\n<p>含义：大电流充电时锂\"来不及\"匀进颗粒内部，<strong>表面先饱和<\/strong> → 表面电位被压向 0 V（vs Li/Li⁺）→ 析锂窗口打开。这就解释了：<\/p>\n<ol>\n<li>快充能力受固相扩散限制，不是\"充电机功率不够\"；<\/li>\n<li>SPM 在高倍率失真——它假设颗粒内浓度线性分布，表面尖峰被抹平；<\/li>\n<li>小颗粒/高 D_s 是快充电芯的材料学方向（R²/D 的平方反比关系）。<\/li>\n<\/ol>\n<h4>实例 2：过程时间尺度谱——ECM 的 RC 从哪来<\/h4>\n<table><thead><tr><th>物理过程<\/th><th>特征时间（示意量级）<\/th><th>对应<\/th><\/tr><\/thead><tbody><tr><td>欧姆传导<\/td><td>~即时<\/td><td>ECM 的 R0<\/td><\/tr><tr><td>电荷转移 + 双电层<\/td><td>τ_ct = R_ct·C_dl = 5 mΩ × 1 F = <strong>5 ms<\/strong>（示意）<\/td><td>ECM 的快 RC（秒级段）<\/td><\/tr><tr><td>固相扩散<\/td><td><strong>2500 s<\/strong>（实例 1）<\/td><td>ECM 的慢 RC（分钟级段）<\/td><\/tr><\/tbody><\/table>\n<p>ECM 的 1RC/2RC 就是给机理时间尺度配的\"经验替身\"——参数辨识（ALG-10）拟合的是这套时间尺度的<strong>外显效果<\/strong>，而机理模型直接解它。这张表也解释了 ALG-10 为什么 2RC 比 1RC 好：真实电池至少有两个可分的时间尺度。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>电芯厂设计/快充标定用 P2D（自研代码或商业软件）；学术界与云端普及靠开源工具 PyBaMM；<\/li>\n<li>云端数字孪生（GEN-3）用降阶 SPM 做健康归因（LLI/LAM 分解），与 ALG-04 的电极状态、ALG-08 的诊断形成\"机理证据链\"；<\/li>\n<li>基于机理模型的多约束优化快充（MPC 类控制）是 CHG-03 的进阶方向；<\/li>\n<li>参数标定是最大门槛：一套可信的 P2D 参数库 = 大量拆解 + 电化学测试投入——这是机理模型\"精度高\"的名声与\"用不起\"的现实之间的差距。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"机理模型精度必然高\"——参数不准的 P2D 比 ECM 差得多，且错得更有迷惑性；<\/li>\n<li>把 SPM 用于高倍率——表面浓度尖峰被抹平，析锂边界算错（实例 1）；<\/li>\n<li>把拟合优度当参数正确性——可辨识性问题下，多组参数能同样拟合好；<\/li>\n<li>幻想车端跑 P2D——车载实时性是硬边界，降阶/查表/云端是仅有的三条路；<\/li>\n<li>把机理模型与 ECM 对立——量产形态是\"车端 ECM 兜底 + 云端机理增强\"的分工。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：SPM 砍掉了 P2D 的哪些物理？代价在什么工况暴露？ <strong>Q2<\/strong>：42 分钟的固相扩散时间常数，对\"10 分钟快充 80%\"的宣传意味着什么？ <strong>Q3<\/strong>：为什么说\"参数拟合精度高\"不等于\"参数物理正确\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：砍掉液相浓度梯度的求解（假设均匀）并把电极压缩成单颗粒；高倍率下颗粒表面/液相浓度尖峰被低估，SOP、析锂边界、电压预测在脉冲工况失真。<\/li>\n<li>Q2：10 min = 600 s ≪ 2500 s，颗粒内部远未达到浓度平衡，表面早已逼近饱和——快充 80% 若要安全，必须靠温控、颗粒设计（小 R_s/高 D_s）与表面电位监控兜底，而不是简单的电流规划。<\/li>\n<li>Q3：P2D 参数强相关（可辨识性问题），不同参数组合可给出同样好的电压拟合；只有叠加独立实验（拆解、EIS、不同倍率分层验证）才能锁住物理真值。拟合好只说明\"外特性复现\"，不说明\"内部对了\"。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（含简化机理模型概览与降阶入门）<\/li>\n<li>本课全部数字为教学示意值；P2D/SPM 方程细节见延伸资源经典文献<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>M. Doyle, T. F. Fuller, J. Newman, <em>J. Electrochem. Soc.<\/em>, 1993<\/td><td>A<\/td><td>P2D 框架的原始经典论文（链接 [待补链]）<\/td><\/tr><tr><td>J. Newman &amp; K. E. Thomas-Alyea《Electrochemical Systems》<\/td><td>A<\/td><td>电化学建模经典教材<\/td><\/tr><tr><td>PyBaMM 开源项目<\/td><td>B<\/td><td>Python 电池机理建模库：P2D/SPM 开箱即跑<\/td><\/tr><tr><td>COMSOL Battery Design Module<\/td><td>B<\/td><td>商业偏微分方程建模环境（电池模块）<\/td><\/tr><tr><td>G. Plett《Battery Management Systems》Vol. I（S-16）<\/td><td>B<\/td><td>从 ECM 到简化机理模型的桥梁章节<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>P2D 参数个数与各参数典型量级（20~40 个、D_s = 1×10⁻¹⁴ m²/s 均为示意）的文献佐证<\/li>\n<li>车端降阶机理模型（SPM 类）的量产落地案例<\/li>\n<li>PyBaMM 当前内置模型清单与版本（随项目演进）<\/li>\n<li>数据驱动降阶（NN 代理 P2D）的代表性同行评议文献<\/li>\n<\/ul>", "text": " 对应节点 alg-11 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-10 （必看）、 alg-04 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 alg-10 结尾留了三条\"诚实清单\"：ecm 无机理外推能力、滞回未建模、参数物理意义弱。要回答 \"为什么\"与\"如果……会怎样\" 的问题，必须下到机理层： 设计 ：电芯厂用机理模型定材料参数与极片厚度——没有 ecm 能干这个； 快充边界 ：析锂发生在负极表面电位跌破 0 v（vs li/li⁺）时——只有机理模型能算出这个\"看不见的电位\"（ chg-03 的理论地基，衔接 esoc 视角）； 健康归因 ：把容量衰减分解成 lli/lam（alg-04/05 的机理名词）——ecm 的 r0 涨了给不出原因。 2. 机制展开 2.1 p2d：准二维模型（doyle-fuller-newman 框架） p2d（pseudo-two-dimensional）在 两个维度 上解物理方程： x 维（电极厚度方向） ：液相锂浓度扩散、电荷守恒（液相欧姆 + 固相导电网络）； r 维（颗粒径向） ：活性材料颗粒内部的固相锂扩散（fick 定律）； 界面 ：两相接触面用 butler-volmer 方程描述电化学反应动力学。 参数 20~40 个量级（示意）：固相扩散系数 d_s、反应速率常数、孔隙率、活性面积、电导率……—— 全部要靠实验标定 （拆解电极、gitt/eis/hppc 类测试），且强相关参数之间存在 可辨识性（identifiability）问题 ：拟合得好不代表每个参数都物理正确。 2.2 spm：单颗粒模型（降阶第一刀） spm（single particle model）假设：电解液浓度处处均匀、每种电极压缩成 一个大颗粒 → 只解固相扩散，算力降几个数量级。适用低倍率；倍率高时颗粒表面与本体浓度差被低估——表面\"吃紧\"的时刻看不见（实例 1 的后果）。改进路线：spme（加电解液浓度修正）、pgm 等；进一步的降阶还有谱方法与数据驱动代理模型（用神经网络学 p2d 的输入输出映射， alg-03 思想的模型侧应用）。 2.3 车载现实 p2d 需要数值求解偏微分方程组（状态变量数百个，示意），车端 mcu 无法实时——量产车端仍是 ecm（alg-10）的天下；机理模型在 设计端、台架、云端 （ gen-3 数字孪生的物理内核）发挥价值。 3. 手算实例（数字自洽，均为教学示意值） 实例 1：spm 颗粒扩散时间常数——快充为什么难 石墨负极颗粒半径 r_s = 5 μm，固相扩散系数 d_s = 1×10⁻¹⁴ m²/s（均为示意值，量级参考常见石墨材料）： \\tau_{diff} \\approx \\frac{r_s^2}{d_s} = \\frac{(5\\times10^{-6})^2}{10^{-14}} = \\frac{2.5\\times10^{-11}}{10^{-14}} = 2500\\ \\text{s} \\approx 42\\ \\text{min} 含义：大电流充电时锂\"来不及\"匀进颗粒内部， 表面先饱和 → 表面电位被压向 0 v（vs li/li⁺）→ 析锂窗口打开。这就解释了： 快充能力受固相扩散限制，不是\"充电机功率不够\"； spm 在高倍率失真——它假设颗粒内浓度线性分布，表面尖峰被抹平； 小颗粒/高 d_s 是快充电芯的材料学方向（r²/d 的平方反比关系）。 实例 2：过程时间尺度谱——ecm 的 rc 从哪来 物理过程 特征时间（示意量级） 对应 欧姆传导 ~即时 ecm 的 r0 电荷转移 + 双电层 τ_ct = r_ct·c_dl = 5 mω × 1 f = 5 ms （示意） ecm 的快 rc（秒级段） 固相扩散 2500 s （实例 1） ecm 的慢 rc（分钟级段） ecm 的 1rc/2rc 就是给机理时间尺度配的\"经验替身\"——参数辨识（alg-10）拟合的是这套时间尺度的 外显效果 ，而机理模型直接解它。这张表也解释了 alg-10 为什么 2rc 比 1rc 好：真实电池至少有两个可分的时间尺度。 4. 工程实态 电芯厂设计/快充标定用 p2d（自研代码或商业软件）；学术界与云端普及靠开源工具 pybamm； 云端数字孪生（gen-3）用降阶 spm 做健康归因（lli/lam 分解），与 alg-04 的电极状态、alg-08 的诊断形成\"机理证据链\"； 基于机理模型的多约束优化快充（mpc 类控制）是 chg-03 的进阶方向； 参数标定是最大门槛：一套可信的 p2d 参数库 = 大量拆解 + 电化学测试投入——这是机理模型\"精度高\"的名声与\"用不起\"的现实之间的差距。 5. 常见误区 \"机理模型精度必然高\"——参数不准的 p2d 比 ecm 差得多，且错得更有迷惑性； 把 spm 用于高倍率——表面浓度尖峰被抹平，析锂边界算错（实例 1）； 把拟合优度当参数正确性——可辨识性问题下，多组参数能同样拟合好； 幻想车端跑 p2d——车载实时性是硬边界，降阶/查表/云端是仅有的三条路； 把机理模型与 ecm 对立——量产形态是\"车端 ecm 兜底 + 云端机理增强\"的分工。 6. 自测 q1 ：spm 砍掉了 p2d 的哪些物理？代价在什么工况暴露？ q2 ：42 分钟的固相扩散时间常数，对\"10 分钟快充 80%\"的宣传意味着什么？ q3 ：为什么说\"参数拟合精度高\"不等于\"参数物理正确\"？ 答案 q1：砍掉液相浓度梯度的求解（假设均匀）并把电极压缩成单颗粒；高倍率下颗粒表面/液相浓度尖峰被低估，sop、析锂边界、电压预测在脉冲工况失真。 q2：10 min = 600 s ≪ 2500 s，颗粒内部远未达到浓度平衡，表面早已逼近饱和——快充 80% 若要安全，必须靠温控、颗粒设计（小 r_s/高 d_s）与表面电位监控兜底，而不是简单的电流规划。 q3：p2d 参数强相关（可辨识性问题），不同参数组合可给出同样好的电压拟合；只有叠加独立实验（拆解、eis、不同倍率分层验证）才能锁住物理真值。拟合好只说明\"外特性复现\"，不说明\"内部对了\"。 来源 s-16：g. plett, battery management systems vol. i（含简化机理模型概览与降阶入门） 本课全部数字为教学示意值；p2d/spm 方程细节见延伸资源经典文献 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 m. doyle, t. f. fuller, j. newman, j. electrochem. soc. , 1993 a p2d 框架的原始经典论文（链接 [待补链]） j. newman &amp; k. e. thomas-alyea《electrochemical systems》 a 电化学建模经典教材 pybamm 开源项目 b python 电池机理建模库：p2d/spm 开箱即跑 comsol battery design module b 商业偏微分方程建模环境（电池模块） g. plett《battery management systems》vol. i（s-16） b 从 ecm 到简化机理模型的桥梁章节 待核对项（本课） p2d 参数个数与各参数典型量级（20~40 个、d_s = 1×10⁻¹⁴ m²/s 均为示意）的文献佐证 车端降阶机理模型（spm 类）的量产落地案例 pybamm 当前内置模型清单与版本（随项目演进） 数据驱动降阶（nn 代理 p2d）的代表性同行评议文献 "}, {"id": "ARCH-C", "title": "课程 ARCH-C：集中式 BMS——所有采样线汇到一块板", "dom": "ARCH", "verified": false, "html": "<blockquote><p>对应节点 <code>ARCH-C<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：无硬前置（有 <code>HW-01<\/code>、<code>SYS-01<\/code> 概念更顺）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要（以及为什么它\"够用就好\"）<\/h3>\n<p>集中式（Centralized BMS）是最朴素的 BMS 形态：全部电芯电压/温度采集、SOC（荷电状态）估计、继电器与加热器驱动、整车通信，都在<strong>一个控制器<\/strong>内完成。<\/p>\n<p>工程动机有三条：<\/p>\n<ol>\n<li><strong>少一层通信 = 少一类故障源<\/strong>：没有主从板之间的链路，就没有\"从板掉线\"这种失效模式，安全论证路径全部在一个壳子里（ISO 26262 相关项定义思路，S-07）。<\/li>\n<li><strong>决策零跨板延迟<\/strong>：采样到执行在同一 MCU（微控制器）内，无跨板状态同步问题。<\/li>\n<li><strong>小串数下成本最低<\/strong>：一块板替代\"主控 + 若干从板\"的整套 BOM（物料清单）。<\/li>\n<p>它的上限同样朴素：<strong>所有采样线都要汇到这一个控制器<\/strong>——串数一多，线束与连接器先崩。这正是本课手算的主角。<\/p>\n<\/ol>\n<h3>2. 机制：集中式的三笔账<\/h3>\n<h4>2.1 线束账（规模的天花板）<\/h4>\n<p>n 串电芯需要 n+1 根电压采样线（96 串 = 97 根，教学示意值）；m 个温度传感器按两线制 NTC（Negative Temperature Coefficient，负温度系数热敏电阻）再乘 2。全部采样线经 1~3 个大 pin 数连接器汇入控制器。<\/p>\n<h4>2.2 精度账（线越长越吃亏）<\/h4>\n<p>采样线有电阻，长线上的压降直接混入被测电压。AFE（Analog Front End，模拟前端）输入侧用 RC 滤波与高输入阻抗抑制，但米级长线的毫伏级压降（教学示意值）在 LFP 平台段足以翻译成可观的 SOC 误差（机理见 <code>ALG-01<\/code>）。<\/p>\n<h4>2.3 安全账（单点失效）<\/h4>\n<p>控制器故障 = 全部功能失效。因此集中式通常按 HARA（Hazard Analysis and Risk Assessment，危害分析与风险评估）结果直接扛高 ASIL（Automotive Safety Integrity Level，汽车安全完整性等级）等级，靠板内冗余（双采样通道、看门狗等）满足诊断覆盖（S-07 框架）。<\/p>\n<h3>3. 手算实例：96 串系统的线束账（集中式 vs 主从式）<\/h3>\n<p>设 96 串 NCM（三元）包、16 个温度点、采样线平均 2 m（集中式示意布置）：<\/p>\n<table><thead><tr><th>项目<\/th><th>集中式<\/th><th>主从式（4 从板 × 24 串，对照）<\/th><\/tr><\/thead><tbody><tr><td>电压采样线根数<\/td><td>97<\/td><td>97（分摊到 4 块从板就近布线）<\/td><\/tr><tr><td>采样线平均长度<\/td><td>~2 m<\/td><td>~0.3 m<\/td><\/tr><tr><td>温度采样线<\/td><td>16 × 2 = 32 根<\/td><td>同左，就近<\/td><\/tr><tr><td>板间通信<\/td><td>无<\/td><td>菊花链 ~4 段双绞线<\/td><\/tr><tr><td>线束总长（示意）<\/td><td>~260 m<\/td><td>~45 m<\/td><\/tr><tr><td>连接器<\/td><td>3 个 48 pin（示意）<\/td><td>4 个小连接器 + 1 个主控连接器<\/td><\/tr><tr><td>控制器数量<\/td><td>1<\/td><td>5（1 主 + 4 从）<\/td><\/tr><\/tbody><\/table>\n<p><strong>结论<\/strong>：96 串已在集中式舒适区的边缘；串数再涨，线束、连接器与装配工时会把\"少几块板\"省下的钱吃掉并反转——这就是 ARCH-MS 诞生的机械原因。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>乘用车小容量包（A00 级车型、HEV 功率型小包）仍有集中式量产（工程共识，观点级）。<\/li>\n<li>高串数大包、商用车、储能几乎不再用集中式，被主从式（<code>ARCH-MS<\/code>）取代。<\/li>\n<li>集中式并未消失，而是\"退守\"到性价比最优的小串数区间（观点级）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"集中式精度一定更高\"——采样线更长，压降误差反而可能更大；精度取决于 AFE 与布线，不取决于\"集中\"。<\/li>\n<li>\"集中式一定更便宜\"——只在串数较小时成立；高串数下线束 + 连接器 + 装配工时是隐藏大头。<\/li>\n<li>\"一块板所以更可靠\"——单点失效面更大，内部冗余与诊断覆盖的安全设计难度并不低（S-07）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：192 串的 800V 平台若用集中式，仅电压采样线就有多少根？工程上为什么基本不这么做？ <strong>Q2<\/strong>：线束账和精度账，哪个随串数增长更\"致命\"？为什么？ <strong>Q3<\/strong>：从功能安全角度，集中式相比主从式省掉了哪一类失效模式、又放大了哪一个？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：193 根（n+1，教学示意值）。约 400 m 级线束与多个大连接器汇入单控制器，压降、装配、可靠性全面恶化——这正是 800V 平台转向主从/分布式的推演起点（详见 ARCH-MS）。<\/li>\n<li>Q2：线束账更致命——它随串数线性增长且装配成本同步上涨，无法用电路手段抵消；精度恶化虽也随线长增长，但可通过就近布置 AFE 根治，而这恰恰等于改成主从式。<\/li>\n<li>Q3：省掉\"板间通信链路失效\"一类；放大\"单一控制器失效 = 全功能失效\"的单点，需要内部以更高 ASIL 要求实现冗余与诊断覆盖。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》（BMS 功能与精度框架）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（编号/年份待核对，P-01）<\/li>\n<li>S-07：ISO 26262:2018（相关项定义、ASIL 与诊断覆盖框架）<\/li>\n<li>S-11：ISO 11898 系列（对照：CAN 为何适合板间通信而非百根采样线）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I/II, Artech House, 2015（BMS 功能框架）<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 标准原文<\/td><td>国家标准<\/td><td>[待补链]<\/td><\/tr><tr><td>Davide Andrea, <em>Battery Management Systems for Large Lithium-Ion Battery Packs<\/em>, Artech House, 2010<\/td><td>经典教材（架构分类章节）<\/td><td>[待补链]<\/td><\/tr><tr><td>G. Plett, <em>Battery Management Systems<\/em> Vol. II, Artech House, 2015<\/td><td>经典教材<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>AFE 单芯片通道数（12~18 常见）与输入滤波参数的规格书出处。<\/li>\n<li>\"乘用车小容量包仍有集中式量产\"的具体车型实例与公开来源。<\/li>\n<li>连接器 pin 数、线束总长、压降量级均为教学示意值，无实测出处。<\/li>\n<\/ul>", "text": " 对应节点 arch-c （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置：无硬前置（有 hw-01 、 sys-01 概念更顺）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要（以及为什么它\"够用就好\"） 集中式（centralized bms）是最朴素的 bms 形态：全部电芯电压/温度采集、soc（荷电状态）估计、继电器与加热器驱动、整车通信，都在 一个控制器 内完成。 工程动机有三条： 少一层通信 = 少一类故障源 ：没有主从板之间的链路，就没有\"从板掉线\"这种失效模式，安全论证路径全部在一个壳子里（iso 26262 相关项定义思路，s-07）。 决策零跨板延迟 ：采样到执行在同一 mcu（微控制器）内，无跨板状态同步问题。 小串数下成本最低 ：一块板替代\"主控 + 若干从板\"的整套 bom（物料清单）。 它的上限同样朴素： 所有采样线都要汇到这一个控制器 ——串数一多，线束与连接器先崩。这正是本课手算的主角。 2. 机制：集中式的三笔账 2.1 线束账（规模的天花板） n 串电芯需要 n+1 根电压采样线（96 串 = 97 根，教学示意值）；m 个温度传感器按两线制 ntc（negative temperature coefficient，负温度系数热敏电阻）再乘 2。全部采样线经 1~3 个大 pin 数连接器汇入控制器。 2.2 精度账（线越长越吃亏） 采样线有电阻，长线上的压降直接混入被测电压。afe（analog front end，模拟前端）输入侧用 rc 滤波与高输入阻抗抑制，但米级长线的毫伏级压降（教学示意值）在 lfp 平台段足以翻译成可观的 soc 误差（机理见 alg-01 ）。 2.3 安全账（单点失效） 控制器故障 = 全部功能失效。因此集中式通常按 hara（hazard analysis and risk assessment，危害分析与风险评估）结果直接扛高 asil（automotive safety integrity level，汽车安全完整性等级）等级，靠板内冗余（双采样通道、看门狗等）满足诊断覆盖（s-07 框架）。 3. 手算实例：96 串系统的线束账（集中式 vs 主从式） 设 96 串 ncm（三元）包、16 个温度点、采样线平均 2 m（集中式示意布置）： 项目 集中式 主从式（4 从板 × 24 串，对照） 电压采样线根数 97 97（分摊到 4 块从板就近布线） 采样线平均长度 ~2 m ~0.3 m 温度采样线 16 × 2 = 32 根 同左，就近 板间通信 无 菊花链 ~4 段双绞线 线束总长（示意） ~260 m ~45 m 连接器 3 个 48 pin（示意） 4 个小连接器 + 1 个主控连接器 控制器数量 1 5（1 主 + 4 从） 结论 ：96 串已在集中式舒适区的边缘；串数再涨，线束、连接器与装配工时会把\"少几块板\"省下的钱吃掉并反转——这就是 arch-ms 诞生的机械原因。 4. 工程实态 乘用车小容量包（a00 级车型、hev 功率型小包）仍有集中式量产（工程共识，观点级）。 高串数大包、商用车、储能几乎不再用集中式，被主从式（ arch-ms ）取代。 集中式并未消失，而是\"退守\"到性价比最优的小串数区间（观点级）。 5. 常见误区 \"集中式精度一定更高\"——采样线更长，压降误差反而可能更大；精度取决于 afe 与布线，不取决于\"集中\"。 \"集中式一定更便宜\"——只在串数较小时成立；高串数下线束 + 连接器 + 装配工时是隐藏大头。 \"一块板所以更可靠\"——单点失效面更大，内部冗余与诊断覆盖的安全设计难度并不低（s-07）。 6. 自测 q1 ：192 串的 800v 平台若用集中式，仅电压采样线就有多少根？工程上为什么基本不这么做？ q2 ：线束账和精度账，哪个随串数增长更\"致命\"？为什么？ q3 ：从功能安全角度，集中式相比主从式省掉了哪一类失效模式、又放大了哪一个？ 答案 q1：193 根（n+1，教学示意值）。约 400 m 级线束与多个大连接器汇入单控制器，压降、装配、可靠性全面恶化——这正是 800v 平台转向主从/分布式的推演起点（详见 arch-ms）。 q2：线束账更致命——它随串数线性增长且装配成本同步上涨，无法用电路手段抵消；精度恶化虽也随线长增长，但可通过就近布置 afe 根治，而这恰恰等于改成主从式。 q3：省掉\"板间通信链路失效\"一类；放大\"单一控制器失效 = 全功能失效\"的单点，需要内部以更高 asil 要求实现冗余与诊断覆盖。 来源 s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》（bms 功能与精度框架） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（编号/年份待核对，p-01） s-07：iso 26262:2018（相关项定义、asil 与诊断覆盖框架） s-11：iso 11898 系列（对照：can 为何适合板间通信而非百根采样线） s-16：g. plett, battery management systems vol. i/ii, artech house, 2015（bms 功能框架） 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 gb/t 38661-2020 标准原文 国家标准 [待补链] davide andrea, battery management systems for large lithium-ion battery packs , artech house, 2010 经典教材（架构分类章节） [待补链] g. plett, battery management systems vol. ii, artech house, 2015 经典教材 [待补链] 待核对项（本课） afe 单芯片通道数（12~18 常见）与输入滤波参数的规格书出处。 \"乘用车小容量包仍有集中式量产\"的具体车型实例与公开来源。 连接器 pin 数、线束总长、压降量级均为教学示意值，无实测出处。 "}, {"id": "ARCH-CE", "title": "课程 ARCH-CE：云边协同 BMS——车端管安全，云端管聪明", "dom": "ARCH", "verified": false, "html": "<blockquote><p>对应节点 <code>ARCH-CE<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>ARCH-MS<\/code>、<code>SW-07<\/code>（数据上云）建议先读 ｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：车端的两样稀缺品<\/h3>\n<p>车端有两样永远稀缺的东西：<strong>算力<\/strong>与<strong>数据窗口<\/strong>。<\/p>\n<ul>\n<li>算力：车规 MCU/SoC 要在成本与功耗约束内跑实时任务，跑不动车队级分析与全生命周期仿真；<\/li>\n<li>数据窗口：单车只见\"这辆车\"的这段生命周期；云端见整个车队、整个生命周期。<\/li>\n<p>云边协同（Cloud-Edge Coordination）= 车端实时控制 + 云端数据分析/优化的分工架构（domain 定义）。一句话分工：<strong>安全决策留在车端，聪明长在云端<\/strong>。<\/p>\n<\/ul>\n<h3>2. 机制：分工判据与数据通道<\/h3>\n<h4>2.1 分工判据（背下来）<\/h4>\n<table><thead><tr><th>判据<\/th><th>留车端<\/th><th>上云端<\/th><\/tr><\/thead><tbody><tr><td>时延<\/td><td>ms~百 ms 级闭环<\/td><td>天/周级慢变量<\/td><\/tr><tr><td>失效后果<\/td><td>人身安全<\/td><td>经济性/体验<\/td><\/tr><tr><td>数据范围<\/td><td>本车实时<\/td><td>车队/全生命周期<\/td><\/tr><\/tbody><\/table>\n<p>据此：继电器控制、SOC 实时估计、热失控预警触发、充电安全监控 = 车端；SOH（State of Health，健康状态）趋势分析、老化模型参数再辨识、充电策略优化、故障根因聚类 = 云端。<\/p>\n<h4>2.2 数据通道<\/h4>\n<ul>\n<li><strong>上行<\/strong>：车端数据记录与上云（<code>SW-07<\/code>）受带宽与频次限制（domain 约束）——周期摘要（如 30 s 一帧，教学示意值）+ 事件触发（故障、热事件即传）；<\/li>\n<li><strong>下行<\/strong>：云端产物（参数包、策略、模型）经 OTA（Over-the-Air，空中下载）通道下发，必须走 UN R156（SWUP，Software Update Management System，软件升级管理体系，S-15）合规流程——云端\"建议\"，车端\"验证后采纳\"。<\/li>\n<\/ul>\n<h4>2.3 边界与合规<\/h4>\n<p>安全决策必须留在车端（domain 约束）：链路实时性不可依赖。数据主权归属与隐私合规需界定（domain 约束；工程流程见 ISO/SAE 21434，S-08；国内数据法规细节待核对）。<\/p>\n<h3>3. 工程案例：一条功能链的车云分工推演<\/h3>\n<p>功能：SOC 显示精度优化。分五步走：<\/p>\n<ol>\n<li><strong>车端<\/strong>：安时积分 + EKF（扩展卡尔曼滤波）实时估计，10~100 ms 周期（教学示意值）——断网不受影响；<\/li>\n<li><strong>上云<\/strong>：行车/充电数据摘要上传；<\/li>\n<li><strong>云端<\/strong>：用车队数据对同批次电芯重新辨识 OCV（开路电压）曲线与容量参数，生成参数包；<\/li>\n<li><strong>下发<\/strong>：参数包经 UN R156 流程 OTA 更新车端；<\/li>\n<li><strong>断网推演<\/strong>：车端估计照常，只是参数停止更新——<strong>功能降级而非失效<\/strong>。<\/li>\n<\/ol>\n<table><thead><tr><th>环节<\/th><th>位置<\/th><th>时延尺度<\/th><th>断网影响<\/th><\/tr><\/thead><tbody><tr><td>实时 SOC 估计<\/td><td>车端<\/td><td>10~100 ms<\/td><td>无<\/td><\/tr><tr><td>数据摘要上传<\/td><td>车→云<\/td><td>30 s 级（示意）<\/td><td>暂停（本地缓存）<\/td><\/tr><tr><td>参数再辨识<\/td><td>云端<\/td><td>天/周级<\/td><td>暂停<\/td><\/tr><tr><td>参数包下发<\/td><td>云→车<\/td><td>OTA 周期<\/td><td>暂停<\/td><\/tr><\/tbody><\/table>\n<p>商业化样本：LG Energy Solution 的 B-Lifecare / B.once / B.around / KooRoo 后市场服务矩阵是\"云端电池服务\"的公开案例（S-20；产品现状与细节待核对 P-03）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>头部主机厂与新势力普遍建\"电池云\"（观点级）；上云内容受法规、用户授权与流量成本三重约束。<\/li>\n<li>传什么、多久传一次是标定项而非技术定式，各家差异大（观点级）。<\/li>\n<li>云端结论回车端的通道收敛到 OTA 之后，UN R156 成为架构级依赖（S-15）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"云端可以参与实时控制\"——链路时延与可用性不可依赖，安全闭环必须本地（domain 约束）。<\/li>\n<li>\"数据上得越多越好\"——带宽、隐私、成本三重约束，工程上是\"摘要 + 事件\"而非全量上传。<\/li>\n<li>\"云边协同 = GEN-3\"——云边协同是<strong>架构<\/strong>（本课），GEN-3 是以模型驱动预测为特征的<strong>代际<\/strong>；GEN-2 云端辅助同样跑在云边协同架构上，二者不是一回事。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：把\"热失控预警的最终触发判断\"放到云端执行，错在哪？ <strong>Q2<\/strong>：云端再辨识的参数包为什么不能直接生效？要走什么流程？ <strong>Q3<\/strong>：按分工判据，\"车队级充电策略优化\"与\"快充末端降流执行\"各放在哪里？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：热失控触发是秒级以下的安全闭环，云端链路时延秒级以上且可用性无保证；安全决策必须留在车端，云端最多供给辅助预警信息（domain 约束）。<\/li>\n<li>Q2：参数影响车端安全相关行为，属软件/标定变更，须经 UN R156 软件升级管理体系（S-15）评审、签名下发并由车端验证生效——防止一个坏参数包把好车变坏。<\/li>\n<li>Q3：优化是慢变量、用车队数据 → 云端；末端降流是实时安全闭环 → 车端。云端给策略，车端保执行（教学示意值场景）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-20：LG Energy Solution 后市场服务矩阵（细节待核对 P-03）<\/li>\n<li>S-15：UN R156（软件升级管理体系）<\/li>\n<li>S-08：ISO/SAE 21434:2021（网络安全工程流程）<\/li>\n<li>S-11：ISO 11898 系列（车端通信底座）<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>UN R156 法规原文<\/td><td>UN 法规<\/td><td>[待补链]<\/td><\/tr><tr><td>ISO/SAE 21434:2021 标准原文<\/td><td>国际标准<\/td><td>[待补链]<\/td><\/tr><tr><td>本项目课程 <code>SW-07-数据记录与上云.md<\/code><\/td><td>内部课程<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>上传频次（30 s 级）为教学示意值，行业实际差异大，待公开资料。<\/li>\n<li>LG 四项服务的现状与产品定义（P-03）。<\/li>\n<li>国内汽车数据安全管理相关法规的名称与适用条款（核对后回填，本课不断言）。<\/li>\n<\/ul>", "text": " 对应节点 arch-ce （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： arch-ms 、 sw-07 （数据上云）建议先读 ｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：车端的两样稀缺品 车端有两样永远稀缺的东西： 算力 与 数据窗口 。 算力：车规 mcu/soc 要在成本与功耗约束内跑实时任务，跑不动车队级分析与全生命周期仿真； 数据窗口：单车只见\"这辆车\"的这段生命周期；云端见整个车队、整个生命周期。 云边协同（cloud-edge coordination）= 车端实时控制 + 云端数据分析/优化的分工架构（domain 定义）。一句话分工： 安全决策留在车端，聪明长在云端 。 2. 机制：分工判据与数据通道 2.1 分工判据（背下来） 判据 留车端 上云端 时延 ms~百 ms 级闭环 天/周级慢变量 失效后果 人身安全 经济性/体验 数据范围 本车实时 车队/全生命周期 据此：继电器控制、soc 实时估计、热失控预警触发、充电安全监控 = 车端；soh（state of health，健康状态）趋势分析、老化模型参数再辨识、充电策略优化、故障根因聚类 = 云端。 2.2 数据通道 上行 ：车端数据记录与上云（ sw-07 ）受带宽与频次限制（domain 约束）——周期摘要（如 30 s 一帧，教学示意值）+ 事件触发（故障、热事件即传）； 下行 ：云端产物（参数包、策略、模型）经 ota（over-the-air，空中下载）通道下发，必须走 un r156（swup，software update management system，软件升级管理体系，s-15）合规流程——云端\"建议\"，车端\"验证后采纳\"。 2.3 边界与合规 安全决策必须留在车端（domain 约束）：链路实时性不可依赖。数据主权归属与隐私合规需界定（domain 约束；工程流程见 iso/sae 21434，s-08；国内数据法规细节待核对）。 3. 工程案例：一条功能链的车云分工推演 功能：soc 显示精度优化。分五步走： 车端 ：安时积分 + ekf（扩展卡尔曼滤波）实时估计，10~100 ms 周期（教学示意值）——断网不受影响； 上云 ：行车/充电数据摘要上传； 云端 ：用车队数据对同批次电芯重新辨识 ocv（开路电压）曲线与容量参数，生成参数包； 下发 ：参数包经 un r156 流程 ota 更新车端； 断网推演 ：车端估计照常，只是参数停止更新—— 功能降级而非失效 。 环节 位置 时延尺度 断网影响 实时 soc 估计 车端 10~100 ms 无 数据摘要上传 车→云 30 s 级（示意） 暂停（本地缓存） 参数再辨识 云端 天/周级 暂停 参数包下发 云→车 ota 周期 暂停 商业化样本：lg energy solution 的 b-lifecare / b.once / b.around / kooroo 后市场服务矩阵是\"云端电池服务\"的公开案例（s-20；产品现状与细节待核对 p-03）。 4. 工程实态 头部主机厂与新势力普遍建\"电池云\"（观点级）；上云内容受法规、用户授权与流量成本三重约束。 传什么、多久传一次是标定项而非技术定式，各家差异大（观点级）。 云端结论回车端的通道收敛到 ota 之后，un r156 成为架构级依赖（s-15）。 5. 常见误区 \"云端可以参与实时控制\"——链路时延与可用性不可依赖，安全闭环必须本地（domain 约束）。 \"数据上得越多越好\"——带宽、隐私、成本三重约束，工程上是\"摘要 + 事件\"而非全量上传。 \"云边协同 = gen-3\"——云边协同是 架构 （本课），gen-3 是以模型驱动预测为特征的 代际 ；gen-2 云端辅助同样跑在云边协同架构上，二者不是一回事。 6. 自测 q1 ：把\"热失控预警的最终触发判断\"放到云端执行，错在哪？ q2 ：云端再辨识的参数包为什么不能直接生效？要走什么流程？ q3 ：按分工判据，\"车队级充电策略优化\"与\"快充末端降流执行\"各放在哪里？ 答案 q1：热失控触发是秒级以下的安全闭环，云端链路时延秒级以上且可用性无保证；安全决策必须留在车端，云端最多供给辅助预警信息（domain 约束）。 q2：参数影响车端安全相关行为，属软件/标定变更，须经 un r156 软件升级管理体系（s-15）评审、签名下发并由车端验证生效——防止一个坏参数包把好车变坏。 q3：优化是慢变量、用车队数据 → 云端；末端降流是实时安全闭环 → 车端。云端给策略，车端保执行（教学示意值场景）。 来源 s-20：lg energy solution 后市场服务矩阵（细节待核对 p-03） s-15：un r156（软件升级管理体系） s-08：iso/sae 21434:2021（网络安全工程流程） s-11：iso 11898 系列（车端通信底座） 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 un r156 法规原文 un 法规 [待补链] iso/sae 21434:2021 标准原文 国际标准 [待补链] 本项目课程 sw-07-数据记录与上云.md 内部课程 [待补链] 待核对项（本课） 上传频次（30 s 级）为教学示意值，行业实际差异大，待公开资料。 lg 四项服务的现状与产品定义（p-03）。 国内汽车数据安全管理相关法规的名称与适用条款（核对后回填，本课不断言）。 "}, {"id": "ARCH-D", "title": "课程 ARCH-D：分布式 BMS——没有\"主\"的架构", "dom": "ARCH", "verified": false, "html": "<blockquote><p>对应节点 <code>ARCH-D<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>ARCH-C<\/code>、<code>ARCH-MS<\/code>（建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：决策也要摊开<\/h3>\n<p>主从式解决了\"采样线汇聚\"，但<strong>主板仍是单点<\/strong>：它挂了，整包失智。分布式（Distributed BMS）把控制权也摊开：多个节点对等协同，无单一主控中心（domain 定义）。<\/p>\n<p>适用动机：<\/p>\n<ol>\n<li><strong>模块化可扩展<\/strong>：簇数不定的系统（储能柜、特种车辆可换电池箱），\"每节点自治 + 协议协同\"比\"换一块更大的主板\"好扩展；<\/li>\n<li><strong>无单点主控<\/strong>的要求场景；<\/li>\n<li><strong>地理分散<\/strong>的大系统：单一主控的接线半径与可靠性都不够用。<\/li>\n<\/ol>\n<h3>2. 机制：对等协同的代价<\/h3>\n<h4>2.1 每个节点都要\"自给自足\"<\/h4>\n<p>独立供电（隔离 DC/DC）、独立通信收发器、独立 MCU——每节点成本上升（domain 约束）。主从式从板可以共享主板的许多资源，分布式不能，这是分布式 BOM（物料清单）溢价的根源。<\/p>\n<h4>2.2 协同靠协议不靠中心<\/h4>\n<ul>\n<li>CAN 本身就是多主总线（ISO 11898，S-11）：节点按 ID 仲裁发送消息——但<strong>链路层多主 ≠ 应用层有权决策<\/strong>；<\/li>\n<li>决策一致性：谁有权下令断高压？需要协议层预定义（固定角色 + 冗余备份、超时接管等，示意机制）；<\/li>\n<li>失效模式分散：单节点故障只影响局部，但故障管理逻辑复杂度上升（domain 约束）。<\/li>\n<\/ul>\n<h4>2.3 术语辨析（重要）<\/h4>\n<p>业界常把\"从板物理分散\"的主从式也叫\"分布式\"，必须分清口径：<\/p>\n<table><thead><tr><th>口径<\/th><th>采样位置<\/th><th>决策位置<\/th><th>本项目口径<\/th><\/tr><\/thead><tbody><tr><td>集中式<\/td><td>汇聚一点<\/td><td>一点<\/td><td><code>ARCH-C<\/code><\/td><\/tr><tr><td>主从式<\/td><td>模组就近<\/td><td>集中在主板<\/td><td><code>ARCH-MS<\/code><\/td><\/tr><tr><td>分布式<\/td><td>模组就近<\/td><td>分散到各节点<\/td><td>本课<\/td><\/tr><\/tbody><\/table>\n<h3>3. 手算实例：8 模组储能簇的成本与失效账<\/h3>\n<p>设 8 个模组、每模组 16 串（教学示意值）。对比主从式（8 从板 + 1 主控）与分布式（8 个对等节点）：<\/p>\n<table><thead><tr><th>项目<\/th><th>主从式<\/th><th>分布式<\/th><\/tr><\/thead><tbody><tr><td>控制器数量<\/td><td>9（1 主 8 从）<\/td><td>8<\/td><\/tr><tr><td>单节点必备件<\/td><td>AFE + 均衡 + 通信接口<\/td><td>AFE + 均衡 + MCU + 隔离电源 + 收发器<\/td><\/tr><tr><td>单节点 BOM 相对水平<\/td><td>1.0（基准）<\/td><td>1.5~2.0（示意）<\/td><\/tr><tr><td>全簇 BOM 相对水平<\/td><td>1.0（基准）<\/td><td>1.2~1.4（示意）<\/td><\/tr><tr><td>主控失效后果<\/td><td>整簇失智（需降级设计）<\/td><td>不存在此单点<\/td><\/tr><tr><td>单节点失效影响<\/td><td>16 串失明<\/td><td>16 串失明 + 需协议补位<\/td><\/tr><tr><td>扩展到 16 模组<\/td><td>主控负载/总线需重核算<\/td><td>新节点入网即可<\/td><\/tr><\/tbody><\/table>\n<p><strong>结论<\/strong>：分布式用约 20~40% 的 BOM 溢价（教学示意值）购买\"无单点主控\"与\"可扩展性\"——只在这两个属性真值钱的场景划算。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>纯对等分布式在乘用车动力电池中极少量产（观点级）；行业语境说\"分布式\"多指主从式的从板物理分散。<\/li>\n<li>储能系统的簇级管理（BMU/CMU 分层 + 环网冗余等，叫法待核对）更接近分布式思路（观点级）。<\/li>\n<li>模块化商用车辆与换电包采用对等协同以支持\"任意组合上架\"（观点级）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 CTP + 从板分散叫\"分布式架构\"——物理分散 ≠ 控制权分散，判据看决策位置。<\/li>\n<li>\"分布式天然更可靠\"——软件协同、状态一致性、竞态决策是新的可靠性敌人；没有失效补位协议，反而更脆。<\/li>\n<li>\"分布式省成本\"——省的是主控一份钱，涨的是 N 份\"自给自足\"（隔离电源/收发器/MCU），小系统净亏。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：8 模组簇扩到 16 模组，主从式与分布式各要改什么？ <strong>Q2<\/strong>：CAN 链路层多主，为什么仍不能自动解决分布式的\"谁有权断高压\"问题？ <strong>Q3<\/strong>：分布式节点失效后的\"协议补位\"指什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：主从式要核算主控负载与总线（或加级联网关），主板可能要换更大算力；分布式只需新节点按协议入网——扩展性差异正是本架构的存在理由（教学示意值场景）。<\/li>\n<li>Q2：CAN 的多主是链路层仲裁（谁都能发帧），不含\"谁有权做安全决策\"的应用层语义；后者须由协议与功能安全设计显式定义（角色、优先级、超时接管，S-07 框架）。<\/li>\n<li>Q3：指预定义的失效接管逻辑：某节点失联后，其安全职责（如该模组的过压判断）由邻居节点或系统级兜底机制接管，系统降容运行而非整簇停机（示意机制，具体策略项目自定义）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-11：ISO 11898 系列（CAN 多主仲裁与网络管理）<\/li>\n<li>S-07：ISO 26262:2018（分布式系统的安全论证框架）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 技术条件）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（待核对，P-01）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I/II, Artech House, 2015<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>ISO 11898-1:2015（CAN 数据链路层与仲裁）<\/td><td>国际标准原文<\/td><td>[待补链]<\/td><\/tr><tr><td>Davide Andrea, <em>Battery Management Systems for Large Lithium-Ion Battery Packs<\/em>, Artech House, 2010<\/td><td>经典教材（分布式拓扑章节）<\/td><td>[待补链]<\/td><\/tr><tr><td>GB/T 38661-2020 标准原文<\/td><td>国家标准<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>储能簇级管理\"BMU + CMU\"等叫法与层级划分的行业出处。<\/li>\n<li>分布式 vs 主从式 BOM 溢价（20~40%）为教学示意值，无公开基准。<\/li>\n<li>乘用车纯对等分布式量产案例：待补充（若有请投喂）。<\/li>\n<\/ul>", "text": " 对应节点 arch-d （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： arch-c 、 arch-ms （建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：决策也要摊开 主从式解决了\"采样线汇聚\"，但 主板仍是单点 ：它挂了，整包失智。分布式（distributed bms）把控制权也摊开：多个节点对等协同，无单一主控中心（domain 定义）。 适用动机： 模块化可扩展 ：簇数不定的系统（储能柜、特种车辆可换电池箱），\"每节点自治 + 协议协同\"比\"换一块更大的主板\"好扩展； 无单点主控 的要求场景； 地理分散 的大系统：单一主控的接线半径与可靠性都不够用。 2. 机制：对等协同的代价 2.1 每个节点都要\"自给自足\" 独立供电（隔离 dc/dc）、独立通信收发器、独立 mcu——每节点成本上升（domain 约束）。主从式从板可以共享主板的许多资源，分布式不能，这是分布式 bom（物料清单）溢价的根源。 2.2 协同靠协议不靠中心 can 本身就是多主总线（iso 11898，s-11）：节点按 id 仲裁发送消息——但 链路层多主 ≠ 应用层有权决策 ； 决策一致性：谁有权下令断高压？需要协议层预定义（固定角色 + 冗余备份、超时接管等，示意机制）； 失效模式分散：单节点故障只影响局部，但故障管理逻辑复杂度上升（domain 约束）。 2.3 术语辨析（重要） 业界常把\"从板物理分散\"的主从式也叫\"分布式\"，必须分清口径： 口径 采样位置 决策位置 本项目口径 集中式 汇聚一点 一点 arch-c 主从式 模组就近 集中在主板 arch-ms 分布式 模组就近 分散到各节点 本课 3. 手算实例：8 模组储能簇的成本与失效账 设 8 个模组、每模组 16 串（教学示意值）。对比主从式（8 从板 + 1 主控）与分布式（8 个对等节点）： 项目 主从式 分布式 控制器数量 9（1 主 8 从） 8 单节点必备件 afe + 均衡 + 通信接口 afe + 均衡 + mcu + 隔离电源 + 收发器 单节点 bom 相对水平 1.0（基准） 1.5~2.0（示意） 全簇 bom 相对水平 1.0（基准） 1.2~1.4（示意） 主控失效后果 整簇失智（需降级设计） 不存在此单点 单节点失效影响 16 串失明 16 串失明 + 需协议补位 扩展到 16 模组 主控负载/总线需重核算 新节点入网即可 结论 ：分布式用约 20~40% 的 bom 溢价（教学示意值）购买\"无单点主控\"与\"可扩展性\"——只在这两个属性真值钱的场景划算。 4. 工程实态 纯对等分布式在乘用车动力电池中极少量产（观点级）；行业语境说\"分布式\"多指主从式的从板物理分散。 储能系统的簇级管理（bmu/cmu 分层 + 环网冗余等，叫法待核对）更接近分布式思路（观点级）。 模块化商用车辆与换电包采用对等协同以支持\"任意组合上架\"（观点级）。 5. 常见误区 把 ctp + 从板分散叫\"分布式架构\"——物理分散 ≠ 控制权分散，判据看决策位置。 \"分布式天然更可靠\"——软件协同、状态一致性、竞态决策是新的可靠性敌人；没有失效补位协议，反而更脆。 \"分布式省成本\"——省的是主控一份钱，涨的是 n 份\"自给自足\"（隔离电源/收发器/mcu），小系统净亏。 6. 自测 q1 ：8 模组簇扩到 16 模组，主从式与分布式各要改什么？ q2 ：can 链路层多主，为什么仍不能自动解决分布式的\"谁有权断高压\"问题？ q3 ：分布式节点失效后的\"协议补位\"指什么？ 答案 q1：主从式要核算主控负载与总线（或加级联网关），主板可能要换更大算力；分布式只需新节点按协议入网——扩展性差异正是本架构的存在理由（教学示意值场景）。 q2：can 的多主是链路层仲裁（谁都能发帧），不含\"谁有权做安全决策\"的应用层语义；后者须由协议与功能安全设计显式定义（角色、优先级、超时接管，s-07 框架）。 q3：指预定义的失效接管逻辑：某节点失联后，其安全职责（如该模组的过压判断）由邻居节点或系统级兜底机制接管，系统降容运行而非整簇停机（示意机制，具体策略项目自定义）。 来源 s-11：iso 11898 系列（can 多主仲裁与网络管理） s-07：iso 26262:2018（分布式系统的安全论证框架） s-03：gb/t 38661-2020（bms 技术条件） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（待核对，p-01） s-16：g. plett, battery management systems vol. i/ii, artech house, 2015 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 iso 11898-1:2015（can 数据链路层与仲裁） 国际标准原文 [待补链] davide andrea, battery management systems for large lithium-ion battery packs , artech house, 2010 经典教材（分布式拓扑章节） [待补链] gb/t 38661-2020 标准原文 国家标准 [待补链] 待核对项（本课） 储能簇级管理\"bmu + cmu\"等叫法与层级划分的行业出处。 分布式 vs 主从式 bom 溢价（20~40%）为教学示意值，无公开基准。 乘用车纯对等分布式量产案例：待补充（若有请投喂）。 "}, {"id": "ARCH-MS", "title": "课程 ARCH-MS：主从式 BMS——量产世界的主流形态", "dom": "ARCH", "verified": false, "html": "<blockquote><p>对应节点 <code>ARCH-MS<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>ARCH-C<\/code>（建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：集中式的天花板来了<\/h3>\n<p>集中式的死穴是\"所有采样线汇到一个控制器\"。主从式（Master-Slave BMS）的解法一句话：<strong>AFE 搬进模组，数字量回来<\/strong>。<\/p>\n<ul>\n<li>从板（从控板，常称 CMC/CSC——Cell Module Controller / Cell Supervision Circuit）：就近采集电压/温度、执行均衡，只回传<strong>数字量<\/strong>；<\/li>\n<li>主板（BMU，Battery Management Unit，电池管理单元）：集中决策——SOC/SOP 估计、继电器控制、整车 CAN 通信。<\/li>\n<p>大多数量产 BMS 是这个形态（domain 节点关联，观点级）。学习 SYS/ALG 域前建议先掌握本节点——后面讲的多数功能默认落在这种架构上。<\/p>\n<\/ul>\n<h3>2. 机制：主从式要额外操心什么<\/h3>\n<h4>2.1 通信链路成为安全路径<\/h4>\n<p>从板数据是所有算法的输入，链路失效 = \"失明\"。两条主流路线：<\/p>\n<ul>\n<li>CAN 总线（ISO 11898，S-11）：总线型，主从共享整车/包内总线；<\/li>\n<li>隔离菊花链（daisy chain）：AFE 专有隔离接口双绞线首尾级联，省一套完整协议栈。<\/li>\n<p>无论哪种都需要<strong>诊断覆盖<\/strong>：丢帧计数、CRC 校验、超时判定，并接入 UDS（Unified Diagnostic Services，统一诊断服务，ISO 14229-1，S-09）供诊断仪读出。<\/p>\n<\/ul>\n<h4>2.2 ASIL 分解<\/h4>\n<p>安全目标落在\"整包\"层面，主从各自承担一部分：典型分解是主板执行安全路径、从板提供冗余/监控信息（或反向），具体依 HARA 而定（ISO 26262，S-07；展开见 <code>SAFE-03<\/code>）。从板因此不再是\"傻采样的\"，而是安全论证的一环。<\/p>\n<h4>2.3 物理约束<\/h4>\n<p>从板布局<strong>绑定模组结构<\/strong>（domain 约束）：模组改设计，从板的通道排布、连接器位置、固定方式全要跟着改——这是主从式做\"平台化\"的主要摩擦点（跨车型复用见 <code>SYS-05<\/code>）。<\/p>\n<h3>3. 工程案例：400V vs 800V 平台的架构推演<\/h3>\n<p>用同一颗标称 3.6 V 的 NCM 电芯（教学示意值）推演两种电压平台：<\/p>\n<table><thead><tr><th>项目<\/th><th>400V 平台<\/th><th>800V 平台<\/th><\/tr><\/thead><tbody><tr><td>串数（示意）<\/td><td>96 串（标称 ~346 V）<\/td><td>192 串（标称 ~691 V）<\/td><\/tr><tr><td>集中式采样线（对照）<\/td><td>97 根 × ~2 m<\/td><td>193 根 × ~2 m（不可行区）<\/td><\/tr><tr><td>主从式从板配置<\/td><td>4 从板 × 24 串<\/td><td>8 从板 × 24 串<\/td><\/tr><tr><td>板间菊花链<\/td><td>4 段<\/td><td>8 段<\/td><\/tr><tr><td>本地采样线总长<\/td><td>~30 m<\/td><td>~60 m<\/td><\/tr><tr><td>单从板失效影响<\/td><td>24 串失明（占 25%）<\/td><td>24 串失明（占 12.5%）<\/td><\/tr><\/tbody><\/table>\n<p><strong>推演结论<\/strong>：电压翻倍 → 串数翻倍 → 集中式线束翻倍而进入不可行区；主从式只是\"多加几块从板\"，结构完全可复制。这就是 800V 平台加速主从/分布式渗透的机械原因——<strong>架构选择跟着电压平台走<\/strong>。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>从板物理形态：贴模组端板、插箱侧板；CTP（Cell-to-Pack，电芯直接成包）趋势下进一步融进包结构件（观点级）。<\/li>\n<li>每板串数常见 12~24 串（AFE 单芯片 12~18 通道级联，教学示意值，待 <code>HW-01<\/code> 细化）。<\/li>\n<li>每块从板可寻址、可读 DTC（故障码）是量产准入事实（S-09；国标条款见 S-03）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"主从式 = 分布式\"——主从式仍是<strong>集中决策<\/strong>，从板只是采样前端；分布式（<code>ARCH-D<\/code>）连决策权都分散。<\/li>\n<li>\"从板只采样，坏了不影响安全\"——从板失效模式必须进 FMEA（失效模式与影响分析）与 ASIL 分解，链路丢失时系统要进入安全态（<code>FLT-03<\/code>）。<\/li>\n<li>\"菊花链一定优于 CAN\"——菊花链省协议栈但拓扑脆弱（一处断则后续全断，需冗余设计）；CAN 成熟但占总线资源。取舍依项目而定（观点级）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：800V 平台 192 串改用 12 串/从板，需要几块从板？板间菊花链段数与 24 串/板方案相比如何变化？ <strong>Q2<\/strong>：为什么\"从板布局绑定模组结构\"是平台化的摩擦点？ <strong>Q3<\/strong>：ASIL 分解中若从板承担\"监控\"角色，主板失效后系统靠什么进入安全态？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：192/12 = 16 块；菊花链从 8 段增到 16 段（教学示意值）。每板串数越少，节点与链路段数越多——\"每板串数\"是采集密度与链路复杂度的取舍点。<\/li>\n<li>Q2：从板的通道排布、连接器位置、固定方式都匹配特定模组；换模组设计 = 重新开发从板，跨车型复用率低，摊薄不了开发成本。<\/li>\n<li>Q3：靠分解时约定的<strong>独立关断路径<\/strong>：从板（或独立监控器件）检测到主板失效后，经与主板无关的路径触发继电器断开/进入安全态（<code>SAFE-03<\/code>、<code>FLT-04<\/code>）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（ASIL 分解与冗余监控）<\/li>\n<li>S-09：ISO 14229-1（UDS 诊断覆盖从板）<\/li>\n<li>S-11：ISO 11898 系列（CAN 板间通信）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 技术条件）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（待核对，P-01）<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 第 5/9 部分（硬件与 ASIL 分解）<\/td><td>国际标准原文<\/td><td>[待补链]<\/td><\/tr><tr><td>Davide Andrea, <em>Battery Management Systems for Large Lithium-Ion Battery Packs<\/em>, Artech House, 2010<\/td><td>经典教材（modular/master-slave 分类）<\/td><td>[待补链]<\/td><\/tr><tr><td>GB/T 38661-2020 标准原文<\/td><td>国家标准<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>\"大多数量产 BMS 是主从式\"的统计口径与公开来源。<\/li>\n<li>AFE 单芯片通道数与典型从板串数（12/16/18/24 串）的规格书出处。<\/li>\n<li>400V/800V 平台串数（96/192 串）为教学示意值；实际车型随电芯电压与平台定义而异。<\/li>\n<\/ul>", "text": " 对应节点 arch-ms （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： arch-c （建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：集中式的天花板来了 集中式的死穴是\"所有采样线汇到一个控制器\"。主从式（master-slave bms）的解法一句话： afe 搬进模组，数字量回来 。 从板（从控板，常称 cmc/csc——cell module controller / cell supervision circuit）：就近采集电压/温度、执行均衡，只回传 数字量 ； 主板（bmu，battery management unit，电池管理单元）：集中决策——soc/sop 估计、继电器控制、整车 can 通信。 大多数量产 bms 是这个形态（domain 节点关联，观点级）。学习 sys/alg 域前建议先掌握本节点——后面讲的多数功能默认落在这种架构上。 2. 机制：主从式要额外操心什么 2.1 通信链路成为安全路径 从板数据是所有算法的输入，链路失效 = \"失明\"。两条主流路线： can 总线（iso 11898，s-11）：总线型，主从共享整车/包内总线； 隔离菊花链（daisy chain）：afe 专有隔离接口双绞线首尾级联，省一套完整协议栈。 无论哪种都需要 诊断覆盖 ：丢帧计数、crc 校验、超时判定，并接入 uds（unified diagnostic services，统一诊断服务，iso 14229-1，s-09）供诊断仪读出。 2.2 asil 分解 安全目标落在\"整包\"层面，主从各自承担一部分：典型分解是主板执行安全路径、从板提供冗余/监控信息（或反向），具体依 hara 而定（iso 26262，s-07；展开见 safe-03 ）。从板因此不再是\"傻采样的\"，而是安全论证的一环。 2.3 物理约束 从板布局 绑定模组结构 （domain 约束）：模组改设计，从板的通道排布、连接器位置、固定方式全要跟着改——这是主从式做\"平台化\"的主要摩擦点（跨车型复用见 sys-05 ）。 3. 工程案例：400v vs 800v 平台的架构推演 用同一颗标称 3.6 v 的 ncm 电芯（教学示意值）推演两种电压平台： 项目 400v 平台 800v 平台 串数（示意） 96 串（标称 ~346 v） 192 串（标称 ~691 v） 集中式采样线（对照） 97 根 × ~2 m 193 根 × ~2 m（不可行区） 主从式从板配置 4 从板 × 24 串 8 从板 × 24 串 板间菊花链 4 段 8 段 本地采样线总长 ~30 m ~60 m 单从板失效影响 24 串失明（占 25%） 24 串失明（占 12.5%） 推演结论 ：电压翻倍 → 串数翻倍 → 集中式线束翻倍而进入不可行区；主从式只是\"多加几块从板\"，结构完全可复制。这就是 800v 平台加速主从/分布式渗透的机械原因—— 架构选择跟着电压平台走 。 4. 工程实态 从板物理形态：贴模组端板、插箱侧板；ctp（cell-to-pack，电芯直接成包）趋势下进一步融进包结构件（观点级）。 每板串数常见 12~24 串（afe 单芯片 12~18 通道级联，教学示意值，待 hw-01 细化）。 每块从板可寻址、可读 dtc（故障码）是量产准入事实（s-09；国标条款见 s-03）。 5. 常见误区 \"主从式 = 分布式\"——主从式仍是 集中决策 ，从板只是采样前端；分布式（ arch-d ）连决策权都分散。 \"从板只采样，坏了不影响安全\"——从板失效模式必须进 fmea（失效模式与影响分析）与 asil 分解，链路丢失时系统要进入安全态（ flt-03 ）。 \"菊花链一定优于 can\"——菊花链省协议栈但拓扑脆弱（一处断则后续全断，需冗余设计）；can 成熟但占总线资源。取舍依项目而定（观点级）。 6. 自测 q1 ：800v 平台 192 串改用 12 串/从板，需要几块从板？板间菊花链段数与 24 串/板方案相比如何变化？ q2 ：为什么\"从板布局绑定模组结构\"是平台化的摩擦点？ q3 ：asil 分解中若从板承担\"监控\"角色，主板失效后系统靠什么进入安全态？ 答案 q1：192/12 = 16 块；菊花链从 8 段增到 16 段（教学示意值）。每板串数越少，节点与链路段数越多——\"每板串数\"是采集密度与链路复杂度的取舍点。 q2：从板的通道排布、连接器位置、固定方式都匹配特定模组；换模组设计 = 重新开发从板，跨车型复用率低，摊薄不了开发成本。 q3：靠分解时约定的 独立关断路径 ：从板（或独立监控器件）检测到主板失效后，经与主板无关的路径触发继电器断开/进入安全态（ safe-03 、 flt-04 ）。 来源 s-07：iso 26262:2018（asil 分解与冗余监控） s-09：iso 14229-1（uds 诊断覆盖从板） s-11：iso 11898 系列（can 板间通信） s-03：gb/t 38661-2020（bms 技术条件） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（待核对，p-01） 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 iso 26262:2018 第 5/9 部分（硬件与 asil 分解） 国际标准原文 [待补链] davide andrea, battery management systems for large lithium-ion battery packs , artech house, 2010 经典教材（modular/master-slave 分类） [待补链] gb/t 38661-2020 标准原文 国家标准 [待补链] 待核对项（本课） \"大多数量产 bms 是主从式\"的统计口径与公开来源。 afe 单芯片通道数与典型从板串数（12/16/18/24 串）的规格书出处。 400v/800v 平台串数（96/192 串）为教学示意值；实际车型随电芯电压与平台定义而异。 "}, {"id": "ARCH-W", "title": "课程 ARCH-W：无线 BMS（wBMS）——把最后一捆线剪掉", "dom": "ARCH", "verified": false, "html": "<blockquote><p>对应节点 <code>ARCH-W<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>ARCH-MS<\/code>、<code>SAFE-03<\/code>（ASIL 分解）建议先读 ｜ 预计用时 35 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：连接器与线束的\"最后一公里\"<\/h3>\n<p>主从式把采样线缩到了模组内，但<strong>从板到主板的通信线<\/strong>以及配套连接器仍在——它们是装配工时、故障率、重量与布局自由度的四大消耗。无线 BMS（wireless BMS，wBMS）用无线链路替代模组间通信线束（domain 定义）。<\/p>\n<p>先画清边界：wBMS 剪的是<strong>模组间通信线<\/strong>；模组内 AFE（模拟前端）到电芯极柱的采样线仍然存在。\"全无线\"是误解。<\/p>\n<h3>2. 机制：无线链路怎么扛安全责任<\/h3>\n<h4>2.1 射频与调度<\/h4>\n<ul>\n<li>典型频段 2.4 GHz 专有协议（TI 方案，S-18；协议细节待核对）；<\/li>\n<li>确定性调度：各节点按时隙发送（TDMA 类，Time Division Multiple Access，时分多址，机制示意），保证每个采样周期所有节点数据齐全；<\/li>\n<li>链路周期 ms 级（教学示意值）；节点失联按超时进入预定义安全态。<\/li>\n<\/ul>\n<h4>2.2 安全新账本<\/h4>\n<p>无线链路承载安全相关信息，三件事必须做：<\/p>\n<ol>\n<li><strong>ASIL 分解<\/strong>：链路失效不能导致危害——节点本地保持\"失联即安全\"策略（S-07 框架）；<\/li>\n<li><strong>加密与认证<\/strong>：防伪造与重放，密钥管理是新增子系统；<\/li>\n<li><strong>网络安全管理体系<\/strong>：UN R155（CSMS，Cyber Security Management System，网络安全管理体系，S-14）+ ISO/SAE 21434（S-08）流程覆盖，含售后换模组时的重新配对与密钥更新。<\/li>\n<\/ol>\n<h4>2.3 整车级约束<\/h4>\n<p>射频认证与整车 EMC（Electromagnetic Compatibility，电磁兼容）兼容（domain 约束）：与车内其他无线系统共存需按整车认证流程验证。<\/p>\n<h3>3. 工程案例：96 串包\"有线 vs 无线\"的连接器账<\/h3>\n<p>设 96 串、8 模组 × 12 串、模组间通信线平均 1 m（教学示意值）：<\/p>\n<table><thead><tr><th>项目<\/th><th>有线主从式<\/th><th>wBMS<\/th><\/tr><\/thead><tbody><tr><td>模组间通信线<\/td><td>8 段双绞线（~8 m）<\/td><td>0<\/td><\/tr><tr><td>通信连接器<\/td><td>10+ 个（示意）<\/td><td>0（射频免接触）<\/td><\/tr><tr><td>模组内采样线<\/td><td>保留<\/td><td>保留（~0.2 m/串，示意）<\/td><\/tr><tr><td>节点硬件<\/td><td>从板：AFE + 通信<\/td><td>无线节点：AFE + MCU + 射频（单芯片方案，示意）<\/td><\/tr><tr><td>布局自由度<\/td><td>绑定线束走向<\/td><td>模组可独立取出/更换<\/td><\/tr><tr><td>新增工程量<\/td><td>—<\/td><td>密钥管理、EMC 验证、售后配对<\/td><\/tr><\/tbody><\/table>\n<p><strong>结论<\/strong>：省的是连接器与装配工时这类\"隐性成本\"，付的是射频安全设计这类\"显性工程量\"——总账是否划算取决于产量与平台复用度（观点级）。<\/p>\n<p><strong>工程实态更正（2026-11-06 核实；一手来源 2026-11-10 追溯完成）<\/strong>：GM Ultium 平台的无线 BMS 采用的是 <strong>ADI（Analog Devices）wBMS 方案<\/strong>——GM 宣称无线化使电池包线束减少约 90%、ADI 称省 15% 包体积，一手出处为 <strong>2020-09-09 GM×ADI 发布<\/strong>（Forbes 2020-09-09 / Electronic Design 2020-09-21 / T&amp;D World 2020-11-05，S-64）；<strong>TI 于 2021 年 1 月单独发布自家 wBMS 方案<\/strong>（Assembly Mag 报道，S-63；TI 应用笔记 SSZT336）。两者是<strong>不同供应商的独立方案，不得混同<\/strong>——本课此前\"S-18 = GM 采用 TI\"的表述已修正。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>成熟度 <code>evolving<\/code>（domain）：已有个别头部平台量产采用，整体渗透率仍低（观点级）。<\/li>\n<li>售后新课题：更换模组/节点后需重新配对与认证，售后流程与诊断工具要为此设计（推论级）。<\/li>\n<li>失联鲁棒性是验证重点：整车电磁环境（电机控制器、充电桩）下的丢包表现需实测（观点级）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"无线 = 不安全\"——安全取决于协议设计（加密、认证、时隙、失联策略）与 ASIL 分解，不取决于传输介质本身。<\/li>\n<li>\"wBMS 把采样线也省了\"——省的是模组间通信线；AFE 仍需在模组内就近采样。<\/li>\n<li>\"无线节点坏了随手换一个\"——节点携带密钥与配对信息，售后更换要走网络安全流程（UN R155 口径，S-14）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：wBMS 省掉的是什么线？没省掉的是什么线？ <strong>Q2<\/strong>：\"失联即安全\"是什么意思？它与 ASIL 分解是什么关系？ <strong>Q3<\/strong>：为什么售后换模组在 wBMS 上比有线架构多一个步骤？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：省掉模组间通信线束与通信连接器；没省掉模组内 AFE 电压采样线，且每节点仍需供电（供电方式待核对，教学示意值场景）。<\/li>\n<li>Q2：指节点或链路异常时，本地按预定义策略进入安全态（数据冻结并触发系统降级），不依赖链路恢复。这是把\"链路失效\"作为可信失效模式纳入 ASIL 分解的结果（S-07）。<\/li>\n<li>Q3：新节点/模组需重新入网认证并更新密钥，满足 UN R155 网络安全管理体系要求（S-14）；有线架构无此环节。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-18：TI 无线 BMS 官方资料（应用笔记 SSZT336、演示视频）——TI 自家方案<\/li>\n<li>S-63：Assembly Magazine（TI wBMS 发布报道，2021-01）、Electronic Design wBMS 文章群（含 GM Ultium = ADI 方案的转述）<\/li>\n<li>S-14：UN R155（网络安全管理体系 CSMS）<\/li>\n<li>S-08：ISO/SAE 21434:2021（网络安全工程流程）<\/li>\n<li>S-07：ISO 26262:2018（ASIL 分解）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-06 已核实链接）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://unece.org/sites/default/files/2023-02/R155e%20%282%29.pdf\" target=\"_blank\" rel=\"noopener\">UNECE UN R155 官方文本（R155e.pdf）<\/a><\/td><td>A<\/td><td>✅<\/td><td>法规原文（S-60）；生效时间线已核实<\/td><\/tr><tr><td><a href=\"https://www.ti.com/lit/SSZT336\" target=\"_blank\" rel=\"noopener\">TI 应用笔记：Three questions to ask about wireless BMS（SSZT336）<\/a><\/td><td>A<\/td><td>✅<\/td><td>TI 官方 wBMS 说明（S-18）<\/td><\/tr><tr><td><a href=\"https://www.ti.com/video/6220085582001\" target=\"_blank\" rel=\"noopener\">TI wBMS 演示视频<\/a><\/td><td>A<\/td><td>✅<\/td><td>官方演示<\/td><\/tr><tr><td><a href=\"https://www.assemblymag.com/articles/96086-ti-unveils-wireless-battery-management-system\" target=\"_blank\" rel=\"noopener\">Assembly Magazine：TI unveils wBMS（2021-01）<\/a><\/td><td>B<\/td><td>✅<\/td><td>发布时间的一手报道（S-63）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~GM Ultium 采用时间与规模~~ → <strong>2026-11-06 已核实并修正<\/strong>：GM Ultium = ADI 方案；TI 为独立方案。<\/li>\n<li>GM\"线束减少约 90%\"的<strong>一手来源<\/strong>（GM 官方新闻稿）与 2024 MDPI wBMS 综述准确条目 → <strong>P-75<\/strong>。<\/li>\n<li>TI wBMS 协议细节（频段/拓扑/时隙机制）与 wBMS 节点供电方式（通信口取电/独立电源）。<\/li>\n<\/ul>", "text": " 对应节点 arch-w （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： arch-ms 、 safe-03 （asil 分解）建议先读 ｜ 预计用时 35 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：连接器与线束的\"最后一公里\" 主从式把采样线缩到了模组内，但 从板到主板的通信线 以及配套连接器仍在——它们是装配工时、故障率、重量与布局自由度的四大消耗。无线 bms（wireless bms，wbms）用无线链路替代模组间通信线束（domain 定义）。 先画清边界：wbms 剪的是 模组间通信线 ；模组内 afe（模拟前端）到电芯极柱的采样线仍然存在。\"全无线\"是误解。 2. 机制：无线链路怎么扛安全责任 2.1 射频与调度 典型频段 2.4 ghz 专有协议（ti 方案，s-18；协议细节待核对）； 确定性调度：各节点按时隙发送（tdma 类，time division multiple access，时分多址，机制示意），保证每个采样周期所有节点数据齐全； 链路周期 ms 级（教学示意值）；节点失联按超时进入预定义安全态。 2.2 安全新账本 无线链路承载安全相关信息，三件事必须做： asil 分解 ：链路失效不能导致危害——节点本地保持\"失联即安全\"策略（s-07 框架）； 加密与认证 ：防伪造与重放，密钥管理是新增子系统； 网络安全管理体系 ：un r155（csms，cyber security management system，网络安全管理体系，s-14）+ iso/sae 21434（s-08）流程覆盖，含售后换模组时的重新配对与密钥更新。 2.3 整车级约束 射频认证与整车 emc（electromagnetic compatibility，电磁兼容）兼容（domain 约束）：与车内其他无线系统共存需按整车认证流程验证。 3. 工程案例：96 串包\"有线 vs 无线\"的连接器账 设 96 串、8 模组 × 12 串、模组间通信线平均 1 m（教学示意值）： 项目 有线主从式 wbms 模组间通信线 8 段双绞线（~8 m） 0 通信连接器 10+ 个（示意） 0（射频免接触） 模组内采样线 保留 保留（~0.2 m/串，示意） 节点硬件 从板：afe + 通信 无线节点：afe + mcu + 射频（单芯片方案，示意） 布局自由度 绑定线束走向 模组可独立取出/更换 新增工程量 — 密钥管理、emc 验证、售后配对 结论 ：省的是连接器与装配工时这类\"隐性成本\"，付的是射频安全设计这类\"显性工程量\"——总账是否划算取决于产量与平台复用度（观点级）。 工程实态更正（2026-11-06 核实；一手来源 2026-11-10 追溯完成） ：gm ultium 平台的无线 bms 采用的是 adi（analog devices）wbms 方案 ——gm 宣称无线化使电池包线束减少约 90%、adi 称省 15% 包体积，一手出处为 2020-09-09 gm×adi 发布 （forbes 2020-09-09 / electronic design 2020-09-21 / t&amp;d world 2020-11-05，s-64）； ti 于 2021 年 1 月单独发布自家 wbms 方案 （assembly mag 报道，s-63；ti 应用笔记 sszt336）。两者是 不同供应商的独立方案，不得混同 ——本课此前\"s-18 = gm 采用 ti\"的表述已修正。 4. 工程实态 成熟度 evolving （domain）：已有个别头部平台量产采用，整体渗透率仍低（观点级）。 售后新课题：更换模组/节点后需重新配对与认证，售后流程与诊断工具要为此设计（推论级）。 失联鲁棒性是验证重点：整车电磁环境（电机控制器、充电桩）下的丢包表现需实测（观点级）。 5. 常见误区 \"无线 = 不安全\"——安全取决于协议设计（加密、认证、时隙、失联策略）与 asil 分解，不取决于传输介质本身。 \"wbms 把采样线也省了\"——省的是模组间通信线；afe 仍需在模组内就近采样。 \"无线节点坏了随手换一个\"——节点携带密钥与配对信息，售后更换要走网络安全流程（un r155 口径，s-14）。 6. 自测 q1 ：wbms 省掉的是什么线？没省掉的是什么线？ q2 ：\"失联即安全\"是什么意思？它与 asil 分解是什么关系？ q3 ：为什么售后换模组在 wbms 上比有线架构多一个步骤？ 答案 q1：省掉模组间通信线束与通信连接器；没省掉模组内 afe 电压采样线，且每节点仍需供电（供电方式待核对，教学示意值场景）。 q2：指节点或链路异常时，本地按预定义策略进入安全态（数据冻结并触发系统降级），不依赖链路恢复。这是把\"链路失效\"作为可信失效模式纳入 asil 分解的结果（s-07）。 q3：新节点/模组需重新入网认证并更新密钥，满足 un r155 网络安全管理体系要求（s-14）；有线架构无此环节。 来源 s-18：ti 无线 bms 官方资料（应用笔记 sszt336、演示视频）——ti 自家方案 s-63：assembly magazine（ti wbms 发布报道，2021-01）、electronic design wbms 文章群（含 gm ultium = adi 方案的转述） s-14：un r155（网络安全管理体系 csms） s-08：iso/sae 21434:2021（网络安全工程流程） s-07：iso 26262:2018（asil 分解） 延伸资源（2026-11-06 已核实链接） 资源 级别 免费 说明 unece un r155 官方文本（r155e.pdf） a ✅ 法规原文（s-60）；生效时间线已核实 ti 应用笔记：three questions to ask about wireless bms（sszt336） a ✅ ti 官方 wbms 说明（s-18） ti wbms 演示视频 a ✅ 官方演示 assembly magazine：ti unveils wbms（2021-01） b ✅ 发布时间的一手报道（s-63） 待核对项（本课） ~~gm ultium 采用时间与规模~~ → 2026-11-06 已核实并修正 ：gm ultium = adi 方案；ti 为独立方案。 gm\"线束减少约 90%\"的 一手来源 （gm 官方新闻稿）与 2024 mdpi wbms 综述准确条目 → p-75 。 ti wbms 协议细节（频段/拓扑/时隙机制）与 wbms 节点供电方式（通信口取电/独立电源）。 "}, {"id": "CHG-01", "title": "课程 CHG-01：充电系统架构与物理接口", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-01<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：无（本域学习路径起点）｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；接口载流档位以 GB/T 20234 系列（S-06）原文为准。<\/p><\/blockquote>\n<h3>1. 为什么从\"接口\"讲起<\/h3>\n<p>充电系统的第一层不是算法，是<strong>铜<\/strong>：多少安培能从桩流进电池，物理上限由接口与线缆决定。所有快充策略（<a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a>、<a class=\"xlink\" href=\"#/lesson/CHG-06\">CHG-06<\/a>）都在这个上限之内做文章。节点约束点题：<strong>接口与线缆载流能力约束快充上限<\/strong>。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）两条拓扑路线<\/strong>：<\/p>\n<ul>\n<li><strong>AC 交流慢充<\/strong>：桩只做开关与保护，整流在车载 OBC（On-Board Charger，车载充电机）——功率受 OBC 体积约束，国内主流 3.5/7 kW（单相，量级示意）；<\/li>\n<li><strong>DC 直流快充<\/strong>：整流在桩内，车端 BMS 只下发目标电流——功率上限由桩输出与接口载流共同决定，主流 60~250 kW 级、超充更高（量级示意）。<\/li>\n<p><strong>（2）国标接口（GB/T 20234 系列，S-06）<\/strong>：<\/p>\n<li><code>.1<\/code> 通用要求；<code>.2<\/code> 交流接口（7 芯：L/N/PE + CP/CC 等）；<code>.3<\/code> 直流接口（9 芯：DC+/DC−、PE、S+/S−（CAN 通信）、CC1/CC2（连接确认）、A+/A−（低压辅助））；<\/li>\n<li><strong>A+/A− 的巧思<\/strong>：BMS 通信节点由桩先供电，充电场景下不必唤醒全车低压系统。<\/li>\n<p><strong>（3）AC 充电的\"对话\"发生在 CP 线上<\/strong>（IEC 61851 / GB/T 18487.1 框架）：桩用 PWM 占空比宣告可用电流——占空比 × 0.6 ≈ 可用安培数（53% → ≈32 A，27% → ≈16 A，示意）。<\/p>\n<p><strong>（4）载流瓶颈三件套<\/strong>：端子接触电阻（恶化 → 发热 → 氧化 → 更恶化的正反馈）、线缆散热能力、温升与绝缘监测——<strong>大电流快充的尽头是液冷枪线<\/strong>。<\/p>\n<\/ul>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：枪线压降与损耗——液冷的必要性<\/h4>\n<p>DC 快充 250 A（对应 20234.3 大电流档的示意值）、桩输出 500 V、枪线铜芯 95 mm²、单程 5 m：<\/p>\n<ul>\n<li>回路电阻 R = 2 × (1.72e-8 × 5 / 95e-6) ≈ <strong>1.81 mΩ<\/strong>；<\/li>\n<li>压降 ΔV = 250 × 1.81e-3 ≈ <strong>0.45 V<\/strong>（可忽略）；<\/li>\n<li>损耗 P = I²R = 250² × 1.81e-3 ≈ <strong>113 W<\/strong>——持续发热全在枪里，风冷已勉强；电流上到 600 A 时按平方涨到 ~650 W（同阻值示意）<strong>必须液冷<\/strong>。<\/li>\n<\/ul>\n<h4>实例 2：功率上限的两条路线<\/h4>\n<p>端子载流上限 250 A（示意）时：500 V × 250 A = <strong>125 kW<\/strong>。要上 350 kW 有两条路：<\/p>\n<ul>\n<li><strong>加电流<\/strong>：350 kW / 500 V = 700 A → 液冷枪线 + 端子升级；<\/li>\n<li><strong>升电压<\/strong>：350 kW / 700 V = 500 A → 800 V 平台路线，电流压力减半。<\/li>\n<p>这就是行业\"800 V 化\"在接口层的动因之一。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>国内 DC 桩 GB/T 20234.3 接口全覆盖；新版标准向大电流/高电压扩展，ChaoJi 超充方案并行推进（细节待核对）；<\/li>\n<li>车端充电口集成电子锁、温度传感与接口 PCB（CC/CP 信号处理）；<\/li>\n<li>端子温升是快充枪故障率最高的部件，运营站按插拔次数做预防性更换（工程实践表述）；<\/li>\n<li>欧洲 CCS、北美 NACS 与国标互不兼容——出口车型需接口与通信协议（<a class=\"xlink\" href=\"#/lesson/CHG-02\">CHG-02<\/a>）双适配。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 OBC 功率（7 kW 级）当快充功率——差一个数量级以上；<\/li>\n<li>只算导线损耗不算端子接触电阻——接触电阻恶化后局部发热远超线缆本体；<\/li>\n<li>认为 CC/CC1/CC2 只测\"插没插好\"——它们承载连接确认、载流能力声明与安全联锁，相关故障率不低；<\/li>\n<li>用\"电压 × 电流\"纸面相乘评估桩能力——还要取枪线载流与车端接受能力的交集。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：国标直流接口 9 芯中，哪两对分别是通信与低压辅助？为什么低压辅助由桩供给？ <strong>Q2<\/strong>：实例 1 中截面减半为 47.5 mm²，损耗变为多少？ <strong>Q3<\/strong>：AC 慢充为什么不需要报文级通信就能工作？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：S+/S− 通信（CAN）、A+/A− 低压辅助。桩先供电让 BMS 通信节点上电，车端无需唤醒整车低压网——降低待机功耗与上电复杂度。<\/li>\n<li>Q2：电阻加倍 → P ≈ <strong>226 W<\/strong>（250 A 时），发热翻倍——截面与损耗成反比，\"省铜不省事\"。<\/li>\n<li>Q3：AC 模式只需 CP 占空比宣告可用电流（模拟信号级交互）；整流与电池管理闭环都在车内完成。DC 模式因桩要按电池实时状态调整输出，才必须报文通信。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-06：GB/T 20234.1~.3《电动汽车传导充电用连接装置》系列（接口定义）<\/li>\n<li>GB/T 18487.1《电动汽车传导充电系统》（系统级框架，编号原文，条款细节待核对）<\/li>\n<li>IEC 61851-1（CP 信号国际框架，编号原文）<\/li>\n<li>本课 250 A、95 mm²、113 W、53% 占空比等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 20234.1~.3 原文（S-06）<\/td><td>A<\/td><td>接口尺寸/载流/温升唯一权威<\/td><\/tr><tr><td>GB/T 18487.1 原文<\/td><td>A<\/td><td>传导充电系统要求<\/td><\/tr><tr><td>IEC 61851-1 原文<\/td><td>A<\/td><td>国际传导充电框架<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>ChaoJi 充电标准公开资料<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 20234.3 现行载流档位与大电流扩展方案的具体数值<\/li>\n<li>CP 占空比-电流对应系数（0.6 沿 IEC 61851 框架，国标对应条款待核对）<\/li>\n<li>ChaoJi 与 GB/T 20234 的关系及量产状态<\/li>\n<\/ul>", "text": " 对应节点 chg-01 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置：无（本域学习路径起点）｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；接口载流档位以 gb/t 20234 系列（s-06）原文为准。 1. 为什么从\"接口\"讲起 充电系统的第一层不是算法，是 铜 ：多少安培能从桩流进电池，物理上限由接口与线缆决定。所有快充策略（ chg-03 、 chg-06 ）都在这个上限之内做文章。节点约束点题： 接口与线缆载流能力约束快充上限 。 2. 机制展开 （1）两条拓扑路线 ： ac 交流慢充 ：桩只做开关与保护，整流在车载 obc（on-board charger，车载充电机）——功率受 obc 体积约束，国内主流 3.5/7 kw（单相，量级示意）； dc 直流快充 ：整流在桩内，车端 bms 只下发目标电流——功率上限由桩输出与接口载流共同决定，主流 60~250 kw 级、超充更高（量级示意）。 （2）国标接口（gb/t 20234 系列，s-06） ： .1 通用要求； .2 交流接口（7 芯：l/n/pe + cp/cc 等）； .3 直流接口（9 芯：dc+/dc−、pe、s+/s−（can 通信）、cc1/cc2（连接确认）、a+/a−（低压辅助））； a+/a− 的巧思 ：bms 通信节点由桩先供电，充电场景下不必唤醒全车低压系统。 （3）ac 充电的\"对话\"发生在 cp 线上 （iec 61851 / gb/t 18487.1 框架）：桩用 pwm 占空比宣告可用电流——占空比 × 0.6 ≈ 可用安培数（53% → ≈32 a，27% → ≈16 a，示意）。 （4）载流瓶颈三件套 ：端子接触电阻（恶化 → 发热 → 氧化 → 更恶化的正反馈）、线缆散热能力、温升与绝缘监测—— 大电流快充的尽头是液冷枪线 。 3. 手算实例 实例 1：枪线压降与损耗——液冷的必要性 dc 快充 250 a（对应 20234.3 大电流档的示意值）、桩输出 500 v、枪线铜芯 95 mm²、单程 5 m： 回路电阻 r = 2 × (1.72e-8 × 5 / 95e-6) ≈ 1.81 mω ； 压降 δv = 250 × 1.81e-3 ≈ 0.45 v （可忽略）； 损耗 p = i²r = 250² × 1.81e-3 ≈ 113 w ——持续发热全在枪里，风冷已勉强；电流上到 600 a 时按平方涨到 ~650 w（同阻值示意） 必须液冷 。 实例 2：功率上限的两条路线 端子载流上限 250 a（示意）时：500 v × 250 a = 125 kw 。要上 350 kw 有两条路： 加电流 ：350 kw / 500 v = 700 a → 液冷枪线 + 端子升级； 升电压 ：350 kw / 700 v = 500 a → 800 v 平台路线，电流压力减半。 这就是行业\"800 v 化\"在接口层的动因之一。 4. 工程实态 国内 dc 桩 gb/t 20234.3 接口全覆盖；新版标准向大电流/高电压扩展，chaoji 超充方案并行推进（细节待核对）； 车端充电口集成电子锁、温度传感与接口 pcb（cc/cp 信号处理）； 端子温升是快充枪故障率最高的部件，运营站按插拔次数做预防性更换（工程实践表述）； 欧洲 ccs、北美 nacs 与国标互不兼容——出口车型需接口与通信协议（ chg-02 ）双适配。 5. 常见误区 把 obc 功率（7 kw 级）当快充功率——差一个数量级以上； 只算导线损耗不算端子接触电阻——接触电阻恶化后局部发热远超线缆本体； 认为 cc/cc1/cc2 只测\"插没插好\"——它们承载连接确认、载流能力声明与安全联锁，相关故障率不低； 用\"电压 × 电流\"纸面相乘评估桩能力——还要取枪线载流与车端接受能力的交集。 6. 自测 q1 ：国标直流接口 9 芯中，哪两对分别是通信与低压辅助？为什么低压辅助由桩供给？ q2 ：实例 1 中截面减半为 47.5 mm²，损耗变为多少？ q3 ：ac 慢充为什么不需要报文级通信就能工作？ 答案 q1：s+/s− 通信（can）、a+/a− 低压辅助。桩先供电让 bms 通信节点上电，车端无需唤醒整车低压网——降低待机功耗与上电复杂度。 q2：电阻加倍 → p ≈ 226 w （250 a 时），发热翻倍——截面与损耗成反比，\"省铜不省事\"。 q3：ac 模式只需 cp 占空比宣告可用电流（模拟信号级交互）；整流与电池管理闭环都在车内完成。dc 模式因桩要按电池实时状态调整输出，才必须报文通信。 来源 s-06：gb/t 20234.1~.3《电动汽车传导充电用连接装置》系列（接口定义） gb/t 18487.1《电动汽车传导充电系统》（系统级框架，编号原文，条款细节待核对） iec 61851-1（cp 信号国际框架，编号原文） 本课 250 a、95 mm²、113 w、53% 占空比等均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb/t 20234.1~.3 原文（s-06） a 接口尺寸/载流/温升唯一权威 gb/t 18487.1 原文 a 传导充电系统要求 iec 61851-1 原文 a 国际传导充电框架 [待补链] — chaoji 充电标准公开资料 待核对项（本课） gb/t 20234.3 现行载流档位与大电流扩展方案的具体数值 cp 占空比-电流对应系数（0.6 沿 iec 61851 框架，国标对应条款待核对） chaoji 与 gb/t 20234 的关系及量产状态 "}, {"id": "CHG-02", "title": "课程 CHG-02：充电通信协议", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-02<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/CHG-01\">CHG-01<\/a> ｜ 预计用时 45 min 数字规则更新（2026-11-15）：<strong>报文周期已核实<\/strong>——CHM/BHM 250 ms、BCP 250 ms、BCL 50 ms（最短、实时性最高）、BCS/CCS 250 ms（S-05/S-71），与本文原示意值一致；<strong>现行版本为 GB/T 27930-2023<\/strong>（2023 版超时与周期定义细化，P-06 关闭）。CAN 负载核算等仍为教学示意值。<\/p><\/blockquote>\n<h3>1. 为什么快充必须有\"对话\"<\/h3>\n<p>AC 慢充靠 CP 占空比宣告一个电流值就够（<a class=\"xlink\" href=\"#/lesson/CHG-01\">CHG-01<\/a>）；DC 快充时桩要按电池实时状态（SOC、单体电压、温度、允许电流）连续调整输出——必须靠<strong>报文级通信<\/strong>。协议是桩与 BMS 之间的\"合同\"：怎么握手、怎么协商参数、怎么实时控制、怎么安全分手。节点约束点题：超时与中断处理需按标准状态机；跨标准（GB/CCS/NACS）需适配层。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）国标 GB/T 27930（S-05）<\/strong>：基于 CAN（250 kbit/s，示意）+ SAE J1939 风格扩展帧的报文体系，按阶段展开：<\/p>\n<ul>\n<li><strong>握手阶段<\/strong>：充电机发 <code>CHM<\/code> → BMS 回 <code>BHM<\/code>（含最高允许电压）；充电机识别后发 <code>CRM<\/code>，BMS 回 <code>BRM<\/code>（电池身份与关键参数）；<\/li>\n<li><strong>参数配置阶段<\/strong>：BMS 发 <code>BCP<\/code>（最高允许电压/电流等）↔ 充电机发 <code>CML<\/code>（桩最大输出能力）；双方就绪后 <code>BRO<\/code>/<code>CRO<\/code> 确认；<\/li>\n<li><strong>充电阶段<\/strong>：BMS 短周期发 <code>BCL<\/code>（需求电压/电流——<strong>真正的控制量<\/strong>）与 <code>BCS<\/code>（SOC/单体状态），充电机回 <code>CCS<\/code>；<\/li>\n<li><strong>结束阶段<\/strong>：<code>BST<\/code>/<code>CST<\/code>（中止原因）+ <code>BSD<\/code>/<code>CSD<\/code>（统计与诊断数据）。<\/li>\n<p>任一报文超时 → 走中止流程（BST/CST）→ 断电。<strong>协议的安全性大部分体现在超时状态机的完备性上。<\/strong><\/p>\n<p><strong>（2）ISO 15118（S-10）<\/strong>：欧洲 CCS 路线。物理层是 PLC（Power Line Communication，电力线载波，HomePlug Green PHY），应用层 XML/EXI 编码，带 TLS 加密与证书体系（支撑即插即充，见 <a class=\"xlink\" href=\"#/lesson/CHG-05\">CHG-05<\/a>），新版本支持双向 V2G。与 27930 的核心差异：<strong>加密与身份认证、跨厂商即插即用、更高带宽<\/strong>。<\/p>\n<\/ul>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：握手报文时序表（周期/超时均为教学示意值）<\/h4>\n<table><thead><tr><th>阶段<\/th><th>报文<\/th><th>方向<\/th><th>周期/时机（示意）<\/th><th>超时处理（示意）<\/th><\/tr><\/thead><tbody><tr><td>物理连接后<\/td><td>CHM<\/td><td>桩→车<\/td><td>每 250 ms 循环<\/td><td>—<\/td><\/tr><tr><td>握手应答<\/td><td>BHM<\/td><td>车→桩<\/td><td>每 250 ms<\/td><td>桩侧 ~5 s 未收到 → 停<\/td><\/tr><tr><td>辨识<\/td><td>CRM/BRM<\/td><td>双向<\/td><td>BRM 在连接后 ~5 s 内<\/td><td>超时 → 停止辨识<\/td><\/tr><tr><td>参数协商<\/td><td>BCP/CML<\/td><td>双向<\/td><td>事件触发 + 重发<\/td><td>超时 → 中止流程<\/td><\/tr><tr><td>就绪确认<\/td><td>BRO/CRO<\/td><td>双向<\/td><td>事件触发<\/td><td>超时 → 中止流程<\/td><\/tr><tr><td>充电中<\/td><td>BCL<\/td><td>车→桩<\/td><td>每 50 ms<\/td><td>桩侧 1 s 未收到 → 降流/停机<\/td><\/tr><tr><td>充电中<\/td><td>BCS/CCS<\/td><td>双向<\/td><td>每 250 ms<\/td><td>超时 → 中止流程<\/td><\/tr><tr><td>结束<\/td><td>BST/CST、BSD/CSD<\/td><td>双向<\/td><td>事件触发<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<p>注意 BCL 50 ms 与 BCS 250 ms 的周期差：<strong>控制量（需求电流）要快，状态量可以慢<\/strong>——带宽花在刀刃上。<\/p>\n<h4>实例 2：CAN 总线负载核算<\/h4>\n<p>扩展帧（29 bit ID）8 字节数据 ≈ 131 bit，最坏位填充约 +20% → ~157 bit（示意）。250 kbit/s 下单帧 ≈ 0.63 ms。<\/p>\n<p>充电中报文合计：BCL 20 帧/s + BCS 4 帧/s + 其他 ≈6 帧/s = ~30 帧/s → 总线占用 ≈ 30 × 0.63 ms ≈ 19 ms/s ≈ <strong>2%<\/strong>。250 kbit/s 对快充绰绰有余——瓶颈从来不是带宽，而是<strong>安全语义（超时/中止）设计<\/strong>。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>国内 DC 桩全走 GB/T 27930；桩与车各自实现完整超时状态机并做协议一致性测试；<\/li>\n<li>出口车双栈：国标 CAN + CCS 的 ISO 15118，车端网关做适配层（节点约束原文）；<\/li>\n<li>27930 无加密认证——报文可伪造/重放（工程公认短板），标准演进方向在补证书体系（衔接 <a class=\"xlink\" href=\"#/lesson/CHG-05\">CHG-05<\/a>）；<\/li>\n<li>大功率充电新标准（ChaoJi 等）在通信层向后兼容上做了设计（细节待核对）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 BCL 当\"实时闭环\"——真正的电流闭环在桩内整流器（毫秒级），BCL 只是目标值下发；<\/li>\n<li>只测正常流程——充电失败大多在超时分支：丢一帧 BCL 桩怎么动作，比正常流程更值得测；<\/li>\n<li>认为 250 kbit/s \"太慢要换以太网\"——负载核算见实例 2，确定性与安全语义比带宽重要；<\/li>\n<li>把 27930 与 15118 当\"同一协议的两个版本\"——物理层、认证模型、报文体系完全不同，是两套协议。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：BCL 与 BCS 的分工是什么？为什么周期差 5 倍？ <strong>Q2<\/strong>：若 BCL 改为每 100 ms 一帧（其他不变），总线负载变多少？ <strong>Q3<\/strong>：27930 报文不加密，意味着什么现实风险？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：BCL 是控制量（需求电压/电流，桩直接执行），BCS 是状态量（SOC/单体电压，供监视与保护）。控制量决定输出实时性、状态量变化慢且自带上报保护——50 ms vs 250 ms（示意）。<\/li>\n<li>Q2：BCL 变 10 帧/s，合计 ≈ 20 帧/s → 20 × 0.63 ms ≈ 13 ms/s ≈ <strong>1.3%<\/strong>——仍极低，再次说明带宽不是约束。<\/li>\n<li>Q3：伪造/重放 BCL 让桩按恶意参数输出（过压过流）、伪造 BCS 掩盖电池异常。安全只能靠桩端独立保护兜底（见 <a class=\"xlink\" href=\"#/lesson/CHG-04\">CHG-04<\/a>）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-05：GB/T 27930-2023《非车载传导式充电机与电动汽车之间的数字通信协议》（现行版本已确认，P-06 关闭）<\/li>\n<li>S-71：GB/T 27930 报文周期参考手册（canfd.net/gbt27930.html，B 级，与标准原文核对一致）<\/li>\n<li>S-10：ISO 15118 系列（欧洲路线，含 Plug &amp; Charge）<\/li>\n<li>SAE J1939（报文风格与 29 bit ID 框架，编号原文）<\/li>\n<li>本课 131 bit、0.63 ms、2% 负载等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-15 已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=6ECF725CD2BCCA2819082279F6B2E243\" target=\"_blank\" rel=\"noopener\">GB/T 27930-2023 全文公开页（openstd）<\/a><\/td><td>A<\/td><td>✅（阅读）<\/td><td>报文定义唯一权威（现行版）<\/td><\/tr><tr><td><a href=\"https://www.canfd.net/gbt27930.html\" target=\"_blank\" rel=\"noopener\">GB/T 27930 报文周期参考手册（canfd.net）<\/a><\/td><td>B<\/td><td>✅<\/td><td>各报文 PGN/周期/格式速查（与原文核对一致）<\/td><\/tr><tr><td>ISO 15118-1/-2/-3/-20 原文（S-10）<\/td><td>A<\/td><td>—<\/td><td>欧洲路线（付费）<\/td><\/tr><tr><td>openV2G（开源 V2G/EXI 编解码参考实现）<\/td><td>B<\/td><td>✅（开源）<\/td><td>15118 实现参考<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~现行版本与 2015 版差异~~ → <strong>2026-11-15 已核实<\/strong>：现行 GB/T 27930-2023，报文框架延续、超时/周期细化（P-06 关闭）。<\/li>\n<li>~~各报文的标准周期~~ → <strong>2026-11-15 已核实<\/strong>（CHM/BHM 250 ms、BCL 50 ms、BCS/CCS 250 ms；超时值仍按示意，待原文逐条）。<\/li>\n<li>CAN 扩展帧位填充最坏长度的精确计算（157 bit 为示意）。<\/li>\n<li>ChaoJi 通信层与 27930 的兼容关系。<\/li>\n<\/ul>", "text": " 对应节点 chg-02 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置： chg-01 ｜ 预计用时 45 min 数字规则更新（2026-11-15）： 报文周期已核实 ——chm/bhm 250 ms、bcp 250 ms、bcl 50 ms（最短、实时性最高）、bcs/ccs 250 ms（s-05/s-71），与本文原示意值一致； 现行版本为 gb/t 27930-2023 （2023 版超时与周期定义细化，p-06 关闭）。can 负载核算等仍为教学示意值。 1. 为什么快充必须有\"对话\" ac 慢充靠 cp 占空比宣告一个电流值就够（ chg-01 ）；dc 快充时桩要按电池实时状态（soc、单体电压、温度、允许电流）连续调整输出——必须靠 报文级通信 。协议是桩与 bms 之间的\"合同\"：怎么握手、怎么协商参数、怎么实时控制、怎么安全分手。节点约束点题：超时与中断处理需按标准状态机；跨标准（gb/ccs/nacs）需适配层。 2. 机制展开 （1）国标 gb/t 27930（s-05） ：基于 can（250 kbit/s，示意）+ sae j1939 风格扩展帧的报文体系，按阶段展开： 握手阶段 ：充电机发 chm → bms 回 bhm （含最高允许电压）；充电机识别后发 crm ，bms 回 brm （电池身份与关键参数）； 参数配置阶段 ：bms 发 bcp （最高允许电压/电流等）↔ 充电机发 cml （桩最大输出能力）；双方就绪后 bro / cro 确认； 充电阶段 ：bms 短周期发 bcl （需求电压/电流—— 真正的控制量 ）与 bcs （soc/单体状态），充电机回 ccs ； 结束阶段 ： bst / cst （中止原因）+ bsd / csd （统计与诊断数据）。 任一报文超时 → 走中止流程（bst/cst）→ 断电。 协议的安全性大部分体现在超时状态机的完备性上。 （2）iso 15118（s-10） ：欧洲 ccs 路线。物理层是 plc（power line communication，电力线载波，homeplug green phy），应用层 xml/exi 编码，带 tls 加密与证书体系（支撑即插即充，见 chg-05 ），新版本支持双向 v2g。与 27930 的核心差异： 加密与身份认证、跨厂商即插即用、更高带宽 。 3. 手算实例 实例 1：握手报文时序表（周期/超时均为教学示意值） 阶段 报文 方向 周期/时机（示意） 超时处理（示意） 物理连接后 chm 桩→车 每 250 ms 循环 — 握手应答 bhm 车→桩 每 250 ms 桩侧 ~5 s 未收到 → 停 辨识 crm/brm 双向 brm 在连接后 ~5 s 内 超时 → 停止辨识 参数协商 bcp/cml 双向 事件触发 + 重发 超时 → 中止流程 就绪确认 bro/cro 双向 事件触发 超时 → 中止流程 充电中 bcl 车→桩 每 50 ms 桩侧 1 s 未收到 → 降流/停机 充电中 bcs/ccs 双向 每 250 ms 超时 → 中止流程 结束 bst/cst、bsd/csd 双向 事件触发 — 注意 bcl 50 ms 与 bcs 250 ms 的周期差： 控制量（需求电流）要快，状态量可以慢 ——带宽花在刀刃上。 实例 2：can 总线负载核算 扩展帧（29 bit id）8 字节数据 ≈ 131 bit，最坏位填充约 +20% → ~157 bit（示意）。250 kbit/s 下单帧 ≈ 0.63 ms。 充电中报文合计：bcl 20 帧/s + bcs 4 帧/s + 其他 ≈6 帧/s = ~30 帧/s → 总线占用 ≈ 30 × 0.63 ms ≈ 19 ms/s ≈ 2% 。250 kbit/s 对快充绰绰有余——瓶颈从来不是带宽，而是 安全语义（超时/中止）设计 。 4. 工程实态 国内 dc 桩全走 gb/t 27930；桩与车各自实现完整超时状态机并做协议一致性测试； 出口车双栈：国标 can + ccs 的 iso 15118，车端网关做适配层（节点约束原文）； 27930 无加密认证——报文可伪造/重放（工程公认短板），标准演进方向在补证书体系（衔接 chg-05 ）； 大功率充电新标准（chaoji 等）在通信层向后兼容上做了设计（细节待核对）。 5. 常见误区 把 bcl 当\"实时闭环\"——真正的电流闭环在桩内整流器（毫秒级），bcl 只是目标值下发； 只测正常流程——充电失败大多在超时分支：丢一帧 bcl 桩怎么动作，比正常流程更值得测； 认为 250 kbit/s \"太慢要换以太网\"——负载核算见实例 2，确定性与安全语义比带宽重要； 把 27930 与 15118 当\"同一协议的两个版本\"——物理层、认证模型、报文体系完全不同，是两套协议。 6. 自测 q1 ：bcl 与 bcs 的分工是什么？为什么周期差 5 倍？ q2 ：若 bcl 改为每 100 ms 一帧（其他不变），总线负载变多少？ q3 ：27930 报文不加密，意味着什么现实风险？ 答案 q1：bcl 是控制量（需求电压/电流，桩直接执行），bcs 是状态量（soc/单体电压，供监视与保护）。控制量决定输出实时性、状态量变化慢且自带上报保护——50 ms vs 250 ms（示意）。 q2：bcl 变 10 帧/s，合计 ≈ 20 帧/s → 20 × 0.63 ms ≈ 13 ms/s ≈ 1.3% ——仍极低，再次说明带宽不是约束。 q3：伪造/重放 bcl 让桩按恶意参数输出（过压过流）、伪造 bcs 掩盖电池异常。安全只能靠桩端独立保护兜底（见 chg-04 ）。 来源 s-05：gb/t 27930-2023《非车载传导式充电机与电动汽车之间的数字通信协议》（现行版本已确认，p-06 关闭） s-71：gb/t 27930 报文周期参考手册（canfd.net/gbt27930.html，b 级，与标准原文核对一致） s-10：iso 15118 系列（欧洲路线，含 plug &amp; charge） sae j1939（报文风格与 29 bit id 框架，编号原文） 本课 131 bit、0.63 ms、2% 负载等均为教学示意值 延伸资源（2026-11-15 已核实） 资源 级别 免费 说明 gb/t 27930-2023 全文公开页（openstd） a ✅（阅读） 报文定义唯一权威（现行版） gb/t 27930 报文周期参考手册（canfd.net） b ✅ 各报文 pgn/周期/格式速查（与原文核对一致） iso 15118-1/-2/-3/-20 原文（s-10） a — 欧洲路线（付费） openv2g（开源 v2g/exi 编解码参考实现） b ✅（开源） 15118 实现参考 待核对项（本课） ~~现行版本与 2015 版差异~~ → 2026-11-15 已核实 ：现行 gb/t 27930-2023，报文框架延续、超时/周期细化（p-06 关闭）。 ~~各报文的标准周期~~ → 2026-11-15 已核实 （chm/bhm 250 ms、bcl 50 ms、bcs/ccs 250 ms；超时值仍按示意，待原文逐条）。 can 扩展帧位填充最坏长度的精确计算（157 bit 为示意）。 chaoji 通信层与 27930 的兼容关系。 "}, {"id": "CHG-03", "title": "课程 CHG-03：快充策略与析锂抑制", "dom": "CHG", "verified": false, "html": "<blockquote><p>对应节点 <code>CHG-03<\/code>（../domains/07-充电.md <span class=\"fileref\">（项目文件 ../domains/07-充电.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/CHG-06\">CHG-06<\/a> ｜ 预计用时 45 min 数字规则：文中所有倍率地图与边界数值均为<strong>教学示意值<\/strong>（真实标定数据属电芯厂核心机密）；机理表述为电化学共识。<\/p><\/blockquote>\n<h3>1. 为什么析锂是快充的\"天花板\"<\/h3>\n<p>析锂（Lithium Plating）：充电时锂离子来不及嵌入负极石墨层间，在负极表面直接沉积为金属锂。三大危害：<\/p>\n<ol>\n<li><strong>容量损失<\/strong>（活性锂被消耗，部分不可逆）；<\/li>\n<li><strong>枝晶风险<\/strong>（锂枝晶可能刺穿隔膜 → 内短路）；<\/li>\n<li><strong>内阻上升<\/strong> → 产热与极化加剧 → 恶化循环（正反馈）。<\/li>\n<p>它决定快充的物理边界：<strong>桩能给多大功率是一回事，负极\"吃得下\"多少是另一回事<\/strong>。节点约束点题：低温大倍率析锂风险；倍率需 SOC×温度双约束。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）判据的本质：负极电位。<\/strong> 析锂发生在负极电位（vs Li/Li⁺）降到 0 V 以下时。但 BMS 量不到负极电位——只能用三个<strong>可测代理量<\/strong>控制它：<\/p>\n<ul>\n<li><strong>电流（倍率）<\/strong>：电流越大，负极极化越大，电位被压得越低；<\/li>\n<li><strong>SOC<\/strong>：SOC 越高，石墨嵌锂越饱和、嵌入动力学越慢，可接受电流越小——这正是 <a class=\"xlink\" href=\"#/lesson/CHG-06\">CHG-06<\/a> 末端降流的电化学根源；<\/li>\n<li><strong>温度<\/strong>：低温下电解液电导与固相扩散都变差，同样电流下极化更大。<strong>低温 × 大电流 × 高 SOC 是析锂三角。<\/strong><\/li>\n<p><strong>（2）工程手段一：倍率地图。<\/strong> 电芯厂用台架标定（量热、膨胀原位测量、拆解后电镜复核）给出\"不析锂充电电流边界\"，车端 BMS 以 SOC × 温度 × 倍率三维查表执行。<\/p>\n<p><strong>（3）工程手段二：先加热再快充。<\/strong> 低温先预热（PTC/液热/脉冲自加热）把电芯拉进可快充温度窗——总时间比\"低温小电流慢慢充\"更短。<\/p>\n<p><strong>（4）工程手段三：在线电压反馈微调。<\/strong> 充电中暂停数十毫秒观察电压弛豫落差（极化大 → 落差大，示意判据），据此收紧/放开电流——闭环比纯查表更能覆盖个体差异与老化。<\/p>\n<\/ul>\n<h3>3. 工程案例：倍率地图与\"冬天快充为什么慢\"<\/h3>\n<h4>示意倍率地图（教学示意值，不代表任何真实电芯）<\/h4>\n<table><thead><tr><th>温度 \\ SOC<\/th><th>≤50%<\/th><th>50~80%<\/th><th>80~100%<\/th><\/tr><\/thead><tbody><tr><td>≥35 °C<\/td><td>2.5C<\/td><td>1.5C<\/td><td>0.8C<\/td><\/tr><tr><td>25 °C<\/td><td>2.0C<\/td><td>1.5C<\/td><td>0.7C<\/td><\/tr><tr><td>10 °C<\/td><td>1.0C<\/td><td>0.7C<\/td><td>0.4C<\/td><\/tr><tr><td>0 °C<\/td><td>0.3C<\/td><td>0.2C<\/td><td>0.1C<\/td><\/tr><tr><td>&lt;0 °C<\/td><td>禁止大倍率，先加热<\/td><td>同左<\/td><td>同左<\/td><\/tr><\/tbody><\/table>\n<h4>算例：75 kWh 包（教学示意值）<\/h4>\n<ul>\n<li>25 °C、SOC 40%：2.0C → 峰值功率 <strong>150 kW<\/strong>；<\/li>\n<li>10 °C、SOC 40%：1.0C → <strong>75 kW<\/strong>；<\/li>\n<li>10 °C、SOC 70%：0.7C → <strong>52.5 kW<\/strong>。<\/li>\n<p><strong>冬天快充慢不是桩的锅，是负极吃不下<\/strong>——同一根桩、同一辆车，冬天峰值减半、SOC 过半后再降档，与上表自洽。<\/p>\n<\/ul>\n<h4>电压反馈判据示意<\/h4>\n<p>充电中以 1.5C 进行至 SOC 55%（25 °C，示意），暂停 2 s，电压回落 80 mV（示意）。规则示意：回落 &gt;50 mV 判\"极化偏大\" → 倍率降 15%；回落 &lt;20 mV 判\"有裕度\" → 尝试升档。阈值是示意，<strong>方向<\/strong>是共识。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>倍率地图是电芯厂与整车厂联合标定的核心交付物，试验量大、周期长；<\/li>\n<li>标定随老化漂移：SOH 下降后极化增大、同地图析锂裕度变小——高端方案按 SOH 修正地图（衔接 <a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）；<\/li>\n<li>\"4C 快充电芯\"宣称依赖电解液快离子导体与石墨改性等材料侧进步，<strong>车端限流地图依然存在<\/strong>；<\/li>\n<li>快充循环后的安全底线由 GB 38031-2025（S-01）约束（细节待核对 → P-05），把\"析锂没控住\"的后果纳入型式试验。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"低温充电慢是 BMS 保守/桩不行\"——是析锂本征约束，正确解法是提前加热；<\/li>\n<li>只按 SOC 限流不看温度（或反之）——双约束缺一不可（节点约束原文）；<\/li>\n<li>用 0→80% 时间衡量快充能力而忽略末端——80% 后倍率天然下台阶（CHG-06）；<\/li>\n<li>认为析锂只在低温发生——高温 + 高 SOC + 大电流同样可能，只是温度窗不同。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：用示意地图估算：10 °C、SOC 30% 时 75 kWh 包的最大充电功率？瓶颈在桩还是电池？ <strong>Q2<\/strong>：为什么 SOC 越高、可接受倍率越低？用\"嵌入\"与\"极化\"两个概念回答。 <strong>Q3<\/strong>：电压弛豫判据为什么能间接反映析锂风险？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：1.0C × 75 kWh = <strong>75 kW<\/strong>。主流桩（120~250 kW 级，示意）都高于此值——瓶颈在电池侧倍率地图。<\/li>\n<li>Q2：SOC 高 → 石墨层间嵌锂趋近饱和 → 嵌入动力学变慢 → 同电流下浓差/电荷转移极化增大 → 负极电位被压向 0 V（vs Li/Li⁺）→ 必须降电流。<\/li>\n<li>Q3：电流中断后端电压向 OCV 弛豫，弛豫落差反映极化大小；极化越大，负极电位被压得越低、析锂风险越高——它是负极极化的可测代理（间接、示意级）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-01：GB 38031-2025（快充循环后安全要求，细节待核对 → P-05）<\/li>\n<li>S-16：G. Plett《Battery Management Systems》（模型框架，充电约束建模）<\/li>\n<li>析锂机理为电化学共识表述；本课倍率地图全部为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>[待补链]<\/td><td>—<\/td><td>析锂机理经典综述（具体篇目核实后补）<\/td><\/tr><tr><td>GB 38031-2025 原文（S-01）<\/td><td>A<\/td><td>快充循环安全底线<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>电芯厂商快充技术白皮书（公开级）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>示意倍率地图与真实电芯标定数据的差距（真实数据属企业机密，仅作量级教学）<\/li>\n<li>~~电压弛豫判据的文献支撑~~ → <strong>2026-11-23 已核实（P-43 关闭，S-91）<\/strong>：VRP 电压弛豫平台法（Koleti 2020）检测<strong>可逆析锂<\/strong>（剥离平台），注意负极相变可致误报；车载早期检测（Huang 2022，277 引用）；MSCC 多段恒流曲线使检测更稳健（Schmidt 2023）；<strong>不可逆析锂（死锂）无剥离平台，需库仑效率/容量衰减长期跟踪<\/strong>。80/50/20 mV 阈值仍为示意<\/li>\n<li>GB 38031-2025 快充循环条款细节（→ 已有 P-05）<\/li>\n<li>SOH 修正倍率地图的公开文献<\/li>\n<\/ul>", "text": " 对应节点 chg-03 （../domains/07-充电.md （项目文件 ../domains/07-充电.md） ）｜ 前置： chg-06 ｜ 预计用时 45 min 数字规则：文中所有倍率地图与边界数值均为 教学示意值 （真实标定数据属电芯厂核心机密）；机理表述为电化学共识。 1. 为什么析锂是快充的\"天花板\" 析锂（lithium plating）：充电时锂离子来不及嵌入负极石墨层间，在负极表面直接沉积为金属锂。三大危害： 容量损失 （活性锂被消耗，部分不可逆）； 枝晶风险 （锂枝晶可能刺穿隔膜 → 内短路）； 内阻上升 → 产热与极化加剧 → 恶化循环（正反馈）。 它决定快充的物理边界： 桩能给多大功率是一回事，负极\"吃得下\"多少是另一回事 。节点约束点题：低温大倍率析锂风险；倍率需 soc×温度双约束。 2. 机制展开 （1）判据的本质：负极电位。 析锂发生在负极电位（vs li/li⁺）降到 0 v 以下时。但 bms 量不到负极电位——只能用三个 可测代理量 控制它： 电流（倍率） ：电流越大，负极极化越大，电位被压得越低； soc ：soc 越高，石墨嵌锂越饱和、嵌入动力学越慢，可接受电流越小——这正是 chg-06 末端降流的电化学根源； 温度 ：低温下电解液电导与固相扩散都变差，同样电流下极化更大。 低温 × 大电流 × 高 soc 是析锂三角。 （2）工程手段一：倍率地图。 电芯厂用台架标定（量热、膨胀原位测量、拆解后电镜复核）给出\"不析锂充电电流边界\"，车端 bms 以 soc × 温度 × 倍率三维查表执行。 （3）工程手段二：先加热再快充。 低温先预热（ptc/液热/脉冲自加热）把电芯拉进可快充温度窗——总时间比\"低温小电流慢慢充\"更短。 （4）工程手段三：在线电压反馈微调。 充电中暂停数十毫秒观察电压弛豫落差（极化大 → 落差大，示意判据），据此收紧/放开电流——闭环比纯查表更能覆盖个体差异与老化。 3. 工程案例：倍率地图与\"冬天快充为什么慢\" 示意倍率地图（教学示意值，不代表任何真实电芯） 温度 \\ soc ≤50% 50~80% 80~100% ≥35 °c 2.5c 1.5c 0.8c 25 °c 2.0c 1.5c 0.7c 10 °c 1.0c 0.7c 0.4c 0 °c 0.3c 0.2c 0.1c &lt;0 °c 禁止大倍率，先加热 同左 同左 算例：75 kwh 包（教学示意值） 25 °c、soc 40%：2.0c → 峰值功率 150 kw ； 10 °c、soc 40%：1.0c → 75 kw ； 10 °c、soc 70%：0.7c → 52.5 kw 。 冬天快充慢不是桩的锅，是负极吃不下 ——同一根桩、同一辆车，冬天峰值减半、soc 过半后再降档，与上表自洽。 电压反馈判据示意 充电中以 1.5c 进行至 soc 55%（25 °c，示意），暂停 2 s，电压回落 80 mv（示意）。规则示意：回落 &gt;50 mv 判\"极化偏大\" → 倍率降 15%；回落 &lt;20 mv 判\"有裕度\" → 尝试升档。阈值是示意， 方向 是共识。 4. 工程实态 倍率地图是电芯厂与整车厂联合标定的核心交付物，试验量大、周期长； 标定随老化漂移：soh 下降后极化增大、同地图析锂裕度变小——高端方案按 soh 修正地图（衔接 alg-05 ）； \"4c 快充电芯\"宣称依赖电解液快离子导体与石墨改性等材料侧进步， 车端限流地图依然存在 ； 快充循环后的安全底线由 gb 38031-2025（s-01）约束（细节待核对 → p-05），把\"析锂没控住\"的后果纳入型式试验。 5. 常见误区 \"低温充电慢是 bms 保守/桩不行\"——是析锂本征约束，正确解法是提前加热； 只按 soc 限流不看温度（或反之）——双约束缺一不可（节点约束原文）； 用 0→80% 时间衡量快充能力而忽略末端——80% 后倍率天然下台阶（chg-06）； 认为析锂只在低温发生——高温 + 高 soc + 大电流同样可能，只是温度窗不同。 6. 自测 q1 ：用示意地图估算：10 °c、soc 30% 时 75 kwh 包的最大充电功率？瓶颈在桩还是电池？ q2 ：为什么 soc 越高、可接受倍率越低？用\"嵌入\"与\"极化\"两个概念回答。 q3 ：电压弛豫判据为什么能间接反映析锂风险？ 答案 q1：1.0c × 75 kwh = 75 kw 。主流桩（120~250 kw 级，示意）都高于此值——瓶颈在电池侧倍率地图。 q2：soc 高 → 石墨层间嵌锂趋近饱和 → 嵌入动力学变慢 → 同电流下浓差/电荷转移极化增大 → 负极电位被压向 0 v（vs li/li⁺）→ 必须降电流。 q3：电流中断后端电压向 ocv 弛豫，弛豫落差反映极化大小；极化越大，负极电位被压得越低、析锂风险越高——它是负极极化的可测代理（间接、示意级）。 来源 s-
