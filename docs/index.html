示意），温度快速变化时读数滞后（手算实例 2）。 （4）极值估计 ：既然测不全，就要\"算\"——用少数测点 + 热模型（thm-02）外推最热点（软测量，virtual sensing），或工程化的包络法：最热点估计 = 最高测点读数 + 标定偏移量。 3. 手算实例（数字自洽） 实例 1：稀疏覆盖的盲区 150 个方形电芯 + 12 个 ntc（教学示意值）→ 每个 ntc 覆盖 12~13 个电芯。若台架摸底实测同组内最大单体间温差 4 k（示意），则： 真实最热点温度 ∈ [ntc 读数, ntc 读数 + 4 k] ——这 4 k 是布点架构决定的代表性误差上界，任何热保护阈值都要为它留裕度。 实例 2：响应滞后 ntc 组件时间常数 τ = 30 s（示意，贴合安装），电芯表面以 0.5 k/min 匀速升温（示意，大倍率工况）：稳态读数滞后 = 升温速率 × τ = (0.5/60) × 30 = 0.25 k ；若安装不良 τ = 60 s → 滞后 0.5 k。一阶系统滞后量 δt = τ·(dt/dt)——这就是\"快充冲刺段为什么报温偏低\"的一个来源。 实例 3：接触热阻的系统性偏低 ntc 与电芯面之间有 0.2 mm 空气隙（示意，未涂导热胶的装配缺陷），空气导热系数 λ ≈ 0.026 w/(m·k)（物性常数），电芯大面热流密度 q = 500 w/m²（示意，大倍率工况）： \\delta t = \\frac{q \\cdot d}{\\lambda} = \\frac{500 \\times 0.0002}{0.026} \\approx 3.8\\ \\text{k} 一个装配缺陷吃掉 3.8 k——比 ntc 元件精度（±1 k 级，示意）大得多。 系统误差在安装，不在元件。 4. 工程实态 量产布点 = \"电芯大面若干分之一 + 极柱/母排 + 冷却板进出口水温\"的混合方案；布点位置由热仿真 + 台架摸底（找出最热点后\"钉住\"）确定； gb/t 38661-2020（s-03）对温度采集的范围/精度/采样周期有要求（具体条款数值待核对，见文末）； 温度变化慢，采样 1~10 hz（示意）足够，远低于电压电流采样率（ hw-01 ）； 高端方案把极值估计做进 bms：热模型在线外推最热点，阈值判断用\"估计极值\"而非\"最大测点\"。 5. 常见误区 拿 ntc 元件精度当系统精度——接触热阻与滞后往往大一个量级（实例 2/3）； 把\"最高测点\"当\"最热点\"——稀疏布点下最热点可能根本没被测到（实例 1）； 台架摸底一次定终身——老化后产热分布变化（内阻上升），最热点会漂移； 忽视 ntc 自热（激励电流过大读数偏高，设计常识级）。 6. 自测 q1 ：60 个电芯配 4 个 ntc，台架实测同组最大温差 3 k。保护阈值定在 55 °c 时，最热点实际到多少才触发？ q2 ：升温速率 1 k/min、τ = 30 s，读数滞后多少？ q3 ：为什么\"温度传感器精度 ±1 k\"这句话对热保护设计几乎没用？ 答案 q1：触发时 ntc 读 55 °c，同组最热点可能已是 55 + 3 = 58 °c ——阈值必须为代表性误差留裕度，或改用极值估计。 q2：(1/60) k/s × 30 s = 0.5 k 。速率加倍滞后加倍——动态工况读数恒偏低。 q3：系统误差由安装接触热阻、稀疏布点盲区、动态滞后主导，量级可达数 k，远超元件的 ±1 k；元件精度只在\"安装与布点都做对\"之后才生效。 来源 s-03：gb/t 38661-2020（温度采集要求；具体条款数值待核对 → 文末待核对项） s-16：g. plett, battery management systems vol. i（热模型与温度在 bms 中的作用框架） 本课温差/τ/热流密度等数字均为教学示意值，真实量级需按具体结构台架标定 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb/t 38661-2020 原文（s-03） a bms 温度采集技术要求的权威文本 g. plett《battery management systems, vol. i》 b 热模型与产热章节（s-16） [待补链] — 电池包热特性摸底测试方法（公开标准/文献核实后补） 待核对项（本课） gb/t 38661-2020 温度采集条款（量程/精度/采样周期）具体数值 → 建议新 p 项 ntc 组件时间常数与精度的典型规格（本课 30 s / ±1 k 为示意） \"最热点位于远离冷却面区域\"的结构性表述——需按具体包型核实（方向性共识） 单体间温差\"数 k\"量级的公开文献支撑 "}, {"id": "THM-02", "title": "课程 THM-02：电池热模型", "dom": "THM", "verified": false, "html": "<blockquote><p>对应节点 <code>THM-02<\/code>（../domains/08-热管理.md <span class=\"fileref\">（项目文件 ../domains/08-热管理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a>、<a class=\"xlink\" href=\"#/lesson/THM-01\">THM-01<\/a> ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么测点之外还需要模型<\/h3>\n<p>温度传感器只告诉你\"现在、这里\"多热。热管理的三个问题它都答不了：<\/p>\n<ol>\n<li><strong>没测到的地方多热<\/strong>——最热点外推（THM-01 的极值估计靠模型支撑）；<\/li>\n<li><strong>接下来会多热<\/strong>——大倍率工况前瞻预测，提前开冷却而不是事后追；<\/li>\n<li><strong>还能允许多大功率<\/strong>——电热耦合 SOP（<code>ALG-06<\/code>）：功率取决于未来温升，未来温升取决于功率。<\/li>\n<p>节点约束点题：模型精度 vs 算力；产热需含欧姆热 + 极化热（异常时 + 反应热）。车端只能跑集总模型，分布模型留在设计与标定环节——这就是精度/算力的折中。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）产热项。<\/strong> 工程上把电芯产热拆成两部分（Bernardi 方程的简化形式）：<\/p>\n<div class=\"math\">Q = \\underbrace{I\\,(U - U_{OCV})}_{\\text{不可逆：欧姆+极化}} \\;+\\; \\underbrace{I\\,T\\,\\frac{\\mathrm{d}U_{OCV}}{\\mathrm{d}T}}_{\\text{可逆熵热}}<\/div>\n<ul>\n<li><strong>I<\/strong>：电流；<strong>U<\/strong>：端电压；<strong>U−U_OCV<\/strong> 是压降，乘电流就是内阻耗散（欧姆热+极化热，节点约束的两项）；<\/li>\n<li><strong>熵热项<\/strong>：可逆反应热，充放电符号相反，低倍率时占比可观、大倍率时可忽略（量级共识，具体随体系待核对）；<\/li>\n<li><strong>异常反应热<\/strong>：内短路/析锂副反应/热失控分解热不在此方程管辖内——它们是\"故障热\"，对应 THM-05 的预警问题；<\/li>\n<li>最粗的工程简化：Q ≈ I²R_total（把熵热并入等效内阻），手算与初版模型都用它。<\/li>\n<p><strong>（2）集总热模型（lumped thermal model）。<\/strong> 把电芯（或模组）当一个热容节点：<\/p>\n<\/ul>\n<div class=\"math\">C_{th}\\,\\frac{\\mathrm{d}T}{\\mathrm{d}t} = Q - \\frac{T - T_{cool}}{R_{th}}<\/div>\n<ul>\n<li><strong>C_th<\/strong>：热容（J/K），每升温 1 K 需要的热量；<strong>R_th<\/strong>：热阻（K/W），到冷却介质的传热阻力；<strong>T_cool<\/strong>：冷却介质温度；<\/li>\n<li>稳态温升 ΔT_ss = Q·R_th；时间常数 τ_th = R_th·C_th——与 RC 电路完全同构（<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a> 的电路直觉可直接搬过来）。<\/li>\n<p><strong>（3）电热耦合闭环。<\/strong> 内阻 R 随温度变（低温显著增大）、产热 Q 由电流与 R 决定、T 反过来由 Q 决定——车端模型通常用\"查表 R(T, SOC) + 一阶热网络\"实现闭环。<\/p>\n<\/ul>\n<h3>3. 手算实例（数字自洽）<\/h3>\n<h4>实例 1：欧姆产热估算<\/h4>\n<p>100 Ah 方形电芯，直流内阻 0.8 mΩ（教学示意值，新鲜状态 25 °C）：<\/p>\n<ul>\n<li>1C 放电（100 A）：Q = I²R = 100² × 0.0008 = <strong>8 W/电芯<\/strong>；<\/li>\n<li>老化后 1.2 mΩ（示意，+50%）→ <strong>12 W<\/strong>：产热随 SOH 上升（衔接 <a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）；0 °C 内阻约翻倍至 1.6 mΩ（示意）→ <strong>16 W<\/strong>——\"越冷越热\"正反馈的来源（THM-04 会正面利用它）。<\/li>\n<\/ul>\n<h4>实例 2：集总模型温升曲线<\/h4>\n<p>电芯质量 2 kg、等效比热 1000 J/(kg·K)（示意）→ C_th = 2000 J/K；到液冷板热阻 R_th = 0.8 K/W（示意）。1C 恒流放电，Q = 8 W（实例 1）：<\/p>\n<ul>\n<li>稳态温升 ΔT_ss = 8 × 0.8 = <strong>6.4 K<\/strong>；<\/li>\n<li>时间常数 τ_th = 0.8 × 2000 = <strong>1600 s ≈ 27 min<\/strong>；<\/li>\n<li>T(t) = ΔT_ss(1 − e^(−t/τ_th))：10 min → 6.4 × 0.31 ≈ <strong>2.0 K<\/strong>；27 min → 4.0 K；1 h → 5.7 K。<\/li>\n<p>结论：热系统是\"慢系统\"——27 分钟才走完 63%。靠开关冷却追瞬时温度注定滞后，<strong>模型的价值是前瞻预测，不是反馈补救<\/strong>。<\/p>\n<\/ul>\n<h4>实例 3：短时脉冲——为什么不能套稳态公式<\/h4>\n<p>2C（200 A）脉冲 10 s：Q = 200² × 0.0008 = 32 W。若误用稳态公式：32 × 0.8 = 25.6 K——荒谬。正确：10 s ≪ τ_th = 1600 s，近似绝热段：<\/p>\n<div class=\"math\">\\Delta T \\approx \\frac{Q \\cdot t}{C_{th}} = \\frac{32 \\times 10}{2000} = 0.16\\ \\text{K}<\/div>\n<p><strong>脉冲产热几乎全部存进热容，还没来得及流出去<\/strong>——短时温升由 C_th 决定，长时温升由 R_th 决定。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产车端常用\"一阶/二阶集总热网络 + R(T, SOC) 查表\"，用于温升预测、最热点外推（THM-01）与电热耦合 SOP（<code>ALG-06<\/code>）；<\/li>\n<li>R_th / C_th 由台架标定：量热实验或温度阶跃辨识（方法学同 ALG-10 参数辨识）；R(T, SOC) 用 HPPC 类测试（S-26）；<\/li>\n<li>模型漂移随老化：内阻增大（产热↑）+ 导热垫老化（R_th↑）双升——高端方案按 SOH 修正；<\/li>\n<li>设计侧（冷却板流道、隔热布局）用一维/CFD 分布模型，与车端集总模型是两个物种、两个用途。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>拿 25 °C 额定内阻算全温域产热——低温 R 有翻倍级差异（实例 1）；<\/li>\n<li>用稳态 Q×R_th 估脉冲温升——差两个数量级（实例 3）；<\/li>\n<li>忽略熵热项——低倍率长循环（如慢充 V2G 类场景）中占比不可忽略（量级待核对）；<\/li>\n<li>把集总模型当分布模型用——它给不了最热点位置，只给平均温度；最热点仍要 THM-01 的布点数据校准。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：C_th = 2500 J/K、R_th = 1.0 K/W、Q = 10 W 恒定：稳态温升与时间常数？ <strong>Q2<\/strong>：同一电芯从 1C 加倍到 2C，产热变成几倍？说明什么？ <strong>Q3<\/strong>：为什么低温大电流放电时\"越放越热、越热越能放\"是正反馈？对冷启动意味着什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：ΔT_ss = 10 × 1.0 = <strong>10 K<\/strong>；τ = 1.0 × 2500 = <strong>2500 s ≈ 42 min<\/strong>。<\/li>\n<li>Q2：Q = I²R，电流加倍产热 <strong>4 倍<\/strong>（近似，R 实际还随电流变）——倍率对热的敏感性是平方级，这就是大倍率必须前瞻控温的数学根源。<\/li>\n<li>Q3：低温 R 大 → Q = I²R 大 → 温度升 → R 变小 → 同样电流下压降与产热回落、放电能力恢复。对冷启动：自加热（THM-04）正是主动利用这个正反馈，但要控制速率防局部过热与析锂。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（产热方程与集总热模型框架）<\/li>\n<li>S-26：INL《FreedomCAR Battery Test Manual》(2014)（直流内阻 HPPC 测试方法，R(T, SOC) 标定的来源方法）<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>G. Plett《Battery Management Systems, Vol. I》<\/td><td>B<\/td><td>电—热建模章节（S-16）<\/td><\/tr><tr><td>PyBaMM 开源项目<\/td><td>B<\/td><td>知名 Python 电池建模库，含集总与分布热模型<\/td><\/tr><tr><td>INL HPPC 手册原文（S-26）<\/td><td>A<\/td><td>内阻测试标准程序，公开 PDF<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>Bernardi 产热方程原始文献（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>熵热项在低倍率下的占比量级 → 建议新 P 项<\/li>\n<li>方形电芯比热/质量/热阻的典型规格区间（本课 1000 J/(kg·K)、0.8 K/W 为示意）<\/li>\n<li>\"低温内阻约翻倍\"的温度系数文献值<\/li>\n<li>导热垫老化导致 R_th 漂移的公开数据<\/li>\n<\/ul>", "text": " 对应节点 thm-02 （../domains/08-热管理.md （项目文件 ../domains/08-热管理.md） ）｜ 前置： alg-10 、 thm-01 ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么测点之外还需要模型 温度传感器只告诉你\"现在、这里\"多热。热管理的三个问题它都答不了： 没测到的地方多热 ——最热点外推（thm-01 的极值估计靠模型支撑）； 接下来会多热 ——大倍率工况前瞻预测，提前开冷却而不是事后追； 还能允许多大功率 ——电热耦合 sop（ alg-06 ）：功率取决于未来温升，未来温升取决于功率。 节点约束点题：模型精度 vs 算力；产热需含欧姆热 + 极化热（异常时 + 反应热）。车端只能跑集总模型，分布模型留在设计与标定环节——这就是精度/算力的折中。 2. 机制展开 （1）产热项。 工程上把电芯产热拆成两部分（bernardi 方程的简化形式）： q = \\underbrace{i\\,(u - u_{ocv})}_{\\text{不可逆：欧姆+极化}} \\;+\\; \\underbrace{i\\,t\\,\\frac{\\mathrm{d}u_{ocv}}{\\mathrm{d}t}}_{\\text{可逆熵热}} i ：电流； u ：端电压； u−u_ocv 是压降，乘电流就是内阻耗散（欧姆热+极化热，节点约束的两项）； 熵热项 ：可逆反应热，充放电符号相反，低倍率时占比可观、大倍率时可忽略（量级共识，具体随体系待核对）； 异常反应热 ：内短路/析锂副反应/热失控分解热不在此方程管辖内——它们是\"故障热\"，对应 thm-05 的预警问题； 最粗的工程简化：q ≈ i²r_total（把熵热并入等效内阻），手算与初版模型都用它。 （2）集总热模型（lumped thermal model）。 把电芯（或模组）当一个热容节点： c_{th}\\,\\frac{\\mathrm{d}t}{\\mathrm{d}t} = q - \\frac{t - t_{cool}}{r_{th}} c_th ：热容（j/k），每升温 1 k 需要的热量； r_th ：热阻（k/w），到冷却介质的传热阻力； t_cool ：冷却介质温度； 稳态温升 δt_ss = q·r_th；时间常数 τ_th = r_th·c_th——与 rc 电路完全同构（ alg-10 的电路直觉可直接搬过来）。 （3）电热耦合闭环。 内阻 r 随温度变（低温显著增大）、产热 q 由电流与 r 决定、t 反过来由 q 决定——车端模型通常用\"查表 r(t, soc) + 一阶热网络\"实现闭环。 3. 手算实例（数字自洽） 实例 1：欧姆产热估算 100 ah 方形电芯，直流内阻 0.8 mω（教学示意值，新鲜状态 25 °c）： 1c 放电（100 a）：q = i²r = 100² × 0.0008 = 8 w/电芯 ； 老化后 1.2 mω（示意，+50%）→ 12 w ：产热随 soh 上升（衔接 alg-05 ）；0 °c 内阻约翻倍至 1.6 mω（示意）→ 16 w ——\"越冷越热\"正反馈的来源（thm-04 会正面利用它）。 实例 2：集总模型温升曲线 电芯质量 2 kg、等效比热 1000 j/(kg·k)（示意）→ c_th = 2000 j/k；到液冷板热阻 r_th = 0.8 k/w（示意）。1c 恒流放电，q = 8 w（实例 1）： 稳态温升 δt_ss = 8 × 0.8 = 6.4 k ； 时间常数 τ_th = 0.8 × 2000 = 1600 s ≈ 27 min ； t(t) = δt_ss(1 − e^(−t/τ_th))：10 min → 6.4 × 0.31 ≈ 2.0 k ；27 min → 4.0 k；1 h → 5.7 k。 结论：热系统是\"慢系统\"——27 分钟才走完 63%。靠开关冷却追瞬时温度注定滞后， 模型的价值是前瞻预测，不是反馈补救 。 实例 3：短时脉冲——为什么不能套稳态公式 2c（200 a）脉冲 10 s：q = 200² × 0.0008 = 32 w。若误用稳态公式：32 × 0.8 = 25.6 k——荒谬。正确：10 s ≪ τ_th = 1600 s，近似绝热段： \\delta t \\approx \\frac{q \\cdot t}{c_{th}} = \\frac{32 \\times 10}{2000} = 0.16\\ \\text{k} 脉冲产热几乎全部存进热容，还没来得及流出去 ——短时温升由 c_th 决定，长时温升由 r_th 决定。 4. 工程实态 量产车端常用\"一阶/二阶集总热网络 + r(t, soc) 查表\"，用于温升预测、最热点外推（thm-01）与电热耦合 sop（ alg-06 ）； r_th / c_th 由台架标定：量热实验或温度阶跃辨识（方法学同 alg-10 参数辨识）；r(t, soc) 用 hppc 类测试（s-26）； 模型漂移随老化：内阻增大（产热↑）+ 导热垫老化（r_th↑）双升——高端方案按 soh 修正； 设计侧（冷却板流道、隔热布局）用一维/cfd 分布模型，与车端集总模型是两个物种、两个用途。 5. 常见误区 拿 25 °c 额定内阻算全温域产热——低温 r 有翻倍级差异（实例 1）； 用稳态 q×r_th 估脉冲温升——差两个数量级（实例 3）； 忽略熵热项——低倍率长循环（如慢充 v2g 类场景）中占比不可忽略（量级待核对）； 把集总模型当分布模型用——它给不了最热点位置，只给平均温度；最热点仍要 thm-01 的布点数据校准。 6. 自测 q1 ：c_th = 2500 j/k、r_th = 1.0 k/w、q = 10 w 恒定：稳态温升与时间常数？ q2 ：同一电芯从 1c 加倍到 2c，产热变成几倍？说明什么？ q3 ：为什么低温大电流放电时\"越放越热、越热越能放\"是正反馈？对冷启动意味着什么？ 答案 q1：δt_ss = 10 × 1.0 = 10 k ；τ = 1.0 × 2500 = 2500 s ≈ 42 min 。 q2：q = i²r，电流加倍产热 4 倍 （近似，r 实际还随电流变）——倍率对热的敏感性是平方级，这就是大倍率必须前瞻控温的数学根源。 q3：低温 r 大 → q = i²r 大 → 温度升 → r 变小 → 同样电流下压降与产热回落、放电能力恢复。对冷启动：自加热（thm-04）正是主动利用这个正反馈，但要控制速率防局部过热与析锂。 来源 s-16：g. plett, battery management systems vol. i（产热方程与集总热模型框架） s-26：inl《freedomcar battery test manual》(2014)（直流内阻 hppc 测试方法，r(t, soc) 标定的来源方法） 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 g. plett《battery management systems, vol. i》 b 电—热建模章节（s-16） pybamm 开源项目 b 知名 python 电池建模库，含集总与分布热模型 inl hppc 手册原文（s-26） a 内阻测试标准程序，公开 pdf [待补链] — bernardi 产热方程原始文献（核实后补） 待核对项（本课） 熵热项在低倍率下的占比量级 → 建议新 p 项 方形电芯比热/质量/热阻的典型规格区间（本课 1000 j/(kg·k)、0.8 k/w 为示意） \"低温内阻约翻倍\"的温度系数文献值 导热垫老化导致 r_th 漂移的公开数据 "}, {"id": "THM-03", "title": "课程 THM-03：与整车热管理联动", "dom": "THM", "verified": false, "html": "<blockquote><p>对应节点 <code>THM-03<\/code>（../domains/08-热管理.md <span class=\"fileref\">（项目文件 ../domains/08-热管理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/THM-02\">THM-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么 BMS 不能\"自己管自己\"<\/h3>\n<p>电池的冷与热，执行器往往不归 BMS 独有：<\/p>\n<ol>\n<li><strong>共用热源<\/strong>：冬季电池加热与驾驶舱暖风可能共用同一 PTC/热泵，能量要分配；<\/li>\n<li><strong>共用回路<\/strong>：电池冷却液回路与电驱冷却回路可能串联/并联，散热器与风扇共享；<\/li>\n<li><strong>能耗话语权在整车<\/strong>：开多大流量、用不用压缩机，直接决定续航——这是 VCU（Vehicle Control Unit，整车控制器）/热管理控制器的职责域。<\/li>\n<p>于是 BMS 的角色从\"执行者\"变成\"需求方\"：算出电池需要多少冷/热，发请求，等执行，收反馈。节点约束点题：请求-响应链路延迟影响控制品质；与 VCU 的策略权限需划分。<\/p>\n<\/ol>\n<h3>2. 机制展开：请求-响应链路与权限划分<\/h3>\n<p><strong>（1）链路五段。<\/strong> BMS 热需求到达执行器要走过：<\/p>\n<p>``<code> BMS 算法（周期 100 ms 级，示意）→ CAN 发送（10 ms 级，S-11） → 热管理控制器仲裁（周期 10~100 ms 级，示意）→ 执行器动作（泵/阀秒级爬升，示意） → 冷却液/制冷剂热惯性生效（分钟级） <\/code>``<\/p>\n<p>前四段是\"通信与机电延迟\"（秒级合计，示意），最后一段是物理惯性。控制设计要点：<strong>正常延迟会被热惯性吸收（见实例），真正要防的是链路失效——报文丢失、仲裁失败、执行器卡死。<\/strong><\/p>\n<p><strong>（2）请求什么。<\/strong> 典型热需求报文要素（示意）：目标（制冷/加热）、功率需求（kW）、目标水温/目标电池温度、最小流量请求、优先级标注（安全 &gt; 续航 &gt; 舒适）。<\/p>\n<p><strong>（3）权限怎么划。<\/strong> 量产常见分工（架构共识，具体项目有变体）：<\/p>\n<ul>\n<li><strong>BMS 一票否决权<\/strong>：电池温度上下限、热相关充放电功率限制——保护职责不可外包；<\/li>\n<li><strong>热管理控制器仲裁权<\/strong>：何时用哪个热源、驾驶舱与电池之间能量分配、风扇/水泵转速——能耗与舒适职责；<\/li>\n<li>冲突案例：冬季电池要加热 + 乘客要暖风、热源只有 5 kW（示意）——按优先级分时或按比例分配，规则在热管理控制器，但\"BMS 最低加热需求\"是硬约束。<\/li>\n<p><strong>（4）失效设计。<\/strong> 请求报文要有 alive 计数与超时；超时后 BMS 侧降级（按保守假设限功率，衔接 <a class=\"xlink\" href=\"#/lesson/FLT-03\">FLT-03<\/a>），热管理侧回退到默认流量。<\/p>\n<\/ul>\n<h3>3. 工程案例：链路延迟与失效的时间账（教学示意值）<\/h3>\n<p>场景：快充中电芯产热升至 Q = 2.5 kW（模组级，示意），BMS 把冷却流量请求从 10 L/min 提到 20 L/min；冷却能力近似随流量线性（示意系数 0.2 kW/(L/min)）→ 10 L/min 制冷 2 kW（此前刚好平衡），20 L/min 制冷 4 kW。<\/p>\n<ul>\n<li><strong>正常链路（合计延迟 0.5 s，示意）<\/strong>：延迟期间流量仍是 10 L/min，净产热 = 2.5 − 2.0 = 0.5 kW，多积累热量 = 500 W × 0.5 s = 250 J；对热容 5 kJ/K 的模组（示意）温升 = 250/5000 = <strong>0.05 K——可忽略<\/strong>。热惯性吸收了正常延迟。<\/li>\n<li><strong>异常链路（仲裁失败重试拖到 5 s，示意）<\/strong>：积累 500 × 5 = 2500 J → <strong>0.5 K<\/strong>，且若请求彻底丢失则永远到不了 20 L/min——温升不受控地继续。所以超时检测 + 回退默认流量 + BMS 限功率三件事缺一不可。<\/li>\n<li>教学点：<strong>延迟本身不可怕，无反馈的延迟才可怕。<\/strong> 控制品质问题多半不是\"慢\"，而是\"断了没人知道\"。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>趋势：多通阀集成热管理回路 + 热泵（行业新平台普遍方向，观点级表述）——电池、电驱、座舱热量按需搬运，冬季续航收益大，但仲裁逻辑复杂度同步上升；<\/li>\n<li>架构趋势：BMS 与热管理软件向跨域控制器合并（见 <code>00-跨域层<\/code> 域），\"请求-响应\"可能退化成函数调用，但<strong>权限划分的逻辑不变<\/strong>；<\/li>\n<li>冬季场景是联动设计的试金石：充电预热、余热利用（电驱废热给电池加热）、保温策略三件事都是 THM-03 与 THM-04 的交界；<\/li>\n<li>\"主机厂 BMS = 把车管明白\"的典型节点：热联动的接口条款是主机厂-电池厂分工的一部分（<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a>、compare/matrix.md 角色层）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>以为 BMS 直接控制水泵/阀——多数架构是\"请求\"，执行权在热管理控制器；也有 BMS 直控方案，<strong>必须按项目架构确认<\/strong>，不能想当然；<\/li>\n<li>把链路延迟当零、把反馈当必然——超时与降级路径是设计项不是附录；<\/li>\n<li>两个控制器都发指令（仲裁缺失）→ 执行器来回振荡；<\/li>\n<li>热需求报文只写\"要冷\"不写\"多少 kW / 什么水温\"——执行侧无法闭环，控制品质崩坏。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：请求链路正常延迟 0.5 s、异常时 30 s，为什么两者的后果不是线性差 60 倍，而是\"可忽略 vs 不受控\"的性质差异？ <strong>Q2<\/strong>：冬季\"电池加热 vs 座舱暖风\"抢 5 kW 热源，规则该谁定？硬约束该谁给？ <strong>Q3<\/strong>：BMS 侧如何发现\"热管理控制器没执行我的请求\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：0.5 s 时热惯性吸收（0.05 K 量级）；30 s 若仍无反馈说明链路失效，净产热持续积累且没有\"到达\"的终点——性质从\"延迟\"变成\"失控\"，所以必须超时检测 + 回退 + 限功率，而不是只优化延迟本身。<\/li>\n<li>Q2：分配规则（能耗/舒适权衡）在热管理控制器/整车策略；\"电池最低加热需求与温度上下限\"是 BMS 的硬约束（一票否决）——保护职责与能耗职责分开。<\/li>\n<li>Q3：请求报文带计数器/目标值，热管理反馈实际流量/水温；BMS 比对反馈与请求——超时或不一致即判失效，进入降级（FLT-03 逻辑）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-11：ISO 11898 系列（CAN 通信时延与可靠性框架）<\/li>\n<li>S-03：GB/T 38661-2020（<strong>2026-11-18 核实<\/strong>：输出要求表含 \"f) 热管理接口\"——BMS 须向整车提供热管理信号/数据；信号清单细节待全文）<\/li>\n<li>权限划分与失效设计为架构共识表述；具体量化数值均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-18 更新）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=DB3ACC49AC4A146FAA311BB468ACA290\" target=\"_blank\" rel=\"noopener\">GB/T 38661-2020 全文公开页（openstd）<\/a><\/td><td>A<\/td><td>✅（在线阅读）<\/td><td>\"f) 热管理接口\"条款出处<\/td><\/tr><tr><td>ISO 11898 原文（S-11）<\/td><td>A<\/td><td>—<\/td><td>CAN 通信标准文本<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>—<\/td><td>整车热管理经典教材/综述（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~GB/T 38661-2020 热管理接口条款~~ → <strong>2026-11-18 已核实存在<\/strong>（输出要求表 f 项；具体信号清单待全文）。<\/li>\n<li>车端 PTC/热泵功率与冷却流量典型量级（本课 5 kW / 10~20 L/min 为示意）。<\/li>\n<li>\"多通阀+热泵是新平台普遍方向\"的产业证据（多家平台发布资料交叉核实）。<\/li>\n<li>热管理控制器仲裁周期的典型量级（本课 10~100 ms 为示意）。<\/li>\n<\/ul>", "text": " 对应节点 thm-03 （../domains/08-热管理.md （项目文件 ../domains/08-热管理.md） ）｜ 前置： thm-02 、 sys-02 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么 bms 不能\"自己管自己\" 电池的冷与热，执行器往往不归 bms 独有： 共用热源 ：冬季电池加热与驾驶舱暖风可能共用同一 ptc/热泵，能量要分配； 共用回路 ：电池冷却液回路与电驱冷却回路可能串联/并联，散热器与风扇共享； 能耗话语权在整车 ：开多大流量、用不用压缩机，直接决定续航——这是 vcu（vehicle control unit，整车控制器）/热管理控制器的职责域。 于是 bms 的角色从\"执行者\"变成\"需求方\"：算出电池需要多少冷/热，发请求，等执行，收反馈。节点约束点题：请求-响应链路延迟影响控制品质；与 vcu 的策略权限需划分。 2. 机制展开：请求-响应链路与权限划分 （1）链路五段。 bms 热需求到达执行器要走过： `` bms 算法（周期 100 ms 级，示意）→ can 发送（10 ms 级，s-11） → 热管理控制器仲裁（周期 10~100 ms 级，示意）→ 执行器动作（泵/阀秒级爬升，示意） → 冷却液/制冷剂热惯性生效（分钟级） `` 前四段是\"通信与机电延迟\"（秒级合计，示意），最后一段是物理惯性。控制设计要点： 正常延迟会被热惯性吸收（见实例），真正要防的是链路失效——报文丢失、仲裁失败、执行器卡死。 （2）请求什么。 典型热需求报文要素（示意）：目标（制冷/加热）、功率需求（kw）、目标水温/目标电池温度、最小流量请求、优先级标注（安全 &gt; 续航 &gt; 舒适）。 （3）权限怎么划。 量产常见分工（架构共识，具体项目有变体）： bms 一票否决权 ：电池温度上下限、热相关充放电功率限制——保护职责不可外包； 热管理控制器仲裁权 ：何时用哪个热源、驾驶舱与电池之间能量分配、风扇/水泵转速——能耗与舒适职责； 冲突案例：冬季电池要加热 + 乘客要暖风、热源只有 5 kw（示意）——按优先级分时或按比例分配，规则在热管理控制器，但\"bms 最低加热需求\"是硬约束。 （4）失效设计。 请求报文要有 alive 计数与超时；超时后 bms 侧降级（按保守假设限功率，衔接 flt-03 ），热管理侧回退到默认流量。 3. 工程案例：链路延迟与失效的时间账（教学示意值） 场景：快充中电芯产热升至 q = 2.5 kw（模组级，示意），bms 把冷却流量请求从 10 l/min 提到 20 l/min；冷却能力近似随流量线性（示意系数 0.2 kw/(l/min)）→ 10 l/min 制冷 2 kw（此前刚好平衡），20 l/min 制冷 4 kw。 正常链路（合计延迟 0.5 s，示意） ：延迟期间流量仍是 10 l/min，净产热 = 2.5 − 2.0 = 0.5 kw，多积累热量 = 500 w × 0.5 s = 250 j；对热容 5 kj/k 的模组（示意）温升 = 250/5000 = 0.05 k——可忽略 。热惯性吸收了正常延迟。 异常链路（仲裁失败重试拖到 5 s，示意） ：积累 500 × 5 = 2500 j → 0.5 k ，且若请求彻底丢失则永远到不了 20 l/min——温升不受控地继续。所以超时检测 + 回退默认流量 + bms 限功率三件事缺一不可。 教学点： 延迟本身不可怕，无反馈的延迟才可怕。 控制品质问题多半不是\"慢\"，而是\"断了没人知道\"。 4. 工程实态 趋势：多通阀集成热管理回路 + 热泵（行业新平台普遍方向，观点级表述）——电池、电驱、座舱热量按需搬运，冬季续航收益大，但仲裁逻辑复杂度同步上升； 架构趋势：bms 与热管理软件向跨域控制器合并（见 00-跨域层 域），\"请求-响应\"可能退化成函数调用，但 权限划分的逻辑不变 ； 冬季场景是联动设计的试金石：充电预热、余热利用（电驱废热给电池加热）、保温策略三件事都是 thm-03 与 thm-04 的交界； \"主机厂 bms = 把车管明白\"的典型节点：热联动的接口条款是主机厂-电池厂分工的一部分（ sys-02 、compare/matrix.md 角色层）。 5. 常见误区 以为 bms 直接控制水泵/阀——多数架构是\"请求\"，执行权在热管理控制器；也有 bms 直控方案， 必须按项目架构确认 ，不能想当然； 把链路延迟当零、把反馈当必然——超时与降级路径是设计项不是附录； 两个控制器都发指令（仲裁缺失）→ 执行器来回振荡； 热需求报文只写\"要冷\"不写\"多少 kw / 什么水温\"——执行侧无法闭环，控制品质崩坏。 6. 自测 q1 ：请求链路正常延迟 0.5 s、异常时 30 s，为什么两者的后果不是线性差 60 倍，而是\"可忽略 vs 不受控\"的性质差异？ q2 ：冬季\"电池加热 vs 座舱暖风\"抢 5 kw 热源，规则该谁定？硬约束该谁给？ q3 ：bms 侧如何发现\"热管理控制器没执行我的请求\"？ 答案 q1：0.5 s 时热惯性吸收（0.05 k 量级）；30 s 若仍无反馈说明链路失效，净产热持续积累且没有\"到达\"的终点——性质从\"延迟\"变成\"失控\"，所以必须超时检测 + 回退 + 限功率，而不是只优化延迟本身。 q2：分配规则（能耗/舒适权衡）在热管理控制器/整车策略；\"电池最低加热需求与温度上下限\"是 bms 的硬约束（一票否决）——保护职责与能耗职责分开。 q3：请求报文带计数器/目标值，热管理反馈实际流量/水温；bms 比对反馈与请求——超时或不一致即判失效，进入降级（flt-03 逻辑）。 来源 s-11：iso 11898 系列（can 通信时延与可靠性框架） s-03：gb/t 38661-2020（ 2026-11-18 核实 ：输出要求表含 \"f) 热管理接口\"——bms 须向整车提供热管理信号/数据；信号清单细节待全文） 权限划分与失效设计为架构共识表述；具体量化数值均为教学示意值 延伸资源（2026-11-18 更新） 资源 级别 免费 说明 gb/t 38661-2020 全文公开页（openstd） a ✅（在线阅读） \"f) 热管理接口\"条款出处 iso 11898 原文（s-11） a — can 通信标准文本 [待补链] — — 整车热管理经典教材/综述（核实后补） 待核对项（本课） ~~gb/t 38661-2020 热管理接口条款~~ → 2026-11-18 已核实存在 （输出要求表 f 项；具体信号清单待全文）。 车端 ptc/热泵功率与冷却流量典型量级（本课 5 kw / 10~20 l/min 为示意）。 \"多通阀+热泵是新平台普遍方向\"的产业证据（多家平台发布资料交叉核实）。 热管理控制器仲裁周期的典型量级（本课 10~100 ms 为示意）。 "}, {"id": "THM-04", "title": "课程 THM-04：低温加热策略", "dom": "THM", "verified": false, "html": "<blockquote><p>对应节点 <code>THM-04<\/code>（../domains/08-热管理.md <span class=\"fileref\">（项目文件 ../domains/08-热管理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/THM-02\">THM-02<\/a>、<a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么低温必须\"先加热再干活\"<\/h3>\n<p>低温下电池的三重恶化（机理为电化学共识）：<\/p>\n<ol>\n<li><strong>放电功率掉<\/strong>：内阻增大（THM-02 实例 1：0 °C 约翻倍，示意）→ 同电流压降大 → 电压先触保护；<\/li>\n<li><strong>充电受析锂约束<\/strong>：CHG-03 示意倍率地图上，0 °C 只允许 0.3C——冬天快充慢的根源；<\/li>\n<li><strong>寿命受损<\/strong>：低温充电析锂不可逆消耗活性锂（CHG-03 三大危害）。<\/li>\n<p>三条加起来结论一致：<strong>把电芯拉回可用温度窗（示意 10~35 °C 为佳区间）是冬季策略的第一步<\/strong>，加热速率、能耗、安全性构成三角权衡。节点约束点题：加热倍率与析锂平衡；自加热方式的安全性需专门验证。<\/p>\n<\/ol>\n<h3>2. 机制展开：加热方式谱系<\/h3>\n<p><strong>（1）PTC 液加热。<\/strong> PTC（Positive Temperature Coefficient，正温度系数电阻）加热冷却液，热量经液冷板传入电芯。电热直接转换，能效恒为 1（一度电一度热）；成熟可控，但<strong>热要穿过整条传热路径<\/strong>，速率受 R_th 限制。<\/p>\n<p><strong>（2）电驱余热利用。<\/strong> 电机/电控的废热经换向阀导入电池回路——能效最好（废热免费），但依赖\"电机在跑\"（行车加热可用，插枪充电不可用）。<\/p>\n<p><strong>（3）热泵/压缩机侧制热。<\/strong> 制冷剂回路 COP（能效比）&gt;1（示意 2~3），同样电量搬更多热；代价是系统复杂度与低温下热泵自身效率衰减。<\/p>\n<p><strong>（4）脉冲自加热。<\/strong> 让电池自己产热（THM-02：Q = I²R，产热在电芯内部，无传热路径损失）。实现路线两条：<\/p>\n<ul>\n<li>直接脉冲充放交替（需外部能量缓冲，充电半波受析锂约束）；<\/li>\n<li>借电机绕组做功率变换器，产生低频大电流流经电池（行业新平台推广方向，观点级）。<\/li>\n<p><strong>自加热速率文献区间（2026-11-23 核实，S-93）：常规脉冲 ~7 K/min（Qu 2019）到内嵌镍箔 SHLB 设计 ~96 K/min（Zhang 2016，−20→0 ℃ 仅 12.5 s）——跨度近 14 倍，取决于结构路线<\/strong>；安全性硬门槛不变。<strong>安全性是硬门槛<\/strong>：脉冲电流边界、温度均匀性、循环寿命影响都需专门验证——节点约束原文。<\/p>\n<p><strong>（5）加热与充电的协同节奏。<\/strong> 加热中若同时充电，充电电流上限查当前温度的倍率地图（CHG-03）——温度升 → 允许电流升 → \"边加热边爬电流\"。策略设计对象是这条动态曲线，不是两个独立开关。<\/p>\n<\/ul>\n<h3>3. 手算实例（数字自洽）<\/h3>\n<h4>实例 1：PTC 加热时间<\/h4>\n<p>75 kWh 包（示例车，教学示意值）：整包质量 500 kg、等效比热 1000 J/(kg·K)（示意）→ C_pack = 5×10⁵ J/K。目标 −10 °C → 10 °C（ΔT = 20 K）：<\/p>\n<ul>\n<li>需热 E = 5×10⁵ × 20 = 1×10⁷ J = <strong>2.78 kWh<\/strong>；<\/li>\n<li>PTC 功率 7 kW（示意，车端常见量级）→ 理想 t = 2.78/7 ≈ <strong>24 min<\/strong>；<\/li>\n<li>实际要乘\"传热路径损耗 + 包体散热\"系数（示意 1.5~2 倍）→ <strong>约 36~48 min<\/strong>——这就是冬天\"插枪预热半小时\"的来源。<\/li>\n<\/ul>\n<h4>实例 2：脉冲自加热速率<\/h4>\n<p>100 Ah 电芯，−10 °C 内阻 2.5 mΩ（示意，约为 25 °C 值 3 倍），±2C（±200 A）脉冲（示意）：<\/p>\n<ul>\n<li>Q = I²R = 200² × 0.0025 = <strong>100 W/电芯<\/strong>（放电与充电半波都产热，欧姆热与电流方向无关）；<\/li>\n<li>C_th = 2000 J/K（THM-02 同参数）→ 理论速率 = 100/2000 = 0.05 K/s = <strong>3 K/min<\/strong>（未计散热；文献对照：常规脉冲 ~7 K/min、SHLB 设计可达 ~96 K/min，S-93——本例结构介于两者之间属合理示意）；<\/li>\n<li>对比：PTC 路径要先把冷却液和板子烧热，电芯级速率通常明显低于此——<strong>产热位置决定速率上限<\/strong>。<\/li>\n<\/ul>\n<h4>实例 3：加热中的析锂平衡推演<\/h4>\n<p>加热至 5 °C 时脉冲进入充电半波 1C：查 CHG-03 示意地图，0~10 °C 档充电只允许 0.2~0.3C → <strong>超界，有析锂风险<\/strong>。策略方向（方向性共识，具体标定为示意）：<\/p>\n<ul>\n<li>不对称脉冲：放电半波 2C、充电半波 ≤0.3C，产热主要来自放电段；<\/li>\n<li>或加热阶段不通大充电电流，充电等温度达标后按地图爬坡；<\/li>\n<li>自加热的安全验证包必须覆盖\"最冷点温度下的最大充电脉冲\"工况（衔接 THM-01 极值估计）。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产主流 = PTC/热泵液热 + 行车余热利用组合；插枪场景\"桩端供电加热\"（不耗电池电，充电前自动预热）是新体验标配（趋势表述）；<\/li>\n<li>自加热（含电机绕组路线）在多品牌新平台推广中（观点级）；\"全气候电池\"类成果属电芯侧方案（代表工作待补文献）；<\/li>\n<li>冬季体验的关键指标是\"插枪到可快充的时间\"——加热策略直接决定（THM-03 联动：热源能量分配）；<\/li>\n<li>低温相关安全要求见 GB 38031-2025（S-01，条款细节待核对 → P-05）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>低温直接大电流充电——析锂三角（低温×大电流×高 SOC）正面撞上（CHG-03）；<\/li>\n<li>只看平均温度不看最冷点——低温段温差被放大，析锂判据要用最冷点（THM-01）；<\/li>\n<li>把加热速率当唯一指标——能耗（续航惩罚）与寿命（脉冲应力）是三角的另外两边；<\/li>\n<li>认为 PTC\"慢是因为功率小\"——多数时候瓶颈是传热路径 R_th，不是 PTC 功率本身。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：实例 1 中若整包热容估错 50%（结构共享热容没算进去），加热时间误差多少？ <strong>Q2<\/strong>：脉冲自加热为何充电半波必须缩到 0.3C 以下？产热损失多大比例？ <strong>Q3<\/strong>：为什么自加热速率上限高于 PTC？用\"产热位置\"与\"R_th\"回答。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：E 与 C_pack 成正比 → 时间同比例 +50%：理想 24 → 36 min；含损耗系数后约 <strong>54~72 min<\/strong>——热容参数是加热时间估算的第一敏感项。<\/li>\n<li>Q2：5 °C 下充电允许倍率约 0.2~0.3C（示意地图），1C 超界有析锂风险。产热对比：充电 0.3C 时 Q = 30² × 0.0025 = 2.25 W vs 放电 2C 的 100 W——充电半波产热占比骤降，总速率约降近半（示意，需按占空比细算），这正是\"加热速率 vs 析锂平衡\"的量化体现。<\/li>\n<li>Q3：PTC 的热要穿过加热器→冷却液→板→电芯整条串联热阻，速率受 R_th 限制；自加热产热在电芯内部（I²R），传热路径为零，速率上限由 C_th 与允许电流决定。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（产热与热模型框架）<\/li>\n<li>S-01：GB 38031-2025（低温相关安全要求，条款细节待核对 → P-05）<\/li>\n<li>析锂机理与\"先加热再充电\"为电化学/工程共识；本课速率、内阻、热容均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>[待补链]<\/td><td>—<\/td><td>脉冲自加热代表学术工作（自加热锂离子电池结构方向，具体篇目核实后补）<\/td><\/tr><tr><td>G. Plett《Battery Management Systems, Vol. I》<\/td><td>B<\/td><td>热模型与产热章节（S-16）<\/td><\/tr><tr><td>GB 38031-2025 原文（S-01）<\/td><td>A<\/td><td>安全底线条款<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>脉冲自加热速率的公开文献区间（本课 3 K/min 为示意推演）→ 建议新 P 项<\/li>\n<li>车端 PTC 功率典型量级（本课 7 kW 为示意）<\/li>\n<li>\"低温内阻倍数\"的温度系数文献值（与 THM-02 共用）<\/li>\n<li>电机绕组自加热路线的公开技术资料与安全验证案例<\/li>\n<\/ul>", "text": " 对应节点 thm-04 （../domains/08-热管理.md （项目文件 ../domains/08-热管理.md） ）｜ 前置： thm-02 、 chg-03 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么低温必须\"先加热再干活\" 低温下电池的三重恶化（机理为电化学共识）： 放电功率掉 ：内阻增大（thm-02 实例 1：0 °c 约翻倍，示意）→ 同电流压降大 → 电压先触保护； 充电受析锂约束 ：chg-03 示意倍率地图上，0 °c 只允许 0.3c——冬天快充慢的根源； 寿命受损 ：低温充电析锂不可逆消耗活性锂（chg-03 三大危害）。 三条加起来结论一致： 把电芯拉回可用温度窗（示意 10~35 °c 为佳区间）是冬季策略的第一步 ，加热速率、能耗、安全性构成三角权衡。节点约束点题：加热倍率与析锂平衡；自加热方式的安全性需专门验证。 2. 机制展开：加热方式谱系 （1）ptc 液加热。 ptc（positive temperature coefficient，正温度系数电阻）加热冷却液，热量经液冷板传入电芯。电热直接转换，能效恒为 1（一度电一度热）；成熟可控，但 热要穿过整条传热路径 ，速率受 r_th 限制。 （2）电驱余热利用。 电机/电控的废热经换向阀导入电池回路——能效最好（废热免费），但依赖\"电机在跑\"（行车加热可用，插枪充电不可用）。 （3）热泵/压缩机侧制热。 制冷剂回路 cop（能效比）&gt;1（示意 2~3），同样电量搬更多热；代价是系统复杂度与低温下热泵自身效率衰减。 （4）脉冲自加热。 让电池自己产热（thm-02：q = i²r，产热在电芯内部，无传热路径损失）。实现路线两条： 直接脉冲充放交替（需外部能量缓冲，充电半波受析锂约束）； 借电机绕组做功率变换器，产生低频大电流流经电池（行业新平台推广方向，观点级）。 自加热速率文献区间（2026-11-23 核实，s-93）：常规脉冲 ~7 k/min（qu 2019）到内嵌镍箔 shlb 设计 ~96 k/min（zhang 2016，−20→0 ℃ 仅 12.5 s）——跨度近 14 倍，取决于结构路线 ；安全性硬门槛不变。 安全性是硬门槛 ：脉冲电流边界、温度均匀性、循环寿命影响都需专门验证——节点约束原文。 （5）加热与充电的协同节奏。 加热中若同时充电，充电电流上限查当前温度的倍率地图（chg-03）——温度升 → 允许电流升 → \"边加热边爬电流\"。策略设计对象是这条动态曲线，不是两个独立开关。 3. 手算实例（数字自洽） 实例 1：ptc 加热时间 75 kwh 包（示例车，教学示意值）：整包质量 500 kg、等效比热 1000 j/(kg·k)（示意）→ c_pack = 5×10⁵ j/k。目标 −10 °c → 10 °c（δt = 20 k）： 需热 e = 5×10⁵ × 20 = 1×10⁷ j = 2.78 kwh ； ptc 功率 7 kw（示意，车端常见量级）→ 理想 t = 2.78/7 ≈ 24 min ； 实际要乘\"传热路径损耗 + 包体散热\"系数（示意 1.5~2 倍）→ 约 36~48 min ——这就是冬天\"插枪预热半小时\"的来源。 实例 2：脉冲自加热速率 100 ah 电芯，−10 °c 内阻 2.5 mω（示意，约为 25 °c 值 3 倍），±2c（±200 a）脉冲（示意）： q = i²r = 200² × 0.0025 = 100 w/电芯 （放电与充电半波都产热，欧姆热与电流方向无关）； c_th = 2000 j/k（thm-02 同参数）→ 理论速率 = 100/2000 = 0.05 k/s = 3 k/min （未计散热；文献对照：常规脉冲 ~7 k/min、shlb 设计可达 ~96 k/min，s-93——本例结构介于两者之间属合理示意）； 对比：ptc 路径要先把冷却液和板子烧热，电芯级速率通常明显低于此—— 产热位置决定速率上限 。 实例 3：加热中的析锂平衡推演 加热至 5 °c 时脉冲进入充电半波 1c：查 chg-03 示意地图，0~10 °c 档充电只允许 0.2~0.3c → 超界，有析锂风险 。策略方向（方向性共识，具体标定为示意）： 不对称脉冲：放电半波 2c、充电半波 ≤0.3c，产热主要来自放电段； 或加热阶段不通大充电电流，充电等温度达标后按地图爬坡； 自加热的安全验证包必须覆盖\"最冷点温度下的最大充电脉冲\"工况（衔接 thm-01 极值估计）。 4. 工程实态 量产主流 = ptc/热泵液热 + 行车余热利用组合；插枪场景\"桩端供电加热\"（不耗电池电，充电前自动预热）是新体验标配（趋势表述）； 自加热（含电机绕组路线）在多品牌新平台推广中（观点级）；\"全气候电池\"类成果属电芯侧方案（代表工作待补文献）； 冬季体验的关键指标是\"插枪到可快充的时间\"——加热策略直接决定（thm-03 联动：热源能量分配）； 低温相关安全要求见 gb 38031-2025（s-01，条款细节待核对 → p-05）。 5. 常见误区 低温直接大电流充电——析锂三角（低温×大电流×高 soc）正面撞上（chg-03）； 只看平均温度不看最冷点——低温段温差被放大，析锂判据要用最冷点（thm-01）； 把加热速率当唯一指标——能耗（续航惩罚）与寿命（脉冲应力）是三角的另外两边； 认为 ptc\"慢是因为功率小\"——多数时候瓶颈是传热路径 r_th，不是 ptc 功率本身。 6. 自测 q1 ：实例 1 中若整包热容估错 50%（结构共享热容没算进去），加热时间误差多少？ q2 ：脉冲自加热为何充电半波必须缩到 0.3c 以下？产热损失多大比例？ q3 ：为什么自加热速率上限高于 ptc？用\"产热位置\"与\"r_th\"回答。 答案 q1：e 与 c_pack 成正比 → 时间同比例 +50%：理想 24 → 36 min；含损耗系数后约 54~72 min ——热容参数是加热时间估算的第一敏感项。 q2：5 °c 下充电允许倍率约 0.2~0.3c（示意地图），1c 超界有析锂风险。产热对比：充电 0.3c 时 q = 30² × 0.0025 = 2.25 w vs 放电 2c 的 100 w——充电半波产热占比骤降，总速率约降近半（示意，需按占空比细算），这正是\"加热速率 vs 析锂平衡\"的量化体现。 q3：ptc 的热要穿过加热器→冷却液→板→电芯整条串联热阻，速率受 r_th 限制；自加热产热在电芯内部（i²r），传热路径为零，速率上限由 c_th 与允许电流决定。 来源 s-16：g. plett, battery management systems vol. i（产热与热模型框架） s-01：gb 38031-2025（低温相关安全要求，条款细节待核对 → p-05） 析锂机理与\"先加热再充电\"为电化学/工程共识；本课速率、内阻、热容均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 [待补链] — 脉冲自加热代表学术工作（自加热锂离子电池结构方向，具体篇目核实后补） g. plett《battery management systems, vol. i》 b 热模型与产热章节（s-16） gb 38031-2025 原文（s-01） a 安全底线条款 待核对项（本课） 脉冲自加热速率的公开文献区间（本课 3 k/min 为示意推演）→ 建议新 p 项 车端 ptc 功率典型量级（本课 7 kw 为示意） \"低温内阻倍数\"的温度系数文献值（与 thm-02 共用） 电机绕组自加热路线的公开技术资料与安全验证案例 "}, {"id": "THM-05", "title": "课程 THM-05：热失控预警与蔓延抑制联动", "dom": "THM", "verified": false, "html": "<blockquote><p>对应节点 <code>THM-05<\/code>（../domains/08-热管理.md <span class=\"fileref\">（项目文件 ../domains/08-热管理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/THM-01\">THM-01<\/a>、<a class=\"xlink\" href=\"#/lesson/THM-02\">THM-02<\/a>、<a class=\"xlink\" href=\"#/lesson/FLT-02\">FLT-02<\/a> ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；温度特征点区间为学界常用示意区间。<\/p><\/blockquote>\n<h3>1. 为什么这是 BMS 安全职责的\"最后一道防线\"<\/h3>\n<p>热失控（Thermal Runaway，TR）：电芯内部放热副反应自我加速、温度不可逆飙升直至起火爆炸的链式过程。对 BMS 的要求有三层：<\/p>\n<ol>\n<li><strong>尽早识别前兆<\/strong>——在不可逆点之前（可降功率、停充、疏散热量）；<\/li>\n<li><strong>不可逆后尽快报警<\/strong>——报警必须先于乘员感知风险，为逃生争取时间；<\/li>\n<li><strong>联动整车与抑制系统<\/strong>——断高压、排烟、解锁，与结构侧蔓延抑制（隔热/泄压）协同。<\/li>\n<p>标准底线（<strong>2026-11-16 条款要点核实，P-05/P-24/P-50 关闭<\/strong>；条款号仍以原文为准）：<\/p>\n<\/ol>\n<ul>\n<li><strong>GB 38031-2020（S-02，旧规）<\/strong>：热扩散试验中，起火/爆炸前 <strong>5 分钟<\/strong>提供热事件报警信号即可；<\/li>\n<li><strong>GB 38031-2025（S-01，新规，2026-07-01 实施）<\/strong>：触发单体热失控后，<strong>至少 2 小时观察期不起火、不爆炸<\/strong>，监测点温度 ≤60 ℃，报警须在 <strong>5 分钟内<\/strong>发出且烟气不伤乘员——严苛程度提升一个量级；<\/li>\n<li>另新增<strong>底部撞击<\/strong>与<strong>快充循环后安全<\/strong>测试（快充部分见 <a class=\"xlink\" href=\"#/lesson/CHG-04\">CHG-04<\/a>）。<\/li>\n<\/ul>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）温度特征点框架（Feng 2018 综述体系，S-82；区间为文献常见值，随体系/老化差异大）。<\/strong> 经典综述把 TR 过程概括为三个特征温度：<\/p>\n<ul>\n<li><strong>T1 自产热起始温度<\/strong>（文献 ~90–130 °C）：SEI 膜分解，产热开始自我维持——此后已难靠外部冷却逆转；<\/li>\n<li><strong>T2 热失控触发温度<\/strong>（文献 ~130–200 °C）：链式反应全面展开；<\/li>\n<li><strong>T3 最高温度<\/strong>（文献 &gt;500–850 °C）：数秒~分钟内到达（速率随体系与触发方式差异大）。<\/li>\n<p>不同化学体系、不同老化状态差异显著——<strong>预警阈值必须按体系标定，不能跨体系照抄<\/strong>。<\/p>\n<p><strong>（2）可测前兆信号（按响应速度排序，方向性共识）。<\/strong><\/p>\n<li><strong>温升速率 dT/dt<\/strong>：正常工况 K/min 量级，TR 前兆可达 K/s 量级——最直接的特征；<\/li>\n<li><strong>电压异常<\/strong>：内短路表现为单体电压骤降/压差异常——往往早于温度传感器反应（THM-01 的布点稀疏在 TR 场景是致命短板）；<\/li>\n<li><strong>包内气压/特征气体<\/strong>：电解液蒸气与 H₂/CO 类气体释放，气压与气体传感器在部分新车型已配置（趋势表述）；<\/li>\n<li>声学/膨胀信号：研究阶段。<\/li>\n<p><strong>（3）分级预警与联动动作（示意设计）。<\/strong><\/p>\n<\/ul>\n<table><thead><tr><th>级别<\/th><th>判据（示意）<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>一级：异常<\/td><td>dT/dt &gt; 1 K/min 或压差扩大（示意）<\/td><td>数据记录加密、限制功率、提高采样<\/td><\/tr><tr><td>二级：前兆<\/td><td>dT/dt &gt; 1 K/s 持续 3 s 且 ≥2 测点（示意）<\/td><td>报警提示、切断充电、准备断电<\/td><\/tr><tr><td>三级：确认<\/td><td>多信号交叉（温升+电压骤降+气压，示意）<\/td><td>断高压（<a class=\"xlink\" href=\"#/lesson/FLT-04\">FLT-04<\/a>）、声光报警、整车广播（解锁/排烟）、上报云端（FLT-06）<\/td><\/tr><\/tbody><\/table>\n<p><strong>（4）逃生时间预算。<\/strong> 从\"乘员面临风险\"倒推：检测确认延迟 + 联动执行延迟 + 乘员撤离时间 ≤ 标准给出的逃生时间窗口。BMS 的检测-确认链路是预算的第一段——<strong>确认逻辑（防误报）与速度（抢时间）的矛盾在这里摊牌<\/strong>。<\/p>\n<h3>3. 工程案例：检测确认链路的时间账（教学示意值）<\/h3>\n<p>设计目标：二级前兆确认 ≤ 10 s（示意）。<\/p>\n<ul>\n<li>dT/dt 阈值 1 K/s、防抖 3 s（FLT-01 三件套逻辑）→ 判定窗 3 s；<\/li>\n<li>多测点交叉（≥2 点）与电压佐证比对 +1 s（示意）；<\/li>\n<li>确认后联动广播（断高压指令、整车 CAN 报警、云端事件包）&lt; 1 s；<\/li>\n<li>合计 ~5 s 级，留 5 s 裕度 → 自检结论：链路达标。<\/li>\n<li><strong>反例推演<\/strong>：若防抖窗被误设为 60 s（示意错误）——确认延迟吃掉 6 倍预算，逃生窗口被设计缺陷侵蚀；若防抖窗设为 0.3 s——快充波动即误报，用户\"狼来了\"脱敏。<strong>3 s 不是拍脑袋，是两类失效夹出来的窗口。<\/strong><\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>蔓延抑制的主力在<strong>结构设计<\/strong>：电芯间隔热（气凝胶/云母类）、定向泄压通道、包体强度——BMS 是\"感知 + 报警 + 联动\"角色，分工为工程共识；<\/li>\n<li>气体传感器（H₂/CO/VOC 类）配置率上升（趋势表述）；云端热失控事件自动上报 + 售后回访闭环（<a class=\"xlink\" href=\"#/lesson/FLT-06\">FLT-06<\/a>）；<\/li>\n<li>法规节奏：GB 38031-2025（S-01，2026-07-01 实施）热扩散要求强化，具体试验条件与逃生时间条款 → P-05；UN R100（S-13）为出口市场对应框架；<\/li>\n<li>预警算法趋势：从单阈值走向多信号融合模型（AI 类方案见 S-21/S-23，引用需保留不确定性）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把\"报警了\"当\"还没失控\"——T2 触发后过程不可逆，报警是逃生工具不是灭火工具；<\/li>\n<li>只盯温度单一信号——电压骤降往往更快，气压信号更\"铁证\"；<\/li>\n<li>预警阈值跨体系照抄——不同体系 T1/T2 差异大，必须按体系标定；<\/li>\n<li>认为\"抑制\"是 BMS 的活——结构隔热/泄压才是蔓延抑制主力，BMS 负责让联动及时发生。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么内短路的前兆里\"电压骤降\"比\"温度上升\"更早出现？ <strong>Q2<\/strong>：防抖窗 0.3 s 和 60 s 各错在哪？正确窗口由什么决定？ <strong>Q3<\/strong>：热失控确认后 BMS 的动作清单里，哪件事对乘员逃生最关键？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：内短路释放的热先在电芯内部积聚，传到远处的温度测点要经过热阻与热容（分钟级）；而短路电流路径上的电压塌陷在采样周期内即可见（毫秒~秒级）——电气量快于热量的空间传导。<\/li>\n<li>Q2：0.3 s 把快充/颠簸的动态波动当成了前兆（误报洪水，用户脱敏）；60 s 把逃生时间预算吃光（漏报致命）。窗口由\"干扰最长持续时间\"（下界）与\"逃生时间预算的分配\"（上界）共同决定。<\/li>\n<li>Q3：及时、可信、全覆盖的乘员报警与整车联动（声光提示 + 解锁 + 排烟 + 断高压防二次触电）——这是逃生时间预算的全部意义；数据上报是事后追溯，不救当下。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-01：GB 38031-2025（热扩散 2 小时观察期/≤60 ℃/5 分钟报警等要点，2026-11-16 媒体汇总级核实；条款号待原文）<\/li>\n<li>S-02：GB 38031-2020（对照旧版：\"5 分钟报警\"口径）<\/li>\n<li>S-13：UN R100（出口市场电池安全框架）<\/li>\n<li>T1/T2/T3 框架与示意区间出自学界综述（见延伸资源），文中数值为示意区间<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>X. Feng et al., \"Thermal runaway mechanism of lithium ion battery for electric vehicles: A review\", <em>Energy Storage Materials<\/em> Vol. 10 (2018) 246–267，<strong>DOI 10.1016/j.ensm.2017.05.003<\/strong>（S-82）<\/td><td>A<\/td><td>T1/T2/T3 框架的代表作（5100+ 引用；文献区间 T1 ~90–130 ℃ / T2 ~130–200 ℃ / T3 &gt;500–850 ℃，2026-11-19 溯源）<\/td><\/tr><tr><td>GB 38031-2025 原文（S-01）<\/td><td>A<\/td><td>热扩散条款权威文本<\/td><\/tr><tr><td>GB 38031-2020 原文（S-02）<\/td><td>A<\/td><td>对照：上一代热扩散要求<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~GB 38031-2020\"提前 5 分钟\"与 GB 38031-2025 热扩散条款~~ → <strong>2026-11-16 条款要点已核实<\/strong>（P-05/P-24/P-50 关闭；条款号/精确表述待原文逐条）。<\/li>\n<li>~~T1/T2/T3 区间的文献数值~~ → <strong>2026-11-19 已溯源<\/strong>（Feng 2018，S-82：~90–130 / ~130–200 / &gt;500–850 ℃；课程正文 80~120/120~200/600~1000 ℃ 为旧示意区间，按文献口径微调）。<\/li>\n<li>量产车型气体传感器配置率的公开证据<\/li>\n<li>~~Feng 综述的准确卷期页码与 DOI~~ → <strong>2026-11-19 已溯源<\/strong>（P-56 关闭，S-82）。<\/li>\n<\/ul>", "text": " 对应节点 thm-05 （../domains/08-热管理.md （项目文件 ../domains/08-热管理.md） ）｜ 前置： thm-01 、 thm-02 、 flt-02 ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/来源者均为 教学示意值 ；温度特征点区间为学界常用示意区间。 1. 为什么这是 bms 安全职责的\"最后一道防线\" 热失控（thermal runaway，tr）：电芯内部放热副反应自我加速、温度不可逆飙升直至起火爆炸的链式过程。对 bms 的要求有三层： 尽早识别前兆 ——在不可逆点之前（可降功率、停充、疏散热量）； 不可逆后尽快报警 ——报警必须先于乘员感知风险，为逃生争取时间； 联动整车与抑制系统 ——断高压、排烟、解锁，与结构侧蔓延抑制（隔热/泄压）协同。 标准底线（ 2026-11-16 条款要点核实，p-05/p-24/p-50 关闭 ；条款号仍以原文为准）： gb 38031-2020（s-02，旧规） ：热扩散试验中，起火/爆炸前 5 分钟 提供热事件报警信号即可； gb 38031-2025（s-01，新规，2026-07-01 实施） ：触发单体热失控后， 至少 2 小时观察期不起火、不爆炸 ，监测点温度 ≤60 ℃，报警须在 5 分钟内 发出且烟气不伤乘员——严苛程度提升一个量级； 另新增 底部撞击 与 快充循环后安全 测试（快充部分见 chg-04 ）。 2. 机制展开 （1）温度特征点框架（feng 2018 综述体系，s-82；区间为文献常见值，随体系/老化差异大）。 经典综述把 tr 过程概括为三个特征温度： t1 自产热起始温度 （文献 ~90–130 °c）：sei 膜分解，产热开始自我维持——此后已难靠外部冷却逆转； t2 热失控触发温度 （文献 ~130–200 °c）：链式反应全面展开； t3 最高温度 （文献 &gt;500–850 °c）：数秒~分钟内到达（速率随体系与触发方式差异大）。 不同化学体系、不同老化状态差异显著—— 预警阈值必须按体系标定，不能跨体系照抄 。 （2）可测前兆信号（按响应速度排序，方向性共识）。 温升速率 dt/dt ：正常工况 k/min 量级，tr 前兆可达 k/s 量级——最直接的特征； 电压异常 ：内短路表现为单体电压骤降/压差异常——往往早于温度传感器反应（thm-01 的布点稀疏在 tr 场景是致命短板）； 包内气压/特征气体 ：电解液蒸气与 h₂/co 类气体释放，气压与气体传感器在部分新车型已配置（趋势表述）； 声学/膨胀信号：研究阶段。 （3）分级预警与联动动作（示意设计）。 级别 判据（示意） 动作 一级：异常 dt/dt &gt; 1 k/min 或压差扩大（示意） 数据记录加密、限制功率、提高采样 二级：前兆 dt/dt &gt; 1 k/s 持续 3 s 且 ≥2 测点（示意） 报警提示、切断充电、准备断电 三级：确认 多信号交叉（温升+电压骤降+气压，示意） 断高压（ flt-04 ）、声光报警、整车广播（解锁/排烟）、上报云端（flt-06） （4）逃生时间预算。 从\"乘员面临风险\"倒推：检测确认延迟 + 联动执行延迟 + 乘员撤离时间 ≤ 标准给出的逃生时间窗口。bms 的检测-确认链路是预算的第一段—— 确认逻辑（防误报）与速度（抢时间）的矛盾在这里摊牌 。 3. 工程案例：检测确认链路的时间账（教学示意值） 设计目标：二级前兆确认 ≤ 10 s（示意）。 dt/dt 阈值 1 k/s、防抖 3 s（flt-01 三件套逻辑）→ 判定窗 3 s； 多测点交叉（≥2 点）与电压佐证比对 +1 s（示意）； 确认后联动广播（断高压指令、整车 can 报警、云端事件包）&lt; 1 s； 合计 ~5 s 级，留 5 s 裕度 → 自检结论：链路达标。 反例推演 ：若防抖窗被误设为 60 s（示意错误）——确认延迟吃掉 6 倍预算，逃生窗口被设计缺陷侵蚀；若防抖窗设为 0.3 s——快充波动即误报，用户\"狼来了\"脱敏。 3 s 不是拍脑袋，是两类失效夹出来的窗口。 4. 工程实态 蔓延抑制的主力在 结构设计 ：电芯间隔热（气凝胶/云母类）、定向泄压通道、包体强度——bms 是\"感知 + 报警 + 联动\"角色，分工为工程共识； 气体传感器（h₂/co/voc 类）配置率上升（趋势表述）；云端热失控事件自动上报 + 售后回访闭环（ flt-06 ）； 法规节奏：gb 38031-2025（s-01，2026-07-01 实施）热扩散要求强化，具体试验条件与逃生时间条款 → p-05；un r100（s-13）为出口市场对应框架； 预警算法趋势：从单阈值走向多信号融合模型（ai 类方案见 s-21/s-23，引用需保留不确定性）。 5. 常见误区 把\"报警了\"当\"还没失控\"——t2 触发后过程不可逆，报警是逃生工具不是灭火工具； 只盯温度单一信号——电压骤降往往更快，气压信号更\"铁证\"； 预警阈值跨体系照抄——不同体系 t1/t2 差异大，必须按体系标定； 认为\"抑制\"是 bms 的活——结构隔热/泄压才是蔓延抑制主力，bms 负责让联动及时发生。 6. 自测 q1 ：为什么内短路的前兆里\"电压骤降\"比\"温度上升\"更早出现？ q2 ：防抖窗 0.3 s 和 60 s 各错在哪？正确窗口由什么决定？ q3 ：热失控确认后 bms 的动作清单里，哪件事对乘员逃生最关键？ 答案 q1：内短路释放的热先在电芯内部积聚，传到远处的温度测点要经过热阻与热容（分钟级）；而短路电流路径上的电压塌陷在采样周期内即可见（毫秒~秒级）——电气量快于热量的空间传导。 q2：0.3 s 把快充/颠簸的动态波动当成了前兆（误报洪水，用户脱敏）；60 s 把逃生时间预算吃光（漏报致命）。窗口由\"干扰最长持续时间\"（下界）与\"逃生时间预算的分配\"（上界）共同决定。 q3：及时、可信、全覆盖的乘员报警与整车联动（声光提示 + 解锁 + 排烟 + 断高压防二次触电）——这是逃生时间预算的全部意义；数据上报是事后追溯，不救当下。 来源 s-01：gb 38031-2025（热扩散 2 小时观察期/≤60 ℃/5 分钟报警等要点，2026-11-16 媒体汇总级核实；条款号待原文） s-02：gb 38031-2020（对照旧版：\"5 分钟报警\"口径） s-13：un r100（出口市场电池安全框架） t1/t2/t3 框架与示意区间出自学界综述（见延伸资源），文中数值为示意区间 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 x. feng et al., \"thermal runaway mechanism of lithium ion battery for electric vehicles: a review\", energy storage materials vol. 10 (2018) 246–267， doi 10.1016/j.ensm.2017.05.003 （s-82） a t1/t2/t3 框架的代表作（5100+ 引用；文献区间 t1 ~90–130 ℃ / t2 ~130–200 ℃ / t3 &gt;500–850 ℃，2026-11-19 溯源） gb 38031-2025 原文（s-01） a 热扩散条款权威文本 gb 38031-2020 原文（s-02） a 对照：上一代热扩散要求 待核对项（本课） ~~gb 38031-2020\"提前 5 分钟\"与 gb 38031-2025 热扩散条款~~ → 2026-11-16 条款要点已核实 （p-05/p-24/p-50 关闭；条款号/精确表述待原文逐条）。 ~~t1/t2/t3 区间的文献数值~~ → 2026-11-19 已溯源 （feng 2018，s-82：~90–130 / ~130–200 / &gt;500–850 ℃；课程正文 80~120/120~200/600~1000 ℃ 为旧示意区间，按文献口径微调）。 量产车型气体传感器配置率的公开证据 ~~feng 综述的准确卷期页码与 doi~~ → 2026-11-19 已溯源 （p-56 关闭，s-82）。 "}], "nodes": [{"id": "ARCH-C", "name": "集中式 BMS", "parent": "root", "maturity": "stable", "def": "全部采集与控制集中在一个控制器内完成", "con": "线束数量随串数线性增长；采样线压降影响精度；高串数下连接器成本与可靠性成为上限", "src": "骨架"}, {"id": "ARCH-MS", "name": "主从式 BMS（Master-Slave）", "parent": "root", "maturity": "stable", "def": "从控板（AFE 从板）就近采集，主控集中决策", "con": "从控板布局绑定模组结构；内部通信（CAN/菊花链）需诊断覆盖；从控需参与 <strong>议程完全核实（2026-11-10，P-04 关闭）<\/strong>。BMS 直接相关报告标题与讲者均已确认。会前条目；会后增量窗口 2026-12-08 ~ 12-16。<\/p><\/blockquote>\n<ul>\n<li><strong>会议全称<\/strong>：26th Advanced Automotive Battery Conference（AABC US 2026）<\/li>\n<li><strong>日期<\/strong>：2026-12-07 ~ 12-10（12-07 教程日）｜ <strong>Battery Engineering 专场：12-08 ~ 12-09<\/strong><\/li>\n<li><strong>地点<\/strong>：San Diego, CA, USA ｜ <strong>主办方<\/strong>：Cambridge EnerTech<\/li>\n<li><strong>官网<\/strong>：<a href=\"https://www.advancedautobat.com/us\" target=\"_blank\" rel=\"noopener\">advancedautobat.com/us<\/a> ｜ <a href=\"https://www.advancedautobat.com/aabc-us/battery-engineering\" target=\"_blank\" rel=\"noopener\">Battery Engineering 专场页<\/a><\/li>\n<\/ul>\n<h3>BMS 直接相关报告（标题已核实）<\/h3>\n<p><strong>\"ESTIMATING SOC AND SOH\" 专场（12-08，10:10–11:40 PST）<\/strong>：<\/p>\n<ol>\n<li><strong>[讲者观点] Gregory L. Plett（UCCS）：\"Estimating Electrode State of Charge (eSOC) in Real Time\"<\/strong><\/li>\n<p>内容（专场页口径）：估计电芯正/负极各自的 eSOC，处理老化导致的 OCV 变化，改进 Kalman 类 SOC 估计精度 → 直接对应 <code>ALG-04<\/code>（eSOC）。<\/p>\n<li><strong>[讲者观点] Scott Trimboli（UCCS）：\"Accurate and Efficient State-of-Power Computation for Automotive Battery Applications\"<\/strong><\/li>\n<p>内容：基于电-热耦合模型的有限时域 SOP 优化计算，用 McCormick 包络处理非凸问题，面向车载应用 → 直接对应 <code>ALG-06<\/code>（SOP）。<\/p>\n<p><strong>同专场其他值得关注<\/strong>：<\/p>\n<\/ol>\n<ul>\n<li>Yatish Patel（Imperial College London）：\"Can Sparse Temperature Sensing Reliably Detect Thermal Runaway? …\"——稀疏温度传感 vs 热失控检测 → <code>THM-01<\/code>/<code>THM-05<\/code><\/li>\n<li>Jaeyoung Lim（Hyundai）：基于膨胀传感器的车载电池原位诊断与热失控早期检测 → <code>ALG-08<\/code>、<code>THM-05<\/code><\/li>\n<li>\"BATTERY SAFETY\" 专场（12-08）：斯坦福 / Khalifa 大学 / Exponent / 前 NASA 专家（聚合物集流体）<\/li>\n<li>\"THERMAL RUNAWAY\" 专场（12-08）：Naval Surface Warfare Center / UT Austin / 3M / UL 研究院<\/li>\n<li>\"THEORY TO COMMERCIAL USE\"（12-09）：Chris Mi（梯次电池储能成本优化）→ <code>CHM-04<\/code><\/li>\n<li>主旨（12-09）：GM（Kurt Kelty）、LG Energy Solution（Robert Lee）<\/li>\n<\/ul>\n<h3>会后增量计划<\/h3>\n<p>2026-12-08 ~ 12-16：把确认的报告要点写入 <code>ALG-04<\/code>、<code>ALG-06<\/code>（以及视内容补 <code>THM-01<\/code>/<code>THM-05<\/code>/<code>ALG-08<\/code>），标 [讲者观点]，changelog 记录。<\/p>\n<h3>来源<\/h3>\n<ul>\n<li>S-57：AABC US 2026 官网与 Battery Engineering 专场页（议程页已含各报告标题，2026-11-10 抓取）<\/li>\n<\/ul>", "text": " 状态： 议程完全核实（2026-11-10，p-04 关闭） 。bms 直接相关报告标题与讲者均已确认。会前条目；会后增量窗口 2026-12-08 ~ 12-16。 会议全称 ：26th advanced automotive battery conference（aabc us 2026） 日期 ：2026-12-07 ~ 12-10（12-07 教程日）｜ battery engineering 专场：12-08 ~ 12-09 地点 ：san diego, ca, usa ｜ 主办方 ：cambridge enertech 官网 ： advancedautobat.com/us ｜ battery engineering 专场页 bms 直接相关报告（标题已核实） \"estimating soc and soh\" 专场（12-08，10:10–11:40 pst） ： [讲者观点] gregory l. plett（uccs）：\"estimating electrode state of charge (esoc) in real time\" 内容（专场页口径）：估计电芯正/负极各自的 esoc，处理老化导致的 ocv 变化，改进 kalman 类 soc 估计精度 → 直接对应 alg-04 （esoc）。 [讲者观点] scott trimboli（uccs）：\"accurate and efficient state-of-power computation for automotive battery applications\" 内容：基于电-热耦合模型的有限时域 sop 优化计算，用 mccormick 包络处理非凸问题，面向车载应用 → 直接对应 alg-06 （sop）。 同专场其他值得关注 ： yatish patel（imperial college london）：\"can sparse temperature sensing reliably detect thermal runaway? …\"——稀疏温度传感 vs 热失控检测 → thm-01 / thm-05 jaeyoung lim（hyundai）：基于膨胀传感器的车载电池原位诊断与热失控早期检测 → alg-08 、 thm-05 \"battery safety\" 专场（12-08）：斯坦福 / khalifa 大学 / exponent / 前 nasa 专家（聚合物集流体） \"thermal runaway\" 专场（12-08）：naval surface warfare center / ut austin / 3m / ul 研究院 \"theory to commercial use\"（12-09）：chris mi（梯次电池储能成本优化）→ chm-04 主旨（12-09）：gm（kurt kelty）、lg energy solution（robert lee） 会后增量计划 2026-12-08 ~ 12-16：把确认的报告要点写入 alg-04 、 alg-06 （以及视内容补 thm-01 / thm-05 / alg-08 ），标 [讲者观点]，changelog 记录。 来源 s-57：aabc us 2026 官网与 battery engineering 专场页（议程页已含各报告标题，2026-11-10 抓取） "}, {"id": "cbis2026", "title": "CBIS2026 — 第十一届动力电池应用国际峰会", "html": "<blockquote><p>状态：<strong>会中（2026-11-19~21）<\/strong>。议程已公开并核实（2026-11-13）；固态电池论坛已于 11-20 下午举行，会中报道尚未出——会后增量窗口 ≤11-28。<\/p><\/blockquote>\n<ul>\n<li><strong>会议全称<\/strong>：第十一届动力电池应用国际峰会（CBIS2026）<\/li>\n<li><strong>日期/地点<\/strong>：2026-11-19 ~ 11-21（11-19 下午签到），上海（主会场：虹桥机场香格里拉酒店）——<strong>2026-11-21 会中核实：三天议程<\/strong><\/li>\n<li><strong>主题<\/strong>：\"数智创新·协同布局——撬动全球新能源价值链\" ｜ <strong>主办<\/strong>：电池中国网（cbea.com）<\/li>\n<\/ul>\n<h3>已公开议程要点（2026-11-13 核实）<\/h3>\n<ol>\n<li><strong>固态电池论坛：从装车验证到量产攻坚<\/strong>（11-20 13:30–16:30）→ 关联 <code>CHM-03<\/code><\/li>\n<li>航空动力电池失效烟气评估方法闭门研讨会（11-20 14:30–16:30）→ <code>THM-05<\/code>（航空场景）<\/li>\n<li>大会议题包含：AI 如何颠覆电池研发与制造、<strong>电池智能安全管理系统（BMS 相关）在整车上的应用<\/strong>、电池技术及工艺革新、标准与合规 → 关联 <code>SAFE-*<\/code>、<code>GEN-3<\/code><\/li>\n<li>行业蓝皮书发布（惯例环节）<\/li>\n<\/ol>\n<h3>会前线索<\/h3>\n<ul>\n<li>超威（ChaoWei）钠电全链整合报道以 CBIS2026 为语境（50 万套钠电出货、NFPP 路线）——出席口径待核对（leads L-19）→ <code>CHM-02<\/code><\/li>\n<\/ul>\n<h3>会后增量计划<\/h3>\n<p>会后 7 日内（≤2026-11-28）：把\"电池智能安全管理系统\"等议题的公开观点写入对应节点（标 [讲者观点]），changelog 记录。<\/p>\n<h3>来源<\/h3>\n<ul>\n<li>议程抢先看：<a href=\"https://caifuhao.eastmoney.com/news/20260924165041005943280\" target=\"_blank\" rel=\"noopener\">东方财富<\/a> / <a href=\"https://www.sohu.com/a/1080463175_618917\" target=\"_blank\" rel=\"noopener\">搜狐<\/a>；固态电池论坛：<a href=\"https://caifuhao.eastmoney.com/news/20261106143452223716490\" target=\"_blank\" rel=\"noopener\">东方财富 11-06<\/a>（媒体转述，官网议程页待逐条核对）<\/li>\n<\/ul>", "text": " 状态： 会中（2026-11-19~21） 。议程已公开并核实（2026-11-13）；固态电池论坛已于 11-20 下午举行，会中报道尚未出——会后增量窗口 ≤11-28。 会议全称 ：第十一届动力电池应用国际峰会（cbis2026） 日期/地点 ：2026-11-19 ~ 11-21（11-19 下午签到），上海（主会场：虹桥机场香格里拉酒店）—— 2026-11-21 会中核实：三天议程 主题 ：\"数智创新·协同布局——撬动全球新能源价值链\" ｜ 主办 ：电池中国网（cbea.com） 已公开议程要点（2026-11-13 核实） 固态电池论坛：从装车验证到量产攻坚 （11-20 13:30–16:30）→ 关联 chm-03 航空动力电池失效烟气评估方法闭门研讨会（11-20 14:30–16:30）→ thm-05 （航空场景） 大会议题包含：ai 如何颠覆电池研发与制造、 电池智能安全管理系统（bms 相关）在整车上的应用 、电池技术及工艺革新、标准与合规 → 关联 safe-* 、 gen-3 行业蓝皮书发布（惯例环节） 会前线索 超威（chaowei）钠电全链整合报道以 cbis2026 为语境（50 万套钠电出货、nfpp 路线）——出席口径待核对（leads l-19）→ chm-02 会后增量计划 会后 7 日内（≤2026-11-28）：把\"电池智能安全管理系统\"等议题的公开观点写入对应节点（标 [讲者观点]），changelog 记录。 来源 议程抢先看： 东方财富 / 搜狐 ；固态电池论坛： 东方财富 11-06 （媒体转述，官网议程页待逐条核对） "}, {"id": "innobms-project", "title": "InnoBMS 项目 — Situationally aware innovative BMS for next generation vehicles", "html": "<blockquote><p>状态：<strong>已核实（2026-11-06）<\/strong>，P-09 关闭。类型：EU Horizon Europe 研究项目（与 NEMO、NEXTBMS 同属下一代 BMS 项目群）。<\/p><\/blockquote>\n<ul>\n<li><strong>项目全称<\/strong>：Situationally aware innovative battery management system for next generation vehicles（InnoBMS）<\/li>\n<li><strong>资助<\/strong>：EU Horizon Europe，CORDIS 101137975；官网 <a href=\"https://innobms.eu\" target=\"_blank\" rel=\"noopener\">innobms.eu<\/a><\/li>\n<li><strong>核心目标<\/strong>：把动态态势感知（dynamic situational awareness）集成进 BMS 软硬件，使电池在多样场景下最优运行。<\/li>\n<li><strong>目标指标（[项目目标宣称]，非实测结果）<\/strong>：电池包有效体积能量密度 +12%；电池寿命 +33%；全生命周期成本下降。<\/li>\n<li><strong>已核实联盟成员<\/strong>：TU Graz（奥地利）、CIDETEC（西班牙）、VUB（布鲁塞尔自由大学）、卢布尔雅那大学（斯洛文尼亚）、Potenza Technology、<strong>Typhoon HIL<\/strong>（负责开发/验证一种新型无线 BMS 设计）<\/li>\n<\/ul>\n<h3>值得注意的交叉点<\/h3>\n<ol>\n<li><strong>TU Graz 同时出现在 NEMO 与 InnoBMS 两个项目里<\/strong>——两个项目的\"智能 BMS\"成果发布口径需区分项目归属（electrive 2026-06-18 的\"smart BMS\"报道属 NEMO，已核实）。<\/li>\n<li><strong>Typhoon HIL 负责\"新型无线 BMS\"的验证<\/strong>——HIL 厂商进入 wBMS 验证链，是 <code>ARCH-W<\/code> 落地工具链的信号。<\/li>\n<li>目标数值（+12%/+33%）是立项口径，<strong>不得当作已达成结果引用<\/strong>；跟踪其交付物与论文。<\/li>\n<\/ol>\n<h3>对知识图谱的增量<\/h3>\n<ul>\n<li><code>GEN-3<\/code>（[需补约束]）：又一个项目级实证路线样本（态势感知 BMS）；与 NEMO 的\"EIS 传感路线\"互补，InnoBMS 强调\"场景感知\"。<\/li>\n<li><code>ARCH-W<\/code>：无线 BMS 出现独立验证工具链（Typhoon HIL）。<\/li>\n<li><code>DEV-03<\/code>（HIL）：无线 BMS 的 HIL 验证方法学值得跟踪。<\/li>\n<\/ul>\n<h3>后续跟踪<\/h3>\n<ul>\n<li>CORDIS 页面的项目周期/预算/交付物更新；<\/li>\n<li>成员单位论文发表（TU Graz 的 BMS 模型成果按项目分归属）；<\/li>\n<li>与 NEMO/NEXTBMS 成果对比（三个项目构成 EU 下一代 BMS 观察组合）。<\/li>\n<\/ul>\n<h3>来源<\/h3>\n<ul>\n<li>S-62：CORDIS 101137975、innobms.eu 及成员项目页（TU Graz / CIDETEC / VUB / Univ. Ljubljana / Potenza / Typhoon HIL）<\/li>\n<\/ul>", "text": " 状态： 已核实（2026-11-06） ，p-09 关闭。类型：eu horizon europe 研究项目（与 nemo、nextbms 同属下一代 bms 项目群）。 项目全称 ：situationally aware innovative battery management system for next generation vehicles（innobms） 资助 ：eu horizon europe，cordis 101137975；官网 innobms.eu 核心目标 ：把动态态势感知（dynamic situational awareness）集成进 bms 软硬件，使电池在多样场景下最优运行。 目标指标（[项目目标宣称]，非实测结果） ：电池包有效体积能量密度 +12%；电池寿命 +33%；全生命周期成本下降。 已核实联盟成员 ：tu graz（奥地利）、cidetec（西班牙）、vub（布鲁塞尔自由大学）、卢布尔雅那大学（斯洛文尼亚）、potenza technology、 typhoon hil （负责开发/验证一种新型无线 bms 设计） 值得注意的交叉点 tu graz 同时出现在 nemo 与 innobms 两个项目里 ——两个项目的\"智能 bms\"成果发布口径需区分项目归属（electrive 2026-06-18 的\"smart bms\"报道属 nemo，已核实）。 typhoon hil 负责\"新型无线 bms\"的验证 ——hil 厂商进入 wbms 验证链，是 arch-w 落地工具链的信号。 目标数值（+12%/+33%）是立项口径， 不得当作已达成结果引用 ；跟踪其交付物与论文。 对知识图谱的增量 gen-3 （[需补约束]）：又一个项目级实证路线样本（态势感知 bms）；与 nemo 的\"eis 传感路线\"互补，innobms 强调\"场景感知\"。 arch-w ：无线 bms 出现独立验证工具链（typhoon hil）。 dev-03 （hil）：无线 bms 的 hil 验证方法学值得跟踪。 后续跟踪 cordis 页面的项目周期/预算/交付物更新； 成员单位论文发表（tu graz 的 bms 模型成果按项目分归属）； 与 nemo/nextbms 成果对比（三个项目构成 eu 下一代 bms 观察组合）。 来源 s-62：cordis 101137975、innobms.eu 及成员项目页（tu graz / cidetec / vub / univ. ljubljana / potenza / typhoon hil） "}, {"id": "nemo-project", "title": "NEMO 项目 — NExt-generation MOdels for advanced battery electronics", "html": "<blockquote><p>状态：<strong>已核实（2026-11-05）<\/strong>，P-08 关闭。类型：EU Horizon Europe 研究项目（按\"项目型\"条目跟踪，非单场会议）。<\/p><\/blockquote>\n<ul>\n<li><strong>项目全称<\/strong>：NExt-generation MOdels for advanced battery electronics（NEMO）<\/li>\n<li><strong>资助<\/strong>：EU Horizon Europe，CORDIS 项目号 101102944<\/li>\n<li><strong>官网<\/strong>：nemoproject.eu（leaflet 2024-02 已公开）<\/li>\n<li><strong>参与方（已核实）<\/strong>：TTTech（奥地利，车载系统）、TU Graz（格拉茨工业大学，IPPT 研究所）等<\/li>\n<li><strong>姐妹项目<\/strong>：NEXTBMS（nextbms.eu，另立条目跟踪）<\/li>\n<\/ul>\n<h3>项目方向（CORDIS/官网口径）<\/h3>\n<p>超越传统 BMS 仅依赖有限观测量（电压/电流/温度）+ 简化模型的局限：<\/p>\n<ol>\n<li><strong>in-situ / in-operando EIS（电化学阻抗谱）传感<\/strong>——直接探测电芯内部状态；<\/li>\n<li><strong>物理机理模型 + 数据驱动模型的融合<\/strong>；<\/li>\n<li><strong>主动 cell switching（电芯开关阵列）用于均衡<\/strong>——硬件层面的新自由度；<\/li>\n<li>目标：更长寿命、更安全、更高效的锂电管理。<\/li>\n<\/ol>\n<h3>已公开成果<\/h3>\n<ul>\n<li><strong>2026-06<\/strong>：TU Graz 发布\"智能 BMS for EV\"成果（新传感器 + 新算法，更深入洞察电池行为）；<a href=\"https://www.tugraz.at/en/institutes/ippt/institute/news/article/battery-management-system-electric-vehicles\" target=\"_blank\" rel=\"noopener\">TU Graz 新闻<\/a>；<a href=\"https://www.electrive.com/2026/06/18/nemo-project-presents-smart-bms-for-electric-vehicles\" target=\"_blank\" rel=\"noopener\">electrive 报道 2026-06-18<\/a>；<a href=\"https://www.eurekalert.org/news-releases/1132521\" target=\"_blank\" rel=\"noopener\">EurekAlert<\/a><\/li>\n<li>标注：<strong>[项目成果宣称]<\/strong>——大学/项目方口径的公开新闻，<strong>不等同于同行评议论文<\/strong>；引用其技术细节前等待论文级证据。<\/li>\n<\/ul>\n<h3>对知识图谱的增量<\/h3>\n<ul>\n<li><code>GEN-3<\/code>（AI/数字孪生预测型 BMS）[需补约束] 的候选证据 +1：NEMO 提供了\"新型传感（EIS）+ 混合建模\"的项目级实证路线——下一代 BMS 的可信路径之一。<\/li>\n<li><code>ALG-11<\/code>（电化学机理模型）：EIS 在线传感 + 物理模型融合，是该节点从离线辨识走向在线感知的关键工程信号。<\/li>\n<li><code>ALG-08<\/code>（故障诊断）与 <code>HW-01<\/code>（AFE/新型传感）：EIS 传感进 BMS 会改变采集硬件形态——待论文细节。<\/li>\n<li>新增关联：NEMO 与本项目已有 InnoBMS（S-25）同属 EU 下一代 BMS 项目群，与 NEXTBMS 构成三项目观察组合。<\/li>\n<\/ul>\n<h3>后续跟踪<\/h3>\n<ul>\n<li>检索 NEMO/TU Graz 的同行评议论文发表（EIS 在线估计、cell switching 均衡）；<\/li>\n<li>项目结束时间/最终报告（CORDIS 更新）；<\/li>\n<li>观点提炼：项目方宣称与论文证据分列，不混层。<\/li>\n<\/ul>\n<h3>来源<\/h3>\n<ul>\n<li>S-53：NEMO 项目页（CORDIS 101102944 / nemoproject.eu）<\/li>\n<li>S-55：TU Graz 2026-06 成果新闻（tugraz.at / electrive / EurekAlert）<\/li>\n<\/ul>", "text": " 状态： 已核实（2026-11-05） ，p-08 关闭。类型：eu horizon europe 研究项目（按\"项目型\"条目跟踪，非单场会议）。 项目全称 ：next-generation models for advanced battery electronics（nemo） 资助 ：eu horizon europe，cordis 项目号 101102944 官网 ：nemoproject.eu（leaflet 2024-02 已公开） 参与方（已核实） ：tttech（奥地利，车载系统）、tu graz（格拉茨工业大学，ippt 研究所）等 姐妹项目 ：nextbms（nextbms.eu，另立条目跟踪） 项目方向（cordis/官网口径） 超越传统 bms 仅依赖有限观测量（电压/电流/温度）+ 简化模型的局限： in-situ / in-operando eis（电化学阻抗谱）传感 ——直接探测电芯内部状态； 物理机理模型 + 数据驱动模型的融合 ； 主动 cell switching（电芯开关阵列）用于均衡 ——硬件层面的新自由度； 目标：更长寿命、更安全、更高效的锂电管理。 已公开成果 2026-06 ：tu graz 发布\"智能 bms for ev\"成果（新传感器 + 新算法，更深入洞察电池行为）； tu graz 新闻 ； electrive 报道 2026-06-18 ； eurekalert 标注： [项目成果宣称] ——大学/项目方口径的公开新闻， 不等同于同行评议论文 ；引用其技术细节前等待论文级证据。 对知识图谱的增量 gen-3 （ai/数字孪生预测型 bms）[需补约束] 的候选证据 +1：nemo 提供了\"新型传感（eis）+ 混合建模\"的项目级实证路线——下一代 bms 的可信路径之一。 alg-11 （电化学机理模型）：eis 在线传感 + 物理模型融合，是该节点从离线辨识走向在线感知的关键工程信号。 alg-08 （故障诊断）与 hw-01 （afe/新型传感）：eis 传感进 bms 会改变采集硬件形态——待论文细节。 新增关联：nemo 与本项目已有 innobms（s-25）同属 eu 下一代 bms 项目群，与 nextbms 构成三项目观察组合。 后续跟踪 检索 nemo/tu graz 的同行评议论文发表（eis 在线估计、cell switching 均衡）； 项目结束时间/最终报告（cordis 更新）； 观点提炼：项目方宣称与论文证据分列，不混层。 来源 s-53：nemo 项目页（cordis 101102944 / nemoproject.eu） s-55：tu graz 2026-06 成果新闻（tugraz.at / electrive / eurekalert） "}, {"id": "nextbms-project", "title": "NEXTBMS 项目 — NEMO 姐妹项目（EU）", "html": "<blockquote><p>状态：<strong>已识别，细节待核<\/strong>。EU 资助的下一代 BMS 项目，定位与 NEMO 互补：以更宽的传感范围 + 软硬件协同做下一代电池管理。<\/p><\/blockquote>\n<ul>\n<li><strong>官网<\/strong>：nextbms.eu（<a href=\"https://nextbms.eu/collaborations\" target=\"_blank\" rel=\"noopener\">协作页<\/a> 列明与 NEMO 的姐妹项目关系）<\/li>\n<li><strong>方向（官网口径，待细核）<\/strong>：cutting-edge hardware + software、wide sensor range 的 next-generation BMS<\/li>\n<li><strong>与 NEMO 的分工<\/strong>：待核（NEMO 侧重模型/EIS 传感/cell switching；NEXTBMS 侧重宽传感与硬件）→ 后续以官网 + CORDIS 页核对<\/li>\n<li><strong>关联 node<\/strong>：<code>GEN-3<\/code>、<code>HW-01<\/code>、<code>ALG-08<\/code><\/li>\n<li><strong>后续动作<\/strong>：检索其 CORDIS 项目号、联盟名单、公开交付物；有成果发布时按 NEMO 条目格式升级本条目。<\/li>\n<\/ul>", "text": " 状态： 已识别，细节待核 。eu 资助的下一代 bms 项目，定位与 nemo 互补：以更宽的传感范围 + 软硬件协同做下一代电池管理。 官网 ：nextbms.eu（ 协作页 列明与 nemo 的姐妹项目关系） 方向（官网口径，待细核） ：cutting-edge hardware + software、wide sensor range 的 next-generation bms 与 nemo 的分工 ：待核（nemo 侧重模型/eis 传感/cell switching；nextbms 侧重宽传感与硬件）→ 后续以官网 + cordis 页核对 关联 node ： gen-3 、 hw-01 、 alg-08 后续动作 ：检索其 cordis 项目号、联盟名单、公开交付物；有成果发布时按 nemo 条目格式升级本条目。 "}, {"id": "世界储能大会-2026", "title": "2026 世界储能大会", "html": "<blockquote><p>状态：<strong>已核实（2026-11-05，官方媒体报道级）<\/strong>，大会已于 2026-10-14~16 闭幕。本条目同时承载对用户原始线索\"全球储能前沿技术大会\"的证伪替代（见文末）。<\/p><\/blockquote>\n<ul>\n<li><strong>会议全称<\/strong>：2026 世界储能大会（World Energy Storage Conference）<\/li>\n<li><strong>日期/地点<\/strong>：2026-10-14 ~ 10-16，福建宁德（已闭幕）<\/li>\n<li><strong>主办方<\/strong>：工信部装备工业发展中心、福建省工信厅、宁德市政府联合主办（<a href=\"https://www.news.cn/fortune/20261015/74e793088e2f4d959d05243fe2fa8a0f/c.html\" target=\"_blank\" rel=\"noopener\">新华网报道<\/a>）<\/li>\n<li><strong>主题<\/strong>：\"智储新程 绿动全球\"<\/li>\n<\/ul>\n<h3>与 BMS 相关的议题（议题存在，观点未公开）<\/h3>\n<ol>\n<li>储能安全标准与消防体系建设 → 关联 <code>SAFE-04<\/code>、<code>THM-05<\/code>、<code>DEV-04<\/code><\/li>\n<li>长时储能与电池技术迭代 → 关联 <code>CHM-02<\/code>（钠电储能）<\/li>\n<li>算电协同与智储融合 → 关联 <code>GEN-2<\/code>、<code>ARCH-CE<\/code>（AI/云与储能融合）<\/li>\n<\/ol>\n<h3>厂商动态（利益关联声明）<\/h3>\n<ul>\n<li><strong>高特电子<\/strong>（CNESA 活动页）：展示基于<strong>芯片级双向主动均衡<\/strong>的 1500V 储能 BMS，宣称\"提升全生命周期 15% 以上循环寿命、增加 10% 以上经济收益\"。<strong>[厂商宣称，利益关联：厂商解决方案]<\/strong>——数据未经同行评议，且\"全生命周期收益\"口径未定义；不进入知识图谱事实层，作 <code>ALG-07<\/code>（均衡）与 <code>CHG-06<\/code>/对比矩阵的待验证线索。<\/li>\n<li>关联矩阵线索：可作 compare/matrix.md\"储能 BMS\"新行的候选证据（当前未达 2 来源门槛）。<\/li>\n<\/ul>\n<h3>行业背景数据（媒体口径）<\/h3>\n<ul>\n<li>2026 上半年中国储能电池产量超 420 GWh，同比 +110%（新华网援引）——[行业媒体数据，未入图谱事实层]。<\/li>\n<\/ul>\n<h3>对用户原始线索的结论（P-07）<\/h3>\n<p>用户原始线索：\"全球储能前沿技术大会，2026 年议题包括'从被动防御到价值驱动——BMS如何重塑储能全生命周期经济性'及多模态数据融合智能 BMS\"。 <strong>检索结论（2026-11-05）<\/strong>：未检索到该会议名称与该专场标题；最接近的真实对象为 <strong>2026 世界储能大会（本条目）<\/strong>与 <strong>ESIE 储能国际峰会暨储能前沿技术大会系列<\/strong>（北京，常设）。原表述转\"已证伪留档\"，本条目为替代跟踪记录。<\/p>\n<h3>已公开资料状态<\/h3>\n<ul>\n<li>议程/官方报道：✅（新华网、福建工信厅）<\/li>\n<li>分论坛纪要/幻灯片：无 → 后续检索分论坛详情，有观点则按 [讲者观点] 补录<\/li>\n<\/ul>\n<h3>来源<\/h3>\n<ul>\n<li>S-56：新华网 2026-10-15 大会报道；福建工信厅 2026-10-13 生态链体验活动报道；CNESA 高特电子活动页<\/li>\n<\/ul>", "text": " 状态： 已核实（2026-11-05，官方媒体报道级） ，大会已于 2026-10-14~16 闭幕。本条目同时承载对用户原始线索\"全球储能前沿技术大会\"的证伪替代（见文末）。 会议全称 ：2026 世界储能大会（world energy storage conference） 日期/地点 ：2026-10-14 ~ 10-16，福建宁德（已闭幕） 主办方 ：工信部装备工业发展中心、福建省工信厅、宁德市政府联合主办（ 新华网报道 ） 主题 ：\"智储新程 绿动全球\" 与 bms 相关的议题（议题存在，观点未公开） 储能安全标准与消防体系建设 → 关联 safe-04 、 thm-05 、 dev-04 长时储能与电池技术迭代 → 关联 chm-02 （钠电储能） 算电协同与智储融合 → 关联 gen-2 、 arch-ce （ai/云与储能融合） 厂商动态（利益关联声明） 高特电子 （cnesa 活动页）：展示基 const BYID = {}; DATA.lessons.forEach(l => BYID[l.id] = l);
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const READ = JSON.parse(localStorage.getItem("bmsRead") || "{}");
const VIEWS = [["lesson","📚 课程"],["tree","🌳 知识树"],["paths","🧭 学习路径"],["conf","🎓 会议"],["pending","🔍 待验证"]];
let view = "lesson", current = null, q = "";

function saveRead(){ localStorage.setItem("bmsRead", JSON.stringify(READ)); }
function matBadge(m){ const c = m==="stable"?"b-stable":(m==="evolving"?"b-evolving":"b-frontier");
  const z = m==="stable"?"stable":(m==="evolving"?"evolving":"frontier"); return '<span class="badge '+c+'">'+z+'</span>'; }
function lessonPath(d){ let arr=[]; DATA.domains.forEach(dm=>arr=arr.concat(DATA.lessons.filter(l=>l.dom===dm.key))); return arr; }
const ORDER = lessonPath();

function renderTabs(){
  $("#viewtabs").innerHTML = VIEWS.map(v =>
    '<button data-v="'+v[0]+'" class="'+(view===v[0]?"active":"")+'">'+v[1]+'</button>').join("");
}
function renderNav(){
  const nav = $("#nav"); let html = "";
  const ql = q.trim().toLowerCase();
  if(view === "lesson"){
    DATA.domains.forEach(dm => {
      const les = DATA.lessons.filter(l => l.dom === dm.key &&
        (!ql || (l.id+" "+l.title+" "+l.text).toLowerCase().includes(ql)));
      if(!les.length) return;
      html += '<div class="dom"><div class="dom-h"><b>'+dm.name+'</b><span>'+les.length+'/'+
        DATA.lessons.filter(l=>l.dom===dm.key).length+'</span></div>' +
        les.map(l => '<button class="les '+(current===l.id?"active ":"")+(READ[l.id]?"isread":"")+
          '" data-id="'+l.id+'"><span class="rd"></span><span class="lid">'+l.id+
          '</span><span class="tt">'+esc(l.title)+'</span></button>').join("") + '</div>';
    });
  } else if(view === "tree"){
    DATA.domains.forEach(dm => {
      const ns = DATA.nodes.filter(nd => nd.id.startsWith(dm.key) &&
        (!ql || (nd.id+" "+nd.name+" "+nd.def).toLowerCase().includes(ql)));
      if(!ns.length) return;
      html += '<div class="dom"><div class="dom-h"><b>'+dm.name+'</b><span>'+ns.length+'</span></div>' +
        ns.map(nd => '<button class="les" data-node="'+nd.id+'"><span class="lid">'+nd.id+
          '</span><span class="tt">'+esc(nd.name)+'</span></button>').join("") + '</div>';
    });
  } else if(view === "conf"){
    const cs = DATA.conferences.filter(c => !ql || (c.id+" "+c.title+" "+c.text).toLowerCase().includes(ql));
    html = '<div class="dom"><div class="dom-h"><b>会议与项目条目</b><span>'+cs.length+'</span></div>' +
      cs.map(c => '<button class="les" data-conf="'+c.id+'"><span class="tt" style="flex:1">'+esc(c.title)+'</span></button>').join("") + '</div>';
  } else if(view === "pending"){
    const ps = DATA.pending.filter(p => !ql || (p.id+" "+p.item).toLowerCase().includes(ql));
    html = '<div class="dom"><div class="dom-h"><b>待验证清单</b><span>'+ps.length+'</span></div>' +
      ps.map(p => '<button class="les" data-pend="'+p.id+'"><span class="lid">'+p.id+
        '</span><span class="tt">'+esc(p.item.slice(0,26))+'…</span></button>').join("") + '</div>';
  }
  nav.innerHTML = html || '<div class="empty">无匹配结果</div>';
  const total = DATA.lessons.length, done = Object.keys(READ).length;
  $("#progress").textContent = "阅读进度：" + done + " / " + total + " 课（" + Math.round(done/total*100) + "%）";
}
function markBtn(id){
  return '<button class="readbtn '+(READ[id]?"on":"")+'" id="readtoggle">'+(READ[id]?"✓ 已读":"标记已读")+'</button>';
}
function showLesson(id){
  const l = BYID[id]; if(!l) return;
  const dm = DATA.domains.find(d => d.key === l.dom);
  const idx = ORDER.findIndex(x => x.id === id);
  const prev = idx > 0 ? ORDER[idx-1] : null, next = idx < ORDER.length-1 ? ORDER[idx+1] : null;
  $("#main").innerHTML =
    '<div class="crumb">'+dm.name+' · '+l.id+(l.verified?' <span class="badge b-stable">延伸资源已核实</span>':'')+'</div>' +
    '<div class="content"><div class="lesstop"><h2 style="border:0;padding:0;margin:0 0 4px">'+esc(l.title)+'</h2>'+markBtn(id)+'</div>'+
    l.html + '</div>' +
    '<div class="pn">'+(prev?'<button data-go="'+prev.id+'">← '+prev.id+'</button>':'<span></span>')+
    (next?'<button data-go="'+next.id+'">'+next.id+' →</button>':'<span></span>')+'</div>';
  current = id; window.scrollTo(0,0);
}
function showTree(){
  $("#main").innerHTML = '<div class="content"><h2 style="border:0;margin-top:0">知识树（77 节点）</h2>' +
    '<p style="color:var(--muted)">卡片来自 v0.1.0 登记表；约束为骨架期常识层，逐条溯源见项目 sources/。</p>' +
    DATA.domains.map(dm => {
      const ns = DATA.nodes.filter(nd => nd.id.startsWith(dm.key));
      if(!ns.length) return "";
      return '<h3>'+dm.name+' <span style="color:var(--muted);font-size:12px">'+dm.desc+'</span></h3>' +
        '<div class="grid">'+ns.map(nd =>
          '<div class="card"><h4>'+nd.id+' · '+esc(nd.name)+' '+matBadge(nd.maturity)+'</h4>'+
          '<p>'+esc(nd.def)+'</p><p><b style="color:var(--fg)">约束：</b>'+esc(nd.con)+'</p></div>').join("")+'</div>';
    }).join("") + '</div>';
  window.scrollTo(0,0);
}
function showPaths(){
  $("#main").innerHTML = '<div class="content"><h2 style="border:0;margin-top:0">最小学习路径（12 条）</h2>' +
    DATA.paths.map(p => '<h3>'+p.name+'</h3><div>'+
      p.ids.map(id => '<a class="pathstep" href="#/lesson/'+id+'" style="text-decoration:none">'+id+'</a>').join('<span style="color:var(--muted)">→</span>')+
      '</div><p style="color:var(--muted);font-size:13px;margin:6px 0 18px">'+esc(p.logic)+'</p>').join("") + '</div>';
  window.scrollTo(0,0);
}
function showPending(focus){
  $("#main").innerHTML = '<div class="content"><h2 style="border:0;margin-top:0">待验证清单（'+DATA.pending.length+' 项）</h2>' +
    '<p style="color:var(--muted)">诚实机制的出口：所有"有线索但证据不足"的表述登记于此，核对后并入知识库。</p>' +
    '<table><thead><tr><th>编号</th><th>内容</th><th>状态</th><th>验证路径</th></tr></thead><tbody>' +
    DATA.pending.map(p => '<tr id="p-'+p.id+'" style="'+(focus===p.id?"outline:2px solid var(--accent)":"")+
      '"><td><b>'+p.id+'</b></td><td>'+esc(p.item)+'</td><td>'+esc(p.status)+'</td><td>'+esc(p.path)+'</td></tr>').join("") +
    '</tbody></table></div>';
  window.scrollTo(0,0);
}
function showConf(cid){
  const c = DATA.conferences.find(x => x.id === cid); if(!c) return;
  $("#main").innerHTML = '<div class="crumb">会议追踪 · radar/conferences/</div><div class="content">'+c.html+'</div>';
  window.scrollTo(0,0);
}
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("lesson/")){ view="lesson"; showLesson(h.slice(7)); }
  else if(h === "tree"){ view="tree"; showTree(); }
  else if(h === "paths"){ view="paths"; showPaths(); }
  else if(h === "conf"){ view="conf"; showConf(DATA.conferences[0].id); }
  else if(h.startsWith("conf/")){ view="conf"; showConf(h.slice(5)); }
  else if(h.startsWith("pending")){ view="pending"; showPending(h.split("/")[1]); }
  else { view="lesson"; if(!current) current = ORDER[0] ? ORDER[0].id : null; if(current) showLesson(current); }
  renderTabs(); renderNav();
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, a.pathstep, a.xlink");
  if(!t) return;
  if(t.dataset.v){ location.hash = t.dataset.v === "lesson" ? "#/lesson/"+(current||ORDER[0].id) : "#/"+t.dataset.v; return; }
  if(t.dataset.id){ location.hash = "#/lesson/"+t.dataset.id; return; }
  if(t.dataset.node){ const nd = DATA.nodes.find(x=>x.id===t.dataset.node);
    $("#main").innerHTML='<div class="content"><div class="crumb">知识树 · '+nd.id+' · '+matBadge(nd.maturity)+'</div>'+
      '<h2 style="border:0;margin-top:0">'+esc(nd.name)+'</h2><p>'+esc(nd.def)+'</p><p><b>关键约束：</b>'+esc(nd.con)+
      '</p><p style="color:var(--muted);font-size:13px">来源：'+esc(nd.src)+'（meta/source-registry.md）</p></div>';
    window.scrollTo(0,0); return; }
  if(t.dataset.pend){ view="pending"; renderTabs(); renderNav(); showPending(t.dataset.pend); return; }
  if(t.dataset.conf){ location.hash = "#/conf/"+t.dataset.conf; return; }
  if(t.dataset.go){ location.hash = "#/lesson/"+t.dataset.go; return; }
  if(t.id === "readtoggle"){ READ[current] = !READ[current]; if(!READ[current]) delete READ[current];
    saveRead(); showLesson(current); renderNav(); return; }
});
$("#search").addEventListener("input", e => { q = e.target.value; renderNav(); });
window.addEventListener("hashchange", route);
route();
</script>
