<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMS 学习平台 · 阅读站</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1c2330; --muted:#6b7686; --line:#e4e8ee;
  --accent:#2563eb; --accent-soft:#eaf1fe; --ok:#15803d; --warn:#b45309; --front:#7c3aed;
  --code-bg:#f1f3f7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181f; --panel:#1c2129; --fg:#e7ebf1; --muted:#96a0ae; --line:#2a313c;
    --accent:#6ea8fe; --accent-soft:#1d2a3f; --ok:#4ade80; --warn:#fbbf24; --front:#c4b5fd;
    --code-bg:#242b36; }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);font-size:15px;line-height:1.75}
#app{display:flex;min-height:100vh}
aside{width:288px;flex:0 0 288px;background:var(--panel);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
.logo{padding:16px 18px 10px}
.logo b{font-size:16px}
.logo .sub{color:var(--muted);font-size:12px;margin-top:2px}
.viewtabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line)}
.viewtabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:8px;padding:6px 0;font-size:13px;cursor:pointer}
.viewtabs button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
#search{margin:10px 14px 6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font-size:13px;width:calc(100% - 28px)}
#nav{overflow-y:auto;flex:1;padding:6px 8px 90px}
.dom{margin-top:10px}
.dom-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 10px;color:var(--muted);font-size:12px}
.dom-h b{color:var(--fg);font-size:13px;font-weight:600}
.les{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;
  color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer}
.les:hover{background:var(--accent-soft)}
.les.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.les .lid{color:var(--muted);font-size:11px;flex:0 0 62px}
.les .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les .rd{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.les.isread .rd{background:var(--ok);border-color:var(--ok)}
.progress{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;border-top:1px solid var(--line);
  background:var(--panel);font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;padding:28px 34px 80px}
.wrap{max-width:860px;margin:0 auto}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.content h2{font-size:20px;margin:28px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.content h2:first-child{margin-top:0;border-top:0;padding-top:0}
.content h3{font-size:16.5px;margin:22px 0 8px}
.content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px}
.content th,.content td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.content th{background:var(--accent-soft);font-weight:600}
.content code{background:var(--code-bg);border-radius:5px;padding:1px 6px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.content pre{background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow-x:auto}
.content blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);
  margin:12px 0;padding:8px 14px;border-radius:0 8px 8px 0;color:var(--muted)}
.content details{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--bg)}
.content summary{cursor:pointer;font-weight:600;color:var(--accent)}
.content .math{background:var(--code-bg);border-radius:8px;padding:10px 14px;margin:10px 0;
  font-family:ui-monospace,Menlo,monospace;font-size:13.5px;overflow-x:auto}
.content a{color:var(--accent);text-decoration:none}
.content a:hover{text-decoration:underline}
.content li{margin:3px 0}
.fileref{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;margin-right:6px}
.b-stable{background:rgba(21,128,61,.13);color:var(--ok)}
.b-evolving{background:rgba(180,83,9,.13);color:var(--warn)}
.b-frontier{background:rgba(124,58,237,.13);color:var(--front)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.lesstop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.readbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;
  padding:5px 12px;font-size:12.5px;cursor:pointer}
.readbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.pn button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;
  padding:8px 14px;font-size:13px;cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn button:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.card h4{margin:0 0 6px;font-size:14px}
.card p{margin:4px 0;font-size:13px;color:var(--muted)}
.pathstep{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:7px;
  padding:2px 9px;font-size:12.5px;margin:2px 3px 2px 0}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.hitmark{background:#ffe89c;color:inherit;border-radius:3px}
@media (max-width:860px){
  #app{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  #nav{max-height:40vh}
  main{padding:18px 14px 60px}
  .content{padding:18px 16px}
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="logo"><b>⚡ BMS 学习平台</b><div class="sub">77 节点 · 77 课 · 离线阅读站</div></div>
    <div class="viewtabs" id="viewtabs"></div>
    <input id="search" type="search" placeholder="全文搜索（课程/节点/待验证）…">
    <div id="nav"></div>
    <div class="progress" id="progress"></div>
  </aside>
  <main><div class="wrap" id="main"></div></main>
</div>
<script>
const DATA = {"domains": [{"key": "ARCH", "name": "跨域层 · 架构", "desc": "集中式 / 主从 / 分布式 / 无线 / 云边的取舍"}, {"key": "GEN", "name": "跨域层 · 代际", "desc": "传统车载 → 云端辅助 → AI/数字孪生"}, {"key": "SYS", "name": "域一 边界与架构", "desc": "BMS 管什么、管到哪、以什么形态挂上整车"}, {"key": "SAFE", "name": "域二 安全设计", "desc": "ISO 26262 流程驱动 + 网络安全 + AI 论证"}, {"key": "HW", "name": "域三 硬件", "desc": "AFE / MCU / 传感 / 隔离 / 执行"}, {"key": "SW", "name": "域四 软件", "desc": "架构 / 调度 / 协议栈 / 状态机 / 诊断 / OTA"}, {"key": "HV", "name": "域五 高压", "desc": "先建立、再维持、能撤出"}, {"key": "ALG", "name": "域六 核心算法", "desc": "SOC / SOH / SOP / 均衡 / 诊断 / 模型"}, {"key": "CHG", "name": "域七 充电", "desc": "接口 → 协议 → 控制 → 安全"}, {"key": "THM", "name": "域八 热管理", "desc": "测得准 → 算得清 → 控得住"}, {"key": "FLT", "name": "域九 故障", "desc": "识别 → 记录 → 降级 → 退出"}, {"key": "DEV", "name": "域十 开发验证", "desc": "V 模型 / 验证阶梯 / HIL / 合规 / 标定"}, {"key": "CHM", "name": "域十一 化学体系", "desc": "锂电基准 / 钠电 / 固态 / 梯次"}], "paths": [{"name": "跨域层 · 架构", "ids": ["ARCH-C", "ARCH-MS", "ARCH-D", "ARCH-W", "ARCH-CE"], "logic": "线束成本/可靠性与控制权集中度的权衡，逐代松动"}, {"name": "跨域层 · 代际", "ids": ["GEN-1", "GEN-2", "GEN-3"], "logic": "算力从\"只在车上\"到\"车云分工\"再到\"模型驱动预测\""}, {"name": "SYS 边界与架构", "ids": ["SYS-01", "SYS-02", "ARCH-MS", "SYS-04", "SW-05"], "logic": "先知道 BMS 管什么、管到哪为止，再看形态"}, {"name": "SAFE 安全设计", "ids": ["SAFE-01", "SAFE-02", "SAFE-03", "SAFE-04"], "logic": "HARA 定目标，ASIL 定严格度，机制是落地——顺序不能反"}, {"name": "HW 硬件", "ids": ["HW-01", "HW-03", "HW-04", "HW-02", "HW-05"], "logic": "沿信号链：采集→传输→处理→执行"}, {"name": "SW 软件", "ids": ["SW-01", "SW-02", "SW-03", "SW-04", "SW-05"], "logic": "先立骨架，再通对外，后通行为"}, {"name": "HV 高压", "ids": ["HV-02", "HV-05", "HV-01", "HV-03", "HV-04"], "logic": "先建立、再维持、能撤出"}, {"name": "ALG 算法", "ids": ["ALG-01", "ALG-10", "ALG-02", "ALG-05", "ALG-06"], "logic": "模型是根，估计是干；状态→老化→能力"}, {"name": "CHG 充电", "ids": ["CHG-01", "CHG-02", "CHG-06", "CHG-03", "CHG-04"], "logic": "先物理连接，再对话，最后控制与安全底线"}, {"name": "THM 热管理", "ids": ["THM-01", "THM-02", "THM-03", "THM-04"], "logic": "先测得准，再算得清，再控得住"}, {"name": "FLT 故障", "ids": ["FLT-01", "FLT-02", "FLT-03", "FLT-04"], "logic": "识别→记录→降级→退出，四级递进"}, {"name": "DEV 开发验证", "ids": ["DEV-01", "DEV-02", "DEV-03", "DEV-04", "DEV-05"], "logic": "先流程后台架后法规，最后实车数据收口"}], "lessons": [{"id": "ALG-01", "title": "课程 ALG-01：SOC 的地基——安时积分与 OCV 校正", "dom": "ALG", "verified": true, "html": "<blockquote><p>对应节点 <code>ALG-01<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：无 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么 BMS 必须知道 SOC<\/h3>\n<p>SOC（State of Charge，荷电状态）= 剩余可用容量 ÷ 当前满容量。它同时喂饱三个下游功能：<\/p>\n<ol>\n<li><strong>续航显示<\/strong>——司机直接看到的数字；<\/li>\n<li><strong>SOP 功率限制<\/strong>（见 <code>ALG-06<\/code>）——低 SOC 时收紧放电功率以保护电池；<\/li>\n<li><strong>充电控制<\/strong>（见 <code>CHG-06<\/code>）——充电末端降流策略以 SOC 为自变量。<\/li>\n<p>SOC 估错，三个下游全错。这是它是\"核心算法中的核心\"的原因。<\/p>\n<\/ol>\n<h3>2. 安时积分（Coulomb Counting）<\/h3>\n<div class=\"math\">SOC(t) = SOC(t_0) + \\frac{\\eta}{C}\\int_{t_0}^{t} I\\,dt \\quad(\\text{放电时 } I&lt;0)<\/div>\n<ul>\n<li><strong>C<\/strong>：当前满容量（注意：不是出厂额定值，而是随老化缩水的 C(SOH)，与 <code>ALG-05<\/code> 耦合）<\/li>\n<li><strong>η<\/strong>：库仑效率（coulombic efficiency），锂电充电段 ≈0.99 以上，放电段取 1（工程惯例）<\/li>\n<\/ul>\n<h4>手算实例 1（基础）<\/h4>\n<p>100 Ah 电池包，当前 SOC=80%，以 25 A 恒流放电 2 h：<\/p>\n<p>ΔSOC = 25 × 2 / 100 = 50% → <strong>SOC = 30%<\/strong><\/p>\n<h4>手算实例 2（带效率与符号）<\/h4>\n<p>以 50 A 充电 1 h，η=0.99：ΔSOC = 50 × 1 × 0.99 / 100 = <strong>+49.5%<\/strong> → 从 30% 到 79.5%。<\/p>\n<h4>手算实例 3（误差累积——为什么必须校正）<\/h4>\n<p>设电流传感器有 +0.2 A 零偏（shunt 方案温漂的示意量级）：<\/p>\n<ul>\n<li>每放电 10 h 多记 0.2 × 10 = 2 Ah；<\/li>\n<li>对 100 Ah 包 = 每 10 h 偏 2%；<\/li>\n<li>若一周不校正且每天行驶 2 h：0.2 × 14 = 2.8 Ah ≈ <strong>2.8% 的纯漂移<\/strong>，还没算初始值误差。<\/li>\n<p><strong>结论：安时积分是\"漂移的\"，必须有外部锚点定期校正。<\/strong><\/p>\n<\/ul>\n<h3>3. 锚点：OCV（开路电压）校正<\/h3>\n<p>OCV 与 SOC 存在单调对应。静置足够久（让极化电压弛豫掉，典型 1~2 h 量级，教学示意值）后，端电压 ≈ OCV，查 OCV-SOC 表即可反演 SOC。<\/p>\n<p><strong>车上免费的校正机会 = 停车过夜。<\/strong> 晨起上电时极化已消失——这是量产车 SOC 精度的真实支柱，而不是什么神秘算法。<\/p>\n<h4>关键限制：曲线斜率决定校正能力<\/h4>\n<ul>\n<li><strong>NCM（三元）<\/strong>：OCV-SOC 全程斜率较可观，中段每 1% SOC 对应若干 mV 电压变化（量级示意：数 mV/%，随电芯而异 [待核对 → P-14]），校正机会多。<\/li>\n<li><strong>LFP（磷酸铁锂）<\/strong>：中段（约 30~70% SOC，示意）出现极平的电压平台，且充放电曲线不重合（<strong>滞回 hysteresis<\/strong>）。平台段内\"电压差翻译成 SOC 差\"的能力几乎为零。<\/li>\n<p>这就是 <strong>LFP 车仪表 SOC\"跳变\"现象的根源<\/strong>，也是 LFP 车推荐定期充满的原因——满充端点在平台之外、斜率陡峭，是稀缺的可靠锚点（此说法为工程实践观点，官方手册来源待核对 → P-15）。<\/p>\n<\/ul>\n<h3>4. 误差预算表（工程视角）<\/h3>\n<table><thead><tr><th>误差源<\/th><th>影响量级（教学示意）<\/th><th>缓解手段<\/th><\/tr><\/thead><tbody><tr><td>电流零偏<\/td><td>0.1~0.5 A → 每天约 0.5~2%（100 Ah 包，按 2 h 行驶）<\/td><td>周期 OCV 锚定；传感器自校<\/td><\/tr><tr><td>初始 SOC 错误<\/td><td>上电即继承<\/td><td>下电前落盘 + 上电 OCV 校正<\/td><\/tr><tr><td>容量 C 不准<\/td><td>SOH 降 10% → SOC 系统性偏差 10%<\/td><td>联合 SOH 估计（<code>ALG-05<\/code>）<\/td><\/tr><tr><td>库仑效率<\/td><td>&lt;1%<\/td><td>充电段乘 η<\/td><\/tr><tr><td>OCV 平台（LFP）<\/td><td>校正失效、滞回<\/td><td>满充锚定 + 模型法（<code>ALG-02<\/code>）<\/td><\/tr><\/tbody><\/table>\n<h3>5. 工程实态<\/h3>\n<p>几乎所有量产 BMS 都采用\"<strong>安时积分打骨架 + OCV/模型定期校正<\/strong>\"的混合架构，纯积分或纯模型都不量产。（工程共识，框架依据 S-16；\"几乎所有\"的表述属观点级，欢迎投喂反例）<\/p>\n<h3>6. 常见误区<\/h3>\n<ol>\n<li>\"SOC 估计就是算安时积分\"——忽略了校正锚点才是精度瓶颈。<\/li>\n<li>把 SOC=100% 当校准点——只有真正充满且静置后才成立；没充满就拔枪不是锚点。<\/li>\n<li>LFP 电芯套用 NCM 的 OCV 表——曲线形状完全不同，直接报废精度。<\/li>\n<\/ol>\n<h3>7. 自测<\/h3>\n<p><strong>Q1<\/strong>：80 Ah 包，SOC=60%，以 40 A 放电 30 min（η 放电=1），SOC 变为多少？ <strong>Q2<\/strong>：为什么 LFP 车推荐\"定期充满\"，而三元车不强调？ <strong>Q3<\/strong>：电流零偏 0.1 A，100 Ah 包，每天行驶 2 h、从不校正，30 天后漂移多少？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：60% − 40×0.5/80 = 60% − 25% = <strong>35%<\/strong><\/li>\n<li>Q2：LFP 中段 OCV 平台几乎无斜率、另有滞回，中途没有可靠校正机会；满充端点斜率大，是唯一稳定锚点。三元全程斜率可观，中途即可校正。<\/li>\n<li>Q3：0.1 × 2 × 30 = 6 Ah = <strong>6%<\/strong><\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I / Vol. II, Artech House, 2015（安时积分+OCV 校正框架）<\/li>\n<li>S-03：GB/T 38661-2020 §5.5（<strong>已核实 2026-11-15<\/strong>：BEV/PHEV 的 SOC 估算累积误差 ≤5%，HEV 另有要求；试验方法在第 6 章）<\/li>\n<li>P-14：LFP/NCM 平台段 dOCV/dSOC 典型数值（待文献核对后回填）<\/li>\n<li>P-15：\"LFP 车型建议定期满充\"的官方用户手册来源<\/li>\n<\/ul>\n<h3>延伸资源（链接已于 2026-11-04 联网核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"http://mocha-java.uccs.edu/dossier/RESEARCH/2004jps1-.pdf\" target=\"_blank\" rel=\"noopener\">Plett 2004 Part 1: Coulomb counting and observational methods（作者自托管 PDF）<\/a> ｜ <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0378775304003593\" target=\"_blank\" rel=\"noopener\">ScienceDirect 页面<\/a><\/td><td>A<\/td><td>✅<\/td><td>本课方法框架的原始文献（<em>J. Power Sources<\/em> 134: 252–261）<\/td><\/tr><tr><td><a href=\"https://www.ti.com/lit/slua364\" target=\"_blank\" rel=\"noopener\">TI SLUA364: Theory and Implementation of Impedance Track<\/a><\/td><td>A<\/td><td>✅<\/td><td>量产电量计芯片的官方算法文档——\"安时积分+模型更新\"的商业实现<\/td><\/tr><tr><td><a href=\"https://www.ti.com/lit/pdf/slyt402\" target=\"_blank\" rel=\"noopener\">TI SLYT402: Fine-tuning Impedance Track gauge with LiFePO4 (IT3)<\/a><\/td><td>A<\/td><td>✅<\/td><td>LFP 平台期对电量计的特殊处理，直接对应本文第 3 节<\/td><\/tr><tr><td><a href=\"http://www.batteryuniversity.com/article/bu-903-how-to-measure-state-of-charge\" target=\"_blank\" rel=\"noopener\">BU-903: How to Measure State-of-charge<\/a><\/td><td>B<\/td><td>✅<\/td><td>入门直觉阅读（厂商教育站，不作事实层引用）<\/td><\/tr><\/tbody><\/table>", "text": " 对应节点 alg-01 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置：无 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么 bms 必须知道 soc soc（state of charge，荷电状态）= 剩余可用容量 ÷ 当前满容量。它同时喂饱三个下游功能： 续航显示 ——司机直接看到的数字； sop 功率限制 （见 alg-06 ）——低 soc 时收紧放电功率以保护电池； 充电控制 （见 chg-06 ）——充电末端降流策略以 soc 为自变量。 soc 估错，三个下游全错。这是它是\"核心算法中的核心\"的原因。 2. 安时积分（coulomb counting） soc(t) = soc(t_0) + \\frac{\\eta}{c}\\int_{t_0}^{t} i\\,dt \\quad(\\text{放电时 } i&lt;0) c ：当前满容量（注意：不是出厂额定值，而是随老化缩水的 c(soh)，与 alg-05 耦合） η ：库仑效率（coulombic efficiency），锂电充电段 ≈0.99 以上，放电段取 1（工程惯例） 手算实例 1（基础） 100 ah 电池包，当前 soc=80%，以 25 a 恒流放电 2 h： δsoc = 25 × 2 / 100 = 50% → soc = 30% 手算实例 2（带效率与符号） 以 50 a 充电 1 h，η=0.99：δsoc = 50 × 1 × 0.99 / 100 = +49.5% → 从 30% 到 79.5%。 手算实例 3（误差累积——为什么必须校正） 设电流传感器有 +0.2 a 零偏（shunt 方案温漂的示意量级）： 每放电 10 h 多记 0.2 × 10 = 2 ah； 对 100 ah 包 = 每 10 h 偏 2%； 若一周不校正且每天行驶 2 h：0.2 × 14 = 2.8 ah ≈ 2.8% 的纯漂移 ，还没算初始值误差。 结论：安时积分是\"漂移的\"，必须有外部锚点定期校正。 3. 锚点：ocv（开路电压）校正 ocv 与 soc 存在单调对应。静置足够久（让极化电压弛豫掉，典型 1~2 h 量级，教学示意值）后，端电压 ≈ ocv，查 ocv-soc 表即可反演 soc。 车上免费的校正机会 = 停车过夜。 晨起上电时极化已消失——这是量产车 soc 精度的真实支柱，而不是什么神秘算法。 关键限制：曲线斜率决定校正能力 ncm（三元） ：ocv-soc 全程斜率较可观，中段每 1% soc 对应若干 mv 电压变化（量级示意：数 mv/%，随电芯而异 [待核对 → p-14]），校正机会多。 lfp（磷酸铁锂） ：中段（约 30~70% soc，示意）出现极平的电压平台，且充放电曲线不重合（ 滞回 hysteresis ）。平台段内\"电压差翻译成 soc 差\"的能力几乎为零。 这就是 lfp 车仪表 soc\"跳变\"现象的根源 ，也是 lfp 车推荐定期充满的原因——满充端点在平台之外、斜率陡峭，是稀缺的可靠锚点（此说法为工程实践观点，官方手册来源待核对 → p-15）。 4. 误差预算表（工程视角） 误差源 影响量级（教学示意） 缓解手段 电流零偏 0.1~0.5 a → 每天约 0.5~2%（100 ah 包，按 2 h 行驶） 周期 ocv 锚定；传感器自校 初始 soc 错误 上电即继承 下电前落盘 + 上电 ocv 校正 容量 c 不准 soh 降 10% → soc 系统性偏差 10% 联合 soh 估计（ alg-05 ） 库仑效率 &lt;1% 充电段乘 η ocv 平台（lfp） 校正失效、滞回 满充锚定 + 模型法（ alg-02 ） 5. 工程实态 几乎所有量产 bms 都采用\" 安时积分打骨架 + ocv/模型定期校正 \"的混合架构，纯积分或纯模型都不量产。（工程共识，框架依据 s-16；\"几乎所有\"的表述属观点级，欢迎投喂反例） 6. 常见误区 \"soc 估计就是算安时积分\"——忽略了校正锚点才是精度瓶颈。 把 soc=100% 当校准点——只有真正充满且静置后才成立；没充满就拔枪不是锚点。 lfp 电芯套用 ncm 的 ocv 表——曲线形状完全不同，直接报废精度。 7. 自测 q1 ：80 ah 包，soc=60%，以 40 a 放电 30 min（η 放电=1），soc 变为多少？ q2 ：为什么 lfp 车推荐\"定期充满\"，而三元车不强调？ q3 ：电流零偏 0.1 a，100 ah 包，每天行驶 2 h、从不校正，30 天后漂移多少？ 答案 q1：60% − 40×0.5/80 = 60% − 25% = 35% q2：lfp 中段 ocv 平台几乎无斜率、另有滞回，中途没有可靠校正机会；满充端点斜率大，是唯一稳定锚点。三元全程斜率可观，中途即可校正。 q3：0.1 × 2 × 30 = 6 ah = 6% 来源 s-16：g. plett, battery management systems vol. i / vol. ii, artech house, 2015（安时积分+ocv 校正框架） s-03：gb/t 38661-2020 §5.5（ 已核实 2026-11-15 ：bev/phev 的 soc 估算累积误差 ≤5%，hev 另有要求；试验方法在第 6 章） p-14：lfp/ncm 平台段 docv/dsoc 典型数值（待文献核对后回填） p-15：\"lfp 车型建议定期满充\"的官方用户手册来源 延伸资源（链接已于 2026-11-04 联网核实） 资源 级别 免费 说明 plett 2004 part 1: coulomb counting and observational methods（作者自托管 pdf） ｜ sciencedirect 页面 a ✅ 本课方法框架的原始文献（ j. power sources 134: 252–261） ti slua364: theory and implementation of impedance track a ✅ 量产电量计芯片的官方算法文档——\"安时积分+模型更新\"的商业实现 ti slyt402: fine-tuning impedance track gauge with lifepo4 (it3) a ✅ lfp 平台期对电量计的特殊处理，直接对应本文第 3 节 bu-903: how to measure state-of-charge b ✅ 入门直觉阅读（厂商教育站，不作事实层引用） "}, {"id": "ALG-02", "title": "课程 ALG-02：用 EKF 把模型变成 SOC 估计器", "dom": "ALG", "verified": true, "html": "<blockquote><p>对应节点 <code>ALG-02<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>、<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a> ｜ 预计用时 60~90 min（本课程包最硬的一课）<\/p><\/blockquote>\n<h3>1. 问题重述<\/h3>\n<p>安时积分会漂（ALG-01），OCV 校正要等静置（停车过夜）。<strong>能不能边开车边校正？<\/strong><\/p>\n<p>能。思路：把电池模型当成\"虚拟传感器\"。模型说端电压应该是 3.700 V，实测是 3.690 V——这 10 mV 的差意味着我对内部状态的假设有错，用差值反向修正 SOC。这就是<strong>观测器<\/strong>；工程上最常用的是 EKF（Extended Kalman Filter，扩展卡尔曼滤波）。<\/p>\n<h3>2. 状态空间形式<\/h3>\n<p>把 ALG-10 的 2RC 模型写成状态空间：<\/p>\n<ul>\n<li><strong>状态<\/strong> x = [SOC, U1, U2]ᵀ，<strong>输入<\/strong> u = I，<strong>输出<\/strong> y = 端电压 U_t<\/li>\n<li>状态方程：SOC 速率 = ηI/C；极化电压按 RC 微分方程演化<\/li>\n<li>输出方程：y = OCV(SOC) − I·R0 − U1 − U2 + v（v 为测量噪声）<\/li>\n<li><strong>非线性来源<\/strong>：OCV(SOC) 是曲线不是直线 → 用 EKF：每个采样点在工作点做线性化，再套卡尔曼融合。<\/li>\n<\/ul>\n<h3>3. EKF 的机制直觉（先懂再推公式）<\/h3>\n<p>每个采样周期三步：<\/p>\n<ol>\n<li><strong>预测<\/strong>：用模型把状态推进一拍；同时把误差协方差 P 推进一拍——P 表示\"我对自己估计有多不确定\"。电流积分的漂移会<strong>累积进 P<\/strong>：越久没用电压观测修正，P 越大。<\/li>\n<li><strong>增益<\/strong>：K = P·Cᵀ / (C·P·Cᵀ + R)。直觉：K 是\"这一拍听测量的比例\"，由两个信任度决定——模型不确定性 P 越大 → 越信测量；测量噪声 R 越大 → 越不信测量。<\/li>\n<li><strong>修正<\/strong>：x ← x + K × (把电压差翻译成状态差的量)。<\/li>\n<\/ol>\n<h4>数值直觉示例（全部为教学示意值）<\/h4>\n<p>工况：NCM 电芯，估计 SOC=52%；该点 dOCV/dSOC = 2 mV/%；模型预测端电压 3.700 V，实测 3.690 V。<\/p>\n<ul>\n<li>电压差 = −10 mV。若<strong>完全信测量<\/strong>：ΔSOC = −10 / 2 = −5% → 修正到 47%；<\/li>\n<li>当前协方差 P 折算后取 K = 0.3（表示\"三分信测量、七分信模型\"）：<\/li>\n<p>SOC ← 52% + 0.3 × (−5%) = <strong>50.5%<\/strong><\/p>\n<p>注意 K 每拍自动变化：长时间无校正 → P 大 → K 自动变大 → 测量话语权上升。这正是\"自适应校正\"的实现方式，不需要人工开关。<\/p>\n<\/ul>\n<h3>4. 调 Q/R：算法工程师的日常<\/h3>\n<ul>\n<li><strong>Q（过程噪声）<\/strong>：等效于\"我多信任电流积分\"。Q 大 → 跟随快、但对电流噪声敏感；<\/li>\n<li><strong>R（测量噪声）<\/strong>：电压采集噪声 + 模型失配。R 大 → 平滑但迟钝。<\/li>\n<p>实车调参 = 在低温/高倍率/静置恢复等不同工况下平衡两者。常见工程手法：Q 随 |I| 自适应放大（大电流时积分误差更值得怀疑）。（工程实践观点，框架依据 S-17）<\/p>\n<\/ul>\n<h3>5. LFP 的残酷现实：可观测性崩塌<\/h3>\n<p>EKF 的修正能力正比于 <strong>dOCV/dSOC<\/strong>（输出方程对 SOC 的雅可比）。<\/p>\n<p>LFP 平台段该值 ≈ 0 → 实测电压再准也翻译不出 SOC 差 → K → 0 → <strong>退化回纯安时积分<\/strong>（漂移照旧累积，只是不再被修正）。<\/p>\n<p>量产对策（工程实践观察）：<\/p>\n<ol>\n<li><strong>端点锚定<\/strong>：满充/接近放空处 OCV 斜率大，抓住这两端做强校正；<\/li>\n<li><strong>滞回建模<\/strong>：把充放电 OCV 差作为附加状态，减少模型失配；<\/li>\n<li>弱校正机会的谨慎利用（平台段轻微修正，防发散）。<\/li>\n<p>这也解释了市场上\"LFP 车建议每周/每两周充满一次\"的实践——本质是给 EKF 制造锚点机会。（表述为工程实践观点；具体厂商官方手册依据待核对 → P-15）<\/p>\n<\/ol>\n<h3>6. 进阶路线图<\/h3>\n<ul>\n<li><strong>SPKF/UKF<\/strong>：用 sigma 点采样代替雅可比，处理强非线性（框架见 S-16）；<\/li>\n<li><strong>联合估计 / 双 EKF<\/strong>：SOC 与容量/内阻参数同时估计（Plett GLB 框架核心贡献，S-17）——这打通到 <code>ALG-05<\/code>（SOH 在线化）；<\/li>\n<li><strong>eSOC（<code>ALG-04<\/code>）<\/strong>：把估计对象从\"电池 SOC\"深入到\"每个电极的 SOC\"，校正老化导致的电极平衡偏移——AABC 2026 Battery Engineering 专场主题（P-04 待核对，见 ../../radar/conferences/aabc-2026.md <span class=\"fileref\">（项目文件 ../../radar/conferences/aabc-2026.md）<\/span>）。<\/li>\n<\/ul>\n<h3>7. 自测<\/h3>\n<p><strong>Q1<\/strong>：EKF 为什么要额外维护协方差 P，而不是只维护状态 x？ <strong>Q2<\/strong>：某一拍\"实测电压 − 模型预测电压 = 0\"，这一拍 EKF 还做什么？ <strong>Q3<\/strong>：为什么同一段代码，低温下 K 的表现会变化？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：K 由 P（和 R）算出，P 是\"该不该信这拍测量\"的依据；没有 P 就退化成固定增益，失去自适应能力。<\/li>\n<li>Q2：预测步照做（状态推进 + P 推进），测量修正项为零——不做修正，但仍为下一拍积累不确定性。<\/li>\n<li>Q3：低温下 R0/极化参数变化、电压采集有效噪声假设变化 → 模型失配进入 R 的有效值、P 的传播系数变化 → K 变。参数三维性（ALG-10 第 5 节）直接作用于滤波器行为。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-17：G. L. Plett, \"Extended Kalman filtering for battery management systems of LiPB-based HEV battery packs\" (Parts 1–3), <em>Journal of Power Sources<\/em> 134 (2004)。Part 3 DOI：10.1016/j.jpowsour.2004.02.033（<a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0378775304003611\" target=\"_blank\" rel=\"noopener\">ScienceDirect 页面<\/a>）——GLB 框架原始文献<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. II（SPKF、联合估计的教材级展开）<\/li>\n<\/ul>\n<h3>延伸资源（链接已于 2026-11-04 联网核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0378775304003611\" target=\"_blank\" rel=\"noopener\">Plett 2004 Part 3: State and parameter estimation（DOI 10.1016/j.jpowsour.2004.02.033）<\/a><\/td><td>A<\/td><td>SD 页面免费、全文付费<\/td><td>GLB 联合估计框架（SOC+参数双估计）原始文献（<em>J. Power Sources<\/em> 134: 277–292）<\/td><\/tr><tr><td><a href=\"https://www.mathworks.com/videos/introduction-to-kalman-filters-with-matlab-1601281664354.html\" target=\"_blank\" rel=\"noopener\">MATLAB Tech Talks: Understanding Kalman Filters（视频系列）<\/a><\/td><td>B<\/td><td>✅<\/td><td>MathWorks 官方系列，<strong>全程用电池 SOC 估计做贯穿案例<\/strong>；怕公式先看这个<\/td><\/tr><tr><td><a href=\"https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python\" target=\"_blank\" rel=\"noopener\">rlabbe《Kalman and Bayesian Filters in Python》（开源在线书）<\/a><\/td><td>B<\/td><td>✅<\/td><td>Jupyter 可运行的免费书，培养滤波直觉的最佳读物（~19k star）<\/td><\/tr><tr><td><a href=\"https://calce.umd.edu/battery-data\" target=\"_blank\" rel=\"noopener\">CalCE Battery Data（马里兰大学）<\/a><\/td><td>B<\/td><td>✅<\/td><td>公开数据集——动手把本课 EKF 在真实数据上复现<\/td><\/tr><\/tbody><\/table>", "text": " 对应节点 alg-02 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 、 alg-10 ｜ 预计用时 60~90 min（本课程包最硬的一课） 1. 问题重述 安时积分会漂（alg-01），ocv 校正要等静置（停车过夜）。 能不能边开车边校正？ 能。思路：把电池模型当成\"虚拟传感器\"。模型说端电压应该是 3.700 v，实测是 3.690 v——这 10 mv 的差意味着我对内部状态的假设有错，用差值反向修正 soc。这就是 观测器 ；工程上最常用的是 ekf（extended kalman filter，扩展卡尔曼滤波）。 2. 状态空间形式 把 alg-10 的 2rc 模型写成状态空间： 状态 x = [soc, u1, u2]ᵀ， 输入 u = i， 输出 y = 端电压 u_t 状态方程：soc 速率 = ηi/c；极化电压按 rc 微分方程演化 输出方程：y = ocv(soc) − i·r0 − u1 − u2 + v（v 为测量噪声） 非线性来源 ：ocv(soc) 是曲线不是直线 → 用 ekf：每个采样点在工作点做线性化，再套卡尔曼融合。 3. ekf 的机制直觉（先懂再推公式） 每个采样周期三步： 预测 ：用模型把状态推进一拍；同时把误差协方差 p 推进一拍——p 表示\"我对自己估计有多不确定\"。电流积分的漂移会 累积进 p ：越久没用电压观测修正，p 越大。 增益 ：k = p·cᵀ / (c·p·cᵀ + r)。直觉：k 是\"这一拍听测量的比例\"，由两个信任度决定——模型不确定性 p 越大 → 越信测量；测量噪声 r 越大 → 越不信测量。 修正 ：x ← x + k × (把电压差翻译成状态差的量)。 数值直觉示例（全部为教学示意值） 工况：ncm 电芯，估计 soc=52%；该点 docv/dsoc = 2 mv/%；模型预测端电压 3.700 v，实测 3.690 v。 电压差 = −10 mv。若 完全信测量 ：δsoc = −10 / 2 = −5% → 修正到 47%； 当前协方差 p 折算后取 k = 0.3（表示\"三分信测量、七分信模型\"）： soc ← 52% + 0.3 × (−5%) = 50.5% 注意 k 每拍自动变化：长时间无校正 → p 大 → k 自动变大 → 测量话语权上升。这正是\"自适应校正\"的实现方式，不需要人工开关。 4. 调 q/r：算法工程师的日常 q（过程噪声） ：等效于\"我多信任电流积分\"。q 大 → 跟随快、但对电流噪声敏感； r（测量噪声） ：电压采集噪声 + 模型失配。r 大 → 平滑但迟钝。 实车调参 = 在低温/高倍率/静置恢复等不同工况下平衡两者。常见工程手法：q 随 |i| 自适应放大（大电流时积分误差更值得怀疑）。（工程实践观点，框架依据 s-17） 5. lfp 的残酷现实：可观测性崩塌 ekf 的修正能力正比于 docv/dsoc （输出方程对 soc 的雅可比）。 lfp 平台段该值 ≈ 0 → 实测电压再准也翻译不出 soc 差 → k → 0 → 退化回纯安时积分 （漂移照旧累积，只是不再被修正）。 量产对策（工程实践观察）： 端点锚定 ：满充/接近放空处 ocv 斜率大，抓住这两端做强校正； 滞回建模 ：把充放电 ocv 差作为附加状态，减少模型失配； 弱校正机会的谨慎利用（平台段轻微修正，防发散）。 这也解释了市场上\"lfp 车建议每周/每两周充满一次\"的实践——本质是给 ekf 制造锚点机会。（表述为工程实践观点；具体厂商官方手册依据待核对 → p-15） 6. 进阶路线图 spkf/ukf ：用 sigma 点采样代替雅可比，处理强非线性（框架见 s-16）； 联合估计 / 双 ekf ：soc 与容量/内阻参数同时估计（plett glb 框架核心贡献，s-17）——这打通到 alg-05 （soh 在线化）； esoc（ alg-04 ） ：把估计对象从\"电池 soc\"深入到\"每个电极的 soc\"，校正老化导致的电极平衡偏移——aabc 2026 battery engineering 专场主题（p-04 待核对，见 ../../radar/conferences/aabc-2026.md （项目文件 ../../radar/conferences/aabc-2026.md） ）。 7. 自测 q1 ：ekf 为什么要额外维护协方差 p，而不是只维护状态 x？ q2 ：某一拍\"实测电压 − 模型预测电压 = 0\"，这一拍 ekf 还做什么？ q3 ：为什么同一段代码，低温下 k 的表现会变化？ 答案 q1：k 由 p（和 r）算出，p 是\"该不该信这拍测量\"的依据；没有 p 就退化成固定增益，失去自适应能力。 q2：预测步照做（状态推进 + p 推进），测量修正项为零——不做修正，但仍为下一拍积累不确定性。 q3：低温下 r0/极化参数变化、电压采集有效噪声假设变化 → 模型失配进入 r 的有效值、p 的传播系数变化 → k 变。参数三维性（alg-10 第 5 节）直接作用于滤波器行为。 来源 s-17：g. l. plett, \"extended kalman filtering for battery management systems of lipb-based hev battery packs\" (parts 1–3), journal of power sources 134 (2004)。part 3 doi：10.1016/j.jpowsour.2004.02.033（ sciencedirect 页面 ）——glb 框架原始文献 s-16：g. plett, battery management systems vol. ii（spkf、联合估计的教材级展开） 延伸资源（链接已于 2026-11-04 联网核实） 资源 级别 免费 说明 plett 2004 part 3: state and parameter estimation（doi 10.1016/j.jpowsour.2004.02.033） a sd 页面免费、全文付费 glb 联合估计框架（soc+参数双估计）原始文献（ j. power sources 134: 277–292） matlab tech talks: understanding kalman filters（视频系列） b ✅ mathworks 官方系列， 全程用电池 soc 估计做贯穿案例 ；怕公式先看这个 rlabbe《kalman and bayesian filters in python》（开源在线书） b ✅ jupyter 可运行的免费书，培养滤波直觉的最佳读物（~19k star） calce battery data（马里兰大学） b ✅ 公开数据集——动手把本课 ekf 在真实数据上复现 "}, {"id": "ALG-03", "title": "课程 ALG-03：数据驱动 SOC——让数据自己学会\"读\"电池", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-03<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>、<a class=\"xlink\" href=\"#/lesson/ALG-02\">ALG-02<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>ALG-02 的模型法准但贵：OCV 表要按温度×SOC×老化标定网格（ALG-10），滞回要建模，每换一版电芯全部重来。数据驱动的诱惑是<strong>跳过建模，直接学\"测量序列 → SOC\"的映射<\/strong>：<\/p>\n<ol>\n<li><strong>绕开人工 OCV 标定<\/strong>：LFP 平台段（ALG-01/02 的老大难）对学习模型只是\"一段难学的曲线\"，不需要人工构造锚点；<\/li>\n<li><strong>天然拟合非线性<\/strong>：迟滞、温度、老化特征都可作为输入喂进去；<\/li>\n<li><strong>吃云端算力红利<\/strong>（<a class=\"xlink\" href=\"#/lesson/GEN-2\">GEN-2<\/a>/<a class=\"xlink\" href=\"#/lesson/ARCH-CE\">ARCH-CE<\/a>）：训练在云端，车端只推理。<\/li>\n<p>代价同样真实：外推失效、可解释性差、功能安全论证难（<a class=\"xlink\" href=\"#/lesson/SAFE-06\">SAFE-06<\/a>）——所以节点成熟度是 <code>evolving<\/code>。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 三条主流路线<\/h4>\n<table><thead><tr><th>路线<\/th><th>输入 → 输出<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>人工特征 + 浅层回归（SVR/GPR 等）<\/td><td>特征向量（电压、dU/dt、累计安时…）→ SOC<\/td><td>轻量、可上车；特征工程是灵魂<\/td><\/tr><tr><td>序列深度学习（LSTM/GRU/TCN）<\/td><td>[U, I, T] 滑动窗口时序 → SOC<\/td><td>自动学特征；数据与算力需求大（方法谱系见 S-28/S-29）<\/td><\/tr><tr><td>融合架构<\/td><td>学习模型当 EKF 的\"观测器插件\"<\/td><td>物理约束兜底，量产友好方向<\/td><\/tr><\/tbody><\/table>\n<h4>2.2 训练目标与符号逐个解释<\/h4>\n<div class=\"math\">\\min_\\theta \\sum_i \\big\\| f_\\theta(x_i) - y_i \\big\\|^2<\/div>\n<ul>\n<li><strong>x_i<\/strong>：第 i 个输入（窗口时序或特征向量）；<\/li>\n<li><strong>y_i<\/strong>：标签 SOC——<strong>来自离线标定实验<\/strong>（小电流放电 + OCV 锚定 + 高精度库仑计数，即 ALG-01 方法反过来当地尺）。数据驱动最贵的不是 GPU，是<strong>标签与工况覆盖<\/strong>；<\/li>\n<li><strong>f_θ<\/strong>：模型（网络权重 / GPR 超参），θ 为待学参数；<\/li>\n<li><strong>GPR（高斯过程回归）的特殊性<\/strong>：输出均值 μ + 方差 σ²，σ² 天然就是\"置信度\"——这是它在安全敏感场合常被选中的原因。<\/li>\n<\/ul>\n<h4>2.3 失效回退（节点约束点题）<\/h4>\n<p>置信度 σ 或新工况检测器超阈值 → 本拍弃用网络输出 → 回退 EKF/安时积分（ALG-01/02），事件记录回传云端（<a class=\"xlink\" href=\"#/lesson/DEV-06\">DEV-06<\/a>）。<\/p>\n<h3>3. 手算实例（数字自洽，均为教学示意值）<\/h3>\n<h4>实例 1：最近邻回归玩具版 + 外推失效演示<\/h4>\n<p>训练集（25 °C 标定，斜率与 ALG-02 的 dOCV/dSOC ≈ 2 mV/% 同量级）：(3.72 V → 60%)、(3.70 V → 50%)、(3.68 V → 40%)。<\/p>\n<ul>\n<li>查询 A：U = 3.69 V，25 °C。距离：|3.69−3.70| = 0.01，|3.69−3.68| = 0.01，|3.69−3.72| = 0.03 → 前两个并列最近，取均值 → <strong>SOC ≈ 45%<\/strong>。合理。<\/li>\n<li>查询 B：U = 3.69 V，<strong>−10 °C<\/strong>。训练集没有低温样本，最近邻照样返回 45%——但低温下同电压对应的真实 SOC 与 25 °C 完全不同 → <strong>错得毫无自觉<\/strong>。这就是\"训练分布外（OOD, Out-of-Distribution）外推失效\"的最小可复现演示。<\/li>\n<\/ul>\n<h4>实例 2：置信度门控回退<\/h4>\n<p>设定回退阈值 σ_max = 2%（教学示意值）：<\/p>\n<ul>\n<li>工况一（训练流形内）：GPR 输出 SOC = 45%，σ = 0.3% &lt; 2% → 采用；<\/li>\n<li>工况二（−10 °C 冷启动）：σ = 4.0% &gt; 2% → 弃用，本帧改用安时积分值 43.5%（上一锚点积分而来，示意），并置\"低置信\"标志上报云端。<\/li>\n<p>要点：回退不是\"关机\"而是<strong>降级到物理方法<\/strong>——数据法叠在模型法之上，不是替代。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产车端 SOC 主力仍是 ALG-01/02 的模型法；数据驱动当前主要在<strong>云端<\/strong>做残差修正、异常检测与标定辅助（工程实践观察）；<\/li>\n<li>车端落地障碍：MCU/NPU 算力与内存预算、可解释性、ISO 26262（S-07）对软件组件确定性的要求——ML 组件的安全论证是独立课题；<\/li>\n<li>方法成熟度全景见综述 S-28/S-29；AI/ML 在 BMS 的产业化评估见 S-21（全文待取 → P-11）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"有了深度学习就不用建模\"——标签本身来自物理方法；外推失效必须物理法兜底；<\/li>\n<li>把训练集误差当车端精度——训练分布 ≠ 全生命周期工况（老化 8 年的车不在训练集里）；<\/li>\n<li>标签带病入库——用漂移的库仑计数当真值，网络把传感器误差学成\"物理\"；<\/li>\n<li>只输出点估计不给置信度——车上不可用（无法回退、无法审计）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么数据驱动 SOC 必须配回退机制？回退到哪里？ <strong>Q2<\/strong>：GPR 相比同等精度的 LSTM，在车端工程上多一个什么关键优势？ <strong>Q3<\/strong>：查询 B\"错得毫无自觉\"的根源是什么？给至少两条缓解措施。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：模型在训练分布外（低温/老化/新工况）输出不可信且误差无界，直接采用有安全风险；回退到物理方法（EKF/安时积分），误差有界、机理可审计。<\/li>\n<li>Q2：GPR 自带预测方差（置信度），可直接做门控回退；LSTM 需要额外的不确定性量化（深度集成、MC Dropout 等）。<\/li>\n<li>Q3：根源是最近邻假设\"特征空间相邻 ⇒ 输出相近\"，温度维度缺样本时假设崩塌。缓解：把温度纳入特征并覆盖全温域训练；OOD 检测（置信度/密度估计）触发回退；物理模型兜底融合。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-28：K. Yang et al., \"Battery State of Health Estimate Strategies...\", <em>Batteries<\/em> 9(7):351, 2023（数据驱动方法谱系，与 SOC 方法论同构）<\/li>\n<li>S-29：X. Lei et al., SOH/RUL 文献计量综述，<em>Green Energy &amp; Environment<\/em>, 2024<\/li>\n<li>S-21：SAE 2026-26-0382（AI/ML 在 BMS 的产业化评估；全文待取，P-11）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I/II（物理方法对照框架）<\/li>\n<li>S-32 / S-33：CalCE / NASA 公开数据集（自练数据源）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>I. Goodfellow 等《Deep Learning》<\/td><td>B<\/td><td>深度学习经典教材（MIT Press，免费在线版 [待补链]）<\/td><\/tr><tr><td>scikit-learn 开源项目<\/td><td>B<\/td><td>GPR/SVR 开箱即用（文档 [待补链]）<\/td><\/tr><tr><td>PyTorch 开源项目<\/td><td>B<\/td><td>LSTM/TCN 实现主力框架<\/td><\/tr><tr><td>CalCE / NASA 数据集（S-32/S-33）<\/td><td>B<\/td><td>本课实例的动手素材<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>数据驱动 SOC 估计的同行评议综述（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>量产车型车端采用数据驱动 SOC 的公开案例与算法形态<\/li>\n<li>车端推理算力/内存量级（MCU vs NPU 方案）<\/li>\n<li>GPR 在线推理的降复杂度方案（稀疏/近似变体）<\/li>\n<li>σ_max 回退阈值的行业典型取值<\/li>\n<\/ul>", "text": " 对应节点 alg-03 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 、 alg-02 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 alg-02 的模型法准但贵：ocv 表要按温度×soc×老化标定网格（alg-10），滞回要建模，每换一版电芯全部重来。数据驱动的诱惑是 跳过建模，直接学\"测量序列 → soc\"的映射 ： 绕开人工 ocv 标定 ：lfp 平台段（alg-01/02 的老大难）对学习模型只是\"一段难学的曲线\"，不需要人工构造锚点； 天然拟合非线性 ：迟滞、温度、老化特征都可作为输入喂进去； 吃云端算力红利 （ gen-2 / arch-ce ）：训练在云端，车端只推理。 代价同样真实：外推失效、可解释性差、功能安全论证难（ safe-06 ）——所以节点成熟度是 evolving 。 2. 机制展开 2.1 三条主流路线 路线 输入 → 输出 特点 人工特征 + 浅层回归（svr/gpr 等） 特征向量（电压、du/dt、累计安时…）→ soc 轻量、可上车；特征工程是灵魂 序列深度学习（lstm/gru/tcn） [u, i, t] 滑动窗口时序 → soc 自动学特征；数据与算力需求大（方法谱系见 s-28/s-29） 融合架构 学习模型当 ekf 的\"观测器插件\" 物理约束兜底，量产友好方向 2.2 训练目标与符号逐个解释 \\min_\\theta \\sum_i \\big\\| f_\\theta(x_i) - y_i \\big\\|^2 x_i ：第 i 个输入（窗口时序或特征向量）； y_i ：标签 soc—— 来自离线标定实验 （小电流放电 + ocv 锚定 + 高精度库仑计数，即 alg-01 方法反过来当地尺）。数据驱动最贵的不是 gpu，是 标签与工况覆盖 ； f_θ ：模型（网络权重 / gpr 超参），θ 为待学参数； gpr（高斯过程回归）的特殊性 ：输出均值 μ + 方差 σ²，σ² 天然就是\"置信度\"——这是它在安全敏感场合常被选中的原因。 2.3 失效回退（节点约束点题） 置信度 σ 或新工况检测器超阈值 → 本拍弃用网络输出 → 回退 ekf/安时积分（alg-01/02），事件记录回传云端（ dev-06 ）。 3. 手算实例（数字自洽，均为教学示意值） 实例 1：最近邻回归玩具版 + 外推失效演示 训练集（25 °c 标定，斜率与 alg-02 的 docv/dsoc ≈ 2 mv/% 同量级）：(3.72 v → 60%)、(3.70 v → 50%)、(3.68 v → 40%)。 查询 a：u = 3.69 v，25 °c。距离：|3.69−3.70| = 0.01，|3.69−3.68| = 0.01，|3.69−3.72| = 0.03 → 前两个并列最近，取均值 → soc ≈ 45% 。合理。 查询 b：u = 3.69 v， −10 °c 。训练集没有低温样本，最近邻照样返回 45%——但低温下同电压对应的真实 soc 与 25 °c 完全不同 → 错得毫无自觉 。这就是\"训练分布外（ood, out-of-distribution）外推失效\"的最小可复现演示。 实例 2：置信度门控回退 设定回退阈值 σ_max = 2%（教学示意值）： 工况一（训练流形内）：gpr 输出 soc = 45%，σ = 0.3% &lt; 2% → 采用； 工况二（−10 °c 冷启动）：σ = 4.0% &gt; 2% → 弃用，本帧改用安时积分值 43.5%（上一锚点积分而来，示意），并置\"低置信\"标志上报云端。 要点：回退不是\"关机\"而是 降级到物理方法 ——数据法叠在模型法之上，不是替代。 4. 工程实态 量产车端 soc 主力仍是 alg-01/02 的模型法；数据驱动当前主要在 云端 做残差修正、异常检测与标定辅助（工程实践观察）； 车端落地障碍：mcu/npu 算力与内存预算、可解释性、iso 26262（s-07）对软件组件确定性的要求——ml 组件的安全论证是独立课题； 方法成熟度全景见综述 s-28/s-29；ai/ml 在 bms 的产业化评估见 s-21（全文待取 → p-11）。 5. 常见误区 \"有了深度学习就不用建模\"——标签本身来自物理方法；外推失效必须物理法兜底； 把训练集误差当车端精度——训练分布 ≠ 全生命周期工况（老化 8 年的车不在训练集里）； 标签带病入库——用漂移的库仑计数当真值，网络把传感器误差学成\"物理\"； 只输出点估计不给置信度——车上不可用（无法回退、无法审计）。 6. 自测 q1 ：为什么数据驱动 soc 必须配回退机制？回退到哪里？ q2 ：gpr 相比同等精度的 lstm，在车端工程上多一个什么关键优势？ q3 ：查询 b\"错得毫无自觉\"的根源是什么？给至少两条缓解措施。 答案 q1：模型在训练分布外（低温/老化/新工况）输出不可信且误差无界，直接采用有安全风险；回退到物理方法（ekf/安时积分），误差有界、机理可审计。 q2：gpr 自带预测方差（置信度），可直接做门控回退；lstm 需要额外的不确定性量化（深度集成、mc dropout 等）。 q3：根源是最近邻假设\"特征空间相邻 ⇒ 输出相近\"，温度维度缺样本时假设崩塌。缓解：把温度纳入特征并覆盖全温域训练；ood 检测（置信度/密度估计）触发回退；物理模型兜底融合。 来源 s-28：k. yang et al., \"battery state of health estimate strategies...\", batteries 9(7):351, 2023（数据驱动方法谱系，与 soc 方法论同构） s-29：x. lei et al., soh/rul 文献计量综述， green energy &amp; environment , 2024 s-21：sae 2026-26-0382（ai/ml 在 bms 的产业化评估；全文待取，p-11） s-16：g. plett, battery management systems vol. i/ii（物理方法对照框架） s-32 / s-33：calce / nasa 公开数据集（自练数据源） 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 i. goodfellow 等《deep learning》 b 深度学习经典教材（mit press，免费在线版 [待补链]） scikit-learn 开源项目 b gpr/svr 开箱即用（文档 [待补链]） pytorch 开源项目 b lstm/tcn 实现主力框架 calce / nasa 数据集（s-32/s-33） b 本课实例的动手素材 [待补链] — 数据驱动 soc 估计的同行评议综述（核实后补） 待核对项（本课） 量产车型车端采用数据驱动 soc 的公开案例与算法形态 车端推理算力/内存量级（mcu vs npu 方案） gpr 在线推理的降复杂度方案（稀疏/近似变体） σ_max 回退阈值的行业典型取值 "}, {"id": "ALG-04", "title": "课程 ALG-04：电极级 SOC（eSOC）——把估计钻进电芯内部", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-04<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>、<a class=\"xlink\" href=\"#/lesson/ALG-02\">ALG-02<\/a>、<a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>前几课的 SOC 估计的都是\"整芯级\"标量。但锂离子电池是<strong>两个电极的跷跷板<\/strong>：充电 = 锂从正极脱出、嵌入负极。老化后跷跷板两端会各自变形：<\/p>\n<ul>\n<li><strong>LLI（锂库存损失，Loss of Lithium Inventory）<\/strong>：SEI 生长吃掉可用锂 → 满充时\"锂先没了，负极还没满\"；<\/li>\n<li><strong>LAM（活性材料损失，Loss of Active Material）<\/strong>：某一极活性材料缩水 → 该极先到边界。<\/li>\n<p>整芯 SOC 看不见\"锂分布在哪个电极、离析锂边界还有多远\"。eSOC（electrode SOC）把估计对象细化到<strong>每个电极各自的荷电状态<\/strong>，才能回答快充最关心的问题：<strong>负极离析锂边界还有多远？<\/strong>（与 <a class=\"xlink\" href=\"#/lesson/CHG-03\">CHG-03<\/a> 直接衔接。）<\/p>\n<\/ul>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 半电池 OCV 与全电池<\/h4>\n<div class=\"math\">U_{cell} = U_{pos}(\\theta_{pos}) - U_{neg}(\\theta_{neg})<\/div>\n<ul>\n<li><strong>U_pos(θ_pos)<\/strong>：正极半电池 OCV 曲线；<strong>θ_pos<\/strong> = 正极当前嵌锂量 ÷ 正极可嵌容量（0~1，嵌锂化学计量比 stoichiometry）；<\/li>\n<li><strong>U_neg(θ_neg)<\/strong>：负极半电池 OCV 曲线——石墨在大部分区间极平，这正是全电池出现电压平台（ALG-01 讲过的 LFP 现象）的机理来源之一；<\/li>\n<li><strong>θ 的窗口<\/strong>：每个电极有工作窗口 [θ(0%), θ(100%)]，整芯 SOC 就是把窗口边界之间线性推进的\"进度条\"。<\/li>\n<\/ul>\n<h4>2.2 老化如何移动窗口（符号逐个解释）<\/h4>\n<ul>\n<li><strong>LLI<\/strong>：可用锂总量减少 → 满充时两极都\"差一点才到顶\"→ 端点偏移，新鲜电芯的 OCV-SOC 表对老化电芯产生系统性偏差；<\/li>\n<li><strong>LAM_neg<\/strong>：负极容量 C_neg 缩水 → <strong>N/P 比<\/strong>（负极容量 ÷ 正极容量；设计值 &gt; 1 以留防析锂余量，<strong>文献典型 1.05~1.15——S-90<\/strong>：Mu et al. 2022 系统研究，N/P&lt;1 即析锂，2026-11-22 核实 P-72）下降 → 满充时负极先顶满；<\/li>\n<li><strong>eSOC 估计<\/strong> = 在线联合估计 (SOC + 电极容量/θ 窗口)——是 ALG-02 联合估计框架（S-17）把参数向量从 [容量, 内阻] 换成 [电极容量, θ 窗口] 的推广；依赖半电池曲线先验与高精度电压，对传感与模型要求高（节点约束）。<\/li>\n<\/ul>\n<h3>3. 手算实例：N/P 比退化如何吃掉析锂余量（数字自洽，全为教学示意值）<\/h3>\n<p>新鲜电芯：C_pos = 100 Ah，C_neg = 108 Ah → <strong>N/P = 1.08<\/strong>。<\/p>\n<ol>\n<li>满充：正极脱锂 100 Ah（到 100%），负极嵌锂 100/108 = <strong>92.6%<\/strong> → 负极余量 7.4%——这就是防析锂的设计余量；<\/li>\n<li>老化：负极 LAM 10% → C_neg = 108 × 0.9 = <strong>97.2 Ah<\/strong> → N/P = 97.2/100 = <strong>0.972 &lt; 1<\/strong>；<\/li>\n<li>此时满充改由负极限制：充入 97.2 Ah 时负极 θ_neg = 100%（顶满），正极只走到 97.2%；<\/li>\n<li>整芯 SOC 在新旧两种状态下都显示\"100%\"，但 eSOC 视角看到：<strong>负极余量从 7.4% → 0、正极还剩 2.8% 没脱完<\/strong>——若仍按新鲜参数在快充末段施加大电流，负极表面电位跌破 0 V（vs Li/Li⁺）→ 析锂。<\/li>\n<p>结论：整芯 SOC 对\"余量消失\"全程失明，eSOC 是看见它的最小手段。<\/p>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产车端目前<strong>不做完整 eSOC<\/strong>：需要半电池曲线先验 + 老化参数在线可观测，传感精度与算力都是门槛（工程共识；节点成熟度 <code>evolving<\/code>）；<\/li>\n<li>实验室/云端路径成熟：<strong>dQ/dV（差分容量）分析<\/strong>——容量对电压求导后的峰位置/峰高对电极退化敏感，用于离线电极平衡诊断与老化归因；<\/li>\n<li>学术前沿正朝车端收缩：<strong>AABC 2026 \"Estimating SOC and SOH\" 专场，Plett 报告主题即 eSOC 校正老化偏差<\/strong>（线索登记于 ../../radar/conferences/aabc-2026.md <span class=\"fileref\">（项目文件 ../../radar/conferences/aabc-2026.md）<\/span>，P-04 待核对——会议未开，本课不引用其内容）；<\/li>\n<li>潜在落地场景：快充末端析锂保护（CHG-03）、老化归因（与 <a class=\"xlink\" href=\"#/lesson/ALG-08\">ALG-08<\/a> 互补）、梯次筛选（<a class=\"xlink\" href=\"#/lesson/CHM-04\">CHM-04<\/a>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"整芯 SOC=100% 就代表负极安全\"——N/P 退化后恰恰相反（实例）；<\/li>\n<li>把 eSOC 当\"每个电极各自的电池 SOC\"——它是化学计量比进度条，锚点是半电池 OCV；<\/li>\n<li>假设 N/P 比与窗口边界终生不变——它们正是老化的输出；<\/li>\n<li>以为 eSOC 要往电芯里加传感器——主流路线仍是\"外部电压/电流 + 模型可观测性\"。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：用\"跷跷板\"语言解释：为什么 LLI 后满充时\"两极都差一点才到顶\"？ <strong>Q2<\/strong>：实例中 N/P 从 1.08 降到 0.972，为什么满充限制极从正极换成了负极？ <strong>Q3<\/strong>：dQ/dV 为什么比直接看 OCV 曲线更能暴露电极退化？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：锂是搬运对象，库存变少后同样的充电动作可搬运的总量变少；\"满充 = 可用锂全部搬到负极\"，锂少了，两边自然都到不了各自的几何顶点。<\/li>\n<li>Q2：满充由\"先到边界的一极\"限制。C_neg 缩水到 97.2 Ah 后，负极窗口容量 &lt; 正极 100 Ah，负极先顶满。<\/li>\n<li>Q3：求导把平缓的 OCV 曲线变成尖锐峰，峰位置/高度直接对应相变平台与电极容量——电极退化的微小移动在峰上被放大可见，原始曲线里却被淹没。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16 / S-17：Plett 专著与 2004 系列论文（联合估计与模型化方法框架；eSOC 为其前沿扩展方向）<\/li>\n<li>S-21：SAE 2026-26-0382（AI/ML 与建模在 BMS 的演进背景）<\/li>\n<li>P-04：AABC 2026 Plett eSOC 报告线索（<strong>待核对，未引用其内容<\/strong>）<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>G. Plett《Battery Management Systems》Vol. I（S-16）<\/td><td>B<\/td><td>电极平衡与半电池概念的教材级展开<\/td><\/tr><tr><td>M. Doyle, T. F. Fuller, J. Newman（1993, <em>J. Electrochem. Soc.<\/em>）经典建模论文<\/td><td>A<\/td><td>电极级机理建模的源头（衔接 <code>ALG-11<\/code>）<\/td><\/tr><tr><td>PyBaMM 开源项目<\/td><td>B<\/td><td>可复现半电池/全电池 OCV 组合的建模工具<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>dQ/dV / 电极级健康诊断综述（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>N/P 比设计典型区间（1.05~1.15 为示意量级）的电芯拆解文献佐证<\/li>\n<li>dQ/dV 峰特征与 LLI/LAM 归因的代表性同行评议文献<\/li>\n<li>AABC 2026 Plett eSOC 报告实际内容（会后 ≤2026-12-16 增量，P-04）<\/li>\n<li>eSOC 车端在线化的公开进展（论文/厂商白皮书）<\/li>\n<\/ul>", "text": " 对应节点 alg-04 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 、 alg-02 、 alg-05 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 前几课的 soc 估计的都是\"整芯级\"标量。但锂离子电池是 两个电极的跷跷板 ：充电 = 锂从正极脱出、嵌入负极。老化后跷跷板两端会各自变形： lli（锂库存损失，loss of lithium inventory） ：sei 生长吃掉可用锂 → 满充时\"锂先没了，负极还没满\"； lam（活性材料损失，loss of active material） ：某一极活性材料缩水 → 该极先到边界。 整芯 soc 看不见\"锂分布在哪个电极、离析锂边界还有多远\"。esoc（electrode soc）把估计对象细化到 每个电极各自的荷电状态 ，才能回答快充最关心的问题： 负极离析锂边界还有多远？ （与 chg-03 直接衔接。） 2. 机制展开 2.1 半电池 ocv 与全电池 u_{cell} = u_{pos}(\\theta_{pos}) - u_{neg}(\\theta_{neg}) u_pos(θ_pos) ：正极半电池 ocv 曲线； θ_pos = 正极当前嵌锂量 ÷ 正极可嵌容量（0~1，嵌锂化学计量比 stoichiometry）； u_neg(θ_neg) ：负极半电池 ocv 曲线——石墨在大部分区间极平，这正是全电池出现电压平台（alg-01 讲过的 lfp 现象）的机理来源之一； θ 的窗口 ：每个电极有工作窗口 [θ(0%), θ(100%)]，整芯 soc 就是把窗口边界之间线性推进的\"进度条\"。 2.2 老化如何移动窗口（符号逐个解释） lli ：可用锂总量减少 → 满充时两极都\"差一点才到顶\"→ 端点偏移，新鲜电芯的 ocv-soc 表对老化电芯产生系统性偏差； lam_neg ：负极容量 c_neg 缩水 → n/p 比 （负极容量 ÷ 正极容量；设计值 &gt; 1 以留防析锂余量， 文献典型 1.05~1.15——s-90 ：mu et al. 2022 系统研究，n/p&lt;1 即析锂，2026-11-22 核实 p-72）下降 → 满充时负极先顶满； esoc 估计 = 在线联合估计 (soc + 电极容量/θ 窗口)——是 alg-02 联合估计框架（s-17）把参数向量从 [容量, 内阻] 换成 [电极容量, θ 窗口] 的推广；依赖半电池曲线先验与高精度电压，对传感与模型要求高（节点约束）。 3. 手算实例：n/p 比退化如何吃掉析锂余量（数字自洽，全为教学示意值） 新鲜电芯：c_pos = 100 ah，c_neg = 108 ah → n/p = 1.08 。 满充：正极脱锂 100 ah（到 100%），负极嵌锂 100/108 = 92.6% → 负极余量 7.4%——这就是防析锂的设计余量； 老化：负极 lam 10% → c_neg = 108 × 0.9 = 97.2 ah → n/p = 97.2/100 = 0.972 &lt; 1 ； 此时满充改由负极限制：充入 97.2 ah 时负极 θ_neg = 100%（顶满），正极只走到 97.2%； 整芯 soc 在新旧两种状态下都显示\"100%\"，但 esoc 视角看到： 负极余量从 7.4% → 0、正极还剩 2.8% 没脱完 ——若仍按新鲜参数在快充末段施加大电流，负极表面电位跌破 0 v（vs li/li⁺）→ 析锂。 结论：整芯 soc 对\"余量消失\"全程失明，esoc 是看见它的最小手段。 4. 工程实态 量产车端目前 不做完整 esoc ：需要半电池曲线先验 + 老化参数在线可观测，传感精度与算力都是门槛（工程共识；节点成熟度 evolving ）； 实验室/云端路径成熟： dq/dv（差分容量）分析 ——容量对电压求导后的峰位置/峰高对电极退化敏感，用于离线电极平衡诊断与老化归因； 学术前沿正朝车端收缩： aabc 2026 \"estimating soc and soh\" 专场，plett 报告主题即 esoc 校正老化偏差 （线索登记于 ../../radar/conferences/aabc-2026.md （项目文件 ../../radar/conferences/aabc-2026.md） ，p-04 待核对——会议未开，本课不引用其内容）； 潜在落地场景：快充末端析锂保护（chg-03）、老化归因（与 alg-08 互补）、梯次筛选（ chm-04 ）。 5. 常见误区 \"整芯 soc=100% 就代表负极安全\"——n/p 退化后恰恰相反（实例）； 把 esoc 当\"每个电极各自的电池 soc\"——它是化学计量比进度条，锚点是半电池 ocv； 假设 n/p 比与窗口边界终生不变——它们正是老化的输出； 以为 esoc 要往电芯里加传感器——主流路线仍是\"外部电压/电流 + 模型可观测性\"。 6. 自测 q1 ：用\"跷跷板\"语言解释：为什么 lli 后满充时\"两极都差一点才到顶\"？ q2 ：实例中 n/p 从 1.08 降到 0.972，为什么满充限制极从正极换成了负极？ q3 ：dq/dv 为什么比直接看 ocv 曲线更能暴露电极退化？ 答案 q1：锂是搬运对象，库存变少后同样的充电动作可搬运的总量变少；\"满充 = 可用锂全部搬到负极\"，锂少了，两边自然都到不了各自的几何顶点。 q2：满充由\"先到边界的一极\"限制。c_neg 缩水到 97.2 ah 后，负极窗口容量 &lt; 正极 100 ah，负极先顶满。 q3：求导把平缓的 ocv 曲线变成尖锐峰，峰位置/高度直接对应相变平台与电极容量——电极退化的微小移动在峰上被放大可见，原始曲线里却被淹没。 来源 s-16 / s-17：plett 专著与 2004 系列论文（联合估计与模型化方法框架；esoc 为其前沿扩展方向） s-21：sae 2026-26-0382（ai/ml 与建模在 bms 的演进背景） p-04：aabc 2026 plett esoc 报告线索（ 待核对，未引用其内容 ） 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 g. plett《battery management systems》vol. i（s-16） b 电极平衡与半电池概念的教材级展开 m. doyle, t. f. fuller, j. newman（1993, j. electrochem. soc. ）经典建模论文 a 电极级机理建模的源头（衔接 alg-11 ） pybamm 开源项目 b 可复现半电池/全电池 ocv 组合的建模工具 [待补链] — dq/dv / 电极级健康诊断综述（核实后补） 待核对项（本课） n/p 比设计典型区间（1.05~1.15 为示意量级）的电芯拆解文献佐证 dq/dv 峰特征与 lli/lam 归因的代表性同行评议文献 aabc 2026 plett esoc 报告实际内容（会后 ≤2026-12-16 增量，p-04） esoc 车端在线化的公开进展（论文/厂商白皮书） "}, {"id": "ALG-05", "title": "课程 ALG-05：SOH——一族定义，不是一个数字", "dom": "ALG", "verified": true, "html": "<blockquote><p>对应节点 <code>ALG-05<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a> ｜ 预计用时 45 min<\/p><\/blockquote>\n<h3>1. \"SOH\"至少有三种口径，它们不相等<\/h3>\n<table><thead><tr><th>口径<\/th><th>定义<\/th><th>关心它的人<\/th><\/tr><\/thead><tbody><tr><td>容量口径 SOH_C<\/td><td>当前满容量 C ÷ 出厂额定 C₀<\/td><td>续航、二手残值<\/td><\/tr><tr><td>内阻口径 SOH_R<\/td><td>当前 R0 ÷ 出厂 R0（常报其倒数或换算百分比）<\/td><td>功率能力、快充<\/td><\/tr><tr><td>功率口径<\/td><td>可用峰值充/放电功率衰减率<\/td><td>SOP、快充体验<\/td><\/tr><\/tbody><\/table>\n<p><strong>同一个电池，三个数字不同、老化速度也不同<\/strong>（通常容量衰减慢、内阻上涨先显著影响体验）。工程事故高发点：对话双方用同一个词说不同口径。<\/p>\n<blockquote><p>这正是本项目厂商对比矩阵<strong>维度 1（SOH 定义与上报语义）<\/strong>的本体：同一 UDS $22 服务下的 F190/F191 等 DID，不同供应商在单位（% vs Ah）与刷新机制上分歧，根源就在口径选择与电化学建模假设（见 ../../compare/matrix.md <span class=\"fileref\">（项目文件 ../../compare/matrix.md）<\/span>，该维度证据待补）。<\/p><\/blockquote>\n<p><strong>法规落地（2026-11-13 更新，P-79 关闭；2026-11-21 补充 SOCE，P-80 关闭）<\/strong>：中国已发布<strong>首个动力电池健康与安全状态评估国标 GB/T 47136-2026《纯电动汽车动力蓄电池健康与安全状态评估规范》，2026-05-01 实施<\/strong>（<a href=\"https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F493E6BDCF7210EB024E71C0BE1BA911\" target=\"_blank\" rel=\"noopener\">国家标准全文公开系统<\/a>可查，S-66）——SOH/SOS 的评估方法与结果展示有了国家框架。<strong>另有 GB/T 46991.1-2025《电动汽车车载动力电池耐久性要求及试验 第 1 部分》（2026-07-01 实施，S-83）<\/strong>：以 <strong>SOCE（电池可用能量状态）<\/strong>统一耐久性评估——要求<strong>向消费者披露 SOCE 与虚拟里程<\/strong>，且 5 年/10 万公里 SOCE 应 ≥82%。Geely 董事长 2026-11-09 的\"电池寿命危机\"公开表态，正发生在这一法规栈落地后的首个冬天（radar/2026-11-10 #5）。<\/p>\n<h3>2. 老化的两条时间轴<\/h3>\n<ul>\n<li><strong>循环老化（cycle aging）<\/strong>：与吞吐电量（累计 Ah）、倍率、温度、放电深度（DOD）相关。机理名称：锂库存损失（LLI, Loss of Lithium Inventory）、活性材料损失（LAM, Loss of Active Material）。<\/li>\n<li><strong>日历老化（calendar aging）<\/strong>：与时间 × 温度 × 平均存储 SOC 相关（SEI 膜持续生长）。高温 + 高 SOC 存放加速。<\/li>\n<p>（机理框架依据 S-16；<strong>具体速率参数随化学体系差异巨大，本课不给通用数值<\/strong>——任何\"每月掉 X%\"的说法都必须绑定化学体系与工况才有意义。）<\/p>\n<\/ul>\n<h3>3. 在线估计怎么做：区间法手算实例<\/h3>\n<p><strong>示例<\/strong>（数字为教学示意值，方法为工程通行做法）：<\/p>\n<p>车机记录一次较长行程：出发前经 OCV 锚定 SOC=90%，到达后锚定 SOC=20%，期间安时积分净放电 62 Ah。<\/p>\n<ul>\n<li>区间容量 C ≈ 62 ÷ (0.90 − 0.20) = <strong>88.6 Ah<\/strong><\/li>\n<li>额定 100 Ah → SOH_C ≈ <strong>88.6%<\/strong><\/li>\n<p><strong>误差讨论<\/strong>（这才是工程重点）：<\/p>\n<li>两个 SOC 锚点各带 ±2% 误差 → 区间长度 70%±4% → C 的误差约 ±5%；<\/li>\n<li>区间越<strong>长<\/strong>、锚点越<strong>准<\/strong>，结果越好——所以车端用\"多次长行程统计平均\"，而不是单次事件下结论；<\/li>\n<li>若用户从不深放（永远 60~90% 之间用），区间短、锚点弱，车端 SOH 收敛很慢——这是真实量产的普遍痛点（工程实践观察）。<\/li>\n<p>其他路线：满充满放标定（准但用户不配合且有老化代价）、基于内阻在线辨识的功率口径估计（双 EKF，见 <code>ALG-02<\/code> 第 6 节）。<\/p>\n<\/ul>\n<h3>4. SOH 的下游（为什么它是\"资产的体检报告\"）<\/h3>\n<ol>\n<li><strong>续航估算<\/strong>：续航 = f(SOC, SOH_C, 温度, 工况)；<\/li>\n<li><strong>SOP 收紧<\/strong>（<code>ALG-06<\/code>）：内阻上涨 → 同样功率下压降更大 → 提前触限；<\/li>\n<li><strong>RUL 预测<\/strong>（<code>ALG-09<\/code>）：SOH 轨迹外推到阈值 = 剩余寿命；<\/li>\n<li><strong>商业层<\/strong>：残值评估、BaaS 订阅定价、保险——GEN-2/ARCH-CE 的云端价值兑现点；<\/li>\n<li><strong>售后责任判定<\/strong>（<code>FLT-05<\/code>）：衰减在保修线内还是外，取决于口径与证据链。<\/li>\n<\/ol>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 SOH 当单一数字引用而不说明口径；<\/li>\n<li>用仪表续航反推 SOH（续航受当前温度/工况/标定策略影响太大）；<\/li>\n<li>忽视日历老化：低里程车也会明显老化（时间在走）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：一辆车 SOH_C=92%，SOH_R 显示\"内阻 +25%\"，用户抱怨\"快充变慢\"。哪个口径解释了这个现象？ <strong>Q2<\/strong>：区间法估算中，为什么\"用户从不深放电\"会让 SOH 估计变差？ <strong>Q3<\/strong>：两台同型车：A 日常快充 + 常年户外停放（南方）；B 慢充 + 地下车库，里程相近。谁的日历老化更严重？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：内阻/功率口径。快充峰值电流大，压降 I·R0 随 R0 上涨 25% 显著增大，提前触及电压/温度限制 → 降流提前、充电变慢；容量口径 92% 并非主因。<\/li>\n<li>Q2：可用区间（SOC 锚点间的跨度）短 → C = ΔAh/ΔSOC 中分母小、锚点误差占比大 → 估计噪声大、收敛慢。<\/li>\n<li>Q3：A。日历老化 ∝ 时间 × 温度 × 存储 SOC，高温户外停放主导，与里程无关。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（老化机理框架与 SOH 定义族）<\/li>\n<li>SOH 上报语义分歧维度：本项目 compare/matrix.md 维度 1（当前证据待补，关联 P-02/P-03 线索）<\/li>\n<\/ul>\n<h3>延伸资源（链接已于 2026-11-04 联网核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.mdpi.com/2313-0105/9/7/351\" target=\"_blank\" rel=\"noopener\">Yang et al., \"Battery State of Health Estimate Strategies: From Data Acquisition to Machine Learning\", <em>Batteries<\/em> 9(7):351, 2023<\/a><\/td><td>A<\/td><td>✅ 开放获取<\/td><td>SOH 估计策略全景综述（从数据采集到机器学习）<\/td><\/tr><tr><td><a href=\"https://www.sciencedirect.com/science/article/pii/S2095756424001193\" target=\"_blank\" rel=\"noopener\">Lei et al., \"A review of lithium-ion battery SOH and RUL estimation methods based on bibliometric analysis\", <em>Green Energy &amp; Environment<\/em>, 2024<\/a><\/td><td>A<\/td><td>✅ 开放获取<\/td><td>文献计量综述——一张图看清 SOH/RUL 方法谱系<\/td><\/tr><tr><td><a href=\"https://data.nasa.gov/dataset/li-ion-battery-aging-datasets\" target=\"_blank\" rel=\"noopener\">NASA PCoE Li-ion Battery Aging Datasets<\/a><\/td><td>B<\/td><td>✅<\/td><td>公开老化数据集，SOH/RUL 研究的标准数据源之一（动手）<\/td><\/tr><tr><td><a href=\"https://calce.umd.edu/battery-data\" target=\"_blank\" rel=\"noopener\">CalCE Battery Data（马里兰大学）<\/a><\/td><td>B<\/td><td>✅<\/td><td>公开循环老化 + 存储老化数据（对应本文两条时间轴）<\/td><\/tr><\/tbody><\/table>", "text": " 对应节点 alg-05 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 ｜ 预计用时 45 min 1. \"soh\"至少有三种口径，它们不相等 口径 定义 关心它的人 容量口径 soh_c 当前满容量 c ÷ 出厂额定 c₀ 续航、二手残值 内阻口径 soh_r 当前 r0 ÷ 出厂 r0（常报其倒数或换算百分比） 功率能力、快充 功率口径 可用峰值充/放电功率衰减率 sop、快充体验 同一个电池，三个数字不同、老化速度也不同 （通常容量衰减慢、内阻上涨先显著影响体验）。工程事故高发点：对话双方用同一个词说不同口径。 这正是本项目厂商对比矩阵 维度 1（soh 定义与上报语义） 的本体：同一 uds $22 服务下的 f190/f191 等 did，不同供应商在单位（% vs ah）与刷新机制上分歧，根源就在口径选择与电化学建模假设（见 ../../compare/matrix.md （项目文件 ../../compare/matrix.md） ，该维度证据待补）。 法规落地（2026-11-13 更新，p-79 关闭；2026-11-21 补充 soce，p-80 关闭） ：中国已发布 首个动力电池健康与安全状态评估国标 gb/t 47136-2026《纯电动汽车动力蓄电池健康与安全状态评估规范》，2026-05-01 实施 （ 国家标准全文公开系统 可查，s-66）——soh/sos 的评估方法与结果展示有了国家框架。 另有 gb/t 46991.1-2025《电动汽车车载动力电池耐久性要求及试验 第 1 部分》（2026-07-01 实施，s-83） ：以 soce（电池可用能量状态） 统一耐久性评估——要求 向消费者披露 soce 与虚拟里程 ，且 5 年/10 万公里 soce 应 ≥82%。geely 董事长 2026-11-09 的\"电池寿命危机\"公开表态，正发生在这一法规栈落地后的首个冬天（radar/2026-11-10 #5）。 2. 老化的两条时间轴 循环老化（cycle aging） ：与吞吐电量（累计 ah）、倍率、温度、放电深度（dod）相关。机理名称：锂库存损失（lli, loss of lithium inventory）、活性材料损失（lam, loss of active material）。 日历老化（calendar aging） ：与时间 × 温度 × 平均存储 soc 相关（sei 膜持续生长）。高温 + 高 soc 存放加速。 （机理框架依据 s-16； 具体速率参数随化学体系差异巨大，本课不给通用数值 ——任何\"每月掉 x%\"的说法都必须绑定化学体系与工况才有意义。） 3. 在线估计怎么做：区间法手算实例 示例 （数字为教学示意值，方法为工程通行做法）： 车机记录一次较长行程：出发前经 ocv 锚定 soc=90%，到达后锚定 soc=20%，期间安时积分净放电 62 ah。 区间容量 c ≈ 62 ÷ (0.90 − 0.20) = 88.6 ah 额定 100 ah → soh_c ≈ 88.6% 误差讨论 （这才是工程重点）： 两个 soc 锚点各带 ±2% 误差 → 区间长度 70%±4% → c 的误差约 ±5%； 区间越 长 、锚点越 准 ，结果越好——所以车端用\"多次长行程统计平均\"，而不是单次事件下结论； 若用户从不深放（永远 60~90% 之间用），区间短、锚点弱，车端 soh 收敛很慢——这是真实量产的普遍痛点（工程实践观察）。 其他路线：满充满放标定（准但用户不配合且有老化代价）、基于内阻在线辨识的功率口径估计（双 ekf，见 alg-02 第 6 节）。 4. soh 的下游（为什么它是\"资产的体检报告\"） 续航估算 ：续航 = f(soc, soh_c, 温度, 工况)； sop 收紧 （ alg-06 ）：内阻上涨 → 同样功率下压降更大 → 提前触限； rul 预测 （ alg-09 ）：soh 轨迹外推到阈值 = 剩余寿命； 商业层 ：残值评估、baas 订阅定价、保险——gen-2/arch-ce 的云端价值兑现点； 售后责任判定 （ flt-05 ）：衰减在保修线内还是外，取决于口径与证据链。 5. 常见误区 把 soh 当单一数字引用而不说明口径； 用仪表续航反推 soh（续航受当前温度/工况/标定策略影响太大）； 忽视日历老化：低里程车也会明显老化（时间在走）。 6. 自测 q1 ：一辆车 soh_c=92%，soh_r 显示\"内阻 +25%\"，用户抱怨\"快充变慢\"。哪个口径解释了这个现象？ q2 ：区间法估算中，为什么\"用户从不深放电\"会让 soh 估计变差？ q3 ：两台同型车：a 日常快充 + 常年户外停放（南方）；b 慢充 + 地下车库，里程相近。谁的日历老化更严重？ 答案 q1：内阻/功率口径。快充峰值电流大，压降 i·r0 随 r0 上涨 25% 显著增大，提前触及电压/温度限制 → 降流提前、充电变慢；容量口径 92% 并非主因。 q2：可用区间（soc 锚点间的跨度）短 → c = δah/δsoc 中分母小、锚点误差占比大 → 估计噪声大、收敛慢。 q3：a。日历老化 ∝ 时间 × 温度 × 存储 soc，高温户外停放主导，与里程无关。 来源 s-16：g. plett, battery management systems vol. i（老化机理框架与 soh 定义族） soh 上报语义分歧维度：本项目 compare/matrix.md 维度 1（当前证据待补，关联 p-02/p-03 线索） 延伸资源（链接已于 2026-11-04 联网核实） 资源 级别 免费 说明 yang et al., \"battery state of health estimate strategies: from data acquisition to machine learning\", batteries 9(7):351, 2023 a ✅ 开放获取 soh 估计策略全景综述（从数据采集到机器学习） lei et al., \"a review of lithium-ion battery soh and rul estimation methods based on bibliometric analysis\", green energy &amp; environment , 2024 a ✅ 开放获取 文献计量综述——一张图看清 soh/rul 方法谱系 nasa pcoe li-ion battery aging datasets b ✅ 公开老化数据集，soh/rul 研究的标准数据源之一（动手） calce battery data（马里兰大学） b ✅ 公开循环老化 + 存储老化数据（对应本文两条时间轴） "}, {"id": "ALG-06", "title": "课程 ALG-06：SOP 功率估计——电池\"现在还能给多少\"", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-06<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a>、<a class=\"xlink\" href=\"#/lesson/ALG-02\">ALG-02<\/a>、<a class=\"xlink\" href=\"#/lesson/THM-02\">THM-02<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>；体系沿用 ALG-10/THM-02 的 100 Ah 方形 NCM 示例。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>SOC 告诉司机\"还剩多少电\"，但超车、爬坡、能量回收问的是另一件事：<strong>未来 Δt 秒内电池能给出/收回多少功率？<\/strong>——这就是 SOP（State of Power，功率状态）。<\/p>\n<ul>\n<li>给小了：超车没劲、回收被掐——体验投诉；<\/li>\n<li>给大了：电压击穿下限（过放/析锂）、温度冲破上限——损伤与安全。<\/li>\n<p>GB/T 38661-2020（S-03）对功率状态估计有要求（具体条款待核对，见文末）。它是\"状态 → 能力\"因果链（域六导语）的最后一环：SOC/SOH 是输入，SOP 是输出。<\/p>\n<\/ul>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 约束族：三取最小（放电方向，充电对称，Plett 框架 S-16/S-17）<\/h4>\n<div class=\"math\">I_{max,dis} = \\min\\begin{cases} \\dfrac{OCV(SOC,T) - U_{min}}{R_0(SOC,T,SOH)} &amp; \\text{电压约束}\\\\[2ex] C\\cdot(SOC - SOC_{min})\\cdot\\dfrac{3600}{\\Delta t} &amp; \\text{SOC 存量约束}\\\\[2ex] I_{limit} &amp; \\text{器件/连接器上限}\\end{cases}<\/div>\n<ul>\n<li><strong>U_min<\/strong>：单体放电截止电压（电芯规格书边界）；<\/li>\n<li><strong>R0(SOC,T,SOH)<\/strong>：直流内阻三维查表（ALG-10 辨识）；SOH 维度不能忘——老化后 R 涨、约束收紧；<\/li>\n<li><strong>Δt<\/strong>：SOP 的持续时间档（10 s / 30 s / 1 min / 持续），<strong>同一时刻每个档一个答案<\/strong>；<\/li>\n<li>输出功率：<strong>P = I_max × U_pred<\/strong>，其中 U_pred = OCV − I_max·R0（预测工作点电压）。<\/li>\n<\/ul>\n<h4>2.2 电热耦合（本课题眼）<\/h4>\n<ul>\n<li>R0(T) 低温暴涨 → 电压约束收紧（实例 1）；<\/li>\n<li>大电流 → 产热 Q = I²R（THM-02 的 Bernardi 简化）→ 未来温度变 → 未来 R 变 → 闭环迭代，而非一步算术；<\/li>\n<li>温度上限 T_max 反算\"允许产热\"→ 对电流做<strong>持续时间折减<\/strong>（实例 2）。<\/li>\n<\/ul>\n<h3>3. 手算实例（数字自洽，均为教学示意值）<\/h3>\n<h4>实例 1：电压约束 + 冬夏对比<\/h4>\n<p>电芯 100 Ah，包 96 串；SOC = 20%，U_min = 2.8 V，I_limit = 500 A（示意）。<\/p>\n<p><strong>工况 A（25 °C）<\/strong>：OCV = 3.55 V，R0 = 0.8 mΩ：<\/p>\n<ul>\n<li>电压约束：(3.55 − 2.8)/0.0008 = <strong>937.5 A<\/strong>；SOC 存量（10 s 档）：100×0.15×3600/10 = 5400 A（不构成约束）→ 取 min = <strong>500 A<\/strong>（器件约束卡死）；<\/li>\n<li>U_pred = 3.55 − 500×0.0008 = 3.15 V → P_cell = 500×3.15 = <strong>1575 W<\/strong> → 包级 96×1575 ≈ <strong>151 kW<\/strong>。<\/li>\n<p><strong>工况 B（−10 °C，同 SOC）<\/strong>：R0 ≈ 2.4 mΩ（低温约 3 倍，示意）：<\/p>\n<li>电压约束：0.75/0.0024 = <strong>312.5 A<\/strong>（成为瓶颈）→ U_pred = 3.55 − 0.75 = 2.80 V → P_cell = 312.5×2.8 = <strong>875 W<\/strong> → 包级 ≈ <strong>84 kW<\/strong>。<\/li>\n<p>同 SOC 下冬季功率 −45%——\"冬天动力肉\"的算法根源就在 R0(T)。<\/p>\n<\/ul>\n<h4>实例 2：电热耦合的持续时间折减（夏季爬坡场景）<\/h4>\n<p>25 °C 环境，但连续爬坡已把电芯自热到 45 °C；SOC = 50%，OCV = 3.72 V，R0 = 0.8 mΩ，T_max = 60 °C，C_th = 2000 J/K（对齐 THM-02），Δt = 10 min 档。<\/p>\n<ol>\n<li><strong>温度余量<\/strong>：ΔT_allow = 60 − 45 = 15 K；<\/li>\n<li><strong>允许产热<\/strong>：10 min（600 s）内最多 Q_allow = 15 × 2000 = 30 kJ → 平均 50 W；<\/li>\n<li><strong>热约束电流<\/strong>：I = √(50/0.0008) = <strong>250 A<\/strong>（≈ 2.5C）；<\/li>\n<li><strong>对照另两约束<\/strong>：器件 500 A；SOC 存量：100×0.45×3600/600 = <strong>270 A<\/strong> → 取 min = 250 A，<strong>热是瓶颈<\/strong>；<\/li>\n<li>P_cell = 250 × (3.72 − 250×0.0008) = 250×3.52 = <strong>880 W<\/strong> → 包级 ≈ 84.5 kW；10 min 后温升 50 W×600 s/2000 J/K = 15 K，恰好压线 ✓。<\/li>\n<p><strong>错误对照<\/strong>：若无热模型、按器件 500 A 给 10 min：Q = 200 W×600 s = 120 kJ → ΔT = 60 K → 45 + 60 = 105 °C，冲破上限 45 K——过温保护触发或寿命骤损。<\/p>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产主流：HPPC 标定的 SOP 查表（SOC×温度×脉宽网格，S-26 方法）+ 保守余量系数；高端方案叠加热模型在线迭代预测，并与热管理联动（提前开水泵、向 VCU 请求限功率）；<\/li>\n<li>学术前沿：<strong>AABC 2026 同专场 Trimboli 报告——基于耦合电热模型的有限时域 SOP 优化<\/strong>（P-04 待核对，../../radar/conferences/aabc-2026.md <span class=\"fileref\">（项目文件 ../../radar/conferences/aabc-2026.md）<\/span>）；<\/li>\n<li>包级 SOP = 最弱单体决定（离散度大的老包功率先缩水，衔接 ALG-05/ALG-07）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>用新鲜参数算 SOP——老化后 R0 涨 40% 就意味着电压约束收紧 40%（衔接 ALG-10 自测 Q2）；<\/li>\n<li>忽视持续时间维度——把 10 s 功率当持续功率用（实例 2 的错误对照）；<\/li>\n<li>忽视低温 R0 变化——冬季 SOP 腰斩不是热管理\"不给力\"，是电压约束收紧；<\/li>\n<li>只算单体不算包——最弱单体决定包级能力；<\/li>\n<li>一步算术当闭环——量产实现是\"热模型 + 电压模型在线迭代\"，不是离线查一张死表。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么 10 s 档和 30 min 档的 SOP 瓶颈约束常常不同？ <strong>Q2<\/strong>：工况 B 中电压约束电流缩水的根源是公式里哪个量变了？变化方向是什么？ <strong>Q3<\/strong>：若 SOH 恶化使 R0 从 0.8 涨到 1.2 mΩ（工况 A，其余不变），电压约束电流变为多少？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：短脉冲下 SOC 存量几乎不动、热容也来不及升温（THM-02 实例 3 的绝热段），瓶颈是瞬时电压跳降（R0）与器件上限；长档位下 SOC 会被抽走、产热持续积累，SOC 存量与热约束陆续接管瓶颈。<\/li>\n<li>Q2：R0(SOC,T,SOH)——低温下成倍增大（0.8→2.4 mΩ，示意），分母变大 → 电流上限缩小；OCV 与 U_min 基本未变。<\/li>\n<li>Q3：(3.55−2.8)/0.0012 = <strong>625 A<\/strong> &gt; 500 A，瓶颈交还给器件上限 500 A——但 U_pred = 3.55−0.60 = 2.95 V，P_cell = 1475 W，包级功率仍下降。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. II（SOP 多约束框架）；S-17：Plett 2004 系列论文（估计框架）<\/li>\n<li>S-26：INL《FreedomCAR Battery Test Manual》(2014)（HPPC 功率测试方法）<\/li>\n<li>S-03：GB/T 38661-2020（功率状态要求，条款待核对）<\/li>\n<li>P-04：AABC 2026 Trimboli 报告线索（待核对）<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>INL《FreedomCAR Battery Test Manual》（S-26，公开 PDF）<\/td><td>A<\/td><td>HPPC 脉冲功率测试权威程序<\/td><\/tr><tr><td>G. Plett《Battery Management Systems》Vol. II（S-16）<\/td><td>B<\/td><td>SOP 计算的教材级展开<\/td><\/tr><tr><td>GB/T 38661-2020 原文（S-03）<\/td><td>A<\/td><td>功率状态估计要求<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>AABC 2026 Trimboli 电热耦合 SOP 报告材料（会后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 中 SOP 估计的具体条款与精度数值<\/li>\n<li>低温 R0 放大倍数（本课 3 倍为示意）的文献/规格书佐证<\/li>\n<li>量产 SOP 档位划分（10 s/30 s/1 min/持续）与余量系数的行业惯例<\/li>\n<li>电热耦合 SOP 在量产项目的落地案例（区别于查表法）<\/li>\n<\/ul>", "text": " 对应节点 alg-06 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-10 、 alg-02 、 thm-02 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ；体系沿用 alg-10/thm-02 的 100 ah 方形 ncm 示例。 1. 为什么需要它 soc 告诉司机\"还剩多少电\"，但超车、爬坡、能量回收问的是另一件事： 未来 δt 秒内电池能给出/收回多少功率？ ——这就是 sop（state of power，功率状态）。 给小了：超车没劲、回收被掐——体验投诉； 给大了：电压击穿下限（过放/析锂）、温度冲破上限——损伤与安全。 gb/t 38661-2020（s-03）对功率状态估计有要求（具体条款待核对，见文末）。它是\"状态 → 能力\"因果链（域六导语）的最后一环：soc/soh 是输入，sop 是输出。 2. 机制展开 2.1 约束族：三取最小（放电方向，充电对称，plett 框架 s-16/s-17） i_{max,dis} = \\min\\begin{cases} \\dfrac{ocv(soc,t) - u_{min}}{r_0(soc,t,soh)} &amp; \\text{电压约束}\\\\[2ex] c\\cdot(soc - soc_{min})\\cdot\\dfrac{3600}{\\delta t} &amp; \\text{soc 存量约束}\\\\[2ex] i_{limit} &amp; \\text{器件/连接器上限}\\end{cases} u_min ：单体放电截止电压（电芯规格书边界）； r0(soc,t,soh) ：直流内阻三维查表（alg-10 辨识）；soh 维度不能忘——老化后 r 涨、约束收紧； δt ：sop 的持续时间档（10 s / 30 s / 1 min / 持续）， 同一时刻每个档一个答案 ； 输出功率： p = i_max × u_pred ，其中 u_pred = ocv − i_max·r0（预测工作点电压）。 2.2 电热耦合（本课题眼） r0(t) 低温暴涨 → 电压约束收紧（实例 1）； 大电流 → 产热 q = i²r（thm-02 的 bernardi 简化）→ 未来温度变 → 未来 r 变 → 闭环迭代，而非一步算术； 温度上限 t_max 反算\"允许产热\"→ 对电流做 持续时间折减 （实例 2）。 3. 手算实例（数字自洽，均为教学示意值） 实例 1：电压约束 + 冬夏对比 电芯 100 ah，包 96 串；soc = 20%，u_min = 2.8 v，i_limit = 500 a（示意）。 工况 a（25 °c） ：ocv = 3.55 v，r0 = 0.8 mω： 电压约束：(3.55 − 2.8)/0.0008 = 937.5 a ；soc 存量（10 s 档）：100×0.15×3600/10 = 5400 a（不构成约束）→ 取 min = 500 a （器件约束卡死）； u_pred = 3.55 − 500×0.0008 = 3.15 v → p_cell = 500×3.15 = 1575 w → 包级 96×1575 ≈ 151 kw 。 工况 b（−10 °c，同 soc） ：r0 ≈ 2.4 mω（低温约 3 倍，示意）： 电压约束：0.75/0.0024 = 312.5 a （成为瓶颈）→ u_pred = 3.55 − 0.75 = 2.80 v → p_cell = 312.5×2.8 = 875 w → 包级 ≈ 84 kw 。 同 soc 下冬季功率 −45%——\"冬天动力肉\"的算法根源就在 r0(t)。 实例 2：电热耦合的持续时间折减（夏季爬坡场景） 25 °c 环境，但连续爬坡已把电芯自热到 45 °c；soc = 50%，ocv = 3.72 v，r0 = 0.8 mω，t_max = 60 °c，c_th = 2000 j/k（对齐 thm-02），δt = 10 min 档。 温度余量 ：δt_allow = 60 − 45 = 15 k； 允许产热 ：10 min（600 s）内最多 q_allow = 15 × 2000 = 30 kj → 平均 50 w； 热约束电流 ：i = √(50/0.0008) = 250 a （≈ 2.5c）； 对照另两约束 ：器件 500 a；soc 存量：100×0.45×3600/600 = 270 a → 取 min = 250 a， 热是瓶颈 ； p_cell = 250 × (3.72 − 250×0.0008) = 250×3.52 = 880 w → 包级 ≈ 84.5 kw；10 min 后温升 50 w×600 s/2000 j/k = 15 k，恰好压线 ✓。 错误对照 ：若无热模型、按器件 500 a 给 10 min：q = 200 w×600 s = 120 kj → δt = 60 k → 45 + 60 = 105 °c，冲破上限 45 k——过温保护触发或寿命骤损。 4. 工程实态 量产主流：hppc 标定的 sop 查表（soc×温度×脉宽网格，s-26 方法）+ 保守余量系数；高端方案叠加热模型在线迭代预测，并与热管理联动（提前开水泵、向 vcu 请求限功率）； 学术前沿： aabc 2026 同专场 trimboli 报告——基于耦合电热模型的有限时域 sop 优化 （p-04 待核对，../../radar/conferences/aabc-2026.md （项目文件 ../../radar/conferences/aabc-2026.md） ）； 包级 sop = 最弱单体决定（离散度大的老包功率先缩水，衔接 alg-05/alg-07）。 5. 常见误区 用新鲜参数算 sop——老化后 r0 涨 40% 就意味着电压约束收紧 40%（衔接 alg-10 自测 q2）； 忽视持续时间维度——把 10 s 功率当持续功率用（实例 2 的错误对照）； 忽视低温 r0 变化——冬季 sop 腰斩不是热管理\"不给力\"，是电压约束收紧； 只算单体不算包——最弱单体决定包级能力； 一步算术当闭环——量产实现是\"热模型 + 电压模型在线迭代\"，不是离线查一张死表。 6. 自测 q1 ：为什么 10 s 档和 30 min 档的 sop 瓶颈约束常常不同？ q2 ：工况 b 中电压约束电流缩水的根源是公式里哪个量变了？变化方向是什么？ q3 ：若 soh 恶化使 r0 从 0.8 涨到 1.2 mω（工况 a，其余不变），电压约束电流变为多少？ 答案 q1：短脉冲下 soc 存量几乎不动、热容也来不及升温（thm-02 实例 3 的绝热段），瓶颈是瞬时电压跳降（r0）与器件上限；长档位下 soc 会被抽走、产热持续积累，soc 存量与热约束陆续接管瓶颈。 q2：r0(soc,t,soh)——低温下成倍增大（0.8→2.4 mω，示意），分母变大 → 电流上限缩小；ocv 与 u_min 基本未变。 q3：(3.55−2.8)/0.0012 = 625 a &gt; 500 a，瓶颈交还给器件上限 500 a——但 u_pred = 3.55−0.60 = 2.95 v，p_cell = 1475 w，包级功率仍下降。 来源 s-16：g. plett, battery management systems vol. ii（sop 多约束框架）；s-17：plett 2004 系列论文（估计框架） s-26：inl《freedomcar battery test manual》(2014)（hppc 功率测试方法） s-03：gb/t 38661-2020（功率状态要求，条款待核对） p-04：aabc 2026 trimboli 报告线索（待核对） 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 inl《freedomcar battery test manual》（s-26，公开 pdf） a hppc 脉冲功率测试权威程序 g. plett《battery management systems》vol. ii（s-16） b sop 计算的教材级展开 gb/t 38661-2020 原文（s-03） a 功率状态估计要求 [待补链] — aabc 2026 trimboli 电热耦合 sop 报告材料（会后补） 待核对项（本课） gb/t 38661-2020 中 sop 估计的具体条款与精度数值 低温 r0 放大倍数（本课 3 倍为示意）的文献/规格书佐证 量产 sop 档位划分（10 s/30 s/1 min/持续）与余量系数的行业惯例 电热耦合 sop 在量产项目的落地案例（区别于查表法） "}, {"id": "ALG-07", "title": "课程 ALG-07：均衡策略——给串联电池组\"削峰\"的艺术", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-07<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>、<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>串联电池组是木桶：<strong>充电时<\/strong>电压最高的单体先撞上限，整组被迫停充；<strong>放电时<\/strong>电压最低的单体先撞下限，整组被迫趴窝。可用容量 = 最高单体与最低单体之间的窗口——不一致越严重，被\"夹掉\"的容量越多。<\/p>\n<p>不一致的来源（随时间必然生长）：单体容量出厂离散、自放电率差异、温度梯度（<a class=\"xlink\" href=\"#/lesson/THM-01\">THM-01<\/a>——靠近热源的单体老得快、自放电大）、老化离散（<a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）。<\/p>\n<p>均衡（balancing）就是用受控的小电流把单体间的 SOC 差异往回拉。GB/T 38661-2020（S-03）对均衡功能有要求（具体条款待核对）。<\/p>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 两条技术路线<\/h4>\n<table><thead><tr><th>路线<\/th><th>原理<\/th><th>能力<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td><strong>被动均衡<\/strong><\/td><td>AFE 内置开关 + 电阻，把<strong>高<\/strong> SOC 单体的电荷泄放成热（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>）<\/td><td>只能\"削峰\"不能\"填谷\"；电流小（几十~两百 mA 量级，示意）<\/td><td>零附加成本（AFE 集成）、热可控——<strong>量产主流<\/strong><\/td><\/tr><tr><td><strong>主动均衡<\/strong><\/td><td>电容/电感/变压器把电荷从高单体<strong>搬<\/strong>到低单体<\/td><td>可填谷、效率高、电流可大<\/td><td>成本/体积/故障点增加——量产渗透率低（工程观点），多见于储能与梯次（<a class=\"xlink\" href=\"#/lesson/CHM-04\">CHM-04<\/a>）<\/td><\/tr><\/tbody><\/table>\n<p>被动均衡的\"填谷\"是间接的：充电过程中把高单体边充边泄，低单体得以继续充——相当于用时间换容量。<\/p>\n<h4>2.2 均衡依据：看电压还是看 SOC（节点约束：依据影响收敛）<\/h4>\n<ul>\n<li><strong>电压均衡<\/strong>：简单可靠，但 LFP 平台段电压不反映 SOC（ALG-01）——按电压均衡可能削错对象；<\/li>\n<li><strong>SOC 均衡<\/strong>：按各单体估计 SOC 差做判据——前提是单体级 SOC 估计可信（ALG-01/02）；<\/li>\n<li><strong>满充端均衡<\/strong>：只在充电末端（电压斜率大、信息量足）开均衡——LFP 体系的主流折中。<\/li>\n<\/ul>\n<h4>2.3 均衡时机<\/h4>\n<p>充电末端（信息最好）、静置后（OCV 可用）、周期性持续（补偿自放电差异）。<\/p>\n<h3>3. 手算实例（数字自洽，均为教学示意值）<\/h3>\n<h4>实例 1：被动均衡时间估算——\"靠时间换容量\"<\/h4>\n<p>280 Ah LFP 方形包，最高/最低单体 SOC 差 5%：ΔC = 280 × 0.05 = <strong>14 Ah<\/strong>。<\/p>\n<p>被动均衡电流 100 mA，每晚充电后挂均衡 4 h：0.1 × 4 = 0.4 Ah/晚 → 14 ÷ 0.4 = <strong>35 晚 ≈ 5 周<\/strong>。<\/p>\n<p>对照：若想一晚清零，需要 14 Ah ÷ 4 h = <strong>3.5 A<\/strong>——这就是\"均衡电流小、靠时间换容量\"的算术本质。<\/p>\n<h4>实例 2：为什么被动均衡电流做不大（热账）<\/h4>\n<p>AFE 集成均衡电阻 R_bal = 30 Ω（示意）接单体 3.4 V（LFP 中段）：I = 3.4/30 ≈ <strong>113 mA<\/strong>，单通道功耗 P = 3.4 × 0.113 ≈ <strong>0.39 W<\/strong>。一块 16 通道采样板若同时全开 ≈ 6.2 W——板温显著上升，热设计不答应。<\/p>\n<p>外置方案若提到 1 A/单体：3.4 W × 同时均衡的 20 个单体 = <strong>68 W<\/strong> 集中在采样板上——这就是大电流均衡必须走主动方案（磁性元件搬运而非电阻烧掉）的原因。<\/p>\n<h4>实例 3：LFP 平台段的\"越均衡越歪\"<\/h4>\n<p>平台段（约 30~70% SOC，示意）20 mV 的电压差可能对应 10% 以上的 SOC 差（示意，关联 P-14）。若按电压\"削峰\"，BMS 会把平台段里<strong>其实 SOC 最低<\/strong>的单体当成最高去泄放——越均衡偏差越大。对策：LFP 只在满充端（斜率陡峭区）做电压判据均衡。<\/p>\n<h4>实例 4：自放电差异的持续补偿<\/h4>\n<p>月自放电差异 2%（示意）→ 每天差 5.6/30 ≈ 0.19 Ah；实例 1 的 0.4 Ah/晚 &gt; 0.19 Ah → 每晚挂 4 h 足以追平——说明\"持续/周期均衡\"防的是日常发散，而不是修复大差异（大差异要靠充电末端长时间挂）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产主流组合：<strong>被动均衡 + 充电末端/静置时机 + 满充端电压判据（LFP）或 SOC 判据（NCM）<\/strong>；<\/li>\n<li>均衡通道由 AFE 驱动，均衡开关管本身是故障点——AFE 自检覆盖（HW-01）；<\/li>\n<li>均衡策略是标定对象（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）：电流/时机/判据三参数与热设计、充电策略联动；<\/li>\n<li>主动均衡在储能电站、梯次利用包（CHM-04）中更常见——那里均衡收益直接折现。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"均衡电流越大越好\"——热账（实例 2）决定上限，被动路线的电流天花板是结构性的；<\/li>\n<li>\"均衡能消除容量不一致\"——它只对齐 SOC/端点，容量差异本身无法用均衡修复；<\/li>\n<li>LFP 平台段按电压均衡（实例 3）——削错对象，越做越歪；<\/li>\n<li>\"均衡一年到头常开\"——补自放电差异只需小电流周期挂，常开白白加热采样板；<\/li>\n<li>忽视均衡通道失效——通道粘连/断路会制造新的一致性问题，需要自检覆盖。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么说被动均衡\"只能削峰、不能填谷\"？它如何间接实现\"填谷\"效果？ <strong>Q2<\/strong>：280 Ah 包、被动 100 mA、每晚 4 h：修复 8% 的单体 SOC 差需要多少天？ <strong>Q3<\/strong>：一块 NCM 包用了 LFP 式\"全程电压均衡\"，会出现什么问题？（提示：NCM 全程斜率可观，但还有一个量被忽略了）<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：被动均衡只能用电阻耗散把高 SOC 单体往下拉，无法给低单体充电；间接效果发生在充电时——高单体被边充边泄，低单体获得相对更长的净充电时间，从而\"追上\"。<\/li>\n<li>Q2：ΔC = 280×0.08 = 22.4 Ah；0.4 Ah/晚 → 22.4/0.4 = <strong>56 晚 = 8 周<\/strong>。<\/li>\n<li>Q3：NCM 斜率全程可观，电压判据方向性没问题；被忽略的是<strong>电压差 ≠ SOC 差<\/strong>的定量换算随温度与老化漂移，且均衡时机若覆盖行车段，欧姆压降（IR，随电流波动）会污染判据——大电流放电时高倍率单体电压反而最低，会被误均衡。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（均衡功能要求，条款待核对）<\/li>\n<li>S-34：TI 电量计应用手册（Impedance Track 体系内含均衡工程实现，均衡章节内容待核对）<\/li>\n<li>S-16：串联组一致性问题框架（Plett 专著，均衡章节位置待核对）<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 原文（S-03）<\/td><td>A<\/td><td>均衡功能的产品级要求<\/td><\/tr><tr><td>TI 电池均衡系列应用手册（ti.com/lit 检索 \"cell balancing\"）<\/td><td>A<\/td><td>厂商官方工程实现文档（具体编号 [待补链]）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>被动/主动均衡拓扑综述（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>量产被动均衡电流的典型区间（几十~两百 mA 为示意量级）<\/li>\n<li>GB/T 38661-2020 均衡功能条款原文<\/li>\n<li>TI 均衡应用手册的准确标题与编号<\/li>\n<li>主动均衡在乘用车量产项目中的公开案例<\/li>\n<\/ul>", "text": " 对应节点 alg-07 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-01 、 hw-01 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 串联电池组是木桶： 充电时 电压最高的单体先撞上限，整组被迫停充； 放电时 电压最低的单体先撞下限，整组被迫趴窝。可用容量 = 最高单体与最低单体之间的窗口——不一致越严重，被\"夹掉\"的容量越多。 不一致的来源（随时间必然生长）：单体容量出厂离散、自放电率差异、温度梯度（ thm-01 ——靠近热源的单体老得快、自放电大）、老化离散（ alg-05 ）。 均衡（balancing）就是用受控的小电流把单体间的 soc 差异往回拉。gb/t 38661-2020（s-03）对均衡功能有要求（具体条款待核对）。 2. 机制展开 2.1 两条技术路线 路线 原理 能力 代价 被动均衡 afe 内置开关 + 电阻，把 高 soc 单体的电荷泄放成热（ hw-01 ） 只能\"削峰\"不能\"填谷\"；电流小（几十~两百 ma 量级，示意） 零附加成本（afe 集成）、热可控—— 量产主流 主动均衡 电容/电感/变压器把电荷从高单体 搬 到低单体 可填谷、效率高、电流可大 成本/体积/故障点增加——量产渗透率低（工程观点），多见于储能与梯次（ chm-04 ） 被动均衡的\"填谷\"是间接的：充电过程中把高单体边充边泄，低单体得以继续充——相当于用时间换容量。 2.2 均衡依据：看电压还是看 soc（节点约束：依据影响收敛） 电压均衡 ：简单可靠，但 lfp 平台段电压不反映 soc（alg-01）——按电压均衡可能削错对象； soc 均衡 ：按各单体估计 soc 差做判据——前提是单体级 soc 估计可信（alg-01/02）； 满充端均衡 ：只在充电末端（电压斜率大、信息量足）开均衡——lfp 体系的主流折中。 2.3 均衡时机 充电末端（信息最好）、静置后（ocv 可用）、周期性持续（补偿自放电差异）。 3. 手算实例（数字自洽，均为教学示意值） 实例 1：被动均衡时间估算——\"靠时间换容量\" 280 ah lfp 方形包，最高/最低单体 soc 差 5%：δc = 280 × 0.05 = 14 ah 。 被动均衡电流 100 ma，每晚充电后挂均衡 4 h：0.1 × 4 = 0.4 ah/晚 → 14 ÷ 0.4 = 35 晚 ≈ 5 周 。 对照：若想一晚清零，需要 14 ah ÷ 4 h = 3.5 a ——这就是\"均衡电流小、靠时间换容量\"的算术本质。 实例 2：为什么被动均衡电流做不大（热账） afe 集成均衡电阻 r_bal = 30 ω（示意）接单体 3.4 v（lfp 中段）：i = 3.4/30 ≈ 113 ma ，单通道功耗 p = 3.4 × 0.113 ≈ 0.39 w 。一块 16 通道采样板若同时全开 ≈ 6.2 w——板温显著上升，热设计不答应。 外置方案若提到 1 a/单体：3.4 w × 同时均衡的 20 个单体 = 68 w 集中在采样板上——这就是大电流均衡必须走主动方案（磁性元件搬运而非电阻烧掉）的原因。 实例 3：lfp 平台段的\"越均衡越歪\" 平台段（约 30~70% soc，示意）20 mv 的电压差可能对应 10% 以上的 soc 差（示意，关联 p-14）。若按电压\"削峰\"，bms 会把平台段里 其实 soc 最低 的单体当成最高去泄放——越均衡偏差越大。对策：lfp 只在满充端（斜率陡峭区）做电压判据均衡。 实例 4：自放电差异的持续补偿 月自放电差异 2%（示意）→ 每天差 5.6/30 ≈ 0.19 ah；实例 1 的 0.4 ah/晚 &gt; 0.19 ah → 每晚挂 4 h 足以追平——说明\"持续/周期均衡\"防的是日常发散，而不是修复大差异（大差异要靠充电末端长时间挂）。 4. 工程实态 量产主流组合： 被动均衡 + 充电末端/静置时机 + 满充端电压判据（lfp）或 soc 判据（ncm） ； 均衡通道由 afe 驱动，均衡开关管本身是故障点——afe 自检覆盖（hw-01）； 均衡策略是标定对象（ sw-05 ）：电流/时机/判据三参数与热设计、充电策略联动； 主动均衡在储能电站、梯次利用包（chm-04）中更常见——那里均衡收益直接折现。 5. 常见误区 \"均衡电流越大越好\"——热账（实例 2）决定上限，被动路线的电流天花板是结构性的； \"均衡能消除容量不一致\"——它只对齐 soc/端点，容量差异本身无法用均衡修复； lfp 平台段按电压均衡（实例 3）——削错对象，越做越歪； \"均衡一年到头常开\"——补自放电差异只需小电流周期挂，常开白白加热采样板； 忽视均衡通道失效——通道粘连/断路会制造新的一致性问题，需要自检覆盖。 6. 自测 q1 ：为什么说被动均衡\"只能削峰、不能填谷\"？它如何间接实现\"填谷\"效果？ q2 ：280 ah 包、被动 100 ma、每晚 4 h：修复 8% 的单体 soc 差需要多少天？ q3 ：一块 ncm 包用了 lfp 式\"全程电压均衡\"，会出现什么问题？（提示：ncm 全程斜率可观，但还有一个量被忽略了） 答案 q1：被动均衡只能用电阻耗散把高 soc 单体往下拉，无法给低单体充电；间接效果发生在充电时——高单体被边充边泄，低单体获得相对更长的净充电时间，从而\"追上\"。 q2：δc = 280×0.08 = 22.4 ah；0.4 ah/晚 → 22.4/0.4 = 56 晚 = 8 周 。 q3：ncm 斜率全程可观，电压判据方向性没问题；被忽略的是 电压差 ≠ soc 差 的定量换算随温度与老化漂移，且均衡时机若覆盖行车段，欧姆压降（ir，随电流波动）会污染判据——大电流放电时高倍率单体电压反而最低，会被误均衡。 来源 s-03：gb/t 38661-2020（均衡功能要求，条款待核对） s-34：ti 电量计应用手册（impedance track 体系内含均衡工程实现，均衡章节内容待核对） s-16：串联组一致性问题框架（plett 专著，均衡章节位置待核对） 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb/t 38661-2020 原文（s-03） a 均衡功能的产品级要求 ti 电池均衡系列应用手册（ti.com/lit 检索 \"cell balancing\"） a 厂商官方工程实现文档（具体编号 [待补链]） [待补链] — 被动/主动均衡拓扑综述（核实后补） 待核对项（本课） 量产被动均衡电流的典型区间（几十~两百 ma 为示意量级） gb/t 38661-2020 均衡功能条款原文 ti 均衡应用手册的准确标题与编号 主动均衡在乘用车量产项目中的公开案例 "}, {"id": "ALG-08", "title": "课程 ALG-08：故障诊断算法——从\"越限报警\"到\"看出病来\"", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-08<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a>、<a class=\"xlink\" href=\"#/lesson/FLT-01\">FLT-01<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p><a class=\"xlink\" href=\"#/lesson/FLT-01\">FLT-01<\/a> 的阈值矩阵是\"急诊科\"：电压/温度/电流越限就报警。但它只能抓<strong>已经显形<\/strong>的病。三类高危故障是\"慢病\"——参数悄悄变坏，等到越限已经晚了：<\/p>\n<ol>\n<li><strong>内短路（软短路）<\/strong>：单体自放电异常加速，前期只是\"掉电快一点\"；<\/li>\n<li><strong>连接松动<\/strong>：极柱电阻缓慢上涨，前期只是\"压差大一点\"；<\/li>\n<li><strong>传感器漂移<\/strong>：采样通道温漂/零漂，测量本身在说谎。<\/li>\n<p>诊断算法的分工：<strong>用模型残差与参数辨识在越限之前发现异常<\/strong>。误报的代价是工单与召回（<a class=\"xlink\" href=\"#/lesson/FLT-06\">FLT-06<\/a>），漏报的代价是安全事故——节点约束\"误报率与漏报率需平衡\"就是这个天平。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 残差诊断三部曲（模型法主干）<\/h4>\n<ol>\n<li><strong>残差生成<\/strong>：r_k = U_meas,k − U_pred,k。U_pred 来自 ECM + 状态估计（ALG-10/02 的模型）。健康电池的 r 在噪声带内游走；<\/li>\n<li><strong>残差评价<\/strong>：滑动窗口统计检验（均值偏移 / 3σ 准则），绝不用单帧——FLT-01 的\"防抖三件套\"这里是统计版；<\/li>\n<li><strong>故障隔离<\/strong>：定位是哪个单体还是哪路传感器。判别逻辑（示意）：某单体残差异常而<strong>相邻单体差分<\/strong>（ΔU）正常 → 更可能是该路采样链问题；差分同样异常 → 更可能是电芯本体问题。<\/li>\n<\/ol>\n<h4>2.2 参数漂移诊断<\/h4>\n<ul>\n<li>周期性在线辨识 R0（ALG-10 方法在车上低频复跑）→ <strong>趋势<\/strong>（老化，缓）与<strong>突变<\/strong>（连接松动/析锂，快）分离；<\/li>\n<li><strong>自放电一致性<\/strong>：静置段比较各单体 dV/dt 的离散度 → 软短路筛查（实例 1）；<\/li>\n<li>内短路的电-热交叉证据：电压异常 + 该单体局部温升（<a class=\"xlink\" href=\"#/lesson/THM-05\">THM-05<\/a> 是本课的安全深化版）。<\/li>\n<\/ul>\n<h4>2.3 数据驱动补充<\/h4>\n<p>把残差/特征序列喂分类器（正常/内短路/传感器漂移/连接松动）。难点同 <a class=\"xlink\" href=\"#/lesson/ALG-03\">ALG-03<\/a>：故障标签稀缺（靠售后拆解与台架复现积累，<a class=\"xlink\" href=\"#/lesson/DEV-06\">DEV-06<\/a> 数据闭环供料）、分布外泛化无保证。<\/p>\n<h3>3. 手算实例（数字自洽，均为教学示意值）<\/h3>\n<h4>实例 1：静置自放电筛查内短路<\/h4>\n<p>NCM 包（100 Ah/单体）静置过夜 12 h：单体 A 电压降 8 mV，其余单体平均降 2 mV；该 SOC 点 dOCV/dSOC = 2 mV/%（与 ALG-02 同量级）。<\/p>\n<ul>\n<li>换算：A 的 ΔSOC = 8/2 = 4%，其余 ≈ 1%；<\/li>\n<li>自放电电流：A ≈ 4%×100 Ah/12 h = <strong>0.333 A<\/strong>；其余 ≈ 0.083 A；<\/li>\n<li><strong>异常漏电流<\/strong> ≈ 0.333 − 0.083 = 0.25 A → 等效并联内短路电阻 R_iscr = 3.7 V/0.25 A ≈ <strong>14.8 kΩ<\/strong>；<\/li>\n<li>判据（示意）：异常自放电 &gt; 3 × 组内中位数 → 标记\"软短路疑似\" → 叠加温升证据升级处理（FLT-01 分级承接）。<\/li>\n<\/ul>\n<h4>实例 2：残差窗口的 3σ 检验<\/h4>\n<p>健康段残差统计：均值 ≈ 0，σ = 3 mV（示意）。某 500 帧滑动窗口残差均值 = +11 mV：<\/p>\n<ul>\n<li>单帧看：11 mV ≈ 3.7σ，偶发尚可解释；<\/li>\n<li>窗口看：均值的标准误 = σ/√N = 3/√500 ≈ <strong>0.13 mV<\/strong> → 11 mV ≈ 82 个标准误 → <strong>系统性偏移实锤<\/strong>；<\/li>\n<li>结论：单帧残差是噪声，窗口统计才是诊断——同一条数据，问法不同，结论完全不同。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产主力仍是阈值矩阵（FLT-01）+ 少量一致性诊断（压差/温差/自放电分组统计）；<\/li>\n<li>模型残差诊断在高端车型与云端（<a class=\"xlink\" href=\"#/lesson/GEN-2\">GEN-2<\/a>）逐步落地：云端算力充裕、可跑更复杂的模型与统计；<\/li>\n<li>诊断结论<strong>不能直接跳闸<\/strong>——必须走 FLT-01 的分级链条与 ISO 26262（S-07）的诊断覆盖要求；<\/li>\n<li>GB 38031（S-01/S-02）的热扩散要求使\"内短路早期发现\"成为安全链条的上游课题。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把模型失配当故障——参数未随老化/低温更新，残差全包飘红（先修模型再谈诊断，ALG-10）；<\/li>\n<li>单帧残差定罪——实例 2 展示的噪声陷阱；<\/li>\n<li>内短路只看电压——必须电-热交叉验证，单一证据链不足以支撑重动作；<\/li>\n<li>诊断结果绕过分级直接断高压——诊断是\"发现\"，处置要过 FLT-01 的动作绑定与 FTTI 预算（<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a>）；<\/li>\n<li>数据驱动诊断拿正常数据训练就敢上线——故障类样本稀缺时，分类器的\"正常\"判决不可信。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：残差诊断中，\"单体外电压残差异常但相邻单体差分正常\"指向什么？为什么？ <strong>Q2<\/strong>：实例 1 中若 dOCV/dSOC = 0.1 mV/%（LFP 平台段），同样 8 mV 压降意味着什么？说明什么工程难点？ <strong>Q3<\/strong>：为什么诊断算法强调\"窗口统计\"而不是\"单帧阈值\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：指向该路采样链（线束/连接器/AFE 通道）故障。差分正常说明两单体真实的相对状态没变——只有\"测量\"这一侧在说谎；若电芯本体劣化，与邻居的差分也会异常。<\/li>\n<li>Q2：ΔSOC = 8/0.1 = 80%——荒谬的数字，说明平台段 dOCV/dSOC≈0 时\"电压差→SOC\"换算完全失效，自放电筛查失去分辨率。这是 LFP 包做内短路筛查的固有难点：只能靠更长的静置窗口、库仑差或外部证据补偿。<\/li>\n<li>Q3：单帧残差被测量噪声与工况瞬态污染，误报率不可控；窗口统计把随机噪声平均掉（标准误 ∝ σ/√N），系统性偏移才浮出——本质是把\"防抖\"从时域搬进统计域。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. II（残差与参数估计方法框架）<\/li>\n<li>S-07：ISO 26262:2018（诊断覆盖与安全机制衔接）<\/li>\n<li>S-01 / S-02：GB 38031-2025 / 2020（热扩散安全要求背景；P-05 已于 11-16 核实要点）<\/li>\n<li>S-89：内短路（ISC）检测文献群——Shen et al. 2025 <em>Applied Energy<\/em>（SCR 度量与分级）、Naha et al. 2020 <em>Scientific Reports<\/em>（实时 ML 检测）、Jia et al. 2023 PHM Society（BMS 集成早期检测）（2026-11-22 登记）<\/li>\n<li>S-21 / S-23：AI/ML 在 BMS 诊断中的应用综述（背景级引用，注意 S-23 期刊声誉备注）<\/li>\n<li>本课全部数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>G. Plett《Battery Management Systems》Vol. II（S-16）<\/td><td>B<\/td><td>残差诊断与参数估计的教材基础<\/td><\/tr><tr><td>ISO 26262:2018 原文（S-07）<\/td><td>A<\/td><td>诊断覆盖率的规范语境<\/td><\/tr><tr><td>GB 38031-2025 原文（S-01）<\/td><td>A<\/td><td>热扩散与内短路安全要求<\/td><\/tr><tr><td><a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0306261925015272\" target=\"_blank\" rel=\"noopener\">Shen et al., <em>Applied Energy<\/em> (2025)：基于 SCR 的电池包 ISC 诊断<\/a><\/td><td>A<\/td><td>摘要免费<\/td><td>SCR 为 ISC 严重度标准度量（S-89）<\/td><\/tr><tr><td><a href=\"https://www.nature.com/articles/s41598-020-58021-7\" target=\"_blank\" rel=\"noopener\">Naha et al., <em>Scientific Reports<\/em> (2020)：实时 ML 内短路检测<\/a><\/td><td>A<\/td><td>✅ 开放获取<\/td><td>电压/电流特征的实时检测（202+ 引用，S-89）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>基于模型的电池故障诊断（model-based FDI）公开文献<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>量产 BMS 内短路筛查判据（自放电倍数阈值/静置时长要求）的公开资料<\/li>\n<li>~~R_iscr 等效电阻分级的文献划分~~ → <strong>2026-11-22 部分核实<\/strong>（S-89）：文献口径硬短路 &lt;10~20 mΩ（近即时 TR 风险）、软短路 &gt;1 kΩ（慢自放电/SOC 漂移）；量产筛查判据仍待企业标准资料<\/li>\n<li>云端故障诊断在量产项目的落地案例（GEN-2 关联）<\/li>\n<li>S-23 综述中诊断部分的可用性（期刊声誉争议备注生效中）<\/li>\n<\/ul>", "text": " 对应节点 alg-08 （../domains/06-核心算法.md （项目文件 ../domains/06-核心算法.md） ）｜ 前置： alg-10 、 flt-01 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要它 flt-01 的阈值矩阵是\"急诊科\"：电压/温度/电流越限就报警。但它只能抓 已经显形 的病。三类高危故障是\"慢病\"——参数悄悄变坏，等到越限已经晚了： 内短路（软短路） ：单体自放电异常加速，前期只是\"掉电快一点\"； 连接松动 ：极柱电阻缓慢上涨，前期只是\"压差大一点\"； 传感器漂移 ：采样通道温漂/零漂，测量本身在说谎。 诊断算法的分工： 用模型残差与参数辨识在越限之前发现异常 。误报的代价是工单与召回（ flt-06 ），漏报的代价是安全事故——节点约束\"误报率与漏报率需平衡\"就是这个天平。 2. 机制展开 2.1 残差诊断三部曲（模型法主干） 残差生成 ：r_k = u_meas,k − u_pred,k。u_pred 来自 ecm + 状态估计（alg-10/02 的模型）。健康电池的 r 在噪声带内游走； 残差评价 ：滑动窗口统计检验（均值偏移 / 3σ 准则），绝不用单帧——flt-01 的\"防抖三件套\"这里是统计版； 故障隔离 ：定位是哪个单体还是哪路传感器。判别逻辑（示意）：某单体残差异常而 相邻单体差分 （δu）正常 → 更可能是该路采样链问题；差分同样异常 → 更可能是电芯本体问题。 2.2 参数漂移诊断 周期性在线辨识 r0（alg-10 方法在车上低频复跑）→ 趋势 （老化，缓）与 突变 （连接松动/析锂，快）分离； 自放电一致性 ：静置段比较各单体 dv/dt 的离散度 → 软短路筛查（实例 1）； 内短路的电-热交叉证据：电压异常 + 该单体局部温升（ thm-05 是本课的安全深化版）。 2.3 数据驱动补充 把残差/特征序列喂分类器（正常/内短路/传感器漂移/连接松动）。难点同 alg-03 ：故障标签稀缺（靠售后拆解与台架复现积累， dev-06 数据闭环供料）、分布外泛化无保证。 3. 手算实例（数字自洽，均为教学示意值） 实例 1：静置自放电筛查内短路 ncm 包（100 ah/单体）静置过夜 12 h：单体 a 电压降 8 mv，其余单体平均降 2 mv；该 soc 点 docv/dsoc = 2 mv/%（与 alg-02 同量级）。 换算：a 的 δsoc = 8/2 = 4%，其余 ≈ 1%； 自放电电流：a ≈ 4%×100 ah/12 h = 0.333 a ；其余 ≈ 0.083 a； 异常漏电流 ≈ 0.333 − 0.083 = 0.25 a → 等效并联内短路电阻 r_iscr = 3.7 v/0.25 a ≈ 14.8 kω ； 判据（示意）：异常自放电 &gt; 3 × 组内中位数 → 标记\"软短路疑似\" → 叠加温升证据升级处理（flt-01 分级承接）。 实例 2：残差窗口的 3σ 检验 健康段残差统计：均值 ≈ 0，σ = 3 mv（示意）。某 500 帧滑动窗口残差均值 = +11 mv： 单帧看：11 mv ≈ 3.7σ，偶发尚可解释； 窗口看：均值的标准误 = σ/√n = 3/√500 ≈ 0.13 mv → 11 mv ≈ 82 个标准误 → 系统性偏移实锤 ； 结论：单帧残差是噪声，窗口统计才是诊断——同一条数据，问法不同，结论完全不同。 4. 工程实态 量产主力仍是阈值矩阵（flt-01）+ 少量一致性诊断（压差/温差/自放电分组统计）； 模型残差诊断在高端车型与云端（ gen-2 ）逐步落地：云端算力充裕、可跑更复杂的模型与统计； 诊断结论 不能直接跳闸 ——必须走 flt-01 的分级链条与 iso 26262（s-07）的诊断覆盖要求； gb 38031（s-01/s-02）的热扩散要求使\"内短路早期发现\"成为安全链条的上游课题。 5. 常见误区 把模型失配当故障——参数未随老化/低温更新，残差全包飘红（先修模型再谈诊断，alg-10）； 单帧残差定罪——实例 2 展示的噪声陷阱； 内短路只看电压——必须电-热交叉验证，单一证据链不足以支撑重动作； 诊断结果绕过分级直接断高压——诊断是\"发现\"，处置要过 flt-01 的动作绑定与 ftti 预算（ safe-04 ）； 数据驱动诊断拿正常数据训练就敢上线——故障类样本稀缺时，分类器的\"正常\"判决不可信。 6. 自测 q1 ：残差诊断中，\"单体外电压残差异常但相邻单体差分正常\"指向什么？为什么？ q2 ：实例 1 中若 docv/dsoc = 0.1 mv/%（lfp 平台段），同样 8 mv 压降意味着什么？说明什么工程难点？ q3 ：为什么诊断算法强调\"窗口统计\"而不是\"单帧阈值\"？ 答案 q1：指向该路采样链（线束/连接器/afe 通道）故障。差分正常说明两单体真实的相对状态没变——只有\"测量\"这一侧在说谎；若电芯本体劣化，与邻居的差分也会异常。 q2：δsoc = 8/0.1 = 80%——荒谬的数字，说明平台段 docv/dsoc≈0 时\"电压差→soc\"换算完全失效，自放电筛查失去分辨率。这是 lfp 包做内短路筛查的固有难点：只能靠更长的静置窗口、库仑差或外部证据补偿。 q3：单帧残差被测量噪声与工况瞬态污染，误报率不可控；窗口统计把随机噪声平均掉（标准误 ∝ σ/√n），系统性偏移才浮出——本质是把\"防抖\"从时域搬进统计域。 来源 s-16：g. plett, battery management systems vol. ii（残差与参数估计方法框架） s-07：iso 26262:2018（诊断覆盖与安全机制衔接） s-01 / s-02：gb 38031-2025 / 2020（热扩散安全要求背景；p-05 已于 11-16 核实要点） s-89：内短路（isc）检测文献群——shen et al. 2025 applied energy （scr 度量与分级）、naha et al. 2020 scientific reports （实时 ml 检测）、jia et al. 2023 phm society（bms 集成早期检测）（2026-11-22 登记） s-21 / s-23：ai/ml 在 bms 诊断中的应用综述（背景级引用，注意 s-23 期刊声誉备注） 本课全部数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 g. plett《battery management systems》vol. ii（s-16） b 残差诊断与参数估计的教材基础 iso 26262:2018 原文（s-07） a 诊断覆盖率的规范语境 gb 38031-2025 原文（s-01） a 热扩散与内短路安全要求 shen et al., applied energy (2025)：基于 scr 的电池包 isc 诊断 a 摘要免费 scr 为 isc 严重度标准度量（s-89） naha et al., scientific reports (2020)：实时 ml 内短路检测 a ✅ 开放获取 电压/电流特征的实时检测（202+ 引用，s-89） [待补链] — 基于模型的电池故障诊断（model-based fdi）公开文献 待核对项（本课） 量产 bms 内短路筛查判据（自放电倍数阈值/静置时长要求）的公开资料 ~~r_iscr 等效电阻分级的文献划分~~ → 2026-11-22 部分核实 （s-89）：文献口径硬短路 &lt;10~20 mω（近即时 tr 风险）、软短路 &gt;1 kω（慢自放电/soc 漂移）；量产筛查判据仍待企业标准资料 云端故障诊断在量产项目的落地案例（gen-2 关联） s-23 综述中诊断部分的可用性（期刊声誉争议备注生效中） "}, {"id": "ALG-09", "title": "课程 ALG-09：RUL 剩余寿命预测——把 SOH 曲线延伸到未来", "dom": "ALG", "verified": false, "html": "<blockquote><p>对应节点 <code>ALG-09<\/code>（../domains/06-核心算法.md <span class=\"fileref\">（项目文件 ../domains/06-核心算法.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>（必看）、<a class=\"xlink\" href=\"#/lesson/ALG-03\">ALG-03<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要它<\/h3>\n<p>SOH 是\"现在\"，RUL（Remaining Useful Life，剩余寿命）是\"未来\"：<strong>电池离失效阈值还有多久<\/strong>。它不直接保护电池，却直接定价电池：<\/p>\n<ol>\n<li><strong>保修预留金<\/strong>：8 年质保的钱按 RUL 分布提取；<\/li>\n<li><strong>残值、BaaS 与二手定价<\/strong>：换电/租赁月费与二手车价本质都是\"卖剩余寿命\"（<a class=\"xlink\" href=\"#/lesson/GEN-2\">GEN-2<\/a> 云端价值的主要兑现点，域六导语）——SOH 是截面，RUL 才是趋势；<\/li>\n<li><strong>梯次利用决策<\/strong>：车用到几成退役、还能干几年，决定 <a class=\"xlink\" href=\"#/lesson/CHM-04\">CHM-04<\/a> 的经济账。<\/li>\n<p>EV 惯例取容量衰减到 80% 为 EOL（end of life）阈值（工程共识，示意）。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<h4>2.1 输入与输出<\/h4>\n<ul>\n<li><strong>输入<\/strong>：SOH 轨迹（ALG-05 在线估计的历史序列）+ 工况统计特征（温度分布、倍率分布、吞吐电量）+ 化学体系先验；<\/li>\n<li><strong>输出<\/strong>：到达 EOL 的时间<strong>分布<\/strong>（RUL = t_EOL − t_now）——不是点估计，置信区间随预测视界（horizon）变宽（节点约束）。<\/li>\n<\/ul>\n<h4>2.2 模型族（由简到繁）<\/h4>\n<table><thead><tr><th>模型族<\/th><th>形式<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>经验式<\/td><td>平方根式 Q_loss = k√t（扩散控制 SEI 生长的经典形式）；双指数 a(1−e^(−t/τ₁)) + b(1−e^(−t/τ₂))（快+慢两过程）<\/td><td>少数据起步、可解释<\/td><\/tr><tr><td>半经验<\/td><td>线性基底 × 工况加速因子（温度用 Arrhenius 型、倍率/DOD 修正）<\/td><td>车端可算的工程折中<\/td><\/tr><tr><td>数据驱动<\/td><td>SOH 序列 + 特征 → LSTM/GPR 预测轨迹与区间（S-28/S-29 综述谱系）<\/td><td>云端、大数据在手的场景<\/td><\/tr><\/tbody><\/table>\n<h4>2.3 两条铁律（节点约束点题）<\/h4>\n<ol>\n<li><strong>外推即风险<\/strong>：用 2 年数据预测 8 年 = 4 倍外推，且\"膝点\"（knee point，老化后期衰减加速的非线性拐点）可能在数据之外；<\/li>\n<li><strong>分布外泛化差<\/strong>：训练集没有的工况/新体系（<a class=\"xlink\" href=\"#/lesson/CHM-02\">CHM-02<\/a>/<a class=\"xlink\" href=\"#/lesson/CHM-03\">CHM-03<\/a>）预测无依据。<\/li>\n<\/ol>\n<h3>3. 手算实例（数字自洽，全为教学示意值）<\/h3>\n<h4>实例 1：平方根式外推<\/h4>\n<p>某车观测（教学示意数据）：1 年容量损失 4.2%、2 年 6.0%、4 年 8.4%。验证平方根式 Q_loss = k√t：k = 4.2/√1 = 4.2；6.0/√2 = 4.24；8.4/√4 = 4.2 → 拟合极佳，<strong>k ≈ 4.2 %/√年<\/strong>。<\/p>\n<ul>\n<li>外推 8 年：loss = 4.2×√8 = <strong>11.9%<\/strong> → SOH ≈ 88.1%；<\/li>\n<li>RUL（到 20% 损失）：√t = 20/4.2 = 4.76 → t = <strong>22.7 年<\/strong> → RUL ≈ 22.7 − 4 = 18.7 年。<\/li>\n<p><strong>教学警示<\/strong>：这个\"18.7 年\"几乎肯定是乐观的——平方根式越老越慢，且未建模膝点与工况突变。经验式外推必须叠加不确定性，不能当承诺。<\/
