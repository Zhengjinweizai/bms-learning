/td><\/tr><tr><td>SocketCAN / python-can 开源项目<\/td><td>B<\/td><td>Linux/Python 实操总线，动手验证本课时序计算<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>经典 CAN 节点数上限的现行惯例（与收发器差分输入电阻的关系，各代器件不同）<\/li>\n<li>整车 CAN FD 数据段速率档位（2~5 Mbit/s 为示意，沿用 SYS-04）<\/li>\n<li>部分网络收发器休眠电流的典型规格书数据（本课 8 µA 为示意）<\/li>\n<\/ul>", "text": " 对应节点 hw-06 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： sys-04 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；显性/隐性电平为 iso 11898-2（s-11）的标称概念。 1. 为什么收发器是\"看不见的地基\" mcu 的 tx/rx 引脚输出的是逻辑电平，不能直接驱动总线——收发器（transceiver）负责把逻辑电平翻译成总线差分电平、仲裁冲突下的电气行为、以及整车最关心的 唤醒/休眠 。节点约束点题： 波特率与节点负载；唤醒/休眠静态电流（ma 级目标） 。bms 是整车漏电投诉的高发嫌疑节点，休眠电流设计就在这颗小芯片上。 2. 机制展开：收发器职责逐项看 （1）电平翻译（iso 11898-2，s-11） 显性（dominant）：can_h/can_l 差分约 2 v（标称），表示逻辑 0； 隐性（recessive）：差分约 0 v，表示逻辑 1； 多节点\"线与\"：任何人发显性则总线为显性——这就是 can 仲裁的物理基础。 （2）端接（termination） ：总线两端各 120 ω（标称），并联后总线直流负载 60 ω。显性时收发器驱动电流 ≈ 2 v ÷ 60 ω ≈ 33 ma （标称电平估算）。端接缺失或阻值错 → 信号反射与电平异常，低速看不出问题、高速就翻车。 （3）唤醒与休眠（本课核心） 部分网络（partial networking）：收发器在 mcu 睡着后监听总线，只有匹配 唤醒帧（wup）或唤醒报文（wuf） 才唤醒系统，其余流量被过滤——防\"总线一有动静全车醒\"； lin（iso 17987，s-12）：低成本主从总线，bms 包内从控板（温度采集板等）的常用备选， lin 唤醒通过显性电平持续一定时间实现。 （4）失效防护 ：收发器对总线短路、txd 卡显性（防\"一节点卡死全车瘫痪\"）有内置保护；这些故障模式要有 dtc 联动（ sw-05 ）。 3. 手算实例 实例 1：位时序配置（采样点） 晶振 40 mhz，目标 500 kbit/s： 分频取 4 → 时钟 10 mhz → 时间份额 tq（time quantum）= 100 ns； 每位 20 tq → 位时间 = 2 µs → 500 kbit/s ✓ 采样点位置 = (同步段 + 传播段 + 相位段1) ÷ 总 tq = 15 ÷ 20 = 75% （经典 can 常用 75~80%，示意惯例）。 实例 2：休眠静态电流预算 板级目标 &lt; 100 µa（示意；整车对下电漏电的目标为 ma 级，节点约束）： 通路 电流（教学示意值） can 收发器（部分网络模式） 8 µa mcu 待机（ram 保持） 25 µa afe × 3（休眠/低占空比） 3 × 2 µa = 6 µa 唤醒监测与漏检电路 5 µa 合计 44 µa 结论：44 µa 对 100 µa 目标余量 2.3 倍—— 但任何一路选型失误（比如收发器选了 200 µa 的普通模式）直接超标 。休眠预算表要在选型阶段就做，而不是测出来超标再返工。 4. 工程实态 can fd（s-11）：数据段提速（整车常用 2~5 mbit/s 档，示意，与 sys-04 一致）——注意 仲裁段位时序与数据段位时序分开配置 ，时钟误差容忍度不同； 节点数与电气负载：节点数受收发器差分输入电阻限制（保证隐性电平恢复能力），上限具体数值随器件代次变化，待核对； 网络管理（nm）睡眠协调由软件栈完成（ sw-03 ），收发器提供\"唤醒源\"硬件基础； bms 特有约束：包内从控板常用菊花链/私有链路（ hw-01 ），对外才走 can/lin——两级网络的休眠协调要一起设计。 5. 常见误区 端接随便加——每个节点自带端接会过载驱动（60 ω 变成更小并联值），端接只在两端； \"总线有活动就唤醒\"——不过滤 wuf 的收发器等于没有部分网络，驻车耗电失控； can fd 数据段沿用仲裁段采样点配置——数据段更短更快，配置不当误码率飙升； 忽略 txd 卡显性保护——一个故障节点卡死总线，整车通信瘫痪。 6. 自测 q1 ：40 mhz 分频 2、每位 40 tq，波特率多少？采样点在 tq 30 处是多少？ q2 ：休眠预算 44 µa 若收发器换成普通模式 200 µa，总电流超板级目标多少？ q3 ：为什么隐性是\"0 v 差分\"却仍能被总线正确读取？ 答案 q1：20 mhz ÷ 40 = 500 kbit/s（tq = 50 ns，位时间 2 µs）✓；采样点 = 30/40 = 75% 。 q2：44 − 8 + 200 = 236 µa ，超 100 µa 目标 136 µa——单颗器件毁掉整个预算。 q3：显性是\"主动驱动 2 v 差分\"，隐性是\"放开总线、由端接电阻把差分拉回 0\"——接收端以显性为准判 0，其余读 1（线与机制）。 来源 s-11：iso 11898 系列（can / can fd 物理层与链路层） s-12：iso 17987（lin） s-03：gb/t 38661-2020（bms 通信能力的产品级要求） 本课休眠电流表、40 mhz/20 tq、75% 采样点均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 11898-2 原文 a 物理层电平/端接/输入电阻的权威定义 bosch《can specification》2.0 (1991) b can 协议原始规范，经典必读 socketcan / python-can 开源项目 b linux/python 实操总线，动手验证本课时序计算 待核对项（本课） 经典 can 节点数上限的现行惯例（与收发器差分输入电阻的关系，各代器件不同） 整车 can fd 数据段速率档位（2~5 mbit/s 为示意，沿用 sys-04） 部分网络收发器休眠电流的典型规格书数据（本课 8 µa 为示意） "}, {"id": "HW-07", "title": "课程 HW-07：传感器冗余与故障检测设计", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-07<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HW-03\">HW-03<\/a>、<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么单通道传感器是盲区<\/h3>\n<p>一台传感器坏了但有误差带兜底，系统尚可带病运行；最危险的是<strong>坏了却不自知<\/strong>（故障静默，fault-silent）：过流保护看着一个\"读数为 0 的电流计\"永远不报警。节点约束点题：<strong>传感器故障需可检测（诊断覆盖率）；冗余度与成本权衡<\/strong>（S-07）。设计问题因此有两个：加多少通道（冗余度）？以及<strong>不加通道时如何发现它坏了<\/strong>（诊断）。<\/p>\n<h3>2. 机制展开：从冗余架构到交叉校验<\/h3>\n<p><strong>（1）冗余架构谱系（成本递增）<\/strong><\/p>\n<ul>\n<li><strong>同构双通道<\/strong>：两颗同型传感器，误差特性相同，能检出\"硬故障\"但难分辨软漂移；<\/li>\n<li><strong>异构双通道<\/strong>：不同原理（分流器 + 霍尔，<a class=\"xlink\" href=\"#/lesson/HW-03\">HW-03<\/a>），失效模式互补，交叉校验价值最高；<\/li>\n<li><strong>三通道 2-of-3 表决<\/strong>：三取二中值，单通道坏不影响输出——安全性与可用性都最高，成本也最高。<\/li>\n<p><strong>（2）交叉校验（Cross-check）阈值设计<\/strong>（本课核心方法） 两通道读数差 |ΔI| 与自适应阈值比较：<\/p>\n<\/ul>\n<div class=\"math\">T(I) = T_0 + k \\cdot |I|<\/div>\n<ul>\n<li><strong>T₀<\/strong>：两通道零偏容差之和（常数项，覆盖小电流段的漂移）；<\/li>\n<li><strong>k<\/strong>：两通道增益/线性度容差之和（比例项，覆盖大电流段）；<\/li>\n<li>固定阈值在大电流下要么漏报要么误报，自适应阈值两头兼顾（手算实例）。<\/li>\n<p><strong>（3）合理性检查（Plausibility check）——\"零成本冗余\"<\/strong><\/p>\n<li>能量一致性：P_batt ≈ U × I 与下游（电机功率/效率）对账，残差超限报警；<\/li>\n<li>模型一致性：实测电压 vs 模型预测（<a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a>）残差；<\/li>\n<li>物理极限：dV/dt、dT/dt 超过物理可能 → 判传感器故障。<\/li>\n<p>注意：模型错则\"一起错\"——合理性检查检测的是<strong>不一致<\/strong>，其自身不是第三个独立测量。<\/p>\n<p><strong>（4）卡死/冻结检测<\/strong>：对\"读数纹丝不动\"的怀疑用激励验证——均衡开关切换时电压应有可预测的微小响应（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>），响应缺失即判冻结。<\/p>\n<p><strong>（5）失效后策略<\/strong>：fail-safe（进安全态：限功率/断高压，多数乘用 BMS 的选择）vs fail-op（降级继续运行：L3 以上自动驾驶需要），由整车 HARA 决定（<a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a>）。<\/p>\n<\/ul>\n<h3>3. 手算实例：自适应阈值与三选二<\/h3>\n<p><strong>实例 1 — 电流异构双通道<\/strong>（教学示意值）：分流器容差 ±0.5%、霍尔容差 ±1%，零偏容差合计 T₀ = 0.6 A，k = 0.5% + 1% = 1.5%：<\/p>\n<ul>\n<li>T(100 A) = 0.6 + 1.5 = <strong>2.1 A<\/strong><\/li>\n<li>T(400 A) = 0.6 + 6 = <strong>6.6 A<\/strong><\/li>\n<li>若错误地用固定阈值 2 A：400 A 时两通道正常偏差就可能到 6 A → <strong>频繁误报<\/strong>；若用固定阈值 8 A：100 A 时真实故障差 3 A → <strong>漏报<\/strong>。自适应阈值是唯一两头都对的解。<\/li>\n<li>防抖：|ΔI| &gt; T 持续 200 ms（示意）才判\"电流不可信\"→ 进入降级策略（限功率 + DTC，<a class=\"xlink\" href=\"#/lesson/SW-04\">SW-04<\/a>）。<\/li>\n<p><strong>实例 2 — 电压三选二<\/strong>：同一节电芯三路测量得 3.652 V / 3.654 V / 3.900 V： 中值 = <strong>3.654 V<\/strong>（取中位数输出）；3.900 V 与中值差 246 mV ≫ 容差 → 该通道隔离并记 DTC；系统输出不受坏通道影响——这就是 2-of-3 同时买到\"安全性\"（坏通道剔出）与\"可用性\"（不断功能）。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>诊断覆盖率目标与 ASIL 挂钩（S-07）：安全通道的传感器故障覆盖率要求高（具体目标值与分解方式待核对），靠\"通道自诊断 + 交叉校验 + 合理性检查\"三层叠加达成；<\/li>\n<li><strong>共因失效（Common Cause）审查<\/strong>是冗余设计的灵魂：双通道共用一个供电轨、同一束线束、同一次标定流程，都可能让冗余同时失效——架构上要电源隔离、走线分离、标定独立（与 <a class=\"xlink\" href=\"#/lesson/SAFE-03\">SAFE-03<\/a> 的独立性论证对接）；<\/li>\n<li>成本权衡常态：电压/温度通道靠 AFE 内置诊断 + 单体求和与独立总压互查实现\"伪冗余\"；电流通道才上真冗余（数量少、价值高）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>双通道接同一电源/同一处理器接口——假冗余，共因一击即穿；<\/li>\n<li>阈值拍脑袋定常数——上面实例 1 已演示两头都错；<\/li>\n<li>把合理性检查当第三通道——模型与被测对象共享假设，独立等级不足，覆盖率论证要降级处理；<\/li>\n<li>只覆盖\"读数错\"不覆盖\"读数停\"——冻结/卡死需要主动激励或活动检测才能发现。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：T₀ = 0.6 A、k = 1.5%，300 A 时阈值多少？ <strong>Q2<\/strong>：双通道读数差 3 A 持续 100 ms（&lt; 防抖 200 ms），系统应怎么处理？ <strong>Q3<\/strong>：为什么\"三选二\"比\"双通道择一\"贵得多却仍是 L3 场景的候选？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：T = 0.6 + 1.5% × 300 = 0.6 + 4.5 = <strong>5.1 A<\/strong>。<\/li>\n<li>Q2：不触发\"不可信\"判定，但事件应计数/缓存——多次未满防抖时长的异常累积可触发趋势告警；这是\"防误报\"设计的代价。<\/li>\n<li>Q3：双通道坏一个只能 fail-safe（功能中断）；三选二坏一个仍能正常输出（fail-op），L3 要求运行中不甩锅给用户，可用性需求推高冗余度。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（诊断覆盖率、冗余与共因失效的原则）<\/li>\n<li>S-03：GB/T 38661-2020（采集与诊断的产品级要求）<\/li>\n<li>本课容差（0.5%/1%）、T₀、k、防抖时长均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 Part 5 / Part 9 原文<\/td><td>A<\/td><td>硬件安全机制与共因失效分析章节<\/td><\/tr><tr><td>IEC 61508（电气/电子安全母标准）<\/td><td>A<\/td><td>ISO 26262 的源头框架（概念溯源用）<\/td><\/tr><tr><td>本项目课程 <a class=\"xlink\" href=\"#/lesson/ALG-10\">ALG-10<\/a><\/td><td>—<\/td><td>模型残差合理性检查的算法侧<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>各 ASIL 等级传感器路径诊断覆盖率的具体目标值（如 99%/90% 分档，待查 ISO 26262 相关表格）<\/li>\n<li>异构电流冗余在量产 BMS 中的配置比例（示意架构表述）<\/li>\n<li>自适应阈值 T₀/k 的行业标定惯例（本课数值为教学示意）<\/li>\n<\/ul>", "text": " 对应节点 hw-07 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： hw-03 、 safe-04 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么单通道传感器是盲区 一台传感器坏了但有误差带兜底，系统尚可带病运行；最危险的是 坏了却不自知 （故障静默，fault-silent）：过流保护看着一个\"读数为 0 的电流计\"永远不报警。节点约束点题： 传感器故障需可检测（诊断覆盖率）；冗余度与成本权衡 （s-07）。设计问题因此有两个：加多少通道（冗余度）？以及 不加通道时如何发现它坏了 （诊断）。 2. 机制展开：从冗余架构到交叉校验 （1）冗余架构谱系（成本递增） 同构双通道 ：两颗同型传感器，误差特性相同，能检出\"硬故障\"但难分辨软漂移； 异构双通道 ：不同原理（分流器 + 霍尔， hw-03 ），失效模式互补，交叉校验价值最高； 三通道 2-of-3 表决 ：三取二中值，单通道坏不影响输出——安全性与可用性都最高，成本也最高。 （2）交叉校验（cross-check）阈值设计 （本课核心方法） 两通道读数差 |δi| 与自适应阈值比较： t(i) = t_0 + k \\cdot |i| t₀ ：两通道零偏容差之和（常数项，覆盖小电流段的漂移）； k ：两通道增益/线性度容差之和（比例项，覆盖大电流段）； 固定阈值在大电流下要么漏报要么误报，自适应阈值两头兼顾（手算实例）。 （3）合理性检查（plausibility check）——\"零成本冗余\" 能量一致性：p_batt ≈ u × i 与下游（电机功率/效率）对账，残差超限报警； 模型一致性：实测电压 vs 模型预测（ alg-10 ）残差； 物理极限：dv/dt、dt/dt 超过物理可能 → 判传感器故障。 注意：模型错则\"一起错\"——合理性检查检测的是 不一致 ，其自身不是第三个独立测量。 （4）卡死/冻结检测 ：对\"读数纹丝不动\"的怀疑用激励验证——均衡开关切换时电压应有可预测的微小响应（ hw-01 ），响应缺失即判冻结。 （5）失效后策略 ：fail-safe（进安全态：限功率/断高压，多数乘用 bms 的选择）vs fail-op（降级继续运行：l3 以上自动驾驶需要），由整车 hara 决定（ safe-02 ）。 3. 手算实例：自适应阈值与三选二 实例 1 — 电流异构双通道 （教学示意值）：分流器容差 ±0.5%、霍尔容差 ±1%，零偏容差合计 t₀ = 0.6 a，k = 0.5% + 1% = 1.5%： t(100 a) = 0.6 + 1.5 = 2.1 a t(400 a) = 0.6 + 6 = 6.6 a 若错误地用固定阈值 2 a：400 a 时两通道正常偏差就可能到 6 a → 频繁误报 ；若用固定阈值 8 a：100 a 时真实故障差 3 a → 漏报 。自适应阈值是唯一两头都对的解。 防抖：|δi| &gt; t 持续 200 ms（示意）才判\"电流不可信\"→ 进入降级策略（限功率 + dtc， sw-04 ）。 实例 2 — 电压三选二 ：同一节电芯三路测量得 3.652 v / 3.654 v / 3.900 v： 中值 = 3.654 v （取中位数输出）；3.900 v 与中值差 246 mv ≫ 容差 → 该通道隔离并记 dtc；系统输出不受坏通道影响——这就是 2-of-3 同时买到\"安全性\"（坏通道剔出）与\"可用性\"（不断功能）。 4. 工程实态 诊断覆盖率目标与 asil 挂钩（s-07）：安全通道的传感器故障覆盖率要求高（具体目标值与分解方式待核对），靠\"通道自诊断 + 交叉校验 + 合理性检查\"三层叠加达成； 共因失效（common cause）审查 是冗余设计的灵魂：双通道共用一个供电轨、同一束线束、同一次标定流程，都可能让冗余同时失效——架构上要电源隔离、走线分离、标定独立（与 safe-03 的独立性论证对接）； 成本权衡常态：电压/温度通道靠 afe 内置诊断 + 单体求和与独立总压互查实现\"伪冗余\"；电流通道才上真冗余（数量少、价值高）。 5. 常见误区 双通道接同一电源/同一处理器接口——假冗余，共因一击即穿； 阈值拍脑袋定常数——上面实例 1 已演示两头都错； 把合理性检查当第三通道——模型与被测对象共享假设，独立等级不足，覆盖率论证要降级处理； 只覆盖\"读数错\"不覆盖\"读数停\"——冻结/卡死需要主动激励或活动检测才能发现。 6. 自测 q1 ：t₀ = 0.6 a、k = 1.5%，300 a 时阈值多少？ q2 ：双通道读数差 3 a 持续 100 ms（&lt; 防抖 200 ms），系统应怎么处理？ q3 ：为什么\"三选二\"比\"双通道择一\"贵得多却仍是 l3 场景的候选？ 答案 q1：t = 0.6 + 1.5% × 300 = 0.6 + 4.5 = 5.1 a 。 q2：不触发\"不可信\"判定，但事件应计数/缓存——多次未满防抖时长的异常累积可触发趋势告警；这是\"防误报\"设计的代价。 q3：双通道坏一个只能 fail-safe（功能中断）；三选二坏一个仍能正常输出（fail-op），l3 要求运行中不甩锅给用户，可用性需求推高冗余度。 来源 s-07：iso 26262:2018（诊断覆盖率、冗余与共因失效的原则） s-03：gb/t 38661-2020（采集与诊断的产品级要求） 本课容差（0.5%/1%）、t₀、k、防抖时长均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 26262:2018 part 5 / part 9 原文 a 硬件安全机制与共因失效分析章节 iec 61508（电气/电子安全母标准） a iso 26262 的源头框架（概念溯源用） 本项目课程 alg-10 — 模型残差合理性检查的算法侧 待核对项（本课） 各 asil 等级传感器路径诊断覆盖率的具体目标值（如 99%/90% 分档，待查 iso 26262 相关表格） 异构电流冗余在量产 bms 中的配置比例（示意架构表述） 自适应阈值 t₀/k 的行业标定惯例（本课数值为教学示意） "}, {"id": "SAFE-01", "title": "课程 SAFE-01：功能安全流程 ISO 26262——安全是属性不是功能", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-01<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-03\">SYS-03<\/a> ｜ 预计用时 60 min 数字规则：标准规定的数值（如硬件度量目标）以标准原文为准，本课不列具体数值；案例数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要\"流程\"<\/h3>\n<p>功能安全（Functional Safety。ISO 26262 语境：不存在由电气/电子系统功能异常导致的不可接受风险）有三个反直觉之处：<\/p>\n<ol>\n<li><strong>安全不是功能，是属性<\/strong>——过充保护是功能；\"过充保护足够可信\"才是安全。属性靠开发过程保证，所以这个学科是流程驱动的；<\/li>\n<li><strong>严格度必须分档<\/strong>——把所有部件都按最高标准开发，成本不可承受。ASIL 分级就是\"按危害大小定开发严格度\"的机制；<\/li>\n<li><strong>必须留证据<\/strong>——\"我们很安全\"不是论证；\"我们按 X 级要求开发了 Y 并用 Z 方法验证了\"才是。节点约束：<strong>流程裁剪需留证据<\/strong>。<\/li>\n<\/ol>\n<h3>2. 机制展开：安全生命周期与分级<\/h3>\n<p><strong>（1）安全生命周期三大段（ISO 26262:2018，S-07，共 12 个部分）<\/strong><\/p>\n<ul>\n<li><strong>概念阶段<\/strong>（Part 3）：相关项定义（item definition，划定系统边界——正是 <code>SYS-02<\/code> 的活）→ HARA（<code>SAFE-02<\/code>）→ 安全目标 → 功能安全概念（FSC，Functional Safety Concept）；<\/li>\n<li><strong>开发阶段<\/strong>（Part 4/5/6）：技术安全概念（TSC，Technical Safety Concept）→ 系统设计 → 硬件/软件开发；硬件配度量目标（Part 5），软件配验证方法（Part 6）；<\/li>\n<li><strong>生产与运行<\/strong>（Part 7）：生产、运行、服务过程中的安全要求。<\/li>\n<p>支撑部分：Part 2（安全管理）、Part 8（支持过程：需求管理、配置/变更管理、软件工具置信度等）、Part 9（ASIL 分解与安全分析）、Part 10~12（指南、摩托车、半导体适配）。<\/p>\n<p><strong>（2）ASIL（Automotive Safety Integrity Level，汽车安全完整性等级）<\/strong><\/p>\n<p>QM / A / B / C / D 四级+QM，由 HARA 的 S/E/C 三因子导出（下一课展开）。ASIL 决定：<\/p>\n<li>分析深度：D 级通常要求 FMEA/FTA/DFA 全套相关分析（Part 9）；<\/li>\n<li>软件验证严格度：结构覆盖率随 ASIL 提高而加严——<strong>已核实（2026-11-13，ISO 26262-6:2018 §10.4.5 的公开转述源一致，S-69）<\/strong>：标准用 \"+\"（推荐）/\"++\"（强烈推荐）标注而非硬性规定——语句覆盖 A/B 为 ++、C/D 为 +；分支覆盖 A 为 +、B/C/D 为 ++；MC/DC A/B 为 +、C/D 为 ++。<strong>注意\"ASIL A 只做语句覆盖\"是常见的过度简化误传<\/strong>；降低覆盖必须书面论证可行性缺口。<\/li>\n<li>硬件度量目标（Part 5）：随机硬件失效指标（SPFM/LFM/PMHF，符号解释：单点故障度量/潜伏故障度量/随机硬件失效概率度量）——<strong>目标值已核实（2026-11-10，公开来源见表；最终以标准原文为准）<\/strong>：<\/li>\n<\/ul>\n<table><thead><tr><th>指标<\/th><th>ASIL B<\/th><th>ASIL C<\/th><th>ASIL D<\/th><\/tr><\/thead><tbody><tr><td>SPFM（单点故障度量）<\/td><td>≥90%<\/td><td>≥97%<\/td><td>≥99%<\/td><\/tr><tr><td>LFM（潜伏故障度量）<\/td><td>≥60%<\/td><td>≥80%<\/td><td>≥90%<\/td><\/tr><tr><td>PMHF（随机硬件失效概率）<\/td><td>&lt;100 FIT<\/td><td>&lt;100 FIT<\/td><td>&lt;10 FIT<\/td><\/tr><\/tbody><\/table>\n<p>（FIT = 失效数/10⁹ 小时。注意：Part 5 将这些定为\"高度推荐\"的指导目标而非绝对要求；ASIL C/D 的评估通常配合 FTA。）<\/p>\n<p><strong>（3）裁剪（Tailoring）<\/strong>：允许按相关项特点裁剪流程活动，但<strong>每项裁剪都要写论证并留证据<\/strong>。这是\"流程不是文档游戏\"的关键：文档本身就是安全论证的载体。<\/p>\n<h3>3. 工程案例推演：拿\"过充保护\"走一遍概念阶段到开发落点<\/h3>\n<p>（评分与结论均为教学示意值，完整 HARA 推演见 <code>SAFE-02<\/code>）<\/p>\n<table><thead><tr><th>步骤<\/th><th>产出物<\/th><th>本例内容<\/th><\/tr><\/thead><tbody><tr><td>相关项定义<\/td><td>边界描述<\/td><td>电池系统及其与 VCU/OBC/热管理的接口（复用 <code>SYS-02<\/code>）<\/td><\/tr><tr><td>HARA<\/td><td>危害清单 + ASIL<\/td><td>\"快充中过充起火\" → S3+E4+C3 → ASIL D（示意）<\/td><\/tr><tr><td>安全目标<\/td><td>SG-01<\/td><td>防止任一电芯超过充电电压上限<\/td><\/tr><tr><td>FSC<\/td><td>安全机制分配<\/td><td>主通道：BMS 检测过充 → 断开主正接触器；独立监控通道：独立监测电路冗余判定（分解为 B(D)+B(D)，见 <code>SAFE-03<\/code>）<\/td><\/tr><tr><td>转入开发<\/td><td>TSC<\/td><td>把 FSC 落成系统架构与 TSR（<code>SYS-03<\/code> 的溯源链）<\/td><\/tr><\/tbody><\/table>\n<p>后续开发阶段的严格度落点（示意，以标准原文为准）：<\/p>\n<ul>\n<li>硬件：两通道各自完成安全分析，系统层验证随机失效指标；<\/li>\n<li>软件：主通道过充判断软件按 D 级 → MC/DC 覆盖；监控通道按 B(D)；<\/li>\n<li>确认（validation）：安全目标在整车层确认——故障注入 + 实车工况测试（<code>DEV-02<\/code>）。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>OEM 与供应商用 DIA（Development Interface Agreement，开发接口协议）分割安全活动责任（<code>SYS-03<\/code> 已提及）；<\/li>\n<li>D 级项目通常聘请独立的功能安全评估/审核（外部确认）；<\/li>\n<li>裁剪的现实形态：成熟平台的 QM 功能套用既有流程；新 ASIL 功能做增量分析并留证；<\/li>\n<li>与国标的关系：GB/T 38661（S-03）与 GB 38031（S-01/S-02）是<strong>产品要求<\/strong>（做出来什么样），ISO 26262 是<strong>过程要求<\/strong>（怎么保证做对）——两套都合规才算完整。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"功能安全=加个看门狗\"——安全机制只是产出物，流程（分析、验证、证据链）才是学科本体；<\/li>\n<li>ASIL 标在部件上——ASIL 是危害事件/安全需求的属性，部件经由承载需求获得等级；<\/li>\n<li>裁剪不留证据——审核时说不清为什么省略某活动，等于违规；<\/li>\n<li>把\"流程走完\"当\"安全达成\"——流程产出的安全机制还要在实车上有效，确认（validation）是另一回事。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么说\"安全不是功能而是属性\"？ <strong>Q2<\/strong>：FSC 与 TSC 的区别是什么？ <strong>Q3<\/strong>：流程裁剪的合法性条件是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：功能回答\"做什么\"（如断高压），属性回答\"这份功能有多可信\"（失效率、诊断覆盖率、验证严格度）。同一功能可按不同 ASIL 开发，可信度不同——因此安全靠过程属性而非功能有无来保证。<\/li>\n<li>Q2：FSC 在概念阶段，把安全目标分配到功能级安全机制（不绑定具体架构）；TSC 在开发起点，把 FSC 落到系统架构、接口与具体技术方案。<\/li>\n<li>Q3：每项裁剪都要有书面论证与留存证据（合规性证据），且不得削减安全目标所必需的活动。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（全 12 部分框架：生命周期、ASIL、裁剪、DIA 术语）<\/li>\n<li>S-01/S-03：GB 38031-2025 与 GB/T 38661-2020（产品要求与过程要求的关系）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-10 部分链接已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://iso26262.academy/features/concepts/hardware-metrics\" target=\"_blank\" rel=\"noopener\">ISO 26262 Academy：Hardware Metrics（SPFM/LFM/PMHF 目标表）<\/a><\/td><td>B<\/td><td>✅（免费页）<\/td><td>本文度量数值的公开转述源（以标准原文为准）<\/td><\/tr><tr><td><a href=\"https://www.ti.com/lit/sloa294\" target=\"_blank\" rel=\"noopener\">TI：Understanding Functional Safety FIT Base Failure Rate（sloa294）<\/a><\/td><td>A<\/td><td>✅<\/td><td>FIT 概念与随机硬件失效指标计算的厂商官方文档<\/td><\/tr><tr><td><strong>GB/T 39086-2020《电动汽车用电池管理系统功能安全要求及试验方法》<\/strong>（2026-11-18 新发现，S-79）<\/td><td>A<\/td><td>—<\/td><td>BMS 功能安全的<strong>专属国标<\/strong>——ISO 26262 在中国 BMS 领域的落地标准<\/td><\/tr><tr><td>ISO 26262:2018 Part 2/3/4 原文<\/td><td>A<\/td><td>—<\/td><td>安全管理、概念阶段、系统层开发的核心三部分（付费）<\/td><\/tr><tr><td>ISO 26262:2018 Part 5/6 原文<\/td><td>A<\/td><td>—<\/td><td>硬件度量与软件验证严格度的依据（付费）<\/td><\/tr><tr><td>IEC 61508<\/td><td>A<\/td><td>—<\/td><td>功能安全的通用母标准（ISO 26262 的源头）<\/td><\/tr><tr><td>D. J. Smith, K. G. L. Simpson, <em>The Safety-Critical Systems Handbook<\/em><\/td><td>B<\/td><td>—<\/td><td>功能安全入门经典教材<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~结构覆盖率与 ASIL 的对应~~ → <strong>2026-11-13 已核实<\/strong>（+/++ 标注制，S-69；\"A 只做语句覆盖\"系误传，已纠正正文）。<\/li>\n<li>~~SPFM/LFM/PMHF 目标数值~~ → <strong>2026-11-10 已核实<\/strong>（P-21 关闭，见表；最终以标准原文为准）<\/li>\n<\/ul>", "text": " 对应节点 safe-01 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： sys-03 ｜ 预计用时 60 min 数字规则：标准规定的数值（如硬件度量目标）以标准原文为准，本课不列具体数值；案例数字均为 教学示意值 。 1. 为什么需要\"流程\" 功能安全（functional safety。iso 26262 语境：不存在由电气/电子系统功能异常导致的不可接受风险）有三个反直觉之处： 安全不是功能，是属性 ——过充保护是功能；\"过充保护足够可信\"才是安全。属性靠开发过程保证，所以这个学科是流程驱动的； 严格度必须分档 ——把所有部件都按最高标准开发，成本不可承受。asil 分级就是\"按危害大小定开发严格度\"的机制； 必须留证据 ——\"我们很安全\"不是论证；\"我们按 x 级要求开发了 y 并用 z 方法验证了\"才是。节点约束： 流程裁剪需留证据 。 2. 机制展开：安全生命周期与分级 （1）安全生命周期三大段（iso 26262:2018，s-07，共 12 个部分） 概念阶段 （part 3）：相关项定义（item definition，划定系统边界——正是 sys-02 的活）→ hara（ safe-02 ）→ 安全目标 → 功能安全概念（fsc，functional safety concept）； 开发阶段 （part 4/5/6）：技术安全概念（tsc，technical safety concept）→ 系统设计 → 硬件/软件开发；硬件配度量目标（part 5），软件配验证方法（part 6）； 生产与运行 （part 7）：生产、运行、服务过程中的安全要求。 支撑部分：part 2（安全管理）、part 8（支持过程：需求管理、配置/变更管理、软件工具置信度等）、part 9（asil 分解与安全分析）、part 10~12（指南、摩托车、半导体适配）。 （2）asil（automotive safety integrity level，汽车安全完整性等级） qm / a / b / c / d 四级+qm，由 hara 的 s/e/c 三因子导出（下一课展开）。asil 决定： 分析深度：d 级通常要求 fmea/fta/dfa 全套相关分析（part 9）； 软件验证严格度：结构覆盖率随 asil 提高而加严—— 已核实（2026-11-13，iso 26262-6:2018 §10.4.5 的公开转述源一致，s-69） ：标准用 \"+\"（推荐）/\"++\"（强烈推荐）标注而非硬性规定——语句覆盖 a/b 为 ++、c/d 为 +；分支覆盖 a 为 +、b/c/d 为 ++；mc/dc a/b 为 +、c/d 为 ++。 注意\"asil a 只做语句覆盖\"是常见的过度简化误传 ；降低覆盖必须书面论证可行性缺口。 硬件度量目标（part 5）：随机硬件失效指标（spfm/lfm/pmhf，符号解释：单点故障度量/潜伏故障度量/随机硬件失效概率度量）—— 目标值已核实（2026-11-10，公开来源见表；最终以标准原文为准） ： 指标 asil b asil c asil d spfm（单点故障度量） ≥90% ≥97% ≥99% lfm（潜伏故障度量） ≥60% ≥80% ≥90% pmhf（随机硬件失效概率） &lt;100 fit &lt;100 fit &lt;10 fit （fit = 失效数/10⁹ 小时。注意：part 5 将这些定为\"高度推荐\"的指导目标而非绝对要求；asil c/d 的评估通常配合 fta。） （3）裁剪（tailoring） ：允许按相关项特点裁剪流程活动，但 每项裁剪都要写论证并留证据 。这是\"流程不是文档游戏\"的关键：文档本身就是安全论证的载体。 3. 工程案例推演：拿\"过充保护\"走一遍概念阶段到开发落点 （评分与结论均为教学示意值，完整 hara 推演见 safe-02 ） 步骤 产出物 本例内容 相关项定义 边界描述 电池系统及其与 vcu/obc/热管理的接口（复用 sys-02 ） hara 危害清单 + asil \"快充中过充起火\" → s3+e4+c3 → asil d（示意） 安全目标 sg-01 防止任一电芯超过充电电压上限 fsc 安全机制分配 主通道：bms 检测过充 → 断开主正接触器；独立监控通道：独立监测电路冗余判定（分解为 b(d)+b(d)，见 safe-03 ） 转入开发 tsc 把 fsc 落成系统架构与 tsr（ sys-03 的溯源链） 后续开发阶段的严格度落点（示意，以标准原文为准）： 硬件：两通道各自完成安全分析，系统层验证随机失效指标； 软件：主通道过充判断软件按 d 级 → mc/dc 覆盖；监控通道按 b(d)； 确认（validation）：安全目标在整车层确认——故障注入 + 实车工况测试（ dev-02 ）。 4. 工程实态 oem 与供应商用 dia（development interface agreement，开发接口协议）分割安全活动责任（ sys-03 已提及）； d 级项目通常聘请独立的功能安全评估/审核（外部确认）； 裁剪的现实形态：成熟平台的 qm 功能套用既有流程；新 asil 功能做增量分析并留证； 与国标的关系：gb/t 38661（s-03）与 gb 38031（s-01/s-02）是 产品要求 （做出来什么样），iso 26262 是 过程要求 （怎么保证做对）——两套都合规才算完整。 5. 常见误区 \"功能安全=加个看门狗\"——安全机制只是产出物，流程（分析、验证、证据链）才是学科本体； asil 标在部件上——asil 是危害事件/安全需求的属性，部件经由承载需求获得等级； 裁剪不留证据——审核时说不清为什么省略某活动，等于违规； 把\"流程走完\"当\"安全达成\"——流程产出的安全机制还要在实车上有效，确认（validation）是另一回事。 6. 自测 q1 ：为什么说\"安全不是功能而是属性\"？ q2 ：fsc 与 tsc 的区别是什么？ q3 ：流程裁剪的合法性条件是什么？ 答案 q1：功能回答\"做什么\"（如断高压），属性回答\"这份功能有多可信\"（失效率、诊断覆盖率、验证严格度）。同一功能可按不同 asil 开发，可信度不同——因此安全靠过程属性而非功能有无来保证。 q2：fsc 在概念阶段，把安全目标分配到功能级安全机制（不绑定具体架构）；tsc 在开发起点，把 fsc 落到系统架构、接口与具体技术方案。 q3：每项裁剪都要有书面论证与留存证据（合规性证据），且不得削减安全目标所必需的活动。 来源 s-07：iso 26262:2018（全 12 部分框架：生命周期、asil、裁剪、dia 术语） s-01/s-03：gb 38031-2025 与 gb/t 38661-2020（产品要求与过程要求的关系） 延伸资源（2026-11-10 部分链接已核实） 资源 级别 免费 说明 iso 26262 academy：hardware metrics（spfm/lfm/pmhf 目标表） b ✅（免费页） 本文度量数值的公开转述源（以标准原文为准） ti：understanding functional safety fit base failure rate（sloa294） a ✅ fit 概念与随机硬件失效指标计算的厂商官方文档 gb/t 39086-2020《电动汽车用电池管理系统功能安全要求及试验方法》 （2026-11-18 新发现，s-79） a — bms 功能安全的 专属国标 ——iso 26262 在中国 bms 领域的落地标准 iso 26262:2018 part 2/3/4 原文 a — 安全管理、概念阶段、系统层开发的核心三部分（付费） iso 26262:2018 part 5/6 原文 a — 硬件度量与软件验证严格度的依据（付费） iec 61508 a — 功能安全的通用母标准（iso 26262 的源头） d. j. smith, k. g. l. simpson, the safety-critical systems handbook b — 功能安全入门经典教材 待核对项（本课） ~~结构覆盖率与 asil 的对应~~ → 2026-11-13 已核实 （+/++ 标注制，s-69；\"a 只做语句覆盖\"系误传，已纠正正文）。 ~~spfm/lfm/pmhf 目标数值~~ → 2026-11-10 已核实 （p-21 关闭，见表；最终以标准原文为准） "}, {"id": "SAFE-02", "title": "课程 SAFE-02：HARA 与安全目标——给危害定价", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-02<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-01\">SAFE-01<\/a> ｜ 预计用时 60 min 数字规则：S/E/C 类别定义与定级表源自 ISO 26262-3:2018（S-07）；案例评分全部为<strong>教学示意值<\/strong>（实际评分按各主机厂评分基准执行）。<\/p><\/blockquote>\n<h3>1. 为什么 HARA 是安全工作的入口<\/h3>\n<p>节点约束给死两条：<strong>场景需覆盖行驶/充电/静止三态；安全目标需量化（如预警时间）。<\/strong> HARA（Hazard Analysis and Risk Assessment，危害分析与风险评估）是功能安全体系唯一的风险入口：不经过 HARA 的功能没有 ASIL；没有 ASIL 的需求不知道按多严的标准开发。<code>README<\/code> 下一批候选里点名\"拿一个过充场景走完整 HARA\"——本课第 3 节就是这个案例。<\/p>\n<h3>2. 机制展开：S、E、C 三因子与定级表<\/h3>\n<p>HARA 对每个\"运行场景 × 危害事件\"组合打三个分（类别定义源自 ISO 26262-3:2018）：<\/p>\n<ul>\n<li><strong>S（Severity，严重度）<\/strong>：潜在伤害的严重程度。S0 无伤 → S1 轻/中度伤 → S2 重度伤（可能幸存）→ S3 危及生命（生存不确定）/致命；<\/li>\n<li><strong>E（Exposure，暴露率）<\/strong>：处于该运行场景的概率。E0 极低 → E1 很低 → E2 低 → E3 中 → E4 高（按单位时间/里程出现概率分级）；<\/li>\n<li><strong>C（Controllability，可控性）<\/strong>：驾驶员/涉险人员避免伤害的能力。C0 总体可控 → C1 简单可控 → C2 正常可控 → C3 难以控制/不可控。<\/li>\n<p><strong>三因子查表得 ASIL<\/strong>（ISO 26262-3 的定级表；此处列 S3 行示意完整逻辑，其余行规则同构——S/E/C 越高 ASIL 越高；完整表以标准原文为准）：<\/p>\n<\/ul>\n<table><thead><tr><th>S<\/th><th>E<\/th><th>C1<\/th><th>C2<\/th><th>C3<\/th><\/tr><\/thead><tbody><tr><td>S3<\/td><td>E2<\/td><td>QM<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>S3<\/td><td>E3<\/td><td>A<\/td><td>B<\/td><td>C<\/td><\/tr><tr><td>S3<\/td><td>E4<\/td><td>B<\/td><td>C<\/td><td>D<\/td><\/tr><\/tbody><\/table>\n<p><strong>安全目标（Safety Goal）<\/strong>：HARA 的产出——针对危害事件的<strong>顶层定性目标<\/strong>（避免什么状态），随附最严 ASIL；量化要求（预警时间等）在其后的技术安全需求落地（节点约束\"量化\"的正确落点，见 <code>SYS-03<\/code>）。<\/p>\n<h3>3. 工程案例推演：过充场景的完整 HARA 表<\/h3>\n<p><strong>同一危害机理（电芯过充 → 热失控 → 起火/爆炸），三个运行场景分别评分<\/strong>（评分全为教学示意值）：<\/p>\n<table><thead><tr><th>编号<\/th><th>运行场景<\/th><th>危害事件<\/th><th>S<\/th><th>E<\/th><th>C<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td>H-01<\/td><td>直流快充（常无人值守）<\/td><td>充电机未响应停止请求，持续过充至热失控<\/td><td>S3<\/td><td>E4（快充高频使用）<\/td><td>C3（人员无法及时干预）<\/td><td><strong>D<\/strong><\/td><\/tr><tr><td>H-02<\/td><td>行驶中<\/td><td>能量回收叠加致瞬时过压<\/td><td>S3<\/td><td>E3（满电+大回收+低温等严苛组合占比低，示意）<\/td><td>C2（驾驶员可减速并靠边）<\/td><td>B<\/td><\/tr><tr><td>H-03<\/td><td>交流慢充（夜间驻车）<\/td><td>慢充控制异常致缓慢过充<\/td><td>S3<\/td><td>E3（低频）<\/td><td>C3（无人值守）<\/td><td>C<\/td><\/tr><\/tbody><\/table>\n<p>推演要点：<\/p>\n<ol>\n<li><strong>三态覆盖是检查表<\/strong>：充电（H-01/H-03）与行驶（H-02）已覆盖；静止不充电态的相关危害（如绝缘失效，<code>HV-03<\/code>）另行分析——三态不是\"恰好三条\"，是防遗漏的最低要求；<\/li>\n<li><strong>同一机理、不同 ASIL<\/strong>：过充保护功能的开发严格度由<strong>最严场景支配<\/strong>（H-01 → D）。低 ASIL 场景并非无用：它们构成不同工况下的纵深条件；<\/li>\n<li><strong>安全目标产出<\/strong>：SG-01\"防止任一电芯超过充电电压上限\"（ASIL D，支配级）→ 交给 <code>SAFE-03<\/code> 做分解、<code>SYS-03<\/code> 建溯源链、<code>SAFE-04<\/code> 做时间预算；<\/li>\n<li><strong>E 评分的纪律<\/strong>：E4/E3 的判定要有场景频率依据（快充频次统计/工况数据），拍脑袋评分是审核追问的重灾区；C 评分同理需要可控性论证。<\/li>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>各主机厂维护自己的<strong>评分基准表<\/strong>（把 S/E/C 类别定义落成本公司判据与数据来源），供应商按基准表做 HARA 再交评审；<\/li>\n<li>HARA 场景库与 <code>DEV-06<\/code> 场景库复用：真实工况数据反哺 E 评分；<\/li>\n<li>一个电池系统的 HARA 通常产出数十条安全目标（过充/过放/过温/过流/绝缘/碰撞后断电等，示意量级）；<\/li>\n<li>诚实局限：HARA 的主观成分不可消除（尤其 C 评分），靠评审与数据压低不确定性，而非消除。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 ASIL 赋给部件（\"这个 MCU 是 ASIL D\"）——ASIL 是危害事件的属性，部件经由承载安全需求获得等级；<\/li>\n<li>安全目标写成解决方案（\"应断开接触器\"）——那是 FSC 层的事；安全目标只说\"避免什么状态\"；<\/li>\n<li>场景只覆盖行驶态——充电/驻车态常评分更严（无人值守 → C3），漏场景=漏最严 ASIL；<\/li>\n<li>E/C 评分无依据留痕——审核追问\"凭什么 E4\"，答不上来整张表作废。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：S3 + E4 + C2 查表得什么 ASIL？ <strong>Q2<\/strong>：为什么过充的快充场景通常比行驶场景评分更严？ <strong>Q3<\/strong>：安全目标写成\"应在检测到过充后 200 ms 内断开接触器\"有什么问题？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：<strong>C<\/strong>（S3 行、E4 列、C2 → C）。<\/li>\n<li>Q2：快充高频发生（E 高）且常无人值守（C 差），两项同时恶化；行驶场景驾驶员在场可控性较好，且\"满电+大回收+低温\"等严苛组合占比低（示意）。<\/li>\n<li>Q3：这是技术安全需求（TSR）的写法——把解决方案（断接触器）和时间参数写进了顶层目标；安全目标应定性描述要避免的危害状态（\"防止电芯过充\"），时间预算在其下层落地（SYS-03）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018 Part 3（HARA 方法、S/E/C 类别定义、ASIL 定级表）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 Part 3 原文<\/td><td>HARA 与安全目标的标准出处（S/E/C 定义与完整定级表）<\/td><\/tr><tr><td>ISO 21448:2022（SOTIF）<\/td><td>预期功能安全——与 HARA 互补的\"性能不足\"风险框架<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>H-01~H-03 评分全部为教学示意值：E 评分所需工况频率数据、C 评分所需可控性论证均需按各 OEM 基准表<\/li>\n<li>ISO 26262-3:2018 定级表的表号未标注，S1/S2 行未列出；引用前回原文核对（建议新 P 项）<\/li>\n<\/ul>", "text": " 对应节点 safe-02 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： safe-01 ｜ 预计用时 60 min 数字规则：s/e/c 类别定义与定级表源自 iso 26262-3:2018（s-07）；案例评分全部为 教学示意值 （实际评分按各主机厂评分基准执行）。 1. 为什么 hara 是安全工作的入口 节点约束给死两条： 场景需覆盖行驶/充电/静止三态；安全目标需量化（如预警时间）。 hara（hazard analysis and risk assessment，危害分析与风险评估）是功能安全体系唯一的风险入口：不经过 hara 的功能没有 asil；没有 asil 的需求不知道按多严的标准开发。 readme 下一批候选里点名\"拿一个过充场景走完整 hara\"——本课第 3 节就是这个案例。 2. 机制展开：s、e、c 三因子与定级表 hara 对每个\"运行场景 × 危害事件\"组合打三个分（类别定义源自 iso 26262-3:2018）： s（severity，严重度） ：潜在伤害的严重程度。s0 无伤 → s1 轻/中度伤 → s2 重度伤（可能幸存）→ s3 危及生命（生存不确定）/致命； e（exposure，暴露率） ：处于该运行场景的概率。e0 极低 → e1 很低 → e2 低 → e3 中 → e4 高（按单位时间/里程出现概率分级）； c（controllability，可控性） ：驾驶员/涉险人员避免伤害的能力。c0 总体可控 → c1 简单可控 → c2 正常可控 → c3 难以控制/不可控。 三因子查表得 asil （iso 26262-3 的定级表；此处列 s3 行示意完整逻辑，其余行规则同构——s/e/c 越高 asil 越高；完整表以标准原文为准）： s e c1 c2 c3 s3 e2 qm a b s3 e3 a b c s3 e4 b c d 安全目标（safety goal） ：hara 的产出——针对危害事件的 顶层定性目标 （避免什么状态），随附最严 asil；量化要求（预警时间等）在其后的技术安全需求落地（节点约束\"量化\"的正确落点，见 sys-03 ）。 3. 工程案例推演：过充场景的完整 hara 表 同一危害机理（电芯过充 → 热失控 → 起火/爆炸），三个运行场景分别评分 （评分全为教学示意值）： 编号 运行场景 危害事件 s e c asil h-01 直流快充（常无人值守） 充电机未响应停止请求，持续过充至热失控 s3 e4（快充高频使用） c3（人员无法及时干预） d h-02 行驶中 能量回收叠加致瞬时过压 s3 e3（满电+大回收+低温等严苛组合占比低，示意） c2（驾驶员可减速并靠边） b h-03 交流慢充（夜间驻车） 慢充控制异常致缓慢过充 s3 e3（低频） c3（无人值守） c 推演要点： 三态覆盖是检查表 ：充电（h-01/h-03）与行驶（h-02）已覆盖；静止不充电态的相关危害（如绝缘失效， hv-03 ）另行分析——三态不是\"恰好三条\"，是防遗漏的最低要求； 同一机理、不同 asil ：过充保护功能的开发严格度由 最严场景支配 （h-01 → d）。低 asil 场景并非无用：它们构成不同工况下的纵深条件； 安全目标产出 ：sg-01\"防止任一电芯超过充电电压上限\"（asil d，支配级）→ 交给 safe-03 做分解、 sys-03 建溯源链、 safe-04 做时间预算； e 评分的纪律 ：e4/e3 的判定要有场景频率依据（快充频次统计/工况数据），拍脑袋评分是审核追问的重灾区；c 评分同理需要可控性论证。 4. 工程实态 各主机厂维护自己的 评分基准表 （把 s/e/c 类别定义落成本公司判据与数据来源），供应商按基准表做 hara 再交评审； hara 场景库与 dev-06 场景库复用：真实工况数据反哺 e 评分； 一个电池系统的 hara 通常产出数十条安全目标（过充/过放/过温/过流/绝缘/碰撞后断电等，示意量级）； 诚实局限：hara 的主观成分不可消除（尤其 c 评分），靠评审与数据压低不确定性，而非消除。 5. 常见误区 把 asil 赋给部件（\"这个 mcu 是 asil d\"）——asil 是危害事件的属性，部件经由承载安全需求获得等级； 安全目标写成解决方案（\"应断开接触器\"）——那是 fsc 层的事；安全目标只说\"避免什么状态\"； 场景只覆盖行驶态——充电/驻车态常评分更严（无人值守 → c3），漏场景=漏最严 asil； e/c 评分无依据留痕——审核追问\"凭什么 e4\"，答不上来整张表作废。 6. 自测 q1 ：s3 + e4 + c2 查表得什么 asil？ q2 ：为什么过充的快充场景通常比行驶场景评分更严？ q3 ：安全目标写成\"应在检测到过充后 200 ms 内断开接触器\"有什么问题？ 答案 q1： c （s3 行、e4 列、c2 → c）。 q2：快充高频发生（e 高）且常无人值守（c 差），两项同时恶化；行驶场景驾驶员在场可控性较好，且\"满电+大回收+低温\"等严苛组合占比低（示意）。 q3：这是技术安全需求（tsr）的写法——把解决方案（断接触器）和时间参数写进了顶层目标；安全目标应定性描述要避免的危害状态（\"防止电芯过充\"），时间预算在其下层落地（sys-03）。 来源 s-07：iso 26262:2018 part 3（hara 方法、s/e/c 类别定义、asil 定级表） 延伸资源（仅列可靠名称，链接待补） 资源 说明 iso 26262:2018 part 3 原文 hara 与安全目标的标准出处（s/e/c 定义与完整定级表） iso 21448:2022（sotif） 预期功能安全——与 hara 互补的\"性能不足\"风险框架 待核对项（本课） h-01~h-03 评分全部为教学示意值：e 评分所需工况频率数据、c 评分所需可控性论证均需按各 oem 基准表 iso 26262-3:2018 定级表的表号未标注，s1/s2 行未列出；引用前回原文核对（建议新 p 项） "}, {"id": "SAFE-03", "title": "课程 SAFE-03：ASIL 分解——用冗余换成本", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-03<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a> ｜ 预计用时 45 min 数字规则：分解规则源自 ISO 26262-9:2018（S-07）；案例数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要分解<\/h3>\n<p>HARA 出了 ASIL D（<code>SAFE-02<\/code> 的过充场景 H-01），按 D 级开发单通道系统：全链路 D 级硬件、MC/DC 软件覆盖、全套分析——成本陡峭。工程出路：<strong>如果架构上存在足够的冗余（两条独立通道都能达成安全状态），可把安全需求分解到两条通道，各自按较低 ASIL 开发。<\/strong> 节点约束：<strong>分解需满足独立性/免干扰准则；冗余通道需各自诊断覆盖。<\/strong><\/p>\n<h3>2. 机制展开：分解规则与两个前提<\/h3>\n<p><strong>（1）合法的分解组合<\/strong>（ISO 26262-9:2018 Clause 5；记法 X(n) = \"按 ASIL X 开发、验证严格度保留 n 级\"的需求）：<\/p>\n<table><thead><tr><th>原始 ASIL<\/th><th>可分解为<\/th><\/tr><\/thead><tbody><tr><td>D<\/td><td>C(D) + A(D)，或 B(D) + B(D)，或 D(D) + QM(D)<\/td><\/tr><tr><td>C<\/td><td>B(C) + A(C)，或 C(C) + QM(C)<\/td><\/tr><tr><td>B<\/td><td>A(B) + A(B)，或 B(B) + QM(B)<\/td><\/tr><\/tbody><\/table>\n<p><strong>ASIL A 不可再分解，QM 亦不可分解<\/strong>（2026-11-13 核实，多个公开来源一致：Infineon 知识库等；本课此前误列 \"A → A(A)+QM(A)\" 一行，已删除）。<\/p>\n<p>记法解读：<strong>括号里的 D/C/B/A 是\"残余 ASIL\"<\/strong>——每条分解后的需求保留原始 ASIL 的验证严格度属性，用于确认活动与后续再分解；QM(n) 不是\"不管\"，它仍承载安全相关需求，只是按质量流程开发。<\/p>\n<p><strong>（2）两个前提（违反即分解无效）<\/strong><\/p>\n<ul>\n<li><strong>独立性（Independence）<\/strong>：两通道间不存在共同原因失效（common cause）与级联失效（cascading failure）——必须用 DFA（Dependent Failure Analysis，相关失效分析）论证；<\/li>\n<li><strong>免干扰（Freedom from Interference）<\/strong>：低 ASIL 通道的失效不得干扰高 ASIL 通道的功能（内存分区、时间监视、通信 E2E）。<\/li>\n<p><strong>（3）不可省略的收尾<\/strong>：每条通道<strong>各自保留诊断覆盖<\/strong>（分解不是把监控拆掉）；系统层仍要回归验证整体安全目标达成。<\/p>\n<\/ul>\n<h3>3. 工程案例推演：过充安全目标 ASIL D 的两条分解路线<\/h3>\n<p>沿用 SG-01\"防止任一电芯超过充电电压上限\"（ASIL D，示意）。<\/p>\n<p><strong>路线甲：C(D) + A(D)<\/strong><\/p>\n<table><thead><tr><th>通道<\/th><th>内容<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td>通道 1（主控）<\/td><td>软件电压监控 + 判断 + 驱动断接触器<\/td><td>C(D)<\/td><\/tr><tr><td>通道 2（监控）<\/td><td>独立监测电路（硬件比较/独立监控芯片）检测过压直接触发<\/td><td>A(D)<\/td><\/tr><\/tbody><\/table>\n<p><strong>路线乙：B(D) + B(D)<\/strong>：主控与监控各自做完整的\"检测+判定\"，互为冗余，两路独立驱动或采用双接触器。<\/p>\n<p><strong>DFA 清单（教学示意）<\/strong>——逐项论证独立性：<\/p>\n<table><thead><tr><th>检查项<\/th><th>路线甲的答案<\/th><\/tr><\/thead><tbody><tr><td>供电<\/td><td>监控通道独立供电轨（否则单电源故障击穿两通道）<\/td><\/tr><tr><td>信号路径<\/td><td>电压采集路径独立于主控 AFE（独立采样点/走线）<\/td><\/tr><tr><td>时钟/晶振<\/td><td>各自独立时钟源<\/td><\/tr><tr><td>软件<\/td><td>监控通道为硬件实现或独立软件分区（免干扰）<\/td><\/tr><tr><td><strong>执行器<\/strong><\/td><td><strong>共同执行器（同一接触器）是单点<\/strong>——接触器\"按指令断开\"的功能必须自身满足剩余 ASIL，或改双接触器方案<\/td><\/tr><\/tbody><\/table>\n<p>最后一条是分解设计的高频翻车点：<strong>两条\"独立\"通道汇入同一个接触器，接触器焊死（粘连）就是共同原因失效<\/strong>——<code>HV-04<\/code> 粘连检测因此成为分解方案的必备配套。<\/p>\n<p><strong>定量目标说明<\/strong>（谨慎表述）：分解不放松安全目标层面的整体随机硬件失效要求；工程做法是各通道按分解后 ASIL 的度量开发，再在系统层验证整体指标达标。Part 5 与 Part 9 的衔接规则引用前以标准原文为准（见待核对项）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产形态：主控 MCU（软件全功能）+ 独立监控芯片/硬件比较器（兜底）是最常见的\"过充 ASIL D 落法\"；<\/li>\n<li>双 MCU 锁步（lockstep）处理的是<strong>单芯片内部<\/strong>失效，与跨芯片分解是两回事（<code>HW-02<\/code>）——不要混淆；<\/li>\n<li>免干扰在软件侧的落点：内存分区（MPU）、看门狗/程序流监视、E2E 保护（<code>SW-01/02<\/code>）；<\/li>\n<li>分解是架构决策：没有冗余架构就没有分解——先有架构（如 <code>ARCH-MS<\/code> 从控板的独立性），再谈分解，顺序不能反。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把分解当降级（\"D 变成 B 了，随便做做\"）——每条通道仍需各自诊断覆盖与残余 ASIL 严格度；<\/li>\n<li>忽略共同执行器/共同电源——DFA 漏一项，分解论证整体失效；<\/li>\n<li>把 QM(D) 当成纯 QM——QM(D) 仍承载安全需求，需要实现并验证其存在；<\/li>\n<li>对非冗余架构硬套分解——串联结构（一个通道失效即失去保护）不满足分解前提。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：ASIL B 可以分解为哪两种组合？ <strong>Q2<\/strong>：两条独立通道都通过同一个接触器执行断开，有什么问题？怎么解？ <strong>Q3<\/strong>：记法 B(D) 中括号里的 D 是什么含义？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：A(B) + A(B)，或 B(B) + QM(B)。<\/li>\n<li>Q2：执行器成为共同原因单点，DFA 无法闭合。解法：执行器按剩余 ASIL 开发/验证，或改双接触器冗余执行；并配套粘连检测（HV-04）覆盖焊死失效。<\/li>\n<li>Q3：残余 ASIL——该需求保留原始 ASIL D 的验证严格度属性（用于确认活动与后续操作），开发严格度按 B。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018 Part 9（ASIL 分解规则、独立性/免干扰准则、DFA）；Part 1（相关术语定义）<\/li>\n<li>S-69：分解规则表的公开转述源（Infineon 知识库等，2026-11-13 核对一致）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-13 已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.iso.org/standard/68391.html\" target=\"_blank\" rel=\"noopener\">ISO 26262-9:2018 官方页（iso.org）<\/a><\/td><td>A<\/td><td>摘要免费、全文付费<\/td><td>分解规则的规范性出处<\/td><\/tr><tr><td><a href=\"https://community.infineon.com/t5/Knowledge-Base-Articles/ASIL-decomposition-ISO-26262/ta-p/852405\" target=\"_blank\" rel=\"noopener\">Infineon 知识库：ASIL decomposition（ISO 26262）<\/a><\/td><td>B<\/td><td>✅<\/td><td>分解规则与实施要点的厂商知识库转述（与本文表格一致）<\/td><\/tr><tr><td>ISO 26262:2018 Part 5 原文<\/td><td>A<\/td><td>—<\/td><td>硬件度量与随机失效目标的分配语境（付费）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~分解组合表~~ → <strong>2026-11-13 已核实并修正<\/strong>（删除了错误的 \"A → A(A)+QM(A)\" 行）。<\/li>\n<li>\"分解不放松整体定量目标\"与<strong>硬件度量（SPFM/LFM/PMHF）的分解附加规则<\/strong>在 Part 9 Clause 6 的精确条款——本次仅核实了需求分解规则（Clause 5），Clause 6 细节仍需回原文。<\/li>\n<li>路线甲/乙的通道划分与 DFA 项为教学示意，不代表任何具体量产方案。<\/li>\n<\/ul>", "text": " 对应节点 safe-03 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： safe-02 ｜ 预计用时 45 min 数字规则：分解规则源自 iso 26262-9:2018（s-07）；案例数字均为 教学示意值 。 1. 为什么需要分解 hara 出了 asil d（ safe-02 的过充场景 h-01），按 d 级开发单通道系统：全链路 d 级硬件、mc/dc 软件覆盖、全套分析——成本陡峭。工程出路： 如果架构上存在足够的冗余（两条独立通道都能达成安全状态），可把安全需求分解到两条通道，各自按较低 asil 开发。 节点约束： 分解需满足独立性/免干扰准则；冗余通道需各自诊断覆盖。 2. 机制展开：分解规则与两个前提 （1）合法的分解组合 （iso 26262-9:2018 clause 5；记法 x(n) = \"按 asil x 开发、验证严格度保留 n 级\"的需求）： 原始 asil 可分解为 d c(d) + a(d)，或 b(d) + b(d)，或 d(d) + qm(d) c b(c) + a(c)，或 c(c) + qm(c) b a(b) + a(b)，或 b(b) + qm(b) asil a 不可再分解，qm 亦不可分解 （2026-11-13 核实，多个公开来源一致：infineon 知识库等；本课此前误列 \"a → a(a)+qm(a)\" 一行，已删除）。 记法解读： 括号里的 d/c/b/a 是\"残余 asil\" ——每条分解后的需求保留原始 asil 的验证严格度属性，用于确认活动与后续再分解；qm(n) 不是\"不管\"，它仍承载安全相关需求，只是按质量流程开发。 （2）两个前提（违反即分解无效） 独立性（independence） ：两通道间不存在共同原因失效（common cause）与级联失效（cascading failure）——必须用 dfa（dependent failure analysis，相关失效分析）论证； 免干扰（freedom from interference） ：低 asil 通道的失效不得干扰高 asil 通道的功能（内存分区、时间监视、通信 e2e）。 （3）不可省略的收尾 ：每条通道 各自保留诊断覆盖 （分解不是把监控拆掉）；系统层仍要回归验证整体安全目标达成。 3. 工程案例推演：过充安全目标 asil d 的两条分解路线 沿用 sg-01\"防止任一电芯超过充电电压上限\"（asil d，示意）。 路线甲：c(d) + a(d) 通道 内容 asil 通道 1（主控） 软件电压监控 + 判断 + 驱动断接触器 c(d) 通道 2（监控） 独立监测电路（硬件比较/独立监控芯片）检测过压直接触发 a(d) 路线乙：b(d) + b(d) ：主控与监控各自做完整的\"检测+判定\"，互为冗余，两路独立驱动或采用双接触器。 dfa 清单（教学示意） ——逐项论证独立性： 检查项 路线甲的答案 供电 监控通道独立供电轨（否则单电源故障击穿两通道） 信号路径 电压采集路径独立于主控 afe（独立采样点/走线） 时钟/晶振 各自独立时钟源 软件 监控通道为硬件实现或独立软件分区（免干扰） 执行器 共同执行器（同一接触器）是单点 ——接触器\"按指令断开\"的功能必须自身满足剩余 asil，或改双接触器方案 最后一条是分解设计的高频翻车点： 两条\"独立\"通道汇入同一个接触器，接触器焊死（粘连）就是共同原因失效 —— hv-04 粘连检测因此成为分解方案的必备配套。 定量目标说明 （谨慎表述）：分解不放松安全目标层面的整体随机硬件失效要求；工程做法是各通道按分解后 asil 的度量开发，再在系统层验证整体指标达标。part 5 与 part 9 的衔接规则引用前以标准原文为准（见待核对项）。 4. 工程实态 量产形态：主控 mcu（软件全功能）+ 独立监控芯片/硬件比较器（兜底）是最常见的\"过充 asil d 落法\"； 双 mcu 锁步（lockstep）处理的是 单芯片内部 失效，与跨芯片分解是两回事（ hw-02 ）——不要混淆； 免干扰在软件侧的落点：内存分区（mpu）、看门狗/程序流监视、e2e 保护（ sw-01/02 ）； 分解是架构决策：没有冗余架构就没有分解——先有架构（如 arch-ms 从控板的独立性），再谈分解，顺序不能反。 5. 常见误区 把分解当降级（\"d 变成 b 了，随便做做\"）——每条通道仍需各自诊断覆盖与残余 asil 严格度； 忽略共同执行器/共同电源——dfa 漏一项，分解论证整体失效； 把 qm(d) 当成纯 qm——qm(d) 仍承载安全需求，需要实现并验证其存在； 对非冗余架构硬套分解——串联结构（一个通道失效即失去保护）不满足分解前提。 6. 自测 q1 ：asil b 可以分解为哪两种组合？ q2 ：两条独立通道都通过同一个接触器执行断开，有什么问题？怎么解？ q3 ：记法 b(d) 中括号里的 d 是什么含义？ 答案 q1：a(b) + a(b)，或 b(b) + qm(b)。 q2：执行器成为共同原因单点，dfa 无法闭合。解法：执行器按剩余 asil 开发/验证，或改双接触器冗余执行；并配套粘连检测（hv-04）覆盖焊死失效。 q3：残余 asil——该需求保留原始 asil d 的验证严格度属性（用于确认活动与后续操作），开发严格度按 b。 来源 s-07：iso 26262:2018 part 9（asil 分解规则、独立性/免干扰准则、dfa）；part 1（相关术语定义） s-69：分解规则表的公开转述源（infineon 知识库等，2026-11-13 核对一致） 延伸资源（2026-11-13 已核实） 资源 级别 免费 说明 iso 26262-9:2018 官方页（iso.org） a 摘要免费、全文付费 分解规则的规范性出处 infineon 知识库：asil decomposition（iso 26262） b ✅ 分解规则与实施要点的厂商知识库转述（与本文表格一致） iso 26262:2018 part 5 原文 a — 硬件度量与随机失效目标的分配语境（付费） 待核对项（本课） ~~分解组合表~~ → 2026-11-13 已核实并修正 （删除了错误的 \"a → a(a)+qm(a)\" 行）。 \"分解不放松整体定量目标\"与 硬件度量（spfm/lfm/pmhf）的分解附加规则 在 part 9 clause 6 的精确条款——本次仅核实了需求分解规则（clause 5），clause 6 细节仍需回原文。 路线甲/乙的通道划分与 dfa 项为教学示意，不代表任何具体量产方案。 "}, {"id": "SAFE-04", "title": "课程 SAFE-04：安全机制与故障反应时间（FTTI）", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-04<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SAFE-03\">SAFE-03<\/a> ｜ 预计用时 60 min 数字规则：GB 38031-2020 的热扩散报警要求为标准内容（S-02，表述以原文为准）；其余具体时间数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么机制必须和\"失效速度\"匹配<\/h3>\n<p>安全目标（<code>SAFE-02<\/code>）只回答\"要避免什么\"，安全机制（Safety Mechanism）才是落地手段：检测故障 + 控制故障 + 减轻危害。节点约束给定了匹配原则：<strong>故障反应时间需与电化学失效速度匹配（过流 ms 级，热失控 min 级）<\/strong>——保护动作慢于危害发展，机制等于不存在。<\/p>\n<h3>2. 机制展开：四类保护 + FTTI 时间链<\/h3>\n<p><strong>（1）四类基础保护机制<\/strong>（阈值均为教学示意值，实际按电芯规格与标定矩阵）<\/p>\n<table><thead><tr><th>机制<\/th><th>检测对象<\/th><th>分级动作（递进）<\/th><\/tr><\/thead><tbody><tr><td>过充保护<\/td><td>V_cell 上限（4.25 V 示意）<\/td><td>报警 → 限充/停充 → 断高压<\/td><\/tr><tr><td>过放保护<\/td><td>V_cell 下限（2.50 V 示意）<\/td><td>报警 → 限放 → 断高压<\/td><\/tr><tr><td>过温保护<\/td><td>T_max（60°C 示意）<\/td><td>降功率 → 停充 → 断高压<\/td><\/tr><tr><td>过流保护<\/td><td>I 超限（kA 级短路另由熔断器兜底）<\/td><td>限功率 → 断高压<\/td><\/tr><\/tbody><\/table>\n<p>阈值设计两要素：<strong>裕量<\/strong>（动作阈值与电芯极限之间留出采集误差+电芯离散性空间）与<strong>防抖/迟滞<\/strong>（debounce/hysteresis，防止在阈值附近抖动振荡——但防抖时间计入故障反应预算，见手算）。<\/p>\n<p><strong>（2）FTTI 时间链（四个术语均源自 ISO 26262-1:2018，逐个解释）<\/strong><\/p>\n<ul>\n<li><strong>FTTI<\/strong>（Fault Tolerant Time Interval，故障容错时间间隔）：从故障发生到危害事件不可逆的最短时间——由危害的电化学/物理速度决定，设计者不能选择它；<\/li>\n<li><strong>FDTI<\/strong>（Fault Detection Time Interval）：检测耗时 = 采样周期 + 滤波/防抖；<\/li>\n<li><strong>FRTI<\/strong>（Fault Reaction Time Interval）：反应耗时 = 判断 + 通信 + 驱动 + 执行器动作；<\/li>\n<li><strong>FHTI<\/strong>（Fault Handling Time Interval）= FDTI + FRTI，设计要求：<strong>FHTI &lt; FTTI<\/strong>（留余量）。<\/li>\n<p>预算是逐环节加出来的：采样、滤波、判决、通信、驱动、接触器分断，一环不能漏。<\/p>\n<\/ul>\n<h3>3. 手算实例：过流与热失控的两条时间预算<\/h3>\n<p><strong>例 A：外部短路过流（教学示意值）<\/strong><\/p>\n<table><thead><tr><th>环节<\/th><th>耗时<\/th><\/tr><\/thead><tbody><tr><td>电流采样周期<\/td><td>10 ms<\/td><\/tr><tr><td>滤波/防抖确认<\/td><td>20 ms<\/td><\/tr><tr><td><strong>FDTI 小计<\/strong><\/td><td><strong>30 ms<\/strong><\/td><\/tr><tr><td>判决 + 驱动<\/td><td>10 ms<\/td><\/tr><tr><td>接触器分断（含灭弧）<\/td><td>40 ms<\/td><\/tr><tr><td><strong>FRTI 小计<\/strong><\/td><td><strong>50 ms<\/strong><\/td><\/tr><tr><td><strong>FHTI = FDTI + FRTI<\/strong><\/td><td><strong>80 ms<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>设该工况下连接器/电芯的损伤耐受时间为 200 ms（示意）→ FTTI ≥ 200 ms → 余量 = 200 − 80 = <strong>120 ms<\/strong>（FHTI 占 FTTI 的 40%）。敏感性检查：防抖从 20 ms 放宽到 100 ms → FHTI = 160 ms，余量只剩 20 ms——<strong>防抖不是免费的<\/strong>。<\/p>\n<p><strong>例 B：热失控（min 级，对照）<\/strong><\/p>\n<ul>\n<li>标准口径：GB 38031-2020（S-02）要求热扩散试验中提供热事件报警并留出乘员逃逸时间（5 min 量级，表述以原文为准）；GB 38031-2025（S-01）进一步强化（细节待核对 P-05）；<\/li>\n<li>预算：FTTI ≈ 300 s（按 5 min 口径转译，示意）→ 检测（温升率/电压骤降等热失控征兆算法）FDTI ≤ 30 s（示意）+ 报警上报 FRTI ≤ 5 s（示意）→ FHTI = 35 s，余量充足；<\/li>\n<li><strong>对比结论<\/strong>：过流 FHTI 按毫秒设计，热失控按秒/分钟设计——同一套 BMS 两种时间尺度并存，这正是节点约束\"匹配电化学失效速度\"的含义。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>阈值标定矩阵：阈值随温度×SOC×老化变化（<code>DEV-05<\/code>），不是一组常数；<\/li>\n<li>分层防线：BMS 软件保护（可标定）→ 硬件比较器兜底（<code>SAFE-03<\/code> 监控通道）→ 熔断器/pyrofuse 等无源最后防线——三层失效模式互不相同；<\/li>\n<li>执行器时间是 FRTI 的大头：接触器分断数十 ms 量级（示意），选型时纳入预算；kA 级短路交给熔断器/pyrofuse 承担；<\/li>\n<li>确认方式：FHTI 用故障注入实测（HIL/实车，<code>DEV-02/03<\/code>），不是纸面计算。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>阈值贴着电芯极限设——采集误差（±2 mV 量级，示意）直接吃穿裕量；<\/li>\n<li>防抖拉长求稳——防抖时间在 FHTI 预算里，拉太长保护反而失效；<\/li>\n<li>只算软件时间——采样周期、通信延迟、接触器分断、灭弧都要计入；<\/li>\n<li>认为 BMS 是唯一防线——熔断器层承担 ms 级 kA 短路，BMS 管不到那个速度。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：FHTI 由哪两段构成？设计约束是什么？ <strong>Q2<\/strong>：过流保护链路 FDTI=30 ms、FRTI=50 ms，FTTI=200 ms，余量多少？防抖 +70 ms 后还剩多少？ <strong>Q3<\/strong>：为什么热失控报警可以做秒级、而过流必须毫秒级？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：FHTI = FDTI（检测）+ FRTI（反应）；约束 FHTI &lt; FTTI（FTTI 由危害发展速度决定，术语源自 ISO 26262-1:2018）。<\/li>\n<li>Q2：FHTI = 80 ms，余量 = 200 − 80 = <strong>120 ms<\/strong>；防抖 +70 ms → FHTI = 150 ms，余量 <strong>50 ms<\/strong>。<\/li>\n<li>Q3：危害发展速度不同：过流的热/电磁应力在毫秒级造成损伤（FTTI 毫秒级）；热失控从触发到起火是分钟级过程（GB 38031-2020 的 5 min 报警口径），检测算法有余量做秒级运算。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-02：GB 38031-2020（热扩散试验与报警提前量口径，表述以原文为准）<\/li>\n<li>S-01：GB 38031-2025（强化方向，细节待核对 P-05）<\/li>\n<li>S-07：ISO 26262:2018 Part 1（FTTI/FHTI/FDTI/FRTI 术语定义）及 Part 3/4（安全机制与时间约束分配）<\/li>\n<li>S-03：GB/T 38661-2020（保护功能的产品要求）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 Part 1 原文<\/td><td>FTTI/FHTI 等术语的权威定义<\/td><\/tr><tr><td>GB 38031-2025 原文<\/td><td>现行国标安全要求（热扩散等条款，P-05 核对）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>例 A/例 B 全部时间数字为教学示意值；接触器分断时间与 kA 级短路耐受时间需按器件规格书核对（建议新 P 项）<\/li>\n<li>GB 38031-2020\"5 min\"的精确条款表述（报警提前量定义口径），建议并入 P-05 一并核对<\/li>\n<\/ul>", "text": " 对应节点 safe-04 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： safe-02 、 safe-03 ｜ 预计用时 60 min 数字规则：gb 38031-2020 的热扩散报警要求为标准内容（s-02，表述以原文为准）；其余具体时间数字均为 教学示意值 。 1. 为什么机制必须和\"失效速度\"匹配 安全目标（ safe-02 ）只回答\"要避免什么\"，安全机制（safety mechanism）才是落地手段：检测故障 + 控制故障 + 减轻危害。节点约束给定了匹配原则： 故障反应时间需与电化学失效速度匹配（过流 ms 级，热失控 min 级） ——保护动作慢于危害发展，机制等于不存在。 2. 机制展开：四类保护 + ftti 时间链 （1）四类基础保护机制 （阈值均为教学示意值，实际按电芯规格与标定矩阵） 机制 检测对象 分级动作（递进） 过充保护 v_cell 上限（4.25 v 示意） 报警 → 限充/停充 → 断高压 过放保护 v_cell 下限（2.50 v 示意） 报警 → 限放 → 断高压 过温保护 t_max（60°c 示意） 降功率 → 停充 → 断高压 过流保护 i 超限（ka 级短路另由熔断器兜底） 限功率 → 断高压 阈值设计两要素： 裕量 （动作阈值与电芯极限之间留出采集误差+电芯离散性空间）与 防抖/迟滞 （debounce/hysteresis，防止在阈值附近抖动振荡——但防抖时间计入故障反应预算，见手算）。 （2）ftti 时间链（四个术语均源自 iso 26262-1:2018，逐个解释） ftti （fault tolerant time interval，故障容错时间间隔）：从故障发生到危害事件不可逆的最短时间——由危害的电化学/物理速度决定，设计者不能选择它； fdti （fault detection time interval）：检测耗时 = 采样周期 + 滤波/防抖； frti （fault reaction time interval）：反应耗时 = 判断 + 通信 + 驱动 + 执行器动作； fhti （fault handling time interval）= fdti + frti，设计要求： fhti &lt; ftti （留余量）。 预算是逐环节加出来的：采样、滤波、判决、通信、驱动、接触器分断，一环不能漏。 3. 手算实例：过流与热失控的两条时间预算 例 a：外部短路过流（教学示意值） 环节 耗时 电流采样周期 10 ms 滤波/防抖确认 20 ms fdti 小计 30 ms 判决 + 驱动 10 ms 接触器分断（含灭弧） 40 ms frti 小计 50 ms fhti = fdti + frti 80 ms 设该工况下连接器/电芯的损伤耐受时间为 200 ms（示意）→ ftti ≥ 200 ms → 余量 = 200 − 80 = 120 ms （fhti 占 ftti 的 40%）。敏感性检查：防抖从 20 ms 放宽到 100 ms → fhti = 160 ms，余量只剩 20 ms—— 防抖不是免费的 。 例 b：热失控（min 级，对照） 标准口径：gb 38031-2020（s-02）要求热扩散试验中提供热事件报警并留出乘员逃逸时间（5 min 量级，表述以原文为准）；gb 38031-2025（s-01）进一步强化（细节待核对 p-05）； 预算：ftti ≈ 300 s（按 5 min 口径转译，示意）→ 检测（温升率/电压骤降等热失控征兆算法）fdti ≤ 30 s（示意）+ 报警上报 frti ≤ 5 s（示意）→ fhti = 35 s，余量充足； 对比结论 ：过流 fhti 按毫秒设计，热失控按秒/分钟设计——同一套 bms 两种时间尺度并存，这正是节点约束\"匹配电化学失效速度\"的含义。 4. 工程实态 阈值标定矩阵：阈值随温度×soc×老化变化（ dev-05 ），不是一组常数； 分层防线：bms 软件保护（可标定）→ 硬件比较器兜底（ safe-03 监控通道）→ 熔断器/pyrofuse 等无源最后防线——三层失效模式互不相同； 执行器时间是 frti 的大头：接触器分断数十 ms 量级（示意），选型时纳入预算；ka 级短路交给熔断器/pyrofuse 承担； 确认方式：fhti 用故障注入实测（hil/实车， dev-02/03 ），不是纸面计算。 5. 常见误区 阈值贴着电芯极限设——采集误差（±2 mv 量级，示意）直接吃穿裕量； 防抖拉长求稳——防抖时间在 fhti 预算里，拉太长保护反而失效； 只算软件时间——采样周期、通信延迟、接触器分断、灭弧都要计入； 认为 bms 是唯一防线——熔断器层承担 ms 级 ka 短路，bms 管不到那个速度。 6. 自测 q1 ：fhti 由哪两段构成？设计约束是什么？ q2 ：过流保护链路 fdti=30 ms、frti=50 ms，ftti=200 ms，余量多少？防抖 +70 ms 后还剩多少？ q3 ：为什么热失控报警可以做秒级、而过流必须毫秒级？ 答案 q1：fhti = fdti（检测）+ frti（反应）；约束 fhti &lt; ftti（ftti 由危害发展速度决定，术语源自 iso 26262-1:2018）。 q2：fhti = 80 ms，余量 = 200 − 80 = 120 ms ；防抖 +70 ms → fhti = 150 ms，余量 50 ms 。 q3：危害发展速度不同：过流的热/电磁应力在毫秒级造成损伤（ftti 毫秒级）；热失控从触发到起火是分钟级过程（gb 38031-2020 的 5 min 报警口径），检测算法有余量做秒级运算。 来源 s-02：gb 38031-2020（热扩散试验与报警提前量口径，表述以原文为准） s-01：gb 38031-2025（强化方向，细节待核对 p-05） s-07：iso 26262:2018 part 1（ftti/fhti/fdti/frti 术语定义）及 part 3/4（安全机制与时间约束分配） s-03：gb/t 38661-2020（保护功能的产品要求） 延伸资源（仅列可靠名称，链接待补） 资源 说明 iso 26262:2018 part 1 原文 ftti/fhti 等术语的权威定义 gb 38031-2025 原文 现行国标安全要求（热扩散等条款，p-05 核对） 待核对项（本课） 例 a/例 b 全部时间数字为教学示意值；接触器分断时间与 ka 级短路耐受时间需按器件规格书核对（建议新 p 项） gb 38031-2020\"5 min\"的精确条款表述（报警提前量定义口径），建议并入 p-05 一并核对 "}, {"id": "SAFE-05", "title": "课程 SAFE-05：电池系统网络安全——功能安全的\"前置守门员\"", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-05<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-01\">SAFE-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a> ｜ 预计用时 60 min 数字规则：法规生效时间点以官方文本为准（本课标注待核对）；示例数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么网络安全能\"击穿\"功能安全<\/h3>\n<p>功能安全假设失效是<strong>随机的<\/strong>（元件老化、干扰）；网络安全面对的失效是<strong>故意的、智能的、找最弱点的<\/strong>。攻击者让 BMS 误动作（伪造过充、屏蔽保护），ISO 26262 的随机失效分析完全覆盖不了这种威胁。节点约束：<strong>攻击面含 OBD/OTA/充电口/无线链路；需 CSMS 与入侵检测。<\/strong> 法规已强制：UN R155（S-14）要求车辆型式认证配备 CSMS（Cybersecurity Management System，网络安全管理体系）；UN R156（S-15）管软件升级安全。<\/p>\n<h3>2. 机制展开：攻击面与 TARA<\/h3>\n<p><strong>（1）BMS 的攻击面清单<\/strong>（对应节点约束）<\/p>\n<table><thead><tr><th>攻击面<\/th><th>入口技术<\/th><th>典型威胁<\/th><\/tr><\/thead><tbody><tr><td>OBD 诊断口<\/td><td>UDS（ISO 14229-1，S-09）安全访问服务<\/td><td>弱密钥被破解 → 改阈值/刷固件<\/td><\/tr><tr><td>OTA 升级通道<\/td><td>UN R156（S-15）要求的安全升级<\/td><td>伪造固件、降级攻击（刷回旧漏洞版本）<\/td><\/tr><tr><td>充电口<\/td><td>GB/T 27930（S-05）/ ISO 15118（S-10）<\/td><td>伪造充电机/BMS 报文，篡改功率限值<\/td><\/tr><tr><td>无线链路<\/td><td>wBMS 射频（<code>ARCH-W<\/code>）、TSP 云端通道<\/td><td>中间人、重放、密钥泄露<\/td><\/tr><tr><td>车内总线<\/td><td>CAN 注入（<code>SYS-04<\/code>）<\/td><td>从被攻破的娱乐域横向打到动力域<\/td><\/tr><\/tbody><\/table>\n<p><strong>（2）TARA（Threat Analysis and Risk Assessment，威胁分析与风险评估；ISO/SAE 21434:2021，S-08）<\/strong><\/p>\n<p>流程：资产识别 → 威胁场景识别 → 影响评级（safety/financial/operational/privacy 四维）→ 攻击路径分析 → 攻击可行性评估（要素含耗时、专业知识、装备、窗口期）→ 风险值 → 处置选项（避免/降低/分担/保留）→ 残余风险记录。与 HARA 的关系：<strong>TARA 的 safety 影响喂给功能安全，形成\"网络安全 → 功能安全\"传导链<\/strong>。<\/p>\n<p><strong>（3）纵深防御机制（由外到内逐层）<\/strong>：安全启动（secure boot，固件签名链）→ 访问控制（UDS 安全访问，失败锁定）→ 通信保护（E2E + 报文认证）→ 域隔离/防火墙 → 入侵检测（IDS，节点约束）→ 安全 OTA（R156）。<\/p>\n<h3>3. 工程案例推演：充电限值信号被伪造的 TARA<\/h3>\n<p>场景：攻击者介入充电桩与车辆之间，伪造充电功率限值报文，诱使 BMS 接受超限充电电流。<\/p>\n<table><thead><tr><th>TARA 步骤<\/th><th>本例内容<\/th><\/tr><\/thead><tbody><tr><td>资产<\/td><td>BMS↔充电机的功率限值报文（GB/T 27930 链路）<\/td><\/tr><tr><td>威胁场景<\/td><td>篡改/伪造（spoofing/tampering）限值报文<\/td><\/tr><tr><td>影响评级<\/td><td>safety：过充 → 热失控（对应 SG-01，ASIL D）——<strong>高<\/strong><\/td><\/tr><tr><td>攻击路径<\/td><td>拆解/仿冒充电桩侧接口 → 注入伪造报文<\/td><\/tr><tr><td>攻击可行性<\/td><td>需专用装备+协议知识+物理接近；窗口期长（充电 30~60 min）——中等<\/td><\/tr><tr><td>风险值<\/td><td>高（safety 影响极大）<\/td><\/tr><tr><td>处置<\/td><td>充电报文加源认证/会话密钥；BMS 侧限值合理性自检（对照自身电压/温度状态）<\/td><\/tr><tr><td>残余风险<\/td><td>记录并纳入监控（IDS 规则：限值突变报文告警）<\/td><\/tr><\/tbody><\/table>\n<p>配套数字（教学示意值）：UDS 安全访问连续 3 次密钥错误 → 锁定延迟 10 s；诊断会话超时 5 s。这两个数字同时是<strong>功能安全相关参数<\/strong>——保护功能可被诊断服务修改，诊断写操作需受 ASIL 约束。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>法规节奏：<strong>UN R155 生效时间线已核实（2026-11-06，UNECE 官方文本 R155e.pdf，S-60）<\/strong>——新车型型式认证自 <strong>2022-07<\/strong> 强制，<strong>所有新产车辆<\/strong>自 <strong>2024-07<\/strong> 强制（此前生产的旧型式有过渡条款）——出口欧盟车型必须持 CSMS 证书；<\/li>\n<li><strong>EU CRA 叠加（2026-11-17 核实，S-74）<\/strong>：Cyber Resilience Act 于 2024-12-10 生效，<strong>2026-09-11 起漏洞/事件上报义务已生效<\/strong>（24 h/72 h 上报 ENISA），<strong>2027-12-11 全面适用<\/strong>——含数字元件产品需安全设计、SBOM、漏洞处理，CE 标志成为合规前置。对 BESS/联网 BMS 产品出口欧盟是 R155 之外的<strong>第二层合规<\/strong>；<\/li>\n<li>诊断层：UDS <strong>Authentication 服务（0x29）已核实（2026-11-06，S-61）<\/strong>——由 ISO 14229-1:2020 引入，支持 PKI 证书 + 非对称加密认证，是对 0x27 的现代化补充；AUTOSAR RS_Diagnostics（R20-11）已要求支持；量产仍以 0x27 为主、0x29 依赖 PKI 基础设施落地（观点级）；<\/li>\n<li>组织层：CSMS 覆盖全生命周期（开发 → 生产 → 后生产），OEM 设 VSOC（Vehicle Security Operations Center，车辆安全运营中心）做持续监控与漏洞响应（节点约束的\"持续\"含义）；<\/li>\n<li>项目层：TARA 在概念阶段与 HARA 并行互喂；渗透测试作为验证手段；<\/li>\n<li>供应链：ISO/SAE 21434 专门规范分布式网络安全活动（OEM↔Tier1↔Tier2 的接口协议）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"网络安全=加密\"——加密只护保密性；对 BMS 致命的是完整性（改限值）与可用性（屏蔽报警）；<\/li>\n<li>只防边界不防横向——车内 CAN 是平面网络，一点突破处处可达，必须域隔离；<\/li>\n<li>当一次性项目做——漏洞持续出现，CSMS/IDS/漏洞管理是常设机制（节点约束）；<\/li>\n<li>安全功能自身不设防——IDS/防火墙若可被关闭，就成了新的攻击面；它们的失效同样要进安全分析。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么 ISO 26262 覆盖不了网络安全威胁？ <strong>Q2<\/strong>：TARA 与 HARA 的衔接点在哪里？ <strong>Q3<\/strong>：BMS 诊断服务的\"写阈值\"操作，网络安全上要注意什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：26262 的风险模型基于随机失效与无意缺陷，攻击是故意的、自适应的、寻找最弱点的——需要威胁建模（TARA）与对抗性思维；HARA/FTA/FMEA 不建模\"攻击者\"这个角色。<\/li>\n<li>Q2：TARA 影响评级中的 safety 维度：网络威胁若能引发安全危害（如伪造限值 → 过充），防护需求要与 HARA 的安全目标/ASIL 对齐，形成传导链（本例对应 SG-01）。<\/li>\n<li>Q3：写操作必须经安全访问且受 ASIL 约束；密钥强度/失败锁定防暴力破解；阈值写入后需合理性自检（防越权写入危险值）；写入行为留痕（审计日志）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-08：ISO/SAE 21434:2021（TARA 方法、CSMS、分布式活动）<\/li>\n<li>S-14：UN R155（CSMS 型式认证要求）<\/li>\n<li>S-15：UN R156（软件升级管理体系）<\/li>\n<li>S-09：ISO 14229-1（UDS 安全访问）<\/li>\n<li>S-05/S-10：GB/T 27930 与 ISO 15118（充电链路攻击面）<\/li>\n<li>S-11：ISO 11898（车内总线攻击面语境）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-06 部分链接已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://unece.org/sites/default/files/2023-02/R155e%20%282%29.pdf\" target=\"_blank\" rel=\"noopener\">UNECE UN R155 官方文本（R155e.pdf）<\/a><\/td><td>A<\/td><td>✅<\/td><td>法规原文（S-60）<\/td><\/tr><tr><td><a href=\"https://digital-strategy.ec.europa.eu/en/policies/cyber-resilience-act\" target=\"_blank\" rel=\"noopener\">European Commission：Cyber Resilience Act 页面<\/a><\/td><td>A<\/td><td>✅<\/td><td>CRA 官方口径（S-74）：2026-09-11 报告义务 / 2027-12-11 全面适用<\/td><\/tr><tr><td><a href=\"https://www.autosar.org/fileadmin/standards/R20-11/FO/AUTOSAR_RS_Diagnostics.pdf\" target=\"_blank\" rel=\"noopener\">AUTOSAR RS_Diagnostics（R20-11）<\/a><\/td><td>A<\/td><td>✅<\/td><td>0x29 Authentication 的规范要求（S-61）<\/td><\/tr><tr><td>ISO/SAE 21434:2021 原文<\/td><td>A<\/td><td>—<\/td><td>TARA 与 CSMS 的标准出处（付费）<\/td><\/tr><tr><td>C. Smith, <em>The Car Hacker's Handbook<\/em>（No Starch Press, 2016）<\/td><td>B<\/td><td>—<\/td><td>攻击者视角经典读物<\/td><\/tr><tr><td>Uptane（车载 OTA 安全框架）<\/td><td>B<\/td><td>✅（开源方法论）<\/td><td>OTA 更新安全设计<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~UN R155\"所有新产车辆\"生效时间点~~ → <strong>2026-11-06 已核实<\/strong>（2022-07 新车型 / 2024-07 所有新产车，S-60）。<\/li>\n<li>~~UDS 0x29 在 ISO 14229-1:2020 中的可用性~~ → <strong>2026-11-06 已核实<\/strong>（已引入，S-61）。<\/li>\n<li>案例 TARA 表的评级/可行性判断为教学示意，不代表任何真实车型评估。<\/li>\n<\/ul>", "text": " 对应节点 safe-05 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： safe-01 、 sys-04 ｜ 预计用时 60 min 数字规则：法规生效时间点以官方文本为准（本课标注待核对）；示例数字均为 教学示意值 。 1. 为什么网络安全能\"击穿\"功能安全 功能安全假设失效是 随机的 （元件老化、干扰）；网络安全面对的失效是 故意的、智能的、找最弱点的 。攻击者让 bms 误动作（伪造过充、屏蔽保护），iso 26262 的随机失效分析完全覆盖不了这种威胁。节点约束： 攻击面含 obd/ota/充电口/无线链路；需 csms 与入侵检测。 法规已强制：un r155（s-14）要求车辆型式认证配备 csms（cybersecurity management system，网络安全管理体系）；un r156（s-15）管软件升级安全。 2. 机制展开：攻击面与 tara （1）bms 的攻击面清单 （对应节点约束） 攻击面 入口技术 典型威胁 obd 诊断口 uds（iso 14229-1，s-09）安全访问服务 弱密钥被破解 → 改阈值/刷固件 ota 升级通道 un r156（s-15）要求的安全升级 伪造固件、降级攻击（刷回旧漏洞版本） 充电口 gb/t 27930（s-05）/ iso 15118（s-10） 伪造充电机/bms 报文，篡改功率限值 无线链路 wbms 射频（ arch-w ）、tsp 云端通道 中间人、重放、密钥泄露 车内总线 can 注入（ sys-04 ） 从被攻破的娱乐域横向打到动力域 （2）tara（threat analysis and risk assessment，威胁分析与风险评估；iso/sae 21434:2021，s-08） 流程：资产识别 → 威胁场景识别 → 影响评级（safety/financial/operational/privacy 四维）→ 攻击路径分析 → 攻击可行性评估（要素含耗时、专业知识、装备、窗口期）→ 风险值 → 处置选项（避免/降低/分担/保留）→ 残余风险记录。与 hara 的关系： tara 的 safety 影响喂给功能安全，形成\"网络安全 → 功能安全\"传导链 。 （3）纵深防御机制（由外到内逐层） ：安全启动（secure boot，固件签名链）→ 访问控制（uds 安全访问，失败锁定）→ 通信保护（e2e + 报文认证）→ 域隔离/防火墙 → 入侵检测（ids，节点约束）→ 安全 ota（r156）。 3. 工程案例推演：充电限值信号被伪造的 tara 场景：攻击者介入充电桩与车辆之间，伪造充电功率限值报文，诱使 bms 接受超限充电电流。 tara 步骤 本例内容 资产 bms↔充电机的功率限值报文（gb/t 27930 链路） 威胁场景 篡改/伪造（spoofing/tampering）限值报文 影响评级 safety：过充 → 热失控（对应 sg-01，asil d）—— 高 攻击路径 拆解/仿冒充电桩侧接口 → 注入伪造报文 攻击可行性 需专用装备+协议知识+物理接近；窗口期长（充电 30~60 min）——中等 风险值 高（safety 影响极大） 处置 充电报文加源认证/会话密钥；bms 侧限值合理性自检（对照自身电压/温度状态） 残余风险 记录并纳入监控（ids 规则：限值突变报文告警） 配套数字（教学示意值）：uds 安全访问连续 3 次密钥错误 → 锁定延迟 10 s；诊断会话超时 5 s。这两个数字同时是 功能安全相关参数 ——保护功能可被诊断服务修改，诊断写操作需受 asil 约束。 4. 工程实态 法规节奏： un r155 生效时间线已核实（2026-11-06，unece 官方文本 r155e.pdf，s-60） ——新车型型式认证自 2022-07 强制， 所有新产车辆 自 2024-07 强制（此前生产的旧型式有过渡条款）——出口欧盟车型必须持 csms 证书； eu cra 叠加（2026-11-17 核实，s-74） ：cyber resilience act 于 2024-12-10 生效， 2026-09-11 起漏洞/事件上报义务已生效 （24 h/72 h 上报 enisa）， 2027-12-11 全面适用 ——含数字元件产品需安全设计、sbom、漏洞处理，ce 标志成为合规前置。对 bess/联网 bms 产品出口欧盟是 r155 之外的 第二层合规 ； 诊断层：uds authentication 服务（0x29）已核实（2026-11-06，s-61） ——由 iso 14229-1:2020 引入，支持 pki 证书 + 非对称加密认证，是对 0x27 的现代化补充；autosar rs_diagnostics（r20-11）已要求支持；量产仍以 0x27 为主、0x29 依赖 pki 基础设施落地（观点级）； 组织层：csms 覆盖全生命周期（开发 → 生产 → 后生产），oem 设 vsoc（vehicle security operations center，车辆安全运营中心）做持续监控与漏洞响应（节点约束的\"持续\"含义）； 项目层：tara 在概念阶段与 hara 并行互喂；渗透测试作为验证手段； 供应链：iso/sae 21434 专门规范分布式网络安全活动（oem↔tier1↔tier2 的接口协议）。 5. 常见误区 \"网络安全=加密\"——加密只护保密性；对 bms 致命的是完整性（改限值）与可用性（屏蔽报警）； 只防边界不防横向——车内 can 是平面网络，一点突破处处可达，必须域隔离； 当一次性项目做——漏洞持续出现，csms/ids/漏洞管理是常设机制（节点约束）； 安全功能自身不设防——ids/防火墙若可被关闭，就成了新的攻击面；它们的失效同样要进安全分析。 6. 自测 q1 ：为什么 iso 26262 覆盖不了网络安全威胁？ q2 ：tara 与 hara 的衔接点在哪里？ q3 ：bms 诊断服务的\"写阈值\"操作，网络安全上要注意什么？ 答案 q1：26262 的风险模型基于随机失效与无意缺陷，攻击是故意的、自适应的、寻找最弱点的——需要威胁建模（tara）与对抗性思维；hara/fta/fmea 不建模\"攻击者\"这个角色。 q2：tara 影响评级中的 safety 维度：网络威胁若能引发安全危害（如伪造限值 → 过充），防护需求要与 hara 的安全目标/asil 对齐，形成传导链（本例对应 sg-01）。 q3：写操作必须经安全访问且受 asil 约束；密钥强度/失败锁定防暴力破解；阈值写入后需合理性自检（防越权写入危险值）；写入行为留痕（审计日志）。 来源 s-08：iso/sae 21434:2021（tara 方法、csms、分布式活动） s-14：un r155（csms 型式认证要求） s-15：un r156（软件升级管理体系） s-09：iso 14229-1（uds 安全访问） s-05/s-10：gb/t 27930 与 iso 15118（充电链路攻击面） s-11：iso 11898（车内总线攻击面语境） 延伸资源（2026-11-06 部分链接已核实） 资源 级别 免费 说明 unece un r155 官方文本（r155e.pdf） a ✅ 法规原文（s-60） european commission：cyber resilience act 页面 a ✅ cra 官方口径（s-74）：2026-09-11 报告义务 / 2027-12-11 全面适用 autosar rs_diagnostics（r20-11） a ✅ 0x29 authentication 的规范要求（s-61） iso/sae 21434:2021 原文 a — tara 与 csms 的标准出处（付费） c. smith, the car hacker's handbook （no starch press, 2016） b — 攻击者视角经典读物 uptane（车载 ota 安全框架） b ✅（开源方法论） ota 更新安全设计 待核对项（本课） ~~un r155\"所有新产车辆\"生效时间点~~ → 2026-11-06 已核实 （2022-07 新车型 / 2024-07 所有新产车，s-60）。 ~~uds 0x29 在 iso 14229-1:2020 中的可用性~~ → 2026-11-06 已核实 （已引入，s-61）。 案例 tara 表的评级/可行性判断为教学示意，不代表任何真实车型评估。 "}, {"id": "SAFE-06", "title": "课程 SAFE-06：AI 功能的验证与安全论证——未收敛领域的方法论地图", "dom": "SAFE", "verified": false, "html": "<blockquote><p>对应节点 <code>SAFE-06<\/code>（../domains/02-安全设计.md <span class=\"fileref\">（项目文件 ../domains/02-安全设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-01\">SAFE-01<\/a> ｜ 预计用时 45 min 诚实声明：本节点为 <code>frontier<\/code>、<code>[需补约束]<\/code>——<strong>论证方法未收敛<\/strong>。本课给的是当前可辩护的工程立场，不是标准答案。<\/p><\/blockquote>\n<h3>1. 为什么 AI 需要不同的安全论证<\/h3>\n<p>当 BMS 用神经网络做 SOC/SOH 估计（<code>ALG-02/05<\/code> 的 AI 替代路线）甚至参与安全决策时，传统功能安全验证的两大支柱失灵：<\/p>\n<ol>\n<li><strong>覆盖率思维失灵<\/strong>：软件测试靠分支/语句覆盖逼近完备；神经网络的\"分支\"是连续参数空间里的亿级权重——无法枚举；<\/li>\n<li><strong>规格思维失灵<\/strong>：传统软件有需求规格可对照；AI 从数据中学出行为，<strong>行为没有先验规格<\/strong>——\"对没见过的输入会怎样\"原则上无法静态回答。<\/li>\n<p>ISO 26262（S-07）框架可以管理 AI 组件的<strong>流程<\/strong>（需求、监控、变更管理），但\"如何证明 AI 足够可信用于安全决策\"没有收敛答案——这就是节点挂 <code>[需补约束]<\/code> 的含义，也是它与 <code>DEV-07<\/code>（AI 验证体系）的分工：DEV-07 管\"测什么、怎么测\"（证据供给），本节点管\"凭什么敢用\"（证据消费与结论）。<\/p>\n<\/ol>\n<h3>2. 机制展开：安全论证三要素与三条工程路线<\/h3>\n<p><strong>（1）安全论证（Safety Case）的结构<\/strong>（安全工程通用概念）：主张（Claim）——\"AI 组件用于 X 用途是可接受的\"；论据（Argument）——为什么证据能支撑主张；证据（Evidence）——测试/数据/分析结果。工程上常用 GSN（Goal Structuring Notation，目标结构化记号）画成论证树逐节点评审。<\/p>\n<p><strong>（2）三条工程路线<\/strong>（当前可辩护立场，非标准答案）：<\/p>\n<ul>\n<li><strong>路线① 围栏（Confinement）——首选<\/strong>：AI 不做最终安全决策。输出只进显示/推荐，或必须通过传统安全机制的合理性校验（物理模型守门：AI 说不允许放电，经典 SOP 计算是否自洽？）；<\/li>\n<li><strong>路线② 等效性论证<\/strong>：证明\"AI ≤ 已验证基线的风险\"——同分布测试集上的误差分布对比 + 运行分布代表性论证。弱点：数据漂移使\"同分布\"前提脆弱；<\/li>\n<li><strong>路线③ 运行时包络<\/strong>：定义 AI 可信工作域，域外自动回退传统算法；配 OOD（Out-of-Distribution，分布外）检测器拒识异常输入。<\/li>\n<p><strong>（3）可借鉴的既有框架（2026-11-23 边界核实，P-27 关闭，S-94/S-95）<\/strong>：<strong>ISO 21448:2022（SOTIF）<\/strong>——过程/场景导向，管\"无硬件故障但不安全\"（性能局限与未知场景）；<strong>UL 4600<\/strong>——证据导向的 case-based 安全论证，面向完全自主产品全系统（含 ML），可把 26262/21448 作为论证证据纳入；<strong>ISO/PAS 8800<\/strong>——AI 安全进入汽车安全体系的桥梁标准。三者互补：SOTIF 管功能不足、4600 管论证结构、8800 管 AI 组件本身。<\/p>\n<\/ul>\n<h3>3. 工程案例推演：AI-SOC 用于功率限制的分级论证<\/h3>\n<p><strong>按\"AI 输出离安全决策多近\"分级<\/strong>（分级框架为工程示意）：<\/p>\n<table><thead><tr><th>级别<\/th><th>用途<\/th><th>论证要求<\/th><\/tr><\/thead><tbody><tr><td>L1 显示级<\/td><td>AI-SOC 用于续航显示<\/td><td>常规验证（准确率+用户研究），QM<\/td><\/tr><tr><td>L2 降级建议级<\/td><td>AI-SOH 影响功率限制（SOP）<\/td><td>路线③：可信域+回退；基线对比；保守化偏差设计<\/td><\/tr><tr><td>L3 安全决策级<\/td><td>AI 直接驱动断高压<\/td><td><strong>当前论证路径未收敛<\/strong>——工程上回避此设计<\/td><\/tr><\/tbody><\/table>\n<p>L2 的示意推演：AI-SOC 模型 MAE（Mean Absolute Error，平均绝对误差）1.2%，但 P99 误差 4.5%（均为教学示意值）——<strong>安全论证看尾部不看均值<\/strong>：P99 的 4.5% 误差经 SOP 公式传导后是否越出电芯安全边界？落法：SOP 计算始终叠加保守裕量（AI 误差按 P99 包络），AI 只\"收紧\"不\"放宽\"——<strong>错误方向单调化<\/strong>，是路线①③的组合。OOD 示意：训练集温度下限 −20°C，实车遇 −25°C → 拒识 → 回退安时积分+OCV（<code>ALG-01<\/code>）。回退不是降级，是设计好的常态机制。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产现状（工程观察）：车端安全关键路径仍是传统算法；AI/数字孪生集中在云端诊断、维保推荐、标定辅助（<code>GEN-2/3<\/code>）——与路线①一致；<\/li>\n<li>文献前沿：S-21（SAE 2026-26-0382，AI/ML 与数字孪生在 BMS 的角色，全文待 P-11）、S-22（Frontiers 数字孪生综述）、S-23（MDPI 综述，注意期刊声誉备注）——均为候选证据，读完后回填节点 <code>[需补约束]<\/code>；<\/li>\n<li>数据闭环（<code>DEV-06<\/code>）同时是 AI 的训练来源与 OOD 监控的分布参考；<\/li>\n<li>与 GEN-3 的关联：AI/数字孪生预测型 BMS 的安全侧论证正是本节点（<code>00-跨域层<\/code>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"准确率 99% 所以安全\"——安全关切在尾部分布与漂移场景，均值毫无证明力；<\/li>\n<li>把测试集精度当运行时保证——实车分布 ≠ 训练分布（新化学体系、新工况、老化漂移）；<\/li>\n<li>混淆 DEV-07 与 SAFE-06——\"验证指标达标\"不等于\"安全论证成立\"；<\/li>\n<li>认为 ISO 26262 写了 AI 怎么认证——标准 2018 版没有 AI 专项；S-21 等是候选文献不是规范（P-11 待核对）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么传统覆盖率指标对神经网络失效？ <strong>Q2<\/strong>：路线①\"围栏\"的工程含义是什么？ <strong>Q3<\/strong>：L2 级 AI-SOC 影响 SOP 时，\"错误方向单调化\"指什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：分支覆盖假设控制流可枚举；NN 的行为由连续权重决定，输入空间连续且无先验规格，\"覆盖\"无法定义完备性。<\/li>\n<li>Q2：AI 不拥有最终安全决策权：输出要么只到显示/建议层，要么必须经传统安全机制的合理性校验（物理守门）才能影响控制。<\/li>\n<li>Q3：AI 误差只允许导致\"更保守\"（功率限得更低），不允许\"更激进\"；通过按 P99 误差包络的保守裕量实现——把\"双向精度\"的验证问题简化为\"单向上界\"问题。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-21：SAE 2026-26-0382（候选证据，全文待核对 P-11）<\/li>\n<li>S-22：\"Digital twin technologies for battery systems\", Frontiers in Batteries and Electrochemistry（候选证据）<\/li>\n<li>S-23：AI/Digital Twin for BMS, MDPI《Batteries》11/8/298（候选证据，注意期刊声誉备注）<\/li>\n<li>S-07：ISO 26262:2018（流程框架与软件工具置信度思路的借鉴来源）<\/li>\n<li>ISO 21448:2022（SOTIF）：标准编号原文（未登记 S 编号，按标准原文引用）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 21448:2022（SOTIF）原文<\/td><td>预期功能安全——AI 性能局限分析的方法来源<\/td><\/tr><tr><td>UL 4600（自主产品安全评估标准）<\/td><td>case-based 安全论证的结构参照<\/td><\/tr><tr><td>GSN Community Standard（GSN 社区标准）<\/td><td>目标结构化记号——画安全论证树的标准记法<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>S-21 全文获取与蒸馏（已有 P-11）；S-22/S-23 结论细节核对后回填节点约束<\/li>\n<li>L1/L2/L3 分级框架与 MAE/P99 数字均为教学示意值，无文献出处（若后续文献支持需回填）<\/li>\n<li>~~ISO 21448 与 UL 4600 的适用边界~~ → <strong>2026-11-23 已核实<\/strong>（S-94/S-95）：SOTIF 过程导向 vs UL 4600 论证导向，互补而非竞争；ISO/PAS 8800 为 AI 组件桥梁<\/li>\n<\/ul>", "text": " 对应节点 safe-06 （../domains/02-安全设计.md （项目文件 ../domains/02-安全设计.md） ）｜ 前置： safe-01 ｜ 预计用时 45 min 诚实声明：本节点为 frontier 、 [需补约束] —— 论证方法未收敛 。本课给的是当前可辩护的工程立场，不是标准答案。 1. 为什么 ai 需要不同的安全论证 当 bms 用神经网络做 soc/soh 估计（ alg-02/05 的 ai 替代路线）甚至参与安全决策时，传统功能安全验证的两大支柱失灵： 覆盖率思维失灵 ：软件测试靠分支/语句覆盖逼近完备；神经网络的\"分支\"是连续参数空间里的亿级权重——无法枚举； 规格思维失灵 ：传统软件有需求规格可对照；ai 从数据中学出行为， 行为没有先验规格 ——\"对没见过的输入会怎样\"原则上无法静态回答。 iso 26262（s-07）框架可以管理 ai 组件的 流程 （需求、监控、变更管理），但\"如何证明 ai 足够可信用于安全决策\"没有收敛答案——这就是节点挂 [需补约束] 的含义，也是它与 dev-07 （ai 验证体系）的分工：dev-07 管\"测什么、怎么测\"（证据供给），本节点管\"凭什么敢用\"（证据消费与结论）。 2. 机制展开：安全论证三要素与三条工程路线 （1）安全论证（safety case）的结构 （安全工程通用概念）：主张（claim）——\"ai 组件用于 x 用途是可接受的\"；论据（argument）——为什么证据能支撑主张；证据（evidence）——测试/数据/分析结果。工程上常用 gsn（goal structuring notation，目标结构化记号）画成论证树逐节点评审。 （2）三条工程路线 （当前可辩护立场，非标准答案）： 路线① 围栏（confinement）——首选 ：ai 不做最终安全决策。输出只进显示/推荐，或必须通过传统安全机制的合理性校验（物理模型守门：ai 说不允许放电，经典 sop 计算是否自洽？）； 路线② 等效性论证 ：证明\"ai ≤ 已验证基线的风险\"——同分布测试集上的误差分布对比 + 运行分布代表性论证。弱点：数据漂移使\"同分布\"前提脆弱； 路线③ 运行时包络 ：定义 ai 可信工作域，域外自动回退传统算法；配 ood（out-of-distribution，分布外）检测器拒识异常输入。 （3）可借鉴的既有框架（2026-11-23 边界核实，p-27 关闭，s-94/s-95） ： iso 21448:2022（sotif） ——过程/场景导向，管\"无硬件故障但不安全\"（性能局限与未知场景）； ul 4600 ——证据导向的 case-based 安全论证，面向完全自主产品全系统（含 ml），可把 26262/21448 作为论证证据纳入； iso/pas 8800 ——ai 安全进入汽车安全体系的桥梁标准。三者互补：sotif 管功能不足、4600 管论证结构、8800 管 ai 组件本身。 3. 工程案例推演：ai-soc 用于功率限制的分级论证 按\"ai 输出离安全决策多近\"分级 （分级框架为工程示意）： 级别 用途 论证要求 l1 显示级 ai-soc 用于续航显示 常规验证（准确率+用户研究），qm l2 降级建议级 ai-soh 影响功率限制（sop） 路线③：可信域+回退；基线对比；保守化偏差设计 l3 安全决策级 ai 直接驱动断高压 当前论证路径未收敛 ——工程上回避此设计 l2 的示意推演：ai-soc 模型 mae（mean absolute error，平均绝对误差）1.2%，但 p99 误差 4.5%（均为教学示意值）—— 安全论证看尾部不看均值 ：p99 的 4.5% 误差经 sop 公式传导后是否越出电芯安全边界？落法：sop 计算始终叠加保守裕量（ai 误差按 p99 包络），ai 只\"收紧\"不\"放宽\"—— 错误方向单调化 ，是路线①③的组合。ood 示意：训练集温度下限 −20°c，实车遇 −25°c → 拒识 → 回退安时积分+ocv（ alg-01 ）。回退不是降级，是设计好的常态机制。 4. 工程实态 量产现状（工程观察）：车端安全关键路径仍是传统算法；ai/数字孪生集中在云端诊断、维保推荐、标定辅助（ gen-2/3 ）——与路线①一致； 文献前沿：s-21（sae 2026-26-0382，ai/ml 与数字孪生在 bms 的角色，全文待 p-11）、s-22（frontiers 数字孪生综述）、s-23（mdpi 综述，注意期刊声誉备注）——均为候选证据，读完后回填节点 [需补约束] ； 数据闭环（ dev-06 ）同时是 ai 的训练来源与 ood 监控的分布参考； 与 gen-3 的关联：ai/数字孪生预测型 bms 的安全侧论证正是本节点（ 00-跨域层 ）。 5. 常见误区 \"准确率 99% 所以安全\"——安全关切在尾部分布与漂移场景，均值毫无证明力； 把测试集精度当运行时保证——实车分布 ≠ 训练分布（新化学体系、新工况、老化漂移）； 混淆 dev-07 与 safe-06——\"验证指标达标\"不等于\"安全论证成立\"； 认为 iso 26262 写了 ai 怎么认证——标准 2018 版没有 ai 专项；s-21 等是候选文献不是规范（p-11 待核对）。 6. 自测 q1 ：为什么传统覆盖率指标对神经网络失效？ q2 ：路线①\"围栏\"的工程含义是什么？ q3 ：l2 级 ai-soc 影响 sop 时，\"错误方向单调化\"指什么？ 答案 q1：分支覆盖假设控制流可枚举；nn 的行为由连续权重决定，输入空间连续且无先验规格，\"覆盖\"无法定义完备性。 q2：ai 不拥有最终安全决策权：输出要么只到显示/建议层，要么必须经传统安全机制的合理性校验（物理守门）才能影响控制。 q3：ai 误差只允许导致\"更保守\"（功率限得更低），不允许\"更激进\"；通过按 p99 误差包络的保守裕量实现——把\"双向精度\"的验证问题简化为\"单向上界\"问题。 来源 s-21：sae 2026-26-0382（候选证据，全文待核对 p-11） s-22：\"digital twin technologies for battery systems\", frontiers in batteries and electrochemistry（候选证据） s-23：ai/digital twin for bms, mdpi《batteries》11/8/298（候选证据，注意期刊声誉备注） s-07：iso 26262:2018（流程框架与软件工具置信度思路的借鉴来源） iso 21448:2022（sotif）：标准编号原文（未登记 s 编号，按标准原文引用） 延伸资源（仅列可靠名称，链接待补） 资源 说明 iso 21448:2022（sotif）原文 预期功能安全——ai 性能局限分析的方法来源 ul 4600（自主产品安全评估标准） case-based 安全论证的结构参照 gsn community standard（gsn 社区标准） 目标结构化记号——画安全论证树的标准记法 待核对项（本课） s-21 全文获取与蒸馏（已有 p-11）；s-22/s-23 结论细节核对后回填节点约束 l1/l2/l3 分级框架与 mae/p99 数字均为教学示意值，无文献出处（若后续文献支持需回填） ~~iso 21448 与 ul 4600 的适用边界~~ → 2026-11-23 已核实 （s-94/s-95）：sotif 过程导向 vs ul 4600 论证导向，互补而非竞争；iso/pas 8800 为 ai 组件桥梁 "}, {"id": "SW-01", "title": "课程 SW-01：软件架构——AUTOSAR CP 与裸机两条路", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-01<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么架构是\"集成边界的合同\"<\/h3>\n<p>BMS 软件是三件事的合体：采集与算法、整车通信、安全机制。架构（Architecture）回答的不是\"怎么写代码\"，而是<strong>\"谁和谁通过什么接口说话、换一家供应商要换多少东西\"<\/strong>。节点约束点题：<strong>AUTOSAR CP 利于主机厂集成但资源占用高；裸机平台需自证安全机制<\/strong>。这也是\"电池厂 vs 主机厂集成边界\"争论（compare/matrix.md）的技术底座——架构选型就是商业边界的落笔。<\/p>\n<h3>2. 机制展开：两条路线逐层看<\/h3>\n<p><strong>（1）AUTOSAR CP（Classic Platform）路线——分层标准化<\/strong><\/p>\n<table><thead><tr><th>层<\/th><th>内容<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>MCAL（Microcontroller Abstraction Layer，微控制器抽象层）<\/td><td>芯片外设驱动（ADC/SPI/_CAN/定时器）<\/td><td>换 MCU 只换这层<\/td><\/tr><tr><td>BSW（Basic Software，基础软件）<\/td><td>OS、CanIf/CanTP、PduR、COM、NM、Dcm/Dem（诊断）、NvM（存储）、Csm（加密）<\/td><td>标准化中间件，配置生成<\/td><\/tr><tr><td>RTE（Runtime Environment，运行时环境）<\/td><td>SWC 之间/与 BSW 的接口胶水<\/td><td>应用与平台解耦<\/td><\/tr><tr><td>SWC（Software Component，软件组件）<\/td><td>BMS 应用：SOC 算法、状态机、保护逻辑<\/td><td>电池厂核心资产<\/td><\/tr><\/tbody><\/table>\n<p>价值：主机厂拿到标准接口的 BMS，可换 Tier1 而不动整车侧；代价：BSW 资源占用大、配置工程量大、许可费用。<\/p>\n<p><strong>（2）裸机/自研路线——前后台或轻量 RTOS<\/strong><\/p>\n<ul>\n<li>前后台：主循环轮询 + 中断采集，简单直接、资源极省；<\/li>\n<li>轻量 RTOS + 自研中间件：调度有保障，但通信栈、诊断栈、存储管理全要自己做；<\/li>\n<li><strong>安全机制要自证<\/strong>：ISO 26262（S-07）不关心你用不用 AUTOSAR，关心的是\"程序流监控、E2E 保护、存储保护、看门狗\"这些机制有没有、证据全不全——自研路线的安全论证成本常被低估。<\/li>\n<p><strong>（3）混合形态（量产常见）<\/strong>：AUTOSAR BSW 做通信/诊断 + 自研 SWC 装算法——两头占，但集成与配置能力要齐备。<\/p>\n<\/ul>\n<h3>3. 手算实例：RAM/Flash 资源预算<\/h3>\n<p>设 ASIL 级 BMS 主控，MCU RAM 128 KB、Flash 1 MB（示意档位），CP 方案预算（教学示意值）：<\/p>\n<table><thead><tr><th>模块<\/th><th>RAM<\/th><\/tr><\/thead><tbody><tr><td>OS + 栈（多任务各自栈）<\/td><td>8 KB<\/td><\/tr><tr><td>BSW（COM/NM/诊断/存储管理）<\/td><td>30 KB<\/td><\/tr><tr><td>RTE<\/td><td>3 KB<\/td><\/tr><tr><td>应用 SWC（算法缓冲、状态）<\/td><td>45 KB<\/td><\/tr><tr><td><strong>合计<\/strong><\/td><td><strong>86 KB → 占用 67%<\/strong><\/td><\/tr><\/tbody><\/table>\n<ul>\n<li>67% 已逼近工程警戒线（余量需留给故障模式下的记录与降级，参考 <a class=\"xlink\" href=\"#/lesson/HW-02\">HW-02<\/a> 的余量逻辑）；<\/li>\n<li>Flash 侧：MCAL + BSW 典型占数百 KB（示意 450 KB），加应用后 1 MB 档位紧张——<strong>这就是\"AUTOSAR CP 资源占用高\"的量化含义<\/strong>：CP 路线基本锁定 512 KB~1 MB Flash、128 KB+ RAM 的 MCU 档位，裸机路线 64 KB Flash / 8 KB RAM 也能做从控板（示意量级）；<\/li>\n<li>选型规则：预算表按\"稳态 + 故障降级态\"各做一份，取大者。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产两条路线长期并存（工程共识）：从控板/低端包用裸机或轻量自研，主控/平台化项目用 CP；<\/li>\n<li>OEM 的接口规范（通信矩阵、诊断需求）决定下限：要求 UDS 全服务 + AUTOSAR 接口时，自研路线的\"自证\"成本可能反超 CP；<\/li>\n<li>T/CAAMTB 团标《电动汽车用电池管理系统设计规范》（S-19，编号待核对 P-01）代表行业对架构分层的规范化尝试；<\/li>\n<li>架构评审要过 ISO 26262-6 的软件架构原则（分层、低耦合、可验证性，S-07）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"用了 AUTOSAR 就安全了\"——CP 提供的是<strong>机制的标准位置<\/strong>（Dem/Dcm/NvM 等），机制本身要配置和开发，证据要自己攒；<\/li>\n<li>\"裸机便宜\"——只算资源不算安全论证与长期维护，自研诊断栈的 bug 修复成本远超许可费；<\/li>\n<li>把算法塞进 BSW 层——RTE 接口被私有化，平台复用性归零；<\/li>\n<li>RTE 全家桶配置——只用得上几个端口的 SWC 却生成整套 RTE，RAM 白烧。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：本课示意预算下，SWC RAM 从 45 KB 涨到 60 KB，总占用多少？该不该换更大 MCU？ <strong>Q2<\/strong>：为什么\"换 MCU 只换 MCAL\"对电池厂是卖点？ <strong>Q3<\/strong>：裸机路线要自证的安全机制至少列四项。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：86 − 45 + 60 = 101 KB → <strong>79%<\/strong>，超 67% 警戒且几乎吃光余量；应换更大 RAM 档位或砍 BSW 配置。<\/li>\n<li>Q2：算法 SWC 不动就能迁移到新芯片平台——电池厂的核心资产（算法）获得平台无关性，谈判时换芯不受制于人。<\/li>\n<li>Q3：程序流监控（看门狗/问答式）、E2E 保护（计数器+CRC）、RAM/Flash 完整性（ECC/测试）、存储保护（MPU 分区）、中断与栈溢出防护（任答四项即可）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（Part 6 软件架构要求与安全机制原则）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 产品级要求）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（编号待核对，P-01）<\/li>\n<li>本课资源预算数字均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>AUTOSAR Classic Platform 标准文本<\/td><td>A<\/td><td>分层与模块规范的一手来源（autosar.org 发布）<\/td><\/tr><tr><td>COMASSO 基础软件套件<\/td><td>B<\/td><td>业界开源 AUTOSAR BSW 参考实现<\/td><\/tr><tr><td>ISO 26262:2018 Part 6 原文<\/td><td>A<\/td><td>软件架构设计原则<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>AUTOSAR CP BSW 资源占用的公开基准数据（本课 30 KB RAM / 450 KB Flash 为示意量级）<\/li>\n<li>S-19 团标编号与年份（对应 P-01，勿在本课写入新结论）<\/li>\n<li>量产 BMS 主控/从控的架构路线分布统计（\"两条路线并存\"为工程共识表述）<\/li>\n<\/ul>", "text": " 对应节点 sw-01 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sys-02 、 sys-04 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么架构是\"集成边界的合同\" bms 软件是三件事的合体：采集与算法、整车通信、安全机制。架构（architecture）回答的不是\"怎么写代码\"，而是 \"谁和谁通过什么接口说话、换一家供应商要换多少东西\" 。节点约束点题： autosar cp 利于主机厂集成但资源占用高；裸机平台需自证安全机制 。这也是\"电池厂 vs 主机厂集成边界\"争论（compare/matrix.md）的技术底座——架构选型就是商业边界的落笔。 2. 机制展开：两条路线逐层看 （1）autosar cp（classic platform）路线——分层标准化 层 内容 作用 mcal（microcontroller abstraction layer，微控制器抽象层） 芯片外设驱动（adc/spi/_can/定时器） 换 mcu 只换这层 bsw（basic software，基础软件） os、canif/cantp、pdur、com、nm、dcm/dem（诊断）、nvm（存储）、csm（加密） 标准化中间件，配置生成 rte（runtime environment，运行时环境） swc 之间/与 bsw 的接口胶水 应用与平台解耦 swc（software component，软件组件） bms 应用：soc 算法、状态机、保护逻辑 电池厂核心资产 价值：主机厂拿到标准接口的 bms，可换 tier1 而不动整车侧；代价：bsw 资源占用大、配置工程量大、许可费用。 （2）裸机/自研路线——前后台或轻量 rtos 前后台：主循环轮询 + 中断采集，简单直接、资源极省； 轻量 rtos + 自研中间件：调度有保障，但通信栈、诊断栈、存储管理全要自己做； 安全机制要自证 ：iso 26262（s-07）不关心你用不用 autosar，关心的是\"程序流监控、e2e 保护、存储保护、看门狗\"这些机制有没有、证据全不全——自研路线的安全论证成本常被低估。 （3）混合形态（量产常见） ：autosar bsw 做通信/诊断 + 自研 swc 装算法——两头占，但集成与配置能力要齐备。 3. 手算实例：ram/flash 资源预算 设 asil 级 bms 主控，mcu ram 128 kb、flash 1 mb（示意档位），cp 方案预算（教学示意值）： 模块 ram os + 栈（多任务各自栈） 8 kb bsw（com/nm/诊断/存储管理） 30 kb rte 3 kb 应用 swc（算法缓冲、状态） 45 kb 合计 86 kb → 占用 67% 67% 已逼近工程警戒线（余量需留给故障模式下的记录与降级，参考 hw-02 的余量逻辑）； flash 侧：mcal + bsw 典型占数百 kb（示意 450 kb），加应用后 1 mb 档位紧张—— 这就是\"autosar cp 资源占用高\"的量化含义 ：cp 路线基本锁定 512 kb~1 mb flash、128 kb+ ram 的 mcu 档位，裸机路线 64 kb flash / 8 kb ram 也能做从控板（示意量级）； 选型规则：预算表按\"稳态 + 故障降级态\"各做一份，取大者。 4. 工程实态 量产两条路线长期并存（工程共识）：从控板/低端包用裸机或轻量自研，主控/平台化项目用 cp； oem 的接口规范（通信矩阵、诊断需求）决定下限：要求 uds 全服务 + autosar 接口时，自研路线的\"自证\"成本可能反超 cp； t/caamtb 团标《电动汽车用电池管理系统设计规范》（s-19，编号待核对 p-01）代表行业对架构分层的规范化尝试； 架构评审要过 iso 26262-6 的软件架构原则（分层、低耦合、可验证性，s-07）。 5. 常见误区 \"用了 autosar 就安全了\"——cp 提供的是 机制的标准位置 （dem/dcm/nvm 等），机制本身要配置和开发，证据要自己攒； \"裸机便宜\"——只算资源不算安全论证与长期维护，自研诊断栈的 bug 修复成本远超许可费； 把算法塞进 bsw 层——rte 接口被私有化，平台复用性归零； rte 全家桶配置——只用得上几个端口的 swc 却生成整套 rte，ram 白烧。 6. 自测 q1 ：本课示意预算下，swc ram 从 45 kb 涨到 60 kb，总占用多少？该不该换更大 mcu？ q2 ：为什么\"换 mcu 只换 mcal\"对电池厂是卖点？ q3 ：裸机路线要自证的安全机制至少列四项。 答案 q1：86 − 45 + 60 = 101 kb → 79% ，超 67% 警戒且几乎吃光余量；应换更大 ram 档位或砍 bsw 配置。 q2：算法 swc 不动就能迁移到新芯片平台——电池厂的核心资产（算法）获得平台无关性，谈判时换芯不受制于人。 q3：程序流监控（看门狗/问答式）、e2e 保护（计数器+crc）、ram/flash 完整性（ecc/测试）、存储保护（mpu 分区）、中断与栈溢出防护（任答四项即可）。 来源 s-07：iso 26262:2018（part 6 软件架构要求与安全机制原则） s-03：gb/t 38661-2020（bms 产品级要求） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（编号待核对，p-01） 本课资源预算数字均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 autosar classic platform 标准文本 a 分层与模块规范的一手来源（autosar.org 发布） comasso 基础软件套件 b 业界开源 autosar bsw 参考实现 iso 26262:2018 part 6 原文 a 软件架构设计原则 待核对项（本课） autosar cp bsw 资源占用的公开基准数据（本课 30 kb ram / 450 kb flash 为示意量级） s-19 团标编号与年份（对应 p-01，勿在本课写入新结论） 量产 bms 主控/从控的架构路线分布统计（\"两条路线并存\"为工程共识表述） "}, {"id": "SW-02", "title": "课程 SW-02：OS 与任务调度——分层周期与 WCET 验证", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-02<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-01\">SW-01<\/a> ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；调度理论的结论（RM 上界、RTA）为经典实时系统理论。<\/p><\/blockquote>\n<h3>1. 为什么调度是\"隐形的保护功能\"<\/h3>\n<p>节点约束点题：<strong>典型采样 10~100 ms / 算法 10 ms~1 s 分层；需 WCET（Worst-Case Execution Time，最坏执行时间）验证<\/strong>。调度错的症状不是崩溃，而是<strong>慢<\/strong>：采样任务被饿死 → 数据断档 → SOC 跳变；保护环超期 → 过流响应晚一拍。调度设计就是把\"每件事都在截止期前做完\"变成<strong>可证明<\/strong>的结论，而不是\"测试时没出问题\"。<\/p>\n<h3>2. 机制展开：OSEK/AUTOSAR OS 的调度模型<\/h3>\n<p><strong>（1）固定优先级抢占调度<\/strong>：每个任务静态分配优先级，高优先级随时打断低优先级。中断高于一切任务；任务内只做\"取数、算、置标志\"，重活推迟到任务级（防中断里做算法）。<\/p>\n<p><strong>（2）任务分层表（教学示意值）<\/strong><\/p>\n<table><thead><tr><th>任务<\/th><th>功能<\/th><th>周期 T<\/th><th>WCET C<\/th><th>截止期 D<\/th><\/tr><\/thead><tbody><tr><td>τ1<\/td><td>AFE 数据搬运与校验<\/td><td>1 ms<\/td><td>0.15 ms<\/td><td>1 ms<\/td><\/tr><tr><td>τ2<\/td><td>保护/控制环<\/td><td>10 ms<\/td><td>1.5 ms<\/td><td>10 ms<\/td><\/tr><tr><td>τ3<\/td><td>SOC/SOP 算法<\/td><td>100 ms<\/td><td>8 ms<\/td><td>100 ms<\/td><\/tr><tr><td>τ4<\/td><td>诊断、记录、通信管理<\/td><td>1000 ms<\/td><td>20 ms<\/td><td>1000 ms<\/td><\/tr><\/tbody><\/table>\n<p>分层节奏与节点约束（采样 10~100 ms / 算法 10 ms~1 s 分层）对应；周期越短优先级越高（速率单调 RM 排序法）。<\/p>\n<p><strong>（3）Alarm/计数器驱动<\/strong>：硬件定时器计数器驱动 Alarm，按表激活任务——周期由硬件保证，不靠软件延时（软件 delay 不可证明）。<\/p>\n<p><strong>（4）基础任务 vs 扩展任务<\/strong>：基础任务一口气跑完（可证明性好）；扩展任务可阻塞等待事件（表达力强但分析变难）。安全关键路径倾向基础任务。<\/p>\n<h3>3. 手算实例：可调度性两层验证<\/h3>\n<p><strong>第一层 — 利用率上界（快速筛查）<\/strong>：U = ΣC/T = 0.15 + 0.15 + 0.08 + 0.02 = <strong>0.40<\/strong> RM 充分条件：U ≤ n(2^(1/n) − 1)，n = 4：U_max = 4 × (2^0.25 − 1) ≈ <strong>0.757<\/strong>。0.40 &lt; 0.757 → 初筛通过 ✓（适用前提：D = T、任务独立、全抢占、固定优先级）。<\/p>\n<p><strong>第二层 — 响应时间分析（RTA，正式验证）<\/strong>：任务 i 的最坏响应 R_i = C_i + Σ⌈R_i/T_h⌉ × C_h（h 为更高优先级任务），迭代到不动点。以 τ4（最低优先级）为例：<\/p>\n<ul>\n<li>初值 R₀ = C₄ = 20 ms<\/li>\n<li>R₁ = 20 + ⌈20/1⌉×0.15 + ⌈20/10⌉×1.5 + ⌈20/100⌉×8 = 20 + 3.0 + 3.0 + 8 = <strong>34 ms<\/strong><\/li>\n<li>R₂ = 20 + ⌈34/1⌉×0.15 + ⌈34/10⌉×1.5 + ⌈34/100⌉×8 = 20 + 5.1 + 6.0 + 8 = <strong>39.1 ms<\/strong><\/li>\n<li>R₃ = 20 + ⌈39.1⌉×0.15 + ⌈39.1/10⌉×1.5 + 8 = 20 + 6.0 + 6.0 + 8 = <strong>40 ms<\/strong><\/li>\n<li>R₄ = 20 + 6.0 + 6.0 + 8 = <strong>40 ms<\/strong> → 不动点，R₄ = 40 ms ≤ D₄ = 1000 ms ✓（余量 25 倍）<\/li>\n<p>同理可验 τ3（R₃ = 12.95 ms ≤ 100 ms ✓）。<strong>结论：本任务集可调度<\/strong>——注意 U = 0.40 但最低优先级任务的最坏响应已放大到 WCET 的 2 倍，这就是只用\"利用率感觉\"判断的风险。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>WCET 三种来源：静态分析（工具）、测量（示波器/GPIO 翻转 + 全边界激励）、厂商基准——正式证据要求覆盖所有分支（含故障分支），ISO 26262-6 要求 WCET 与栈深有分析证据（S-07）；<\/li>\n<li>栈深分析同法：每任务栈 + 中断嵌套最深栈求和，配栈溢出检测（MPU 水位线）；<\/li>\n<li>抖动管理：采样任务被抢占导致采集时刻抖动，影响滤波与差分计算——高精度同步场景用 ScheduleTable 或提高采样任务优先级；<\/li>\n<li>故障降级态要重跑调度分析：故障时记录/诊断任务变多，往往才是最坏时刻。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>用 U &lt; 1 判断\"可调度\"——利用率 90% 的任务集照样有任务错过截止期，正式结论必须 RTA；<\/li>\n<li>裸机大循环\"顺序执行万事大吉\"——轮询无截止期保证，慢一环全线后移；<\/li>\n<li>中断服务程序里做算法/发报文——高优先级中断被拉长，整表响应崩坏；<\/li>\n<li>优先级按\"直觉重要性\"定——应按周期/截止期（RM/DM 法）定，直觉排序会造出不可调度集。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：τ2 的 WCET 涨到 2.5 ms 后，U 变多少？初筛还过吗？ <strong>Q2<\/strong>：为什么采样任务（τ1）周期最短就要给最高优先级？ <strong>Q3<\/strong>：RTA 里 ⌈R/T⌉ 的含义是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：U = 0.15 + 0.25 + 0.08 + 0.02 = <strong>0.50<\/strong>，仍 &lt; 0.757 初筛通过；但需重跑 RTA 才能给正式结论。<\/li>\n<li>Q2：RM 理论最优性：周期短（截止期紧）的任务优先级高时任务集可调度性最好；且采样是所有下游的输入源，晚一拍污染全体。<\/li>\n<li>Q3：在响应窗口 R 内，更高优先级任务 h 会抢占 ⌈R/T_h⌉ 次，每次干扰 C_h——即\"窗口内最坏被插队次数\"。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（Part 6：WCET/栈深分析证据要求）<\/li>\n<li>本域节点约束：采样 10~100 ms / 算法 10 ms~1 s 分层（骨架定义，量级示意）<\/li>\n<li>RM 上界与 RTA 为经典实时调度理论结论；任务表数字为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>OSEK/VDX Operating Specification 2.2.3<\/td><td>A<\/td><td>AUTOSAR OS 的前身，汽车嵌入式 OS 经典规范<\/td><\/tr><tr><td>AUTOSAR OS 模块规范（Specification of Operating System）<\/td><td>A<\/td><td>任务/Alarm/ScheduleTable 的正式定义<\/td><\/tr><tr><td>Liu &amp; Layland (1973), <em>JACM<\/em> 固定优先级调度经典论文<\/td><td>A<\/td><td>RM/DM 上界的原始文献<\/td><\/tr><tr><td>Joseph &amp; Pandya (1986) 响应时间分析论文<\/td><td>A<\/td><td>RTA 迭代法的原始文献<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>节点约束\"采样 10~100 ms / 算法 10 ms~1 s\"的出处即本域骨架（v0.1.0），量级为示意，建议补文献<\/li>\n<li>RM 充分条件在含非抢占段/共享资源（互斥锁）场景需用扩展 RTA（含阻塞项 b），正式设计勿直接套用<\/li>\n<li>WCET 静态分析工具在 AUTOSAR 生态的常用清单（本课未点名，避免广告嫌疑）<\/li>\n<\/ul>", "text": " 对应节点 sw-02 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sw-01 ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；调度理论的结论（rm 上界、rta）为经典实时系统理论。 1. 为什么调度是\"隐形的保护功能\" 节点约束点题： 典型采样 10~100 ms / 算法 10 ms~1 s 分层；需 wcet（worst-case execution time，最坏执行时间）验证 。调度错的症状不是崩溃，而是 慢 ：采样任务被饿死 → 数据断档 → soc 跳变；保护环超期 → 过流响应晚一拍。调度设计就是把\"每件事都在截止期前做完\"变成 可证明 的结论，而不是\"测试时没出问题\"。 2. 机制展开：osek/autosar os 的调度模型 （1）固定优先级抢占调度 ：每个任务静态分配优先级，高优先级随时打断低优先级。中断高于一切任务；任务内只做\"取数、算、置标志\"，重活推迟到任务级（防中断里做算法）。 （2）任务分层表（教学示意值） 任务 功能 周期 t wcet c 截止期 d τ1 afe 数据搬运与校验 1 ms 0.15 ms 1 ms τ2 保护/控制环 10 ms 1.5 ms 10 ms τ3 soc/sop 算法 100 ms 8 ms 100 ms τ4 诊断、记录、通信管理 1000 ms 20 ms 1000 ms 分层节奏与节点约束（采样 10~100 ms / 算法 10 ms~1 s 分层）对应；周期越短优先级越高（速率单调 rm 排序法）。 （3）alarm/计数器驱动 ：硬件定时器计数器驱动 alarm，按表激活任务——周期由硬件保证，不靠软件延时（软件 delay 不可证明）。 （4）基础任务 vs 扩展任务 ：基础任务一口气跑完（可证明性好）；扩展任务可阻塞等待事件（表达力强但分析变难）。安全关键路径倾向基础任务。 3. 手算实例：可调度性两层验证 第一层 — 利用率上界（快速筛查） ：u = σc/t = 0.15 + 0.15 + 0.08 + 0.02 = 0.40 rm 充分条件：u ≤ n(2^(1/n) − 1)，n = 4：u_max = 4 × (2^0.25 − 1) ≈ 0.757 。0.40 &lt; 0.757 → 初筛通过 ✓（适用前提：d = t、任务独立、全抢占、固定优先级）。 第二层 — 响应时间分析（rta，正式验证） ：任务 i 的最坏响应 r_i = c_i + σ⌈r_i/t_h⌉ × c_h（h 为更高优先级任务），迭代到不动点。以 τ4（最低优先级）为例： 初值 r₀ = c₄ = 20 ms r₁ = 20 + ⌈20/1⌉×0.15 + ⌈20/10⌉×1.5 + ⌈20/100⌉×8 = 20 + 3.0 + 3.0 + 8 = 34 ms r₂ = 20 + ⌈34/1⌉×0.15 + ⌈34/10⌉×1.5 + ⌈34/100⌉×8 = 20 + 5.1 + 6.0 + 8 = 39.1 ms r₃ = 20 + ⌈39.1⌉×0.15 + ⌈39.1/10⌉×1.5 + 8 = 20 + 6.0 + 6.0 + 8 = 40 ms r₄ = 20 + 6.0 + 6.0 + 8 = 40 ms → 不动点，r₄ = 40 ms ≤ d₄ = 1000 ms ✓（余量 25 倍） 同理可验 τ3（r₃ = 12.95 ms ≤ 100 ms ✓）。 结论：本任务集可调度 ——注意 u = 0.40 但最低优先级任务的最坏响应已放大到 wcet 的 2 倍，这就是只用\"利用率感觉\"判断的风险。 4. 工程实态 wcet 三种来源：静态分析（工具）、测量（示波器/gpio 翻转 + 全边界激励）、厂商基准——正式证据要求覆盖所有分支（含故障分支），iso 26262-6 要求 wcet 与栈深有分析证据（s-07）； 栈深分析同法：每任务栈 + 中断嵌套最深栈求和，配栈溢出检测（mpu 水位线）； 抖动管理：采样任务被抢占导致采集时刻抖动，影响滤波与差分计算——高精度同步场景用 scheduletable 或提高采样任务优先级； 故障降级态要重跑调度分析：故障时记录/诊断任务变多，往往才是最坏时刻。 5. 常见误区 用 u &lt; 1 判断\"可调度\"——利用率 90% 的任务集照样有任务错过截止期，正式结论必须 rta； 裸机大循环\"顺序执行万事大吉\"——轮询无截止期保证，慢一环全线后移； 中断服务程序里做算法/发报文——高优先级中断被拉长，整表响应崩坏； 优先级按\"直觉重要性\"定——应按周期/截止期（rm/dm 法）定，直觉排序会造出不可调度集。 6. 自测 q1 ：τ2 的 wcet 涨到 2.5 ms 后，u 变多少？初筛还过吗？ q2 ：为什么采样任务（τ1）周期最短就要给最高优先级？ q3 ：rta 里 ⌈r/t⌉ 的含义是什么？ 答案 q1：u = 0.15 + 0.25 + 0.08 + 0.02 = 0.50 ，仍 &lt; 0.757 初筛通过；但需重跑 rta 才能给正式结论。 q2：rm 理论最优性：周期短（截止期紧）的任务优先级高时任务集可调度性最好；且采样是所有下游的输入源，晚一拍污染全体。 q3：在响应窗口 r 内，更高优先级任务 h 会抢占 ⌈r/t_h⌉ 次，每次干扰 c_h——即\"窗口内最坏被插队次数\"。 来源 s-07：iso 26262:2018（part 6：wcet/栈深分析证据要求） 本域节点约束：采样 10~100 ms / 算法 10 ms~1 s 分层（骨架定义，量级示意） rm 上界与 rta 为经典实时调度理论结论；任务表数字为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 osek/vdx operating specification 2.2.3 a autosar os 的前身，汽车嵌入式 os 经典规范 autosar os 模块规范（specification of operating system） a 任务/alarm/scheduletable 的正式定义 liu &amp; layland (1973), jacm 固定优先级调度经典论文 a rm/dm 上界的原始文献 joseph &amp; pandya (1986) 响应时间分析论文 a rta 迭代法的原始文献 待核对项（本课） 节点约束\"采样 10~100 ms / 算法 10 ms~1 s\"的出处即本域骨架（v0.1.0），量级为示意，建议补文献 rm 充分条件在含非抢占段/共享资源（互斥锁）场景需用扩展 rta（含阻塞项 b），正式设计勿直接套用 wcet 静态分析工具在 autosar 生态的常用清单（本课未点名，避免广告嫌疑） "}, {"id": "SW-03", "title": "课程 SW-03：通信协议栈——从 CanIf 到 Dcm", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-03<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a>、<a class=\"xlink\" href=\"#/lesson/SW-01\">SW-01<\/a> ｜ 预计用时 45 min 数字规则：帧开销 130 bit 沿用 <a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a> 的工程估算口径（教学示意值）；其余未挂标准的数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么协议栈是\"对外合同的技术实现\"<\/h3>\n<p>SYS-04 定义了\"发什么、什么周期\"，协议栈回答\"<strong>怎么发、怎么分段、丢了怎么办<\/strong>\"。节点约束点题：<strong>报文丢失需 Timeout 处理；UDS 安全访问等级需匹配数据敏感度<\/strong>（S-09、S-11）。协议栈坏的三种死法：周期报文停发（整车降级）、大报文分段错（诊断瘫痪）、超时无动作（失效静默）。<\/p>\n<h3>2. 机制展开：分层与逐层职责<\/h3>\n<p><strong>（1）经典 CAN 数据通路（AUTOSAR 命名，SW-01）<\/strong><\/p>\n<ul>\n<li>CanIf：统一驱动接口，收发原始帧；<\/li>\n<li>CanTP（ISO 15765-2，DoCAN 传输层）：把超过 8 字节的数据分段传输——<strong>单帧（SF）≤7 字节数据；首帧（FF）+ 流控帧（FC）+ 连续帧（CF）<\/strong> 组成多帧传输，CF 用序列号 SN 防丢防乱序；<\/li>\n<li>PduR：路由器，决定报文走 COM（周期信号）还是 Dcm（诊断）；<\/li>\n<li>COM/DCM：周期信号层与 UDS（ISO 14229-1，S-09）诊断层。<\/li>\n<p><strong>（2）失效处理三件套<\/strong>（接 <a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a>）：Timeout（常用 3×T_cycle，示意惯例）→ 替换值（逐信号定安全方向）→ E2E 保护（计数器 + CRC，防\"帧还在内容错\"）。<\/p>\n<p><strong>（3）UDS 安全访问<\/strong>：0x10 进扩展会话 → 0x27 Seed/Key → 才允许 0x2E 写 DID 等敏感操作；读 SOC/SOP 的安全等级要求与写标定参数不同——<strong>等级按数据敏感度定<\/strong>（节点约束），细节联动 <a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a> 与 <a class=\"xlink\" href=\"#/lesson/SAFE-05\">SAFE-05<\/a>。<\/p>\n<p><strong>（4）充电通信专线<\/strong>：GB/T 27930（S-05）充电机与 BMS 的报文协议（基于 SAE J1939 风格），其超时与中止流程直接控制充电安全（现行版本年份待核对 P-06）。<\/p>\n<\/ul>\n<h3>3. 手算实例：多帧传输分段与超时表<\/h3>\n<h4>实例 1：100 字节诊断响应的分段<\/h4>\n<p>用 UDS 0x22 读一个 100 字节的大 DID（如固件版本族信息），经典 CAN 8 字节帧：<\/p>\n<ul>\n<li>FF：PCI 头 2 字节（类型 + 12 bit 长度），携数据 6 字节 → 余 100 − 6 = 94 字节；<\/li>\n<li>CF：PCI 头 1 字节（SN），每帧携 7 字节 → ⌈94 ÷ 7⌉ = <strong>14 帧<\/strong>（最后一帧 3 字节）；<\/li>\n<li>接收方回 1 帧 FC → 总计 <strong>1 + 1 + 14 = 16 帧<\/strong>。<\/li>\n<li>时间：STmin（连续帧最小间隔）取 10 ms（示意）→ CF 段 ≈ 140 ms，加帧传输与 FC 处理 ≈ <strong>160 ms<\/strong>（教学示意值）；总线瞬时占用 16 × 130 bit = 2080 bit，对 500 kbit/s 约 0.4%（瞬时值）。<\/li>\n<\/ul>\n<h4>实例 2：报文超时与动作表（工程案例骨架）<\/h4>\n<table><thead><tr><th>通信对象<\/th><th>超时判据（示意惯例）<\/th><th>超时动作<\/th><\/tr><\/thead><tbody><tr><td>VCU 功率限值请求（周期）<\/td><td>3 × T_cycle 无帧<\/td><td>替换值（最保守限值）+ 记 DTC<\/td><\/tr><tr><td>CanTP N_As/N_Bs/N_Cr<\/td><td>ISO 15765-2 有定义（标准值待核对；实现常取 75~1000 ms 量级，示意）<\/td><td>终止本次多帧传输，TP 层报错<\/td><\/tr><tr><td>UDS P2 / P2*（请求-响应时限）<\/td><td>ISO 14229-1 有默认定义（示意 50 ms / 5000 ms，待核对）<\/td><td>诊断仪重试或放弃，不死等<\/td><\/tr><tr><td>充电握手/阶段报文（S-05）<\/td><td>协议规定超时即中止充电（具体值待核对）<\/td><td>进入充电错误处理流程<\/td><\/tr><\/tbody><\/table>\n<p>要点：<strong>每一条接收都要有超时和动作<\/strong>——\"接收方沉默\"比\"发送方丢帧\"更常见，也更容易被漏设计。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>AUTOSAR 下以上全部配置化：Dcm 配置服务表、CanTP 配置寻址与 STmin、PduR 配置路由表——配置即文档；<\/li>\n<li>E2E 档位（Profile）按 ASIL 选（计数器/CRC/ID 覆盖组合不同，S-07 关联）；SecOc/报文认证见 <a class=\"xlink\" href=\"#/lesson/SAFE-05\">SAFE-05<\/a>；<\/li>\n<li>充电流程中 BMS 是\"被请求方\"但握有中止权：超时/参数越限直接中止，不依赖充电机自觉（S-05）；<\/li>\n<li>通信栈的 DTC（如\"接收超时\"类）要与替换值策略联动，防止\"值已替换但无人知道\"。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>大于 8 字节的数据不走 CanTP 直接拼帧——长度与 SN 机制全失效，ISO 15765-2 是唯一正路；<\/li>\n<li>只给发送配超时不给接收配——失效处理是对称的（SYS-04 反复强调）；<\/li>\n<li>E2E 只加 CRC 不加计数器——重放/乱序照样漏过；<\/li>\n<li>STmin 配 0——下游（尤其网关）跟不上，隐性丢帧变成玄学故障。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：250 字节响应走经典 CAN 多帧，需要多少 CF？ <strong>Q2<\/strong>：为什么替换值要\"逐信号定安全方向\"？举一个 BMS 信号的例子。 <strong>Q3<\/strong>：0x27 安全访问绕不过去会挡住哪些操作？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：FF 携 6 字节，余 244 字节；⌈244 ÷ 7⌉ = <strong>35 帧<\/strong> CF（加 FF 与 FC 共 37 帧）。<\/li>\n<li>Q2：失效时的默认值就是安全行为的一部分：功率限值丢失 → 取最保守低值；SOC 丢失 → 保持上次值并标注失效（填 0 会造成仪表跳变）。方向错了把\"失效\"变成\"危害\"。<\/li>\n<li>Q3：写 DID（0x2E）、刷写（0x34 系）、例程控制（0x31）等敏感操作——读公开状态量（0x22）通常不需要最高等级。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-09：ISO 14229-1（UDS 服务与会话/安全访问）<\/li>\n<li>S-11：ISO 11898 系列（CAN / CAN FD）<\/li>\n<li>S-12：ISO 17987（LIN 传输层联动）<\/li>\n<li>S-05：GB/T 27930-2023（充电通信协议，版本已核实）<\/li>\n<li>S-03：GB/T 38661-2020（通信能力产品级要求）<\/li>\n
