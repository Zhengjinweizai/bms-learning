<li>S-81：AUTOSAR SWS CAN TransportLayer（N_As/N_Bs/N_Cr 形式化定义，2026-11-19 登记）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-19 部分链接已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.autosar.org/fileadmin/standards/R21-11/CP/AUTOSAR_SWS_CANTransportLayer.pdf\" target=\"_blank\" rel=\"noopener\">AUTOSAR SWS CAN TransportLayer（R21-11）<\/a><\/td><td>A<\/td><td>✅<\/td><td>N_As/N_Bs/N_Cr 的形式化定义（官方）<\/td><\/tr><tr><td><a href=\"https://raw.githubusercontent.com/devcoons/iso15765-canbus/master/doc/ISO-15765-2-2016.pdf\" target=\"_blank\" rel=\"noopener\">ISO 15765-2:2016 原文 PDF（镜像）<\/a><\/td><td>A<\/td><td>✅<\/td><td>多帧/流控/N_* 超时定义（权威版本以 ISO 官方为准）<\/td><\/tr><tr><td><a href=\"https://icanhack.nl/knowledge-base/diagnostics/iso-tp\" target=\"_blank\" rel=\"noopener\">icanhack.nl：ISO-TP 知识库<\/a><\/td><td>B<\/td><td>✅<\/td><td>实务口径：典型超时 1000 ms、FC Wait 机制<\/td><\/tr><tr><td>ISO 14229-1 原文<\/td><td>A<\/td><td>—<\/td><td>UDS 会话、超时与安全访问条款<\/td><\/tr><tr><td>SocketCAN / canutils 开源项目<\/td><td>B<\/td><td>✅<\/td><td>实操验证分段与超时行为<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~ISO 15765-2 的 N_As/N_Bs/N_Cr 标准超时值~~ → <strong>2026-11-19 已核实<\/strong>：典型 1000 ms（P-31 关闭）。<\/li>\n<li>~~ISO 14229-1 的 P2/P2* 默认时间~~ → <strong>2026-11-19 已核实<\/strong>：P2 = 50 ms / P2* = 5000 ms（0x78 pending 后启用）。<\/li>\n<li>GB/T 27930-2023 充电阶段报文超时的具体数值（版本已核实，超时值仍待原文逐条）。<\/li>\n<li>130 bit 帧开销口径沿用 SYS-04（已在其待核对项中登记）。<\/li>\n<\/ul>", "text": " 对应节点 sw-03 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sys-04 、 sw-01 ｜ 预计用时 45 min 数字规则：帧开销 130 bit 沿用 sys-04 的工程估算口径（教学示意值）；其余未挂标准的数字均为 教学示意值 。 1. 为什么协议栈是\"对外合同的技术实现\" sys-04 定义了\"发什么、什么周期\"，协议栈回答\" 怎么发、怎么分段、丢了怎么办 \"。节点约束点题： 报文丢失需 timeout 处理；uds 安全访问等级需匹配数据敏感度 （s-09、s-11）。协议栈坏的三种死法：周期报文停发（整车降级）、大报文分段错（诊断瘫痪）、超时无动作（失效静默）。 2. 机制展开：分层与逐层职责 （1）经典 can 数据通路（autosar 命名，sw-01） canif：统一驱动接口，收发原始帧； cantp（iso 15765-2，docan 传输层）：把超过 8 字节的数据分段传输—— 单帧（sf）≤7 字节数据；首帧（ff）+ 流控帧（fc）+ 连续帧（cf） 组成多帧传输，cf 用序列号 sn 防丢防乱序； pdur：路由器，决定报文走 com（周期信号）还是 dcm（诊断）； com/dcm：周期信号层与 uds（iso 14229-1，s-09）诊断层。 （2）失效处理三件套 （接 sys-04 ）：timeout（常用 3×t_cycle，示意惯例）→ 替换值（逐信号定安全方向）→ e2e 保护（计数器 + crc，防\"帧还在内容错\"）。 （3）uds 安全访问 ：0x10 进扩展会话 → 0x27 seed/key → 才允许 0x2e 写 did 等敏感操作；读 soc/sop 的安全等级要求与写标定参数不同—— 等级按数据敏感度定 （节点约束），细节联动 sw-05 与 safe-05 。 （4）充电通信专线 ：gb/t 27930（s-05）充电机与 bms 的报文协议（基于 sae j1939 风格），其超时与中止流程直接控制充电安全（现行版本年份待核对 p-06）。 3. 手算实例：多帧传输分段与超时表 实例 1：100 字节诊断响应的分段 用 uds 0x22 读一个 100 字节的大 did（如固件版本族信息），经典 can 8 字节帧： ff：pci 头 2 字节（类型 + 12 bit 长度），携数据 6 字节 → 余 100 − 6 = 94 字节； cf：pci 头 1 字节（sn），每帧携 7 字节 → ⌈94 ÷ 7⌉ = 14 帧 （最后一帧 3 字节）； 接收方回 1 帧 fc → 总计 1 + 1 + 14 = 16 帧 。 时间：stmin（连续帧最小间隔）取 10 ms（示意）→ cf 段 ≈ 140 ms，加帧传输与 fc 处理 ≈ 160 ms （教学示意值）；总线瞬时占用 16 × 130 bit = 2080 bit，对 500 kbit/s 约 0.4%（瞬时值）。 实例 2：报文超时与动作表（工程案例骨架） 通信对象 超时判据（示意惯例） 超时动作 vcu 功率限值请求（周期） 3 × t_cycle 无帧 替换值（最保守限值）+ 记 dtc cantp n_as/n_bs/n_cr iso 15765-2 有定义（标准值待核对；实现常取 75~1000 ms 量级，示意） 终止本次多帧传输，tp 层报错 uds p2 / p2*（请求-响应时限） iso 14229-1 有默认定义（示意 50 ms / 5000 ms，待核对） 诊断仪重试或放弃，不死等 充电握手/阶段报文（s-05） 协议规定超时即中止充电（具体值待核对） 进入充电错误处理流程 要点： 每一条接收都要有超时和动作 ——\"接收方沉默\"比\"发送方丢帧\"更常见，也更容易被漏设计。 4. 工程实态 autosar 下以上全部配置化：dcm 配置服务表、cantp 配置寻址与 stmin、pdur 配置路由表——配置即文档； e2e 档位（profile）按 asil 选（计数器/crc/id 覆盖组合不同，s-07 关联）；secoc/报文认证见 safe-05 ； 充电流程中 bms 是\"被请求方\"但握有中止权：超时/参数越限直接中止，不依赖充电机自觉（s-05）； 通信栈的 dtc（如\"接收超时\"类）要与替换值策略联动，防止\"值已替换但无人知道\"。 5. 常见误区 大于 8 字节的数据不走 cantp 直接拼帧——长度与 sn 机制全失效，iso 15765-2 是唯一正路； 只给发送配超时不给接收配——失效处理是对称的（sys-04 反复强调）； e2e 只加 crc 不加计数器——重放/乱序照样漏过； stmin 配 0——下游（尤其网关）跟不上，隐性丢帧变成玄学故障。 6. 自测 q1 ：250 字节响应走经典 can 多帧，需要多少 cf？ q2 ：为什么替换值要\"逐信号定安全方向\"？举一个 bms 信号的例子。 q3 ：0x27 安全访问绕不过去会挡住哪些操作？ 答案 q1：ff 携 6 字节，余 244 字节；⌈244 ÷ 7⌉ = 35 帧 cf（加 ff 与 fc 共 37 帧）。 q2：失效时的默认值就是安全行为的一部分：功率限值丢失 → 取最保守低值；soc 丢失 → 保持上次值并标注失效（填 0 会造成仪表跳变）。方向错了把\"失效\"变成\"危害\"。 q3：写 did（0x2e）、刷写（0x34 系）、例程控制（0x31）等敏感操作——读公开状态量（0x22）通常不需要最高等级。 来源 s-09：iso 14229-1（uds 服务与会话/安全访问） s-11：iso 11898 系列（can / can fd） s-12：iso 17987（lin 传输层联动） s-05：gb/t 27930-2023（充电通信协议，版本已核实） s-03：gb/t 38661-2020（通信能力产品级要求） s-81：autosar sws can transportlayer（n_as/n_bs/n_cr 形式化定义，2026-11-19 登记） 延伸资源（2026-11-19 部分链接已核实） 资源 级别 免费 说明 autosar sws can transportlayer（r21-11） a ✅ n_as/n_bs/n_cr 的形式化定义（官方） iso 15765-2:2016 原文 pdf（镜像） a ✅ 多帧/流控/n_* 超时定义（权威版本以 iso 官方为准） icanhack.nl：iso-tp 知识库 b ✅ 实务口径：典型超时 1000 ms、fc wait 机制 iso 14229-1 原文 a — uds 会话、超时与安全访问条款 socketcan / canutils 开源项目 b ✅ 实操验证分段与超时行为 待核对项（本课） ~~iso 15765-2 的 n_as/n_bs/n_cr 标准超时值~~ → 2026-11-19 已核实 ：典型 1000 ms（p-31 关闭）。 ~~iso 14229-1 的 p2/p2* 默认时间~~ → 2026-11-19 已核实 ：p2 = 50 ms / p2* = 5000 ms（0x78 pending 后启用）。 gb/t 27930-2023 充电阶段报文超时的具体数值（版本已核实，超时值仍待原文逐条）。 130 bit 帧开销口径沿用 sys-04（已在其待核对项中登记）。 "}, {"id": "SW-04", "title": "课程 SW-04：状态机设计——模式管理的形式化", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-04<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-01\">SW-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SW-02\">SW-02<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；预充判据与 <a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a> 保持一致（95%、3 周期为示意惯例）。<\/p><\/blockquote>\n<h3>1. 为什么模式管理必须用状态机<\/h3>\n<p>BMS 的\"行为\"由有限几个模式组成：下电、待机、预充、高压上电、运行、充电、故障。模式间的切换是<strong>带条件的跃迁<\/strong>——预充没完成就闭合主继电器是事故，故障态不收敛是甩锅。节点约束点题：<strong>时序需与整车协调（预充条件、继电器时序）；迁移条件需防抖<\/strong>。if-else 堆出来的\"模式\"既测不全也证不了，状态机（FSM, Finite State Machine）把行为变成<strong>可枚举、可全覆盖测试<\/strong>的表。<\/p>\n<h3>2. 机制展开：四要素 + 两条纪律<\/h3>\n<p><strong>（1）四要素<\/strong>：状态集合、事件/条件集合、迁移（条件 → 动作 → 次态）、入口/出口动作。<\/p>\n<p><strong>（2）纪律一：防抖（去毛刺）<\/strong>——迁移条件必须\"连续 N 次成立\"才生效（n-of-m 计数），防止单拍电压毛刺把系统从预充踢进故障。防抖参数是标定项（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）。<\/p>\n<p><strong>（3）纪律二：防御性默认<\/strong>——任何\"未定义事件\"统一进<strong>安全态<\/strong>（断开继电器），绝不\"留在原态继续看\"。状态机的完整迁移表 = 明确迁移 + 默认迁移，缺默认分支的表不完整。<\/p>\n<p><strong>（4）与整车协调<\/strong>：预充由 VCU 请求触发（接口来自 <a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a>），继电器时序由 BMS 硬件能力决定（<a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a> 的 150 ms 预充 + 判据），两边在状态机的迁移条件里汇合。<\/p>\n<p><strong>（5）分层状态机（HSM, Hierarchical State Machine）<\/strong>：Run 与 Charge 共享\"高压已上电\"父态；Fault 是顶层旁路态，任何子态的故障事件直接跃迁——分层避免状态爆炸，旁路保证故障路径唯一。<\/p>\n<h3>3. 工程案例：上下电状态机迁移表<\/h3>\n<h4>迁移表（条件均为示意，防抖以连续计数为准）<\/h4>\n<table><thead><tr><th>当前态<\/th><th>事件/条件（防抖）<\/th><th>次态<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>PowerDown<\/td><td>整车 KL ON 且无等级 3 故障<\/td><td>Standby<\/td><td>自检、粘连检测通过后待命<\/td><\/tr><tr><td>Standby<\/td><td>VCU 请求高压 + 粘连检测通过<\/td><td>PreCharge<\/td><td>闭合主负、闭合预充<\/td><\/tr><tr><td>PreCharge<\/td><td>V_link ≥ 0.95 × V_pack <strong>连续 3 周期<\/strong>（10 ms 周期）<\/td><td>HV_On<\/td><td>断预充、闭合主正<\/td><\/tr><tr><td>PreCharge<\/td><td>预充超时 500 ms（示意）<\/td><td>Fault<\/td><td>断预充、记 DTC<\/td><\/tr><tr><td>HV_On<\/td><td>充电插枪确认<\/td><td>Charge<\/td><td>切充电功率策略<\/td><\/tr><tr><td>Charge<\/td><td>充电完成/拔枪<\/td><td>HV_On → Standby（经下电时序）<\/td><td>断高压时序<\/td><\/tr><tr><td>任意态<\/td><td>ASIL 相关故障（<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a>）<\/td><td>Fault<\/td><td>按故障等级执行<\/td><\/tr><tr><td>Fault<\/td><td>故障清除 + 下电时序完成<\/td><td>PowerDown<\/td><td>存 DTC 与快照<\/td><\/tr><\/tbody><\/table>\n<h4>伪代码片段（核心迁移骨架）<\/h4>\n<p>``<code>c switch (state) { case STANDBY: if (vcu_hv_req &amp;&amp; weld_check_ok_n_of_m(3)) { close_relay(MAIN_NEG); close_relay(PRECHARGE); precharge_timer = 0;  state = PRECHARGE; } else if (undefined_condition) state = FAULT;   /* 默认迁移 */ break; case PRECHARGE: if (v_link &gt;= 0.95 * v_pack) debounce_cnt++; else debounce_cnt = 0; if (debounce_cnt &gt;= 3) {                            /* 防抖达标 */ open_relay(PRECHARGE); close_relay(MAIN_POS);   /* 先断预充再合主正 */ state = HV_ON; } else if (++precharge_timer &gt; 50) state = FAULT;   /* 500 ms 超时 */ break; default: state = FAULT; break;                        /* 防御性默认 */ } <\/code>``<\/p>\n<p>时间自洽检查：预充充电至 95% 需 150 ms（<a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a> 实例）+ 3 周期防抖 30 ms = 180 ms &lt; 超时 500 ms ✓——<strong>防抖时长必须加进超时预算<\/strong>，这是迁移表与硬件时序对账的固定动作。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>模式管理独立成 SWC（<a class=\"xlink\" href=\"#/lesson/SW-01\">SW-01<\/a>），与 NM 网络状态（睡眠/唤醒，<a class=\"xlink\" href=\"#/lesson/HW-06\">HW-06<\/a>）联动：总线睡眠前状态机必须已回 PowerDown；<\/li>\n<li>测试要求：<strong>迁移全覆盖<\/strong>（每条迁移至少一次）+ 非法事件轰击测试（ISO 26262-6 对结构覆盖的要求方向，S-07）；<\/li>\n<li>预充条件与超时是标定矩阵成员，随继电器/电容参数平台化调整（HW-05 的 RC 决定 3τ）；<\/li>\n<li>状态快照入 NVM：故障/下电时记录当前态，支撑售后与云端分析（<a class=\"xlink\" href=\"#/lesson/SW-07\">SW-07<\/a>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>迁移条件不防抖——电压毛刺一拍，预充中断、整车抖一下；<\/li>\n<li>状态扁平不分层——Run/Charge/Regen 两两组合后状态数爆炸，覆盖率测试做不动；<\/li>\n<li>两个状态机抢同一执行器（隐藏并发）——继电器必须有唯一 owner，其他模块只能提请求；<\/li>\n<li>超时预算不含防抖时长——3×防抖 + 硬件 3τ 超过超时值，\"永远到不了\"的合法迁移变成常态故障。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：防抖 5 周期（10 ms 周期）+ 预充 3τ = 150 ms，超时最少应设多少（留 30% 余量）？ <strong>Q2<\/strong>：为什么 Fault 态要设计成\"顶层旁路\"而不是普通兄弟态？ <strong>Q3<\/strong>：迁移条件\"V_link ≥ 0.95 × V_pack\"直接用单次采样判定有什么风险？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：150 + 50 = 200 ms → ×1.3 ≈ <strong>260 ms<\/strong>（取 300 ms 档更稳，示意）。预算 = 硬件时间 + 防抖时间 + 余量。<\/li>\n<li>Q2：故障可能在任何子态发生（包括迁移途中）；旁路态保证故障路径唯一、动作唯一（断高压），不需要在每个子态重复写故障处理。<\/li>\n<li>Q3：单拍判定对毛刺零防御——AFE 采样噪声、继电器弹跳都可能造成一拍假达标，先合主正后断预充的时序被毛刺触发就是事故。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（Part 6：软件单元实现与结构覆盖要求方向）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 高压通断控制行为要求）<\/li>\n<li>S-05：GB/T 27930（充电模式协调，版本待核对 P-06）<\/li>\n<li>迁移表条件与时间均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>Miro Samek, <em>Practical UML Statecharts in C/C++<\/em> (2nd ed.)<\/td><td>B<\/td><td>嵌入式状态机经典教材（含 QP 框架）<\/td><\/tr><tr><td>UML 2.5.1 规范（OMG）<\/td><td>A<\/td><td>状态机语义的形式化定义<\/td><\/tr><tr><td>ISO 26262:2018 Part 6 原文<\/td><td>A<\/td><td>软件单元设计与覆盖要求<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>预充判据 95%、防抖 3 周期、超时 500 ms 的行业惯例出处（与 HW-05 共用，本课按示意惯例）<\/li>\n<li>迁移全覆盖/非法事件轰击测试的正式要求条款号（ISO 26262-6 表格定位）<\/li>\n<li>分层状态机在量产 BMS 模式管理中的采用情况（示意表述）<\/li>\n<\/ul>", "text": " 对应节点 sw-04 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sw-01 、 sw-02 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；预充判据与 hw-05 保持一致（95%、3 周期为示意惯例）。 1. 为什么模式管理必须用状态机 bms 的\"行为\"由有限几个模式组成：下电、待机、预充、高压上电、运行、充电、故障。模式间的切换是 带条件的跃迁 ——预充没完成就闭合主继电器是事故，故障态不收敛是甩锅。节点约束点题： 时序需与整车协调（预充条件、继电器时序）；迁移条件需防抖 。if-else 堆出来的\"模式\"既测不全也证不了，状态机（fsm, finite state machine）把行为变成 可枚举、可全覆盖测试 的表。 2. 机制展开：四要素 + 两条纪律 （1）四要素 ：状态集合、事件/条件集合、迁移（条件 → 动作 → 次态）、入口/出口动作。 （2）纪律一：防抖（去毛刺） ——迁移条件必须\"连续 n 次成立\"才生效（n-of-m 计数），防止单拍电压毛刺把系统从预充踢进故障。防抖参数是标定项（ sw-05 ）。 （3）纪律二：防御性默认 ——任何\"未定义事件\"统一进 安全态 （断开继电器），绝不\"留在原态继续看\"。状态机的完整迁移表 = 明确迁移 + 默认迁移，缺默认分支的表不完整。 （4）与整车协调 ：预充由 vcu 请求触发（接口来自 sys-02 ），继电器时序由 bms 硬件能力决定（ hw-05 的 150 ms 预充 + 判据），两边在状态机的迁移条件里汇合。 （5）分层状态机（hsm, hierarchical state machine） ：run 与 charge 共享\"高压已上电\"父态；fault 是顶层旁路态，任何子态的故障事件直接跃迁——分层避免状态爆炸，旁路保证故障路径唯一。 3. 工程案例：上下电状态机迁移表 迁移表（条件均为示意，防抖以连续计数为准） 当前态 事件/条件（防抖） 次态 动作 powerdown 整车 kl on 且无等级 3 故障 standby 自检、粘连检测通过后待命 standby vcu 请求高压 + 粘连检测通过 precharge 闭合主负、闭合预充 precharge v_link ≥ 0.95 × v_pack 连续 3 周期 （10 ms 周期） hv_on 断预充、闭合主正 precharge 预充超时 500 ms（示意） fault 断预充、记 dtc hv_on 充电插枪确认 charge 切充电功率策略 charge 充电完成/拔枪 hv_on → standby（经下电时序） 断高压时序 任意态 asil 相关故障（ safe-04 ） fault 按故障等级执行 fault 故障清除 + 下电时序完成 powerdown 存 dtc 与快照 伪代码片段（核心迁移骨架） `` c switch (state) { case standby: if (vcu_hv_req &amp;&amp; weld_check_ok_n_of_m(3)) { close_relay(main_neg); close_relay(precharge); precharge_timer = 0; state = precharge; } else if (undefined_condition) state = fault; /* 默认迁移 */ break; case precharge: if (v_link &gt;= 0.95 * v_pack) debounce_cnt++; else debounce_cnt = 0; if (debounce_cnt &gt;= 3) { /* 防抖达标 */ open_relay(precharge); close_relay(main_pos); /* 先断预充再合主正 */ state = hv_on; } else if (++precharge_timer &gt; 50) state = fault; /* 500 ms 超时 */ break; default: state = fault; break; /* 防御性默认 */ } `` 时间自洽检查：预充充电至 95% 需 150 ms（ hw-05 实例）+ 3 周期防抖 30 ms = 180 ms &lt; 超时 500 ms ✓—— 防抖时长必须加进超时预算 ，这是迁移表与硬件时序对账的固定动作。 4. 工程实态 模式管理独立成 swc（ sw-01 ），与 nm 网络状态（睡眠/唤醒， hw-06 ）联动：总线睡眠前状态机必须已回 powerdown； 测试要求： 迁移全覆盖 （每条迁移至少一次）+ 非法事件轰击测试（iso 26262-6 对结构覆盖的要求方向，s-07）； 预充条件与超时是标定矩阵成员，随继电器/电容参数平台化调整（hw-05 的 rc 决定 3τ）； 状态快照入 nvm：故障/下电时记录当前态，支撑售后与云端分析（ sw-07 ）。 5. 常见误区 迁移条件不防抖——电压毛刺一拍，预充中断、整车抖一下； 状态扁平不分层——run/charge/regen 两两组合后状态数爆炸，覆盖率测试做不动； 两个状态机抢同一执行器（隐藏并发）——继电器必须有唯一 owner，其他模块只能提请求； 超时预算不含防抖时长——3×防抖 + 硬件 3τ 超过超时值，\"永远到不了\"的合法迁移变成常态故障。 6. 自测 q1 ：防抖 5 周期（10 ms 周期）+ 预充 3τ = 150 ms，超时最少应设多少（留 30% 余量）？ q2 ：为什么 fault 态要设计成\"顶层旁路\"而不是普通兄弟态？ q3 ：迁移条件\"v_link ≥ 0.95 × v_pack\"直接用单次采样判定有什么风险？ 答案 q1：150 + 50 = 200 ms → ×1.3 ≈ 260 ms （取 300 ms 档更稳，示意）。预算 = 硬件时间 + 防抖时间 + 余量。 q2：故障可能在任何子态发生（包括迁移途中）；旁路态保证故障路径唯一、动作唯一（断高压），不需要在每个子态重复写故障处理。 q3：单拍判定对毛刺零防御——afe 采样噪声、继电器弹跳都可能造成一拍假达标，先合主正后断预充的时序被毛刺触发就是事故。 来源 s-07：iso 26262:2018（part 6：软件单元实现与结构覆盖要求方向） s-03：gb/t 38661-2020（bms 高压通断控制行为要求） s-05：gb/t 27930（充电模式协调，版本待核对 p-06） 迁移表条件与时间均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 miro samek, practical uml statecharts in c/c++ (2nd ed.) b 嵌入式状态机经典教材（含 qp 框架） uml 2.5.1 规范（omg） a 状态机语义的形式化定义 iso 26262:2018 part 6 原文 a 软件单元设计与覆盖要求 待核对项（本课） 预充判据 95%、防抖 3 周期、超时 500 ms 的行业惯例出处（与 hw-05 共用，本课按示意惯例） 迁移全覆盖/非法事件轰击测试的正式要求条款号（iso 26262-6 表格定位） 分层状态机在量产 bms 模式管理中的采用情况（示意表述） "}, {"id": "SW-05", "title": "课程 SW-05：标定与诊断——DID/DTC 的\"合同\"属性", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-05<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；UDS 服务号与 DTC 状态字节位定义出自 ISO 14229-1（S-09），细节以原文为准。<\/p><\/blockquote>\n<h3>1. 为什么标定与诊断是\"对外合同\"<\/h3>\n<p>两件事都发生在\"BMS 之外的人\"与\"BMS 内部数据\"的界面上：<\/p>\n<ol>\n<li><strong>标定<\/strong>：保护阈值、算法参数（OCV 表、防抖计数）由标定工程师/产线调整——改错一个阈值就是安全事故；<\/li>\n<li><strong>诊断<\/strong>：DTC（Diagnostic Trouble Code，诊断故障码）与 DID（Data Identifier，数据标识符）是售后、召回、供应商间对账的<strong>唯一共同语言<\/strong>。<\/li>\n<p>节点约束点题：<strong>DID 的单位/精度/刷新语义需与协议一致——供应商间 SOH 语义分歧的典型症结<\/strong>（与 <code>FLT-05<\/code>、compare/matrix.md 维度 1 直接挂钩）。<\/p>\n<\/ol>\n<h3>2. 机制展开：诊断服务与标定通道<\/h3>\n<p><strong>（1）UDS 核心服务子集<\/strong>（ISO 14229-1，S-09，服务号标准定义）：<\/p>\n<table><thead><tr><th>服务<\/th><th>功能<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>0x10 DiagnosticSessionControl<\/td><td>进/退会话<\/td><td>扩展会话才开放敏感服务<\/td><\/tr><tr><td>0x27 SecurityAccess<\/td><td>Seed/Key 鉴权<\/td><td>等级按数据敏感度定（节点约束）<\/td><\/tr><tr><td>0x22 / 0x2E<\/td><td>读/写 DID<\/td><td>0x2E 需鉴权<\/td><\/tr><tr><td>0x19 / 0x14<\/td><td>读/清 DTC<\/td><td>售后与产线主用<\/td><\/tr><tr><td>0x31 RoutineControl<\/td><td>例程（自检、粘连检测触发）<\/td><td>售后深度诊断入口<\/td><\/tr><\/tbody><\/table>\n<p><strong>（2）DTC 的三层信息<\/strong>：3 字节编码（故障所属系统/类型/扩展位，编码格式以 ISO 14229-1 与整车厂规范为准）+ 1 字节状态位（如 testFailed、confirmedDTC、warningIndicatorRequested 等，位定义见原文）+ 快照数据（冻结帧）。<strong>清 DTC ≠ 修好<\/strong>，confirmed 计数与老化计数是召回取证的关键。<\/p>\n<p><strong>（3）CCP/XCP 标定通道<\/strong>：CCP（CAN Calibration Protocol，XCP 的 CAN 前身）与 XCP（ASAM MCD-1）两类模式：<\/p>\n<ul>\n<li>CalPage 页切换：标定量在 <strong>Flash（量产页）/ RAM（试验页）<\/strong> 间切换——台架改参数写 RAM，验证后固化进 Flash；<\/li>\n<li>DAQ（Data Acquisition）：按周期自动上传测量量，是台架调参的眼睛。<\/li>\n<p><strong>（4）A2L 文件<\/strong>（ASAM MCD-2 MC）：标定量/测量量的地址、类型、缩放、单位的机器可读描述——协议栈读 DID，工具读 A2L，两者缩放必须一致。<\/p>\n<\/ul>\n<h3>3. 工程案例：DID 布局与 DAQ 带宽<\/h3>\n<h4>实例 1：SOH 的 DID 布局（自定义示例 0x0450，编码为教学示意）<\/h4>\n<table><thead><tr><th>字节<\/th><th>语义<\/th><th>示例值<\/th><\/tr><\/thead><tbody><tr><td>Byte0<\/td><td>缩放标志（0 = 0.1%/bit，示意档位）<\/td><td>0x00<\/td><\/tr><tr><td>Byte1<\/td><td>单位（%），刷新周期（1 s，示意）打包<\/td><td>0x10<\/td><\/tr><tr><td>Byte2~3<\/td><td>原始值 int16（大端）<\/td><td>SOH 87.5% → 875 → 0x036B<\/td><\/tr><\/tbody><\/table>\n<p>价值在合同性：<strong>\"0.1%/bit、单位 %、含义为容量比、刷新 1 s\"写进接口文档<\/strong>——若供应商 A 的 SOH 是容量比、供应商 B 是内阻比，整车厂不做这份文档就无法对账（这正是 compare/matrix.md 维度 1 的技术根源）。<\/p>\n<h4>实例 2：DAQ 带宽核算（教学示意值）<\/h4>\n<p>台架标定要同时看 8 个测量量（各 8 字节，含时间戳打包），DAQ 周期 10 ms，经典 CAN 500 kbit/s：<\/p>\n<ul>\n<li>每周期负载：8 帧 × 130 bit（帧开销口径沿用 <a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a>）= 1040 bit；<\/li>\n<li>10 ms 周期 → 1040 ÷ 0.01 = <strong>104 kbit/s = 20.8% 总线占用<\/strong>——只剩不到 80% 给整车通信，超标；<\/li>\n<li>改 DAQ 周期 100 ms → 10.4 kbit/s = <strong>2.1%<\/strong> ✓。结论：DAQ 周期是带宽预算项，高速大数据量场景迁移 CAN FD/XCP-on-Ethernet（示意方向）。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>产线 EOL（End of Line）用 UDS+例程做标定写入与功能激活（如 OCV 表下发、粘连检测标定值）；<\/li>\n<li>XCP 鉴权与\"量产量产页锁定\"：量产状态写保护，防止台架工具误改；安全访问等级矩阵由整车厂规范定义（<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a>）；<\/li>\n<li>DTC 与快照联动：DTC 触发即抓取快照入 NVM（<a class=\"xlink\" href=\"#/lesson/SW-07\">SW-07<\/a> 的黑匣子共享存储）；<\/li>\n<li>SOH 语义冲突的现实处理：接口文档规定\"容量比、0.1% 精度\"并加 DID 校验字段；语义升级需版本化 DID（示意做法）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>DID 只有值没有缩放/单位/刷新语义——\"数字对了、意义错了\"，SOH 争议的标配剧本；<\/li>\n<li>台架直接改 Flash 标定量——页切换机制被绕过，芯片寿命与一致性双输；<\/li>\n<li>清 DTC 当售后手段——confirmed 计数被抹掉，召回取证断链；<\/li>\n<li>XCP 接口整车可用——标定通道是台架专用，量产车对外必须关闭（网络安全，<a class=\"xlink\" href=\"#/lesson/SAFE-05\">SAFE-05<\/a>）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：SOH 92.3% 按 0.1%/bit 编码，Byte2~3 的原始值是多少？ <strong>Q2<\/strong>：为什么 0x2E 写 DID 必须过 0x27，而 0x22 读 DID 常不需要？ <strong>Q3<\/strong>：DAQ 周期 10 ms、4 个测量量（各 8 字节）的总线占用是多少？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：923 → 0x039B。<\/li>\n<li>Q2：写操作改变保护阈值/功能行为，误写即危害；读公开状态量无破坏性——安全等级匹配数据敏感度（节点约束原文）。<\/li>\n<li>Q3：4 帧 × 130 bit = 520 bit ÷ 10 ms = 52 kbit/s = <strong>10.4%<\/strong>（500 kbit/s 口径），需进带宽预算表。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-09：ISO 14229-1（UDS 服务、DTC 状态位与安全访问）<\/li>\n<li>S-03：GB/T 38661-2020（诊断与数据接口的产品级要求）<\/li>\n<li>DID 布局示例（0x0450）、DAQ 带宽数字均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 14229-1 原文<\/td><td>A<\/td><td>UDS 服务与 DTC 语义权威定义<\/td><\/tr><tr><td>ASAM MCD-1 XCP / MCD-2（A2L）规范<\/td><td>A<\/td><td>标定协议与 A2L 描述文件规范<\/td><\/tr><tr><td>CCP 2.1 协议规范（XCP 前身，行业事实标准）<\/td><td>B<\/td><td>历史经典文档（待补链）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>DID 缩放档位（0.1%/bit）与刷新语义的行业惯例出处<\/li>\n<li>SOH 语义（容量比 vs 内阻比）分歧的公开案例/文献（联动 FLT-05 与 compare/matrix.md 维度 1）<\/li>\n<li>130 bit 帧开销口径沿用 SYS-04（已登记）；XCP-on-Ethernet 在 BMS 台架的采用现状<\/li>\n<\/ul>", "text": " 对应节点 sw-05 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sw-03 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；uds 服务号与 dtc 状态字节位定义出自 iso 14229-1（s-09），细节以原文为准。 1. 为什么标定与诊断是\"对外合同\" 两件事都发生在\"bms 之外的人\"与\"bms 内部数据\"的界面上： 标定 ：保护阈值、算法参数（ocv 表、防抖计数）由标定工程师/产线调整——改错一个阈值就是安全事故； 诊断 ：dtc（diagnostic trouble code，诊断故障码）与 did（data identifier，数据标识符）是售后、召回、供应商间对账的 唯一共同语言 。 节点约束点题： did 的单位/精度/刷新语义需与协议一致——供应商间 soh 语义分歧的典型症结 （与 flt-05 、compare/matrix.md 维度 1 直接挂钩）。 2. 机制展开：诊断服务与标定通道 （1）uds 核心服务子集 （iso 14229-1，s-09，服务号标准定义）： 服务 功能 备注 0x10 diagnosticsessioncontrol 进/退会话 扩展会话才开放敏感服务 0x27 securityaccess seed/key 鉴权 等级按数据敏感度定（节点约束） 0x22 / 0x2e 读/写 did 0x2e 需鉴权 0x19 / 0x14 读/清 dtc 售后与产线主用 0x31 routinecontrol 例程（自检、粘连检测触发） 售后深度诊断入口 （2）dtc 的三层信息 ：3 字节编码（故障所属系统/类型/扩展位，编码格式以 iso 14229-1 与整车厂规范为准）+ 1 字节状态位（如 testfailed、confirmeddtc、warningindicatorrequested 等，位定义见原文）+ 快照数据（冻结帧）。 清 dtc ≠ 修好 ，confirmed 计数与老化计数是召回取证的关键。 （3）ccp/xcp 标定通道 ：ccp（can calibration protocol，xcp 的 can 前身）与 xcp（asam mcd-1）两类模式： calpage 页切换：标定量在 flash（量产页）/ ram（试验页） 间切换——台架改参数写 ram，验证后固化进 flash； daq（data acquisition）：按周期自动上传测量量，是台架调参的眼睛。 （4）a2l 文件 （asam mcd-2 mc）：标定量/测量量的地址、类型、缩放、单位的机器可读描述——协议栈读 did，工具读 a2l，两者缩放必须一致。 3. 工程案例：did 布局与 daq 带宽 实例 1：soh 的 did 布局（自定义示例 0x0450，编码为教学示意） 字节 语义 示例值 byte0 缩放标志（0 = 0.1%/bit，示意档位） 0x00 byte1 单位（%），刷新周期（1 s，示意）打包 0x10 byte2~3 原始值 int16（大端） soh 87.5% → 875 → 0x036b 价值在合同性： \"0.1%/bit、单位 %、含义为容量比、刷新 1 s\"写进接口文档 ——若供应商 a 的 soh 是容量比、供应商 b 是内阻比，整车厂不做这份文档就无法对账（这正是 compare/matrix.md 维度 1 的技术根源）。 实例 2：daq 带宽核算（教学示意值） 台架标定要同时看 8 个测量量（各 8 字节，含时间戳打包），daq 周期 10 ms，经典 can 500 kbit/s： 每周期负载：8 帧 × 130 bit（帧开销口径沿用 sys-04 ）= 1040 bit； 10 ms 周期 → 1040 ÷ 0.01 = 104 kbit/s = 20.8% 总线占用 ——只剩不到 80% 给整车通信，超标； 改 daq 周期 100 ms → 10.4 kbit/s = 2.1% ✓。结论：daq 周期是带宽预算项，高速大数据量场景迁移 can fd/xcp-on-ethernet（示意方向）。 4. 工程实态 产线 eol（end of line）用 uds+例程做标定写入与功能激活（如 ocv 表下发、粘连检测标定值）； xcp 鉴权与\"量产量产页锁定\"：量产状态写保护，防止台架工具误改；安全访问等级矩阵由整车厂规范定义（ sw-03 ）； dtc 与快照联动：dtc 触发即抓取快照入 nvm（ sw-07 的黑匣子共享存储）； soh 语义冲突的现实处理：接口文档规定\"容量比、0.1% 精度\"并加 did 校验字段；语义升级需版本化 did（示意做法）。 5. 常见误区 did 只有值没有缩放/单位/刷新语义——\"数字对了、意义错了\"，soh 争议的标配剧本； 台架直接改 flash 标定量——页切换机制被绕过，芯片寿命与一致性双输； 清 dtc 当售后手段——confirmed 计数被抹掉，召回取证断链； xcp 接口整车可用——标定通道是台架专用，量产车对外必须关闭（网络安全， safe-05 ）。 6. 自测 q1 ：soh 92.3% 按 0.1%/bit 编码，byte2~3 的原始值是多少？ q2 ：为什么 0x2e 写 did 必须过 0x27，而 0x22 读 did 常不需要？ q3 ：daq 周期 10 ms、4 个测量量（各 8 字节）的总线占用是多少？ 答案 q1：923 → 0x039b。 q2：写操作改变保护阈值/功能行为，误写即危害；读公开状态量无破坏性——安全等级匹配数据敏感度（节点约束原文）。 q3：4 帧 × 130 bit = 520 bit ÷ 10 ms = 52 kbit/s = 10.4% （500 kbit/s 口径），需进带宽预算表。 来源 s-09：iso 14229-1（uds 服务、dtc 状态位与安全访问） s-03：gb/t 38661-2020（诊断与数据接口的产品级要求） did 布局示例（0x0450）、daq 带宽数字均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 14229-1 原文 a uds 服务与 dtc 语义权威定义 asam mcd-1 xcp / mcd-2（a2l）规范 a 标定协议与 a2l 描述文件规范 ccp 2.1 协议规范（xcp 前身，行业事实标准） b 历史经典文档（待补链） 待核对项（本课） did 缩放档位（0.1%/bit）与刷新语义的行业惯例出处 soh 语义（容量比 vs 内阻比）分歧的公开案例/文献（联动 flt-05 与 compare/matrix.md 维度 1） 130 bit 帧开销口径沿用 sys-04（已登记）；xcp-on-ethernet 在 bms 台架的采用现状 "}, {"id": "SW-06", "title": "课程 SW-06：Bootloader 与 OTA——升级失败不得致不可启动", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-06<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a>、<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a> ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么 OTA 是\"整车的手术\"<\/h3>\n<p>修 Bug 不召回的前提是升级绝对可控。节点约束点题：<strong>需满足 UN R156（S-15）；签名校验与失败回滚；升级失败不得致不可启动<\/strong>。BMS 的特殊性在于：它是高压安全的仲裁者——升级中继电器状态、保护功能不可处于半新半旧的混乱状态；升级失败若是\"变砖\"，售后成本与安全风险都不可接受。<\/p>\n<h3>2. 机制展开：分区、校验、回滚逐个看<\/h3>\n<p><strong>（1）Flash 分区（A/B 双分区方案，教学示意 2 MB）<\/strong><\/p>\n<table><thead><tr><th>分区<\/th><th>大小<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>Bootloader<\/td><td>128 KB<\/td><td>最小可信基座，<strong>自己永远不被 OTA<\/strong><\/td><\/tr><tr><td>Slot A<\/td><td>832 KB<\/td><td>当前运行固件<\/td><\/tr><tr><td>Slot B<\/td><td>832 KB<\/td><td>新固件下载/验证区<\/td><\/tr><tr><td>NVM（标定/自适应数据）<\/td><td>64 KB<\/td><td>掉电保存，版本迁移要考虑<\/td><\/tr><tr><td>参数区（RXSWIN/版本号）<\/td><td>32 KB<\/td><td>UN R156 要求的软件识别号（RXSWIN）等<\/td><\/tr><tr><td>余量<\/td><td>160 KB<\/td><td>磨损均衡与扩展<\/td><\/tr><\/tbody><\/table>\n<p>合计 128 + 832 + 832 + 64 + 32 + 160 = 2048 KB ✓<\/p>\n<p><strong>（2）升级流程（UDS 刷写三段式，S-09）<\/strong>：0x34 RequestDownload → 0x36 TransferData（多帧）→ 0x37 RequestTransferExit；全程要求扩展会话 + 0x27 鉴权（<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a>/<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）。<\/p>\n<p><strong>（3）校验三层<\/strong>：传输完整性 CRC → <strong>签名验签<\/strong>（非对称签名，公钥内置于 Bootloader）→ 版本号防回滚（防\"用旧漏洞版本覆盖新版本\"的攻击）。只验 CRC 不验签名是网络安全硬伤（ISO/SAE 21434，S-08）。<\/p>\n<p><strong>（4）回滚（Rollback）<\/strong>：新固件首次启动进\"验证模式\"，跑过 CRC + 自检后 Bootloader 才切换\"确认\"；启动失败计数器连续 N 次（示意 N = 3）未过验证 → <strong>Bootloader 自动指回 Slot A<\/strong>。关键纪律：Bootloader 保持最小化、代码路径简单——它是\"唯一不可升级的裁判\"。<\/p>\n<h3>3. 手算实例：升级时间与回滚预算<\/h3>\n<p><strong>传输时间<\/strong>（教学示意值）：Slot B 832 KB，CAN FD 2 Mbit/s，协议与 STmin 开销按 50% 有效吞吐 → 有效 1 Mbit/s = 125 KB/s： t_传输 = 832 ÷ 125 ≈ <strong>6.7 s<\/strong><\/p>\n<p><strong>编程时间<\/strong>：Flash 写入速度 64 KB/s（示意）→ t_编程 = 832 ÷ 64 = <strong>13 s<\/strong><\/p>\n<p><strong>校验<\/strong>：CRC 全区 + 验签 ≈ 3 s（示意）→ <strong>总时长 ≈ 23 s<\/strong>（不含整车进入升级模式的准备时间）。<\/p>\n<p><strong>回滚预算推演<\/strong>：13 s 编程中任意掉电 → Slot B 不完整，CRC 失败 → 启动仍走 Slot A ✓（A/B 方案的本质优势：<strong>新固件写满并验证通过前，Slot A 始终是退路<\/strong>）。对比\"就地升级 + 备份压缩包\"方案：备份与写入共享 Flash 寿命，且\"写一半断电\"的窗口处理复杂得多——车规倾向 A/B（示意工程共识）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>UN R156（S-15）：软件升级管理体系（SWUP）+ RXSWIN 软件识别号，主机厂流程侧与零部件技术侧都要过审；ISO 24089《道路车辆 软件更新工程》提供工程方法框架；<\/li>\n<li>整车级协调：升级条件（车速为 0、非高压上电态、电量满足）、多 ECU 升级的依赖顺序与失败联动由整车 OTA 主控决定，BMS 按请求执行并如实上报 RXSWIN/版本；<\/li>\n<li>NVM 迁移：新版本数据结构变化时要有迁移例程；<strong>回滚后旧版本读不懂新 NVM<\/strong> 是经典坑——NVM 结构变更需兼容版本号；<\/li>\n<li>差分升级（delta OTA）省带宽，但对校验逻辑要求更高（合成结果也要全量 CRC + 签名验证，示意原则）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>给 Bootloader 本身做 OTA——裁判下场踢球，失败即整车不可启动（UN R156 不可接受）；<\/li>\n<li>只验 CRC 不验签名——攻击者可伪造固件包（21434，S-08），CRC 只防误传不防篡改；<\/li>\n<li>忘记 NVM 版本兼容——升级成功但运行即崩溃，或回滚后读错数据；<\/li>\n<li>\"确认切换\"前就清空 Slot A——退路没了，掉电即变砖，直接违反节点约束。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：若 Slot 大小改为 1 MB、写入速度不变，编程时间多少？总时长受传输还是编程主导？ <strong>Q2<\/strong>：为什么版本号要防回滚？和签名是什么关系？ <strong>Q3<\/strong>：新固件启动后\"验证模式\"要验证什么才算\"确认\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：1024 ÷ 64 = <strong>16 s<\/strong>；传输 1024 ÷ 125 ≈ 8.2 s &lt; 编程 16 s → <strong>编程（Flash 写入）主导<\/strong>——提升 CAN 速率收益有限，Flash 编程速度才是瓶颈。<\/li>\n<li>Q2：签名保证\"包是真的\"，防回滚保证\"包不旧\"——两者缺一，攻击者重放旧签名包即可复活已知漏洞（降级攻击）。<\/li>\n<li>Q3：至少：CRC 完整性、签名已验、关键自检（存储、通信、安全机制）通过、与应用版本/标定兼容性检查通过，然后才置\"确认\"标志。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-15：UN R156（软件升级管理体系 SWUP 与 RXSWIN 要求）<\/li>\n<li>S-08：ISO/SAE 21434（签名、防回滚等网络安全要求框架）<\/li>\n<li>S-09：ISO 14229-1（0x34/0x36/0x37 刷写服务）<\/li>\n<li>分区表与时间数字均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>UN R156 原文<\/td><td>A<\/td><td>SWUP 体系与 RXSWIN 的法定要求<\/td><\/tr><tr><td>ISO 24089《道路车辆 软件更新工程》<\/td><td>A<\/td><td>升级工程方法框架（编号为现行标准名）<\/td><\/tr><tr><td>Uptane 规范（车载 OTA 安全框架）<\/td><td>B<\/td><td>车载 OTA 密钥与元数据设计的知名框架<\/td><\/tr><tr><td>OpenBLT 开源 Bootloader<\/td><td>B<\/td><td>可动手拆解的成熟开源实现<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>UN R156 中 RXSWIN 的实施细节与 BMS 作为零部件的过审口径（法规原文逐条核对）<\/li>\n<li>2 MB 分区表、64 KB/s Flash 编程速度、CAN FD 50% 有效吞吐均为教学示意值，需厂商规格书数据替换<\/li>\n<li>差分 OTA 在车规 BMS 的采用率与安全实践（示意表述）<\/li>\n<li>A/B 双分区 vs 就地升级的车规倾向性统计（\"工程共识\"级表述待文献支撑）<\/li>\n<\/ul>", "text": " 对应节点 sw-06 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sw-03 、 sw-05 ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么 ota 是\"整车的手术\" 修 bug 不召回的前提是升级绝对可控。节点约束点题： 需满足 un r156（s-15）；签名校验与失败回滚；升级失败不得致不可启动 。bms 的特殊性在于：它是高压安全的仲裁者——升级中继电器状态、保护功能不可处于半新半旧的混乱状态；升级失败若是\"变砖\"，售后成本与安全风险都不可接受。 2. 机制展开：分区、校验、回滚逐个看 （1）flash 分区（a/b 双分区方案，教学示意 2 mb） 分区 大小 作用 bootloader 128 kb 最小可信基座， 自己永远不被 ota slot a 832 kb 当前运行固件 slot b 832 kb 新固件下载/验证区 nvm（标定/自适应数据） 64 kb 掉电保存，版本迁移要考虑 参数区（rxswin/版本号） 32 kb un r156 要求的软件识别号（rxswin）等 余量 160 kb 磨损均衡与扩展 合计 128 + 832 + 832 + 64 + 32 + 160 = 2048 kb ✓ （2）升级流程（uds 刷写三段式，s-09） ：0x34 requestdownload → 0x36 transferdata（多帧）→ 0x37 requesttransferexit；全程要求扩展会话 + 0x27 鉴权（ sw-03 / sw-05 ）。 （3）校验三层 ：传输完整性 crc → 签名验签 （非对称签名，公钥内置于 bootloader）→ 版本号防回滚（防\"用旧漏洞版本覆盖新版本\"的攻击）。只验 crc 不验签名是网络安全硬伤（iso/sae 21434，s-08）。 （4）回滚（rollback） ：新固件首次启动进\"验证模式\"，跑过 crc + 自检后 bootloader 才切换\"确认\"；启动失败计数器连续 n 次（示意 n = 3）未过验证 → bootloader 自动指回 slot a 。关键纪律：bootloader 保持最小化、代码路径简单——它是\"唯一不可升级的裁判\"。 3. 手算实例：升级时间与回滚预算 传输时间 （教学示意值）：slot b 832 kb，can fd 2 mbit/s，协议与 stmin 开销按 50% 有效吞吐 → 有效 1 mbit/s = 125 kb/s： t_传输 = 832 ÷ 125 ≈ 6.7 s 编程时间 ：flash 写入速度 64 kb/s（示意）→ t_编程 = 832 ÷ 64 = 13 s 校验 ：crc 全区 + 验签 ≈ 3 s（示意）→ 总时长 ≈ 23 s （不含整车进入升级模式的准备时间）。 回滚预算推演 ：13 s 编程中任意掉电 → slot b 不完整，crc 失败 → 启动仍走 slot a ✓（a/b 方案的本质优势： 新固件写满并验证通过前，slot a 始终是退路 ）。对比\"就地升级 + 备份压缩包\"方案：备份与写入共享 flash 寿命，且\"写一半断电\"的窗口处理复杂得多——车规倾向 a/b（示意工程共识）。 4. 工程实态 un r156（s-15）：软件升级管理体系（swup）+ rxswin 软件识别号，主机厂流程侧与零部件技术侧都要过审；iso 24089《道路车辆 软件更新工程》提供工程方法框架； 整车级协调：升级条件（车速为 0、非高压上电态、电量满足）、多 ecu 升级的依赖顺序与失败联动由整车 ota 主控决定，bms 按请求执行并如实上报 rxswin/版本； nvm 迁移：新版本数据结构变化时要有迁移例程； 回滚后旧版本读不懂新 nvm 是经典坑——nvm 结构变更需兼容版本号； 差分升级（delta ota）省带宽，但对校验逻辑要求更高（合成结果也要全量 crc + 签名验证，示意原则）。 5. 常见误区 给 bootloader 本身做 ota——裁判下场踢球，失败即整车不可启动（un r156 不可接受）； 只验 crc 不验签名——攻击者可伪造固件包（21434，s-08），crc 只防误传不防篡改； 忘记 nvm 版本兼容——升级成功但运行即崩溃，或回滚后读错数据； \"确认切换\"前就清空 slot a——退路没了，掉电即变砖，直接违反节点约束。 6. 自测 q1 ：若 slot 大小改为 1 mb、写入速度不变，编程时间多少？总时长受传输还是编程主导？ q2 ：为什么版本号要防回滚？和签名是什么关系？ q3 ：新固件启动后\"验证模式\"要验证什么才算\"确认\"？ 答案 q1：1024 ÷ 64 = 16 s ；传输 1024 ÷ 125 ≈ 8.2 s &lt; 编程 16 s → 编程（flash 写入）主导 ——提升 can 速率收益有限，flash 编程速度才是瓶颈。 q2：签名保证\"包是真的\"，防回滚保证\"包不旧\"——两者缺一，攻击者重放旧签名包即可复活已知漏洞（降级攻击）。 q3：至少：crc 完整性、签名已验、关键自检（存储、通信、安全机制）通过、与应用版本/标定兼容性检查通过，然后才置\"确认\"标志。 来源 s-15：un r156（软件升级管理体系 swup 与 rxswin 要求） s-08：iso/sae 21434（签名、防回滚等网络安全要求框架） s-09：iso 14229-1（0x34/0x36/0x37 刷写服务） 分区表与时间数字均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 un r156 原文 a swup 体系与 rxswin 的法定要求 iso 24089《道路车辆 软件更新工程》 a 升级工程方法框架（编号为现行标准名） uptane 规范（车载 ota 安全框架） b 车载 ota 密钥与元数据设计的知名框架 openblt 开源 bootloader b 可动手拆解的成熟开源实现 待核对项（本课） un r156 中 rxswin 的实施细节与 bms 作为零部件的过审口径（法规原文逐条核对） 2 mb 分区表、64 kb/s flash 编程速度、can fd 50% 有效吞吐均为教学示意值，需厂商规格书数据替换 差分 ota 在车规 bms 的采用率与安全实践（示意表述） a/b 双分区 vs 就地升级的车规倾向性统计（\"工程共识\"级表述待文献支撑） "}, {"id": "SW-07", "title": "课程 SW-07：数据记录与云端上报", "dom": "SW", "verified": false, "html": "<blockquote><p>对应节点 <code>SW-07<\/code>（../domains/04-软件设计.md <span class=\"fileref\">（项目文件 ../domains/04-软件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a>、<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么车端要\"留证据、送数据\"<\/h3>\n<p>三个下游需求决定本节点存在：<\/p>\n<ol>\n<li><strong>事故追溯<\/strong>：热失控/碰撞后要能还原事发前后的电压电流温度——GB 38031（S-01）对相关数据记录有要求（具体条款细节待核对，建议并入 P-05 核对范围）；<\/li>\n<li><strong>云端再估计<\/strong>：SOH/健康的深度分析在云端跑（算力不受车端限制），代表如 LG Energy Solution 电池云服务矩阵（S-20，产品现状待核对 P-03）；<\/li>\n<li><strong>算法迭代闭环<\/strong>：真实工况数据回流 → 新标定/新模型 → OTA 下发（<a class=\"xlink\" href=\"#/lesson/SW-06\">SW-06<\/a>）。<\/li>\n<p>节点约束点题：<strong>触发策略（事件/周期）与带宽预算；本地存储掉电保护<\/strong>。车端带宽与存储都是稀缺资源，\"全量上传\"在物理上不成立，预算是本课的主算术。<\/p>\n<\/ol>\n<h3>2. 机制展开：三层存储与两条触发<\/h3>\n<p><strong>（1）实时环（RAM 环形缓冲）<\/strong>：高频数据（示意 100 Hz）滚动保存最近数十秒，内存常驻——事故前的\"最后 30 秒\"只能从这里来，到不了磁盘。<\/p>\n<p><strong>（2）本地黑匣子（eMMC/NVM 掉电保存）<\/strong>：事件触发时把实时环 + 事件后数据落盘。掉电保护三件套：<strong>先写记录头与 CRC 再写数据体<\/strong>（上电可识别残缺记录）、双缓冲（写满才切换）、上电扫描恢复（重建索引）。存储介质按擦写寿命选（手算实例 2）。<\/p>\n<p><strong>（3）云端上报（经 T-Box）<\/strong>：周期上报（分钟级状态量，供云端趋势分析）+ 事件上报（故障/事故包，高优先级）。传输安全：链路加密 + 报文签名（ISO/SAE 21434，S-08；管理体系 UN R155，S-14）。<\/p>\n<p><strong>（4）触发策略两类<\/strong>：<\/p>\n<ul>\n<li><strong>事件触发<\/strong>：DTC 触发（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）、阈值触发（单体电压骤降速率、温度上升速率超限，示意判据）；<\/li>\n<li><strong>周期触发<\/strong>：低频趋势数据，带宽预算的主角。<\/li>\n<\/ul>\n<h3>3. 手算实例：带宽预算与存储寿命<\/h3>\n<h4>实例 1：云端上报带宽预算（教学示意值）<\/h4>\n<p>周期上报帧：20 信号 × 2 字节 + 时间戳 4 字节 + 协议包头 12 字节 = <strong>56 字节<\/strong>，频率 1 Hz：<\/p>\n<ul>\n<li>日数据量：56 B × 86400 s = <strong>4.8 MB/天<\/strong><\/li>\n<li>压缩（ gzip 类，示意 50%）→ <strong>2.4 MB/天<\/strong><\/li>\n<li>4G 有效吞吐按 1 Mbit/s（示意）= 125 KB/s → 上传耗时 = 2.4 MB ÷ 125 KB/s ≈ <strong>20 s/天<\/strong><\/li>\n<p>结论：带宽不是瓶颈，<strong>\"何时传、传多少\"的策略才是<\/strong>（事件数据 160 KB 级（见下）才是尖峰）。事件包优先级高于周期包，通信失败要有重传与去重策略（示意机制）。<\/p>\n<\/ul>\n<h4>实例 2：事件黑匣子与存储磨损<\/h4>\n<p>事件记录窗：事件前 30 s + 后 10 s，采样 100 Hz，每条记录 40 字节（示意）：<\/p>\n<ul>\n<li>数据率 = 100 × 40 = 4 KB/s → 单事件 = 4 KB/s × 40 s = <strong>160 KB<\/strong><\/li>\n<p>eMMC 8 GB（示意）、日写入量 ≈ 5 MB（周期落盘 + 事件），擦写寿命 3000 次 P/E（示意）：<\/p>\n<li>每存储块日均擦写次数 ≈ 5 ÷ 8192 ≈ <strong>0.00061 次/天<\/strong><\/li>\n<li>理论磨损寿命 = 3000 ÷ 0.00061 ≈ 490 万天量级（上万年）→ <strong>磨损远不是约束；掉电一致性（实例 2 机制）才是<\/strong>。<\/li>\n<li>反面教材：若把 100 Hz 实时数据持续直写 eMMC（4 KB/s × 86400 = 346 MB/天），日均擦写 0.042 次 → 寿命缩短约 70 倍（示意），数年内耗尽——\"高频数据留 RAM、低频落盘\"是纪律。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>云端侧架构常识：车端 MQTT 类轻量协议上行（MQTT 5.0，OASIS 标准），云端 broker（Mosquitto/EMQX 类开源实现，示意举例）承接，深度分析进数据平台；<\/li>\n<li>数据闭环治理：上传数据的字段语义同样要 DID 级合同（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>），否则云端模型学到的 SOH 语义与车端不一致；<\/li>\n<li>时间基准：车端时间戳与 UTC 对齐（GNSS/网络授时），掉电后时间可追溯性要专门设计——事故数据没有可信时间轴等于废纸（工程共识）；<\/li>\n<li>隐私与合规：上传字段最小化、车主数据按法规脱敏（示意原则，具体法规适用范围待核对）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 1 Hz 周期上报当\"实时监控\"——车端 100 Hz 的瞬态过程云端根本看不见，两套采样两套用途；<\/li>\n<li>高频数据直写 Flash——磨损与写入抖动双杀（实例 2 反面教材）；<\/li>\n<li>触发阈值太敏感——日志洪水挤掉真正的关键记录，黑匣子变成垃圾桶；<\/li>\n<li>上云无签名/加密——伪造电池数据包注入云端平台（S-08 视角），故障预测被投毒。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：周期上报帧 96 字节、2 Hz，日数据量多少（不压缩）？ <strong>Q2<\/strong>：为什么事件记录窗是\"前 30 s + 后 10 s\"而不是\"后 60 s\"？ <strong>Q3<\/strong>：掉电时正在写的一条记录，上电后如何被识别并丢弃？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：96 × 2 × 86400 = 16.59 MB ≈ <strong>16.6 MB/天<\/strong>（带宽翻倍频率翻倍，线性放大——这就是预算表必须做的理由）。<\/li>\n<li>Q2：诱因（前因）只能来自事件发生前的数据；事后数据 10 s 足够覆盖\"事件发展与系统响应\"——前因长、后果短是事故取证的一般结构。<\/li>\n<li>Q3：记录头含 CRC 与长度字段：数据体不完整 → 头部 CRC 或整体校验失败 → 上电扫描阶段判残缺、丢弃并释放空间（双缓冲保证不影响已关闭的上一条）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-01：GB 38031-2025（动力蓄电池安全要求，含数据记录相关要求，条款细节待核对）<\/li>\n<li>S-20：LG Energy Solution 电池云服务官方资料（云端再估计的厂商案例，P-03 待核对）<\/li>\n<li>S-08：ISO/SAE 21434、S-14：UN R155（上云链路与数据安全框架）<\/li>\n<li>本课带宽/存储/寿命数字均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB 38031-2025 原文<\/td><td>A<\/td><td>数据记录相关条款的权威原文（待逐条核对）<\/td><\/tr><tr><td>MQTT 5.0（OASIS 标准）<\/td><td>A<\/td><td>车云轻量消息协议的标准文本<\/td><\/tr><tr><td>Eclipse Mosquitto / EMQX 开源项目<\/td><td>B<\/td><td>MQTT broker 的知名开源实现<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB 38031 数据记录条款的具体内容（记录时长、字段、读取接口），建议并入 P-05 的核对范围<\/li>\n<li>车规 eMMC/NAND 擦写寿命与写入放大的典型规格（本课 3000 P/E 为示意）<\/li>\n<li>事件触发判据（电压骤降速率/温升速率）的标定量级（本课示意，建议新 P 项）<\/li>\n<li>车主数据脱敏的法规适用清单（GDPR/个保法等，超出本课范围待立项核对）<\/li>\n<\/ul>", "text": " 对应节点 sw-07 （../domains/04-软件设计.md （项目文件 ../domains/04-软件设计.md） ）｜ 前置： sw-03 、 sw-05 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么车端要\"留证据、送数据\" 三个下游需求决定本节点存在： 事故追溯 ：热失控/碰撞后要能还原事发前后的电压电流温度——gb 38031（s-01）对相关数据记录有要求（具体条款细节待核对，建议并入 p-05 核对范围）； 云端再估计 ：soh/健康的深度分析在云端跑（算力不受车端限制），代表如 lg energy solution 电池云服务矩阵（s-20，产品现状待核对 p-03）； 算法迭代闭环 ：真实工况数据回流 → 新标定/新模型 → ota 下发（ sw-06 ）。 节点约束点题： 触发策略（事件/周期）与带宽预算；本地存储掉电保护 。车端带宽与存储都是稀缺资源，\"全量上传\"在物理上不成立，预算是本课的主算术。 2. 机制展开：三层存储与两条触发 （1）实时环（ram 环形缓冲） ：高频数据（示意 100 hz）滚动保存最近数十秒，内存常驻——事故前的\"最后 30 秒\"只能从这里来，到不了磁盘。 （2）本地黑匣子（emmc/nvm 掉电保存） ：事件触发时把实时环 + 事件后数据落盘。掉电保护三件套： 先写记录头与 crc 再写数据体 （上电可识别残缺记录）、双缓冲（写满才切换）、上电扫描恢复（重建索引）。存储介质按擦写寿命选（手算实例 2）。 （3）云端上报（经 t-box） ：周期上报（分钟级状态量，供云端趋势分析）+ 事件上报（故障/事故包，高优先级）。传输安全：链路加密 + 报文签名（iso/sae 21434，s-08；管理体系 un r155，s-14）。 （4）触发策略两类 ： 事件触发 ：dtc 触发（ sw-05 ）、阈值触发（单体电压骤降速率、温度上升速率超限，示意判据）； 周期触发 ：低频趋势数据，带宽预算的主角。 3. 手算实例：带宽预算与存储寿命 实例 1：云端上报带宽预算（教学示意值） 周期上报帧：20 信号 × 2 字节 + 时间戳 4 字节 + 协议包头 12 字节 = 56 字节 ，频率 1 hz： 日数据量：56 b × 86400 s = 4.8 mb/天 压缩（ gzip 类，示意 50%）→ 2.4 mb/天 4g 有效吞吐按 1 mbit/s（示意）= 125 kb/s → 上传耗时 = 2.4 mb ÷ 125 kb/s ≈ 20 s/天 结论：带宽不是瓶颈， \"何时传、传多少\"的策略才是 （事件数据 160 kb 级（见下）才是尖峰）。事件包优先级高于周期包，通信失败要有重传与去重策略（示意机制）。 实例 2：事件黑匣子与存储磨损 事件记录窗：事件前 30 s + 后 10 s，采样 100 hz，每条记录 40 字节（示意）： 数据率 = 100 × 40 = 4 kb/s → 单事件 = 4 kb/s × 40 s = 160 kb emmc 8 gb（示意）、日写入量 ≈ 5 mb（周期落盘 + 事件），擦写寿命 3000 次 p/e（示意）： 每存储块日均擦写次数 ≈ 5 ÷ 8192 ≈ 0.00061 次/天 理论磨损寿命 = 3000 ÷ 0.00061 ≈ 490 万天量级（上万年）→ 磨损远不是约束；掉电一致性（实例 2 机制）才是 。 反面教材：若把 100 hz 实时数据持续直写 emmc（4 kb/s × 86400 = 346 mb/天），日均擦写 0.042 次 → 寿命缩短约 70 倍（示意），数年内耗尽——\"高频数据留 ram、低频落盘\"是纪律。 4. 工程实态 云端侧架构常识：车端 mqtt 类轻量协议上行（mqtt 5.0，oasis 标准），云端 broker（mosquitto/emqx 类开源实现，示意举例）承接，深度分析进数据平台； 数据闭环治理：上传数据的字段语义同样要 did 级合同（ sw-05 ），否则云端模型学到的 soh 语义与车端不一致； 时间基准：车端时间戳与 utc 对齐（gnss/网络授时），掉电后时间可追溯性要专门设计——事故数据没有可信时间轴等于废纸（工程共识）； 隐私与合规：上传字段最小化、车主数据按法规脱敏（示意原则，具体法规适用范围待核对）。 5. 常见误区 把 1 hz 周期上报当\"实时监控\"——车端 100 hz 的瞬态过程云端根本看不见，两套采样两套用途； 高频数据直写 flash——磨损与写入抖动双杀（实例 2 反面教材）； 触发阈值太敏感——日志洪水挤掉真正的关键记录，黑匣子变成垃圾桶； 上云无签名/加密——伪造电池数据包注入云端平台（s-08 视角），故障预测被投毒。 6. 自测 q1 ：周期上报帧 96 字节、2 hz，日数据量多少（不压缩）？ q2 ：为什么事件记录窗是\"前 30 s + 后 10 s\"而不是\"后 60 s\"？ q3 ：掉电时正在写的一条记录，上电后如何被识别并丢弃？ 答案 q1：96 × 2 × 86400 = 16.59 mb ≈ 16.6 mb/天 （带宽翻倍频率翻倍，线性放大——这就是预算表必须做的理由）。 q2：诱因（前因）只能来自事件发生前的数据；事后数据 10 s 足够覆盖\"事件发展与系统响应\"——前因长、后果短是事故取证的一般结构。 q3：记录头含 crc 与长度字段：数据体不完整 → 头部 crc 或整体校验失败 → 上电扫描阶段判残缺、丢弃并释放空间（双缓冲保证不影响已关闭的上一条）。 来源 s-01：gb 38031-2025（动力蓄电池安全要求，含数据记录相关要求，条款细节待核对） s-20：lg energy solution 电池云服务官方资料（云端再估计的厂商案例，p-03 待核对） s-08：iso/sae 21434、s-14：un r155（上云链路与数据安全框架） 本课带宽/存储/寿命数字均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb 38031-2025 原文 a 数据记录相关条款的权威原文（待逐条核对） mqtt 5.0（oasis 标准） a 车云轻量消息协议的标准文本 eclipse mosquitto / emqx 开源项目 b mqtt broker 的知名开源实现 待核对项（本课） gb 38031 数据记录条款的具体内容（记录时长、字段、读取接口），建议并入 p-05 的核对范围 车规 emmc/nand 擦写寿命与写入放大的典型规格（本课 3000 p/e 为示意） 事件触发判据（电压骤降速率/温升速率）的标定量级（本课示意，建议新 p 项） 车主数据脱敏的法规适用清单（gdpr/个保法等，超出本课范围待立项核对） "}, {"id": "SYS-01", "title": "课程 SYS-01：BMS 功能清单——先说清\"管什么\"", "dom": "SYS", "verified": false, "html": "<blockquote><p>对应节点 <code>SYS-01<\/code>（../domains/01-边界与架构.md <span class=\"fileref\">（项目文件 ../domains/01-边界与架构.md）<\/span>）｜ 前置：无 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么第一课是功能清单<\/h3>\n<p>BMS 的一切设计都从\"管什么\"开始。功能清单（Function Set）是 BMS 与整车之间的一份<strong>范围契约<\/strong>：<\/p>\n<ol>\n<li><strong>对内<\/strong>：功能清单决定硬件选型（采多少路电压）、软件规模、验证工作量——漏一个功能，后面整条 V 模型（<code>DEV-01<\/code>）都要返工；<\/li>\n<li><strong>对外<\/strong>：功能清单是 HARA（<code>SAFE-02<\/code>）的输入。节点约束说得极重：<strong>功能遗漏即安全缺口<\/strong>——一个没进清单的功能，它的失效模式从未被危害分析覆盖过；<\/li>\n<li><strong>对商务<\/strong>：电池厂与主机厂的报价、验收、售后责任（<code>FLT-05<\/code>）都以功能清单为锚点。<\/li>\n<p>节点约束的另一半是检验标准：<strong>功能清单需与安全目标一一对应<\/strong>（第 3 节演示怎么对）。<\/p>\n<\/ol>\n<h3>2. 六大功能族（机制展开）<\/h3>\n<p>工程上通行\"六族\"划分（框架参照 T/CAAMTB 设计规范 S-19 与 GB/T 38661 S-03，章节对应关系待核对 → P-01）：<\/p>\n<table><thead><tr><th>功能族<\/th><th>干什么<\/th><th>典型子功能<\/th><th>与谁耦合<\/th><\/tr><\/thead><tbody><tr><td>感知（采集）<\/td><td>把物理世界变成数字<\/td><td>单体电压、包电流、包电压、温度<\/td><td><code>HW-01/03/04<\/code><\/td><\/tr><tr><td>保护<\/td><td>让参数不越过电芯安全边界<\/td><td>过充/过放/过温/过流/绝缘<\/td><td><code>SAFE-04<\/code>、<code>HV-03<\/code><\/td><\/tr><tr><td>估计<\/td><td>算出看不见的状态<\/td><td>SOC/SOH/SOP/SOS<\/td><td><code>ALG-01/02/05/06<\/code><\/td><\/tr><tr><td>均衡<\/td><td>抹平单体差异<\/td><td>被动/主动均衡<\/td><td><code>HW<\/code>、<code>CHG<\/code><\/td><\/tr><tr><td>通信<\/td><td>与整车/桩/云对话<\/td><td>CAN 报文、UDS、充电协议<\/td><td><code>SYS-04<\/code>、<code>CHG-02<\/code><\/td><\/tr><tr><td>诊断<\/td><td>记录、上报、自检<\/td><td>DTC、冻结帧、预检<\/td><td><code>FLT-01/02<\/code>、<code>SW-05<\/code><\/td><\/tr><\/tbody><\/table>\n<p>逐族要点（术语逐个解释）：<\/p>\n<ul>\n<li><strong>保护<\/strong>：既是\"功能\"也是\"安全机制\"——同一份过充保护逻辑，在功能清单里是功能项，在 HARA 之后要挂上 ASIL 等级。清单阶段就要给每项标注\"是否安全相关\"；<\/li>\n<li><strong>估计<\/strong>：SOC/SOH 是显示与功率限制的输入。估计功能\"失效\"通常不直接致害，但会让下游保护误动作或漏动作；<\/li>\n<li><strong>均衡<\/strong>：属于<strong>性能/寿命功能<\/strong>而非安全功能（不均衡主要损耗容量与能量可用性）——性质定错会导致 ASIL 属性乱标（常见误区）；<\/li>\n<li><strong>诊断<\/strong>：含 UDS（Unified Diagnostic Services，统一诊断服务）与故障码体系，是售后判定与安全论证\"证据链\"的载体。<\/li>\n<\/ul>\n<h3>3. 工程案例推演：96 串平台的清单编制与安全目标核对<\/h3>\n<p>场景（教学示意值）：400 V 平台、96 串 NCM、支持直流快充。编制分三步：<\/p>\n<p><strong>Step 1 — 按六族展开功能项<\/strong>（节选）：<\/p>\n<table><thead><tr><th>编号<\/th><th>功能项<\/th><th>参数（示意）<\/th><th>安全相关？<\/th><\/tr><\/thead><tbody><tr><td>F-S-01<\/td><td>单体电压采集<\/td><td>96 通道，精度 ±2 mV<\/td><td>是（保护依赖）<\/td><\/tr><tr><td>F-S-02<\/td><td>电流采集<\/td><td>±600 A，精度 0.5%<\/td><td>是<\/td><\/tr><tr><td>F-P-01<\/td><td>过充保护<\/td><td>阈值 4.25 V，防抖 100 ms<\/td><td>是（对应 SG-01）<\/td><\/tr><tr><td>F-E-01<\/td><td>SOC 估计<\/td><td>精度目标 ±5%<\/td><td>否（显示级）<\/td><\/tr><tr><td>F-B-01<\/td><td>被动均衡<\/td><td>120 mA<\/td><td>否（寿命级）<\/td><\/tr><tr><td>F-C-01<\/td><td>充电协议通信<\/td><td>GB/T 27930 链路<\/td><td>是（充电安全通道）<\/td><\/tr><tr><td>F-D-01<\/td><td>DTC + 冻结帧<\/td><td>ISO 14229-1 口径<\/td><td>部分<\/td><\/tr><\/tbody><\/table>\n<p><strong>Step 2 — 功能 → 安全目标双向核对<\/strong>：HARA 产出安全目标 SG-01\"防止任一电芯超过充电电压上限\"（推演见 <code>SAFE-02<\/code>），核对发现 F-P-01、F-S-01、F-C-01、F-D-01 四项共同支撑 SG-01；反向看，F-B-01（均衡）没有任何安全目标挂靠——这是<strong>正常且正确<\/strong>的，强行给它编安全目标反而是误区。<\/p>\n<p><strong>Step 3 — 缺口检查（冻结判据）<\/strong>：每个安全目标至少有一条功能支撑吗？每条\"安全相关\"功能都有安全目标挂靠或被论证为低风险吗？双向闭合，清单才能冻结。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>主机厂发布《功能规范/技术要求》→ 电池厂/Tier1 回《功能清单与实现矩阵》；GB/T 38661（S-03）是国标层产品技术条件底座（对估计精度等有条款要求，具体数值待核对 → P-13）；<\/li>\n<li>团标 T/CAAMTB 设计规范（S-19，编号待核对 P-01）被用作清单结构参照；<\/li>\n<li>法规底线项（GB 38031-2025，S-01）必须出现在清单中并映射到合规验证项（<code>DEV-04<\/code>）；<\/li>\n<li>清单是活的：OTA 时代新增功能（如云端 SOH 推荐，<code>GEN-2<\/code>）要走变更流程，回到清单与 HARA 重新对表。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把\"卖点清单\"当功能清单——宣传里的\"智能温控\"必须拆成可验证的功能项，否则没法挂需求；<\/li>\n<li>把均衡误标为安全功能——性质定错，ASIL 属性与验证等级全错；<\/li>\n<li>只列\"主动\"功能，漏掉诊断/记录类\"默默工作\"的功能——它们是安全目标的证据链；<\/li>\n<li>清单冻结后不再随 HARA 更新——安全分析发现缺口时，第一动作是回改清单，而不是在需求里偷偷加。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么说\"功能遗漏即安全缺口\"？ <strong>Q2<\/strong>：均衡功能为什么通常不挂安全目标？ <strong>Q3<\/strong>：96 串平台的\"过充保护\"功能，至少要和哪些其他功能共同支撑其安全目标？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：HARA 与安全目标都依附于功能/系统元素。一个未进清单的功能从未被危害分析覆盖，其失效模式没有对应的安全机制与验证——在 V 模型上表现为整条追溯链缺失。<\/li>\n<li>Q2：不均衡的直接后果是容量/能量损失与寿命衰减（性能与寿命问题），通常不直接触发危害事件；属性能/寿命级功能，ASIL 属性为 QM（除非特定架构下不均衡诱发过充等次生危害，需个案论证）。<\/li>\n<li>Q3：电压采集（F-S-01，提供判断依据）、充电通信（F-C-01，充电工况下执行降流/停止）、诊断记录（F-D-01，故障可追溯），再加执行链路的接触器控制（<code>HV-05<\/code>）。单靠\"阈值判断\"一个功能无法闭环。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》（功能与精度的产品技术条件底座）<\/li>\n<li>S-01：GB 38031-2025《电动汽车用动力蓄电池安全要求》（法规底线项，条款细节待核对 P-05）<\/li>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（六族功能框架参照，编号待核对 P-01）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I, Ch.1（BMS 功能的教材级展开）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 标准原文<\/td><td>功能清单的国标对标文本<\/td><\/tr><tr><td>G. Plett, <em>Battery Management Systems, Vol. I<\/em>（Artech House, 2015）<\/td><td>第 1 章给出 BMS 功能全景，经典教材<\/td><\/tr><tr><td>T/CAAMTB 设计规范<\/td><td>待取得编号与文本（P-01）[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>T/CAAMTB 规范编号/年份及其与六族划分的章节对应（已有 P-01，本课引用）<\/li>\n<li>GB/T 38661-2020 估计精度条款数值（已有 P-13，本课引用）<\/li>\n<li>96 串平台各参数均为教学示意值，不对应任何具体车型<\/li>\n<\/ul>", "text": " 对应节点 sys-01 （../domains/01-边界与架构.md （项目文件 ../domains/01-边界与架构.md） ）｜ 前置：无 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么第一课是功能清单 bms 的一切设计都从\"管什么\"开始。功能清单（function set）是 bms 与整车之间的一份 范围契约 ： 对内 ：功能清单决定硬件选型（采多少路电压）、软件规模、验证工作量——漏一个功能，后面整条 v 模型（ dev-01 ）都要返工； 对外 ：功能清单是 hara（ safe-02 ）的输入。节点约束说得极重： 功能遗漏即安全缺口 ——一个没进清单的功能，它的失效模式从未被危害分析覆盖过； 对商务 ：电池厂与主机厂的报价、验收、售后责任（ flt-05 ）都以功能清单为锚点。 节点约束的另一半是检验标准： 功能清单需与安全目标一一对应 （第 3 节演示怎么对）。 2. 六大功能族（机制展开） 工程上通行\"六族\"划分（框架参照 t/caamtb 设计规范 s-19 与 gb/t 38661 s-03，章节对应关系待核对 → p-01）： 功能族 干什么 典型子功能 与谁耦合 感知（采集） 把物理世界变成数字 单体电压、包电流、包电压、温度 hw-01/03/04 保护 让参数不越过电芯安全边界 过充/过放/过温/过流/绝缘 safe-04 、 hv-03 估计 算出看不见的状态 soc/soh/sop/sos alg-01/02/05/06 均衡 抹平单体差异 被动/主动均衡 hw 、 chg 通信 与整车/桩/云对话 can 报文、uds、充电协议 sys-04 、 chg-02 诊断 记录、上报、自检 dtc、冻结帧、预检 flt-01/02 、 sw-05 逐族要点（术语逐个解释）： 保护 ：既是\"功能\"也是\"安全机制\"——同一份过充保护逻辑，在功能清单里是功能项，在 hara 之后要挂上 asil 等级。清单阶段就要给每项标注\"是否安全相关\"； 估计 ：soc/soh 是显示与功率限制的输入。估计功能\"失效\"通常不直接致害，但会让下游保护误动作或漏动作； 均衡 ：属于 性能/寿命功能 而非安全功能（不均衡主要损耗容量与能量可用性）——性质定错会导致 asil 属性乱标（常见误区）； 诊断 ：含 uds（unified diagnostic services，统一诊断服务）与故障码体系，是售后判定与安全论证\"证据链\"的载体。 3. 工程案例推演：96 串平台的清单编制与安全目标核对 场景（教学示意值）：400 v 平台、96 串 ncm、支持直流快充。编制分三步： step 1 — 按六族展开功能项 （节选）： 编号 功能项 参数（示意） 安全相关？ f-s-01 单体电压采集 96 通道，精度 ±2 mv 是（保护依赖） f-s-02 电流采集 ±600 a，精度 0.5% 是 f-p-01 过充保护 阈值 4.25 v，防抖 100 ms 是（对应 sg-01） f-e-01 soc 估计 精度目标 ±5% 否（显示级） f-b-01 被动均衡 120 ma 否（寿命级） f-c-01 充电协议通信 gb/t 27930 链路 是（充电安全通道） f-d-01 dtc + 冻结帧 iso 14229-1 口径 部分 step 2 — 功能 → 安全目标双向核对 ：hara 产出安全目标 sg-01\"防止任一电芯超过充电电压上限\"（推演见 safe-02 ），核对发现 f-p-01、f-s-01、f-c-01、f-d-01 四项共同支撑 sg-01；反向看，f-b-01（均衡）没有任何安全目标挂靠——这是 正常且正确 的，强行给它编安全目标反而是误区。 step 3 — 缺口检查（冻结判据） ：每个安全目标至少有一条功能支撑吗？每条\"安全相关\"功能都有安全目标挂靠或被论证为低风险吗？双向闭合，清单才能冻结。 4. 工程实态 主机厂发布《功能规范/技术要求》→ 电池厂/tier1 回《功能清单与实现矩阵》；gb/t 38661（s-03）是国标层产品技术条件底座（对估计精度等有条款要求，具体数值待核对 → p-13）； 团标 t/caamtb 设计规范（s-19，编号待核对 p-01）被用作清单结构参照； 法规底线项（gb 38031-2025，s-01）必须出现在清单中并映射到合规验证项（ dev-04 ）； 清单是活的：ota 时代新增功能（如云端 soh 推荐， gen-2 ）要走变更流程，回到清单与 hara 重新对表。 5. 常见误区 把\"卖点清单\"当功能清单——宣传里的\"智能温控\"必须拆成可验证的功能项，否则没法挂需求； 把均衡误标为安全功能——性质定错，asil 属性与验证等级全错； 只列\"主动\"功能，漏掉诊断/记录类\"默默工作\"的功能——它们是安全目标的证据链； 清单冻结后不再随 hara 更新——安全分析发现缺口时，第一动作是回改清单，而不是在需求里偷偷加。 6. 自测 q1 ：为什么说\"功能遗漏即安全缺口\"？ q2 ：均衡功能为什么通常不挂安全目标？ q3 ：96 串平台的\"过充保护\"功能，至少要和哪些其他功能共同支撑其安全目标？ 答案 q1：hara 与安全目标都依附于功能/系统元素。一个未进清单的功能从未被危害分析覆盖，其失效模式没有对应的安全机制与验证——在 v 模型上表现为整条追溯链缺失。 q2：不均衡的直接后果是容量/能量损失与寿命衰减（性能与寿命问题），通常不直接触发危害事件；属性能/寿命级功能，asil 属性为 qm（除非特定架构下不均衡诱发过充等次生危害，需个案论证）。 q3：电压采集（f-s-01，提供判断依据）、充电通信（f-c-01，充电工况下执行降流/停止）、诊断记录（f-d-01，故障可追溯），再加执行链路的接触器控制（ hv-05 ）。单靠\"阈值判断\"一个功能无法闭环。 来源 s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》（功能与精度的产品技术条件底座） s-01：gb 38031-2025《电动汽车用动力蓄电池安全要求》（法规底线项，条款细节待核对 p-05） s-19：t/caamtb《电动汽车用电池管理系统设计规范》（六族功能框架参照，编号待核对 p-01） s-16：g. plett, battery management systems vol. i, ch.1（bms 功能的教材级展开） 延伸资源（仅列可靠名称，链接待补） 资源 说明 gb/t 38661-2020 标准原文 功能清单的国标对标文本 g. plett, battery management systems, vol. i （artech house, 2015） 第 1 章给出 bms 功能全景，经典教材 t/caamtb 设计规范 待取得编号与文本（p-01）[待补链] 待核对项（本课） t/caamtb 规范编号/年份及其与六族划分的章节对应（已有 p-01，本课引用） gb/t 38661-2020 估计精度条款数值（已有 p-13，本课引用） 96 串平台各参数均为教学示意值，不对应任何具体车型 "}, {"id": "SYS-02", "title": "课程 SYS-02：系统边界与接口——把\"谁管什么\"说死", "dom": "SYS", "verified": false, "html": "<blockquote><p>对应节点 <code>SYS-02<\/code>（../domains/01-边界与架构.md <span class=\"fileref\">（项目文件 ../domains/01-边界与架构.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-01\">SYS-01<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要边界定义<\/h3>\n<p>BMS 不是孤岛。它插在一张网里：VCU（Vehicle Control Unit，整车控制器）指挥、电机控制器执行、OBC（On-Board Charger，车载充电机）供电、热管理执行温度策略、云端做远程诊断。系统边界与接口定义回答两件事：<strong>谁负责什么决策；出问题算谁的。<\/strong><\/p>\n<ol>\n<li><strong>工程侧<\/strong>：闭环控制回路被边界切开时，每一半都要能独立\"善后\"（见第 3 节的断链策略）；<\/li>\n<li><strong>商务侧<\/strong>：节点约束说得直白——<strong>边界模糊是售后责任纠纷根源<\/strong>。<code>FLT-05<\/code>（售后故障码归属）就是本节点在商务层的投影。<\/li>\n<\/ol>\n<h3>2. 接口的三维定义（机制展开）<\/h3>\n<p>节点约束：<strong>接口需电气+通信+时序三维定义<\/strong>。只写\"谁给谁发什么信号\"只完成三分之一。<\/p>\n<p><strong>维度一：电气（Electrical）<\/strong><\/p>\n<ul>\n<li>供电归属：BMS 常电/点火电从哪来（影响功耗与唤醒行为）；<\/li>\n<li>传感器物理归属：电流传感器装在包内还是包外——装在谁身上，精度与失效责任就归谁；<\/li>\n<li>电平与驱动能力：接触器驱动信号、高压互锁（HVIL，<code>HV-01<\/code>）回路的电气参数。<\/li>\n<p><strong>维度二：通信（Communication）<\/strong><\/p>\n<li>每个信号的定义项：名称、周期 T_cycle、单位、分辨率、取值范围、<strong>失效值<\/strong>（Replacement Value，替换值）；<\/li>\n<li>失效语义：<strong>\"信号没了怎么办\"与\"信号是什么\"同等重要<\/strong>——丢失功率限值信号后按保守值降功率还是维持上一帧，必须在接口规范里写死。<\/li>\n<p><strong>维度三：时序（Timing）<\/strong><\/p>\n<li>谁在什么条件下发什么命令（上电握手顺序、预充请求链，<code>HV-05<\/code>）；<\/li>\n<li>超时判定 T_timeout 与超时后的行为（常见工程做法 T_timeout = 3×T_cycle，教学示意值）；<\/li>\n<li>端到端保护（E2E，End-to-End protection）：计数器+CRC，防\"报文还在但内容坏了\"。<\/li>\n<p><strong>划分原则（工程观点）<\/strong>：一个闭环控制回路尽量不跨边界拆两半；必须拆时，两侧都要定义断链后的独立安全行为。<\/p>\n<\/ul>\n<h3>3. 工程案例推演：交流充电功率控制的边界<\/h3>\n<p>场景：交流慢充。BMS 与 OBC 通过低压通信交互（报文体系按 GB/T 27930 口径，S-05，版本待核对 P-06）：<\/p>\n<table><thead><tr><th>环节<\/th><th>责任方<\/th><th>接口内容<\/th><th>断链行为（示意）<\/th><\/tr><\/thead><tbody><tr><td>需求给定<\/td><td>BMS → OBC<\/td><td>需求电流/电压限值，周期 10 ms<\/td><td>OBC 超时 30 ms → 停止输出<\/td><\/tr><tr><td>状态反馈<\/td><td>OBC → BMS<\/td><td>实际输出电流/电压，周期 10 ms<\/td><td>BMS 超时 30 ms → 请求停充 + 记 DTC<\/td><\/tr><tr><td>连接确认<\/td><td>充电口连接装置<\/td><td>连接状态 + 载流能力（GB/T 20234 系列，S-06）<\/td><td>未确认 → 不允许闭合充电回路<\/td><\/tr><\/tbody><\/table>\n<p>推演要点：<\/p>\n<ol>\n<li><strong>需求给定在 BMS<\/strong>（它知道电芯能吃多少），<strong>执行在 OBC<\/strong>——闭环被边界切开，所以两侧都有独立超时停机行为，这就是\"两侧都能善后\"；<\/li>\n<li>数字自洽：超时 30 ms = 3 × 10 ms（3 倍周期规则，教学示意值）；<\/li>\n<li><strong>售后案例<\/strong>：用户报\"充不进电\"。责任判定顺序：先查充电口连接确认 → 再看 OBC 是否报\"未收到需求\" → 最后看 BMS 是否报\"未收到反馈\"。三个环节的 DTC 归属分别是充电口硬件、OBC、BMS——<strong>DTC 语义在接口定义阶段就已注定<\/strong>（<code>FLT-05<\/code>）。<\/li>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>通信矩阵（哪个节点发什么信号）由<strong>主机厂<\/strong>统一发布，BMS 按矩阵实现——这是边界定义在网络层的落点（<code>SYS-04<\/code>）；<\/li>\n<li>接口文档形态：ICD（Interface Control Document，接口控制文件）+ 通信矩阵 + 时序图三件套；<\/li>\n<li>SOH/SOC 上报信号的语义分歧（单位/精度/刷新语义）是电池厂 vs 主机厂争议的高发区（<code>SW-05<\/code>、compare/matrix.md 维度 1）——病根都在接口定义；<\/li>\n<li>边界随架构漂移：域集中架构下 VCU 功能并入域控，\"BMS↔VCU\"变成\"BMS↔域控\"，但边界定义的<strong>方法<\/strong>不变。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把接口规范写成信号字典——漏了失效值与超时行为，等于只做了三分之一；<\/li>\n<li>单位/分辨率各写各的（SOH 是百分比还是 0~1000 定点数）——联调时爆雷，售后时扯皮；<\/li>\n<li>把边界图当组织架构图——边界定义的是<strong>技术决策权<\/strong>，不是汇报关系；<\/li>\n<li>默认\"信号不会丢\"——真实车上丢帧、休眠唤醒、网关路由失败都是常态，断链行为必须显式设计。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：接口三维定义是哪三维？只定义通信维度会漏掉什么？ <strong>Q2<\/strong>：BMS→OBC 的需求信号周期 20 ms，按 3 倍周期规则，OBC 的超时应设多少？ <strong>Q3<\/strong>：为什么\"充不进电\"的售后判定要从连接确认查起？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：电气、通信、时序。只定义通信会漏掉传感器/执行器的物理归属（责任无法锚定）与命令顺序/超时行为（断链后没有安全行为）。<\/li>\n<li>Q2：3 × 20 ms = <strong>60 ms<\/strong>（3 倍周期是常见工程经验、教学示意值，实际以整车网络规范为准）。<\/li>\n<li>Q3：连接确认是充电闭环的第一个环节，且归属（充电口硬件）与后两个环节（OBC/BMS）不同——先查它才能把故障域切开，避免把充电口问题误判给 BMS。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-19：T/CAAMTB《电动汽车用电池管理系统设计规范》（边界与接口约束来源，编号待核对 P-01）<\/li>\n<li>S-05：GB/T 27930（BMS-充电机通信的超时与中断处理，版本待核对 P-06）<\/li>\n<li>S-06：GB/T 20234.1~.3（充电连接装置与载流能力）<\/li>\n<li>S-03：GB/T 38661-2020（对外接口与精度的产品要求）<\/li>\n<li>S-09：ISO 14229-1（UDS 诊断接口语义基础）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 27930 标准原文<\/td><td>充电通信超时/中断状态机的标准依据<\/td><\/tr><tr><td>ISO 14229-1 原文<\/td><td>UDS 服务与 DID 语义<\/td><\/tr><tr><td>T/CAAMTB 设计规范<\/td><td>待取得编号与文本（P-01）[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 27930 现行版本与报文细节（已有 P-06；本课未直接引用报文缩写）<\/li>\n<li>T_timeout = 3×T_cycle 惯例的规范出处（教学示意，建议新 P 项：整车网络规范的超时定义惯例）<\/li>\n<\/ul>", "text": " 对应节点 sys-02 （../domains/01-边界与架构.md （项目文件 ../domains/01-边界与架构.md） ）｜ 前置： sys-01 ｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要边界定义 bms 不是孤岛。它插在一张网里：vcu（vehicle control unit，整车控制器）指挥、电机控制器执行、obc（on-board charger，车载充电机）供电、热管理执行温度策略、云端做远程诊断。系统边界与接口定义回答两件事： 谁负责什么决策；出问题算谁的。 工程侧 ：闭环控制回路被边界切开时，每一半都要能独立\"善后\"（见第 3 节的断链策略）； 商务侧 ：节点约束说得直白—— 边界模糊是售后责任纠纷根源 。 flt-05 （售后故障码归属）就是本节点在商务层的投影。 2. 接口的三维定义（机制展开） 节点约束： 接口需电气+通信+时序三维定义 。只写\"谁给谁发什么信号\"只完成三分之一。 维度一：电气（electrical） 供电归属：bms 常电/点火电从哪来（影响功耗与唤醒行为）； 传感器物理归属：电流传感器装在包内还是包外——装在谁身上，精度与失效责任就归谁； 电平与驱动能力：接触器驱动信号、高压互锁（hvil， hv-01 ）回路的电气参数。 维度二：通信（communication） 每个信号的定义项：名称、周期 t_cycle、单位、分辨率、取值范围、 失效值 （replacement value，替换值）； 失效语义： \"信号没了怎么办\"与\"信号是什么\"同等重要 ——丢失功率限值信号后按保守值降功率还是维持上一帧，必须在接口规范里写死。 维度三：时序（timing） 谁在什么条件下发什么命令（上电握手顺序、预充请求链， hv-05 ）； 超时判定 t_timeout 与超时后的行为（常见工程做法 t_timeout = 3×t_cycle，教学示意值）； 端到端保护（e2e，end-to-end protection）：计数器+crc，防\"报文还在但内容坏了\"。 划分原则（工程观点） ：一个闭环控制回路尽量不跨边界拆两半；必须拆时，两侧都要定义断链后的独立安全行为。 3. 工程案例推演：交流充电功率控制的边界 场景：交流慢充。bms 与 obc 通过低压通信交互（报文体系按 gb/t 27930 口径，s-05，版本待核对 p-06）： 环节 责任方 接口内容 断链行为（示意） 需求给定 bms → obc 需求电流/电压限值，周期 10 ms obc 超时 30 ms → 停止输出 状态反馈 obc → bms 实际输出电流/电压，周期 10 ms bms 超时 30 ms → 请求停充 + 记 dtc 连接确认 充电口连接装置 连接状态 + 载流能力（gb/t 20234 系列，s-06） 未确认 → 不允许闭合充电回路 推演要点： 需求给定在 bms （它知道电芯能吃多少）， 执行在 obc ——闭环被边界切开，所以两侧都有独立超时停机行为，这就是\"两侧都能善后\"； 数字自洽：超时 30 ms = 3 × 10 ms（3 倍周期规则，教学示意值）； 售后案例 ：用户报\"充不进电\"。责任判定顺序：先查充电口连接确认 → 再看 obc 是否报\"未收到需求\" → 最后看 bms 是否报\"未收到反馈\"。三个环节的 dtc 归属分别是充电口硬件、obc、bms—— dtc 语义在接口定义阶段就已注定 （ flt-05 ）。 4. 工程实态 通信矩阵（哪个节点发什么信号）由 主机厂 统一发布，bms 按矩阵实现——这是边界定义在网络层的落点（ sys-04 ）； 接口文档形态：icd（interface control document，接口控制文件）+ 通信矩阵 + 时序图三件套； soh/soc 上报信号的语义分歧（单位/精度/刷新语义）是电池厂 vs 主机厂争议的高发区（ sw-05 、compare/matrix.md 维度 1）——病根都在接口定义； 边界随架构漂移：域集中架构下 vcu 功能并入域控，\"bms↔vcu\"变成\"bms↔域控\"，但边界定义的 方法 不变。 5. 常见误区 把接口规范写成信号字典——漏了失效值与超时行为，等于只做了三分之一； 单位/分辨率各写各的（soh 是百分比还是 0~1000 定点数）——联调时爆雷，售后时扯皮； 把边界图当组织架构图——边界定义的是 技术决策权 ，不是汇报关系； 默认\"信号不会丢\"——真实车上丢帧、休眠唤醒、网关路由失败都是常态，断链行为必须显式设计。 6. 自测 q1 ：接口三维定义是哪三维？只定义通信维度会漏掉什么？ q2 ：bms→obc 的需求信号周期 20 ms，按 3 倍周期规则，obc 的超时应设多少？ q3 ：为什么\"充不进电\"的售后判定要从连接确认查起？ 答案 q1：电气、通信、时序。只定义通信会漏掉传感器/执行器的物理归属（责任无法锚定）与命令顺序/超时行为（断链后没有安全行为）。 q2：3 × 20 ms = 60 ms （3 倍周期是常见工程经验、教学示意值，实际以整车网络规范为准）。 q3：连接确认是充电闭环的第一个环节，且归属（充电口硬件）与后两个环节（obc/bms）不同——先查它才能把故障域切开，避免把充电口问题误判给 bms。 来源 s-19：t/caamtb《电动汽车用电池管理系统设计规范》（边界与接口约束来源，编号待核对 p-01） s-05：gb/t 27930（bms-充电机通信的超时与中断处理，版本待核对 p-06） s-06：gb/t 20234.1~.3（充电连接装置与载流能力） s-03：gb/t 38661-2020（对外接口与精度的产品要求） s-09：iso 14229-1（uds 诊断接口语义基础） 延伸资源（仅列可靠名称，链接待补） 资源 说明 gb/t 27930 标准原文 充电通信超时/中断状态机的标准依据 iso 14229-1 原文 uds 服务与 did 语义 t/caamtb 设计规范 待取得编号与文本（p-01）[待补链] 待核对项（本课） gb/t 27930 现行版本与报文细节（已有 p-06；本课未直接引用报文缩写） t_timeout = 3×t_cycle 惯例的规范出处（教学示意，建议新 p 项：整车网络规范的超时定义惯例） "}, {"id": "SYS-03", "title": "课程 SYS-03：需求管理与功能安全初始化——让每句话可追溯", "dom": "SYS", "verified": false, "html": "<blockquote><p>对应节点 <code>SYS-03<\/code>（../domains/01-边界与架构.md <span class=\"fileref\">（项目文件 ../domains/01-边界与架构.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-01\">SYS-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a> ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需求管理是功能安全的第一道工序<\/h3>\n<p>节点约束只有两句话：<strong>需求需可追溯（V 模型）；安全需求需标注 ASIL 与验证准则。<\/strong> 这两句话正是 ISO 26262（S-07）全部工作产品的组织方式：<\/p>\n<ol>\n<li><strong>没有条目化，就没有追溯<\/strong>——V 模型（<code>DEV-01<\/code>）左侧每件设计产出、右侧每条测试用例，追溯的\"锚点\"都是需求条目；<\/li>\n<li><strong>没有 ASIL 属性，就没有差异化开发<\/strong>——ASIL 决定方法严格度（评审形式、覆盖率目标、硬件度量），逐条标注才能逐条裁剪；<\/li>\n<li><strong>没有验证准则，需求不可测<\/strong>——\"BMS 应保护电池\"无法判定通过/不通过；\"任一电芯电压 &gt; 4.25 V 持续 100 ms 后，应在 200 ms 内请求断开主正接触器\"可以（数字为示意）。<\/li>\n<p>\"功能安全初始化\"的实操含义：在概念阶段就把安全目标的 ASIL 属性写入需求库，而不是开发中途补标。<\/p>\n<\/ol>\n<h3>2. 需求条目化：质量属性与属性模板<\/h3>\n<p><strong>好需求的质量属性<\/strong>（需求工程方法论 + ISO 26262-8 对安全需求规范的要求，S-07）：无歧义、单一（一条只说一件事）、可验证、可实现、有唯一 ID；并且<strong>写\"问题\"不写\"方案\"<\/strong>——需求层说\"应防止过充\"，方案层（FSC/TSC，见 <code>SAFE-01<\/code>）才说\"用独立比较器\"。<\/p>\n<p><strong>每条需求的属性模板<\/strong>（字段逐个解释）：<\/p>\n<table><thead><tr><th>字段<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>ID<\/td><td>全生命周期唯一编号，如 SYS-SR-021（SR = System Requirement）<\/td><\/tr><tr><td>来源（Traces to）<\/td><td>上游条目（安全目标/TSR/功能需求）；不允许\"无来源\"<\/td><\/tr><tr><td>ASIL<\/td><td>QM/A/B/C/D。QM 不是\"没有\"，是\"按质量流程管理\"<\/td><\/tr><tr><td>验证准则（Verification Criteria）<\/td><td>通过/不通过的判据与验证方法（HIL/实测/评审）<\/td><\/tr><tr><td>状态<\/td><td>草稿/已评审/已验证/已释放；变更走影响分析<\/td><\/tr><\/tbody><\/table>\n<p><strong>追溯链（V 模型双向）<\/strong>：安全目标 → 技术安全需求（TSR，Technical Safety Requirement）→ 系统需求 → 硬件/软件需求 → 测试用例。链上任何一环缺失或断裂，审核时都会被打回；<strong>双向<\/strong>意味着既要从需求找到测试，也要能从测试找到需求（影响分析靠后者）。<\/p>\n<h3>3. 工程案例推演：一条过充需求的完整溯源链<\/h3>\n<p>沿用 <code>SAFE-02<\/code> 推演的安全目标（教学示意值）：SG-01\"防止任一电芯超过充电电压上限\"（ASIL D，示意）。<\/p>\n<table><thead><tr><th>层级<\/th><th>ID<\/th><th>需求文本（示意）<\/th><th>ASIL<\/th><th>验证准则（示意）<\/th><\/tr><\/thead><tbody><tr><td>安全目标<\/td><td>SG-01<\/td><td>防止任一电芯超过充电电压上限<\/td><td>D<\/td><td>HARA 评审闭合<\/td><\/tr><tr><td>TSR<\/td><td>SYS-TSR-01<\/td><td>检测到 V_cell &gt; 4.25 V 持续 100 ms 时，BMS 应在 200 ms 内请求断开主正接触器<\/td><td>D<\/td><td>故障注入：注入 4.26 V 阶跃，测断开时刻<\/td><\/tr><tr><td>硬件需求<\/td><td>SYS-HR-11<\/td><td>电压采集通道精度 ±2 mV（−20~60°C）<\/td><td>B(D)（分解而来，见 <code>SAFE-03<\/code>）<\/td><td>全温域实测 + 计量报告<\/td><\/tr><tr><td>软件需求<\/td><td>SYS-SWR-23<\/td><td>过充判断任务周期 10 ms，防抖计数 10 拍<\/td><td>D<\/td><td>单元测试 MC/DC 覆盖<\/td><\/tr><tr><td>测试用例<\/td><td>SYS-TC-114<\/td><td>HIL 注入过压阶跃信号<\/td><td>—<\/td><td>断开时刻 ≤ TSR 限值<\/td><\/tr><\/tbody><\/table>\n<p>自洽性检查（本例的核心训练）：<\/p>\n<ol>\n<li>防抖 10 拍 × 任务周期 10 ms = 100 ms 检测窗——与 TSR 的 100 ms 咬合；<\/li>\n<li>检测 100 ms + 决策与执行 100 ms ≈ 200 ms 反应上限——与 TSR 的 200 ms 咬合（更完整的时间预算见 <code>SAFE-04<\/code>）；<\/li>\n<li>硬件需求标 B(D) 而不是 D——这是 ASIL 分解的结果，规则在 <code>SAFE-03<\/code>；<\/li>\n<li>每条都有 ID、来源、ASIL、验证准则四件套——缺一个就是审核问题。<\/li>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>工具链：需求放在专业 ALM/RM 工具（DOORS/Polarion 类，工具名不构成推荐）并与测试管理、CI 联动；Word/Excel 管需求是审核重灾区；<\/li>\n<li>OEM 与供应商之间用 DIA（Development Interface Agreement，开发接口协议，ISO 26262 术语）分割安全活动的责任（谁做什么验证写进合同附件）；<\/li>\n<li>变更管理：任何需求变更先做<strong>影响分析<\/strong>——沿追溯链列出受影响的下游需求与测试用例，再定变更范围与回归集；<\/li>\n<li>常见形态：安全需求与非安全需求分库管理但同一工具，用 ASIL 属性过滤视图。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把设计方案写进需求（\"采用独立比较器实现过充保护\"）——方案变更时需求被迫变更，追溯链断裂；<\/li>\n<li>ASIL 只在文档封面声明一次——逐条属性缺失导致无法按条裁剪与验证；<\/li>\n<li>追溯只做单向（需求→测试）——上游变更时找不到受影响的下游，影响分析失效；<\/li>\n<li>需求文本里全是\"应合理/应尽快\"——不可验证的需求等于没有需求。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：\"BMS 应可靠地防止过充\"这条需求缺了什么？ <strong>Q2<\/strong>：为什么硬件需求可以标 B(D)？ <strong>Q3<\/strong>：需求变更后必须做的第一件事是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：缺唯一 ID、量化阈值与时间参数（不可验证）、ASIL 属性、验证准则、上游来源（没有挂到安全目标）。<\/li>\n<li>Q2：D 表示原始安全需求的 ASIL；括号内 D 表示验证严格度按 D 保留——这是 ASIL 分解后冗余通道需求的合法标注方式（分解规则与前提见 <code>SAFE-03<\/code>）。<\/li>\n<li>Q3：沿追溯链做影响分析，列出受影响的下游需求与测试用例，再决定变更范围与回归验证集。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（Part 8 安全需求的规范与管理；Part 3 概念阶段安全目标/TSR 框架；<strong>DIA 见 Part 2 Clause 6——2026-11-19 核实<\/strong>：6.4.2 要求分布式开发建立 DIA，附录 B 给出示例）<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-19 部分链接已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.kekaoxing.com/wp-content/uploads/standard/ISO26262-2018/ISO-26262-2-2018.pdf\" target=\"_blank\" rel=\"noopener\">ISO 26262-2:2018 PDF（第三方托管副本）<\/a><\/td><td>A<\/td><td>✅<\/td><td>Clause 6（DIA）与附录 B（示例 DIA）；权威版本以 ISO 官方为准<\/td><\/tr><tr><td>ISO 26262:2018 Part 8 原文<\/td><td>A<\/td><td>—<\/td><td>分布式开发接口（Clause 5）的标准依据<\/td><\/tr><tr><td>ISO 26262:2018 Part 3 原文<\/td><td>A<\/td><td>—<\/td><td>安全目标与 TSR 层级的出处<\/td><\/tr><tr><td>K. Wiegers, J. Beatty, <em>Software Requirements<\/em>（3rd ed., Microsoft Press, 2013）<\/td><td>B<\/td><td>—<\/td><td>需求工程经典教材<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>溯源链案例全部数字（4.25 V/100 ms/200 ms/±2 mV 等）为教学示意值，不对应任何车型<\/li>\n<li>~~DIA 在 ISO 26262-2:2018 中的具体条款位置~~ → <strong>2026-11-19 已核实<\/strong>（Clause 6，6.4.2 + 附录 B；P-19 关闭）<\/li>\n<\/ul>", "text": " 对应节点 sys-03 （../domains/01-边界与架构.md （项目文件 ../domains/01-边界与架构.md） ）｜ 前置： sys-01 、 sys-02 ｜ 预计用时 60 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需求管理是功能安全的第一道工序 节点约束只有两句话： 需求需可追溯（v 模型）；安全需求需标注 asil 与验证准则。 这两句话正是 iso 26262（s-07）全部工作产品的组织方式： 没有条目化，就没有追溯 ——v 模型（ dev-01 ）左侧每件设计产出、右侧每条测试用例，追溯的\"锚点\"都是需求条目； 没有 asil 属性，就没有差异化开发 ——asil 决定方法严格度（评审形式、覆盖率目标、硬件度量），逐条标注才能逐条裁剪； 没有验证准则，需求不可测 ——\"bms 应保护电池\"无法判定通过/不通过；\"任一电芯电压 &gt; 4.25 v 持续 100 ms 后，应在 200 ms 内请求断开主正接触器\"可以（数字为示意）。 \"功能安全初始化\"的实操含义：在概念阶段就把安全目标的 asil 属性写入需求库，而不是开发中途补标。 2. 需求条目化：质量属性与属性模板 好需求的质量属性 （需求工程方法论 + iso 26262-8 对安全需求规范的要求，s-07）：无歧义、单一（一条只说一件事）、可验证、可实现、有唯一 id；并且 写\"问题\"不写\"方案\" ——需求层说\"应防止过充\"，方案层（fsc/tsc，见 safe-01 ）才说\"用独立比较器\"。 每条需求的属性模板 （字段逐个解释）： 字段 含义 id 全生命周期唯一编号，如 sys-sr-021（sr = system requirement） 来源（traces to） 上游条目（安全目标/tsr/功能需求）；不允许\"无来源\" asil qm/a/b/c/d。qm 不是\"没有\"，是\"按质量流程管理\" 验证准则（verification criteria） 通过/不通过的判据与验证方法（hil/实测/评审） 状态 草稿/已评审/已验证/已释放；变更走影响分析 追溯链（v 模型双向） ：安全目标 → 技术安全需求（tsr，technical safety requirement）→ 系统需求 → 硬件/软件需求 → 测试用例。链上任何一环缺失或断裂，审核时都会被打回； 双向 意味着既要从需求找到测试，也要能从测试找到需求（影响分析靠后者）。 3. 工程案例推演：一条过充需求的完整溯源链 沿用 safe-02 推演的安全目标（教学示意值）：sg-01\"防止任一电芯超过充电电压上限\"（asil d，示意）。 层级 id 需求文本（示意） asil 验证准则（示意） 安全目标 sg-01 防止任一电芯超过充电电压上限 d hara 评审闭合 tsr sys-tsr-01 检测到 v_cell &gt; 4.25 v 持续 100 ms 时，bms 应在 200 ms 内请求断开主正接触器 d 故障注入：注入 4.26 v 阶跃，测断开时刻 硬件需求 sys-hr-11 电压采集通道精度 ±2 mv（−20~60°c） b(d)（分解而来，见 safe-03 ） 全温域实测 + 计量报告 软件需求 sys-swr-23 过充判断任务周期 10 ms，防抖计数 10 拍 d 单元测试 mc/dc 覆盖 测试用例 sys-tc-114 hil 注入过压阶跃信号 — 断开时刻 ≤ tsr 限值 自洽性检查（本例的核心训练）： 防抖 10 拍 × 任务周期 10 ms = 100 ms 检测窗——与 tsr 的 100 ms 咬合； 检测 100 ms + 决策与执行 100 ms ≈ 200 ms 反应上限——与 tsr 的 200 ms 咬合（更完整的时间预算见 safe-04 ）； 硬件需求标 b(d) 而不是 d——这是 asil 分解的结果，规则在 safe-03 ； 每条都有 id、来源、asil、验证准则四件套——缺一个就是审核问题。 4. 工程实态 工具链：需求放在专业 alm/rm 工具（doors/polarion 类，工具名不构成推荐）并与测试管理、ci 联动；word/excel 管需求是审核重灾区； oem 与供应商之间用 dia（development interface agreement，开发接口协议，iso 26262 术语）分割安全活动的责任（谁做什么验证写进合同附件）； 变更管理：任何需求变更先做 影响分析 ——沿追溯链列出受影响的下游需求与测试用例，再定变更范围与回归集； 常见形态：安全需求与非安全需求分库管理但同一工具，用 asil 属性过滤视图。 5. 常见误区 把设计方案写进需求（\"采用独立比较器实现过充保护\"）——方案变更时需求被迫变更，追溯链断裂； asil 只在文档封面声明一次——逐条属性缺失导致无法按条裁剪与验证； 追溯只做单向（需求→测试）——上游变更时找不到受影响的下游，影响分析失效； 需求文本里全是\"应合理/应尽快\"——不可验证的需求等于没有需求。 6. 自测 q1 ：\"bms 应可靠地防止过充\"这条需求缺了什么？ q2 ：为什么硬件需求可以标 b(d)？ q3 ：需求变更后必须做的第一件事是什么？ 答案 q1：缺唯一 id、量化阈值与时间参数（不可验证）、asil 属性、验证准则、上游来源（没有挂到安全目标）。 q2：d 表示原始安全需求的 asil；括号内 d 表示验证严格度按 d 保留——这是 asil 分解后冗余通道需求的合法标注方式（分解规则与前提见 safe-03 ）。 q3：沿追溯链做影响分析，列出受影响的下游需求与测试用例，再决定变更范围与回归验证集。 来源 s-07：iso 26262:2018（part 8 安全需求的规范与管理；part 3 概念阶段安全目标/tsr 框架； dia 见 part 2 clause 6——2026-11-19 核实 ：6.4.2 要求分布式开发建立 dia，附录 b 给出示例） 延伸资源（2026-11-19 部分链接已核实） 资源 级别 免费 说明 iso 26262-2:2018 pdf（第三方托管副本） a ✅ clause 6（dia）与附录 b（示例 dia）；权威版本以 iso 官方为准 iso 26262:2018 part 8 原文 a — 分布式开发接口（clause 5）的标准依据 iso 26262:2018 part 3 原文 a — 安全目标与 tsr 层级的出处 k. wiegers, j. beatty, software requirements （3rd ed., microsoft press, 2013） b — 需求工程经典教材 待核对项（本课） 溯源链案例全部数字（4.25 v/100 ms/200 ms/±2 mv 等）为教学示意值，不对应任何车型 ~~dia 在 iso 26262-2:2018 中的具体条款位置~~ → 2026-11-19 已核实 （clause 6，6.4.2 + 附录 b；p-19 关闭） "}, {"id": "SYS-04", "title": "课程 SYS-04：BMS 在整车网络中的节点定义", "dom": "SYS", "verified": false, "html": "<blockquote><p>对应节点 <code>SYS-04<\/code>（../domains/01-边界与架构.md <span class=\"fileref\">（项目文件 ../domains/01-边界与架构.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a> ｜ 预计用时 45 min 数字规则：帧开销 130 bit 为工程估算口径（教学示意值）；其余未挂标准的数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么 BMS 需要\"节点定义\"<\/h3>\n<p>SYS-02 把 BMS 与整车的职责切开，节点定义（Network Node Definition）则回答：<strong>BMS 以什么身份、什么节奏、什么失败行为挂在总线上。<\/strong> 节点约束：<strong>报文周期与失效处理（Timeout/替换值）需按整车网络规范定义<\/strong>——周期与失效处理不是 BMS 单方面拍脑袋，而是整车网络设计的组成部分。<\/p>\n<h3>2. 机制展开：从链路层到失效处理<\/h3>\n<p><strong>（1）物理与链路层（ISO 11898 系列，S-11）<\/strong><\/p>\n<ul>\n<li>CAN（Controller Area Network，控制器局域网）：多主广播、ID 仲裁（数值小者优先生行）、差分电平；整车主流为 500 kbit/s 经典 CAN 与 CAN FD（数据段提速，示意 2~5 Mbit/s）；<\/li>\n<li>LIN（ISO 17987，S-12）：低成本主从总线，BMS 包内从控板通信的常见备选；<\/li>\n<li>一帧 8 字节经典 CAN 的线路占用 ≈ <strong>130 bit<\/strong>（含位填充与帧间空间，工程估算口径，教学示意值）。<\/li>\n<p><strong>（2）BMS 的典型报文结构<\/strong><\/p>\n<li>周期报文：SOC/SOH/SOP、功率限值、极值电压/温度——按固定周期广播（典型 10~100 ms，示意）；<\/li>\n<li>事件报文：报警/故障帧——事件触发发送；<\/li>\n<li>诊断报文：UDS（ISO 14229-1，S-09）请求/响应，按需通信。三类报文的负载要分开估算（误区 4）。<\/li>\n<p><strong>（3）失效处理三件套（本节核心，符号逐个解释）<\/strong><\/p>\n<li><strong>Timeout（超时）<\/strong>：接收方在 T_timeout 内未收到周期报文即判定失效，常见取 3×T_cycle（示意惯例）；<\/li>\n<li><strong>替换值（Replacement Value）<\/strong>：超时后使用的默认值——<strong>必须逐信号定义为\"安全方向\"<\/strong>（如功率限值丢失→按最保守限值），这是接口规范里最容易被漏掉的一栏；<\/li>\n<li><strong>E2E 保护<\/strong>：计数器 + CRC，防\"报文还在但内容/顺序错了\"；节点定义需声明哪些信号组受 E2E 保护及其保护档位。<\/li>\n<\/ul>\n<h3>3. 手算实例：BMS 节点的总线负载<\/h3>\n<p>设 BMS 发送 4 条 10 ms 周期报文 + 2 条 100 ms 周期报文，500 kbit/s 经典 CAN，每帧 130 bit：<\/p>\n<ul>\n<li>10 ms 报文：130 bit ÷ 10 ms = 13 kbit/s，4 条 = <strong>52 kbit/s<\/strong><\/li>\n<li>100 ms 报文：130 bit ÷ 100 ms = 1.3 kbit/s，2 条 = <strong>2.6 kbit/s<\/strong><\/li>\n<li>合计 54.6 kbit/s ÷ 500 kbit/s = <strong>≈11% 总线占用<\/strong><\/li>\n<p>工程含义（负载经验值为教学示意：单节点宜控制在 10~15% 内、整车 40~50% 预警）：<\/p>\n<li>周期从 10 ms 改 5 ms → 占用翻倍——\"周期越短越好\"不成立，总线负载与抖动是硬约束；<\/li>\n<li>迁移 CAN FD 后数据段提速、开销比例下降，同等信号量的占用显著降低。<\/li>\n<p><strong>Timeout 推演（接 SYS-02 充电案例）<\/strong>：VCU 在 3×10 ms = 30 ms 内未收到 BMS 功率限值报文 → 记通信 DTC → 执行替换值（保守限值）→ 若 1 s（示意）后仍未恢复则进入整车降级（<code>FLT-03<\/code>）。反向：BMS 收不到 VCU 请求 → 按默认保守限值运行并报警。两个方向都要定义——失效处理是对称的。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>通信矩阵（ID/周期/信号布局）由<strong>主机厂<\/strong>统一发布，BMS 按矩阵实现；GB/T 38661（S-03）对通信能力有产品级要求；<\/li>\n<li>AUTOSAR CP（<code>SW-01<\/code>）把 COM/PduR/NM 做成标准配置模块，节点定义被配置化；UDS 与安全访问的语义见 <code>SW-03/05<\/code>；<\/li>\n<li>网络管理（NM，Network Management）：睡眠/唤醒协调——BMS 静态漏电流受整车主管理，驻车安全的经典话题；<\/li>\n<li>新形态：无线 BMS（<code>ARCH-W<\/code>）把模组间链路换成射频（S-18），节点定义新增射频认证与密钥管理维度（<code>SAFE-05<\/code>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"周期越短越安全\"——负载与抖动上升，反而挤掉关键事件报文的发送窗口；<\/li>\n<li>替换值随手填 0——功率限值丢失填保守低值是对的方向，但 SOC 丢失填 0 会造成仪表跳变；每个信号要单独论证\"安全方向\"；<\/li>\n<li>只定义发送不定义接收超时——接收方必须有超时与替换值策略，失效处理是对称的；<\/li>\n<li>把诊断报文算进周期负载——UDS 是按需通信，负载估算要区分周期/事件/诊断三类。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：500 kbit/s 下每帧 130 bit，一条 20 ms 周期报文占用多少带宽？ <strong>Q2<\/strong>：为什么替换值必须逐信号定义\"安全方向\"？ <strong>Q3<\/strong>：Timeout 取 3×T_cycle 的工程含义是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：130 bit ÷ 20 ms = 6.5 kbit/s，占 500 kbit/s 的 <strong>1.3%<\/strong>。<\/li>\n<li>Q2：信号失效时的默认行为就是安全行为的一部分：不同信号的保守方向不同（功率限值→往下限；SOC→保持上值并标注失效；报警信号→按报警激活处理）。填错方向会把\"失效\"变成\"危害\"。<\/li>\n<li>Q3：容忍偶发丢帧（单帧丢失不触发），连续 3 个周期缺失才判定失效——在\"误报\"与\"漏判\"之间取平衡（示意惯例，具体以整车网络规范为准）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-11：ISO 11898 系列（CAN/CAN FD 链路层与物理层）<\/li>\n<li>S-12：ISO 17987（LIN）<\/li>\n<li>S-09：ISO 14229-1（UDS 诊断通信）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 对外通信的产品要求）<\/li>\n<li>S-18：TI 无线 BMS 官方资料（wBMS 形态案例，发布状态待核对）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 11898-1:2015 原文<\/td><td>CAN 数据链路层与物理信令的权威定义<\/td><\/tr><tr><td>Bosch《CAN Specification》2.0（1991）<\/td><td>CAN 协议的原始规范，经典必读<\/td><\/tr><tr><td>开源项目 SocketCAN / python-can<\/td><td>用 Linux/Python 实操 CAN 报文，动手验证本课负载计算<\/td><\/tr><tr><td>AUTOSAR Classic Platform 标准文本<\/td><td>COM/NM 配置化节点定义的工业参照<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>帧开销 130 bit 与\"单节点 10~15%、整车 40~50%\"负载经验值的文献出处（教学示意值，建议新 P 项）<\/li>\n<li>CAN FD 整车采用的典型速率档位（示意 2~5 Mbit/s，建议新 P 项）<\/li>\n<\/ul>", "text": " 对应节点 sys-04 （../domains/01-边界与架构.md （项目文件 ../domains/01-边界与架构.md） ）｜ 前置： sys-02 ｜ 预计用时 45 min 数字规则：帧开销 130 bit 为工程估算口径（教学示意值）；其余未挂标准的数字均为 教学示意值 。 1. 为什么 bms 需要\"节点定义\" sys-02 把 bms 与整车的职责切开，节点定义（network node definition）则回答： bms 以什么身份、什么节奏、什么失败行为挂在总线上。 节点约束： 报文周期与失效处理（timeout/替换值）需按整车网络规范定义 ——周期与失效处理不是 bms 单方面拍脑袋，而是整车网络设计的组成部分。 2. 机制展开：从链路层到失效处理 （1）物理与链路层（iso 11898 系列，s-11） can（controller area network，控制器局域网）：多主广播、id 仲裁（数值小者优先生行）、差分电平；整车主流为 500 kbit/s 经典 can 与 can fd（数据段提速，示意 2~5 mbit/s）； lin（iso 17987，s-12）：低成本主从总线，bms 包内从控板通信的常见备选； 一帧 8 字节经典 can 的线路占用 ≈ 130 bit （含位填充与帧间空间，工程估算口径，教学示意值）。 （2）bms 的典型报文结构 周期报文：soc/soh/sop、功率限值、极值电压/温度——按固定周期广播（典型 10~100 ms，示意）； 事件报文：报警/故障帧——事件触发发送； 诊断报文：uds（iso 14229-1，s-09）请求/响应，按需通信。三类报文的负载要分开估算（误区 4）。 （3）失效处理三件套（本节核心，符号逐个解释） timeout（超时） ：接收方在 t_timeout 内未收到周期报文即判定失效，常见取 3×t_cycle（示意惯例）； 替换值（replacement value） ：超时后使用的默认值—— 必须逐信号定义为\"安全方向\" （如功率限值丢失→按最保守限值），这是接口规范里最容易被漏掉的一栏； e2e 保护 ：计数器 + crc，防\"报文还在但内容/顺序错了\"；节点定义需声明哪些信号组受 e2e 保护及其保护档位。 3. 手算实例：bms 节点的总线负载 设 bms 发送 4 条 10 ms 周期报文 + 2 条 100 ms 周期报文，500 kbit/s 经典 can，每帧 130 bit： 10 ms 报文：130 bit ÷ 10 ms = 13 kbit/s，4 条 = 52 kbit/s 100 ms 报文：130 bit ÷ 100 ms = 1.3 kbit/s，2 条 = 2.6 kbit/s 合计 54.6 kbit/s ÷ 500 kbit/s = ≈11% 总线占用 工程含义（负载经验值为教学示意：单节点宜控制在 10~15% 内、整车 40~50% 预警）： 周期从 10 ms 改 5 ms → 占用翻倍——\"周期越短越好\"不成立，总线负载与抖动是硬约束； 迁移 can fd 后数据段提速、开销比例下降，同等信号量的占用显著降低。 timeout 推演（接 sys-02 充电案例） ：vcu 在 3×10 ms = 30 ms 内未收到 bms 功率限值报文 → 记通信 dtc → 执行替换值（保守限值）→ 若 1 s（示意）后仍未恢复则进入整车降级（ flt-03 ）。反向：bms 收不到 vcu 请求 → 按默认保守限值运行并报警。两个方向都要定义——失效处理是对称的。 4. 工程实态 通信矩阵（id/周期/信号布局）由 主机厂 统一发布，bms 按矩阵实现；gb/t 38661（s-03）对通信能力有产品级要求； autosar cp（ sw-01 ）把 com/pdur/nm 做成标准配置模块，节点定义被配置化；uds 与安全访问的语义见 sw-03/05 ； 网络管理（nm，network management）：睡眠/唤醒协调——bms 静态漏电流受整车主管理，驻车安全的经典话题； 新形态：无线 bms（ arch-w ）把模组间链路换成射频（s-18），节点定义新增射频认证与密钥管理维度（ safe-05 ）。 5. 常见误区 \"周期越短越安全\"——负载与抖动上升，反而挤掉关键事件报文的发送窗口； 替换值随手填 0——功率限值丢失填保守低值是对的方向，但 soc 丢失填 0 会造成仪表跳变；每个信号要单独论证\"安全方向\"； 只定义发送不定义接收超时——接收方必须有超时与替换值策略，失效处理是对称的； 把诊断报文算进周期负载——uds 是按需通信，负载估算要区分周期/事件/诊断三类。 6. 自测 q1 ：500 kbit/s 下每帧 130 bit，一条 20 ms 周期报文占用多少带宽？ q2 ：为什么替换值必须逐信号定义\"安全方向\"？ q3 ：timeout 取 3×t_cycle 的工程含义是什么？ 答案 q1：130 bit ÷ 20 ms = 6.5 kbit/s，占 500 kbit/s 的 1.3% 。 q2：信号失效时的默认行为就是安全行为的一部分：不同信号的保守方向不同（功率限值→往下限；soc→保持上值并标注失效；报警信号→按报警激活处理）。填错方向会把\"失效\"变成\"危害\"。 q3：容忍偶发丢帧（单帧丢失不触发），连续 3 个周期缺失才判定失效——在\"误报\"与\"漏判\"之间取平衡（示意惯例，具体以整车网络规范为准）。 来源 s-11：iso 11898 系列（can/can fd 链路层与物理层） s-12：iso 17987（lin） s-09：iso 14229-1（uds 诊断通信） s-03：gb/t 38661-2020（bms 对外通信的产品要求） s-18：ti 无线 bms 官方资料（wbms 形态案例，发布状态待核对） 延伸资源（仅列可靠名称，链接待补） 资源 说明 iso 11898-1:2015 原文 can 数据链路层与物理信令的权威定义 bosch《can specification》2.0（1991） can 协议的原始规范，经典必读 开源项目 socketcan / python-can 用 linux/python 实操 can 报文，动手验证本课负载计算 autosar classic platform 标准文本 com/nm 配置化节点定义的工业参照 待核对项（本课） 帧开销 130 bit 与\"单节点 10~15%、整车 40~50%\"负载经验值的文献出处（教学示意值，建议新 p 项） can fd 整车采用的典型速率档位（示意 2~5 mbit/s，建议新 p 项） "}, {"id": "SYS-05", "title": "课程 SYS-05：平台化/系列化设计策略——一套 BMS 吃下多款车", "dom": "SYS", "verified": false, "html": "<blockquote><p>对应节点 <code>SYS-05<\/code>（../domains/01-边界与架构.md <span class=\"fileref\">（项目文件 ../domains/01-边界与架构.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-01\">SYS-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-03\">SYS-03<\/a> ｜ 预计用时 45 min 数字规则：文中所有具体数字均为<strong>教学示意值<\/strong>。 诚实声明：本节点成熟度 <code>evolving<\/code>，无直接 A 级标准来源；工程约束为领域通识（骨架 v0.1.0），案例来自厂商资料（备注级、待核对）。<\/p><\/blockquote>\n<h3>1. 为什么需要平台化<\/h3>\n<p>一款车一套 BMS 的\"专车专做\"模式在新车型爆发时代撑不住：开发费按车型摊薄、标定与验证工作量按平台复用、软件缺陷修复一次覆盖全系。节点约束同时给出警告：<strong>硬件余量与软件配置化程度需平衡；平台化不当导致\"通用但平庸\"。<\/strong><\/p>\n<p>平台化的两条腿：<\/p>\n<ol>\n<li><strong>硬件留余量<\/strong>：为未来车型预留能力（采样通道、量程、算力）；<\/li>\n<li><strong>软件配置化<\/strong>：让车型差异落在参数表/配置项，而不是代码分支。<\/li>\n<\/ol>\n<h3>2. 机制展开：三个轴与配置层级<\/h3>\n<p><strong>（1）平台化的三个变化轴<\/strong><\/p>\n<ul>\n<li><strong>串数轴（电压平台）<\/strong>：400 V ↔ 800 V——牵动采样通道数、总压量程、绝缘监测范围（GB 18384，S-04）、预充时序（<code>HV-02/03<\/code>）；<\/li>\n<li><strong>化学体系轴<\/strong>：NCM ↔ LFP ↔ 钠电——牵动 OCV 表、阈值曲线、SOC 校正策略（<code>ALG-01<\/code> 的平台/滞回问题）；<\/li>\n<li><strong>架构轴<\/strong>：集中 ↔ 主从 ↔ 无线（<code>ARCH-C/MS/W<\/code>）——牵动通信拓扑与 ASIL 分解方式（<code>SAFE-03<\/code>）。<\/li>\n<p><strong>（2）软件配置化层级<\/strong>（自上而下，复用度递增）<\/p>\n<li>L1 参数表：阈值、OCV 表、均衡电流——全系同代码；<\/li>\n<li>L2 特性开关：功能有无（如主动均衡、加热策略）；<\/li>\n<li>L3 组件替换：架构差异（主从↔无线）替换通信/采集组件；<\/li>\n<li>L4 全新代码：应尽量消灭这一层。<\/li>\n<p><strong>（3）余量率<\/strong>（衡量硬件预留的示意公式）：<\/p>\n<\/ul>\n<div class=\"math\">\\text{余量率} = \\frac{\\text{设计能力} - \\text{当前平台需求}}{\\text{设计能力}} \\times 100\\%<\/div>\n<p>余量率过大 → 当前车型背成本（约束中的\"通用但平庸\"）；过小 → 下一代车型被迫改硬件，平台摊薄失效。无普适数值，属产品线规划决策（技术+商务双属性）。<\/p>\n<h3>3. 工程案例推演：三平台覆盖矩阵<\/h3>\n<p>设某电池厂规划三个平台（全部教学示意值）：<\/p>\n<table><thead><tr><th>维度<\/th><th>P1：400 V NCM<\/th><th>P2：400 V LFP<\/th><th>P3：800 V NCM<\/th><\/tr><\/thead><tbody><tr><td>串数<\/td><td>96<\/td><td>120<\/td><td>192<\/td><\/tr><tr><td>AFE 通道需求<\/td><td>96（24 通道×4）<\/td><td>120（24×5）<\/td><td>192（24×8）<\/td><\/tr><tr><td>总压采样量程<\/td><td>0~500 V<\/td><td>0~500 V<\/td><td>0~1000 V<\/td><\/tr><tr><td>电流传感器量程<\/td><td>±400 A<\/td><td>±400 A<\/td><td>±600 A<\/td><\/tr><tr><td>OCV 表<\/td><td>NCM 曲线<\/td><td>LFP 平台+滞回<\/td><td>NCM 曲线<\/td><\/tr><tr><td>充电协议层<\/td><td>GB/T 27930<\/td><td>GB/T 27930<\/td><td>GB/T 27930 + 高压桩适配<\/td><\/tr><tr><td>软件复用率（示意）<\/td><td>—<\/td><td>≈85%<\/td><td>≈60%<\/td><\/tr><\/tbody><\/table>\n<p>推演结论：<\/p>\n<ol>\n<li>P2 对 P1 是\"纯配置化扩展\"（AFE 加挂、换 OCV 表）——保护机制本身不变，软件复用率高，是平台化的理想增量；<\/li>\n<li>P3 的总压量程、绝缘监测范围、预充与 EMC 设计<strong>超出 P1 硬件架构<\/strong>——必须立项新硬件代际；强行用 P1 硬件覆盖 800 V 就是\"余量率被击穿\"的反例；<\/li>\n<li><strong>平台边界的判定标准：变化是否触及安全机制本身。<\/strong> P2 只变参数（阈值/曲线随化学体系变，保护机制不变）→ 配置化；P3 变的是高压安全链路（量程/绝缘/预充）→ 新平台。<\/li>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>厂商样本：LG Energy Solution 产品族（S-20，P-03 待核对）体现产品矩阵随平台分代；CATL 钠离子 BMS（S-24，P-10 待核对）示范化学体系轴扩展；无线 BMS（S-18，TI/GM Ultium）示范架构轴迁移；<\/li>\n<li>与 SYS-03 的咬合：平台化需求库要引入<strong>变体管理（variant management）<\/strong>——同一需求带变体属性（适用 P1/P2/P3），否则多车型下追溯链爆炸；<\/li>\n<li>与 DEV-05 的咬合：标定矩阵按平台复用，但\"全温域×全 SOC\"验证不能省——<strong>平台复用≠验证复用<\/strong>，跨化学体系尤其如此。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把\"参数可调\"当平台化——阈值可调只是 L1；架构变了（400→800 V）参数救不了；<\/li>\n<li>余量预留拍脑袋——余量率要有产品线规划依据，不是工程师个人偏好；<\/li>\n<li>平台软件变更后\"只测新车型\"——被复用的旧车型需做差异回归验证；<\/li>\n<li>忽视化学体系差异的深度——LFP 与 NCM 不只是 OCV 表不同，热特性与 SOC 校正策略整个不同（<code>ALG-01<\/code>）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：P1→P2（96→120 串）与 P1→P3（400→800 V）在平台化策略上的本质区别是什么？ <strong>Q2<\/strong>：余量率过高/过低分别导致什么后果？ <strong>Q3<\/strong>：为什么平台软件复用不等于验证复用？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：P2 只改参数与通道数（AFE 加挂即可），保护机制不变 → 配置化扩展；P3 触及高压安全链路本身（量程/绝缘/预充/EMC）→ 必须新硬件代际。判定标准：变化是否触及安全机制。<\/li>\n<li>Q2：过高 → 当前车型背负闲置成本、性能平庸（\"通用但平庸\"）；过低 → 下一代车型被迫改硬件，平台摊薄失效。<\/li>\n<li>Q3：复用的软件运行在新的参数/工况组合上（新串数、新化学体系、新热边界），原验证集不能证明新组合；至少需差异分析+回归验证，跨化学体系要重新标定全矩阵（DEV-05）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>骨架（v0.1.0 初建）：本节点无直接 A 级标准来源，工程约束为领域通识（诚实声明）<\/li>\n<li>S-20：LG Energy Solution 产品族资料（案例级，P-03 待核对）<\/li>\n<li>S-24：CATL 钠离子 BMS 新闻（案例级，P-10 待核对）<\/li>\n<li>S-18：TI 无线 BMS 资料（架构轴案例，备注待核对）<\/li>\n<li>S-04：GB 18384-2020（绝缘监测等整车要求，串数/电压扩展的合规边界）<\/li>\n<li>S-16：Plett《Battery Management Systems》Vol. I（参数化建模的平台化方法底座）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>K. Pohl, G. Böckle, F. van der Linden, <em>Software Product Line Engineering<\/em>（Springer, 2005）<\/td><td>软件产品线/变体管理的经典教材<\/td><\/tr><tr><td>AUTOSAR Classic Platform 标准文本<\/td><td>配置化软件架构的工业参照<\/td><\/tr><tr><td>G. Plett, <em>Battery Management Systems, Vol. I<\/em><\/td><td>参数表驱动的模型/估计平台化底座<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>三平台矩阵全部为教学示意值，不对应任何真实产品线<\/li>\n<li>LG/CATL/TI 案例细节：已有 P-03 / P-10 / S-18 备注，核对后回填\"工程实态\"<\/li>\n<\/ul>", "text": " 对应节点 sys-05 （../domains/01-边界与架构.md （项目文件 ../domains/01-边界与架构.md） ）｜ 前置： sys-01 、 sys-02 、 sys-03 ｜ 预计用时 45 min 数字规则：文中所有具体数字均为 教学示意值 。 诚实声明：本节点成熟度 evolving ，无直接 a 级标准来源；工程约束为领域通识（骨架 v0.1.0），案例来自厂商资料（备注级、待核对）。 1. 为什么需要平台化 一款车一套 bms 的\"专车专做\"模式在新车型爆发时代撑不住：开发费按车型摊薄、标定与验证工作量按平台复用、软件缺陷修复一次覆盖全系。节点约束同时给出警告： 硬件余量与软件配置化程度需平衡；平台化不当导致\"通用但平庸\"。 平台化的两条腿： 硬件留余量 ：为未来车型预留能力（采样通道、量程、算力）； 软件配置化 ：让车型差异落在参数表/配置项，而不是代码分支。 2. 机制展开：三个轴与配置层级 （1）平台化的三个变化轴 串数轴（电压平台） ：400 v ↔ 800 v——牵动采样通道数、总压量程、绝缘监测范围（gb 18384，s-04）、预充时序（ hv-02/03 ）； 化学体系轴 ：ncm ↔ lfp ↔ 钠电——牵动 ocv 表、阈值曲线、soc 校正策略（ alg-01 的平台/滞回问题）； 架构轴 ：集中 ↔ 主从 ↔ 无线（ arch-c/ms/w ）——牵动通信拓扑与 asil 分解方式（ safe-03 ）。 （2）软件配置化层级 （自上而下，复用度递增） l1 参数表：阈值、ocv 表、均衡电流——全系同代码； l2 特性开关：功能有无（如主动均衡、加热策略）； l3 组件替换：架构差异（主从↔无线）替换通信/采集组件； l4 全新代码：应尽量消灭这一层。 （3）余量率 （衡量硬件预留的示意公式）： \\text{余量率} = \\frac{\\text{设计能力} - \\text{当前平台需求}}{\\text{设计能力}} \\times 100\\% 余量率过大 → 当前车型背成本（约束中的\"通用但平庸\"）；过小 → 下一代车型被迫改硬件，平台摊薄失效。无普适数值，属产品线规划决策（技术+商务双属性）。 3. 工程案例推演：三平台覆盖矩阵 设某电池厂规划三个平台（全部教学示意值）： 维度 p1：400 v ncm p2：400 v lfp p3：800 v ncm 串数 96 120 192 afe 通道需求 96（24 通道×4） 120（24×5） 192（24×8） 总压采样量程 0~500 v 0~500 v 0~1000 v 电流传感器量程 ±400 a ±400 a ±600 a ocv 表 ncm 曲线 lfp 平台+滞回 ncm 曲线 充电协议层 gb/t 27930 gb/t 27930 gb/t 27930 + 高压桩适配 软件复用率（示意） — ≈85% ≈60% 推演结论： p2 对 p1 是\"纯配置化扩展\"（afe 加挂、换 ocv 表）——保护机制本身不变，软件复用率高，是平台化的理想增量； p3 的总压量程、绝缘监测范围、预充与 emc 设计 超出 p1 硬件架构 ——必须立项新硬件代际；强行用 p1 硬件覆盖 800 v 就是\"余量率被击穿\"的反例； 平台边界的判定标准：变化是否触及安全机制本身。 p2 只变参数（阈值/曲线随化学体系变，保护机制不变）→ 配置化；p3 变的是高压安全链路（量程/绝缘/预充）→ 新平台。 4. 工程实态 厂商样本：lg energy solution 产品族（s-20，p-03 待核对）体现产品矩阵随平台分代；catl 钠离子 bms（s-24，p-10 待核对）示范化学体系轴扩展；无线 bms（s-18，ti/gm ultium）示范架构轴迁移； 与 sys-03 的咬合：平台化需求库要引入 变体管理（variant management） ——同一需求带变体属性（适用 p1/p2/p3），否则多车型下追溯链爆炸； 与 dev-05 的咬合：标定矩阵按平台复用，但\"全温域×全 soc\"验证不能省—— 平台复用≠验证复用 ，跨化学体系尤其如此。 5. 常见误区 把\"参数可调\"当平台化——阈值可调只是 l1；架构变了（400→800 v）参数救不了； 余量预留拍脑袋——余量率要有产品线规划依据，不是工程师个人偏好； 平台软件变更后\"只测新车型\"——被复用的旧车型需做差异回归验证； 忽视化学体系差异的深度——lfp 与 ncm 不只是 ocv 表不同，热特性与 soc 校正策略整个不同（ alg-01 ）。 6. 自测 q1 ：p1→p2（96→120 串）与 p1→p3（400→800 v）在平台化策略上的本质区别是什么？ q2 ：余量率过高/过低分别导致什么后果？ q3 ：为什么平台软件复用不等于验证复用？ 答案 q1：p2 只改参数与通道数（afe 加挂即可），保护机制不变 → 配置化扩展；p3 触及高压安全链路本身（量程/绝缘/预充/emc）→ 必须新硬件代际。判定标准：变化是否触及安全机制。 q2：过高 → 当前车型背负闲置成本、性能平庸（\"通用但平庸\"）；过低 → 下一代车型被迫改硬件，平台摊薄失效。 q3：复用的软件运行在新的参数/工况组合上（新串数、新化学体系、新热边界），原验证集不能证明新组合；至少需差异分析+回归验证，跨化学体系要重新标定全矩阵（dev-05）。 来源 骨架（v0.1.0 初建）：本节点无直接 a 级标准来源，工程约束为领域通识（诚实声明） s-20：lg energy solution 产品族资料（案例级，p-03 待核对） s-24：catl 钠离子 bms 新闻（案例级，p-10 待核对） s-18：ti 无线 bms 资料（架构轴案例，备注待核对） s-04：gb 18384-2020（绝缘监测等整车要求，串数/电压扩展的合规边界） s-16：plett《battery management systems》vol. i（参数化建模的平台化方法底座） 延伸资源（仅列可靠名称，链接待补） 资源 说明 k. pohl, g. böckle, f. van der linden, software product line engineering （springer, 2005） 软件产品线/变体管理的经典教材 autosar classic platform 标准文本 配置化软件架构的工业参照 g. plett, battery management systems, vol. i 参数表驱动的模型/估计平台化底座 待核对项（本课） 三平台矩阵全部为教学示意值，不对应任何真实产品线 lg/catl/ti 案例细节：已有 p-03 / p-10 / s-18 备注，核对后回填\"工程实态\" "}, {"id": "THM-01", "title": "课程 THM-01：温度传感布点与代表性误差", "dom": "THM", "verified": false, "html": "<blockquote><p>对应节点 <code>THM-01<\/code>（../domains/08-热管理.md <span class=\"fileref\">（项目文件 ../domains/08-热管理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HW-07\">HW-07<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要布点设计<\/h3>\n<p>电池的热决策——降功率、加热、热失控预警——全部建立在\"采到的温度能代表最差电芯\"这个假设上。但传感器永远装不满：<\/p>\n<ol>\n<li>一包上百个电芯，温度传感器通常只有十几个（示意量级）；<\/li>\n<li>每个 NTC（Negative Temperature Coefficient，负温度系数热敏电阻）+ 采集通道都是成本与故障点；<\/li>\n<li><strong>代表性误差<\/strong>（representativeness error）：传感器读数与\"真实最热点/最冷点\"之间的差，是布点设计要管理的核心量。<\/li>\n<p>节点约束点题：测点少导致代表性误差（单体间温差可达数 K）；需估计不可测极值。<\/p>\n<\/ol>\n<h3>2. 机制展开：温差从哪来，布点往哪放<\/h3>\n<p><strong>（1）温差的本源是产热与散热的空间不均匀。<\/strong> 产热在电芯内部（欧姆+极化，见 <a class=\"xlink\" href=\"#/lesson/THM-02\">THM-02<\/a>），散热在冷却面。于是：<\/p>\n<ul>\n<li><strong>最热点<\/strong>：远离冷却面的区域——大方形电芯的极柱侧/中心区域、远离液冷板入口的位置（方向性共识，具体位置随结构而异）；<\/li>\n<li><strong>最冷点<\/strong>：冷却液入口附近（液冷方案）。<\/li>\n<p><strong>（2）布点对象不止电芯<\/strong>：极柱与母排（接触电阻发热点，快充时尤其）、模组内空气、冷却板进出口水温都要布测。<\/p>\n<p><strong>（3）传感器系统的三重误差<\/strong>：<\/p>\n<li>空间稀疏：每 M 个电芯 1 个测点，同组内单体间温差就是系统性盲区；<\/li>\n<li>安装接触热阻：NTC 与电芯表面之间的间隙/胶层引入系统性偏低（手算实例 3）；<\/li>\n<li>响应滞后：NTC 组件有时间常数 τ（数十秒量级，示意），温度快速变化时读数滞后（手算实例 2）。<\/li>\n<p><strong>（4）极值估计<\/strong>：既然测不全，就要\"算\"——用少数测点 + 热模型（THM-02）外推最热点（软测量，virtual sensing），或工程化的包络法：最热点估计 = 最高测点读数 + 标定偏移量。<\/p>\n<\/ul>\n<h3>3. 手算实例（数字自洽）<\/h3>\n<h4>实例 1：稀疏覆盖的盲区<\/h4>\n<p>150 个方形电芯 + 12 个 NTC（教学示意值）→ 每个 NTC 覆盖 12~13 个电芯。若台架摸底实测同组内最大单体间温差 4 K（示意），则：<strong>真实最热点温度 ∈ [NTC 读数, NTC 读数 + 4 K]<\/strong>——这 4 K 是布点架构决定的代表性误差上界，任何热保护阈值都要为它留裕度。<\/p>\n<h4>实例 2：响应滞后<\/h4>\n<p>NTC 组件时间常数 τ = 30 s（示意，贴合安装），电芯表面以 0.5 K/min 匀速升温（示意，大倍率工况）：稳态读数滞后 = 升温速率 × τ = (0.5/60) × 30 = <strong>0.25 K<\/strong>；若安装不良 τ = 60 s → 滞后 0.5 K。一阶系统滞后量 ΔT = τ·(dT/dt)——这就是\"快充冲刺段为什么报温偏低\"的一个来源。<\/p>\n<h4>实例 3：接触热阻的系统性偏低<\/h4>\n<p>NTC 与电芯面之间有 0.2 mm 空气隙（示意，未涂导热胶的装配缺陷），空气导热系数 λ ≈ 0.026 W/(m·K)（物性常数），电芯大面热流密度 q = 500 W/m²（示意，大倍率工况）：<\/p>\n<div class=\"math\">\\Delta T = \\frac{q \\cdot d}{\\lambda} = \\frac{500 \\times 0.0002}{0.026} \\approx 3.8\\ \\text{K}<\/div>\n<p>一个装配缺陷吃掉 3.8 K——比 NTC 元件精度（±1 K 级，示意）大得多。<strong>系统误差在安装，不在元件。<\/strong><\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产布点 = \"电芯大面若干分之一 + 极柱/母排 + 冷却板进出口水温\"的混合方案；布点位置由热仿真 + 台架摸底（找出最热点后\"钉住\"）确定；<\/li>\n<li>GB/T 38661-2020（S-03）对温度采集的范围/精度/采样周期有要求（具体条款数值待核对，见文末）；<\/li>\n<li>温度变化慢，采样 1~10 Hz（示意）足够，远低于电压电流采样率（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>）；<\/li>\n<li>高端方案把极值估计做进 BMS：热模型在线外推最热点，阈值判断用\"估计极值\"而非\"最大测点\"。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>拿 NTC 元件精度当系统精度——接触热阻与滞后往往大一个量级（实例 2/3）；<\/li>\n<li>把\"最高测点\"当\"最热点\"——稀疏布点下最热点可能根本没被测到（实例 1）；<\/li>\n<li>台架摸底一次定终身——老化后产热分布变化（内阻上升），最热点会漂移；<\/li>\n<li>忽视 NTC 自热（激励电流过大读数偏高，设计常识级）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：60 个电芯配 4 个 NTC，台架实测同组最大温差 3 K。保护阈值定在 55 °C 时，最热点实际到多少才触发？ <strong>Q2<\/strong>：升温速率 1 K/min、τ = 30 s，读数滞后多少？ <strong>Q3<\/strong>：为什么\"温度传感器精度 ±1 K\"这句话对热保护设计几乎没用？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：触发时 NTC 读 55 °C，同组最热点可能已是 55 + 3 = <strong>58 °C<\/strong>——阈值必须为代表性误差留裕度，或改用极值估计。<\/li>\n<li>Q2：(1/60) K/s × 30 s = <strong>0.5 K<\/strong>。速率加倍滞后加倍——动态工况读数恒偏低。<\/li>\n<li>Q3：系统误差由安装接触热阻、稀疏布点盲区、动态滞后主导，量级可达数 K，远超元件的 ±1 K；元件精度只在\"安装与布点都做对\"之后才生效。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（温度采集要求；具体条款数值待核对 → 文末待核对项）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I（热模型与温度在 BMS 中的作用框架）<\/li>\n<li>本课温差/τ/热流密度等数字均为教学示意值，真实量级需按具体结构台架标定<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 原文（S-03）<\/td><td>A<\/td><td>BMS 温度采集技术要求的权威文本<\/td><\/tr><tr><td>G. Plett《Battery Management Systems, Vol. I》<\/td><td>B<\/td><td>热模型与产热章节（S-16）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>电池包热特性摸底测试方法（公开标准/文献核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 温度采集条款（量程/精度/采样周期）具体数值 → 建议新 P 项<\/li>\n<li>NTC 组件时间常数与精度的典型规格（本课 30 s / ±1 K 为示意）<\/li>\n<li>\"最热点位于远离冷却面区域\"的结构性表述——需按具体包型核实（方向性共识）<\/li>\n<li>单体间温差\"数 K\"量级的公开文献支撑<\/li>\n<\/ul>", "text": " 对应节点 thm-01 （../domains/08-热管理.md （项目文件 ../domains/08-热管理.md） ）｜ 前置： hw-07 （建议）｜ 预计用时 45 min 数字规则：文中所有具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么需要布点设计 电池的热决策——降功率、加热、热失控预警——全部建立在\"采到的温度能代表最差电芯\"这个假设上。但传感器永远装不满： 一包上百个电芯，温度传感器通常只有十几个（示意量级）； 每个 ntc（negative temperature coefficient，负温度系数热敏电阻）+ 采集通道都是成本与故障点； 代表性误差 （representativeness error）：传感器读数与\"真实最热点/最冷点\"之间的差，是布点设计要管理的核心量。 节点约束点题：测点少导致代表性误差（单体间温差可达数 k）；需估计不可测极值。 2. 机制展开：温差从哪来，布点往哪放 （1）温差的本源是产热与散热的空间不均匀。 产热在电芯内部（欧姆+极化，见 thm-02 ），散热在冷却面。于是： 最热点 ：远离冷却面的区域——大方形电芯的极柱侧/中心区域、远离液冷板入口的位置（方向性共识，具体位置随结构而异）； 最冷点 ：冷却液入口附近（液冷方案）。 （2）布点对象不止电芯 ：极柱与母排（接触电阻发热点，快充时尤其）、模组内空气、冷却板进出口水温都要布测。 （3）传感器系统的三重误差 ： 空间稀疏：每 m 个电芯 1 个测点，同组内单体间温差就是系统性盲区； 安装接触热阻：ntc 与电芯表面之间的间隙/胶层引入系统性偏低（手算实例 3）； 响应滞后：ntc 组件有时间常数 τ（数十秒量级，
