芯的参数跑全生命周期<\/strong>——SOH 降 10% 时容量/内阻/OCV 平台都会漂，功率限值与 SOC 精度同时失准（与 <code>ALG-05<\/code> 耦合）。<\/li>\n<li>温度点按实验室便利选，没覆盖真实舱内温度（夏暴晒、冬极寒的舱内分布，定性）。<\/li>\n<li>标定完不做版本管理——售后换件/OTA 混版本后问题无法复现。<\/li>\n<li>把耐久当\"跑够里程就行\"——没有定义记录项与判据的里程只是里程。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：温度点从 8 点加密到 12 点、SOC 步长改 2.5%（41 点）、老化档 3 档不变，工况点总数与台架时间（每点 40 min、8 通道并行）约多少？ <strong>Q2<\/strong>：为什么老化档常用\"外购旧电芯\"而不是自己循环？ <strong>Q3<\/strong>：低温功率限值标定得过松会出什么问题？过紧呢？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：12 × 41 × 3 = 1476 点；1476 × 40 min ≈ 984 h；8 通道并行 ≈ 123 h ≈ 5 天多（不含老化工序）。点数翻近 3 倍——\"精度需求 × 成本\"必须先算账再定矩阵。<\/li>\n<li>Q2：自己循环需要 3 个月量级墙钟时间（见手算实例 1）且只有单一老化路径；外购真实老化件更快、更接近 calendar + cycle 混合老化的真实分布。<\/li>\n<li>Q3：过松 → 低温下实际放不出标称功率，出现欠压/析锂风险，可能演变为更大故障；过紧 → 冬季驾驶性与充电体验差。标定本质是安全裕度与体验的权衡。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-26：INL《FreedomCAR Battery Test Manual》(2014)（HPPC 标定程序）<\/li>\n<li>S-27：INL《Battery Test Manual for Plug-In Hybrid Electric Vehicles》(2010)（PHEV 场景测试程序补充）<\/li>\n<li>S-16：Plett《Battery Management Systems》Vol. I/II（OCV/参数辨识方法论）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 产品技术条件，标定结果的验收参考）<\/li>\n<li>S-15：UN R156（软件升级管理体系——量产标定更新的流程约束）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>INL 两本测试手册（S-26/S-27，公开 PDF）<\/td><td>标定程序的权威文本<\/td><\/tr><tr><td>ASAM ASAP2 / A2L 标准体系<\/td><td>标定变量描述格式的行业标准 [待补链]<\/td><\/tr><tr><td>Plett Vol. II（S-16）<\/td><td>参数辨识与估计器实现<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>行业典型标定矩阵（温度/SOC 点数、老化档划分）无公开统计，本课全用教学示意值演示算法。<\/li>\n<li>耐久路试的典型里程与工况配比（各企业标准不公开，观点级）。<\/li>\n<li>\"三高\"试验地点与试验周期（行业惯例转述，未挂来源）。<\/li>\n<li>A2L/ASAP2 的现行版本号。<\/li>\n<\/ul>", "text": " 对应节点 dev-05 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-01 ~ dev-04 、 alg-01 ｜ 预计用时 50 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要标定与耐久 算法框架是通用件， 参数才是产品 ：同一套 bms 软件，lfp 与 ncm、南方与北方、新车与旧车，表现天差地别，差别全在标定（calibration）参数——ocv-soc 表、内阻/rc 参数表、功率 map、充电曲线、保护阈值、均衡策略。 耐久验证回答另一个问题： 这些参数在多年/十几万公里后还对吗？ （里程为行业常见量级，示意）老化让容量缩水、内阻上升；标定若不为老化留好档位，车会越开越\"难用\"甚至误保护。 2. 机制：标定矩阵与耐久工况 标定矩阵 = 温度点 × soc 点 × 老化档 所有查表类参数（ocv、内阻、功率限值）都在这个三维空间取值；点数的选取是\"精度需求 × 台架成本\"的权衡。 手算实例 1：标定矩阵规模与台架时间（核心案例，全部教学示意值） 一次 ocv + hppc 参数标定（程序依据 s-26）： 温度点：-30、-20、-10、0、10、25、45、60 ℃ → 8 点； soc 点：0~100%、步长 5% → 21 点； 老化档：soh = 100% / 90% / 80% → 3 档； 全组合：8 × 21 × 3 = 504 个工况点 ； 每点含静置弛豫 + hppc ≈ 40 min → 504 × 40 min ≈ 336 h ≈ 14 天连续台架 ；8 通道并行测试仪可压到约 2 天。 真正的瓶颈在 老化工序 ：按 1c 循环、每循环 2.5 h（含休息）、每循环衰减 0.01% 计，做到 soh 90% 需约 1000 次循环 ≈ 2500 h ≈ 3 个多月 。所以工程上常用\"外购不同寿命阶段的电芯/模组\"或加速老化凑齐老化档，而不是慢慢循环。 手算实例 2：查表插值误差（教学示意值） 功率 map 在 10 ℃ 与 25 ℃ 各存一点：10 ℃ 允许 40 a、25 ℃ 允许 100 a。电池实际在 17.5 ℃，线性插值得 70 a。若真实曲线在该区间上凸（低温端衰减更陡），线性插值会 高估 可用功率——低温端加密温度点比高温端更重要。 3. 耐久验证（三高 + 路试） 三高试验 ：高温（吐鲁番）、高寒（黑河/漠河一带）、高原（格尔木一带）——行业惯例地点，用于暴露全温域与低气压问题（海拔与散热的耦合，定性）。 耐久路试 ：按企业规范跑数万至十几万公里强化路况（里程为企业标准，示意），持续记录 soc 精度、功率限值触发频次、故障码，比对\"参数老化的实际轨迹\"与\"标定矩阵假设的老化档\"是否吻合。 数据回流：路试/车队数据反哺场景库与标定更新（衔接 dev-06 ）。 4. 工程实态 标定管理：标定变量经 a2l 文件（asam asap2 描述格式）与标定工具（inca、canape 一类，仅点名）读写； 标定版本与软件版本、车型严格绑定 ，发布时冻结。 分工：电芯级参数（ocv/rc/hppc）多由电芯厂提供，整车级策略标定（充电曲线、功率 map 的驾驶性权衡）在整车厂——边界因项目而异（观点级）。 量产后的标定演进靠 ota：流程受 un r156（s-15）软件升级管理体系约束。 5. 常见误区 用全新电芯的参数跑全生命周期 ——soh 降 10% 时容量/内阻/ocv 平台都会漂，功率限值与 soc 精度同时失准（与 alg-05 耦合）。 温度点按实验室便利选，没覆盖真实舱内温度（夏暴晒、冬极寒的舱内分布，定性）。 标定完不做版本管理——售后换件/ota 混版本后问题无法复现。 把耐久当\"跑够里程就行\"——没有定义记录项与判据的里程只是里程。 6. 自测 q1 ：温度点从 8 点加密到 12 点、soc 步长改 2.5%（41 点）、老化档 3 档不变，工况点总数与台架时间（每点 40 min、8 通道并行）约多少？ q2 ：为什么老化档常用\"外购旧电芯\"而不是自己循环？ q3 ：低温功率限值标定得过松会出什么问题？过紧呢？ 答案 q1：12 × 41 × 3 = 1476 点；1476 × 40 min ≈ 984 h；8 通道并行 ≈ 123 h ≈ 5 天多（不含老化工序）。点数翻近 3 倍——\"精度需求 × 成本\"必须先算账再定矩阵。 q2：自己循环需要 3 个月量级墙钟时间（见手算实例 1）且只有单一老化路径；外购真实老化件更快、更接近 calendar + cycle 混合老化的真实分布。 q3：过松 → 低温下实际放不出标称功率，出现欠压/析锂风险，可能演变为更大故障；过紧 → 冬季驾驶性与充电体验差。标定本质是安全裕度与体验的权衡。 来源 s-26：inl《freedomcar battery test manual》(2014)（hppc 标定程序） s-27：inl《battery test manual for plug-in hybrid electric vehicles》(2010)（phev 场景测试程序补充） s-16：plett《battery management systems》vol. i/ii（ocv/参数辨识方法论） s-03：gb/t 38661-2020（bms 产品技术条件，标定结果的验收参考） s-15：un r156（软件升级管理体系——量产标定更新的流程约束） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 inl 两本测试手册（s-26/s-27，公开 pdf） 标定程序的权威文本 asam asap2 / a2l 标准体系 标定变量描述格式的行业标准 [待补链] plett vol. ii（s-16） 参数辨识与估计器实现 待核对项 行业典型标定矩阵（温度/soc 点数、老化档划分）无公开统计，本课全用教学示意值演示算法。 耐久路试的典型里程与工况配比（各企业标准不公开，观点级）。 \"三高\"试验地点与试验周期（行业惯例转述，未挂来源）。 a2l/asap2 的现行版本号。 "}, {"id": "DEV-06", "title": "课程 DEV-06：场景库与数据闭环验证", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-06<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-03<\/code>、<code>DEV-05<\/code> ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要数据闭环<\/h3>\n<p>实验室与试验场永远跑不完真实世界的\"长尾\"：-25 ℃ 露天过夜后立即快充、山地连续长坡、劣质充电桩的畸形报文、用户常年只充到 60%……这些低频但高价值的工况，靠试验排期撞不齐。<\/p>\n<p>车队回传数据把真实世界搬进验证体系，形成闭环：<\/p>\n<p><strong>采集 → 场景提取 → 场景库 → 回灌回归验证 → 算法/标定更新 → OTA 发布（S-15）→ 新数据验证效果<\/strong><\/p>\n<p>它不再是 V 模型尾部\"验证一次就完\"，而是持续运转的环（<code>DEV-01<\/code> 的 V 之上叠加的循环层）。<\/p>\n<h3>2. 机制<\/h3>\n<h4>场景库的三类来源<\/h4>\n<ol>\n<li><strong>常态分布<\/strong>：正常驾驶/充电的温度×SOC×倍率联合统计——用来证明算法在\"日常\"里没退化；<\/li>\n<li><strong>极端事件<\/strong>：自动/人工筛选的异常片段（热事件前兆、充不进电、SOC 跳变）——回归与根因分析；<\/li>\n<li><strong>标准工况<\/strong>：CLTC（中国轻型车行驶工况，标准编号待核对）等——对齐可比口径。<\/li>\n<\/ol>\n<h4>回灌验证（data replay / re-injection）<\/h4>\n<p>把录制的报文与采样数据按原始时序喂给\"新版本算法\"，与量产版本输出对比——本质是把 HIL（<code>DEV-03<\/code>）的\"仿真输入\"换成\"真实输入\"，保真度最高，但覆盖由数据决定。<\/p>\n<h4>手算实例：数据量与场景提取（核心案例，全部教学示意值）<\/h4>\n<ul>\n<li>车队 1000 台；每车每天记录行驶/充电 2 h；<\/li>\n<li>电池相关 CAN 报文 200 条/s × 8 B = 1600 B/s，加电流电压 100 Hz × 8 B = 800 B/s，合计 2.4 kB/s；<\/li>\n<li>每车每天 ≈ 2.4 kB/s × 7200 s ≈ <strong>17 MB<\/strong>；车队每天 ≈ <strong>17 GB<\/strong>，一年 ≈ 6 TB；<\/li>\n<li>90 天累计约 1.5 TB，筛出\"-10 ℃ 以下充电\"片段占比 3% ≈ 45 GB 原始数据；<\/li>\n<li>按温度/SOC/倍率聚类压缩成 <strong>200 个代表性回灌场景<\/strong>——场景库的意义就是把 TB 级原始数据变成可回归执行的用例集。<\/li>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li><strong>影子模式（shadow mode）<\/strong>：新算法与量产算法在真车上并行运行、只记录不控车，用真实长尾输入对比两版输出——AI 类功能上线前的标准动作（衔接 <code>DEV-07<\/code>）。<\/li>\n<li>合规约束：数据采集/存储/出境受《汽车数据安全管理若干规定（试行）》等约束；OTA 发布流程受 UN R156（S-15）约束。<\/li>\n<li>工具链：测量数据常用 ASAM MDF（MF4）格式（行业通用）；云端做场景挖掘与版本管理。数据驱动 BMS 的综述视角见 S-22；欧盟 InnoBMS 项目（S-25，\"situationally aware BMS\"）也把数据驱动列为方向（项目细节待核对 → P-09）。<\/li>\n<li>场景库是\"活资产\"：随车型/电池批次扩容，需版本化与定期复审。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li>场景库只收故障片段——没有常态分布就答不了\"新版本在 99% 的日常里是否退化\"，回归结论失真。<\/li>\n<li>回灌不校时间戳与采样率——异步回灌产生的\"假毛刺\"会让新算法背黑锅。<\/li>\n<li>场景入库永不退役——车型、电池批次变了，旧场景的代表性要定期复审。<\/li>\n<li>把数据闭环当\"只属于自动驾驶\"的概念——BMS 的标定演进（<code>DEV-05<\/code>）同样靠它，只是采集频率更低。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：手算实例中电流电压回传从 100 Hz 降到 10 Hz，车队每天数据量变多少？损失什么？ <strong>Q2<\/strong>：为什么\"影子模式\"比\"直接灰度发布控车\"更适合算法上线第一步？ <strong>Q3<\/strong>：设计 3 个 BMS 值得入库的极端场景（不与正文重复）。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：电流电压部分降为 80 B/s，合计 1.7 kB/s → 每车每天 ≈ 12 MB、车队 ≈ 12 GB。损失电流动态细节，SOC 安时积分精度核查与瞬态功率限值验证的保真度下降。<\/li>\n<li>Q2：影子模式零干预风险，可用真实长尾输入做双版本对照；灰度控车一旦出错由真实用户承担，且缺少\"同输入对照\"的基准。<\/li>\n<li>Q3（示例）：①高海拔低气压满载长下坡（回馈大电流持续）；②夏季暴晒后立即直流快充至满；③长期停放数月后首次上电（SOC 初值偏差场景）；④不同功率充电桩混用的顺序充电序列。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-15：UN R156（软件升级管理体系——OTA 发布流程）<\/li>\n<li>S-22：\"Digital twin technologies for battery systems\"（数字孪生/数据驱动 BMS 综述，2026）<\/li>\n<li>S-25：EU InnoBMS 项目（CORDIS 101137975；细节待核对 → P-09）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ASAM MDF（MF4）格式规范<\/td><td>车载测量数据存储的行业事实标准 [待补链]<\/td><\/tr><tr><td>开源项目：CARLA、SUMO<\/td><td>场景仿真/交通流领域的知名开源参照系（方法论可借鉴，BMS 场景以实车数据为主）[待补链]<\/td><\/tr><tr><td>UN R156 原文<\/td><td>OTA 管理体系要求<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>CLTC 对应的国家标准编号。<\/li>\n<li>《汽车数据安全管理若干规定（试行）》的准确条款（数据分类、出境要求）。<\/li>\n<li>量产车队回传数据量的真实量级（本课为教学示意值推演）。<\/li>\n<li>InnoBMS 项目范围与伙伴（对应已有 P-09）。<\/li>\n<\/ul>", "text": " 对应节点 dev-06 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-03 、 dev-05 ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 。 1. 为什么需要数据闭环 实验室与试验场永远跑不完真实世界的\"长尾\"：-25 ℃ 露天过夜后立即快充、山地连续长坡、劣质充电桩的畸形报文、用户常年只充到 60%……这些低频但高价值的工况，靠试验排期撞不齐。 车队回传数据把真实世界搬进验证体系，形成闭环： 采集 → 场景提取 → 场景库 → 回灌回归验证 → 算法/标定更新 → ota 发布（s-15）→ 新数据验证效果 它不再是 v 模型尾部\"验证一次就完\"，而是持续运转的环（ dev-01 的 v 之上叠加的循环层）。 2. 机制 场景库的三类来源 常态分布 ：正常驾驶/充电的温度×soc×倍率联合统计——用来证明算法在\"日常\"里没退化； 极端事件 ：自动/人工筛选的异常片段（热事件前兆、充不进电、soc 跳变）——回归与根因分析； 标准工况 ：cltc（中国轻型车行驶工况，标准编号待核对）等——对齐可比口径。 回灌验证（data replay / re-injection） 把录制的报文与采样数据按原始时序喂给\"新版本算法\"，与量产版本输出对比——本质是把 hil（ dev-03 ）的\"仿真输入\"换成\"真实输入\"，保真度最高，但覆盖由数据决定。 手算实例：数据量与场景提取（核心案例，全部教学示意值） 车队 1000 台；每车每天记录行驶/充电 2 h； 电池相关 can 报文 200 条/s × 8 b = 1600 b/s，加电流电压 100 hz × 8 b = 800 b/s，合计 2.4 kb/s； 每车每天 ≈ 2.4 kb/s × 7200 s ≈ 17 mb ；车队每天 ≈ 17 gb ，一年 ≈ 6 tb； 90 天累计约 1.5 tb，筛出\"-10 ℃ 以下充电\"片段占比 3% ≈ 45 gb 原始数据； 按温度/soc/倍率聚类压缩成 200 个代表性回灌场景 ——场景库的意义就是把 tb 级原始数据变成可回归执行的用例集。 3. 工程实态 影子模式（shadow mode） ：新算法与量产算法在真车上并行运行、只记录不控车，用真实长尾输入对比两版输出——ai 类功能上线前的标准动作（衔接 dev-07 ）。 合规约束：数据采集/存储/出境受《汽车数据安全管理若干规定（试行）》等约束；ota 发布流程受 un r156（s-15）约束。 工具链：测量数据常用 asam mdf（mf4）格式（行业通用）；云端做场景挖掘与版本管理。数据驱动 bms 的综述视角见 s-22；欧盟 innobms 项目（s-25，\"situationally aware bms\"）也把数据驱动列为方向（项目细节待核对 → p-09）。 场景库是\"活资产\"：随车型/电池批次扩容，需版本化与定期复审。 4. 常见误区 场景库只收故障片段——没有常态分布就答不了\"新版本在 99% 的日常里是否退化\"，回归结论失真。 回灌不校时间戳与采样率——异步回灌产生的\"假毛刺\"会让新算法背黑锅。 场景入库永不退役——车型、电池批次变了，旧场景的代表性要定期复审。 把数据闭环当\"只属于自动驾驶\"的概念——bms 的标定演进（ dev-05 ）同样靠它，只是采集频率更低。 5. 自测 q1 ：手算实例中电流电压回传从 100 hz 降到 10 hz，车队每天数据量变多少？损失什么？ q2 ：为什么\"影子模式\"比\"直接灰度发布控车\"更适合算法上线第一步？ q3 ：设计 3 个 bms 值得入库的极端场景（不与正文重复）。 答案 q1：电流电压部分降为 80 b/s，合计 1.7 kb/s → 每车每天 ≈ 12 mb、车队 ≈ 12 gb。损失电流动态细节，soc 安时积分精度核查与瞬态功率限值验证的保真度下降。 q2：影子模式零干预风险，可用真实长尾输入做双版本对照；灰度控车一旦出错由真实用户承担，且缺少\"同输入对照\"的基准。 q3（示例）：①高海拔低气压满载长下坡（回馈大电流持续）；②夏季暴晒后立即直流快充至满；③长期停放数月后首次上电（soc 初值偏差场景）；④不同功率充电桩混用的顺序充电序列。 来源 s-15：un r156（软件升级管理体系——ota 发布流程） s-22：\"digital twin technologies for battery systems\"（数字孪生/数据驱动 bms 综述，2026） s-25：eu innobms 项目（cordis 101137975；细节待核对 → p-09） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 asam mdf（mf4）格式规范 车载测量数据存储的行业事实标准 [待补链] 开源项目：carla、sumo 场景仿真/交通流领域的知名开源参照系（方法论可借鉴，bms 场景以实车数据为主）[待补链] un r156 原文 ota 管理体系要求 待核对项 cltc 对应的国家标准编号。 《汽车数据安全管理若干规定（试行）》的准确条款（数据分类、出境要求）。 量产车队回传数据量的真实量级（本课为教学示意值推演）。 innobms 项目范围与伙伴（对应已有 p-09）。 "}, {"id": "DEV-07", "title": "课程 DEV-07：AI 模型的验证体系", "dom": "DEV", "verified": false, "html": "<blockquote><p>对应节点 <code>DEV-07<\/code>（../domains/10-开发验证.md <span class=\"fileref\">（项目文件 ../domains/10-开发验证.md）<\/span>）｜ 前置：<code>DEV-02<\/code>、<code>ALG-05<\/code> ｜ 预计用时 50 min 定位提醒：本节点在图谱中标记为 <code>frontier<\/code> 且 <strong>[需补约束]<\/strong>——AI 验证的接受准则在行业内<strong>尚未收敛<\/strong>，本课给的是\"已形成共识的框架 + 诚实标注未决问题\"。安全侧对应物是 <code>SAFE-06<\/code>（AI 安全论证）。<\/p><\/blockquote>\n<h3>1. 为什么 AI 组件需要另一套验证<\/h3>\n<p>ML（machine learning，机器学习）正进入 BMS 的 SOH 估计、析锂检测、充电优化等功能（综述见 S-28、S-29；SAE 2026 年论文 S-21 为候选证据，全文待核对 → P-11）。传统 V 模型的验证手段在 ML 面前有三处失效：<\/p>\n<ul>\n<li><strong>覆盖率失义<\/strong>：代码覆盖率 100% 不等于输入空间被覆盖——神经网络的输入空间是连续高维的，无法穷举；<\/li>\n<li><strong>通过准则缺失<\/strong>：物理模型的误差界限可按机理推导，ML 的接受准则目前<strong>没有行业收敛的标准<\/strong>（这就是域 [需补约束] 的含义）；<\/li>\n<li><strong>失效模式不同<\/strong>：物理模型错得\"讲得出理由\"，ML 会<strong>沉默地错<\/strong>——分布外输入照样给出自信的输出。<\/li>\n<p>验证重心因此从\"代码对不对\"转向\"数据对不对、域边界在哪、错了怎么办\"。<\/p>\n<\/ul>\n<h3>2. 机制：五层验证框架（框架层为工程共识，条款级标准未收敛）<\/h3>\n<ol>\n<li><strong>数据集验证<\/strong>：训练/验证/测试切分；切分方式必须匹配泛化目标（见手算实例）；数据来源与标注可追溯。<\/li>\n<li><strong>指标与接受准则<\/strong>：精度指标（MAE/RMSE）+ 不确定性量化（UQ，uncertainty quantification，让模型输出\"我有多确定\"）+ 失效代价加权；准则由功能安全团队按应用场景商定并留档。<\/li>\n<li><strong>运行域定义（ODD，Operational Design Domain）<\/strong>：明确模型在什么温度/SOC/倍率域内可信；域外输入要么拒绝、要么降级。<\/li>\n<li><strong>鲁棒性与分布外测试（OOD，Out-of-Distribution）<\/strong>：噪声注入、传感器漂移注入、域外工况探测。<\/li>\n<li><strong>兜底与降级（fallback）<\/strong>：ML 输出异常时回退到物理模型/保守策略——让\"ML 会错\"变成可安全承受的事件。<\/li>\n<p>标准语言：ISO 26262（S-07）覆盖代码与系统，ISO 21448:2022（SOTIF，预期功能安全，标准直引）提供\"性能局限/已知未知\"的分析语言，UL 4600（标准直引）提供安全论证（safety case）框架——三者如何组合用于 BMS 的 ML 组件，<strong>尚无收敛答案<\/strong>。<\/p>\n<\/ol>\n<h4>手算实例：一个 ML-SOH 估计器的验证（核心案例，数字均为教学示意值）<\/h4>\n<ul>\n<li>任务：电芯 SOH 估计；数据：公开数据集 CalCE（S-32），12 颗电芯训练、4 颗测试；<\/li>\n<li>验收准则（项目自定，示意）：MAE ≤ 2%，95% 分位误差 ≤ 4%；<\/li>\n<li>实测：按\"电芯\"切分测试集，MAE = 1.5% ✓；<\/li>\n<li><strong>切分陷阱对照<\/strong>：改按\"循环序号\"切分（同一颗电芯相邻循环分进训练/测试集）→ MAE 虚降到 0.3%——相邻循环几乎一样，这是<strong>数据泄漏<\/strong>（data leakage），不是泛化能力；<\/li>\n<li>OOD 测试：训练集温度 10~40 ℃，喂入 -20 ℃ 数据 → MAE 恶化到 8% → 结论：运行域限定 [10, 45] ℃（示意），域外回退到安时积分 + 容量核查（<code>ALG-01<\/code>/<code>ALG-05<\/code> 的物理方法）。<\/li>\n<\/ul>\n<h3>3. 工程实态<\/h3>\n<ul>\n<li>量产普遍走<strong>混合架构<\/strong>：ML 出精细值，物理模型守边界，超界即回退；纯 ML 直接控执行器的 BMS 功能尚未成为主流（观点级）。<\/li>\n<li>发布前影子模式评估（<code>DEV-06<\/code>）+ 发布后持续监控（误差漂移告警）——\"验证不止于发布\"。<\/li>\n<li>数据闭环（<code>DEV-06<\/code>）承担 ML 的\"再验证\"：车型/批次/季节变化触发重训与重测。<\/li>\n<\/ul>\n<h3>4. 常见误区<\/h3>\n<ol>\n<li><strong>把测试集精度当安全证据<\/strong>——精度是统计性能；安全论证要回答\"最坏情况会怎样、错了伤到谁\"。<\/li>\n<li><strong>数据泄漏<\/strong>（见手算实例）——SOH 任务还常见\"同一颗电池全寿命数据被拆到两边\"，实车泛化能力被严重高估。<\/li>\n<li>忽略<strong>分布漂移<\/strong>（distribution shift）——车型/批次/季节变化后模型悄悄变差，没有监控就永远发现不了。<\/li>\n<li>用\"可解释性差\"当借口跳过失效分析——至少要能回答\"输入什么特征时模型不可信\"。<\/li>\n<\/ol>\n<h3>5. 自测<\/h3>\n<p><strong>Q1<\/strong>：手算实例中两种切分方式，哪种对应\"换一批新电芯也能用\"的泛化目标？为什么？ <strong>Q2<\/strong>：为什么 OOD 测试要单独做，不能指望测试集自带代表性？ <strong>Q3<\/strong>：ML-SOH 上线后，云端应监控哪些量来发现\"静默退化\"？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：按\"电芯\"切分——模拟\"模型没见过这颗电芯\"的真实部署；按循环切分时测试与训练来自同一颗电芯、高度相似，考的是\"记忆\"不是\"泛化\"。<\/li>\n<li>Q2：测试集只评估\"与训练同分布\"的性能；OOD 测试评估分布边界之外的失败方式（告警与回退是否有效），是运行域定义与兜底设计的依据，测试集给不出。<\/li>\n<li>Q3（示例）：①在线预测值与满充容量核查值（真实锚点）的偏差趋势；②输入特征的分布漂移（季节温度、新电池批次）；③模型不确定性输出的漂移；④触发回退/拒绝的频次变化。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-28：K. Yang et al., SOH 估计策略综述（<em>Batteries<\/em> 2023，开放获取）<\/li>\n<li>S-29：SOH/RUL 文献计量综述（<em>Green Energy &amp; Environment<\/em> 2024）<\/li>\n<li>S-21：SAE 2026-26-0382（AI/ML 与数字孪生 BMS；全文待核对 → P-11，候选证据地位）<\/li>\n<li>S-22：数字孪生综述（Frontiers in Batteries and Electrochemistry, 2026）<\/li>\n<li>S-23：AI/DT 论文（MDPI《Batteries》，卷期年份待核对；引用注意期刊声誉争议）<\/li>\n<li>S-32：CalCE 公开数据集（马里兰大学）<\/li>\n<li>ISO 21448:2022《道路车辆 预期功能安全（SOTIF）》——标准编号直引（未登记 S 编号）<\/li>\n<li>UL 4600《自主产品安全评估标准》——标准编号直引（未登记 S 编号）<\/li>\n<\/ul>\n<h3>延伸资源（未联网核实，仅列经典名称，链接待核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 21448:2022 原文<\/td><td>SOTIF 的\"已知/未知\"分析语言<\/td><\/tr><tr><td>开源项目：scikit-learn、PyTorch<\/td><td>ML 实验基础设施（知名开源项目）<\/td><\/tr><tr><td>开源书：R. Labbe《Kalman and Bayesian Filters in Python》（S-31）<\/td><td>物理兜底方法的直觉教材（免费、可运行）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项<\/h3>\n<ul>\n<li>S-21 全文结论（P-11）：AI 验证接受准则是否给出可引用的具体框架，用于回填域 [需补约束]。<\/li>\n<li>UL 4600 用于\"非自动驾驶的 BMS ML 组件\"的适用性解读（观点级，未见直接案例来源）。<\/li>\n<li>\"纯 ML 直接控执行器尚未成为主流\"为观点级概括。<\/li>\n<li>ML-SOH 验收指标的行业基准值（目前仅项目自定义，本课用教学示意值）。<\/li>\n<\/ul>", "text": " 对应节点 dev-07 （../domains/10-开发验证.md （项目文件 ../domains/10-开发验证.md） ）｜ 前置： dev-02 、 alg-05 ｜ 预计用时 50 min 定位提醒：本节点在图谱中标记为 frontier 且 [需补约束] ——ai 验证的接受准则在行业内 尚未收敛 ，本课给的是\"已形成共识的框架 + 诚实标注未决问题\"。安全侧对应物是 safe-06 （ai 安全论证）。 1. 为什么 ai 组件需要另一套验证 ml（machine learning，机器学习）正进入 bms 的 soh 估计、析锂检测、充电优化等功能（综述见 s-28、s-29；sae 2026 年论文 s-21 为候选证据，全文待核对 → p-11）。传统 v 模型的验证手段在 ml 面前有三处失效： 覆盖率失义 ：代码覆盖率 100% 不等于输入空间被覆盖——神经网络的输入空间是连续高维的，无法穷举； 通过准则缺失 ：物理模型的误差界限可按机理推导，ml 的接受准则目前 没有行业收敛的标准 （这就是域 [需补约束] 的含义）； 失效模式不同 ：物理模型错得\"讲得出理由\"，ml 会 沉默地错 ——分布外输入照样给出自信的输出。 验证重心因此从\"代码对不对\"转向\"数据对不对、域边界在哪、错了怎么办\"。 2. 机制：五层验证框架（框架层为工程共识，条款级标准未收敛） 数据集验证 ：训练/验证/测试切分；切分方式必须匹配泛化目标（见手算实例）；数据来源与标注可追溯。 指标与接受准则 ：精度指标（mae/rmse）+ 不确定性量化（uq，uncertainty quantification，让模型输出\"我有多确定\"）+ 失效代价加权；准则由功能安全团队按应用场景商定并留档。 运行域定义（odd，operational design domain） ：明确模型在什么温度/soc/倍率域内可信；域外输入要么拒绝、要么降级。 鲁棒性与分布外测试（ood，out-of-distribution） ：噪声注入、传感器漂移注入、域外工况探测。 兜底与降级（fallback） ：ml 输出异常时回退到物理模型/保守策略——让\"ml 会错\"变成可安全承受的事件。 标准语言：iso 26262（s-07）覆盖代码与系统，iso 21448:2022（sotif，预期功能安全，标准直引）提供\"性能局限/已知未知\"的分析语言，ul 4600（标准直引）提供安全论证（safety case）框架——三者如何组合用于 bms 的 ml 组件， 尚无收敛答案 。 手算实例：一个 ml-soh 估计器的验证（核心案例，数字均为教学示意值） 任务：电芯 soh 估计；数据：公开数据集 calce（s-32），12 颗电芯训练、4 颗测试； 验收准则（项目自定，示意）：mae ≤ 2%，95% 分位误差 ≤ 4%； 实测：按\"电芯\"切分测试集，mae = 1.5% ✓； 切分陷阱对照 ：改按\"循环序号\"切分（同一颗电芯相邻循环分进训练/测试集）→ mae 虚降到 0.3%——相邻循环几乎一样，这是 数据泄漏 （data leakage），不是泛化能力； ood 测试：训练集温度 10~40 ℃，喂入 -20 ℃ 数据 → mae 恶化到 8% → 结论：运行域限定 [10, 45] ℃（示意），域外回退到安时积分 + 容量核查（ alg-01 / alg-05 的物理方法）。 3. 工程实态 量产普遍走 混合架构 ：ml 出精细值，物理模型守边界，超界即回退；纯 ml 直接控执行器的 bms 功能尚未成为主流（观点级）。 发布前影子模式评估（ dev-06 ）+ 发布后持续监控（误差漂移告警）——\"验证不止于发布\"。 数据闭环（ dev-06 ）承担 ml 的\"再验证\"：车型/批次/季节变化触发重训与重测。 4. 常见误区 把测试集精度当安全证据 ——精度是统计性能；安全论证要回答\"最坏情况会怎样、错了伤到谁\"。 数据泄漏 （见手算实例）——soh 任务还常见\"同一颗电池全寿命数据被拆到两边\"，实车泛化能力被严重高估。 忽略 分布漂移 （distribution shift）——车型/批次/季节变化后模型悄悄变差，没有监控就永远发现不了。 用\"可解释性差\"当借口跳过失效分析——至少要能回答\"输入什么特征时模型不可信\"。 5. 自测 q1 ：手算实例中两种切分方式，哪种对应\"换一批新电芯也能用\"的泛化目标？为什么？ q2 ：为什么 ood 测试要单独做，不能指望测试集自带代表性？ q3 ：ml-soh 上线后，云端应监控哪些量来发现\"静默退化\"？ 答案 q1：按\"电芯\"切分——模拟\"模型没见过这颗电芯\"的真实部署；按循环切分时测试与训练来自同一颗电芯、高度相似，考的是\"记忆\"不是\"泛化\"。 q2：测试集只评估\"与训练同分布\"的性能；ood 测试评估分布边界之外的失败方式（告警与回退是否有效），是运行域定义与兜底设计的依据，测试集给不出。 q3（示例）：①在线预测值与满充容量核查值（真实锚点）的偏差趋势；②输入特征的分布漂移（季节温度、新电池批次）；③模型不确定性输出的漂移；④触发回退/拒绝的频次变化。 来源 s-28：k. yang et al., soh 估计策略综述（ batteries 2023，开放获取） s-29：soh/rul 文献计量综述（ green energy &amp; environment 2024） s-21：sae 2026-26-0382（ai/ml 与数字孪生 bms；全文待核对 → p-11，候选证据地位） s-22：数字孪生综述（frontiers in batteries and electrochemistry, 2026） s-23：ai/dt 论文（mdpi《batteries》，卷期年份待核对；引用注意期刊声誉争议） s-32：calce 公开数据集（马里兰大学） iso 21448:2022《道路车辆 预期功能安全（sotif）》——标准编号直引（未登记 s 编号） ul 4600《自主产品安全评估标准》——标准编号直引（未登记 s 编号） 延伸资源（未联网核实，仅列经典名称，链接待核实） 资源 说明 iso 21448:2022 原文 sotif 的\"已知/未知\"分析语言 开源项目：scikit-learn、pytorch ml 实验基础设施（知名开源项目） 开源书：r. labbe《kalman and bayesian filters in python》（s-31） 物理兜底方法的直觉教材（免费、可运行） 待核对项 s-21 全文结论（p-11）：ai 验证接受准则是否给出可引用的具体框架，用于回填域 [需补约束]。 ul 4600 用于\"非自动驾驶的 bms ml 组件\"的适用性解读（观点级，未见直接案例来源）。 \"纯 ml 直接控执行器尚未成为主流\"为观点级概括。 ml-soh 验收指标的行业基准值（目前仅项目自定义，本课用教学示意值）。 "}, {"id": "FLT-01", "title": "课程 FLT-01：故障分类与分级", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-01<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有阈值均为<strong>教学示意值<\/strong>；且阈值与电芯体系强相关（LFP 与三元完全不同），不可照抄。<\/p><\/blockquote>\n<h3>1. 为什么\"有错就断高压\"是错的<\/h3>\n<p>故障处理有两个相反的失败模式：<\/p>\n<ol>\n<li><strong>漏处理<\/strong>：该断不断 → 安全事故；<\/li>\n<li><strong>过处理<\/strong>：不该断就断 → 高速失速、用户趴窝、投诉与误报工单（<a class=\"xlink\" href=\"#/lesson/FLT-06\">FLT-06<\/a> 的成本）。<\/li>\n<p>分级（fault classification/grading）就是在两者之间画线：把故障按严重度映射到<strong>强度递进、且每个等级都绑定可执行动作<\/strong>的处理链条——域九题眼\"识别 → 记录 → 降级 → 退出\"的第一环。节点约束点题：分级需对应可执行动作；阈值需防抖与迟滞设计。<\/p>\n<\/ol>\n<h3>2. 机制展开：分类维度与\"三件套\"<\/h3>\n<p><strong>（1）两个分类维度。<\/strong><\/p>\n<ul>\n<li>按参数域：电压类（过压/欠压/压差）、温度类（过温/温差/温升速率）、电流类（过流/短路）、绝缘类、通信类、硬件自检类（传感器断线/参考电压异常）；<\/li>\n<li>按严重度（示意四级）：一级提示（仪表文字）→ 二级报警（声光 + 限制相关功能）→ 三级降级（限功率，<a class=\"xlink\" href=\"#/lesson/FLT-03\">FLT-03<\/a>）→ 四级断高压（<a class=\"xlink\" href=\"#/lesson/FLT-04\">FLT-04<\/a>）；<\/li>\n<li>再叠加恢复属性：自恢复（温度回落）/ 周期恢复（下电再上电清除）/ 人工恢复（售后清码，<a class=\"xlink\" href=\"#/lesson/FLT-02\">FLT-02<\/a>）。<\/li>\n<p><strong>（2）阈值三件套：阈值 + 迟滞 + 防抖。<\/strong><\/p>\n<li><strong>阈值<\/strong>（threshold）：进入故障的判定线；<\/li>\n<li><strong>迟滞<\/strong>（hysteresis）：退出阈值低于进入阈值，两者之间是不判定带——防\"贴线抖动\"（OCV 漂移、工况波动都会让信号贴线）；<\/li>\n<li><strong>防抖<\/strong>（debounce）：条件须<strong>持续<\/strong>满足 N ms 才确认——防毛刺与单点采样噪声；<\/li>\n<li>三件套的参数互相牵制：防抖过长吃掉故障响应时间（FTTI 预算，SAFE-04），过短则误报洪水。<\/li>\n<p><strong>（3）分级表设计三原则。<\/strong><\/p>\n<\/ul>\n<ol>\n<li>每个等级绑定唯一动作与责任主体（谁执行：BMS 本地 / 请求 VCU / 请求充电机）；<\/li>\n<li>高等级动作必须覆盖低等级（三级动作 ⊇ 二级动作，进阶不遗漏）；<\/li>\n<li>可逆与不可逆分开：降级可逆要定义退出条件，断高压不可逆要定义进入前提（车速/场景评估）。<\/li>\n<\/ol>\n<h3>3. 手算实例：单体过压分级表设计（三元体系，教学示意值）<\/h3>\n<h4>分级表<\/h4>\n<table><thead><tr><th>级别<\/th><th>进入阈值<\/th><th>防抖<\/th><th>动作<\/th><th>退出条件<\/th><\/tr><\/thead><tbody><tr><td>一级<\/td><td>&gt; 4.15 V<\/td><td>500 ms<\/td><td>仪表提示<\/td><td>&lt; 4.10 V 持续 5 s<\/td><\/tr><tr><td>二级<\/td><td>&gt; 4.18 V<\/td><td>200 ms<\/td><td>报警 + 请求降流<\/td><td>&lt; 4.12 V 持续 5 s<\/td><\/tr><tr><td>三级<\/td><td>&gt; 4.20 V<\/td><td>100 ms<\/td><td>充电功率钳至 0<\/td><td>需检查/清码<\/td><\/tr><tr><td>四级<\/td><td>&gt; 4.25 V<\/td><td>50 ms<\/td><td>断高压<\/td><td>需检修<\/td><\/tr><\/tbody><\/table>\n<p>（三元电芯满充上限在 4.2~4.35 V 区间，本表按 4.20 V 上限体系设列，全为示意；LFP 体系对应阈值在 3.65 V 附近——<strong>体系不同，表完全不同<\/strong>。）<\/p>\n<h4>推演：一次充电过压事件<\/h4>\n<p>充电中单体电压爬至 4.19 V，持续 300 ms → 越过二级阈值 4.18 V 且超过防抖 200 ms → <strong>二级触发<\/strong>：仪表报警 + BMS 向充电机请求降流（GB/T 27930 报文链，S-05）。降流后电压回落至 4.12 V 以下持续 5 s → 二级退出。若降流无效、电压继续爬至 4.21 V → 三级（停充）；仍无效至 4.25 V → 四级断高压（此时充电中非行驶，断开次生风险低——FLT-04 场景 A）。<\/p>\n<h4>反面推演：没有迟滞的世界<\/h4>\n<p>退出阈值 = 进入阈值 = 4.18 V：降流后电压在 4.175~4.185 V 波动（贴线，示意）→ 报警反复触发/退出 → 仪表灯闪烁、云端一晚上生成 20 条工单（示意）——迟滞 60 mV 的意义就是把这条判定带从噪声里挪出来。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产 BMS 的故障矩阵（fault matrix）通常数百条目（示意量级），每条六要素：阈值/防抖/迟滞/等级/动作/恢复条件，由标定工具管理（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）；<\/li>\n<li>分级动作与 ISO 26262（S-07）安全机制衔接：安全相关故障的动作时序须满足 FTTI（SAFE-04 的 HARA 产出）；<\/li>\n<li>GB/T 38661-2020（S-03）对故障处理有要求（具体条款待核对）；T/CAAMTB 设计规范（S-19，P-01 待核对）为团标参考；<\/li>\n<li>阈值标定是电池厂 + 主机厂联合工作：电芯厂给边界，整车厂标定等级与体验。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>报了等级却没绑定动作（\"三级报警\"既不限流也不提示——分级表形同虚设）；<\/li>\n<li>只设阈值不做迟滞/防抖——误报与抖动必然发生（反面推演）；<\/li>\n<li>阈值照抄友商量产表——与电芯体系、工况、老化状态强相关；<\/li>\n<li>忘了\"老化迁移\"：内阻上升后压差/温升分布变化，多年后原阈值误报率上升，标定要留 SOH 余量（<a class=\"xlink\" href=\"#/lesson/ALG-05\">ALG-05<\/a>）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：三级动作为什么必须覆盖（⊇）二级动作？举一个不覆盖导致的具体后果。 <strong>Q2<\/strong>：防抖 500 ms（一级）与 50 ms（四级），为什么等级越高防抖越短？ <strong>Q3<\/strong>：LFP 包把本课表格阈值原样移植会发生什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：等级进阶意味着故障更严重，处理只增不减。若三级不含二级的\"报警\"，用户看到的只是功率变小却没有任何提示——把安全降级误当成车\"坏了/没电了\"，追问与误报随之而来。<\/li>\n<li>Q2：等级越高动作越重（断高压不可逆），留给确认的时间越少（FTTI 更紧），且高阈值本身离噪声区更远——用更短防抖换响应速度；低等级动作为提示，宁可多确认一秒也要压误报。<\/li>\n<li>Q3：4.15 V 对 LFP 是远超上限的深过压（LFP 满充约 3.65 V）——等真正的过压发生时早就出事了；而正常满充 3.65 V 反而触发不了任何一级。整套表报废，保护形同虚设。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（故障处理相关要求；条款细节待核对 → 文末）<\/li>\n<li>S-07：ISO 26262:2018（安全机制、FTTI 与分级动作的衔接框架）<\/li>\n<li>S-19：T/CAAMTB BMS 设计规范（P-01 待核对）<\/li>\n<li>本课分级表与全部阈值为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 原文（S-07）<\/td><td>A<\/td><td>功能安全机制与故障响应时间框架<\/td><\/tr><tr><td>GB/T 38661-2020 原文（S-03）<\/td><td>A<\/td><td>BMS 技术条件<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>故障矩阵设计方法公开文献（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 故障处理条款（等级划分/动作要求）→ 建议新 P 项<\/li>\n<li>量产 BMS 故障矩阵条目数量级（本课\"数百条\"为示意）<\/li>\n<li>三元/LFP 过压阈值体系的电芯规格书佐证<\/li>\n<li>防抖时间与 FTTI 分配关系的公开方法论<\/li>\n<\/ul>", "text": " 对应节点 flt-01 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： safe-04 （建议）｜ 预计用时 45 min 数字规则：文中所有阈值均为 教学示意值 ；且阈值与电芯体系强相关（lfp 与三元完全不同），不可照抄。 1. 为什么\"有错就断高压\"是错的 故障处理有两个相反的失败模式： 漏处理 ：该断不断 → 安全事故； 过处理 ：不该断就断 → 高速失速、用户趴窝、投诉与误报工单（ flt-06 的成本）。 分级（fault classification/grading）就是在两者之间画线：把故障按严重度映射到 强度递进、且每个等级都绑定可执行动作 的处理链条——域九题眼\"识别 → 记录 → 降级 → 退出\"的第一环。节点约束点题：分级需对应可执行动作；阈值需防抖与迟滞设计。 2. 机制展开：分类维度与\"三件套\" （1）两个分类维度。 按参数域：电压类（过压/欠压/压差）、温度类（过温/温差/温升速率）、电流类（过流/短路）、绝缘类、通信类、硬件自检类（传感器断线/参考电压异常）； 按严重度（示意四级）：一级提示（仪表文字）→ 二级报警（声光 + 限制相关功能）→ 三级降级（限功率， flt-03 ）→ 四级断高压（ flt-04 ）； 再叠加恢复属性：自恢复（温度回落）/ 周期恢复（下电再上电清除）/ 人工恢复（售后清码， flt-02 ）。 （2）阈值三件套：阈值 + 迟滞 + 防抖。 阈值 （threshold）：进入故障的判定线； 迟滞 （hysteresis）：退出阈值低于进入阈值，两者之间是不判定带——防\"贴线抖动\"（ocv 漂移、工况波动都会让信号贴线）； 防抖 （debounce）：条件须 持续 满足 n ms 才确认——防毛刺与单点采样噪声； 三件套的参数互相牵制：防抖过长吃掉故障响应时间（ftti 预算，safe-04），过短则误报洪水。 （3）分级表设计三原则。 每个等级绑定唯一动作与责任主体（谁执行：bms 本地 / 请求 vcu / 请求充电机）； 高等级动作必须覆盖低等级（三级动作 ⊇ 二级动作，进阶不遗漏）； 可逆与不可逆分开：降级可逆要定义退出条件，断高压不可逆要定义进入前提（车速/场景评估）。 3. 手算实例：单体过压分级表设计（三元体系，教学示意值） 分级表 级别 进入阈值 防抖 动作 退出条件 一级 &gt; 4.15 v 500 ms 仪表提示 &lt; 4.10 v 持续 5 s 二级 &gt; 4.18 v 200 ms 报警 + 请求降流 &lt; 4.12 v 持续 5 s 三级 &gt; 4.20 v 100 ms 充电功率钳至 0 需检查/清码 四级 &gt; 4.25 v 50 ms 断高压 需检修 （三元电芯满充上限在 4.2~4.35 v 区间，本表按 4.20 v 上限体系设列，全为示意；lfp 体系对应阈值在 3.65 v 附近—— 体系不同，表完全不同 。） 推演：一次充电过压事件 充电中单体电压爬至 4.19 v，持续 300 ms → 越过二级阈值 4.18 v 且超过防抖 200 ms → 二级触发 ：仪表报警 + bms 向充电机请求降流（gb/t 27930 报文链，s-05）。降流后电压回落至 4.12 v 以下持续 5 s → 二级退出。若降流无效、电压继续爬至 4.21 v → 三级（停充）；仍无效至 4.25 v → 四级断高压（此时充电中非行驶，断开次生风险低——flt-04 场景 a）。 反面推演：没有迟滞的世界 退出阈值 = 进入阈值 = 4.18 v：降流后电压在 4.175~4.185 v 波动（贴线，示意）→ 报警反复触发/退出 → 仪表灯闪烁、云端一晚上生成 20 条工单（示意）——迟滞 60 mv 的意义就是把这条判定带从噪声里挪出来。 4. 工程实态 量产 bms 的故障矩阵（fault matrix）通常数百条目（示意量级），每条六要素：阈值/防抖/迟滞/等级/动作/恢复条件，由标定工具管理（ sw-05 ）； 分级动作与 iso 26262（s-07）安全机制衔接：安全相关故障的动作时序须满足 ftti（safe-04 的 hara 产出）； gb/t 38661-2020（s-03）对故障处理有要求（具体条款待核对）；t/caamtb 设计规范（s-19，p-01 待核对）为团标参考； 阈值标定是电池厂 + 主机厂联合工作：电芯厂给边界，整车厂标定等级与体验。 5. 常见误区 报了等级却没绑定动作（\"三级报警\"既不限流也不提示——分级表形同虚设）； 只设阈值不做迟滞/防抖——误报与抖动必然发生（反面推演）； 阈值照抄友商量产表——与电芯体系、工况、老化状态强相关； 忘了\"老化迁移\"：内阻上升后压差/温升分布变化，多年后原阈值误报率上升，标定要留 soh 余量（ alg-05 ）。 6. 自测 q1 ：三级动作为什么必须覆盖（⊇）二级动作？举一个不覆盖导致的具体后果。 q2 ：防抖 500 ms（一级）与 50 ms（四级），为什么等级越高防抖越短？ q3 ：lfp 包把本课表格阈值原样移植会发生什么？ 答案 q1：等级进阶意味着故障更严重，处理只增不减。若三级不含二级的\"报警\"，用户看到的只是功率变小却没有任何提示——把安全降级误当成车\"坏了/没电了\"，追问与误报随之而来。 q2：等级越高动作越重（断高压不可逆），留给确认的时间越少（ftti 更紧），且高阈值本身离噪声区更远——用更短防抖换响应速度；低等级动作为提示，宁可多确认一秒也要压误报。 q3：4.15 v 对 lfp 是远超上限的深过压（lfp 满充约 3.65 v）——等真正的过压发生时早就出事了；而正常满充 3.65 v 反而触发不了任何一级。整套表报废，保护形同虚设。 来源 s-03：gb/t 38661-2020（故障处理相关要求；条款细节待核对 → 文末） s-07：iso 26262:2018（安全机制、ftti 与分级动作的衔接框架） s-19：t/caamtb bms 设计规范（p-01 待核对） 本课分级表与全部阈值为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 26262:2018 原文（s-07） a 功能安全机制与故障响应时间框架 gb/t 38661-2020 原文（s-03） a bms 技术条件 [待补链] — 故障矩阵设计方法公开文献（核实后补） 待核对项（本课） gb/t 38661-2020 故障处理条款（等级划分/动作要求）→ 建议新 p 项 量产 bms 故障矩阵条目数量级（本课\"数百条\"为示意） 三元/lfp 过压阈值体系的电芯规格书佐证 防抖时间与 ftti 分配关系的公开方法论 "}, {"id": "FLT-02", "title": "课程 FLT-02：DTC、冻结帧与快照", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-02<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>、<a class=\"xlink\" href=\"#/lesson/FLT-01\">FLT-01<\/a> ｜ 预计用时 45 min 数字规则：文中编码结构与容量数字均为<strong>教学示意值<\/strong>（编码示例不代表任何真实厂家定义）；UDS 服务号与状态位语义以 ISO 14229-1（S-09）为准。<\/p><\/blockquote>\n<h3>1. 为什么\"检测到故障\"只算一半工作<\/h3>\n<p>故障在某个瞬间发生，而维修在几天后进行——中间隔着停车、下电、重启、开到店里的全程。没有\"证据固化\"，售后面对的就是一个已经\"痊愈\"或面目全非的系统：<\/p>\n<ol>\n<li><strong>DTC<\/strong>（Diagnostic Trouble Code，故障码）：故障的标准化编码，让\"哪个故障\"可读、可查手册、可统计；<\/li>\n<li><strong>冻结帧<\/strong>（Freeze Frame）/快照（snapshot）：触发瞬间的整车状态切片，让\"当时什么样\"可复盘；<\/li>\n<li><strong>扩展数据<\/strong>（extended data）：发生次数、首末次里程、计数器——让\"偶发还是惯犯\"可判。<\/li>\n<p>节点约束点题：DTC 需含 Freeze Frame 便于售后；存储需掉电保持。<\/p>\n<\/ol>\n<h3>2. 机制展开：UDS 框架下的 DTC 体系<\/h3>\n<p><strong>（1）诊断服务（ISO 14229-1，S-09）。<\/strong> 本节点的骨架服务：<\/p>\n<ul>\n<li><code>0x19<\/code> ReadDTCInformation：按状态掩码读码（子功能 0x02）、读快照（0x04）、读扩展数据（0x06）；<\/li>\n<li><code>0x14<\/code> ClearDiagnosticInformation：清码（清前应先读——现场一旦清掉就没了）；<\/li>\n<li><code>0x85<\/code> ControlDTCSetting：刷写/标定时暂停 DTC 更新，防误码；<\/li>\n<li>配套 <code>0x27<\/code> 安全访问、<code>0x22/0x2E<\/code> DID 读写（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）。<\/li>\n<p><strong>（2）DTC 三字节结构与状态位。<\/strong> UDS 的 DTC 为 3 字节（高位=系统组、中位=子系统、低位=故障类型——示意性概括）。示意编码：<code>0xC1 0x23 0x11<\/code> = 电池系统组（0xC1，示意）× 单体过压（0x23，示意）× 电气故障类型（0x11，示意）。<strong>结构是真的，示例值是编的<\/strong>——具体定义是各厂 DTC 手册的私有资产。<\/p>\n<p><strong>状态字节<\/strong>（1 字节 8 位，UDS 定义）：常用位如 <code>testFailed<\/code>（0x01，本次检测失败）与 <code>confirmedDTC<\/code>（0x40，跨周期确认成立）。示意推演：首次失败 status = 0x01；连续失败坐实后 confirmed 置位 → 0x41。confirmed 的 DTC 才进\"历史故障\"存储。<\/p>\n<p><strong>（3）快照内容设计。<\/strong> 最小可用快照（示意）：单体最高/最低电压、电流、最高/最低温度、SOC、继电器状态、时间戳 + <strong>触发前后各一段<\/strong>（前因长、后果短，<a class=\"xlink\" href=\"#/lesson/SW-07\">SW-07<\/a> 的事故取证结构同理）。<\/p>\n<p><strong>（4）掉电保持。<\/strong> DTC 表 + 快照存 NVM，双区（A/B）交替写入 + 序号与 CRC，掉电后取序号新且校验通过的一区——上电扫描重建（机制同 SW-07 黑匣子纪律）。<\/p>\n<\/ul>\n<h3>3. 手算实例：快照容量预算与确认机制推演（教学示意值）<\/h3>\n<h4>实例 1：快照存储预算<\/h4>\n<p>设计：触发前 5 s + 后 5 s，采样 10 Hz，每样本 8 信号 × 2 B + 4 B 时间戳 = 20 B：<\/p>\n<ul>\n<li>单条快照 = 100 样本 × 20 B = <strong>2 KB<\/strong>；<\/li>\n<li>预留 32 条（不同 DTC 各留最新）→ 64 KB——对车规 NVM 是零头；<\/li>\n<li>对照 SW-07 的带宽账：单条 2 KB 的事件包上传毫无压力，<strong>瓶颈从来是\"传什么\"的策略，不是容量<\/strong>。<\/li>\n<\/ul>\n<h4>实例 2：确认与老化的计数器推演<\/h4>\n<p>failure counter：每次检测失败 +N、通过 −1（示意 +3/−1，具体算法 UDS 不规定、由厂内定义），达到触发线则 confirmed 置位（示意机制）：<\/p>\n<ul>\n<li>间歇故障（10 次里坏 3 次）：counter 涨涨跌跌，几个周期后仍到线 → confirmed——<strong>间歇故障也能坐实<\/strong>；<\/li>\n<li>老化计数（aging counter）：确认后连续 40 个无故障驾驶周期（示意）→ 自动作 aging 处理（如降级为历史记录）——\"修好了\"要靠无故障运行证明，不能靠清码。<\/li>\n<\/ul>\n<h4>实例 3：清码丢现场的代价<\/h4>\n<p>售后惯例\"先清码再看还报不报\"：若清码前未强制读出快照并上传，触发瞬间的证据（当时电流 180 A、最高单体 4.21 V——示意值）永久丢失。<strong>纪律：读码 → 读快照 → 读扩展数据 → 再清码。<\/strong> 顺序错了，<a class=\"xlink\" href=\"#/lesson/FLT-05\">FLT-05<\/a> 的归属判定就没了依据。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>各 OEM 维护 DTC 手册（数千条量级，示意），定义每码的语义、快照字段、处置建议——这本手册同时是售后手册与责任判定依据（FLT-05）；<\/li>\n<li>快照/扩展数据的字段语义与 DID 一样需要\"语义合同\"（SW-05/SW-07：车端、云端、售后工具三方一致）；<\/li>\n<li>诊断安全：读快照/清码要过会话切换（0x10）+ 0x27 安全访问，防篡改（S-07/S-08 视角）；<\/li>\n<li>时间戳与整车时间基准对齐（SW-07），否则多控制器的证据串不成时间轴。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 DTC 当\"故障原因\"——它是症状编码：单体过压可能是电芯问题，也可能是桩不降流（FLT-05 案例）；<\/li>\n<li>快照只有\"触发瞬间一帧\"没有前后过程——偶发故障现场无法复现；<\/li>\n<li>清码即清证据——顺序纪律（实例 3）必须写进售后流程；<\/li>\n<li>DTC 语义私有且不留档——售后靠猜、责任靠嗓门，FLT-05 争议的直接源头。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：<code>testFailed<\/code> 与 <code>confirmedDTC<\/code> 的区别是什么？为什么要分两步确认？ <strong>Q2<\/strong>：快照为什么\"前 5 s + 后 5 s\"而不是\"后 10 s\"？ <strong>Q3<\/strong>：间歇故障（时好时坏）如何被 confirmed 机制坐实？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：testFailed 是\"本次检测不通过\"（可能瞬时毛刺）；confirmedDTC 是\"跨多个驾驶周期确认成立\"（排除了毛刺与偶发）。分两步是用时间换置信——瞬时噪声不进历史库，售后看到的都是坐实的故障。<\/li>\n<li>Q2：诱因在前（触发前的电流电压温度才是\"案发现场\"），系统响应在后（后 5 s 足够看动作是否正确）——前因长、后果短是取证结构（同 SW-07 的 30+10 设计逻辑）。<\/li>\n<li>Q3：failure counter 失败加分、通过减分且分值不对称（+3/−1，示意）——只要坏的概率不低，计数器趋势向上，几个周期后到线 → confirmed；纯偶发毛刺（通过率极高）计数器整体回落，不会坐实。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-09：ISO 14229-1《统一诊断服务（UDS）》（服务号、状态位、快照/扩展数据机制）<\/li>\n<li>S-03：GB/T 38661-2020（诊断相关要求，条款待核对 → 文末）<\/li>\n<li>示意编码 0xC1/0x23/0x11、计数器 +3/−1 等均为教学示意值，非真实厂家定义<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 14229-1 原文（S-09）<\/td><td>A<\/td><td>UDS 服务与 DTC 机制权威文本<\/td><\/tr><tr><td>python-udsoncan 开源库<\/td><td>B<\/td><td>知名开源 UDS 实现（Python），可搭台架练 0x19 服务<\/td><\/tr><tr><td>python-can / cantools 开源库<\/td><td>B<\/td><td>知名 CAN 工具链（配合 S-11 学习诊断报文）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 诊断与故障存储条款 → 建议新 P 项<\/li>\n<li>failure counter 增减算法的公开资料（UDS 只定义状态位语义，算法属厂内策略）<\/li>\n<li>量产 DTC 手册条目数量级（\"数千条\"为示意）<\/li>\n<li>aging 的无故障驾驶周期数典型标定量级（40 为示意）<\/li>\n<\/ul>", "text": " 对应节点 flt-02 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： sw-05 、 flt-01 ｜ 预计用时 45 min 数字规则：文中编码结构与容量数字均为 教学示意值 （编码示例不代表任何真实厂家定义）；uds 服务号与状态位语义以 iso 14229-1（s-09）为准。 1. 为什么\"检测到故障\"只算一半工作 故障在某个瞬间发生，而维修在几天后进行——中间隔着停车、下电、重启、开到店里的全程。没有\"证据固化\"，售后面对的就是一个已经\"痊愈\"或面目全非的系统： dtc （diagnostic trouble code，故障码）：故障的标准化编码，让\"哪个故障\"可读、可查手册、可统计； 冻结帧 （freeze frame）/快照（snapshot）：触发瞬间的整车状态切片，让\"当时什么样\"可复盘； 扩展数据 （extended data）：发生次数、首末次里程、计数器——让\"偶发还是惯犯\"可判。 节点约束点题：dtc 需含 freeze frame 便于售后；存储需掉电保持。 2. 机制展开：uds 框架下的 dtc 体系 （1）诊断服务（iso 14229-1，s-09）。 本节点的骨架服务： 0x19 readdtcinformation：按状态掩码读码（子功能 0x02）、读快照（0x04）、读扩展数据（0x06）； 0x14 cleardiagnosticinformation：清码（清前应先读——现场一旦清掉就没了）； 0x85 controldtcsetting：刷写/标定时暂停 dtc 更新，防误码； 配套 0x27 安全访问、 0x22/0x2e did 读写（ sw-05 ）。 （2）dtc 三字节结构与状态位。 uds 的 dtc 为 3 字节（高位=系统组、中位=子系统、低位=故障类型——示意性概括）。示意编码： 0xc1 0x23 0x11 = 电池系统组（0xc1，示意）× 单体过压（0x23，示意）× 电气故障类型（0x11，示意）。 结构是真的，示例值是编的 ——具体定义是各厂 dtc 手册的私有资产。 状态字节 （1 字节 8 位，uds 定义）：常用位如 testfailed （0x01，本次检测失败）与 confirmeddtc （0x40，跨周期确认成立）。示意推演：首次失败 status = 0x01；连续失败坐实后 confirmed 置位 → 0x41。confirmed 的 dtc 才进\"历史故障\"存储。 （3）快照内容设计。 最小可用快照（示意）：单体最高/最低电压、电流、最高/最低温度、soc、继电器状态、时间戳 + 触发前后各一段 （前因长、后果短， sw-07 的事故取证结构同理）。 （4）掉电保持。 dtc 表 + 快照存 nvm，双区（a/b）交替写入 + 序号与 crc，掉电后取序号新且校验通过的一区——上电扫描重建（机制同 sw-07 黑匣子纪律）。 3. 手算实例：快照容量预算与确认机制推演（教学示意值） 实例 1：快照存储预算 设计：触发前 5 s + 后 5 s，采样 10 hz，每样本 8 信号 × 2 b + 4 b 时间戳 = 20 b： 单条快照 = 100 样本 × 20 b = 2 kb ； 预留 32 条（不同 dtc 各留最新）→ 64 kb——对车规 nvm 是零头； 对照 sw-07 的带宽账：单条 2 kb 的事件包上传毫无压力， 瓶颈从来是\"传什么\"的策略，不是容量 。 实例 2：确认与老化的计数器推演 failure counter：每次检测失败 +n、通过 −1（示意 +3/−1，具体算法 uds 不规定、由厂内定义），达到触发线则 confirmed 置位（示意机制）： 间歇故障（10 次里坏 3 次）：counter 涨涨跌跌，几个周期后仍到线 → confirmed—— 间歇故障也能坐实 ； 老化计数（aging counter）：确认后连续 40 个无故障驾驶周期（示意）→ 自动作 aging 处理（如降级为历史记录）——\"修好了\"要靠无故障运行证明，不能靠清码。 实例 3：清码丢现场的代价 售后惯例\"先清码再看还报不报\"：若清码前未强制读出快照并上传，触发瞬间的证据（当时电流 180 a、最高单体 4.21 v——示意值）永久丢失。 纪律：读码 → 读快照 → 读扩展数据 → 再清码。 顺序错了， flt-05 的归属判定就没了依据。 4. 工程实态 各 oem 维护 dtc 手册（数千条量级，示意），定义每码的语义、快照字段、处置建议——这本手册同时是售后手册与责任判定依据（flt-05）； 快照/扩展数据的字段语义与 did 一样需要\"语义合同\"（sw-05/sw-07：车端、云端、售后工具三方一致）； 诊断安全：读快照/清码要过会话切换（0x10）+ 0x27 安全访问，防篡改（s-07/s-08 视角）； 时间戳与整车时间基准对齐（sw-07），否则多控制器的证据串不成时间轴。 5. 常见误区 把 dtc 当\"故障原因\"——它是症状编码：单体过压可能是电芯问题，也可能是桩不降流（flt-05 案例）； 快照只有\"触发瞬间一帧\"没有前后过程——偶发故障现场无法复现； 清码即清证据——顺序纪律（实例 3）必须写进售后流程； dtc 语义私有且不留档——售后靠猜、责任靠嗓门，flt-05 争议的直接源头。 6. 自测 q1 ： testfailed 与 confirmeddtc 的区别是什么？为什么要分两步确认？ q2 ：快照为什么\"前 5 s + 后 5 s\"而不是\"后 10 s\"？ q3 ：间歇故障（时好时坏）如何被 confirmed 机制坐实？ 答案 q1：testfailed 是\"本次检测不通过\"（可能瞬时毛刺）；confirmeddtc 是\"跨多个驾驶周期确认成立\"（排除了毛刺与偶发）。分两步是用时间换置信——瞬时噪声不进历史库，售后看到的都是坐实的故障。 q2：诱因在前（触发前的电流电压温度才是\"案发现场\"），系统响应在后（后 5 s 足够看动作是否正确）——前因长、后果短是取证结构（同 sw-07 的 30+10 设计逻辑）。 q3：failure counter 失败加分、通过减分且分值不对称（+3/−1，示意）——只要坏的概率不低，计数器趋势向上，几个周期后到线 → confirmed；纯偶发毛刺（通过率极高）计数器整体回落，不会坐实。 来源 s-09：iso 14229-1《统一诊断服务（uds）》（服务号、状态位、快照/扩展数据机制） s-03：gb/t 38661-2020（诊断相关要求，条款待核对 → 文末） 示意编码 0xc1/0x23/0x11、计数器 +3/−1 等均为教学示意值，非真实厂家定义 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 14229-1 原文（s-09） a uds 服务与 dtc 机制权威文本 python-udsoncan 开源库 b 知名开源 uds 实现（python），可搭台架练 0x19 服务 python-can / cantools 开源库 b 知名 can 工具链（配合 s-11 学习诊断报文） 待核对项（本课） gb/t 38661-2020 诊断与故障存储条款 → 建议新 p 项 failure counter 增减算法的公开资料（uds 只定义状态位语义，算法属厂内策略） 量产 dtc 手册条目数量级（\"数千条\"为示意） aging 的无故障驾驶周期数典型标定量级（40 为示意） "}, {"id": "FLT-03", "title": "课程 FLT-03：降级策略", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-03<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/FLT-01\">FLT-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-01\">SYS-01<\/a>（建议）｜ 预计用时 45 min 数字规则：文中所有功率/比例数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要在\"正常运行\"与\"断高压\"之间设中间态<\/h3>\n<p>断高压是最重的处理（<a class=\"xlink\" href=\"#/lesson/FLT-04\">FLT-04<\/a>），但大多数故障并不需要立刻断电：<\/p>\n<ul>\n<li>温度传感器断线 ≠ 电池危险，只是\"看不清了\"；<\/li>\n<li>绝缘轻微下降、通信偶发丢帧——都还有观测和应对的余地。<\/li>\n<p>若处理只有\"不管\"和\"断电\"两档，要么漏安全，要么滥断电（高速失速本身就是 HARA 里的危害源）。降级（derating / limp-home，跛行回家）就是中间安全态：<strong>限制功率与功能，换取\"继续安全行驶到可停车处\"的能力<\/strong>。节点约束点题：降级需与 VCU 联动执行；进入/退出条件需明确。<\/p>\n<\/ul>\n<h3>2. 机制展开：动作谱系、执行链路与进入/退出<\/h3>\n<p><strong>（1）降级动作谱系（从轻到重，示意）。<\/strong><\/p>\n<p>``<code> 提示 → 限充电功率 → 禁止充电 → 限放电功率（如 40%）→ 限速（VCU 限扭）→ 停车后禁上高压 → 断高压 <\/code>``<\/p>\n<p>每一档都是\"能力削减换风险下降\"，选档依据是 FLT-01 的故障等级 + 故障的具体后果面（影响放电？影响充电？影响测量可信度？）。<\/p>\n<p><strong>（2）执行链路：BMS 请求，VCU 执行。<\/strong> BMS 通过 CAN 发送功率限制值/使能标志，VCU 在扭矩仲裁中执行——权限划分同 <a class=\"xlink\" href=\"#/lesson/THM-03\">THM-03<\/a>：<strong>BMS 管\"电池还能给多少\"，VCU 管\"整车怎么用\"<\/strong>。两侧状态机必须约定一致（报文丢失时 VCU 按保守默认执行）。<\/p>\n<p><strong>（3）与 SOP 的关系：两层分开。<\/strong> SOP（<code>ALG-06<\/code>）是正常降额（温度/SOC/健康状态的物理限制），故障降级是在 SOP 结果上再乘故障系数或直接钳位。<strong>架构上不许混<\/strong>——把热降额当故障报出来，用户会以为车坏了。<\/p>\n<p><strong>（4）进入/退出条件明确化。<\/strong> 进入 = FLT-01 分级触发（有防抖与迟滞）；退出 = 故障消失 + 迟滞 + <strong>观察窗<\/strong>（如持续 5 min 无复发，示意），部分等级要求下电周期重置。退出条件与进入条件同样要写进故障矩阵，缺了就是\"进去容易出来难\"。<\/p>\n<h3>3. 手算实例：限功率级联推演（教学示意值）<\/h3>\n<p>背景：峰值放电 100 kW 的系统。<\/p>\n<p><strong>场景推演：一个温度传感器断线（开路，读数 −50 °C 非法值）<\/strong><\/p>\n<ol>\n<li>硬件自检判断线 → 二级故障 → 该模组温度不可信 → 放电功率钳位至 40%（故障系数，示意）；<\/li>\n<li>同时环境 −10 °C，SOP 热降额允许 60 kW（示意）——两条限制取 <strong>min(40 kW, 60 kW) = 40 kW<\/strong>；<\/li>\n<li>用户地板电请求 90 kW → BMS 应答可用功率 40 kW → VCU 按此限扭——仪表同步提示\"动力受限\"（体验闭环）。<\/li>\n<p><strong>恶化推演：同模组再断 2 个传感器 → 可信测温全失<\/strong><\/p>\n<\/ol>\n<ul>\n<li>测量不可信比单点故障严重：最热点温度完全盲区（<a class=\"xlink\" href=\"#/lesson/THM-01\">THM-01<\/a>）→ 升三级：功率钳位至 10%（10 kW，示意）+ HUD 请求靠边；<\/li>\n<li>10 kW 仍可维持低速行驶（示意 20~30 km/h）——<strong>降级保留的不是性能，是\"能挪到安全地带\"的能力<\/strong>；<\/li>\n<li>若此时再叠加\"单体过温四级\"（真实危险，不只是看不见）→ 断高压路径（FLT-04），在已减速的时机断开，次生风险被前置的降级大幅压低——<strong>这就是\"降级为断高压争取非危险时机\"的设计思想<\/strong>。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>跛行模式的用户体验（限多少功率、能开多远、提示文案）是主机厂与电池厂联合定义的标定项；<\/li>\n<li>退出常见两类：故障消失 + 观察窗自动恢复（可逆类）；下电重上电恢复（保守类）；安全相关不可逆故障必须检修（FLT-02 恢复属性）；<\/li>\n<li>整车级约束：BMS 降级不得引发转向/制动助力等底盘功能意外失效——那是 VCU/底盘域的联动安全，BMS 需提供\"我即将降级\"的前置通知；<\/li>\n<li>GB/T 38661-2020（S-03）对故障状态下的功能表现有要求（条款待核对）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把降级当惩罚、越狠越安全——过度降级制造高速失速风险，反而引入新的危害；<\/li>\n<li>BMS 悄悄限功率不通知 VCU/用户——状态机不匹配导致整车行为怪异，用户感知\"车抽风\"；<\/li>\n<li>退出无迟滞无观察窗——故障闪变时功率跟着闪变，动力忽大忽小；<\/li>\n<li>把正常 SOP 降额显示成故障降级——冬天动力弱 ≠ 车坏了，语义混淆直接伤害售后分流（FLT-06 误报工单）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么\"测量可信度丧失\"（传感器全断）比\"单点数值越限\"更严重？ <strong>Q2<\/strong>：故障系数与 SOP 为什么取 min 而不是相加/覆盖？ <strong>Q3<\/strong>：为\"单体过温三级\"设计一个退出条件。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：单点越限还能靠\"限到安全包络内\"兜底；测量全失意味着最热点是否危险<strong>不可知<\/strong>——不可知比可知的危险更危险，只能按最坏假设钳到最低档并引导停车。<\/li>\n<li>Q2：两条限制是不同性质的约束（物理能力 vs 故障保守假设），任何一条都独立成立，能力取交集即 min。相加无物理意义；\"覆盖\"（故障系数直接顶掉 SOP）会在故障系数宽于 SOP 时放开物理限制——越权。<\/li>\n<li>Q3（示意答案）：单体最高温 &lt; 阈值 − 迟滞（如阈值 55 °C → &lt; 50 °C，示意）持续 5 min + 期间无新故障 + 温升速率正常（&lt; 2 K/min，示意）→ 退出三级、恢复至 SOP 决定的功率；若短期内复发 → 升级处理（等级 +1，示意规则）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（故障状态下功能要求，条款细节待核对 → 文末）<\/li>\n<li>S-07：ISO 26262:2018（安全状态过渡与降级作为中间安全态的框架）<\/li>\n<li>本课功率/比例/时间均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 原文（S-07）<\/td><td>A<\/td><td>safe state / 降级过渡的框架依据<\/td><\/tr><tr><td>GB/T 38661-2020 原文（S-03）<\/td><td>A<\/td><td>BMS 技术条件<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>跛行模式（limp-home）整车标定公开资料（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 故障降级相关条款 → 建议新 P 项<\/li>\n<li>量产跛行模式功率比例与续驶能力的公开资料（40%/10 kW 均为示意）<\/li>\n<li>降级退出观察窗的典型标定量级（5 min 为示意）<\/li>\n<\/ul>", "text": " 对应节点 flt-03 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： flt-01 、 sys-01 （建议）｜ 预计用时 45 min 数字规则：文中所有功率/比例数字均为 教学示意值 。 1. 为什么需要在\"正常运行\"与\"断高压\"之间设中间态 断高压是最重的处理（ flt-04 ），但大多数故障并不需要立刻断电： 温度传感器断线 ≠ 电池危险，只是\"看不清了\"； 绝缘轻微下降、通信偶发丢帧——都还有观测和应对的余地。 若处理只有\"不管\"和\"断电\"两档，要么漏安全，要么滥断电（高速失速本身就是 hara 里的危害源）。降级（derating / limp-home，跛行回家）就是中间安全态： 限制功率与功能，换取\"继续安全行驶到可停车处\"的能力 。节点约束点题：降级需与 vcu 联动执行；进入/退出条件需明确。 2. 机制展开：动作谱系、执行链路与进入/退出 （1）降级动作谱系（从轻到重，示意）。 `` 提示 → 限充电功率 → 禁止充电 → 限放电功率（如 40%）→ 限速（vcu 限扭）→ 停车后禁上高压 → 断高压 `` 每一档都是\"能力削减换风险下降\"，选档依据是 flt-01 的故障等级 + 故障的具体后果面（影响放电？影响充电？影响测量可信度？）。 （2）执行链路：bms 请求，vcu 执行。 bms 通过 can 发送功率限制值/使能标志，vcu 在扭矩仲裁中执行——权限划分同 thm-03 ： bms 管\"电池还能给多少\"，vcu 管\"整车怎么用\" 。两侧状态机必须约定一致（报文丢失时 vcu 按保守默认执行）。 （3）与 sop 的关系：两层分开。 sop（ alg-06 ）是正常降额（温度/soc/健康状态的物理限制），故障降级是在 sop 结果上再乘故障系数或直接钳位。 架构上不许混 ——把热降额当故障报出来，用户会以为车坏了。 （4）进入/退出条件明确化。 进入 = flt-01 分级触发（有防抖与迟滞）；退出 = 故障消失 + 迟滞 + 观察窗 （如持续 5 min 无复发，示意），部分等级要求下电周期重置。退出条件与进入条件同样要写进故障矩阵，缺了就是\"进去容易出来难\"。 3. 手算实例：限功率级联推演（教学示意值） 背景：峰值放电 100 kw 的系统。 场景推演：一个温度传感器断线（开路，读数 −50 °c 非法值） 硬件自检判断线 → 二级故障 → 该模组温度不可信 → 放电功率钳位至 40%（故障系数，示意）； 同时环境 −10 °c，sop 热降额允许 60 kw（示意）——两条限制取 min(40 kw, 60 kw) = 40 kw ； 用户地板电请求 90 kw → bms 应答可用功率 40 kw → vcu 按此限扭——仪表同步提示\"动力受限\"（体验闭环）。 恶化推演：同模组再断 2 个传感器 → 可信测温全失 测量不可信比单点故障严重：最热点温度完全盲区（ thm-01 ）→ 升三级：功率钳位至 10%（10 kw，示意）+ hud 请求靠边； 10 kw 仍可维持低速行驶（示意 20~30 km/h）—— 降级保留的不是性能，是\"能挪到安全地带\"的能力 ； 若此时再叠加\"单体过温四级\"（真实危险，不只是看不见）→ 断高压路径（flt-04），在已减速的时机断开，次生风险被前置的降级大幅压低—— 这就是\"降级为断高压争取非危险时机\"的设计思想 。 4. 工程实态 跛行模式的用户体验（限多少功率、能开多远、提示文案）是主机厂与电池厂联合定义的标定项； 退出常见两类：故障消失 + 观察窗自动恢复（可逆类）；下电重上电恢复（保守类）；安全相关不可逆故障必须检修（flt-02 恢复属性）； 整车级约束：bms 降级不得引发转向/制动助力等底盘功能意外失效——那是 vcu/底盘域的联动安全，bms 需提供\"我即将降级\"的前置通知； gb/t 38661-2020（s-03）对故障状态下的功能表现有要求（条款待核对）。 5. 常见误区 把降级当惩罚、越狠越安全——过度降级制造高速失速风险，反而引入新的危害； bms 悄悄限功率不通知 vcu/用户——状态机不匹配导致整车行为怪异，用户感知\"车抽风\"； 退出无迟滞无观察窗——故障闪变时功率跟着闪变，动力忽大忽小； 把正常 sop 降额显示成故障降级——冬天动力弱 ≠ 车坏了，语义混淆直接伤害售后分流（flt-06 误报工单）。 6. 自测 q1 ：为什么\"测量可信度丧失\"（传感器全断）比\"单点数值越限\"更严重？ q2 ：故障系数与 sop 为什么取 min 而不是相加/覆盖？ q3 ：为\"单体过温三级\"设计一个退出条件。 答案 q1：单点越限还能靠\"限到安全包络内\"兜底；测量全失意味着最热点是否危险 不可知 ——不可知比可知的危险更危险，只能按最坏假设钳到最低档并引导停车。 q2：两条限制是不同性质的约束（物理能力 vs 故障保守假设），任何一条都独立成立，能力取交集即 min。相加无物理意义；\"覆盖\"（故障系数直接顶掉 sop）会在故障系数宽于 sop 时放开物理限制——越权。 q3（示意答案）：单体最高温 &lt; 阈值 − 迟滞（如阈值 55 °c → &lt; 50 °c，示意）持续 5 min + 期间无新故障 + 温升速率正常（&lt; 2 k/min，示意）→ 退出三级、恢复至 sop 决定的功率；若短期内复发 → 升级处理（等级 +1，示意规则）。 来源 s-03：gb/t 38661-2020（故障状态下功能要求，条款细节待核对 → 文末） s-07：iso 26262:2018（安全状态过渡与降级作为中间安全态的框架） 本课功率/比例/时间均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 26262:2018 原文（s-07） a safe state / 降级过渡的框架依据 gb/t 38661-2020 原文（s-03） a bms 技术条件 [待补链] — 跛行模式（limp-home）整车标定公开资料（核实后补） 待核对项（本课） gb/t 38661-2020 故障降级相关条款 → 建议新 p 项 量产跛行模式功率比例与续驶能力的公开资料（40%/10 kw 均为示意） 降级退出观察窗的典型标定量级（5 min 为示意） "}, {"id": "FLT-04", "title": "课程 FLT-04：断高压与安全状态设计", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-04<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a>、<a class=\"xlink\" href=\"#/lesson/HV-04\">HV-04<\/a>、<a class=\"xlink\" href=\"#/lesson/FLT-01\">FLT-01<\/a> ｜ 预计用时 60 min 数字规则：文中所有时间/阈值数字均为<strong>教学示意值<\/strong>；绝缘阈值等以标准原文为准（待核对项见文末）。<\/p><\/blockquote>\n<h3>1. 为什么\"断开\"本身也是危险动作<\/h3>\n<p>断高压（contactor opening，接触器断开）是 BMS 手里最重的处理，但断开这个动作自带三种次生风险：<\/p>\n<ol>\n<li><strong>带载拉弧<\/strong>：大电流下触点分离产生电弧，烧蚀甚至熔焊触点——熔焊粘连后<strong>下次就再也断不开了<\/strong>（<a class=\"xlink\" href=\"#/lesson/HV-04\">HV-04<\/a> 检测的就是这个后遗症）；<\/li>\n<li><strong>行驶失电<\/strong>：高速中断动力本身就是整车级危害（HARA 视角，<a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a>）——断高压可能把电池风险换成交通事故风险；<\/li>\n<li><strong>低压连锁<\/strong>：断高压即断 DC/DC 输入，12 V 网失去充电来源——转向助力/灯光/解锁依赖 12 V 电池续命。<\/li>\n<p>所以本节点真正的问题是：<strong>什么条件下断、以什么顺序断、断成什么样算\"安全\"<\/strong>——安全状态（safe state）的设计。节点约束点题：需区分正常下电/故障下电；行驶中断高压需评估次生风险。<\/p>\n<\/ol>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）两条断开路径。<\/strong><\/p>\n<ul>\n<li><strong>正常下电<\/strong>：VCU 请求 → BMS 先降载至 0（等电流趋零）→ 断主正/主负 → 时序见 <a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a>；<\/li>\n<li><strong>故障下电<\/strong>：分级触发。时间充裕的（三级降级先行）尽量\"先降载再断\"；不可等的（碰撞、严重绝缘失效、热失控确认）立即断——<strong>接受带载拉弧的代价<\/strong>，因为继续带电的风险更大。<\/li>\n<p><strong>（2）断开执行与确认。<\/strong> 主正、主负分路独立驱动（<a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a>）；断开后用电压/粘连检测（HV-04/HV-03）确认\"真断开\"；断开状态入快照（<a class=\"xlink\" href=\"#/lesson/FLT-02\">FLT-02<\/a>）。<\/p>\n<p><strong>（3）安全状态（safe state）的要素。<\/strong> ISO 26262（S-07）框架下，safe state 是安全目标可达且可维持的状态。对高压电池通常意味着：回路断开且验证、无失控热风险、低压可维持、状态可被乘员与售后理解——断高压只是进入 safe state 的<strong>手段<\/strong>，不是 safe state 本身。<\/p>\n<p><strong>（4）决策树骨架（示意）。<\/strong><\/p>\n<p>``<code> 触发源？──碰撞信号 ──────────────→ 立即断（FTTI 毫秒~百毫秒级） ├─绝缘 &lt; 阈值 ─┬─停车/充电中 → 先请求降流至 0 再断 │              └─行驶中 → 限功率提示 + 按策略断（策略因厂而异） ├─热失控确认（THM-05 三级）→ 断 + 整车联动（报警/解锁/排烟） └─继电器控制失灵/过流 → 熔断器兜底（硬件路径，不依赖软件） <\/code>``<\/p>\n<\/ul>\n<h3>3. 工程案例：三个场景的决策推演（教学示意值）<\/h3>\n<p><strong>场景 A：停车充电中，绝缘电阻降到 80 Ω/V（示意；标准要求量级 100 Ω/V DC，待核对）。<\/strong><\/p>\n<p>非行驶 → 无失电风险 → 直接走断开流程；但断前先用 GB/T 27930（S-05）停机流程请求充电机降流至 0（中止充电报文时序）——<strong>避免带载拉弧<\/strong>。断开后停充状态锁存，维修前禁止再上高压。<\/p>\n<p><strong>场景 B：120 km/h 行驶中，热失控二级前兆（未确认）。<\/strong><\/p>\n<p>危险尚未确认、断电代价巨大 → 限功率 + 高级报警，请求靠边；升级为三级确认（THM-05 多信号交叉）→ 断 + 联动。<strong>\"行驶中要不要为未确认的威胁断电\"没有普适答案，是安全论证（SAFE-02/04）逐项目决定的权衡<\/strong>——这就是节点约束\"行驶中断高压需评估次生风险\"的含义。<\/p>\n<p><strong>场景 C：碰撞信号（气囊控制器广播）到达。<\/strong><\/p>\n<p>无条件立即断——事故后电池是二次伤害源（短路/漏电/起火）。断开执行链路时间预算：信号确认 + 逻辑判断（毫秒级）+ 接触器机械动作（10~30 ms，示意）→ <strong>百毫秒内完成<\/strong>（示意），与碰撞安全 FTTI 匹配。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>碰撞信号断高压是行业通用实践（工程共识）；断开指令有多重来源（BMS 逻辑、碰撞信号、人工维修开关 MSD、熔断器物理熔断）——<strong>软件失效有硬件兜底<\/strong>；<\/li>\n<li>断开后 12 V 电池接管低压（灯光/解锁/报警），DC/DC 停止工作；<\/li>\n<li>断高压事件必须落快照 + 云端事件包（<a class=\"xlink\" href=\"#/lesson/FLT-06\">FLT-06<\/a>）——这是售后归属判定（<a class=\"xlink\" href=\"#/lesson/FLT-05\">FLT-05<\/a>）的核心证据；<\/li>\n<li>粘连后的处理：检测告警 + 维修更换接触器，无法软件恢复（HV-04）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把断高压当万能解——行驶失电是新的危害源，断开时机要用 HARA 论证而不是\"越早越好\"；<\/li>\n<li>故障下电不先降载——继电器带载拉弧、粘连，把一次故障变成永久性硬件损坏；<\/li>\n<li>断开后不记录、不上传——售后面对\"黑箱\"，责任判定无从谈起；<\/li>\n<li>正常下电与故障下电共用慢时序——紧急路径必须最短（碰撞场景百毫秒级，示意）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么充电中的绝缘故障要\"先请求降流再断\"，而碰撞信号\"立即断\"？ <strong>Q2<\/strong>：行驶中收到未确认的热失控前兆，断还是不断？设计依据是什么？ <strong>Q3<\/strong>：断高压之后，车上还有哪些功能必须继续工作？靠什么供电？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：充电中时间不紧迫（无行驶风险），降流至 0 后断开可避免带载拉弧，保护继电器不粘连；碰撞时每毫秒都在增加二次伤害风险，且电流已不可控——立即断的收益远大于触点损耗，FTTI 也只允许立即断。<\/li>\n<li>Q2（示意答案）：不立即断——限功率 + 报警 + 请求靠边，同时加密监测；升级到确认（多信号交叉）再断。依据：断高压的次生风险（高速失电）与电池风险的期望损失比较，由 HARA/安全论证给出该项目阈值（SAFE-02/04），并保留乘员/人工断电入口。<\/li>\n<li>Q3：危险报警灯、门锁解锁、报警发声、（事故后）紧急呼叫——全部挂 12 V 低压网，由 12 V 电池供电（DC/DC 已随断高压停止）；所以低压电池的容量与状态也是安全链路的一部分。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020（整车安全要求，含绝缘电阻要求；具体数值待核对 → 文末）<\/li>\n<li>S-05：GB/T 27930（充电停机报文时序，BST/CST）<\/li>\n<li>S-07：ISO 26262:2018（safe state 与 FTTI 框架）<\/li>\n<li>S-01：GB 38031-2025（电池安全要求，P-05 待核对）<\/li>\n<li>场景推演全部为教学示意值；策略差异\"因厂而异\"为工程共识表述<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 原文（S-07）<\/td><td>A<\/td><td>safe state / FTTI 框架<\/td><\/tr><tr><td>GB 18384-2020 原文（S-04）<\/td><td>A<\/td><td>整车安全与绝缘要求<\/td><\/tr><tr><td>GB/T 27930 原文（S-05）<\/td><td>A<\/td><td>充电停机时序（BST/CST）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>碰撞信号断高压的法规条款出处（GB 18384 具体章节，核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB 18384-2020 绝缘电阻要求的具体数值与条款号（100 Ω/V DC 量级待核实）→ 建议新 P 项<\/li>\n<li>接触器机械动作时间典型规格（10~30 ms 为示意）<\/li>\n<li>碰撞信号→断开链路的 FTTI 典型分配（百毫秒级为示意）<\/li>\n<li>GB/T 27930 停机报文（BST/CST）时序细节（现行版本 → P-06）<\/li>\n<\/ul>", "text": " 对应节点 flt-04 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： hv-05 、 hv-04 、 flt-01 ｜ 预计用时 60 min 数字规则：文中所有时间/阈值数字均为 教学示意值 ；绝缘阈值等以标准原文为准（待核对项见文末）。 1. 为什么\"断开\"本身也是危险动作 断高压（contactor opening，接触器断开）是 bms 手里最重的处理，但断开这个动作自带三种次生风险： 带载拉弧 ：大电流下触点分离产生电弧，烧蚀甚至熔焊触点——熔焊粘连后 下次就再也断不开了 （ hv-04 检测的就是这个后遗症）； 行驶失电 ：高速中断动力本身就是整车级危害（hara 视角， safe-02 ）——断高压可能把电池风险换成交通事故风险； 低压连锁 ：断高压即断 dc/dc 输入，12 v 网失去充电来源——转向助力/灯光/解锁依赖 12 v 电池续命。 所以本节点真正的问题是： 什么条件下断、以什么顺序断、断成什么样算\"安全\" ——安全状态（safe state）的设计。节点约束点题：需区分正常下电/故障下电；行驶中断高压需评估次生风险。 2. 机制展开 （1）两条断开路径。 正常下电 ：vcu 请求 → bms 先降载至 0（等电流趋零）→ 断主正/主负 → 时序见 hv-05 ； 故障下电 ：分级触发。时间充裕的（三级降级先行）尽量\"先降载再断\"；不可等的（碰撞、严重绝缘失效、热失控确认）立即断—— 接受带载拉弧的代价 ，因为继续带电的风险更大。 （2）断开执行与确认。 主正、主负分路独立驱动（ hw-05 ）；断开后用电压/粘连检测（hv-04/hv-03）确认\"真断开\"；断开状态入快照（ flt-02 ）。 （3）安全状态（safe state）的要素。 iso 26262（s-07）框架下，safe state 是安全目标可达且可维持的状态。对高压电池通常意味着：回路断开且验证、无失控热风险、低压可维持、状态可被乘员与售后理解——断高压只是进入 safe state 的 手段 ，不是 safe state 本身。 （4）决策树骨架（示意）。 `` 触发源？──碰撞信号 ──────────────→ 立即断（ftti 毫秒~百毫秒级） ├─绝缘 &lt; 阈值 ─┬─停车/充电中 → 先请求降流至 0 再断 │ └─行驶中 → 限功率提示 + 按策略断（策略因厂而异） ├─热失控确认（thm-05 三级）→ 断 + 整车联动（报警/解锁/排烟） └─继电器控制失灵/过流 → 熔断器兜底（硬件路径，不依赖软件） `` 3. 工程案例：三个场景的决策推演（教学示意值） 场景 a：停车充电中，绝缘电阻降到 80 ω/v（示意；标准要求量级 100 ω/v dc，待核对）。 非行驶 → 无失电风险 → 直接走断开流程；但断前先用 gb/t 27930（s-05）停机流程请求充电机降流至 0（中止充电报文时序）—— 避免带载拉弧 。断开后停充状态锁存，维修前禁止再上高压。 场景 b：120 km/h 行驶中，热失控二级前兆（未确认）。 危险尚未确认、断电代价巨大 → 限功率 + 高级报警，请求靠边；升级为三级确认（thm-05 多信号交叉）→ 断 + 联动。 \"行驶中要不要为未确认的威胁断电\"没有普适答案，是安全论证（safe-02/04）逐项目决定的权衡 ——这就是节点约束\"行驶中断高压需评估次生风险\"的含义。 场景 c：碰撞信号（气囊控制器广播）到达。 无条件立即断——事故后电池是二次伤害源（短路/漏电/起火）。断开执行链路时间预算：信号确认 + 逻辑判断（毫秒级）+ 接触器机械动作（10~30 ms，示意）→ 百毫秒内完成 （示意），与碰撞安全 ftti 匹配。 4. 工程实态 碰撞信号断高压是行业通用实践（工程共识）；断开指令有多重来源（bms 逻辑、碰撞信号、人工维修开关 msd、熔断器物理熔断）—— 软件失效有硬件兜底 ； 断开后 12 v 电池接管低压（灯光/解锁/报警），dc/dc 停止工作； 断高压事件必须落快照 + 云端事件包（ flt-06 ）——这是售后归属判定（ flt-05 ）的核心证据； 粘连后的处理：检测告警 + 维修更换接触器，无法软件恢复（hv-04）。 5. 常见误区 把断高压当万能解——行驶失电是新的危害源，断开时机要用 hara 论证而不是\"越早越好\"； 故障下电不先降载——继电器带载拉弧、粘连，把一次故障变成永久性硬件损坏； 断开后不记录、不上传——售后面对\"黑箱\"，责任判定无从谈起； 正常下电与故障下电共用慢时序——紧急路径必须最短（碰撞场景百毫秒级，示意）。 6. 自测 q1 ：为什么充电中的绝缘故障要\"先请求降流再断\"，而碰撞信号\"立即断\"？ q2 ：行驶中收到未确认的热失控前兆，断还是不断？设计依据是什么？ q3 ：断高压之后，车上还有哪些功能必须继续工作？靠什么供电？ 答案 q1：充电中时间不紧迫（无行驶风险），降流至 0 后断开可避免带载拉弧，保护继电器不粘连；碰撞时每毫秒都在增加二次伤害风险，且电流已不可控——立即断的收益远大于触点损耗，ftti 也只允许立即断。 q2（示意答案）：不立即断——限功率 + 报警 + 请求靠边，同时加密监测；升级到确认（多信号交叉）再断。依据：断高压的次生风险（高速失电）与电池风险的期望损失比较，由 hara/安全论证给出该项目阈值（safe-02/04），并保留乘员/人工断电入口。 q3：危险报警灯、门锁解锁、报警发声、（事故后）紧急呼叫——全部挂 12 v 低压网，由 12 v 电池供电（dc/dc 已随断高压停止）；所以低压电池的容量与状态也是安全链路的一部分。 来源 s-04：gb 18384-2020（整车安全要求，含绝缘电阻要求；具体数值待核对 → 文末） s-05：gb/t 27930（充电停机报文时序，bst/cst） s-07：iso 26262:2018（safe state 与 ftti 框架） s-01：gb 38031-2025（电池安全要求，p-05 待核对） 场景推演全部为教学示意值；策略差异\"因厂而异\"为工程共识表述 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 26262:2018 原文（s-07） a safe state / ftti 框架 gb 18384-2020 原文（s-04） a 整车安全与绝缘要求 gb/t 27930 原文（s-05） a 充电停机时序（bst/cst） [待补链] — 碰撞信号断高压的法规条款出处（gb 18384 具体章节，核实后补） 待核对项（本课） gb 18384-2020 绝缘电阻要求的具体数值与条款号（100 ω/v dc 量级待核实）→ 建议新 p 项 接触器机械动作时间典型规格（10~30 ms 为示意） 碰撞信号→断开链路的 ftti 典型分配（百毫秒级为示意） gb/t 27930 停机报文（bst/cst）时序细节（现行版本 → p-06） "}, {"id": "FLT-05", "title": "课程 FLT-05：售后故障码归属判定", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-05<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/FLT-02\">FLT-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SYS-02\">SYS-02<\/a>、<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a> ｜ 预计用时 45 min 数字规则：文中案例数据均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么\"谁的责任\"是个工程问题<\/h3>\n<p>电动车质保体系里，电池包（电芯/包体）多由电池厂负责，整车集成与低压/热系统由主机厂负责——故障发生后\"谁买单、谁整改\"取决于责任在电池侧还是整车侧。节点约束点题：<strong>责任判定依赖故障码语义清晰度——电池厂 vs 主机厂边界的高发争议区<\/strong>。<\/p>\n<p>三个前置条件（缺一个就变成扯皮）：<\/p>\n<ol>\n<li><strong>边界事先写清<\/strong>：哪类故障归属谁，在双方接口协议/质量协议里预定义（SYS-02 的边界定义落到商务条款）；<\/li>\n<li><strong>语义事先对齐<\/strong>：DTC/DID 语义是双方合同（SW-05），不允许\"同一个码各解释各的\"；<\/li>\n<li><strong>证据事后可取<\/strong>：快照完整、时间轴可信、存储防篡改（FLT-02 + SW-07）。<\/li>\n<\/ol>\n<h3>2. 机制展开：判定链路与归属矩阵<\/h3>\n<p><strong>（1）判定链路。<\/strong><\/p>\n<p>``<code> 车端 DTC + 快照（FLT-02）→ 售后/远程读取（FLT-06） → 语义解释（DTC 手册：谁定义谁维护）→ 归属矩阵查表 → 结论：电池侧 / 整车侧 / 第三方（桩） → 争议时：黑匣子数据回放仲裁（SW-07 事故数据） <\/code>``<\/p>\n<p><strong>（2）典型归属矩阵（示意，真实矩阵在商务协议里）。<\/strong><\/p>\n<table><thead><tr><th>故障现象<\/th><th>表面 DTC<\/th><th>常见归属<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>单体压差大/容量跳水的电芯本体问题<\/td><td>单体过欠压、SOH 异常<\/td><td>电池侧<\/td><td>电芯制造/电化学<\/td><\/tr><tr><td>冷却液泄漏导致的高温故障<\/td><td>单体过温<\/td><td><strong>整车侧<\/strong>（热系统）<\/td><td>触发源在热回路<\/td><\/tr><tr><td>12 V 亏电导致 BMS 反复复位<\/td><td>通信丢失/自检失败<\/td><td>整车侧（低压系统）<\/td><td>供电根因<\/td><\/tr><tr><td>充电桩不执行降流请求<\/td><td>单体过压<\/td><td>第三方（桩）/协议执行<\/td><td>充电报文时序<\/td><\/tr><tr><td>标定错误导致的误保护<\/td><td>各类误报<\/td><td>开发方（多为主机厂）<\/td><td>标定数据<\/td><\/tr><\/tbody><\/table>\n<p><strong>关键认知：表面 DTC 的\"位置\"≠ 责任的\"根因\"。<\/strong> 单体过温的码在电池上，根因可能在整车冷却没跟上——这正是\"故障码语义清晰度\"决定判定质量的原因（节点约束原文）。<\/p>\n<p><strong>（3）证据三要素。<\/strong> 时间戳可信（全链路对齐 UTC，SW-07）；快照覆盖触发前后；存储防篡改（安全启动 + 记录签名，<a class=\"xlink\" href=\"#/lesson/SAFE-05\">SAFE-05<\/a> 视角）。<\/p>\n<h3>3. 工程案例推演：快充跳枪后无法上高压（教学示意值）<\/h3>\n<p><strong>现场<\/strong>：用户快充中\"跳枪\"（充电意外中止），仪表报动力电池故障，无法上电行驶。车辆拖回门店。<\/p>\n<p><strong>取证<\/strong>（按 FLT-02 纪律：读码 → 快照 → 扩展数据）：<\/p>\n<ul>\n<li>DTC-1：单体过压三级，快照：充电电流 180 A、最高单体 4.21 V（三元体系，示意）、BMS 已发出降流请求；<\/li>\n<li>DTC-2：BMS 与充电机通信超时，时间戳比 DTC-1 <strong>晚 2.3 s<\/strong>（示意）；<\/li>\n<li>充电机侧日志（桩运营方提供）：充电机称\"BMS 报文中止（BST）\"。<\/li>\n<p><strong>时间轴推演（归属判定的本质是时间轴取证）<\/strong>：<\/p>\n<li>若顺序为：过压发生 → BMS 请求降流 → 桩未执行/未收到 → 过压升级 → BMS 主动 BST 中止 → <strong>责任链指向桩侧<\/strong>（未按 GB/T 27930，S-05 响应降流请求），快照里的\"降流请求 + 桩侧确认\"报文是铁证；<\/li>\n<li>若顺序为：通信先超时（车端 OBC/线束问题）→ 桩按协议保护性中止 → 电压测量在通信中断期间异常 → <strong>责任链指向整车侧<\/strong>——判断关键变成\"通信超时的根因在车还是桩\"，需两侧报文对账；<\/li>\n<li>若 BMS 阈值标定错误（4.21 V 在该电芯规格内本不该报警，示意）→ <strong>开发责任<\/strong>——需要规格书对照（归属矩阵里最容易被遗忘的一类）。<\/li>\n<p>三种结局对应三个买单方——<strong>同一组故障码，证据的完整度决定结论<\/strong>。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>主机厂与电池厂通常设联合售后分析流程：远程初判（FLT-06）→ 拆解/数据回放 → 双方签认；<\/li>\n<li>责任矩阵条款化：接口协议/质量协议中预列\"故障类别 → 归属 → 赔付/整改\"（SYS-02 的商务落地）；<\/li>\n<li>OTA 类修复（标定）占比上升（趋势观点）：越来越多\"故障\"最终归类为软件问题，跨双方责任域；<\/li>\n<li>争议高发位：热系统交互故障（THM-03）、充电交互故障（CHG 域）、低压供电——都是\"码在电池、根因在整车\"的典型区。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>故障码在哪，责任就在哪——DTC 是症状不是根因（归属矩阵第二行）；<\/li>\n<li>只看当前 DTC 不看历史时序——先因后果颠倒（案例时间轴）；<\/li>\n<li>语义没对齐就签协议——争议时双方各执一份\"自己版本\"的 DTC 手册；<\/li>\n<li>快照环形缓冲覆盖了关键事件——高频低价值事件把关键快照冲掉（SW-07 的策略问题）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么说归属判定\"本质是时间轴取证问题\"？ <strong>Q2<\/strong>：单体过温故障码为什么可能归属整车侧？ <strong>Q3<\/strong>：为避免案例第三种结局（标定错误争议），开发阶段应该做什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：同一组故障码在不同触发顺序下对应完全不同的责任链（案例的三种结局）；只有可信时间戳 + 完整快照能把\"顺序\"钉死，否则判定退化为立场之争。<\/li>\n<li>Q2：触发源可能在外：冷却液泄漏/流量不足/水泵失效都会让电芯被动升温——码由 BMS 报出（它只看得见自己的温度），根因在整车热系统；判定要靠冷却液侧证据（水温、流量、泵状态快照）反推。<\/li>\n<li>Q3：①阈值/倍率地图等关键标定在双方联合评审下冻结并留档（版本可追溯）；②规格书边界与 BMS 阈值的裕度分析成文；③DTC 手册里给每码标注\"可能根因域\"——把归属预判写进语义合同（SW-05）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-05：GB/T 27930（充电通信协议与停机时序——桩侧责任判据）<\/li>\n<li>S-09：ISO 14229-1（取证读取服务：码/快照/扩展数据）<\/li>\n<li>S-19：T/CAAMTB 设计规范（若含售后/诊断条款，P-01 待核对）<\/li>\n<li>归属矩阵与案例数据均为教学示意值；责任划分本身是商务协议内容，非公开标准<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 14229-1 原文（S-09）<\/td><td>A<\/td><td>取证读取服务的标准文本<\/td><\/tr><tr><td>GB/T 27930 原文（S-05）<\/td><td>A<\/td><td>充电交互时序判据<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>电池质保责任划分的公开案例/白皮书（核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>T/CAAMTB 规范是否含售后诊断/归属条款（关联 P-01）<\/li>\n<li>行业\"责任矩阵\"的公开化程度（多为商务机密，公开案例稀少）→ 建议新 P 项<\/li>\n<li>OTA 修复在售后故障归因中占比的产业数据（趋势表述无定量来源）<\/li>\n<\/ul>", "text": " 对应节点 flt-05 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： flt-02 、 sys-02 、 sw-05 ｜ 预计用时 45 min 数字规则：文中案例数据均为 教学示意值 。 1. 为什么\"谁的责任\"是个工程问题 电动车质保体系里，电池包（电芯/包体）多由电池厂负责，整车集成与低压/热系统由主机厂负责——故障发生后\"谁买单、谁整改\"取决于责任在电池侧还是整车侧。节点约束点题： 责任判定依赖故障码语义清晰度——电池厂 vs 主机厂边界的高发争议区 。 三个前置条件（缺一个就变成扯皮）： 边界事先写清 ：哪类故障归属谁，在双方接口协议/质量协议里预定义（sys-02 的边界定义落到商务条款）； 语义事先对齐 ：dtc/did 语义是双方合同（sw-05），不允许\"同一个码各解释各的\"； 证据事后可取 ：快照完整、时间轴可信、存储防篡改（flt-02 + sw-07）。 2. 机制展开：判定链路与归属矩阵 （1）判定链路。 `` 车端 dtc + 快照（flt-02）→ 售后/远程读取（flt-06） → 语义解释（dtc 手册：谁定义谁维护）→ 归属矩阵查表 → 结论：电池侧 / 整车侧 / 第三方（桩） → 争议时：黑匣子数据回放仲裁（sw-07 事故数据） `` （2）典型归属矩阵（示意，真实矩阵在商务协议里）。 故障现象 表面 dtc 常见归属 依据 单体压差大/容量跳水的电芯本体问题 单体过欠压、soh 异常 电池侧 电芯制造/电化学 冷却液泄漏导致的高温故障 单体过温 整车侧 （热系统） 触发源在热回路 12 v 亏电导致 bms 反复复位 通信丢失/自检失败 整车侧（低压系统） 供电根因 充电桩不执行降流请求 单体过压 第三方（桩）/协议执行 充电报文时序 标定错误导致的误保护 各类误报 开发方（多为主机厂） 标定数据 关键认知：表面 dtc 的\"位置\"≠ 责任的\"根因\"。 单体过温的码在电池上，根因可能在整车冷却没跟上——这正是\"故障码语义清晰度\"决定判定质量的原因（节点约束原文）。 （3）证据三要素。 时间戳可信（全链路对齐 utc，sw-07）；快照覆盖触发前后；存储防篡改（安全启动 + 记录签名， safe-05 视角）。 3. 工程案例推演：快充跳枪后无法上高压（教学示意值） 现场 ：用户快充中\"跳枪\"（充电意外中止），仪表报动力电池故障，无法上电行驶。车辆拖回门店。 取证 （按 flt-02 纪律：读码 → 快照 → 扩展数据）： dtc-1：单体过压三级，快照：充电电流 180 a、最高单体 4.21 v（三元体系，示意）、bms 已发出降流请求； dtc-2：bms 与充电机通信超时，时间戳比 dtc-1 晚 2.3 s （示意）； 充电机侧日志（桩运营方提供）：充电机称\"bms 报文中止（bst）\"。 时间轴推演（归属判定的本质是时间轴取证） ： 若顺序为：过压发生 → bms 请求降流 → 桩未执行/未收到 → 过压升级 → bms 主动 bst 中止 → 责任链指向桩侧 （未按 gb/t 27930，s-05 响应降流请求），快照里的\"降流请求 + 桩侧确认\"报文是铁证； 若顺序为：通信先超时（车端 obc/线束问题）→ 桩按协议保护性中止 → 电压测量在通信中断期间异常 → 责任链指向整车侧 ——判断关键变成\"通信超时的根因在车还是桩\"，需两侧报文对账； 若 bms 阈值标定错误（4.21 v 在该电芯规格内本不该报警，示意）→ 开发责任 ——需要规格书对照（归属矩阵里最容易被遗忘的一类）。 三种结局对应三个买单方—— 同一组故障码，证据的完整度决定结论 。 4. 工程实态 主机厂与电池厂通常设联合售后分析流程：远程初判（flt-06）→ 拆解/数据回放 → 双方签认； 责任矩阵条款化：接口协议/质量协议中预列\"故障类别 → 归属 → 赔付/整改\"（sys-02 的商务落地）； ota 类修复（标定）占比上升（趋势观点）：越来越多\"故障\"最终归类为软件问题，跨双方责任域； 争议高发位：热系统交互故障（thm-03）、充电交互故障（chg 域）、低压供电——都是\"码在电池、根因在整车\"的典型区。 5. 常见误区 故障码在哪，责任就在哪——dtc 是症状不是根因（归属矩阵第二行）； 只看当前 dtc 不看历史时序——先因后果颠倒（案例时间轴）； 语义没对齐就签协议——争议时双方各执一份\"自己版本\"的 dtc 手册； 快照环形缓冲覆盖了关键事件——高频低价值事件把关键快照冲掉（sw-07 的策略问题）。 6. 自测 q1 ：为什么说归属判定\"本质是时间轴取证问题\"？ q2 ：单体过温故障码为什么可能归属整车侧？ q3 ：为避免案例第三种结局（标定错误争议），开发阶段应该做什么？ 答案 q1：同一组故障码在不同触发顺序下对应完全不同的责任链（案例的三种结局）；只有可信时间戳 + 完整快照能把\"顺序\"钉死，否则判定退化为立场之争。 q2：触发源可能在外：冷却液泄漏/流量不足/水泵失效都会让电芯被动升温——码由 bms 报出（它只看得见自己的温度），根因在整车热系统；判定要靠冷却液侧证据（水温、流量、泵状态快照）反推。 q3：①阈值/倍率地图等关键标定在双方联合评审下冻结并留档（版本可追溯）；②规格书边界与 bms 阈值的裕度分析成文；③dtc 手册里给每码标注\"可能根因域\"——把归属预判写进语义合同（sw-05）。 来源 s-05：gb/t 27930（充电通信协议与停机时序——桩侧责任判据） s-09：iso 14229-1（取证读取服务：码/快照/扩展数据） s-19：t/caamtb 设计规范（若含售后/诊断条款，p-01 待核对） 归属矩阵与案例数据均为教学示意值；责任划分本身是商务协议内容，非公开标准 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 14229-1 原文（s-09） a 取证读取服务的标准文本 gb/t 27930 原文（s-05） a 充电交互时序判据 [待补链] — 电池质保责任划分的公开案例/白皮书（核实后补） 待核对项（本课） t/caamtb 规范是否含售后诊断/归属条款（关联 p-01） 行业\"责任矩阵\"的公开化程度（多为商务机密，公开案例稀少）→ 建议新 p 项 ota 修复在售后故障归因中占比的产业数据（趋势表述无定量来源） "}, {"id": "FLT-06", "title": "课程 FLT-06：远程诊断与云端故障库", "dom": "FLT", "verified": false, "html": "<blockquote><p>对应节点 <code>FLT-06<\/code>（../domains/09-故障处理.md <span class=\"fileref\">（项目文件 ../domains/09-故障处理.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SW-07\">SW-07<\/a>、<a class=\"xlink\" href=\"#/lesson/FLT-02\">FLT-02<\/a> ｜ 预计用时 45 min 数字规则：文中所有成本/比例数字均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么车端\"看见\"的不够<\/h3>\n<p>车端只看到自己的症状，云端看到整个车队：<\/p>\n<ol>\n<li><strong>群体视角<\/strong>：同一 DTC 在 10 万辆车里出现率多少、是否集中在某批次/某低温区间——单车视角永远看不见批次性问题；<\/li>\n<li><strong>前兆知识<\/strong>：某故障发生前 48 h 常有\"电压离散度缓慢上升\"之类的可测前兆——群体数据才养得出这种规律；<\/li>\n<li><strong>处置闭环<\/strong>：云端判断 → 推送建议/预约工单/OTA 修复（<a class=\"xlink\" href=\"#/lesson/SW-06\">SW-06<\/a>）→ 用复发率验证修复效果。<\/li>\n<p>节点约束点题：可提升诊断率但需数据合规；误报工单成本高。两句合起来就是本课主线：<strong>云端的价值 = 用群体数据换诊断率与工单成本，代价是合规与误报治理。<\/strong><\/p>\n<\/ol>\n<h3>2. 机制展开：链路、知识库与误报治理<\/h3>\n<p><strong>（1）链路（与 SW-07 共用底座）。<\/strong><\/p>\n<p>``<code> 车端事件包（DTC+快照，FLT-02）→ T-Box 上传（事件优先于周期数据） → 云端接收/清洗/去重 → 规则引擎 + 故障知识库 → 工单生成 / 用户推送 / 召回决策 <\/code>``<\/p>\n<p><strong>（2）故障知识库的要素<\/strong>（每条记录，示意结构）：DTC 语义、出现频次与聚集维度（批次/地域/温度/工况）、前置征兆信号模式、处置建议（自查步骤/可否 OTA/是否进店）、归属提示（电池侧 vs 整车侧，<a class=\"xlink\" href=\"#/lesson/FLT-05\">FLT-05<\/a>）、修复版本与复发率。<\/p>\n<p><strong>（3）群体分析三个维度<\/strong>：时间聚集（某周爆发 → 查版本/供应链变更）、条件聚集（低温+快充聚集 → 热管理问题，THM-04）、模式聚集（不同 DTC 同现 → 共性根因）。<\/p>\n<p><strong>（4）误报治理：云端二次确认。<\/strong> 车端触发 ≠ 工单：云端用多信号交叉（该 DTC 的快照是否与已知真故障模式匹配）+ 群体先验（同条件正常车辆是否也报）做二次过滤，按置信度分级处置——高置信才生成工单，中置信进观察名单，低置信只入库积累。<\/p>\n<p><strong>（5）合规红线<\/strong>。位置与身份脱敏、数据最小化、用户授权同意（示意原则）；链路安全框架 ISO/SAE 21434（S-08）与 UN R155（S-14）——安全与合规是上线前提不是附录。<\/p>\n<h3>3. 手算实例：误报工单成本账（教学示意值）<\/h3>\n<p><strong>背景<\/strong>：保有量 10 万辆；某二级故障（如\"绝缘阻值偏低预警\"）车端触发率 1%，其中误报占 80%（示意——车端为保安全宁可误报）。<\/p>\n<ul>\n<li><strong>无云端过滤<\/strong>：1000 辆触发 → 全部生成工单 → 误报 800 个 × 单次上门成本 200 元（示意）= <strong>16 万元<\/strong>纯浪费，外加 800 个用户被折腾一次；<\/li>\n<li><strong>有云端二次确认<\/strong>（交叉验证绝缘监测一致性 + 同工况群体对比，示意）：过滤后工单 200 个、误报率降到 10% → 无效工单 20 个 × 200 元 = <strong>0.4 万元<\/strong>——成本差 40 倍；<\/li>\n<li>结论：<strong>云端二次确认不是\"锦上添花\"，是工单经济学的主开关<\/strong>——但过滤规则本身要持续迭代，规则太紧会漏掉真故障（漏报的代价是安全，比误报贵得多，方向不能摆反）。<\/li>\n<p><strong>第二笔账：知识库的帕累托结构<\/strong>。季度上报 5 万条 DTC（示意），去重后独立模式 300 种；Top 20 模式占报告量 70%（示意）→ 知识库先把 Top 20 写透（前兆 + 处置 + 归属），即可分流大部分进店需求——<strong>知识库建设按\"报告量\"排序，不按工程师兴趣排序<\/strong>。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>电池云是厂商后市场服务的标准配置：LG Energy Solution 的 B-Lifecare/B.once 等电池云服务矩阵（S-20，产品现状 P-03 待核对）；<\/li>\n<li>AI/数字孪生在云侧诊断是当前产业与文献热点（S-21 SAE 论文、S-22 Frontiers 综述、S-23 MDPI 论文——引用需保留不确定性：多为方案与展望，量产效果证据有限）；<\/li>\n<li>云端诊断 → OTA 修复 → 复发率验证的闭环成型（SW-06 / S-15 UN R156 管理体系）；<\/li>\n<li>云端只做监控与分析：<strong>控制闭环必须留在车端<\/strong>（链路秒~分钟级且不可靠，SW-07 带宽账）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把云端当\"实时 BMS\"——延迟与可靠性都不允许，远程只能建议不能接管控制；<\/li>\n<li>全量上传——带宽、存储、合规三重不可行（SW-07 预算是纪律）；<\/li>\n<li>误报不治理——\"狼来了\"效应：用户与门店对预警脱敏，真预警反而被忽视；<\/li>\n<li>云端知识库与车端 DTC 语义脱节——云端按旧版手册解释新版车端码，结论系统性错误（SW-05 语义合同同样约束云）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：车端为安全\"宁可误报\"与云端\"过滤误报\"矛盾吗？各自的目标函数是什么？ <strong>Q2<\/strong>：为什么\"前兆规律\"必须在云端养，车端养不出来？ <strong>Q3<\/strong>：设计云端三档置信度的处置动作（高/中/低）。<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：不矛盾，是分工。车端目标函数是\"漏报成本 ≫ 误报成本\"（安全优先，本地无群体信息可参考）；云端目标函数是\"在安全兜底前提下最小化工单成本与用户打扰\"（有群体先验与历史模式可参考）。两端用不同信息量做不同决策。<\/li>\n<li>Q2：前兆 = \"故障发生前的信号模式\"，需要大量\"后来真发生了故障\"的样本回溯——单车一辈子只遇到几次故障；云端汇聚数万辆的发生样本与海量正常运行基线，才能统计出可区分的前兆模式。<\/li>\n<li>Q3（示意答案）：高置信（匹配已知真故障模式 + 群体异常）→ 立即生成工单 + 主动联系用户 + 必要时给出功能限制建议；中置信 → 观察名单，加密上报频率，一段时间无恶化自动降档；低置信 → 只入库积累，不打扰任何一方。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-20：LG Energy Solution 电池云服务官方资料（厂商案例，P-03 待核对）<\/li>\n<li>S-21 / S-22 / S-23：AI/数字孪生 BMS 的会议与期刊文献（趋势引用，证据强度有限）<\/li>\n<li>S-08 / S-14：ISO/SAE 21434、UN R155（数据链路安全框架）<\/li>\n<li>S-15：UN R156（OTA 管理体系，处置闭环）<\/li>\n<li>本课全部成本/比例/条数为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>COVESA Vehicle Signal Specification（VSS）<\/td><td>B<\/td><td>知名开源车辆信号规范（车云数据语义的公共参考）<\/td><\/tr><tr><td>Eclipse KUKSA 开源项目<\/td><td>B<\/td><td>知名开源车云数据框架（COVESA）<\/td><\/tr><tr><td>Uptane（OTA 安全框架）<\/td><td>B<\/td><td>知名开源标准（衔接 SW-06 的 OTA 安全）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>电池云诊断的公开白皮书（厂商资料核实后补）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>LG ES 云服务产品矩阵现状（→ 已有 P-03）<\/li>\n<li>S-21/S-22/S-23 中\"云端诊断提升诊断率\"的定量证据（提升幅度无公开可靠数字）→ 建议新 P 项<\/li>\n<li>误报率与工单成本的行业基准值（本课 1%/80%/200 元均为示意）<\/li>\n<li>车辆数据合规的具体法规清单（个保法/GDPR 等适用条款，超本课范围待立项）<\/li>\n<\/ul>", "text": " 对应节点 flt-06 （../domains/09-故障处理.md （项目文件 ../domains/09-故障处理.md） ）｜ 前置： sw-07 、 flt-02 ｜ 预计用时 45 min 数字规则：文中所有成本/比例数字均为 教学示意值 。 1. 为什么车端\"看见\"的不够 车端只看到自己的症状，云端看到整个车队： 群体视角 ：同一 dtc 在 10 万辆车里出现率多少、是否集中在某批次/某低温区间——单车视角永远看不见批次性问题； 前兆知识 ：某故障发生前 48 h 常有\"电压离散度缓慢上升\"之类的可测前兆——群体数据才养得出这种规律； 处置闭环 ：云端判断 → 推送建议/预约工单/ota 修复（ sw-06 ）→ 用复发率验证修复效果。 节点约束点题：可提升诊断率但需数据合规；误报工单成本高。两句合起来就是本课主线： 云端的价值 = 用群体数据换诊断率与工单成本，代价是合规与误报治理。 2. 机制展开：链路、知识库与误报治理 （1）链路（与 sw-07 共用底座）。 `` 车端事件包（dtc+快照，flt-02）→ t-box 上传（事件优先于周期数据） → 云端接收/清洗/去重 → 规则引擎 + 故障知识库 → 工单生成 / 用户推送 / 召回决策 `` （2）故障知识库的要素 （每条记录，示意结构）：dtc 语义、出现频次与聚集维度（批次/地域/温度/工况）、前置征兆信号模式、处置建议（自查步骤/可否 ota/是否进店）、归属提示（电池侧 vs 整车侧， flt-05 ）、修复版本与复发率。 （3）群体分析三个维度 ：时间聚集（某周爆发 → 查版本/供应链变更）、条件聚集（低温+快充聚集 → 热管理问题，thm-04）、模式聚集（不同 dtc 同现 → 共性根因）。 （4）误报治理：云端二次确认。 车端触发 ≠ 工单：云端用多信号交叉（该 dtc 的快照是否与已知真故障模式匹配）+ 群体先验（同条件正常车辆是否也报）做二次过滤，按置信度分级处置——高置信才生成工单，中置信进观察名单，低置信只入库积累。 （5）合规红线 。位置与身份脱敏、数据最小化、用户授权同意（示意原则）；链路安全框架 iso/sae 21434（s-08）与 un r155（s-14）——安全与合规是上线前提不是附录。 3. 手算实例：误报工单成本账（教学示意值） 背景 ：保有量 10 万辆；某二级故障（如\"绝缘阻值偏低预警\"）车端触发率 1%，其中误报占 80%（示意——车端为保安全宁可误报）。 无云端过滤 ：1000 辆触发 → 全部生成工单 → 误报 800 个 × 单次上门成本 200 元（示意）= 16 万元 纯浪费，外加 800 个用户被折腾一次； 有云端二次确认 （交叉验证绝缘监测一致性 + 同工况群体对比，示意）：过滤后工单 200 个、误报率降到 10% → 无效工单 20 个 × 200 元 = 0.4 万元 ——成本差 40 倍； 结论： 云端二次确认不是\"锦上添花\"，是工单经济学的主开关 ——但过滤规则本身要持续迭代，规则太紧会漏掉真故障（漏报的代价是安全，比误报贵得多，方向不能摆反）。 第二笔账：知识库的帕累托结构 。季度上报 5 万条 dtc（示意），去重后独立模式 300 种；top 20 模式占报告量 70%（示意）→ 知识库先把 top 20 写透（前兆 + 处置 + 归属），即可分流大部分进店需求—— 知识库建设按\"报告量\"排序，不按工程师兴趣排序 。 4. 工程实态 电池云是厂商后市场服务的标准配置：lg energy solution 的 b-lifecare/b.once 等电池云服务矩阵（s-20，产品现状 p-03 待核对）； ai/数字孪生在云侧诊断是当前产业与文献热点（s-21 sae 论文、s-22 frontiers 综述、s-23 mdpi 论文——引用需保留不确定性：多为方案与展望，量产效果证据有限）； 云端诊断 → ota 修复 → 复发率验证的闭环成型（sw-06 / s-15 un r156 管理体系）； 云端只做监控与分析： 控制闭环必须留在车端 （链路秒~分钟级且不可靠，sw-07 带宽账）。 5. 常见误区 把云端当\"实时 bms\"——延迟与可靠性都不允许，远程只能建议不能接管控制； 全量上传——带宽、存储、合规三重不可行（sw-07 预算是纪律）； 误报不治理——\"狼来了\"效应：用户与门店对预警脱敏，真预警反而被忽视； 云端知识库与车端 dtc 语义脱节——云端按旧版手册解释新版车端码，结论系统性错误（sw-05 语义合同同样约束云）。 6. 自测 q1 ：车端为安全\"宁可误报\"与云端\"过滤误报\"矛盾吗？各自的目标函数是什么？ q2 ：为什么\"前兆规律\"必须在云端养，车端养不出来？ q3 ：设计云端三档置信度的处置动作（高/中/低）。 答案 q1：不矛盾，是分工。车端目标函数是\"漏报成本 ≫ 误报成本\"（安全优先，本地无群体信息可参考）；云端目标函数是\"在安全兜底前提下最小化工单成本与用户打扰\"（有群体先验与历史模式可参考）。两端用不同信息量做不同决策。 q2：前兆 = \"故障发生前的信号模式\"，需要大量\"后来真发生了故障\"的样本回溯——单车一辈子只遇到几次故障；云端汇聚数万辆的发生样本与海量正常运行基线，才能统计出可区分的前兆模式。 q3（示意答案）：高置信（匹配已知真故障模式 + 群体异常）→ 立即生成工单 + 主动联系用户 + 必要时给出功能限制建议；中置信 → 观察名单，加密上报频率，一段时间无恶化自动降档；低置信 → 只入库积累，不打扰任何一方。 来源 s-20：lg energy solution 电池云服务官方资料（厂商案例，p-03 待核对） s-21 / s-22 / s-23：ai/数字孪生 bms 的会议与期刊文献（趋势引用，证据强度有限） s-08 / s-14：iso/sae 21434、un r155（数据链路安全框架） s-15：un r156（ota 管理体系，处置闭环） 本课全部成本/比例/条数为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 covesa vehicle signal specification（vss） b 知名开源车辆信号规范（车云数据语义的公共参考） eclipse kuksa 开源项目 b 知名开源车云数据框架（covesa） uptane（ota 安全框架） b 知名开源标准（衔接 sw-06 的 ota 安全） [待补链] — 电池云诊断的公开白皮书（厂商资料核实后补） 待核对项（本课） lg es 云服务产品矩阵现状（→ 已有 p-03） s-21/s-22/s-23 中\"云端诊断提升诊断率\"的定量证据（提升幅度无公开可靠数字）→ 建议新 p 项 误报率与工单成本的行业基准值（本课 1%/80%/200 元均为示意） 车辆数据合规的具体法规清单（个保法/gdpr 等适用条款，超本课范围待立项） "}, {"id": "GEN-1", "title": "课程 GEN-1：传统车载 BMS——一切都在车上闭环", "dom": "GEN", "verified": false, "html": "<blockquote><p>对应节点 <code>GEN-1<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>ARCH-MS<\/code>（建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要\"代际\"这个视角<\/h3>\n<p>同一个 BMS，放在 2012 年和 2026 年，功能清单可能一样，但<strong>能力边界完全不同<\/strong>——差别不在功能，而在\"算力在哪里、数据通向哪里、多快能变好\"。代际维度（GEN-1/2/3）就是给这个演进画刻度：<\/p>\n<p>GEN-1（传统车载，On-board Standalone BMS）：全部功能本地闭环的代际形态（domain 定义）——采集、估计、保护、充电通信全在车上，车外没有任何东西参与运行。<\/p>\n<p>先刻好 GEN-1 这条基线，才谈得上 GEN-2 加了什么、GEN-3 还想加什么。<\/p>\n<h3>2. 机制：GEN-1 的四个特征与三个天花板<\/h3>\n<h4>2.1 特征<\/h4>\n<ol>\n<li><strong>本地闭环<\/strong>：安全监控 → 保护 → 断高压，全在车端毫秒~百毫秒内完成（GB/T 38661 对 BMS 功能与精度的框架，S-03）；<\/li>\n<li><strong>算力受限<\/strong>：车规 MCU 算力与内存受限（domain 约束；主频百 MHz 级、Flash 数 MB 量级为教学示意值）——算法选型受此硬约束；<\/li>\n<li><strong>无远程更新<\/strong>：标定固化在出厂状态，改标定 = 到店刷写（OTA 演进见 <code>SW-06<\/code>）；<\/li>\n<li><strong>数据不出车<\/strong>：运行数据只进本地记录器（事故回读用），无远程分析。<\/li>\n<\/ol>\n<h4>2.2 天花板<\/h4>\n<ol>\n<li><strong>精度天花板<\/strong>：算法只能用\"这辆车\"的数据，SOC/SOH 误差无法用车队数据系统性修正；<\/li>\n<li><strong>迭代天花板<\/strong>：发现问题 → 改软件 → 召回或到店刷写，周期以月计；<\/li>\n<li><strong>认知天花板<\/strong>：单一老化样本无法区分\"电芯个体差异\"与\"批次缺陷\"。<\/li>\n<\/ol>\n<h3>3. 工程案例：一桩 SOC 漂移投诉的两种结局（推演）<\/h3>\n<p>场景（教学示意值场景）：某 LFP（磷酸铁锂）车型，用户反映仪表 SOC 在中段\"跳变\"（机理见 <code>ALG-01<\/code>：平台段无 OCV 校正锚点）。<\/p>\n<ul>\n<li><strong>GEN-1 结局<\/strong>：4S 店检测 → 按 TSB（Technical Service Bulletin，技术服务公报）流程到店刷写或换件；其他用户继续遭遇同样问题，直到下一次召回。修复周期：月级。<\/li>\n<li><strong>GEN-2 结局（对照）<\/strong>：云端发现该批次/该工况组合的共性漂移 → 数据定位根因 → OTA 推送修正后的校正策略。修复周期：天~周级。<\/li>\n<p><strong>结论<\/strong>：两种代际的\"车内算法\"可能一模一样；差距全在数据闭环与更新通道——这正是代际的定义变量。<\/p>\n<\/ul>\n<table><thead><tr><th>能力<\/th><th>GEN-1<\/th><th>GEN-2（对照）<\/th><\/tr><\/thead><tbody><tr><td>安全闭环<\/td><td>本地<\/td><td>本地（不变）<\/td><\/tr><tr><td>数据<\/td><td>出车即断<\/td><td>车队级回流<\/td><\/tr><tr><td>更新通道<\/td><td>到店刷写<\/td><td>OTA（UN R156 合规）<\/td><\/tr><tr><td>SOC 精度演进<\/td><td>随老化漂移<\/td><td>云端参数持续修正<\/td><\/tr><tr><td>售后根因分析<\/td><td>逐车排查<\/td><td>车队聚类定位<\/td><\/tr><\/tbody><\/table>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>GEN-1 至今不是\"落后\"代名词：<strong>所有代际的安全闭环都必须本地完成<\/strong>，GEN-1 形态是地基（观点级）。<\/li>\n<li>存量与低价车型仍大量是 GEN-1 形态（观点级）。<\/li>\n<li>国内对新能源车的远程监控有标准要求（GB/T 32960 系列《电动汽车远程服务与管理系统》，版本细节待核对）：严格说接入监控的车型已在\"数据\"维度脱离纯 GEN-1，但监控上传 ≠ 云端辅助控制——代际判定看的是<strong>运行时谁参与决策<\/strong>。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"GEN-1 = 落后淘汰\"——安全闭环本地化是所有代际的共同地基；断网时 GEN-3 也要退回 GEN-1 行为。<\/li>\n<li>\"没有云端就做不了 SOC\"——GEN-1 的安时积分 + OCV 校正（<code>ALG-01<\/code>）至今仍是主力算法，云端只是让它\"变得更好\"。<\/li>\n<li>把\"有 T-Box 上传数据\"的车都叫 GEN-2——上传只是数据管道；GEN-2 的判据是<strong>云端产物是否参与改进车端运行<\/strong>。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：GEN-1 的三个天花板分别卡住了什么？ <strong>Q2<\/strong>：为什么说\"断网时 GEN-3 也要退回 GEN-1 行为\"？ <strong>Q3<\/strong>：一辆装了 T-Box、每分钟上传车辆状态，但没有 OTA 通道、云端也不做分析的车——按本课判据它是 GEN-1 还是 GEN-2？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：精度（只有本车数据）、迭代（刷写以月计）、认知（无车队对照，难分个体差异与批次缺陷）。<\/li>\n<li>Q2：安全闭环从不依赖云端；断网剪断的是\"增强项\"（参数更新、远程分析），车端退化为纯本地闭环——即 GEN-1 行为。<\/li>\n<li>Q3：本质仍是 GEN-1 形态 + 法规要求的远程监控管道：云端不产生改进产物、无 OTA，运行时仍是纯本地决策（按本课判据，教学示意值场景）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》<\/li>\n<li>S-01 / S-02：GB 38031-2025 / 2020（安全要求基线）<\/li>\n<li>S-05：GB/T 27930（充电通信——GEN-1 时代即有的车外通信，但仍是点对点协议，非云端参与）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I/II, Artech House, 2015<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 标准原文<\/td><td>国家标准<\/td><td>[待补链]<\/td><\/tr><tr><td>GB/T 32960 系列《电动汽车远程服务与管理系统》（版本待核对）<\/td><td>国家标准<\/td><td>[待补链]<\/td><\/tr><tr><td>G. Plett, <em>Battery Management Systems<\/em> Vol. II, Artech House, 2015<\/td><td>经典教材<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 32960 系列的现行版本与适用范围（上传内容/频次的具体规定）。<\/li>\n<li>车规 MCU 主频/存储量级（百 MHz/数 MB）为教学示意值，待 <code>HW-02<\/code> 课程细化引用。<\/li>\n<li>\"低价车型仍大量是 GEN-1 形态\"的行业口径来源。<\/li>\n<\/ul>", "text": " 对应节点 gen-1 （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： arch-ms （建议先读）｜ 预计用时 30 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要\"代际\"这个视角 同一个 bms，放在 2012 年和 2026 年，功能清单可能一样，但 能力边界完全不同 ——差别不在功能，而在\"算力在哪里、数据通向哪里、多快能变好\"。代际维度（gen-1/2/3）就是给这个演进画刻度： gen-1（传统车载，on-board standalone bms）：全部功能本地闭环的代际形态（domain 定义）——采集、估计、保护、充电通信全在车上，车外没有任何东西参与运行。 先刻好 gen-1 这条基线，才谈得上 gen-2 加了什么、gen-3 还想加什么。 2. 机制：gen-1 的四个特征与三个天花板 2.1 特征 本地闭环 ：安全监控 → 保护 → 断高压，全在车端毫秒~百毫秒内完成（gb/t 38661 对 bms 功能与精度的框架，s-03）； 算力受限 ：车规 mcu 算力与内存受限（domain 约束；主频百 mhz 级、flash 数 mb 量级为教学示意值）——算法选型受此硬约束； 无远程更新 ：标定固化在出厂状态，改标定 = 到店刷写（ota 演进见 sw-06 ）； 数据不出车 ：运行数据只进本地记录器（事故回读用），无远程分析。 2.2 天花板 精度天花板 ：算法只能用\"这辆车\"的数据，soc/soh 误差无法用车队数据系统性修正； 迭代天花板 ：发现问题 → 改软件 → 召回或到店刷写，周期以月计； 认知天花板 ：单一老化样本无法区分\"电芯个体差异\"与\"批次缺陷\"。 3. 工程案例：一桩 soc 漂移投诉的两种结局（推演） 场景（教学示意值场景）：某 lfp（磷酸铁锂）车型，用户反映仪表 soc 在中段\"跳变\"（机理见 alg-01 ：平台段无 ocv 校正锚点）。 gen-1 结局 ：4s 店检测 → 按 tsb（technical service bulletin，技术服务公报）流程到店刷写或换件；其他用户继续遭遇同样问题，直到下一次召回。修复周期：月级。 gen-2 结局（对照） ：云端发现该批次/该工况组合的共性漂移 → 数据定位根因 → ota 推送修正后的校正策略。修复周期：天~周级。 结论 ：两种代际的\"车内算法\"可能一模一样；差距全在数据闭环与更新通道——这正是代际的定义变量。 能力 gen-1 gen-2（对照） 安全闭环 本地 本地（不变） 数据 出车即断 车队级回流 更新通道 到店刷写 ota（un r156 合规） soc 精度演进 随老化漂移 云端参数持续修正 售后根因分析 逐车排查 车队聚类定位 4. 工程实态 gen-1 至今不是\"落后\"代名词： 所有代际的安全闭环都必须本地完成 ，gen-1 形态是地基（观点级）。 存量与低价车型仍大量是 gen-1 形态（观点级）。 国内对新能源车的远程监控有标准要求（gb/t 32960 系列《电动汽车远程服务与管理系统》，版本细节待核对）：严格说接入监控的车型已在\"数据\"维度脱离纯 gen-1，但监控上传 ≠ 云端辅助控制——代际判定看的是 运行时谁参与决策 。 5. 常见误区 \"gen-1 = 落后淘汰\"——安全闭环本地化是所有代际的共同地基；断网时 gen-3 也要退回 gen-1 行为。 \"没有云端就做不了 soc\"——gen-1 的安时积分 + ocv 校正（ alg-01 ）至今仍是主力算法，云端只是让它\"变得更好\"。 把\"有 t-box 上传数据\"的车都叫 gen-2——上传只是数据管道；gen-2 的判据是 云端产物是否参与改进车端运行 。 6. 自测 q1 ：gen-1 的三个天花板分别卡住了什么？ q2 ：为什么说\"断网时 gen-3 也要退回 gen-1 行为\"？ q3 ：一辆装了 t-box、每分钟上传车辆状态，但没有 ota 通道、云端也不做分析的车——按本课判据它是 gen-1 还是 gen-2？ 答案 q1：精度（只有本车数据）、迭代（刷写以月计）、认知（无车队对照，难分个体差异与批次缺陷）。 q2：安全闭环从不依赖云端；断网剪断的是\"增强项\"（参数更新、远程分析），车端退化为纯本地闭环——即 gen-1 行为。 q3：本质仍是 gen-1 形态 + 法规要求的远程监控管道：云端不产生改进产物、无 ota，运行时仍是纯本地决策（按本课判据，教学示意值场景）。 来源 s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》 s-01 / s-02：gb 38031-2025 / 2020（安全要求基线） s-05：gb/t 27930（充电通信——gen-1 时代即有的车外通信，但仍是点对点协议，非云端参与） s-16：g. plett, battery management systems vol. i/ii, artech house, 2015 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 gb/t 38661-2020 标准原文 国家标准 [待补链] gb/t 32960 系列《电动汽车远程服务与管理系统》（版本待核对） 国家标准 [待补链] g. plett, battery management systems vol. ii, artech house, 2015 经典教材 [待补链] 待核对项（本课） gb/t 32960 系列的现行版本与适用范围（上传内容/频次的具体规定）。 车规 mcu 主频/存储量级（百 mhz/数 mb）为教学示意值，待 hw-02 课程细化引用。 \"低价车型仍大量是 gen-1 形态\"的行业口径来源。 "}, {"id": "GEN-2", "title": "课程 GEN-2：云端辅助 BMS——车端保命，云端进步", "dom": "GEN", "verified": false, "html": "<blockquote><p>对应节点 <code>GEN-2<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>）｜ 前置：<code>GEN-1<\/code>、<code>ARCH-CE<\/code>（建议先读）｜ 预计用时 35 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：让每辆车\"吃\"到车队的经验<\/h3>\n<p>GEN-1 的三大天花板（精度/迭代/认知）有一个共同解：把车队数据回流、把云端算力引入，让车端算法\"持续变好\"。GEN-2（云端辅助，Cloud-assisted BMS）的定义：<strong>车端控制为主，云端提供诊断/标定/模型更新<\/strong>（domain 定义）。<\/p>\n<p>关键词是\"辅助\"：云端改进车端，但绝不替代车端的安全决策——这是 GEN-2 与\"云控\"的分界线，也是功能安全底线。<\/p>\n<h3>2. 机制：云端的三类产物与一条铁律<\/h3>\n<h4>2.1 三类产物<\/h4>\n<ol>\n<li><strong>诊断类<\/strong>：SOH 趋势、故障根因聚类、批次质量监控（数据方法谱系见 S-28/S-29）；<\/li>\n<li><strong>标定类<\/strong>：参数包（OCV 表、容量、保护阈值边界内的优化），经 OTA 下发（<code>SW-06<\/code>）；<\/li>\n<li><strong>模型类<\/strong>：修正后的模型参数/轻度模型更新——注意：影响安全行为的更新一律按软件升级管理（UN R156，S-15）。<\/li>\n<\/ol>\n<h4>2.2 一条铁律：断网功能完整<\/h4>\n<p>domain 约束：断网时功能必须完整。GEN-2 的合格判据：<strong>拔掉网线，安全功能一个不少，降级的只是\"变好的速度\"<\/strong>。<\/p>\n<h4>2.3 合规双翼<\/h4>\n<ul>\n<li>软件更新：UN R156（SWUP，S-15）——云端产物下发必须走管理体系；<\/li>\n<li>数据安全：UN R155 / ISO/SAE 21434（S-14/S-08）+ 数据主权与隐私（domain 约束）。<\/li>\n<\/ul>\n<h3>3. 工程案例：断网场景下的功能降级推演（核心案例）<\/h3>\n<p>场景：车辆进入长时间无网环境（地下车库/远程山区），车端有 4G 模组但失联 48 h（教学示意值场景）。逐功能推演：<\/p>\n<table><thead><tr><th>功能<\/th><th>在网表现<\/th><th>断网 48 h 表现<\/th><th>降级原因<\/th><\/tr><\/thead><tbody><tr><td>SOC/续驶显示<\/td><td>本地估计 + 云端参数定期修正<\/td><td>本地估计照常，参数停更<\/td><td>精度演进暂停（非失效）<\/td><\/tr><tr><td>充电控制<\/td><td>本地闭环 + 云端策略优化<\/td><td>本地闭环完整<\/td><td>云端优化缺位<\/td><\/tr><tr><td>热管理<\/td><td>本地控制<\/td><td>完整<\/td><td>无<\/td><\/tr><tr><td>故障保护/断高压<\/td><td>本地闭环<\/td><td>完整，毫秒级不变<\/td><td>无<\/td><\/tr><tr><td>故障报警<\/td><td>本地报警 + 远程通知<\/td><td>本地报警正常，远程通知缺位<\/td><td>链路依赖项<\/td><\/tr><tr><td>云端 SOH 更新<\/td><td>周期更新<\/td><td>暂停，用最近一次有效值<\/td><td>链路依赖项<\/td><\/tr><tr><td>OTA<\/td><td>后台下载安装<\/td><td>暂停（恢复后续传）<\/td><td>链路依赖项<\/td><\/tr><tr><td>远程诊断/查看<\/td><td>可用<\/td><td>不可用<\/td><td>纯云端功能<\/td><\/tr><\/tbody><\/table>\n<p><strong>推演结论<\/strong>：降级集中在三类——\"精度增强、远程服务、模型更新\"；安全闭环零降级。设计验收时可按此表逐格测试（观点级方法）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>当前量产头部车型的普遍形态（观点级）：电池数据上云 + OTA + 云端诊断已商品化。<\/li>\n<li>商业样本：LG 后市场服务矩阵（S-20，细节待 P-03）；主机厂自建电池云为主流（观点级）。<\/li>\n<li>上云数据范围是\"法规 × 用户授权 × 流量成本\"的交集，各家口径不同（观点级）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"云端辅助 = 云端控制\"——云端只产出\"建议/参数/模型\"，执行与安全判断永远在车端。<\/li>\n<li>\"断网 = 功能残废\"——正确的验收口径是\"安全功能完整、增强项暂停\"。<\/li>\n<li>\"云端 SOH 比车端准，车端直接用就行\"——云端结论下发即软件/标定变更，须走 UN R156 流程与车端验证，不能旁路（S-15）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：用\"一条铁律\"复述 GEN-2 的验收标准。 <strong>Q2<\/strong>：云端识别出某批次电芯容量衰减偏快，到\"用户车端用上修正后的容量\"之间要经过哪些环节？ <strong>Q3<\/strong>：断网期间发生的故障，事后云端还能分析吗？靠什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：拔掉网线，安全功能一个不少；降级的只是\"变好的速度\"——增强项暂停，安全闭环完整。<\/li>\n<li>Q2：云端数据印证 → 形成参数包 → UN R156 管理体系评审（S-15）→ OTA 签名下发 → 车端验证与版本管理 → 生效。任一环节断开则不生效。<\/li>\n<li>Q3：能。车端数据记录功能（<code>SW-07<\/code> 类）本地缓存事件与摘要，恢复联网后补传——\"断网不丢数据\"是云边协同设计的默认要求（推论级，工程实态口径）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-15：UN R156（软件升级管理体系）<\/li>\n<li>S-14 / S-08：UN R155 / ISO/SAE 21434（网络安全与数据安全工程）<\/li>\n<li>S-20：LG Energy Solution 后市场服务矩阵（细节待核对 P-03）<\/li>\n<li>S-28 / S-29：云端 SOH 与数据分析方法综述<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>UN R156 法规原文<\/td><td>UN 法规<\/td><td>[待补链]<\/td><\/tr><tr><td>UN R155 法规原文<\/td><td>UN 法规<\/td><td>[待补链]<\/td><\/tr><tr><td>ISO/SAE 21434:2021 标准原文<\/td><td>国际标准<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>\"断网 48 h\"推演为教学示意场景，无对应标准测试工况（是否应纳入 DEV 验证体系待讨论）。<\/li>\n<li>国内《汽车数据安全管理若干规定（试行）》的适用条款与本架构的对应关系（核对后回填）。<\/li>\n<li>LG 服务矩阵细节与现状（P-03）。<\/li>\n<\/ul>", "text": " 对应节点 gen-2 （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ）｜ 前置： gen-1 、 arch-ce （建议先读）｜ 预计用时 35 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：让每辆车\"吃\"到车队的经验 gen-1 的三大天花板（精度/迭代/认知）有一个共同解：把车队数据回流、把云端算力引入，让车端算法\"持续变好\"。gen-2（云端辅助，cloud-assisted bms）的定义： 车端控制为主，云端提供诊断/标定/模型更新 （domain 定义）。 关键词是\"辅助\"：云端改进车端，但绝不替代车端的安全决策——这是 gen-2 与\"云控\"的分界线，也是功能安全底线。 2. 机制：云端的三类产物与一条铁律 2.1 三类产物 诊断类 ：soh 趋势、故障根因聚类、批次质量监控（数据方法谱系见 s-28/s-29）； 标定类 ：参数包（ocv 表、容量、保护阈值边界内的优化），经 ota 下发（ sw-06 ）； 模型类 ：修正后的模型参数/轻度模型更新——注意：影响安全行为的更新一律按软件升级管理（un r156，s-15）。 2.2 一条铁律：断网功能完整 domain 约束：断网时功能必须完整。gen-2 的合格判据： 拔掉网线，安全功能一个不少，降级的只是\"变好的速度\" 。 2.3 合规双翼 软件更新：un r156（swup，s-15）——云端产物下发必须走管理体系； 数据安全：un r155 / iso/sae 21434（s-14/s-08）+ 数据主权与隐私（domain 约束）。 3. 工程案例：断网场景下的功能降级推演（核心案例） 场景：车辆进入长时间无网环境（地下车库/远程山区），车端有 4g 模组但失联 48 h（教学示意值场景）。逐功能推演： 功能 在网表现 断网 48 h 表现 降级原因 soc/续驶显示 本地估计 + 云端参数定期修正 本地估计照常，参数停更 精度演进暂停（非失效） 充电控制 本地闭环 + 云端策略优化 本地闭环完整 云端优化缺位 热管理 本地控制 完整 无 故障保护/断高压 本地闭环 完整，毫秒级不变 无 故障报警 本地报警 + 远程通知 本地报警正常，远程通知缺位 链路依赖项 云端 soh 更新 周期更新 暂停，用最近一次有效值 链路依赖项 ota 后台下载安装 暂停（恢复后续传） 链路依赖项 远程诊断/查看 可用 不可用 纯云端功能 推演结论 ：降级集中在三类——\"精度增强、远程服务、模型更新\"；安全闭环零降级。设计验收时可按此表逐格测试（观点级方法）。 4. 工程实态 当前量产头部车型的普遍形态（观点级）：电池数据上云 + ota + 云端诊断已商品化。 商业样本：lg 后市场服务矩阵（s-20，细节待 p-03）；主机厂自建电池云为主流（观点级）。 上云数据范围是\"法规 × 用户授权 × 流量成本\"的交集，各家口径不同（观点级）。 5. 常见误区 \"云端辅助 = 云端控制\"——云端只产出\"建议/参数/模型\"，执行与安全判断永远在车端。 \"断网 = 功能残废\"——正确的验收口径是\"安全功能完整、增强项暂停\"。 \"云端 soh 比车端准，车端直接用就行\"——云端结论下发即软件/标定变更，须走 un r156 流程与车端验证，不能旁路（s-15）。 6. 自测 q1 ：用\"一条铁律\"复述 gen-2 的验收标准。 q2 ：云端识别出某批次电芯容量衰减偏快，到\"用户车端用上修正后的容量\"之间要经过哪些环节？ q3 ：断网期间发生的故障，事后云端还能分析吗？靠什么？ 答案 q1：拔掉网线，安全功能一个不少；降级的只是\"变好的速度\"——增强项暂停，安全闭环完整。 q2：云端数据印证 → 形成参数包 → un r156 管理体系评审（s-15）→ ota 签名下发 → 车端验证与版本管理 → 生效。任一环节断开则不生效。 q3：能。车端数据记录功能（ sw-07 类）本地缓存事件与摘要，恢复联网后补传——\"断网不丢数据\"是云边协同设计的默认要求（推论级，工程实态口径）。 来源 s-15：un r156（软件升级管理体系） s-14 / s-08：un r155 / iso/sae 21434（网络安全与数据安全工程） s-20：lg energy solution 后市场服务矩阵（细节待核对 p-03） s-28 / s-29：云端 soh 与数据分析方法综述 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 un r156 法规原文 un 法规 [待补链] un r155 法规原文 un 法规 [待补链] iso/sae 21434:2021 标准原文 国际标准 [待补链] 待核对项（本课） \"断网 48 h\"推演为教学示意场景，无对应标准测试工况（是否应纳入 dev 验证体系待讨论）。 国内《汽车数据安全管理若干规定（试行）》的适用条款与本架构的对应关系（核对后回填）。 lg 服务矩阵细节与现状（p-03）。 "}, {"id": "GEN-3", "title": "课程 GEN-3：AI/数字孪生预测型 BMS——从\"看仪表\"到\"看模型\"", "dom": "GEN", "verified": false, "html": "<blockquote><p>对应节点 <code>GEN-3<\/code>（../domains/00-跨域层-架构与代际.md <span class=\"fileref\">（项目文件 ../domains/00-跨域层-架构与代际.md）<\/span>，⚠️前沿，约束未收敛）｜ 前置：<code>GEN-2<\/code>、<code>SAFE-06<\/code>（AI 安全论证）建议先读 ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为<strong>教学示意值<\/strong>，用于建立量级直觉，不是实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要：GEN-2 还不够\"向前看\"<\/h3>\n<p>GEN-2 让车端持续变好，但本质是<strong>回头看<\/strong>：分析已发生的数据，修正参数。GEN-3（AI/数字孪生预测型 BMS）要<strong>向前看<\/strong>：以高保真数字模型 + AI 在线推断驱动预测性管理（domain 定义）——预测老化轨迹（RUL，Remaining Useful Life，剩余使用寿命）、预演充电策略的后果、提前发现热风险。<\/p>\n<p>先把标签打清楚：本节点是 <code>frontier<\/code>，工程化约束（模型保真度指标、认证路径）尚未收敛（候选证据 S-21/S-22/S-23，待 P-11 全文核对）——本课一半讲已有共识，一半讲还在打架的东西。<\/p>\n<h3>2. 机制：数字孪生到底\"孪生\"什么<\/h3>\n<h4>2.1 定义边界<\/h4>\n<p>数字孪生（Digital Twin）≠ 3D 可视化，也 ≠ 仿真模型本身。孪生强调<strong>模型与物理实体的持续数据耦合<\/strong>：车端实测不断校准云端模型，云端模型反哺车端决策。缺了这两个\"持续\"，就只是模型或大屏。<\/p>\n<h4>2.2 车云算力分配（核心表，教学示意值）<\/h4>\n<table><thead><tr><th>任务<\/th><th>执行位置<\/th><th>时延要求<\/th><th>算力量级（示意）<\/th><th>更新周期<\/th><\/tr><\/thead><tbody><tr><td>实时 SOC/SOP 估计<\/td><td>车端 MCU<\/td><td>10~100 ms<\/td><td>10~100 MIPS 级<\/td><td>常驻<\/td><\/tr><tr><td>热失控预警特征提取<\/td><td>车端<\/td><td>1 s 级<\/td><td>100 MIPS~1 GOPS 级<\/td><td>常驻<\/td><\/tr><tr><td>轻量孪生观测器（参数自适应）<\/td><td>车端 SoC<\/td><td>1 s~min<\/td><td>GOPS 级<\/td><td>常驻<\/td><\/tr><tr><td>单体级高保真电化学仿真<\/td><td>云端<\/td><td>分钟~小时<\/td><td>云 CPU/GPU<\/td><td>天<\/td><\/tr><tr><td>车队级老化轨迹/RUL 预测<\/td><td>云端<\/td><td>小时级<\/td><td>云 GPU 集群<\/td><td>周<\/td><\/tr><tr><td>充电策略 what-if 预演<\/td><td>云端<\/td><td>分钟级<\/td><td>云 CPU<\/td><td>按需<\/td><\/tr><tr><td>模型/参数 OTA 下发<\/td><td>云→车<\/td><td>—<\/td><td>—<\/td><td>月级<\/td><\/tr><\/tbody><\/table>\n<p>判据与 <code>ARCH-CE<\/code> 一致：安全闭环留车端；孪生的\"预测产物\"经验证后以参数/策略形式回车端。<\/p>\n<h4>2.3 认证难题（前沿的核心）<\/h4>\n<p>AI 模型的非确定性输出与传统功能安全的确定性要求相冲突：可解释性与认证路径未收敛（S-21/S-22/S-23；当前应对框架见 <code>SAFE-06<\/code> 的 AI 安全论证）。另注意：BMW 电池工厂（2026-07-30）是<strong>制造侧<\/strong>数字孪生案例，与\"车端运行侧\"孪生是两回事，勿混引（domain 关联，细节见 radar/2026-11-04.md）。<\/p>\n<h3>3. 工程案例：一条\"预测型\"功能链的推演<\/h3>\n<p>功能：低温快充析锂风险预测（析锂机理见 <code>CHG-03<\/code>）。五步走：<\/p>\n<ol>\n<li><strong>车端<\/strong>：低温充电时上传极化电压特征摘要（教学示意值场景）；<\/li>\n<li><strong>云端<\/strong>：车队孪生仿真发现某批次在 -10℃ 快充末端析锂风险概率升高（<strong>模型结论，非实测<\/strong>）；<\/li>\n<li><strong>云端<\/strong>：what-if 预演\"末端电流降 20%\"（示意）对充电时长与风险的影响；<\/li>\n<li><strong>下发<\/strong>：策略参数经 UN R156 流程 OTA（S-15）；<\/li>\n<li><strong>车端<\/strong>：按新参数收紧末端电流——安全执行仍在本地闭环。<\/li>\n<p><strong>证据等级标注<\/strong>：第 1、4、5 步是量产已具备的能力（GEN-2 范畴）；第 2、3 步依赖高保真孪生，属前沿能力（S-21/S-22/S-23 口径待核对）。厂商\"数字孪生延长寿命 20~40%\"类宣传未经验证（P-12），本课不采信。<\/p>\n<\/ol>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li><strong>已量产<\/strong>：车队级数据分析、数据驱动的 SOH/RUL 估计（方法综述 S-28/S-29）。<\/li>\n<li><strong>前沿<\/strong>：在线高保真孪生、AI 直接参与运行决策——尚无收敛的量产与认证范式（观点级，待 S-21/22/23 核对）。<\/li>\n<li>EU InnoBMS 项目（CORDIS 101137975）提出 situationally aware BMS（情境感知 BMS）方向（S-25，项目范围待 P-09 核对）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"数字孪生 = 3D 大屏\"——没有持续数据耦合与决策回路的可视化不是孪生。<\/li>\n<li>\"AI 直接控制继电器\"——前沿范式也把 AI 限定在预测与策略层，安全执行仍是确定性机制（<code>SAFE-06<\/code> 框架）。<\/li>\n<li>把厂商宣传数字当实测结论——\"延长寿命 20~40%\"无一手来源（P-12），引用前必须追溯。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：用\"两个持续\"概括数字孪生与普通仿真模型的区别。 <strong>Q2<\/strong>：为什么 RUL 预测放云端、热失控预警放车端？用两个判据回答。 <strong>Q3<\/strong>：云端孪生预测到析锂风险后，为什么不能直接把\"降低充电功率上限\"写进车端保护逻辑？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：持续数据耦合（物理 → 模型不断校准）+ 持续决策回路（模型 → 物理反哺决策）；缺任一个就只是模型或可视化。<\/li>\n<li>Q2：时延判据（预警是秒级以下安全闭环 vs RUL 是周/月级慢变量）+ 失效后果判据（人身安全 vs 经济性）——安全闭环必须留车端（ARCH-CE 判据）。<\/li>\n<li>Q3：可以改，但必须经 UN R156 流程与车端验证后才能生效（S-15）——直接旁路写入等于未认证的软件变更；且预测是概率性结论，转为确定性保护逻辑前需 AI 安全论证（<code>SAFE-06<\/code>）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-21：SAE 技术论文 2026-26-0382（全文待 P-11 核对）<\/li>\n<li>S
