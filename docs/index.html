-22：Frontiers 数字孪生综述（DOI 见来源登记表）<\/li>\n<li>S-23：MDPI《Batteries》AI/数字孪生综述（卷期待核对；引用注意期刊声誉争议）<\/li>\n<li>S-25：EU InnoBMS 项目（CORDIS 101137975，待 P-09 核对）<\/li>\n<li>S-28 / S-29：SOH/RUL 数据驱动方法综述<\/li>\n<li>S-15：UN R156（软件升级管理体系）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em> Vol. I/II, Artech House, 2015（模型方法地基）<\/li>\n<\/ul>\n<h3>延伸资源（本课未联网核实链接，仅列经典来源名称）<\/h3>\n<table><thead><tr><th>资源<\/th><th>类型<\/th><th>链接<\/th><\/tr><\/thead><tbody><tr><td>SAE 2026-26-0382《Transforming Battery Management: Role of AI/ML and Digital Twin Technologies》<\/td><td>会议论文（S-21）<\/td><td>[待补链]<\/td><\/tr><tr><td>Frontiers in Batteries and Electrochemistry 数字孪生综述（S-22）<\/td><td>期刊综述<\/td><td>[待补链]<\/td><\/tr><tr><td>G. Plett, <em>Battery Management Systems<\/em> Vol. I, Artech House, 2015<\/td><td>经典教材<\/td><td>[待补链]<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>S-21/S-22/S-23 全文蒸馏后回填工程化约束（P-11）：模型保真度指标、车云算力分配实测口径、认证路径。<\/li>\n<li>车端/云端算力量级（MIPS/GOPS/云 GPU）全部为教学示意值，无公开基准。<\/li>\n<li>BMW 电池工厂数字孪生（2026-07-30）细节，及\"制造侧 vs 运行侧\"的区分表述（见 radar/2026-11-04.md）。<\/li>\n<li>\"数字孪生延长寿命 20~40%\"（P-12）证据状态。<\/li>\n<\/ul>", "text": " 对应节点 gen-3 （../domains/00-跨域层-架构与代际.md （项目文件 ../domains/00-跨域层-架构与代际.md） ，⚠️前沿，约束未收敛）｜ 前置： gen-2 、 safe-06 （ai 安全论证）建议先读 ｜ 预计用时 40 min 数字规则：文中所有具体数字凡未挂标准/论文者均为 教学示意值 ，用于建立量级直觉，不是实测数据。 1. 为什么需要：gen-2 还不够\"向前看\" gen-2 让车端持续变好，但本质是 回头看 ：分析已发生的数据，修正参数。gen-3（ai/数字孪生预测型 bms）要 向前看 ：以高保真数字模型 + ai 在线推断驱动预测性管理（domain 定义）——预测老化轨迹（rul，remaining useful life，剩余使用寿命）、预演充电策略的后果、提前发现热风险。 先把标签打清楚：本节点是 frontier ，工程化约束（模型保真度指标、认证路径）尚未收敛（候选证据 s-21/s-22/s-23，待 p-11 全文核对）——本课一半讲已有共识，一半讲还在打架的东西。 2. 机制：数字孪生到底\"孪生\"什么 2.1 定义边界 数字孪生（digital twin）≠ 3d 可视化，也 ≠ 仿真模型本身。孪生强调 模型与物理实体的持续数据耦合 ：车端实测不断校准云端模型，云端模型反哺车端决策。缺了这两个\"持续\"，就只是模型或大屏。 2.2 车云算力分配（核心表，教学示意值） 任务 执行位置 时延要求 算力量级（示意） 更新周期 实时 soc/sop 估计 车端 mcu 10~100 ms 10~100 mips 级 常驻 热失控预警特征提取 车端 1 s 级 100 mips~1 gops 级 常驻 轻量孪生观测器（参数自适应） 车端 soc 1 s~min gops 级 常驻 单体级高保真电化学仿真 云端 分钟~小时 云 cpu/gpu 天 车队级老化轨迹/rul 预测 云端 小时级 云 gpu 集群 周 充电策略 what-if 预演 云端 分钟级 云 cpu 按需 模型/参数 ota 下发 云→车 — — 月级 判据与 arch-ce 一致：安全闭环留车端；孪生的\"预测产物\"经验证后以参数/策略形式回车端。 2.3 认证难题（前沿的核心） ai 模型的非确定性输出与传统功能安全的确定性要求相冲突：可解释性与认证路径未收敛（s-21/s-22/s-23；当前应对框架见 safe-06 的 ai 安全论证）。另注意：bmw 电池工厂（2026-07-30）是 制造侧 数字孪生案例，与\"车端运行侧\"孪生是两回事，勿混引（domain 关联，细节见 radar/2026-11-04.md）。 3. 工程案例：一条\"预测型\"功能链的推演 功能：低温快充析锂风险预测（析锂机理见 chg-03 ）。五步走： 车端 ：低温充电时上传极化电压特征摘要（教学示意值场景）； 云端 ：车队孪生仿真发现某批次在 -10℃ 快充末端析锂风险概率升高（ 模型结论，非实测 ）； 云端 ：what-if 预演\"末端电流降 20%\"（示意）对充电时长与风险的影响； 下发 ：策略参数经 un r156 流程 ota（s-15）； 车端 ：按新参数收紧末端电流——安全执行仍在本地闭环。 证据等级标注 ：第 1、4、5 步是量产已具备的能力（gen-2 范畴）；第 2、3 步依赖高保真孪生，属前沿能力（s-21/s-22/s-23 口径待核对）。厂商\"数字孪生延长寿命 20~40%\"类宣传未经验证（p-12），本课不采信。 4. 工程实态 已量产 ：车队级数据分析、数据驱动的 soh/rul 估计（方法综述 s-28/s-29）。 前沿 ：在线高保真孪生、ai 直接参与运行决策——尚无收敛的量产与认证范式（观点级，待 s-21/22/23 核对）。 eu innobms 项目（cordis 101137975）提出 situationally aware bms（情境感知 bms）方向（s-25，项目范围待 p-09 核对）。 5. 常见误区 \"数字孪生 = 3d 大屏\"——没有持续数据耦合与决策回路的可视化不是孪生。 \"ai 直接控制继电器\"——前沿范式也把 ai 限定在预测与策略层，安全执行仍是确定性机制（ safe-06 框架）。 把厂商宣传数字当实测结论——\"延长寿命 20~40%\"无一手来源（p-12），引用前必须追溯。 6. 自测 q1 ：用\"两个持续\"概括数字孪生与普通仿真模型的区别。 q2 ：为什么 rul 预测放云端、热失控预警放车端？用两个判据回答。 q3 ：云端孪生预测到析锂风险后，为什么不能直接把\"降低充电功率上限\"写进车端保护逻辑？ 答案 q1：持续数据耦合（物理 → 模型不断校准）+ 持续决策回路（模型 → 物理反哺决策）；缺任一个就只是模型或可视化。 q2：时延判据（预警是秒级以下安全闭环 vs rul 是周/月级慢变量）+ 失效后果判据（人身安全 vs 经济性）——安全闭环必须留车端（arch-ce 判据）。 q3：可以改，但必须经 un r156 流程与车端验证后才能生效（s-15）——直接旁路写入等于未认证的软件变更；且预测是概率性结论，转为确定性保护逻辑前需 ai 安全论证（ safe-06 ）。 来源 s-21：sae 技术论文 2026-26-0382（全文待 p-11 核对） s-22：frontiers 数字孪生综述（doi 见来源登记表） s-23：mdpi《batteries》ai/数字孪生综述（卷期待核对；引用注意期刊声誉争议） s-25：eu innobms 项目（cordis 101137975，待 p-09 核对） s-28 / s-29：soh/rul 数据驱动方法综述 s-15：un r156（软件升级管理体系） s-16：g. plett, battery management systems vol. i/ii, artech house, 2015（模型方法地基） 延伸资源（本课未联网核实链接，仅列经典来源名称） 资源 类型 链接 sae 2026-26-0382《transforming battery management: role of ai/ml and digital twin technologies》 会议论文（s-21） [待补链] frontiers in batteries and electrochemistry 数字孪生综述（s-22） 期刊综述 [待补链] g. plett, battery management systems vol. i, artech house, 2015 经典教材 [待补链] 待核对项（本课） s-21/s-22/s-23 全文蒸馏后回填工程化约束（p-11）：模型保真度指标、车云算力分配实测口径、认证路径。 车端/云端算力量级（mips/gops/云 gpu）全部为教学示意值，无公开基准。 bmw 电池工厂数字孪生（2026-07-30）细节，及\"制造侧 vs 运行侧\"的区分表述（见 radar/2026-11-04.md）。 \"数字孪生延长寿命 20~40%\"（p-12）证据状态。 "}, {"id": "HV-01", "title": "课程 HV-01：高压互锁（HVIL）", "dom": "HV", "verified": false, "html": "<blockquote><p>对应节点 <code>HV-01<\/code>（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a> ｜ 预计用时 30 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>，判定阈值须以整车企标与 GB 18384（S-04）条款为准。<\/p><\/blockquote>\n<h3>1. 为什么需要 HVIL<\/h3>\n<p>绝缘监测（<a class=\"xlink\" href=\"#/lesson/HV-03\">HV-03<\/a>）盯的是\"高压对车壳漏不漏电\"；HVIL（High Voltage Interlock Loop，高压互锁回路）盯的是另一件事：<strong>高压回路上的连接器还完整吗？<\/strong><\/p>\n<p>高压连接器在碰撞、维修、振动老化中可能松脱或被人为拔开。带载拔插直流高压会拉电弧——伤人、起火、烧端子。HVIL 的工程目标一句话：<strong>在人的手碰到高压端子之前，让系统先断电<\/strong>。节点约束点题：需覆盖所有可分离连接；故障响应需先于人员接触风险。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）原理<\/strong>：一条低压小电流信号回路，串联穿过所有可分离高压连接器的辅助引脚（interlock pin）与维修开关（MSD，Manual Service Disconnect）。任何一处断开 → 回路电流消失 → BMS/VCU 判定\"高压连接完整性丢失\"。<\/p>\n<p><strong>（2）两种主流实现<\/strong>（示意分类）：<\/p>\n<ul>\n<li><strong>模拟电流环<\/strong>：恒流源驱动 + 回路端电压采样，电阻预算见手算实例；<\/li>\n<li><strong>数字式互锁<\/strong>：各连接器串入带地址的从机芯片，逐个应答——天然防\"短接旁路\"误判，还能定位断点，成本更高。<\/li>\n<p><strong>（3）必须检测的四类状态<\/strong>：正常、断路（最典型）、对电源短路、对地短路。只判断路的 HVIL 会被一根短接线骗过。<\/p>\n<p><strong>（4）响应分级<\/strong>（先快后缓）：检测到断开 → 毫秒级请求断开继电器（带载分断有电弧代价，需与 <a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a> 时序协调）→ 禁止再上电 → 记 DTC。碰撞类硬线信号优先级高于任何总线命令。<\/p>\n<\/ul>\n<h3>3. 手算实例：HVIL 回路电阻预算<\/h3>\n<p>恒流源 I = 5 mA（教学示意值），设计要求：四种状态在端电压上必须可区分。<\/p>\n<p>回路组成（示意选型）：<\/p>\n<ul>\n<li>采样电阻 R_sense = 100 Ω；<\/li>\n<li>线束：0.5 mm² 铜线总长 20 m，电阻 = 1.72e-8 × 20 / 5e-7 ≈ <strong>0.69 Ω<\/strong>；<\/li>\n<li>10 个连接器辅助触点，每个接触电阻 ≤50 mΩ → 0.5 Ω；<\/li>\n<li>回路总电阻 ≈ <strong>101.2 Ω<\/strong> → 正常端电压 V = 5 mA × 101.2 Ω ≈ <strong>0.51 V<\/strong>。<\/li>\n<p>判定窗口（示意）：<\/p>\n<\/ul>\n<table><thead><tr><th>状态<\/th><th>端电压特征<\/th><th>判定<\/th><\/tr><\/thead><tbody><tr><td>正常<\/td><td>≈0.51 V<\/td><td>通过<\/td><\/tr><tr><td>断路<\/td><td>恒流源钳位到上限（如 5 V）<\/td><td>HVIL 断开<\/td><\/tr><tr><td>对 12 V 短路<\/td><td>远超正常窗口/超量程<\/td><td>HVIL 故障<\/td><\/tr><tr><td>对地短路<\/td><td>&lt;0.1 V<\/td><td>HVIL 故障<\/td><\/tr><\/tbody><\/table>\n<p>工程余量核对：铜的温度系数约 +0.4%/K（物理常数量级），60 K 温漂 → 线阻增加约 0.16 Ω——正常窗口必须盖住温漂与触点老化，否则冬天误报。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>HVIL 环覆盖电池快插、电驱/电控/空调压缩机等所有可分离高压连接器与 MSD；<\/li>\n<li>与碰撞传感器硬线联动：碰撞信号 → 无论 HVIL 状态如何直接请求下高压；<\/li>\n<li>数字式 HVIL 在新平台逐步渗透（防旁路 + 断点定位）；<\/li>\n<li>断开后的响应策略各家不同：立即分断 vs 先降载再分断——安全性与用户感知的折中，属企标决策。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 HVIL 当防爆弧装置——它只是\"探测 + 断电请求\"，拔插高压件仍须先下电再操作；<\/li>\n<li>判定窗口不留温漂与老化余量 → 冬季或高里程误报；<\/li>\n<li>用 HVIL 替代绝缘监测——两者监测对象不同（连接完整性 vs 对壳漏电），缺一不可；<\/li>\n<li>只测断路不测短路——被旁路一根导线即完全失效。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：HVIL 为什么用低压小电流信号？它为什么不能替代断电动作本身？ <strong>Q2<\/strong>：实例中把 R_sense 改为 1 kΩ，正常端电压是多少？会带来什么设计问题？ <strong>Q3<\/strong>：数字式 HVIL 相比模拟电流环多解决了什么问题？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：互锁回路本身不带危险电压、可长期在线，人碰它无风险。它只负责\"发现 + 请求\"，真正切断靠继电器/断路器执行——HVIL 是传感器，不是执行器。<\/li>\n<li>Q2：V = 5 mA × 1101.2 Ω ≈ <strong>5.5 V<\/strong>——已超出常见 5 V 钳位/量程设计，正常态与\"对 12 V 短路\"的区分度变差，说明采样电阻与量程、钳位必须联合设计，不能拍脑袋加大阻值。<\/li>\n<li>Q3：防\"短接旁路\"（模拟环被一根导线短接即失效）与断点定位（逐节点应答可报告是哪个连接器断开）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020《电动汽车安全要求》（整车高压安全与互锁相关要求，具体条款待核对）<\/li>\n<li>S-07：ISO 26262:2018（探测类安全机制与故障响应时间原则）<\/li>\n<li>ISO 6469-3《电动汽车安全规范 第 3 部分：电气安全》（编号原文，条款细节待核对）<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 6469-3 原文<\/td><td>A<\/td><td>电气安全要求框架<\/td><\/tr><tr><td>GB 18384-2020 原文<\/td><td>A<\/td><td>整车安全要求<\/td><\/tr><tr><td>UN R100 原文（S-13）<\/td><td>A<\/td><td>型式认证视角的高压安全<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>数字式 HVIL 从机芯片公开资料<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB 18384-2020 中 HVIL/互锁相关条款的准确表述与编号<\/li>\n<li>5 mA 恒流、100 Ω 采样电阻、50 mΩ 触点电阻等均为教学示意值，量产值随企标<\/li>\n<li>数字式 HVIL 的主流芯片方案与渗透率（待补公开资料）<\/li>\n<\/ul>", "text": " 对应节点 hv-01 （../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）｜ 前置： hv-05 ｜ 预计用时 30 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ，判定阈值须以整车企标与 gb 18384（s-04）条款为准。 1. 为什么需要 hvil 绝缘监测（ hv-03 ）盯的是\"高压对车壳漏不漏电\"；hvil（high voltage interlock loop，高压互锁回路）盯的是另一件事： 高压回路上的连接器还完整吗？ 高压连接器在碰撞、维修、振动老化中可能松脱或被人为拔开。带载拔插直流高压会拉电弧——伤人、起火、烧端子。hvil 的工程目标一句话： 在人的手碰到高压端子之前，让系统先断电 。节点约束点题：需覆盖所有可分离连接；故障响应需先于人员接触风险。 2. 机制展开 （1）原理 ：一条低压小电流信号回路，串联穿过所有可分离高压连接器的辅助引脚（interlock pin）与维修开关（msd，manual service disconnect）。任何一处断开 → 回路电流消失 → bms/vcu 判定\"高压连接完整性丢失\"。 （2）两种主流实现 （示意分类）： 模拟电流环 ：恒流源驱动 + 回路端电压采样，电阻预算见手算实例； 数字式互锁 ：各连接器串入带地址的从机芯片，逐个应答——天然防\"短接旁路\"误判，还能定位断点，成本更高。 （3）必须检测的四类状态 ：正常、断路（最典型）、对电源短路、对地短路。只判断路的 hvil 会被一根短接线骗过。 （4）响应分级 （先快后缓）：检测到断开 → 毫秒级请求断开继电器（带载分断有电弧代价，需与 hv-05 时序协调）→ 禁止再上电 → 记 dtc。碰撞类硬线信号优先级高于任何总线命令。 3. 手算实例：hvil 回路电阻预算 恒流源 i = 5 ma（教学示意值），设计要求：四种状态在端电压上必须可区分。 回路组成（示意选型）： 采样电阻 r_sense = 100 ω； 线束：0.5 mm² 铜线总长 20 m，电阻 = 1.72e-8 × 20 / 5e-7 ≈ 0.69 ω ； 10 个连接器辅助触点，每个接触电阻 ≤50 mω → 0.5 ω； 回路总电阻 ≈ 101.2 ω → 正常端电压 v = 5 ma × 101.2 ω ≈ 0.51 v 。 判定窗口（示意）： 状态 端电压特征 判定 正常 ≈0.51 v 通过 断路 恒流源钳位到上限（如 5 v） hvil 断开 对 12 v 短路 远超正常窗口/超量程 hvil 故障 对地短路 &lt;0.1 v hvil 故障 工程余量核对：铜的温度系数约 +0.4%/k（物理常数量级），60 k 温漂 → 线阻增加约 0.16 ω——正常窗口必须盖住温漂与触点老化，否则冬天误报。 4. 工程实态 hvil 环覆盖电池快插、电驱/电控/空调压缩机等所有可分离高压连接器与 msd； 与碰撞传感器硬线联动：碰撞信号 → 无论 hvil 状态如何直接请求下高压； 数字式 hvil 在新平台逐步渗透（防旁路 + 断点定位）； 断开后的响应策略各家不同：立即分断 vs 先降载再分断——安全性与用户感知的折中，属企标决策。 5. 常见误区 把 hvil 当防爆弧装置——它只是\"探测 + 断电请求\"，拔插高压件仍须先下电再操作； 判定窗口不留温漂与老化余量 → 冬季或高里程误报； 用 hvil 替代绝缘监测——两者监测对象不同（连接完整性 vs 对壳漏电），缺一不可； 只测断路不测短路——被旁路一根导线即完全失效。 6. 自测 q1 ：hvil 为什么用低压小电流信号？它为什么不能替代断电动作本身？ q2 ：实例中把 r_sense 改为 1 kω，正常端电压是多少？会带来什么设计问题？ q3 ：数字式 hvil 相比模拟电流环多解决了什么问题？ 答案 q1：互锁回路本身不带危险电压、可长期在线，人碰它无风险。它只负责\"发现 + 请求\"，真正切断靠继电器/断路器执行——hvil 是传感器，不是执行器。 q2：v = 5 ma × 1101.2 ω ≈ 5.5 v ——已超出常见 5 v 钳位/量程设计，正常态与\"对 12 v 短路\"的区分度变差，说明采样电阻与量程、钳位必须联合设计，不能拍脑袋加大阻值。 q3：防\"短接旁路\"（模拟环被一根导线短接即失效）与断点定位（逐节点应答可报告是哪个连接器断开）。 来源 s-04：gb 18384-2020《电动汽车安全要求》（整车高压安全与互锁相关要求，具体条款待核对） s-07：iso 26262:2018（探测类安全机制与故障响应时间原则） iso 6469-3《电动汽车安全规范 第 3 部分：电气安全》（编号原文，条款细节待核对） 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 6469-3 原文 a 电气安全要求框架 gb 18384-2020 原文 a 整车安全要求 un r100 原文（s-13） a 型式认证视角的高压安全 [待补链] — 数字式 hvil 从机芯片公开资料 待核对项（本课） gb 18384-2020 中 hvil/互锁相关条款的准确表述与编号 5 ma 恒流、100 ω 采样电阻、50 mω 触点电阻等均为教学示意值，量产值随企标 数字式 hvil 的主流芯片方案与渗透率（待补公开资料） "}, {"id": "HV-02", "title": "课程 HV-02：预充电路与预充策略", "dom": "HV", "verified": false, "html": "<blockquote><p>对应节点 <code>HV-02<\/code>（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）｜ 前置：无（本域学习路径起点）｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>，选型须以器件规格书为准。<\/p><\/blockquote>\n<h3>1. 为什么需要预充电<\/h3>\n<p>电控/逆变器的直流支撑电容（DC-link capacitor，母线电容）在整车上电前电压 ≈0。若直接闭合主继电器，电池（数百伏）对近乎短路的电容放电：<\/p>\n<ul>\n<li>浪涌电流仅受线束与触点电阻限制，可达 kA 级（教学示意量级）；<\/li>\n<li>继电器触点被电弧烧蚀甚至<strong>熔焊<\/strong>——正是 <a class=\"xlink\" href=\"#/lesson/HV-04\">HV-04<\/a> 粘连故障的首要成因；<\/li>\n<li>电容承受反复大电流应力，寿命受损。<\/li>\n<p>预充（Pre-charge）= 上电前经<strong>预充电阻<\/strong>给母线电容缓冲充电，把冲击电流限制到继电器可承受的量级。节点约束点题：预充电阻功率与预充时间窗；预充失败判定（电压爬升率）。<\/p>\n<\/ul>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）回路拓扑<\/strong>：预充继电器 + 预充电阻串联后<strong>并联在主正继电器两端<\/strong>。典型时序（细节见 <a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a>）：闭主负 → 闭预充 → 母线电压爬升至目标（90%~95% 电池电压）→ 断预充 → 闭主正。<\/p>\n<p><strong>（2）充电过程是 RC 电路<\/strong>：<\/p>\n<div class=\"math\">V_{bus}(t) = V_{pack}\\left(1 - e^{-t/\\tau}\\right), \\quad \\tau = R_{pre} \\times C_{bus}<\/div>\n<ul>\n<li>R_pre：预充电阻；C_bus：母线电容总和；<\/li>\n<li>达 90% 需 t = τ·ln(10) ≈ 2.3τ；95% 需 ≈ 3.0τ——<strong>目标每提高 5%，时间多约 1/3<\/strong>。<\/li>\n<p><strong>（3）电阻的能量与功率<\/strong>：充电能量几乎全部耗在电阻上：<\/p>\n<li>总能量 E = ½C_bus·V_pack²（终态电容储能）；<\/li>\n<li>峰值功率 P₀ = V_pack²/R_pre（t=0 时刻），随电压爬升指数衰减；<\/li>\n<li>选型依据是<strong>脉冲能量（J）与脉冲序列降额，不是连续功率（W）<\/strong>——最常见的选型错误。<\/li>\n<p><strong>（4）失败判定（电压爬升率）<\/strong>：预充窗口内电压未达目标 → 判预充失败。爬升率还能分型：完全不爬（电阻断线/电容短路/继电器未闭合）vs 爬了但太慢（窗口不够）——维修指向完全不同。<\/p>\n<\/ul>\n<h3>3. 手算实例：预充电阻选型（完整四步）<\/h3>\n<p>给定：V_pack = 400 V，C_bus = 900 µF，目标 90%，窗口 500 ms（全部教学示意值）。<\/p>\n<p><strong>第一步：定时间常数。<\/strong> τ = t / ln(10) = 0.5 / 2.303 ≈ <strong>0.217 s<\/strong><\/p>\n<p><strong>第二步：定电阻。<\/strong> R_pre = τ / C = 0.217 / 900 µF ≈ 241 Ω → 取 E24 标称 <strong>240 Ω<\/strong>。复核：τ = 240 × 900 µF = 0.216 s，V(0.5 s) = 400(1−e^(−2.315)) ≈ 360.5 V = <strong>90.1%<\/strong> ✓<\/p>\n<p><strong>第三步：能量与功率。<\/strong><\/p>\n<ul>\n<li>E = ½ × 900 µF × 400² = <strong>72 J<\/strong>（几乎全部落在电阻上）；<\/li>\n<li>预充期间平均功率 = 72 J / 0.5 s = <strong>144 W<\/strong>；<\/li>\n<li>峰值 P₀ = 400²/240 ≈ <strong>667 W<\/strong>（瞬时，指数衰减）；<\/li>\n<li>预充电流初值 = 400/240 ≈ <strong>1.67 A<\/strong>。<\/li>\n<p><strong>第四步：选型核对（示意）。<\/strong> 选短时脉冲额定足够的绕线/铝壳电阻（示例量级：连续额定 25 W、单脉冲耐 100 J 级——具体以规格书为准），并核对<strong>重复预充热累积<\/strong>：60 s 内连续两次预充即 144 J，必须查脉冲序列降额曲线或加冷却时间。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>预充回路集成于 BDU（电池配电盒），与主正/主负/快充继电器同板布置；<\/li>\n<li>预充失败累计计数并报 DTC，连续失败 → 禁止再上电（防继电器寿命被重试耗光）；<\/li>\n<li>800 V 平台：电压更高、C_bus 往往更小，单次能量同量级，峰值电流更可控；<\/li>\n<li>新架构出现\"主动预充\"（半控器件/DC-DC 缓升）替代电阻发热——成本与可靠性仍在博弈。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>按连续功率选预充电阻——应按脉冲能量与脉冲序列降额选；<\/li>\n<li>目标电压定 99%——时间 ≈4.6τ，白白拖慢上电；90%~95% 已够（残差由主正闭合瞬间吸收，量级可接受，示意）；<\/li>\n<li>预充超时一律换电阻——真实原因可能是电容短路、继电器未闭合、采样链故障，按爬升率分型后再修；<\/li>\n<li>忽略主负先闭合时刻的容性电流路径，以及预充电阻的两次预充间热恢复。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：同参数下把目标改为 95%，预充窗口至少需要多少毫秒？ <strong>Q2<\/strong>：预充电阻断线与母线电容短路，如何在上电时序中被区分？ <strong>Q3<\/strong>：800 V/450 µF 与 400 V/900 µF 两个系统，单次预充在电阻上的能量各是多少？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：t = τ·ln(20) ≈ 0.216 × 3.0 ≈ <strong>648 ms<\/strong>（3.0τ）。<\/li>\n<li>Q2：电阻断线：电压完全不爬且预充回路无电流（若有电流采样）；电容短路：电压停在低压且持续较大电流。两者都判预充失败，但 DTC 分型不同，维修指向不同。<\/li>\n<li>Q3：½CV²：800 V → ½ × 450 µF × 640000 = <strong>144 J<\/strong>；400 V → ½ × 900 µF × 160000 = <strong>72 J<\/strong>。电压翻倍能量翻倍的前提是 C 相同——800 V 系统能量未必更大，取决于 C_bus。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020（整车高压安全框架，作为安全上下文引用）<\/li>\n<li>S-07：ISO 26262:2018（预充失败探测属安全机制，方法原则）<\/li>\n<li><strong>行业惯例核实（2026-11-19，P-30 关闭）<\/strong>：预充完成判据 <strong>90%~95% 阈值<\/strong>（或绝对差 5~10 V）+ 超时 <strong>0.5~2 s<\/strong> 为通行工程实践——<a href=\"https://en.wikipedia.org/wiki/Pre-charge\" target=\"_blank\" rel=\"noopener\">Wikipedia: Pre-charge<\/a> 与多家设计指南一致，<strong>无单一标准条款<\/strong>，故按惯例口径标注<\/li>\n<li>本课 400 V、900 µF、500 ms、72 J 等均为教学示意值；RC 公式为电路基本关系<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-19 更新）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB 18384-2020 原文<\/td><td>A<\/td><td>✅<\/td><td>高压安全上下文<\/td><\/tr><tr><td>ISO 6469-3 原文<\/td><td>A<\/td><td>—<\/td><td>电气安全框架<\/td><\/tr><tr><td><a href=\"https://en.wikipedia.org/wiki/Pre-charge\" target=\"_blank\" rel=\"noopener\">Wikipedia: Pre-charge<\/a><\/td><td>C/汇总<\/td><td>✅<\/td><td>90%/95% 判据的通行口径（与多家设计指南一致）<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>—<\/td><td>脉冲功率电阻的脉冲降额选型手册（任一主流厂商选型指南均可）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>\"连续 25 W / 单脉冲 100 J\"示例规格须以具体器件规格书核实<\/li>\n<li>800 V 平台 C_bus 典型取值与主动预充方案的量产渗透率<\/li>\n<li>~~预充目标 90%~95% 的行业惯例出处~~ → <strong>2026-11-19 已核实为通行惯例<\/strong>（多来源一致，无单一标准条款；P-30 关闭）<\/li>\n<\/ul>", "text": " 对应节点 hv-02 （../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）｜ 前置：无（本域学习路径起点）｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ，选型须以器件规格书为准。 1. 为什么需要预充电 电控/逆变器的直流支撑电容（dc-link capacitor，母线电容）在整车上电前电压 ≈0。若直接闭合主继电器，电池（数百伏）对近乎短路的电容放电： 浪涌电流仅受线束与触点电阻限制，可达 ka 级（教学示意量级）； 继电器触点被电弧烧蚀甚至 熔焊 ——正是 hv-04 粘连故障的首要成因； 电容承受反复大电流应力，寿命受损。 预充（pre-charge）= 上电前经 预充电阻 给母线电容缓冲充电，把冲击电流限制到继电器可承受的量级。节点约束点题：预充电阻功率与预充时间窗；预充失败判定（电压爬升率）。 2. 机制展开 （1）回路拓扑 ：预充继电器 + 预充电阻串联后 并联在主正继电器两端 。典型时序（细节见 hv-05 ）：闭主负 → 闭预充 → 母线电压爬升至目标（90%~95% 电池电压）→ 断预充 → 闭主正。 （2）充电过程是 rc 电路 ： v_{bus}(t) = v_{pack}\\left(1 - e^{-t/\\tau}\\right), \\quad \\tau = r_{pre} \\times c_{bus} r_pre：预充电阻；c_bus：母线电容总和； 达 90% 需 t = τ·ln(10) ≈ 2.3τ；95% 需 ≈ 3.0τ—— 目标每提高 5%，时间多约 1/3 。 （3）电阻的能量与功率 ：充电能量几乎全部耗在电阻上： 总能量 e = ½c_bus·v_pack²（终态电容储能）； 峰值功率 p₀ = v_pack²/r_pre（t=0 时刻），随电压爬升指数衰减； 选型依据是 脉冲能量（j）与脉冲序列降额，不是连续功率（w） ——最常见的选型错误。 （4）失败判定（电压爬升率） ：预充窗口内电压未达目标 → 判预充失败。爬升率还能分型：完全不爬（电阻断线/电容短路/继电器未闭合）vs 爬了但太慢（窗口不够）——维修指向完全不同。 3. 手算实例：预充电阻选型（完整四步） 给定：v_pack = 400 v，c_bus = 900 µf，目标 90%，窗口 500 ms（全部教学示意值）。 第一步：定时间常数。 τ = t / ln(10) = 0.5 / 2.303 ≈ 0.217 s 第二步：定电阻。 r_pre = τ / c = 0.217 / 900 µf ≈ 241 ω → 取 e24 标称 240 ω 。复核：τ = 240 × 900 µf = 0.216 s，v(0.5 s) = 400(1−e^(−2.315)) ≈ 360.5 v = 90.1% ✓ 第三步：能量与功率。 e = ½ × 900 µf × 400² = 72 j （几乎全部落在电阻上）； 预充期间平均功率 = 72 j / 0.5 s = 144 w ； 峰值 p₀ = 400²/240 ≈ 667 w （瞬时，指数衰减）； 预充电流初值 = 400/240 ≈ 1.67 a 。 第四步：选型核对（示意）。 选短时脉冲额定足够的绕线/铝壳电阻（示例量级：连续额定 25 w、单脉冲耐 100 j 级——具体以规格书为准），并核对 重复预充热累积 ：60 s 内连续两次预充即 144 j，必须查脉冲序列降额曲线或加冷却时间。 4. 工程实态 预充回路集成于 bdu（电池配电盒），与主正/主负/快充继电器同板布置； 预充失败累计计数并报 dtc，连续失败 → 禁止再上电（防继电器寿命被重试耗光）； 800 v 平台：电压更高、c_bus 往往更小，单次能量同量级，峰值电流更可控； 新架构出现\"主动预充\"（半控器件/dc-dc 缓升）替代电阻发热——成本与可靠性仍在博弈。 5. 常见误区 按连续功率选预充电阻——应按脉冲能量与脉冲序列降额选； 目标电压定 99%——时间 ≈4.6τ，白白拖慢上电；90%~95% 已够（残差由主正闭合瞬间吸收，量级可接受，示意）； 预充超时一律换电阻——真实原因可能是电容短路、继电器未闭合、采样链故障，按爬升率分型后再修； 忽略主负先闭合时刻的容性电流路径，以及预充电阻的两次预充间热恢复。 6. 自测 q1 ：同参数下把目标改为 95%，预充窗口至少需要多少毫秒？ q2 ：预充电阻断线与母线电容短路，如何在上电时序中被区分？ q3 ：800 v/450 µf 与 400 v/900 µf 两个系统，单次预充在电阻上的能量各是多少？ 答案 q1：t = τ·ln(20) ≈ 0.216 × 3.0 ≈ 648 ms （3.0τ）。 q2：电阻断线：电压完全不爬且预充回路无电流（若有电流采样）；电容短路：电压停在低压且持续较大电流。两者都判预充失败，但 dtc 分型不同，维修指向不同。 q3：½cv²：800 v → ½ × 450 µf × 640000 = 144 j ；400 v → ½ × 900 µf × 160000 = 72 j 。电压翻倍能量翻倍的前提是 c 相同——800 v 系统能量未必更大，取决于 c_bus。 来源 s-04：gb 18384-2020（整车高压安全框架，作为安全上下文引用） s-07：iso 26262:2018（预充失败探测属安全机制，方法原则） 行业惯例核实（2026-11-19，p-30 关闭） ：预充完成判据 90%~95% 阈值 （或绝对差 5~10 v）+ 超时 0.5~2 s 为通行工程实践—— wikipedia: pre-charge 与多家设计指南一致， 无单一标准条款 ，故按惯例口径标注 本课 400 v、900 µf、500 ms、72 j 等均为教学示意值；rc 公式为电路基本关系 延伸资源（2026-11-19 更新） 资源 级别 免费 说明 gb 18384-2020 原文 a ✅ 高压安全上下文 iso 6469-3 原文 a — 电气安全框架 wikipedia: pre-charge c/汇总 ✅ 90%/95% 判据的通行口径（与多家设计指南一致） [待补链] — — 脉冲功率电阻的脉冲降额选型手册（任一主流厂商选型指南均可） 待核对项（本课） \"连续 25 w / 单脉冲 100 j\"示例规格须以具体器件规格书核实 800 v 平台 c_bus 典型取值与主动预充方案的量产渗透率 ~~预充目标 90%~95% 的行业惯例出处~~ → 2026-11-19 已核实为通行惯例 （多来源一致，无单一标准条款；p-30 关闭） "}, {"id": "HV-03", "title": "课程 HV-03：绝缘监测", "dom": "HV", "verified": false, "html": "<blockquote><p>对应节点 <code>HV-03<\/code>（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HV-01\">HV-01<\/a>、<a class=\"xlink\" href=\"#/lesson/HW-04\">HW-04<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；Ω/V 限值的准确条款表述以 GB 18384-2020（S-04）原文为准。<\/p><\/blockquote>\n<h3>1. 为什么需要绝缘监测<\/h3>\n<p>高压回路靠绝缘子、线束护套、连接器绝缘件与车壳（电平台，chassis）隔离。老化、进水、碰撞、磨破都会让绝缘劣化——轻则漏电、报故障，重则车壳带电伤人、短路起火。<\/p>\n<p>绝缘监测（Insulation Monitoring）= <strong>连续在线测量高压回路对车壳的等效绝缘电阻 R_iso<\/strong>，在劣化到危险之前分级报警。与 HVIL（<a class=\"xlink\" href=\"#/lesson/HV-01\">HV-01<\/a>）分工明确：HVIL 管\"连接在不在\"，绝缘监测管\"漏不漏电\"。节点约束点题：GB 18384 有绝缘电阻限值要求；主动式监测需防纹波误报。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）被测对象<\/strong>：R_iso 是正极对壳电阻 R₊ 与负极对壳电阻 R₋ 的<strong>并联等效<\/strong>。单点故障与均匀劣化在此等效下不可区分——后面误区的伏笔。<\/p>\n<p><strong>（2）限值逻辑<\/strong>：<strong>GB 18384-2020 §5.1.4.1 已核实（2026-11-15，S-04）<\/strong>：最大工作电压下<strong>直流电路 ≥100 Ω/V、交流电路 ≥500 Ω/V；直/交流 B 级电压电路可导电连接时按 500 Ω/V<\/strong>；并<strong>强制要求绝缘电阻监测功能<\/strong>——低于限值须声/光报警提示驾驶员。含义是<strong>限值随系统电压缩放<\/strong>：500 V 直流系统 → 50 kΩ。充电场景行业指引：R ≤100 Ω/V 视为绝缘故障应停止充电（行业指引口径，非标准原文）。<\/p>\n<p><strong>（3）量产主流在线方法：不平衡电桥法<\/strong>。在高压母线与车壳之间接入已知的切换电阻 R_s，测量母线对壳电压的变化反推 R_iso。不注入明显纹波、成本最低。<\/p>\n<p><strong>（4）辅助方法<\/strong>：主动注入法（注入低压信号测对地导纳，分辨率高，但需防注入信号干扰其他高压采样——节点约束点题）；绝缘电阻表（megger）用于产线/维修离线测量。<\/p>\n<p><strong>（5）防误报设计<\/strong>：切换电阻造成的母线扰动须与总压采样解耦（慢速平均）；雨天/洗车后湿度变化 → 滞回阈值 + 延时确认，避免\"一下雨就报警\"。<\/p>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：阈值推演<\/h4>\n<p>系统最高工作电压 550 V（800 V 平台典型工作区间，教学示意值）：<\/p>\n<ul>\n<li>绝缘限值 = 100 Ω/V × 550 V = <strong>55 kΩ<\/strong>（低于此值 → 严重故障方向）；<\/li>\n<li>工程双阈值（示意）：500 kΩ 预警（报故障、可行驶）→ 55 kΩ 严重（请求下高压）；<\/li>\n<li>滞回：恢复阈值设 600 kΩ（示意），防止电阻在限值附近抖动造成报警振荡。<\/li>\n<\/ul>\n<h4>实例 2：电桥法反演 R_iso（单边简化）<\/h4>\n<p>设绝缘集中于负极侧（R₊→∞，R₋ = R_iso）。U = 400 V，切换电阻 R_s = 1 MΩ 接入正极与壳之间，测得正极对壳电压 U_p = 40 V（教学示意值）。<\/p>\n<p>推导（正极经 R_s、R₊ 入地的电流全部经 R₋ 返回负极）：<\/p>\n<div class=\"math\">U_p = U \\cdot \\frac{R_s}{R_{iso} + R_s} \\;\\Rightarrow\\; R_{iso} = R_s\\left(\\frac{U}{U_p} - 1\\right)<\/div>\n<p>代入：R_iso = 1 MΩ × (400/40 − 1) = <strong>9 MΩ<\/strong>。<\/p>\n<p>对照验证：R_iso = 99 MΩ → U_p = 400×1/(99+1) = 4 V；R_iso = 1 MΩ → U_p = 200 V——<strong>绝缘越差，正极电位越被拉向地，电桥法对限值附近最灵敏<\/strong>。实际系统 R₊/R₋ 均未知，需正、负两次切换联立解两个方程（原理相同，本文不展开）。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产 BMS 内置电桥法：上电自检 + 运行中周期测量；<\/li>\n<li>故障分级：预警 → 限功率 → 请求下高压，并禁止未澄清故障的车辆重新上高压；<\/li>\n<li><strong>充电工况是误报/盲区高发点<\/strong>：充电口、桩侧电缆并入高压拓扑，泄漏路径改变，需与桩协同检测时序（见 <a class=\"xlink\" href=\"#/lesson/CHG-04\">CHG-04<\/a>）；<\/li>\n<li>碰撞后强制复测绝缘，是碰撞后下电逻辑的标准动作。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>把 100 Ω/V 当固定值——限值随系统电压缩放，800 V 车比 400 V 车严一倍；<\/li>\n<li>只报 R_iso 总值——单侧故障与双侧劣化的维修指向完全不同；<\/li>\n<li>湿度变化引发\"集体误报\"却归咎传感器——是滞回与延时确认设计缺失；<\/li>\n<li>行车工况的等效模型直接搬到充电工况——拓扑变了，模型必须重建。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：600 V 直流系统的绝缘限值是多少？按实例 1 的比例（约 9 倍限值）预警阈值取多少？ <strong>Q2<\/strong>：实例 2 中若测得 U_p = 2 V，R_iso 是多少？处于什么状态？ <strong>Q3<\/strong>：并联等效为什么无法区分单侧故障与双侧劣化？后果是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：100 Ω/V × 600 V = <strong>60 kΩ<\/strong>；预警 ≈ 9 倍 → <strong>540 kΩ<\/strong>（示意取整 500 kΩ 亦可）。<\/li>\n<li>Q2：R_iso = 1 MΩ × (400/2 − 1) = <strong>199 MΩ<\/strong>——绝缘极好，远离预警阈值。<\/li>\n<li>Q3：并联等效把 R₊、R₋ 两个自由度压缩成一个数。后果：维修无法定位（只能逐段排查），且双侧轻微劣化的并联值可能\"看起来仍正常\"。所以高端方案做双切换、解出 R₊ 与 R₋ 分量。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020《电动汽车安全要求》§5.1.4.1（绝缘电阻限值与强制监测报警，2026-11-15 核实）<\/li>\n<li>S-13：UN R100（型式认证视角的绝缘要求）<\/li>\n<li>ISO 6469-3（Ω/V 框架的国际对应，编号原文）<\/li>\n<li>本课 550 V、1 MΩ、9 MΩ、500 kΩ 等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-15 已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.sae-hk.org/wp-content/uploads/2020/12/002-GB-18384-2020-电动汽车安全要求.pdf\" target=\"_blank\" rel=\"noopener\">GB 18384-2020 原文 PDF（第三方托管副本）<\/a><\/td><td>A<\/td><td>✅<\/td><td>§5.1.4.1 限值条款；权威版本仍以官方渠道为准<\/td><\/tr><tr><td>ISO 6469-3 原文<\/td><td>A<\/td><td>—<\/td><td>Ω/V 框架（付费）<\/td><\/tr><tr><td>UN R100 原文（S-13）<\/td><td>A<\/td><td>—<\/td><td>认证试验视角<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>—<\/td><td>绝缘监测专用芯片公开原理资料<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~GB 18384-2020 绝缘电阻条款~~ → <strong>2026-11-15 已核实<\/strong>（§5.1.4.1：100/500 Ω/V + 强制监测报警）。<\/li>\n<li>\"预警 ≈ 9 倍限值、滞回 600 kΩ\"为教学示意，量产设定随企标。<\/li>\n<li>双切换电桥的完整双方程求解式（本文只给单边简化推导）。<\/li>\n<\/ul>", "text": " 对应节点 hv-03 （../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）｜ 前置： hv-01 、 hw-04 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；ω/v 限值的准确条款表述以 gb 18384-2020（s-04）原文为准。 1. 为什么需要绝缘监测 高压回路靠绝缘子、线束护套、连接器绝缘件与车壳（电平台，chassis）隔离。老化、进水、碰撞、磨破都会让绝缘劣化——轻则漏电、报故障，重则车壳带电伤人、短路起火。 绝缘监测（insulation monitoring）= 连续在线测量高压回路对车壳的等效绝缘电阻 r_iso ，在劣化到危险之前分级报警。与 hvil（ hv-01 ）分工明确：hvil 管\"连接在不在\"，绝缘监测管\"漏不漏电\"。节点约束点题：gb 18384 有绝缘电阻限值要求；主动式监测需防纹波误报。 2. 机制展开 （1）被测对象 ：r_iso 是正极对壳电阻 r₊ 与负极对壳电阻 r₋ 的 并联等效 。单点故障与均匀劣化在此等效下不可区分——后面误区的伏笔。 （2）限值逻辑 ： gb 18384-2020 §5.1.4.1 已核实（2026-11-15，s-04） ：最大工作电压下 直流电路 ≥100 ω/v、交流电路 ≥500 ω/v；直/交流 b 级电压电路可导电连接时按 500 ω/v ；并 强制要求绝缘电阻监测功能 ——低于限值须声/光报警提示驾驶员。含义是 限值随系统电压缩放 ：500 v 直流系统 → 50 kω。充电场景行业指引：r ≤100 ω/v 视为绝缘故障应停止充电（行业指引口径，非标准原文）。 （3）量产主流在线方法：不平衡电桥法 。在高压母线与车壳之间接入已知的切换电阻 r_s，测量母线对壳电压的变化反推 r_iso。不注入明显纹波、成本最低。 （4）辅助方法 ：主动注入法（注入低压信号测对地导纳，分辨率高，但需防注入信号干扰其他高压采样——节点约束点题）；绝缘电阻表（megger）用于产线/维修离线测量。 （5）防误报设计 ：切换电阻造成的母线扰动须与总压采样解耦（慢速平均）；雨天/洗车后湿度变化 → 滞回阈值 + 延时确认，避免\"一下雨就报警\"。 3. 手算实例 实例 1：阈值推演 系统最高工作电压 550 v（800 v 平台典型工作区间，教学示意值）： 绝缘限值 = 100 ω/v × 550 v = 55 kω （低于此值 → 严重故障方向）； 工程双阈值（示意）：500 kω 预警（报故障、可行驶）→ 55 kω 严重（请求下高压）； 滞回：恢复阈值设 600 kω（示意），防止电阻在限值附近抖动造成报警振荡。 实例 2：电桥法反演 r_iso（单边简化） 设绝缘集中于负极侧（r₊→∞，r₋ = r_iso）。u = 400 v，切换电阻 r_s = 1 mω 接入正极与壳之间，测得正极对壳电压 u_p = 40 v（教学示意值）。 推导（正极经 r_s、r₊ 入地的电流全部经 r₋ 返回负极）： u_p = u \\cdot \\frac{r_s}{r_{iso} + r_s} \\;\\rightarrow\\; r_{iso} = r_s\\left(\\frac{u}{u_p} - 1\\right) 代入：r_iso = 1 mω × (400/40 − 1) = 9 mω 。 对照验证：r_iso = 99 mω → u_p = 400×1/(99+1) = 4 v；r_iso = 1 mω → u_p = 200 v—— 绝缘越差，正极电位越被拉向地，电桥法对限值附近最灵敏 。实际系统 r₊/r₋ 均未知，需正、负两次切换联立解两个方程（原理相同，本文不展开）。 4. 工程实态 量产 bms 内置电桥法：上电自检 + 运行中周期测量； 故障分级：预警 → 限功率 → 请求下高压，并禁止未澄清故障的车辆重新上高压； 充电工况是误报/盲区高发点 ：充电口、桩侧电缆并入高压拓扑，泄漏路径改变，需与桩协同检测时序（见 chg-04 ）； 碰撞后强制复测绝缘，是碰撞后下电逻辑的标准动作。 5. 常见误区 把 100 ω/v 当固定值——限值随系统电压缩放，800 v 车比 400 v 车严一倍； 只报 r_iso 总值——单侧故障与双侧劣化的维修指向完全不同； 湿度变化引发\"集体误报\"却归咎传感器——是滞回与延时确认设计缺失； 行车工况的等效模型直接搬到充电工况——拓扑变了，模型必须重建。 6. 自测 q1 ：600 v 直流系统的绝缘限值是多少？按实例 1 的比例（约 9 倍限值）预警阈值取多少？ q2 ：实例 2 中若测得 u_p = 2 v，r_iso 是多少？处于什么状态？ q3 ：并联等效为什么无法区分单侧故障与双侧劣化？后果是什么？ 答案 q1：100 ω/v × 600 v = 60 kω ；预警 ≈ 9 倍 → 540 kω （示意取整 500 kω 亦可）。 q2：r_iso = 1 mω × (400/2 − 1) = 199 mω ——绝缘极好，远离预警阈值。 q3：并联等效把 r₊、r₋ 两个自由度压缩成一个数。后果：维修无法定位（只能逐段排查），且双侧轻微劣化的并联值可能\"看起来仍正常\"。所以高端方案做双切换、解出 r₊ 与 r₋ 分量。 来源 s-04：gb 18384-2020《电动汽车安全要求》§5.1.4.1（绝缘电阻限值与强制监测报警，2026-11-15 核实） s-13：un r100（型式认证视角的绝缘要求） iso 6469-3（ω/v 框架的国际对应，编号原文） 本课 550 v、1 mω、9 mω、500 kω 等均为教学示意值 延伸资源（2026-11-15 已核实） 资源 级别 免费 说明 gb 18384-2020 原文 pdf（第三方托管副本） a ✅ §5.1.4.1 限值条款；权威版本仍以官方渠道为准 iso 6469-3 原文 a — ω/v 框架（付费） un r100 原文（s-13） a — 认证试验视角 [待补链] — — 绝缘监测专用芯片公开原理资料 待核对项（本课） ~~gb 18384-2020 绝缘电阻条款~~ → 2026-11-15 已核实 （§5.1.4.1：100/500 ω/v + 强制监测报警）。 \"预警 ≈ 9 倍限值、滞回 600 kω\"为教学示意，量产设定随企标。 双切换电桥的完整双方程求解式（本文只给单边简化推导）。 "}, {"id": "HV-04", "title": "课程 HV-04：继电器粘连检测", "dom": "HV", "verified": false, "html": "<blockquote><p>对应节点 <code>HV-04<\/code>（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HV-02\">HV-02<\/a>、<a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a> ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要粘连检测<\/h3>\n<p>高压直流继电器切断大电流时触点间拉直流电弧——直流没有交流的过零点，电弧不自熄，触点表面熔融金属冷却后可能把动静触点<strong>焊死<\/strong>（welding，粘连）。<\/p>\n<p>后果是致命的：<strong>系统\"以为\"已下高压，实际高压仍在输出<\/strong>——维修与碰撞救援场景都暴露在风险下。所以每次上电前必须先回答：主正/主负继电器还焊着吗？这就是粘连检测（welding detection）。节点约束点题：检测须在上电前完成；检测时序需避免误触发。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）核心原理：压差法。<\/strong> 继电器断开且母线电容已放电时，触点两端应有明显压差（一侧电池电压、一侧 ≈0）。若两侧电位几乎相等 → 触点仍导通 → 粘连。每个继电器单独判。<\/p>\n<p><strong>（2）借助预充回路判主正粘连。<\/strong> 若主正焊死，则闭主负+预充瞬间母线电压会<strong>直接等于<\/strong>电池电压（没有 RC 爬升）——把 <a class=\"xlink\" href=\"#/lesson/HV-02\">HV-02<\/a> 的\"预充是否按预期爬升\"反向用作粘连证据。<\/p>\n<p><strong>（3）检测窗口的本质：先放电，再判粘连。<\/strong> 母线残压不泄放，压差法失效（两侧都是 400 V）。下电放电（<a class=\"xlink\" href=\"#/lesson/HV-05\">HV-05<\/a>）不只是安全措施，还是下一次粘连检测的前置条件——这就是\"检测时序需避免误触发\"的含义。<\/p>\n<p><strong>（4）粘连后的处理。<\/strong> 软件无法\"断开\"机械熔焊：禁止上电、维修区禁带电；严重碰撞场景靠熔断器/热熔断（pyro-fuse，爆破式切断）作最后防线。<\/p>\n<h3>3. 工程案例：上电前粘连检测时序表（数值均为教学示意值）<\/h3>\n<table><thead><tr><th>步骤<\/th><th>动作<\/th><th>判据（示意）<\/th><th>典型耗时<\/th><th>失败分支<\/th><\/tr><\/thead><tbody><tr><td>T0<\/td><td>低压上电、采样自检<\/td><td>采样通道正常<\/td><td>~100 ms<\/td><td>硬件故障，禁上电<\/td><\/tr><tr><td>T1<\/td><td>放电确认<\/td><td>母线残压 &lt;24 V<\/td><td>&lt;1 s（随下电方案）<\/td><td>继续等待/报放电故障<\/td><\/tr><tr><td>T2<\/td><td>主负压差检测<\/td><td>压差 &gt;20 V 判\"已断开\"<\/td><td>10 ms × 3 次防抖<\/td><td>主负粘连 → 禁上电<\/td><\/tr><tr><td>T3<\/td><td>主正压差检测<\/td><td>同上<\/td><td>同上<\/td><td>主正粘连 → 禁上电<\/td><\/tr><tr><td>T4<\/td><td>预充测试<\/td><td>电压按 RC 正常爬升<\/td><td>300~500 ms<\/td><td>爬升异常 → 分型报故障<\/td><\/tr><tr><td>T5<\/td><td>预充完成、闭主正<\/td><td>母线 ≥90% 电池电压<\/td><td>见 HV-02<\/td><td>预充超时 → 回安全态<\/td><\/tr><\/tbody><\/table>\n<p>全流程合计约 2~3 s——用户感知的\"上电延迟\"主要花在这些安全检查上。<\/p>\n<p><strong>压差判据的误差预算小算例<\/strong>：电池 400 V、放电后母线 24 V（均示意），粘连时压差 = 376 V；采样精度 1% → 误差约 4 V，判据 20 V 远大于误差 → 判定可靠。反之跳过放电直接判（两侧均 400 V、压差 ≈0），会把\"正常断开\"误判成粘连——误触发就是这么来的。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>每次上电必做；结果计入故障分级与维修引导（DTC 指向具体继电器）；<\/li>\n<li>继电器本体设计降低粘连概率：磁吹灭弧（磁钢驱弧）、触点材料（AgSnO₂ 系，示意）、必要时双触点串联分摊电弧能量；<\/li>\n<li>运行中<strong>无法在线检测粘连<\/strong>（继电器本就导通），只能下电后确认——这是全行业约束而非某家偷懒；<\/li>\n<li>部分架构用电流-电压历史交叉验证（断开后压差正常但历史分断电流异常 → 提示触点已微熔，提前预警）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>跳过放电直接用压差判——两侧等电位，正常态被误判为粘连；<\/li>\n<li>预充失败一律报\"主正粘连\"——电阻断线、电容短路同样爬升异常，必须分型；<\/li>\n<li>认为软件重试能\"挣脱\"粘连——机械熔焊不是逻辑状态，重试只是烧线圈；<\/li>\n<li>漏掉快充支路——粘连检测须覆盖每一条可独立建立高压的回路。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：为什么直流继电器比交流继电器更容易粘连？ <strong>Q2<\/strong>：主正粘连与预充电阻断线，在预充阶段的电压曲线分别长什么样？ <strong>Q3<\/strong>：放电目标定 24 V 而不是 0 V，工程理由是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：交流电流每半周过零、电弧自然熄灭；直流电弧无过零点、持续燃弧时间长，触点熔融与材料转移更严重。<\/li>\n<li>Q2：主正粘连：闭主负+预充瞬间母线电压直接等于电池电压（\"太快\"）；电阻断线：母线电压停在残压不爬升（\"不动\"）。两者都不正常但方向相反。<\/li>\n<li>Q3：判粘连只需足够压差（20 V 判据 + 4 V 误差余量即够）；放到 0 V 理论上要无穷久（指数衰减），放到 24 V 只需 ln(400/24)≈2.8 个时间常数，且 24 V 远离人体安全阈值（60 V DC 量级）——时间与安全的折中。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020（整车高压安全框架）<\/li>\n<li>S-07：ISO 26262:2018（安全机制与故障探测原则）<\/li>\n<li>本课时序数值、判据阈值均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB 18384-2020 原文<\/td><td>A<\/td><td>整车安全上下文<\/td><\/tr><tr><td>ISO 6469-3 原文<\/td><td>A<\/td><td>电气安全框架<\/td><\/tr><tr><td>[待补链]<\/td><td>—<\/td><td>高压直流继电器厂商的应用与灭弧设计资料<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>磁吹灭弧 / AgSnO₂ 触点材料的行业普及度表述<\/li>\n<li>20 V 压差判据、24 V 放电目标、3 次防抖等均为教学示意值<\/li>\n<li>触点微熔（运行期前兆）可观测特征的公开文献<\/li>\n<\/ul>", "text": " 对应节点 hv-04 （../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）｜ 前置： hv-02 、 hv-05 ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么需要粘连检测 高压直流继电器切断大电流时触点间拉直流电弧——直流没有交流的过零点，电弧不自熄，触点表面熔融金属冷却后可能把动静触点 焊死 （welding，粘连）。 后果是致命的： 系统\"以为\"已下高压，实际高压仍在输出 ——维修与碰撞救援场景都暴露在风险下。所以每次上电前必须先回答：主正/主负继电器还焊着吗？这就是粘连检测（welding detection）。节点约束点题：检测须在上电前完成；检测时序需避免误触发。 2. 机制展开 （1）核心原理：压差法。 继电器断开且母线电容已放电时，触点两端应有明显压差（一侧电池电压、一侧 ≈0）。若两侧电位几乎相等 → 触点仍导通 → 粘连。每个继电器单独判。 （2）借助预充回路判主正粘连。 若主正焊死，则闭主负+预充瞬间母线电压会 直接等于 电池电压（没有 rc 爬升）——把 hv-02 的\"预充是否按预期爬升\"反向用作粘连证据。 （3）检测窗口的本质：先放电，再判粘连。 母线残压不泄放，压差法失效（两侧都是 400 v）。下电放电（ hv-05 ）不只是安全措施，还是下一次粘连检测的前置条件——这就是\"检测时序需避免误触发\"的含义。 （4）粘连后的处理。 软件无法\"断开\"机械熔焊：禁止上电、维修区禁带电；严重碰撞场景靠熔断器/热熔断（pyro-fuse，爆破式切断）作最后防线。 3. 工程案例：上电前粘连检测时序表（数值均为教学示意值） 步骤 动作 判据（示意） 典型耗时 失败分支 t0 低压上电、采样自检 采样通道正常 ~100 ms 硬件故障，禁上电 t1 放电确认 母线残压 &lt;24 v &lt;1 s（随下电方案） 继续等待/报放电故障 t2 主负压差检测 压差 &gt;20 v 判\"已断开\" 10 ms × 3 次防抖 主负粘连 → 禁上电 t3 主正压差检测 同上 同上 主正粘连 → 禁上电 t4 预充测试 电压按 rc 正常爬升 300~500 ms 爬升异常 → 分型报故障 t5 预充完成、闭主正 母线 ≥90% 电池电压 见 hv-02 预充超时 → 回安全态 全流程合计约 2~3 s——用户感知的\"上电延迟\"主要花在这些安全检查上。 压差判据的误差预算小算例 ：电池 400 v、放电后母线 24 v（均示意），粘连时压差 = 376 v；采样精度 1% → 误差约 4 v，判据 20 v 远大于误差 → 判定可靠。反之跳过放电直接判（两侧均 400 v、压差 ≈0），会把\"正常断开\"误判成粘连——误触发就是这么来的。 4. 工程实态 每次上电必做；结果计入故障分级与维修引导（dtc 指向具体继电器）； 继电器本体设计降低粘连概率：磁吹灭弧（磁钢驱弧）、触点材料（agsno₂ 系，示意）、必要时双触点串联分摊电弧能量； 运行中 无法在线检测粘连 （继电器本就导通），只能下电后确认——这是全行业约束而非某家偷懒； 部分架构用电流-电压历史交叉验证（断开后压差正常但历史分断电流异常 → 提示触点已微熔，提前预警）。 5. 常见误区 跳过放电直接用压差判——两侧等电位，正常态被误判为粘连； 预充失败一律报\"主正粘连\"——电阻断线、电容短路同样爬升异常，必须分型； 认为软件重试能\"挣脱\"粘连——机械熔焊不是逻辑状态，重试只是烧线圈； 漏掉快充支路——粘连检测须覆盖每一条可独立建立高压的回路。 6. 自测 q1 ：为什么直流继电器比交流继电器更容易粘连？ q2 ：主正粘连与预充电阻断线，在预充阶段的电压曲线分别长什么样？ q3 ：放电目标定 24 v 而不是 0 v，工程理由是什么？ 答案 q1：交流电流每半周过零、电弧自然熄灭；直流电弧无过零点、持续燃弧时间长，触点熔融与材料转移更严重。 q2：主正粘连：闭主负+预充瞬间母线电压直接等于电池电压（\"太快\"）；电阻断线：母线电压停在残压不爬升（\"不动\"）。两者都不正常但方向相反。 q3：判粘连只需足够压差（20 v 判据 + 4 v 误差余量即够）；放到 0 v 理论上要无穷久（指数衰减），放到 24 v 只需 ln(400/24)≈2.8 个时间常数，且 24 v 远离人体安全阈值（60 v dc 量级）——时间与安全的折中。 来源 s-04：gb 18384-2020（整车高压安全框架） s-07：iso 26262:2018（安全机制与故障探测原则） 本课时序数值、判据阈值均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb 18384-2020 原文 a 整车安全上下文 iso 6469-3 原文 a 电气安全框架 [待补链] — 高压直流继电器厂商的应用与灭弧设计资料 待核对项（本课） 磁吹灭弧 / agsno₂ 触点材料的行业普及度表述 20 v 压差判据、24 v 放电目标、3 次防抖等均为教学示意值 触点微熔（运行期前兆）可观测特征的公开文献 "}, {"id": "HV-05", "title": "课程 HV-05：高压上下电时序", "dom": "HV", "verified": false, "html": "<blockquote><p>对应节点 <code>HV-05<\/code>（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HV-02\">HV-02<\/a> ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么需要时序管理<\/h3>\n<p>高压回路的建立与撤出不是\"闭合/断开两个继电器\"这么简单：预充必须先于主正（<a class=\"xlink\" href=\"#/lesson/HV-02\">HV-02<\/a>）、粘连检测必须先于一切闭合（<a class=\"xlink\" href=\"#/lesson/HV-04\">HV-04<\/a>）、绝缘自检要在带载前完成（<a class=\"xlink\" href=\"#/lesson/HV-03\">HV-03<\/a>）、下电后要把母线泄放到安全电压。<strong>顺序错了不是功能问题，是安全问题。<\/strong><\/p>\n<p>时序管理两条铁律（节点约束）：<strong>与 VCU 协调<\/strong>（整车只能有一个指挥者）；<strong>任一步失败回到安全状态<\/strong>（安全态 = 继电器全断 + 母线放电 + 禁再上电，直到故障澄清）。<\/p>\n<h3>2. 机制展开<\/h3>\n<p><strong>（1）上电时序（整合前几课）<\/strong>：低压上电 → BMS 自检（粘连 → 放电确认 → 绝缘 → HVIL）→ 闭主负 → 闭预充 → 电压爬升至目标 → 断预充 → 闭主正 → 高压就绪 → 报 VCU 允许行车。<\/p>\n<p><strong>（2）下电时序<\/strong>：整车请求下电 → 功率输出归零（带载分断大电流会烧触点）→ 分断继电器 → 主动/被动放电 → 母线 ≤60 V DC（人体安全电压量级的通用引用值，条款表述待核对）→ 记录状态、休眠。<\/p>\n<p><strong>（3）状态机与协调<\/strong>。典型高压状态机（示意命名）：<code>OFF → STANDBY → PRECHARGE → READY<\/code>（另有 <code>CHARGE<\/code> 支路进充电域）。BMS 与 VCU 各持一份并互验：BMS 报\"高压就绪\"后 VCU 才使能驱动；任何一方超时 → 回安全态。<\/p>\n<p><strong>（4）优先级链<\/strong>（从高到低，示意）：碰撞硬线 &gt; HVIL 硬线 &gt; BMS 内部故障 &gt; CAN 命令。<strong>硬线永远优先于总线<\/strong>——总线可能丢帧、被干扰、被攻击。<\/p>\n<h3>3. 手算实例：下电放电电阻计算<\/h3>\n<p>给定：C_bus = 900 µF，V₀ = 400 V，要求 1 s 内泄放到 ≤60 V DC（教学示意值；60 V DC 为人体安全电压限的常见引用值，标准条款待核对）。<\/p>\n<p>放电过程 V(t) = V₀·e^(−t/RC)，反解所需时间常数：<\/p>\n<div class=\"math\">RC = \\frac{t}{\\ln(V_0/V_{target})} = \\frac{1}{\\ln(400/60)} = \\frac{1}{1.897} ≈ 0.527\\ \\text{s}<\/div>\n<ul>\n<li>R = 0.527 / 900 µF ≈ 585 Ω → 取 E24 标称 <strong>560 Ω<\/strong>；<\/li>\n<li>复核：RC = 0.504 s，V(1 s) = 400·e^(−1.984) ≈ <strong>55 V<\/strong> ✓<\/li>\n<li>能量核对：½CV² = 72 J 全部落在此电阻上，峰值功率 400²/560 ≈ 286 W（瞬时）→ 选脉冲能力足够的泄放电阻（示意选型）；<\/li>\n<li>对比：主动放电（电力电子泵回电池或耗散）可压到 ~100 ms 级（示意），代价是成本与新失效模式。<\/li>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>状态机在 BMS 与 VCU <strong>双向实现并互验<\/strong>，超时、非法跳变均记 DTC；<\/li>\n<li>上电自检失败后<strong>有限次重试<\/strong>——防继电器寿命被重试风暴烧光；<\/li>\n<li>主动放电在新平台普及；被动泄放电阻常驻母线（兼作驻车后自然泄放路径）；<\/li>\n<li>诊断仪可请求\"受控下高压\"用于维修，但碰撞/严重故障路径不允许被诊断命令覆盖。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>预充未达目标就闭主正——等于没预充，浪涌全打在主正触点上（<a class=\"xlink\" href=\"#/lesson/HV-02\">HV-02<\/a> 白做了）；<\/li>\n<li>带载分断——先请求功率归零再分断，否则每次下电都在烧触点、积累粘连概率（<a class=\"xlink\" href=\"#/lesson/HV-04\">HV-04<\/a>）；<\/li>\n<li>下电只分断不放电——残压 400 V 的母线对维修人员是致命的；<\/li>\n<li>只测成功路径——工程量在失败分支：每步超时怎么走、回到哪个安全态，比成功路径更值得测试。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：上电时序里\"闭主负\"为什么在\"闭预充\"之前？ <strong>Q2<\/strong>：泄放电阻取 1 kΩ，1 s 后母线电压多少？还满足 60 V 目标吗？ <strong>Q3<\/strong>：为什么碰撞硬线信号必须绕过 CAN、直接作用于继电器驱动级？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：先建立负极回路，预充电流才有完整通路；顺序颠倒会让电流走不确定路径（例如给不该充电的容性支路充电），也可能造成检测误判。先负后正是行业惯例（示意表述）。<\/li>\n<li>Q2：RC = 0.9 s，V(1) = 400·e^(−1.111) ≈ <strong>132 V<\/strong> &gt; 60 V，不满足；需 t = 0.9×1.897 ≈ <strong>1.71 s<\/strong> 才降到 60 V——电阻按能量峰值好选，按时间窗核对才是关键。<\/li>\n<li>Q3：CAN 有延迟、丢帧与被攻击风险；碰撞是最高优先级事件，硬线直连保证\"任何软件状态都能被物理信号推翻\"。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020 §5.1（<strong>2026-11-18 核实<\/strong>：超过 60 V (d.c.) 即触发 B 级电压电路防护 5.1.4.1/2/3 + 5.1.5；充电插座断开 1 s 内降至 ≤30 V a.c./60 V d.c.）<\/li>\n<li>S-07：ISO 26262:2018（安全状态与故障响应原则）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 产品技术条件，上下电控制相关条款表述待核对）<\/li>\n<li>本课 400 V、900 µF、560 Ω、1 s 等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-18 已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.sae-hk.org/wp-content/uploads/2020/12/002-GB-18384-2020-电动汽车安全要求.pdf\" target=\"_blank\" rel=\"noopener\">GB 18384-2020 原文 PDF（第三方托管副本）<\/a><\/td><td>A<\/td><td>✅<\/td><td>§5.1 触电防护与 60 V 阈值条款<\/td><\/tr><tr><td><a href=\"https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=DA9BDFC1903FA2258AD614D6E8B0CDEF\" target=\"_blank\" rel=\"noopener\">openstd GB 18384-2020 页面<\/a><\/td><td>A<\/td><td>✅（在线阅读）<\/td><td>官方渠道<\/td><\/tr><tr><td>ISO 26262 原文（S-07）<\/td><td>A<\/td><td>—<\/td><td>安全状态定义与 FTTI 概念<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>~~60 V DC 限值条款表述~~ → <strong>2026-11-18 已核实<\/strong>（§5.1 阈值 + 充电插座 1 s 降压要求）。<\/li>\n<li>状态机命名（OFF/STANDBY/PRECHARGE/READY）为示意，各厂不一。<\/li>\n<li>主动放电 ~100 ms 级的典型性能数据出处。<\/li>\n<\/ul>", "text": " 对应节点 hv-05 （../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）｜ 前置： hv-02 ｜ 预计用时 40 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么需要时序管理 高压回路的建立与撤出不是\"闭合/断开两个继电器\"这么简单：预充必须先于主正（ hv-02 ）、粘连检测必须先于一切闭合（ hv-04 ）、绝缘自检要在带载前完成（ hv-03 ）、下电后要把母线泄放到安全电压。 顺序错了不是功能问题，是安全问题。 时序管理两条铁律（节点约束）： 与 vcu 协调 （整车只能有一个指挥者）； 任一步失败回到安全状态 （安全态 = 继电器全断 + 母线放电 + 禁再上电，直到故障澄清）。 2. 机制展开 （1）上电时序（整合前几课） ：低压上电 → bms 自检（粘连 → 放电确认 → 绝缘 → hvil）→ 闭主负 → 闭预充 → 电压爬升至目标 → 断预充 → 闭主正 → 高压就绪 → 报 vcu 允许行车。 （2）下电时序 ：整车请求下电 → 功率输出归零（带载分断大电流会烧触点）→ 分断继电器 → 主动/被动放电 → 母线 ≤60 v dc（人体安全电压量级的通用引用值，条款表述待核对）→ 记录状态、休眠。 （3）状态机与协调 。典型高压状态机（示意命名）： off → standby → precharge → ready （另有 charge 支路进充电域）。bms 与 vcu 各持一份并互验：bms 报\"高压就绪\"后 vcu 才使能驱动；任何一方超时 → 回安全态。 （4）优先级链 （从高到低，示意）：碰撞硬线 &gt; hvil 硬线 &gt; bms 内部故障 &gt; can 命令。 硬线永远优先于总线 ——总线可能丢帧、被干扰、被攻击。 3. 手算实例：下电放电电阻计算 给定：c_bus = 900 µf，v₀ = 400 v，要求 1 s 内泄放到 ≤60 v dc（教学示意值；60 v dc 为人体安全电压限的常见引用值，标准条款待核对）。 放电过程 v(t) = v₀·e^(−t/rc)，反解所需时间常数： rc = \\frac{t}{\\ln(v_0/v_{target})} = \\frac{1}{\\ln(400/60)} = \\frac{1}{1.897} ≈ 0.527\\ \\text{s} r = 0.527 / 900 µf ≈ 585 ω → 取 e24 标称 560 ω ； 复核：rc = 0.504 s，v(1 s) = 400·e^(−1.984) ≈ 55 v ✓ 能量核对：½cv² = 72 j 全部落在此电阻上，峰值功率 400²/560 ≈ 286 w（瞬时）→ 选脉冲能力足够的泄放电阻（示意选型）； 对比：主动放电（电力电子泵回电池或耗散）可压到 ~100 ms 级（示意），代价是成本与新失效模式。 4. 工程实态 状态机在 bms 与 vcu 双向实现并互验 ，超时、非法跳变均记 dtc； 上电自检失败后 有限次重试 ——防继电器寿命被重试风暴烧光； 主动放电在新平台普及；被动泄放电阻常驻母线（兼作驻车后自然泄放路径）； 诊断仪可请求\"受控下高压\"用于维修，但碰撞/严重故障路径不允许被诊断命令覆盖。 5. 常见误区 预充未达目标就闭主正——等于没预充，浪涌全打在主正触点上（ hv-02 白做了）； 带载分断——先请求功率归零再分断，否则每次下电都在烧触点、积累粘连概率（ hv-04 ）； 下电只分断不放电——残压 400 v 的母线对维修人员是致命的； 只测成功路径——工程量在失败分支：每步超时怎么走、回到哪个安全态，比成功路径更值得测试。 6. 自测 q1 ：上电时序里\"闭主负\"为什么在\"闭预充\"之前？ q2 ：泄放电阻取 1 kω，1 s 后母线电压多少？还满足 60 v 目标吗？ q3 ：为什么碰撞硬线信号必须绕过 can、直接作用于继电器驱动级？ 答案 q1：先建立负极回路，预充电流才有完整通路；顺序颠倒会让电流走不确定路径（例如给不该充电的容性支路充电），也可能造成检测误判。先负后正是行业惯例（示意表述）。 q2：rc = 0.9 s，v(1) = 400·e^(−1.111) ≈ 132 v &gt; 60 v，不满足；需 t = 0.9×1.897 ≈ 1.71 s 才降到 60 v——电阻按能量峰值好选，按时间窗核对才是关键。 q3：can 有延迟、丢帧与被攻击风险；碰撞是最高优先级事件，硬线直连保证\"任何软件状态都能被物理信号推翻\"。 来源 s-04：gb 18384-2020 §5.1（ 2026-11-18 核实 ：超过 60 v (d.c.) 即触发 b 级电压电路防护 5.1.4.1/2/3 + 5.1.5；充电插座断开 1 s 内降至 ≤30 v a.c./60 v d.c.） s-07：iso 26262:2018（安全状态与故障响应原则） s-03：gb/t 38661-2020（bms 产品技术条件，上下电控制相关条款表述待核对） 本课 400 v、900 µf、560 ω、1 s 等均为教学示意值 延伸资源（2026-11-18 已核实） 资源 级别 免费 说明 gb 18384-2020 原文 pdf（第三方托管副本） a ✅ §5.1 触电防护与 60 v 阈值条款 openstd gb 18384-2020 页面 a ✅（在线阅读） 官方渠道 iso 26262 原文（s-07） a — 安全状态定义与 ftti 概念 待核对项（本课） ~~60 v dc 限值条款表述~~ → 2026-11-18 已核实 （§5.1 阈值 + 充电插座 1 s 降压要求）。 状态机命名（off/standby/precharge/ready）为示意，各厂不一。 主动放电 ~100 ms 级的典型性能数据出处。 "}, {"id": "HW-01", "title": "课程 HW-01：AFE 模拟前端——多路采集与被动均衡", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-01<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：无（建议先读 <a class=\"xlink\" href=\"#/lesson/SYS-01\">SYS-01<\/a>）｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>（量级参考主流堆叠式 AFE 芯片规格书的常见档位），不是特定厂商实测数据。<\/p><\/blockquote>\n<h3>1. 为什么需要 AFE<\/h3>\n<p>主控 MCU 只有一颗，而一个 400 V 包可能有约 96 节电芯、上百个温度点（示意配置）。把 96 路电芯电压直接接进 MCU 既不现实也不安全——AFE（Analog Front End，模拟前端）就是专门解决\"多路、高精度、高共模\"采集的专用芯片，它同时承担四件事：<\/p>\n<ol>\n<li><strong>单体电压采集<\/strong>：多通道多路复用 + 高精度 ADC（采集精度典型 ±1~5 mV，节点约束；GB/T 38661（S-03）对采集精度有产品级要求，具体条款数值待核对）；<\/li>\n<li><strong>温度采集<\/strong>：NTC 分压输入或电流源激励；<\/li>\n<li><strong>被动均衡<\/strong>：内置开关 + 外部电阻对单体泄流；<\/li>\n<li><strong>菊花链级联<\/strong>（daisy-chain）：芯片间用隔离通信级联，省掉大量隔离器件。<\/li>\n<p>没有 AFE，\"测准每一节\"这件事在成本和引脚数上都不成立——它是整条信号链（采集 → 传输 → 处理 → 执行）的起点。<\/p>\n<\/ol>\n<h3>2. 机制展开：一块 AFE 里有什么<\/h3>\n<p><strong>（1）通道前端与 ADC<\/strong><\/p>\n<ul>\n<li>输入引脚 RC 滤波（抗 EMI），多路开关耐压需覆盖整堆电压（堆叠式架构）；<\/li>\n<li>逐次逼近 ADC（SAR, Successive Approximation Register），分辨率典型 14~16 bit（示意）；<\/li>\n<li><strong>同步采样<\/strong>：级联多片 AFE 必须同拍转换，否则\"各单体之和\"与独立测的总压对不上账，差十几 mV（示意量级）——同步机制与隔离链路见 <a class=\"xlink\" href=\"#/lesson/HW-04\">HW-04<\/a>。<\/li>\n<p><strong>（2）被动均衡支路<\/strong><\/p>\n<li>每通道一对内部开关 + 外部均衡电阻，把偏高电芯的电量经电阻泄掉（被动均衡，能量变热）；<\/li>\n<li>功耗分担是选型关键：外部电阻承担大部分，芯片内部开关也发热（见手算实例 2）。<\/li>\n<p><strong>（3）诊断机制（覆盖率需匹配 ASIL，S-07）<\/strong><\/p>\n<li><strong>断线检测<\/strong>（open-wire detection）：向引脚注入微小电流，观察电压响应异常；<\/li>\n<li><strong>转换结果 CRC<\/strong>、寄存器 ECC、基准电压自检、看门狗；<\/li>\n<li>结论要点：AFE 不能是\"哑巴\"——ASIL C/D 系统要求传感器故障可检测（与 <a class=\"xlink\" href=\"#/lesson/HW-07\">HW-07<\/a> 呼应）。<\/li>\n<p><strong>（4）已核实的代表性通道数（2026-11-06，厂商产品页口径，S-59）<\/strong><\/p>\n<\/ul>\n<table><thead><tr><th>芯片<\/th><th>厂商<\/th><th>通道/串数<\/th><\/tr><\/thead><tbody><tr><td>bq769x2 系列<\/td><td>TI<\/td><td>3~16 串<\/td><\/tr><tr><td>MC33771B<\/td><td>NXP<\/td><td>14 通道<\/td><\/tr><tr><td>ADBMS181x 系列<\/td><td>ADI<\/td><td>18 通道<\/td><\/tr><\/tbody><\/table>\n<p>——\"单芯片十几个通道、菊花链级联扩展\"的常识口径成立；96 串包需 6~7 片 16 通道级联（示意推算）。<\/p>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：单体电压精度预算<\/h4>\n<p>要求：单体电压测量误差 ≤ ±5 mV（示意指标）。误差链逐项分配（教学示意值）：<\/p>\n<table><thead><tr><th>误差源<\/th><th>分配值<\/th><\/tr><\/thead><tbody><tr><td>AFE 本体（含 ADC 与基准）<\/td><td>±1.5 mV<\/td><\/tr><tr><td>连接器与走线压降<\/td><td>±0.5 mV<\/td><\/tr><tr><td>温漂（−40~85°C 全温区）<\/td><td>±1.0 mV<\/td><\/tr><\/tbody><\/table>\n<ul>\n<li>最坏情况相加：1.5 + 0.5 + 1.0 = <strong>3.0 mV ≤ 5 mV<\/strong> ✓<\/li>\n<li>均方根合成：√(1.5² + 0.5² + 1.0²) = √3.5 ≈ <strong>1.87 mV<\/strong>（统计独立时更乐观）<\/li>\n<p>工程含义：预算是\"总量守恒\"的——连接器和温漂每吃掉一毫伏，AFE 本体精度就少一档选择空间；不能拿芯片手册的典型值当系统精度。<\/p>\n<\/ul>\n<h4>实例 2：被动均衡有多慢<\/h4>\n<p>电芯电压 3.7 V（示意），外部均衡电阻 150 Ω，AFE 内部开关导通电阻 50 Ω：<\/p>\n<ul>\n<li>均衡电流：I = 3.7 V ÷ (150 + 50) Ω = <strong>18.5 mA<\/strong><\/li>\n<li>总发热：P = 3.7 V × 0.0185 A ≈ <strong>68 mW<\/strong>（外部电阻承担 I² × 150 Ω ≈ 51 mW，芯片内部 ≈ 17 mW）<\/li>\n<li>要抹平 50 Ah 电芯 1% 的 SOC 差（ΔQ = 500 mAh）：t = 500 mAh ÷ 18.5 mA ≈ <strong>27 h<\/strong><\/li>\n<p>结论：被动均衡是\"毫安级微调\"，靠它追 10% 的 SOC 差是灾难；均衡的前提是 SOC 估得准（<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>）。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>主流形态：菊花链 AFE（隔离变压器/电容耦合级联）+ 主控 MCU（<a class=\"xlink\" href=\"#/lesson/HW-02\">HW-02<\/a>）；无线 BMS 把级联链路换成射频（S-18）；<\/li>\n<li>选型五看：通道数 × 精度 × 均衡电流 × 诊断覆盖率 × ASIL 支持声明；<\/li>\n<li>采集周期典型 10~100 ms（示意），与软件调度分层（<a class=\"xlink\" href=\"#/lesson/SW-02\">SW-02<\/a>）配合；<\/li>\n<li>温度点通常远多于 AFE 内置通道，需外置多路复用或专用 NTC 采集芯片（示意架构）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>拿 datasheet 典型精度当系统精度——连接器压降、温漂、级联同步误差都要进预算；<\/li>\n<li>均衡电阻按平均功率选——占空比低但峰值功耗、多通道同开的热堆积要单算；<\/li>\n<li>只验证菊花链\"通不通\"，不验证级联时序——采样不同拍，堆压对账、内阻计算全部受害；<\/li>\n<li>忽略 AFE 自身诊断覆盖率——\"功能正常但故障检不出\"过不了 ISO 26262 的安全论证（S-07）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：AFE 本体 ±2 mV、连接器 ±0.5 mV、温漂 ±1.5 mV，最坏情况总误差多少？是否满足 ±5 mV 要求？ <strong>Q2<\/strong>：为什么说被动均衡\"治标不治本\"？它的正确角色是什么？ <strong>Q3<\/strong>：级联两片 AFE 若不同拍采样（相差 10 ms），会污染哪些计算？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：2.0 + 0.5 + 1.5 = <strong>4.0 mV<\/strong>，最坏情况满足 ±5 mV（余量 1 mV，偏紧）。<\/li>\n<li>Q2：泄流功率只有毫瓦级、速率极慢，且能量白白变热；它的角色是消除长期累积的小失衡（如自放电差异），大失衡要靠充电策略和 SOC 精度去治本。<\/li>\n<li>Q3：单体之和与独立总压对不上（SOC/内阻计算输入矛盾）；不同拍瞬间电流在变，欧姆压降不同，\"同一次快照\"不成立。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020《电动汽车用电池管理系统技术条件》（采集精度的产品级要求，具体条款数值待核对）<\/li>\n<li>S-07：ISO 26262:2018（诊断覆盖率与 ASIL 匹配的原则）<\/li>\n<li>S-18：TI 无线 BMS 官方资料（菊花链 → 无线形态的案例）<\/li>\n<li>S-59：TI bq769x2 / NXP MC33771B / ADI ADBMS181x 产品文档（通道数已核实，2026-11-06）<\/li>\n<li>本课所有具体数字均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（2026-11-06 部分链接已核实）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>免费<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://www.ti.com/lit/sluaa81\" target=\"_blank\" rel=\"noopener\">TI：Cell Balancing With BQ769x2 Battery Monitors（sluaa81）<\/a><\/td><td>A<\/td><td>✅<\/td><td>均衡功能官方文档（对应本文实例 2）<\/td><\/tr><tr><td><a href=\"https://www.nxp.com/products/MC33771B\" target=\"_blank\" rel=\"noopener\">NXP MC33771B 产品页（14 通道）<\/a><\/td><td>A<\/td><td>✅<\/td><td>电池单元控制器代表产品<\/td><\/tr><tr><td><a href=\"https://www.analog.com/en/product-category/battery-monitors-fuel-gauges.html\" target=\"_blank\" rel=\"noopener\">ADI Battery Monitors 产品族页（ADBMS181x，18 通道）<\/a><\/td><td>A<\/td><td>✅<\/td><td>通道数最多的代表性 AFE<\/td><\/tr><tr><td>GB/T 38661-2020 原文<\/td><td>A<\/td><td>—<\/td><td>采集精度条款的权威原文（P-13 待核对）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>GB/T 38661-2020 单体电压采集精度的具体条款数值与允差表述<\/li>\n<li>主流 AFE 精度档位（±1~5 mV）与被动均衡电流典型量级的文献支撑（本课按教学示意值处理）<\/li>\n<li>\"级联不同步导致堆压对账偏差十几 mV\"的实测数据来源（示意量级）<\/li>\n<\/ul>", "text": " 对应节点 hw-01 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置：无（建议先读 sys-01 ）｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 （量级参考主流堆叠式 afe 芯片规格书的常见档位），不是特定厂商实测数据。 1. 为什么需要 afe 主控 mcu 只有一颗，而一个 400 v 包可能有约 96 节电芯、上百个温度点（示意配置）。把 96 路电芯电压直接接进 mcu 既不现实也不安全——afe（analog front end，模拟前端）就是专门解决\"多路、高精度、高共模\"采集的专用芯片，它同时承担四件事： 单体电压采集 ：多通道多路复用 + 高精度 adc（采集精度典型 ±1~5 mv，节点约束；gb/t 38661（s-03）对采集精度有产品级要求，具体条款数值待核对）； 温度采集 ：ntc 分压输入或电流源激励； 被动均衡 ：内置开关 + 外部电阻对单体泄流； 菊花链级联 （daisy-chain）：芯片间用隔离通信级联，省掉大量隔离器件。 没有 afe，\"测准每一节\"这件事在成本和引脚数上都不成立——它是整条信号链（采集 → 传输 → 处理 → 执行）的起点。 2. 机制展开：一块 afe 里有什么 （1）通道前端与 adc 输入引脚 rc 滤波（抗 emi），多路开关耐压需覆盖整堆电压（堆叠式架构）； 逐次逼近 adc（sar, successive approximation register），分辨率典型 14~16 bit（示意）； 同步采样 ：级联多片 afe 必须同拍转换，否则\"各单体之和\"与独立测的总压对不上账，差十几 mv（示意量级）——同步机制与隔离链路见 hw-04 。 （2）被动均衡支路 每通道一对内部开关 + 外部均衡电阻，把偏高电芯的电量经电阻泄掉（被动均衡，能量变热）； 功耗分担是选型关键：外部电阻承担大部分，芯片内部开关也发热（见手算实例 2）。 （3）诊断机制（覆盖率需匹配 asil，s-07） 断线检测 （open-wire detection）：向引脚注入微小电流，观察电压响应异常； 转换结果 crc 、寄存器 ecc、基准电压自检、看门狗； 结论要点：afe 不能是\"哑巴\"——asil c/d 系统要求传感器故障可检测（与 hw-07 呼应）。 （4）已核实的代表性通道数（2026-11-06，厂商产品页口径，s-59） 芯片 厂商 通道/串数 bq769x2 系列 ti 3~16 串 mc33771b nxp 14 通道 adbms181x 系列 adi 18 通道 ——\"单芯片十几个通道、菊花链级联扩展\"的常识口径成立；96 串包需 6~7 片 16 通道级联（示意推算）。 3. 手算实例 实例 1：单体电压精度预算 要求：单体电压测量误差 ≤ ±5 mv（示意指标）。误差链逐项分配（教学示意值）： 误差源 分配值 afe 本体（含 adc 与基准） ±1.5 mv 连接器与走线压降 ±0.5 mv 温漂（−40~85°c 全温区） ±1.0 mv 最坏情况相加：1.5 + 0.5 + 1.0 = 3.0 mv ≤ 5 mv ✓ 均方根合成：√(1.5² + 0.5² + 1.0²) = √3.5 ≈ 1.87 mv （统计独立时更乐观） 工程含义：预算是\"总量守恒\"的——连接器和温漂每吃掉一毫伏，afe 本体精度就少一档选择空间；不能拿芯片手册的典型值当系统精度。 实例 2：被动均衡有多慢 电芯电压 3.7 v（示意），外部均衡电阻 150 ω，afe 内部开关导通电阻 50 ω： 均衡电流：i = 3.7 v ÷ (150 + 50) ω = 18.5 ma 总发热：p = 3.7 v × 0.0185 a ≈ 68 mw （外部电阻承担 i² × 150 ω ≈ 51 mw，芯片内部 ≈ 17 mw） 要抹平 50 ah 电芯 1% 的 soc 差（δq = 500 mah）：t = 500 mah ÷ 18.5 ma ≈ 27 h 结论：被动均衡是\"毫安级微调\"，靠它追 10% 的 soc 差是灾难；均衡的前提是 soc 估得准（ alg-01 ）。 4. 工程实态 主流形态：菊花链 afe（隔离变压器/电容耦合级联）+ 主控 mcu（ hw-02 ）；无线 bms 把级联链路换成射频（s-18）； 选型五看：通道数 × 精度 × 均衡电流 × 诊断覆盖率 × asil 支持声明； 采集周期典型 10~100 ms（示意），与软件调度分层（ sw-02 ）配合； 温度点通常远多于 afe 内置通道，需外置多路复用或专用 ntc 采集芯片（示意架构）。 5. 常见误区 拿 datasheet 典型精度当系统精度——连接器压降、温漂、级联同步误差都要进预算； 均衡电阻按平均功率选——占空比低但峰值功耗、多通道同开的热堆积要单算； 只验证菊花链\"通不通\"，不验证级联时序——采样不同拍，堆压对账、内阻计算全部受害； 忽略 afe 自身诊断覆盖率——\"功能正常但故障检不出\"过不了 iso 26262 的安全论证（s-07）。 6. 自测 q1 ：afe 本体 ±2 mv、连接器 ±0.5 mv、温漂 ±1.5 mv，最坏情况总误差多少？是否满足 ±5 mv 要求？ q2 ：为什么说被动均衡\"治标不治本\"？它的正确角色是什么？ q3 ：级联两片 afe 若不同拍采样（相差 10 ms），会污染哪些计算？ 答案 q1：2.0 + 0.5 + 1.5 = 4.0 mv ，最坏情况满足 ±5 mv（余量 1 mv，偏紧）。 q2：泄流功率只有毫瓦级、速率极慢，且能量白白变热；它的角色是消除长期累积的小失衡（如自放电差异），大失衡要靠充电策略和 soc 精度去治本。 q3：单体之和与独立总压对不上（soc/内阻计算输入矛盾）；不同拍瞬间电流在变，欧姆压降不同，\"同一次快照\"不成立。 来源 s-03：gb/t 38661-2020《电动汽车用电池管理系统技术条件》（采集精度的产品级要求，具体条款数值待核对） s-07：iso 26262:2018（诊断覆盖率与 asil 匹配的原则） s-18：ti 无线 bms 官方资料（菊花链 → 无线形态的案例） s-59：ti bq769x2 / nxp mc33771b / adi adbms181x 产品文档（通道数已核实，2026-11-06） 本课所有具体数字均为教学示意值 延伸资源（2026-11-06 部分链接已核实） 资源 级别 免费 说明 ti：cell balancing with bq769x2 battery monitors（sluaa81） a ✅ 均衡功能官方文档（对应本文实例 2） nxp mc33771b 产品页（14 通道） a ✅ 电池单元控制器代表产品 adi battery monitors 产品族页（adbms181x，18 通道） a ✅ 通道数最多的代表性 afe gb/t 38661-2020 原文 a — 采集精度条款的权威原文（p-13 待核对） 待核对项（本课） gb/t 38661-2020 单体电压采集精度的具体条款数值与允差表述 主流 afe 精度档位（±1~5 mv）与被动均衡电流典型量级的文献支撑（本课按教学示意值处理） \"级联不同步导致堆压对账偏差十几 mv\"的实测数据来源（示意量级） "}, {"id": "HW-02", "title": "课程 HW-02：主控 MCU 与冗余设计", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-02<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>、<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a> ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>，不是特定厂商实测数据。<\/p><\/blockquote>\n<h3>1. 为什么主控 MCU 受 ASIL 约束<\/h3>\n<p>主控 MCU 是状态机（<a class=\"xlink\" href=\"#/lesson/SW-04\">SW-04<\/a>）、SOC/SOP 算法（<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a>）和继电器驱动决策（<a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a>）的宿主。它一旦算错而继续自信地输出，比\"不输出\"更危险——所以节点约束写明：<strong>算力 vs 功能安全冗余（锁步核），MCU 选型受 ASIL 约束<\/strong>（S-07）。<\/p>\n<p>ASIL D 的继电器误闭合、误断开都可能是危害事件（HARA 分析见 <a class=\"xlink\" href=\"#/lesson/SAFE-02\">SAFE-02<\/a>），因此安全相关处理通道必须有<strong>硬件故障可检测<\/strong>能力——这正是冗余设计的动机。<\/p>\n<h3>2. 机制展开：一台 ASIL 级 MCU 的安全部件逐个看<\/h3>\n<p><strong>（1）锁步核（Lockstep）<\/strong>：两个相同的 CPU 核同拍执行同一指令流，比较器逐周期比对输出；不一致 → 立即报错进入安全态。代价：两份核面积，换来\"指令流级\"故障检测。注意它检测的是<strong>硬件随机失效<\/strong>，不防软件共因 bug（两核跑同一份代码）。<\/p>\n<p><strong>（2）存储与总线<\/strong><\/p>\n<ul>\n<li>RAM/Flash ECC（Error Correction Code，纠错码）：单比特错可纠、多比特错可检；<\/li>\n<li>MPU（Memory Protection Unit）分区：算法、协议栈、监控代码互相隔离，防\"越界写垮安全机制\"。<\/li>\n<p><strong>（3）模拟量监控<\/strong><\/p>\n<li>时钟监控（CMU）：主时钟漂移/停振检测；<\/li>\n<li>电压监控（Brown-out detector）：欠压时不允许\"带病续跑\"；<\/li>\n<li>温度传感器：MCU 自身过温。<\/li>\n<p><strong>（4）看门狗与程序流监控<\/strong><\/p>\n<li>窗口看门狗：喂狗既不能太晚也不能太早（早喂 = 程序跑飞后恰好又跑回来）；<\/li>\n<li>程序流监控（question/answer 式）：要求按预定顺序回答\"挑战\"，检测控制流错乱。<\/li>\n<p><strong>（5）安全岛/安全外设<\/strong>：关键 IO（如继电器驱动、AFE 接口）经带自检的 IO 模块，输出回路可回读校验。<\/p>\n<\/ul>\n<h3>3. 手算实例：CPU 负载预算与可调度性<\/h3>\n<p>设任务集（周期 T、最坏执行时间 WCET C，均为教学示意值）：<\/p>\n<table><thead><tr><th>任务<\/th><th>功能<\/th><th>T<\/th><th>C<\/th><\/tr><\/thead><tbody><tr><td>τ1<\/td><td>AFE 数据搬运与检查<\/td><td>1 ms<\/td><td>0.15 ms<\/td><\/tr><tr><td>τ2<\/td><td>保护/控制环<\/td><td>10 ms<\/td><td>1.5 ms<\/td><\/tr><tr><td>τ3<\/td><td>SOC/SOP 算法<\/td><td>100 ms<\/td><td>8 ms<\/td><\/tr><tr><td>τ4<\/td><td>诊断与记录<\/td><td>1000 ms<\/td><td>20 ms<\/td><\/tr><\/tbody><\/table>\n<p><strong>Step 1 — CPU 利用率<\/strong>：U = ΣC/T = 0.15 + 0.15 + 0.08 + 0.02 = <strong>0.40（40%）<\/strong><\/p>\n<p><strong>Step 2 — 速率单调（RM）充分条件<\/strong>：U ≤ n(2^(1/n) − 1)，n = 4： U_max = 4 × (2^0.25 − 1) ≈ 4 × 0.1892 = <strong>0.757<\/strong>。U = 0.40 &lt; 0.757 → 在\"D = T、任务独立、全抢占\"假设下可调度 ✓<\/p>\n<p><strong>Step 3 — 工程含义<\/strong>：40% 的名义占用看似闲，实际还要留中断上下文、抖动、降级模式（故障后任务变多）的余量——量产惯例是稳态占用控制在 50~60% 以内（示意经验值）。此外，锁步双核的<strong>吞吐开销主要在同步与比较<\/strong>，算力规划按单核算。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>车规 ASIL 级 MCU 代表：带锁步核的 TriCore/AURIX 类平台（示意家族，具体型号待核对）；消费级 MCU 不能直接上车（温度/寿命/失效率数据缺失）；<\/li>\n<li>架构常态：<strong>安全机制与应用解耦<\/strong>——监控代码独立于算法，违反即报警（监控概念参考 <a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a>）；<\/li>\n<li>故障处理时间对齐 FTTI（Fault Tolerant Time Interval）：看门狗窗口、看门狗反应时间要按 FTTI 反推，不是拍脑袋；<\/li>\n<li>MCU 的 ASIL 能力由厂商《安全手册》（Safety Manual）背书，BMS 开发方负责按手册集成（S-07 的分工原则）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>\"有锁步核就安全了\"——锁步不防软件共因失效、不防电源/时钟共因，架构级共因分析（<a class=\"xlink\" href=\"#/lesson/SAFE-03\">SAFE-03<\/a>）不可省；<\/li>\n<li>CPU 按 100% 负载设计——故障模式（记录变多、降级策略）会把负载顶上去，超期就是新的危害；<\/li>\n<li>把看门狗当唯一安全机制——窗口监控、ECC、MPU、自检是分层防线，看门狗只是最后一道；<\/li>\n<li>拿 QM 级 MCU 加软件看门狗凑 ASIL D——软件机制不能替代硬件随机失效的检测能力（S-07 原则）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：τ2 的 WCET 若涨到 2.5 ms，U 变为多少？是否仍低于 RM 上界？ <strong>Q2<\/strong>：为什么窗口看门狗比\"按时喂狗就行\"的普通看门狗更强？ <strong>Q3<\/strong>：锁步双核运行同一份代码，哪类失效它管不了？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：U = 0.15 + 0.25 + 0.08 + 0.02 = <strong>0.50<\/strong>，仍 &lt; 0.757，但注意 RM 上界只是充分条件，最终要靠响应时间分析逐任务验证（见 <a class=\"xlink\" href=\"#/lesson/SW-02\">SW-02<\/a>）。<\/li>\n<li>Q2：普通看门狗只检测\"没喂\"，程序跑飞后若恰好周期性喂狗照样漏检；窗口看门狗额外检测\"喂得太早\"，配合问答式程序流监控可抓控制流错乱。<\/li>\n<li>Q3：软件共因失效（同一段代码的 bug 两核同错）、共因硬件环境（同一电源域/时钟源/温度应力）——需要架构多样性与共因分析补充。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-07：ISO 26262:2018（硬件架构度量、安全机制与 FTTI 对齐的原则）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 产品级要求对处理平台的间接约束）<\/li>\n<li>本课任务表数字与 50~60% 负载经验值均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 26262:2018 Part 5 / Part 11 原文<\/td><td>A<\/td><td>硬件安全机制与半导体专用指南<\/td><\/tr><tr><td>Joseph Yiu, <em>The Definitive Guide to ARM Cortex-M3 and Cortex-M4<\/em> (Newnes)<\/td><td>B<\/td><td>嵌入式处理器体系结构经典教材（MPU/NVIC/异常模型）<\/td><\/tr><tr><td>英飞凌 AURIX™ TriCore 安全手册类文档<\/td><td>B<\/td><td>锁步核汽车 MCU 的厂商安全手册范式（待补链）<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>RM 充分条件在真实 BMS（含阻塞、非抢占段）场景的适用性——正式设计必须用响应时间分析替代<\/li>\n<li>\"稳态 CPU 占用 50~60% 以内\"的量产惯例出处（教学示意值）<\/li>\n<li>锁步核比较器的故障检测延迟典型量级（与 FTTI 匹配时的参考值）<\/li>\n<\/ul>", "text": " 对应节点 hw-02 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： hw-01 、 safe-04 ｜ 预计用时 60 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ，不是特定厂商实测数据。 1. 为什么主控 mcu 受 asil 约束 主控 mcu 是状态机（ sw-04 ）、soc/sop 算法（ alg-01 ）和继电器驱动决策（ hw-05 ）的宿主。它一旦算错而继续自信地输出，比\"不输出\"更危险——所以节点约束写明： 算力 vs 功能安全冗余（锁步核），mcu 选型受 asil 约束 （s-07）。 asil d 的继电器误闭合、误断开都可能是危害事件（hara 分析见 safe-02 ），因此安全相关处理通道必须有 硬件故障可检测 能力——这正是冗余设计的动机。 2. 机制展开：一台 asil 级 mcu 的安全部件逐个看 （1）锁步核（lockstep） ：两个相同的 cpu 核同拍执行同一指令流，比较器逐周期比对输出；不一致 → 立即报错进入安全态。代价：两份核面积，换来\"指令流级\"故障检测。注意它检测的是 硬件随机失效 ，不防软件共因 bug（两核跑同一份代码）。 （2）存储与总线 ram/flash ecc（error correction code，纠错码）：单比特错可纠、多比特错可检； mpu（memory protection unit）分区：算法、协议栈、监控代码互相隔离，防\"越界写垮安全机制\"。 （3）模拟量监控 时钟监控（cmu）：主时钟漂移/停振检测； 电压监控（brown-out detector）：欠压时不允许\"带病续跑\"； 温度传感器：mcu 自身过温。 （4）看门狗与程序流监控 窗口看门狗：喂狗既不能太晚也不能太早（早喂 = 程序跑飞后恰好又跑回来）； 程序流监控（question/answer 式）：要求按预定顺序回答\"挑战\"，检测控制流错乱。 （5）安全岛/安全外设 ：关键 io（如继电器驱动、afe 接口）经带自检的 io 模块，输出回路可回读校验。 3. 手算实例：cpu 负载预算与可调度性 设任务集（周期 t、最坏执行时间 wcet c，均为教学示意值）： 任务 功能 t c τ1 afe 数据搬运与检查 1 ms 0.15 ms τ2 保护/控制环 10 ms 1.5 ms τ3 soc/sop 算法 100 ms 8 ms τ4 诊断与记录 1000 ms 20 ms step 1 — cpu 利用率 ：u = σc/t = 0.15 + 0.15 + 0.08 + 0.02 = 0.40（40%） step 2 — 速率单调（rm）充分条件 ：u ≤ n(2^(1/n) − 1)，n = 4： u_max = 4 × (2^0.25 − 1) ≈ 4 × 0.1892 = 0.757 。u = 0.40 &lt; 0.757 → 在\"d = t、任务独立、全抢占\"假设下可调度 ✓ step 3 — 工程含义 ：40% 的名义占用看似闲，实际还要留中断上下文、抖动、降级模式（故障后任务变多）的余量——量产惯例是稳态占用控制在 50~60% 以内（示意经验值）。此外，锁步双核的 吞吐开销主要在同步与比较 ，算力规划按单核算。 4. 工程实态 车规 asil 级 mcu 代表：带锁步核的 tricore/aurix 类平台（示意家族，具体型号待核对）；消费级 mcu 不能直接上车（温度/寿命/失效率数据缺失）； 架构常态： 安全机制与应用解耦 ——监控代码独立于算法，违反即报警（监控概念参考 safe-04 ）； 故障处理时间对齐 ftti（fault tolerant time interval）：看门狗窗口、看门狗反应时间要按 ftti 反推，不是拍脑袋； mcu 的 asil 能力由厂商《安全手册》（safety manual）背书，bms 开发方负责按手册集成（s-07 的分工原则）。 5. 常见误区 \"有锁步核就安全了\"——锁步不防软件共因失效、不防电源/时钟共因，架构级共因分析（ safe-03 ）不可省； cpu 按 100% 负载设计——故障模式（记录变多、降级策略）会把负载顶上去，超期就是新的危害； 把看门狗当唯一安全机制——窗口监控、ecc、mpu、自检是分层防线，看门狗只是最后一道； 拿 qm 级 mcu 加软件看门狗凑 asil d——软件机制不能替代硬件随机失效的检测能力（s-07 原则）。 6. 自测 q1 ：τ2 的 wcet 若涨到 2.5 ms，u 变为多少？是否仍低于 rm 上界？ q2 ：为什么窗口看门狗比\"按时喂狗就行\"的普通看门狗更强？ q3 ：锁步双核运行同一份代码，哪类失效它管不了？ 答案 q1：u = 0.15 + 0.25 + 0.08 + 0.02 = 0.50 ，仍 &lt; 0.757，但注意 rm 上界只是充分条件，最终要靠响应时间分析逐任务验证（见 sw-02 ）。 q2：普通看门狗只检测\"没喂\"，程序跑飞后若恰好周期性喂狗照样漏检；窗口看门狗额外检测\"喂得太早\"，配合问答式程序流监控可抓控制流错乱。 q3：软件共因失效（同一段代码的 bug 两核同错）、共因硬件环境（同一电源域/时钟源/温度应力）——需要架构多样性与共因分析补充。 来源 s-07：iso 26262:2018（硬件架构度量、安全机制与 ftti 对齐的原则） s-03：gb/t 38661-2020（bms 产品级要求对处理平台的间接约束） 本课任务表数字与 50~60% 负载经验值均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iso 26262:2018 part 5 / part 11 原文 a 硬件安全机制与半导体专用指南 joseph yiu, the definitive guide to arm cortex-m3 and cortex-m4 (newnes) b 嵌入式处理器体系结构经典教材（mpu/nvic/异常模型） 英飞凌 aurix™ tricore 安全手册类文档 b 锁步核汽车 mcu 的厂商安全手册范式（待补链） 待核对项（本课） rm 充分条件在真实 bms（含阻塞、非抢占段）场景的适用性——正式设计必须用响应时间分析替代 \"稳态 cpu 占用 50~60% 以内\"的量产惯例出处（教学示意值） 锁步核比较器的故障检测延迟典型量级（与 ftti 匹配时的参考值） "}, {"id": "HW-03", "title": "课程 HW-03：电流传感——分流器 vs 霍尔", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-03<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>，不是特定厂商实测数据。<\/p><\/blockquote>\n<h3>1. 为什么电流是\"源头输入\"<\/h3>\n<p>电流 I 进两个最关键的下游：<\/p>\n<ol>\n<li><strong>SOC 安时积分<\/strong>：SOC 误差 = ∫(I 测量误差)dt——零漂 0.1 A，100 Ah 包每天行驶 2 h 就漂 0.2%（<a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a> 实例 3）；<\/li>\n<li><strong>SOP 与过流保护<\/strong>：功率限值 = U × I 的上限计算、过流告警的触发条件都直接用 I。<\/li>\n<p>节点约束点题：<strong>分流器精度高但需隔离且有功耗；霍尔无接触但温漂大；需冗余与零漂诊断<\/strong>。本课就是把这三句话拆开算清楚。<\/p>\n<\/ol>\n<h3>2. 机制展开：两条技术路线逐个看<\/h3>\n<p><strong>（1）分流器（Shunt）——欧姆定律路线<\/strong><\/p>\n<ul>\n<li>一颗 mΩ 级精密电阻串在高压回路，测其压降 V = I·R；<\/li>\n<li>优点：线性度极好、无磁滞、温漂可标定（电阻温漂系数低，典型几十 ppm/°C 量级，示意）；<\/li>\n<li>代价 a：<strong>隔离<\/strong>——分流器泡在高压里，信号必须经隔离放大器/隔离 ADC 送低压侧（隔离设计见 <a class=\"xlink\" href=\"#/lesson/HW-04\">HW-04<\/a>）；<\/li>\n<li>代价 b：<strong>功耗与自热<\/strong>——P = I²R，自热又改变 R（需补偿）；<\/li>\n<li>代价 c：信号只有几十 mV，需 PGA（可编程增益放大）+ 高分辨率 ADC。<\/li>\n<p><strong>（2）霍尔（Hall）——磁场路线<\/strong><\/p>\n<li>载流导体产生磁场，霍尔元件/磁环感应后输出电压，<strong>天然隔离、无接触<\/strong>；<\/li>\n<li>开环霍尔便宜但漂移大；闭环（磁平衡）霍尔精度更高、成本更高；<\/li>\n<li>缺点：零偏温漂大（随温度漂移可达安培级，示意），有磁滞与非线性；\"零电流时输出不为零\"是其固有顽疾。<\/li>\n<p><strong>（3）冗余与诊断的落点<\/strong>：两路线误差特性<strong>互补<\/strong>（分流器怕自热漂增益、霍尔怕温漂漂零点），这是双方案交叉校验（<a class=\"xlink\" href=\"#/lesson/HW-07\">HW-07<\/a>）的物理基础。<\/p>\n<\/ul>\n<h3>3. 手算实例：分流器选型与零漂代价<\/h3>\n<p><strong>场景<\/strong>（教学示意值）：额定 200 A，峰值 400 A（10 s 脉冲），选 R = 50 µΩ。<\/p>\n<p><strong>Step 1 — 满量程信号<\/strong>：V = 400 A × 50 µΩ = <strong>20 mV<\/strong> 信号极小 → 需隔离 PGA 放大后进 ADC。<\/p>\n<p><strong>Step 2 — 功耗与热设计<\/strong>：<\/p>\n<ul>\n<li>峰值脉冲：P = 400² × 50 µΩ = <strong>8 W<\/strong>（10 s 脉冲，按脉冲能量容量选型）<\/li>\n<li>额定持续：P = 200² × 50 µΩ = <strong>2 W<\/strong>（持续发热，需散热设计）<\/li>\n<p><strong>Step 3 — 分辨率核算<\/strong>：PGA 双极性 ±25 mV 量程（跨度 50 mV），16 bit ADC： LSB = 50 mV ÷ 65536 ≈ 0.76 µV → 电流分辨力 = 0.76 µV ÷ 50 µΩ ≈ <strong>15 mA<\/strong> ✓（远小于关心量级）<\/p>\n<p><strong>Step 4 — 零漂对 SOC 的代价<\/strong>（与 ALG-01 对账）： 分流器方案系统零偏若达 0.1 A → 100 Ah 包、每天 2 h 行驶：漂移 = 0.1 × 2 ÷ 100 = <strong>0.2%/天<\/strong>； 霍尔方案零偏温漂若达 ±1 A（示意）→ 同条件 <strong>2%/天<\/strong>——一周不校准就是十几个百分点。 <strong>结论：零漂是选霍尔后必须用\"软件校零+交叉校验\"补的账，不是霍尔不能用，而是要用法正确。<\/strong><\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>量产车常见配置：<strong>双方案互补<\/strong>（分流器主测 + 霍尔冗余）或双分流器互备（示意架构），交叉校验逻辑见 <a class=\"xlink\" href=\"#/lesson/HW-07\">HW-07<\/a>；<\/li>\n<li>智能电流传感器：传感 + 数字化 + 校正在传感器内完成，经 CAN/SENT 类接口输出报文，零偏随温度的补偿表出厂标定；<\/li>\n<li><strong>零漂诊断三招<\/strong>：上电回路无电流时校零；充电末端电流归零窗口复校；双传感器一致性检查触发 DTC；<\/li>\n<li>分流器安装位置要避开热集中区——自热导致的增益漂是实测误差的第一大来源（工程共识，定量数据待核对）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>只看\"精度 %FS\"不看温漂——霍尔规格书的精度常指常温，冬季漂移另算；<\/li>\n<li>忽略分流器自热——2 W 持续发热会改变阻值，不做温度补偿等于白买精密电阻；<\/li>\n<li>霍尔\"零偏校一次永久准\"——温漂是连续的，必须周期性校零或交叉校验；<\/li>\n<li>把两颗传感器接在同一个采集电源上——共因失效让冗余变成摆设（HW-07 详述）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：分流器 R = 100 µΩ、峰值 400 A，峰值功耗多少？满量程压降多少？对信号链意味着什么？ <strong>Q2<\/strong>：为什么说\"分流器+霍尔\"的异构冗余优于\"双霍尔\"？ <strong>Q3<\/strong>：零偏 0.3 A、300 Ah 包、每天行驶 2 h，30 天不校准的 SOC 漂移是多少？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：P = 400² × 100 µΩ = <strong>16 W<\/strong>（脉冲选型）；V = <strong>40 mV<\/strong>——信号大了一倍但热翻倍，PGA 量程与散热都要重算。<\/li>\n<li>Q2：两路线失效模式不同（增益漂 vs 零漂、磁滞 vs 自热），交叉校验能区分\"谁在撒谎\"；双霍尔共享磁场路线的共因（温度、磁干扰），校验能力打折。<\/li>\n<li>Q3：0.3 × 2 × 30 = 18 Ah ÷ 300 Ah = <strong>6%<\/strong>（与 ALG-01 自测 Q3 同构）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（电流采集精度的产品级要求）<\/li>\n<li>S-16：G. Plett, <em>Battery Management Systems<\/em>（安时积分误差来源框架，联动 ALG-01）<\/li>\n<li>本课选型数字（50 µΩ、400 A、±25 mV 量程、±1 A 温漂等）均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>GB/T 38661-2020 原文<\/td><td>A<\/td><td>电流采集精度条款原文<\/td><\/tr><tr><td>LEM 等霍尔传感器厂商选型手册<\/td><td>B<\/td><td>闭环/开环霍尔特性与温漂特性（待补链）<\/td><\/tr><tr><td>本项目课程 <a class=\"xlink\" href=\"#/lesson/ALG-01\">ALG-01<\/a><\/td><td>—<\/td><td>零漂 → SOC 漂移的算法侧对账<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>分流器温漂系数（几十 ppm/°C）与霍尔零偏温漂（安培级）的典型量级文献<\/li>\n<li>量产车\"双方案互补\"配置的统计性证据（示意架构表述）<\/li>\n<li>智能电流传感器接口（SENT 类）在 BMS 中的采用现状<\/li>\n<\/ul>", "text": " 对应节点 hw-03 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： alg-01 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ，不是特定厂商实测数据。 1. 为什么电流是\"源头输入\" 电流 i 进两个最关键的下游： soc 安时积分 ：soc 误差 = ∫(i 测量误差)dt——零漂 0.1 a，100 ah 包每天行驶 2 h 就漂 0.2%（ alg-01 实例 3）； sop 与过流保护 ：功率限值 = u × i 的上限计算、过流告警的触发条件都直接用 i。 节点约束点题： 分流器精度高但需隔离且有功耗；霍尔无接触但温漂大；需冗余与零漂诊断 。本课就是把这三句话拆开算清楚。 2. 机制展开：两条技术路线逐个看 （1）分流器（shunt）——欧姆定律路线 一颗 mω 级精密电阻串在高压回路，测其压降 v = i·r； 优点：线性度极好、无磁滞、温漂可标定（电阻温漂系数低，典型几十 ppm/°c 量级，示意）； 代价 a： 隔离 ——分流器泡在高压里，信号必须经隔离放大器/隔离 adc 送低压侧（隔离设计见 hw-04 ）； 代价 b： 功耗与自热 ——p = i²r，自热又改变 r（需补偿）； 代价 c：信号只有几十 mv，需 pga（可编程增益放大）+ 高分辨率 adc。 （2）霍尔（hall）——磁场路线 载流导体产生磁场，霍尔元件/磁环感应后输出电压， 天然隔离、无接触 ； 开环霍尔便宜但漂移大；闭环（磁平衡）霍尔精度更高、成本更高； 缺点：零偏温漂大（随温度漂移可达安培级，示意），有磁滞与非线性；\"零电流时输出不为零\"是其固有顽疾。 （3）冗余与诊断的落点 ：两路线误差特性 互补 （分流器怕自热漂增益、霍尔怕温漂漂零点），这是双方案交叉校验（ hw-07 ）的物理基础。 3. 手算实例：分流器选型与零漂代价 场景 （教学示意值）：额定 200 a，峰值 400 a（10 s 脉冲），选 r = 50 µω。 step 1 — 满量程信号 ：v = 400 a × 50 µω = 20 mv 信号极小 → 需隔离 pga 放大后进 adc。 step 2 — 功耗与热设计 ： 峰值脉冲：p = 400² × 50 µω = 8 w （10 s 脉冲，按脉冲能量容量选型） 额定持续：p = 200² × 50 µω = 2 w （持续发热，需散热设计） step 3 — 分辨率核算 ：pga 双极性 ±25 mv 量程（跨度 50 mv），16 bit adc： lsb = 50 mv ÷ 65536 ≈ 0.76 µv → 电流分辨力 = 0.76 µv ÷ 50 µω ≈ 15 ma ✓（远小于关心量级） step 4 — 零漂对 soc 的代价 （与 alg-01 对账）： 分流器方案系统零偏若达 0.1 a → 100 ah 包、每天 2 h 行驶：漂移 = 0.1 × 2 ÷ 100 = 0.2%/天 ； 霍尔方案零偏温漂若达 ±1 a（示意）→ 同条件 2%/天 ——一周不校准就是十几个百分点。 结论：零漂是选霍尔后必须用\"软件校零+交叉校验\"补的账，不是霍尔不能用，而是要用法正确。 4. 工程实态 量产车常见配置： 双方案互补 （分流器主测 + 霍尔冗余）或双分流器互备（示意架构），交叉校验逻辑见 hw-07 ； 智能电流传感器：传感 + 数字化 + 校正在传感器内完成，经 can/sent 类接口输出报文，零偏随温度的补偿表出厂标定； 零漂诊断三招 ：上电回路无电流时校零；充电末端电流归零窗口复校；双传感器一致性检查触发 dtc； 分流器安装位置要避开热集中区——自热导致的增益漂是实测误差的第一大来源（工程共识，定量数据待核对）。 5. 常见误区 只看\"精度 %fs\"不看温漂——霍尔规格书的精度常指常温，冬季漂移另算； 忽略分流器自热——2 w 持续发热会改变阻值，不做温度补偿等于白买精密电阻； 霍尔\"零偏校一次永久准\"——温漂是连续的，必须周期性校零或交叉校验； 把两颗传感器接在同一个采集电源上——共因失效让冗余变成摆设（hw-07 详述）。 6. 自测 q1 ：分流器 r = 100 µω、峰值 400 a，峰值功耗多少？满量程压降多少？对信号链意味着什么？ q2 ：为什么说\"分流器+霍尔\"的异构冗余优于\"双霍尔\"？ q3 ：零偏 0.3 a、300 ah 包、每天行驶 2 h，30 天不校准的 soc 漂移是多少？ 答案 q1：p = 400² × 100 µω = 16 w （脉冲选型）；v = 40 mv ——信号大了一倍但热翻倍，pga 量程与散热都要重算。 q2：两路线失效模式不同（增益漂 vs 零漂、磁滞 vs 自热），交叉校验能区分\"谁在撒谎\"；双霍尔共享磁场路线的共因（温度、磁干扰），校验能力打折。 q3：0.3 × 2 × 30 = 18 ah ÷ 300 ah = 6% （与 alg-01 自测 q3 同构）。 来源 s-03：gb/t 38661-2020（电流采集精度的产品级要求） s-16：g. plett, battery management systems （安时积分误差来源框架，联动 alg-01） 本课选型数字（50 µω、400 a、±25 mv 量程、±1 a 温漂等）均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 gb/t 38661-2020 原文 a 电流采集精度条款原文 lem 等霍尔传感器厂商选型手册 b 闭环/开环霍尔特性与温漂特性（待补链） 本项目课程 alg-01 — 零漂 → soc 漂移的算法侧对账 待核对项（本课） 分流器温漂系数（几十 ppm/°c）与霍尔零偏温漂（安培级）的典型量级文献 量产车\"双方案互补\"配置的统计性证据（示意架构表述） 智能电流传感器接口（sent 类）在 bms 中的采用现状 "}, {"id": "HW-04", "title": "课程 HW-04：高压采样与隔离", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-04<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>、<a class=\"xlink\" href=\"#/lesson/HW-03\">HW-03<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；爬电/耐压选型须以 IEC 60664-1 表格与器件规格书为准，本课只给方法框架。<\/p><\/blockquote>\n<h3>1. 为什么高压侧测量必须隔离<\/h3>\n<p>总压采样喂三个下游：绝缘监测的基准（GB 18384（S-04）、UN R100（S-13）都有整车级绝缘要求）、预充完成判断（<a class=\"xlink\" href=\"#/lesson/HW-05\">HW-05<\/a>）、SOP 功率计算。而低压侧 MCU 是人手可触的电路——<strong>高压必须经隔离屏障才能进低压测量<\/strong>。节点约束点题：<strong>隔离耐压与爬电距离；多芯片级联的采样同步误差<\/strong>。<\/p>\n<h3>2. 机制展开：从分压到隔离的三段链<\/h3>\n<p><strong>（1）分压网络<\/strong>：高压经电阻链衰减到 ADC 可用量程（手算实例 1）。要点：电阻链由多颗电阻串联组成——单颗电阻耐压有限，且分摊功耗。<\/p>\n<p><strong>（2）隔离器件<\/strong>（三类主流，示意分类）：<\/p>\n<ul>\n<li><strong>隔离放大器<\/strong>：模拟信号跨隔离屏障传输，误差链含器件增益误差；<\/li>\n<li><strong>数字隔离器 + 低压 ADC<\/strong>：ADC 就地转换，数字信号过隔离（SPI 隔离/数字隔离器）；<\/li>\n<li><strong>隔离式 AFE 菊花链<\/strong>：电芯级采集天然带隔离（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>），总压另行独立测量。<\/li>\n<p><strong>（3）绝缘配合三要素<\/strong>（IEC 60664-1《低压系统内设备的绝缘配合》的方法框架）：<\/p>\n<li><strong>工作电压<\/strong>：长期施加的电压（800 V 系统按最大工作电压算）；<\/li>\n<li><strong>隔离耐压<\/strong>：型式试验电压（如 reinforced insulation 强化绝缘的耐压试验档位，常用 kVrms/1 min 表述，具体档位查器件规格书，示意）；<\/li>\n<li><strong>爬电距离/电气间隙<\/strong>：沿绝缘表面/空中最短距离——由工作电压、污染等级（PD, Pollution Degree）、材料组决定，查表得出（800 V、PD2 量级的爬电要求为十几 mm 级，<strong>示意值，待核对<\/strong>）。<\/li>\n<p><strong>（4）同步误差<\/strong>：总压若由\"单体求和\"获得，与独立总压通道之间必须同拍采样（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>），否则动态工况下对账差值会被误判为故障。<\/p>\n<\/ul>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：分压采样电阻计算<\/h4>\n<p>目标：800 V 总压（示意）衰减到 0~4 V 进 ADC。取比例 200:1：<\/p>\n<ul>\n<li>上臂 R_top = 4 MΩ（4 × 1 MΩ 串联，每颗分摊 200 V）；<\/li>\n<li>下臂 R_bot = 4 MΩ ÷ 199 ≈ <strong>20.1 kΩ<\/strong>；<\/li>\n<li>验证：V_out = 800 × 20.1k ÷ (4020.1k) ≈ <strong>3.999 V<\/strong> ✓<\/li>\n<li>每颗上臂电阻：200 V、P = 200² ÷ 1 MΩ = <strong>40 mW<\/strong>（选额定 ≥0.1 W 的封装即有余量）；<\/li>\n<li>常驻泄漏：I = 800 ÷ 4.02 MΩ ≈ 0.2 mA → 持续消耗 <strong>0.16 W<\/strong>——驻车工况对低压电池也是持续的负担，不能无脑加大精度用更小阻值。<\/li>\n<\/ul>\n<h4>实例 2：电阻容差与标定的必要性<\/h4>\n<p>电阻用 0.1% 档：比例最坏误差 ≈ ±0.2%（上下臂各 0.1%、方向相反）→ 800 V 读数误差 ≈ <strong>±1.6 V<\/strong>。 远超 BMS 对总压的精度需求（总压精度典型 0.1%~0.5% 级，示意）→ <strong>必须产线两点标定<\/strong>，标定后残余误差由电阻温度系数主导（示意：±25 ppm/°C × 60 K 温差 ≈ 0.15% → ±1.2 V @800 V，仍需软件温度补偿）。这就是\"高精度不是买电阻买出来的，是标定+补偿设计出来的\"。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>隔离器件按<strong>强化绝缘<\/strong>选型（800 V 平台常态），耐压与爬电要求整车厂会在企标中加严于基础标准；<\/li>\n<li>绝缘电阻阈值：GB 18384（S-04）对整车绝缘电阻有定量要求（Ω/V 级量级，具体数值与工况待核对），监测电路（不平衡电桥/主动注入法）据此设计，细节归 <code>HV<\/code> 域（../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span>）；<\/li>\n<li>多片级联同步由 AFE 的触发链保证（同拍转换命令），设计时要核对\"触发到转换\"的确定性延迟；<\/li>\n<li>高压采样点常冗余：独立总压通道与单体求和互查（<a class=\"xlink\" href=\"#/lesson/HW-07\">HW-07<\/a>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>只查隔离耐压不查工作电压/爬电——耐压是瞬态试验，工作电压下的表面爬电才是长期失效路径；<\/li>\n<li>分压电阻用普通 5% 档还指望\"软件校一下\"——温漂加非线性是校不准的；<\/li>\n<li>忽略分压网络常驻泄漏电流——驻车漏电投诉的隐形来源之一；<\/li>\n<li>\"单体和 = 总压\"不做一致性检查——求和通道与独立通道各自漂移无人发现。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：若把实例 1 的 R_bot 改为 20 kΩ，800 V 时 V_out 是多少？误差多少？ <strong>Q2<\/strong>：为什么上臂用 4 颗 1 MΩ 串联而不是 1 颗 4 MΩ？ <strong>Q3<\/strong>：污染等级 PD2 与 PD3 对爬电距离的影响方向是什么？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：V_out = 800 × 20k ÷ 4020k ≈ <strong>3.98 V<\/strong>，比例偏差 ≈ 0.5%——单靠电阻档位凑不出精确比例，仍要标定；同时泄漏电流略增。<\/li>\n<li>Q2：①单颗电阻额定耐压不够；②功耗分摊（每颗 40 mW 而非 160 mW）；③表面爬电路径分段，可靠性更高。<\/li>\n<li>Q3：污染越重（PD 数越大），相同工作电压要求的爬电距离越长——PD3 &gt; PD2（方向性结论；具体表值查 IEC 60664-1 原文）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-04：GB 18384-2020《电动汽车安全要求》（整车绝缘电阻要求）<\/li>\n<li>S-13：UN R100（蓄电池安全型式认证）<\/li>\n<li>S-07：ISO 26262:2018（采样通道的安全机制原则）<\/li>\n<li>IEC 60664-1《低压系统内设备的绝缘配合》（方法框架，爬电表值待核对）<\/li>\n<li>本课分压电阻、800 V、±25 ppm/°C 等均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>IEC 60664-1 原文<\/td><td>A<\/td><td>爬电距离/电气间隙查表的唯一权威<\/td><\/tr><tr><td>GB 18384-2020 原文<\/td><td>A<\/td><td>绝缘电阻要求条款<\/td><\/tr><tr><td>UN R100 原文<\/td><td>A<\/td><td>高压系统型式认证框架<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>800 V、PD2、材料组 III 下爬电距离的具体表值（本课\"十几 mm\"为示意量级）<\/li>\n<li>GB 18384-2020 绝缘电阻要求的定量数值（Ω/V 级，工况与判据细节）<\/li>\n<li>隔离器件强化绝缘耐压常用档位（kVrms/1 min）的典型规格书数据<\/li>\n<\/ul>", "text": " 对应节点 hw-04 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： hw-01 、 hw-03 ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 ；爬电/耐压选型须以 iec 60664-1 表格与器件规格书为准，本课只给方法框架。 1. 为什么高压侧测量必须隔离 总压采样喂三个下游：绝缘监测的基准（gb 18384（s-04）、un r100（s-13）都有整车级绝缘要求）、预充完成判断（ hw-05 ）、sop 功率计算。而低压侧 mcu 是人手可触的电路—— 高压必须经隔离屏障才能进低压测量 。节点约束点题： 隔离耐压与爬电距离；多芯片级联的采样同步误差 。 2. 机制展开：从分压到隔离的三段链 （1）分压网络 ：高压经电阻链衰减到 adc 可用量程（手算实例 1）。要点：电阻链由多颗电阻串联组成——单颗电阻耐压有限，且分摊功耗。 （2）隔离器件 （三类主流，示意分类）： 隔离放大器 ：模拟信号跨隔离屏障传输，误差链含器件增益误差； 数字隔离器 + 低压 adc ：adc 就地转换，数字信号过隔离（spi 隔离/数字隔离器）； 隔离式 afe 菊花链 ：电芯级采集天然带隔离（ hw-01 ），总压另行独立测量。 （3）绝缘配合三要素 （iec 60664-1《低压系统内设备的绝缘配合》的方法框架）： 工作电压 ：长期施加的电压（800 v 系统按最大工作电压算）； 隔离耐压 ：型式试验电压（如 reinforced insulation 强化绝缘的耐压试验档位，常用 kvrms/1 min 表述，具体档位查器件规格书，示意）； 爬电距离/电气间隙 ：沿绝缘表面/空中最短距离——由工作电压、污染等级（pd, pollution degree）、材料组决定，查表得出（800 v、pd2 量级的爬电要求为十几 mm 级， 示意值，待核对 ）。 （4）同步误差 ：总压若由\"单体求和\"获得，与独立总压通道之间必须同拍采样（ hw-01 ），否则动态工况下对账差值会被误判为故障。 3. 手算实例 实例 1：分压采样电阻计算 目标：800 v 总压（示意）衰减到 0~4 v 进 adc。取比例 200:1： 上臂 r_top = 4 mω（4 × 1 mω 串联，每颗分摊 200 v）； 下臂 r_bot = 4 mω ÷ 199 ≈ 20.1 kω ； 验证：v_out = 800 × 20.1k ÷ (4020.1k) ≈ 3.999 v ✓ 每颗上臂电阻：200 v、p = 200² ÷ 1 mω = 40 mw （选额定 ≥0.1 w 的封装即有余量）； 常驻泄漏：i = 800 ÷ 4.02 mω ≈ 0.2 ma → 持续消耗 0.16 w ——驻车工况对低压电池也是持续的负担，不能无脑加大精度用更小阻值。 实例 2：电阻容差与标定的必要性 电阻用 0.1% 档：比例最坏误差 ≈ ±0.2%（上下臂各 0.1%、方向相反）→ 800 v 读数误差 ≈ ±1.6 v 。 远超 bms 对总压的精度需求（总压精度典型 0.1%~0.5% 级，示意）→ 必须产线两点标定 ，标定后残余误差由电阻温度系数主导（示意：±25 ppm/°c × 60 k 温差 ≈ 0.15% → ±1.2 v @800 v，仍需软件温度补偿）。这就是\"高精度不是买电阻买出来的，是标定+补偿设计出来的\"。 4. 工程实态 隔离器件按 强化绝缘 选型（800 v 平台常态），耐压与爬电要求整车厂会在企标中加严于基础标准； 绝缘电阻阈值：gb 18384（s-04）对整车绝缘电阻有定量要求（ω/v 级量级，具体数值与工况待核对），监测电路（不平衡电桥/主动注入法）据此设计，细节归 hv 域（../domains/05-高压.md （项目文件 ../domains/05-高压.md） ）； 多片级联同步由 afe 的触发链保证（同拍转换命令），设计时要核对\"触发到转换\"的确定性延迟； 高压采样点常冗余：独立总压通道与单体求和互查（ hw-07 ）。 5. 常见误区 只查隔离耐压不查工作电压/爬电——耐压是瞬态试验，工作电压下的表面爬电才是长期失效路径； 分压电阻用普通 5% 档还指望\"软件校一下\"——温漂加非线性是校不准的； 忽略分压网络常驻泄漏电流——驻车漏电投诉的隐形来源之一； \"单体和 = 总压\"不做一致性检查——求和通道与独立通道各自漂移无人发现。 6. 自测 q1 ：若把实例 1 的 r_bot 改为 20 kω，800 v 时 v_out 是多少？误差多少？ q2 ：为什么上臂用 4 颗 1 mω 串联而不是 1 颗 4 mω？ q3 ：污染等级 pd2 与 pd3 对爬电距离的影响方向是什么？ 答案 q1：v_out = 800 × 20k ÷ 4020k ≈ 3.98 v ，比例偏差 ≈ 0.5%——单靠电阻档位凑不出精确比例，仍要标定；同时泄漏电流略增。 q2：①单颗电阻额定耐压不够；②功耗分摊（每颗 40 mw 而非 160 mw）；③表面爬电路径分段，可靠性更高。 q3：污染越重（pd 数越大），相同工作电压要求的爬电距离越长——pd3 &gt; pd2（方向性结论；具体表值查 iec 60664-1 原文）。 来源 s-04：gb 18384-2020《电动汽车安全要求》（整车绝缘电阻要求） s-13：un r100（蓄电池安全型式认证） s-07：iso 26262:2018（采样通道的安全机制原则） iec 60664-1《低压系统内设备的绝缘配合》（方法框架，爬电表值待核对） 本课分压电阻、800 v、±25 ppm/°c 等均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 iec 60664-1 原文 a 爬电距离/电气间隙查表的唯一权威 gb 18384-2020 原文 a 绝缘电阻要求条款 un r100 原文 a 高压系统型式认证框架 待核对项（本课） 800 v、pd2、材料组 iii 下爬电距离的具体表值（本课\"十几 mm\"为示意量级） gb 18384-2020 绝缘电阻要求的定量数值（ω/v 级，工况与判据细节） 隔离器件强化绝缘耐压常用档位（kvrms/1 min）的典型规格书数据 "}, {"id": "HW-05", "title": "课程 HW-05：继电器/预充驱动与执行器", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-05<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/HW-04\">HW-04<\/a>；高压侧细节联动 ../domains/05-高压.md <span class=\"fileref\">（项目文件 ../domains/05-高压.md）<\/span> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>。<\/p><\/blockquote>\n<h3>1. 为什么执行器是\"最后一公里\"<\/h3>\n<p>BMS 测得再准、算得再对，最终落到物理世界的动作只有几个：<strong>闭合/断开主接触器、控制预充、驱动加热/冷却<\/strong>。继电器（接触器）该断不断（粘连）或该合不合（拒动），直接就是危害事件——节点约束点题：<strong>驱动需诊断（短路/断路/粘连）；失效安全位置（常开/常闭）需按整车策略定<\/strong>。<\/p>\n<p>典型高压回路布局（示意）：主正接触器 + 主负接触器 + 与主正并联的\"预充接触器 + 预充电阻\"。失效安全策略：<strong>主接触器选常开<\/strong>——失去驱动电源时自动断开高压（按整车策略确定，节点约束）。<\/p>\n<h3>2. 机制展开：驱动、诊断、预充逐个看<\/h3>\n<p><strong>（1）线圈驱动<\/strong>：低压侧低边驱动（N-MOS/NPN 下拉线圈负端），线圈感性，断开瞬间需钳位（续流二极管/齐纳）保护驱动器。要点：钳位方式影响释放时间——续流二极管让磁场缓慢释放，继电器断开慢；齐纳钳位更快（快断对安全有利）。<\/p>\n<p><strong>（2）驱动诊断（三态检测，示意方法）<\/strong><\/p>\n<ul>\n<li><strong>断路<\/strong>：线圈未通电时上拉检测，读不到回路 → 断线；<\/li>\n<li><strong>短路<\/strong>：驱动器过流检测/线圈电流异常；<\/li>\n<li><strong>粘连（welded）<\/strong>：<strong>闭合前<\/strong>测负载侧电压——若主接触器断开时负载侧仍测到电池电压，说明触点粘死。<\/li>\n<p><strong>（3）预充（Precharge）<\/strong>：闭合主接触器前，先经预充电阻给逆变器母线电容充电，避免直接闭合时的巨大浪涌电流（手算实例）。预充完成判据：母线电压 ≥ 95% × 电池包电压（示意判据，与 <a class=\"xlink\" href=\"#/lesson/SW-04\">SW-04<\/a> 迁移条件一致）。<\/p>\n<p><strong>（4）执行器家族<\/strong>：除接触器外还有正温度系数加热膜（PTC）、液体加热器、冷却水泵/风扇——共同点是\"驱动+诊断\"成对出现，过温/断路/短路都要可检测。<\/p>\n<\/ul>\n<h3>3. 手算实例：预充电阻与粘连判据<\/h3>\n<p><strong>场景<\/strong>（教学示意值）：电池包 400 V，逆变器母线电容 C = 500 µF，预充电阻 R = 100 Ω，主回路等效电阻 R_loop ≈ 20 mΩ。<\/p>\n<p><strong>Step 1 — 预充电阻要吃掉多少能量<\/strong>： E = ½CV² = 0.5 × 500 µF × 400² = <strong>40 J<\/strong>。 关键洞察：<strong>这个 40 J 与 R 无关<\/strong>——不管阻值多大，电容充到 400 V 就有 40 J 在电阻上变成热。所以预充电阻按<strong>脉冲能量容量<\/strong>选型（如 40 J/次，示意档位），不是按平均功率。<\/p>\n<p><strong>Step 2 — 时间与峰值电流<\/strong>：<\/p>\n<ul>\n<li>峰值电流（闭合瞬间）：I₀ = 400 ÷ 100 = <strong>4 A<\/strong><\/li>\n<li>时间常数 τ = RC = 100 Ω × 500 µF = 50 ms → 充到 95% 需 3τ = <strong>150 ms<\/strong><\/li>\n<li>对比：若不预充直接闭合，浪涌 I = 400 ÷ 20 mΩ = <strong>20000 A<\/strong>——接触器会焊死，这就是预充存在的理由。<\/li>\n<p><strong>Step 3 — 为什么判据是 95% 而不是 90%<\/strong>： 90% 时剩余电压 40 V，直接闭合冲击 = 40 ÷ 20 mΩ = 2000 A；95% 时剩余 20 V → 冲击 <strong>1000 A<\/strong>（仍可观，实际设计常取 97~98% 或叠加限流策略，示意惯例）。判据每提高 5%，冲击减半。<\/p>\n<p><strong>Step 4 — 线圈侧参数<\/strong>：24 V 线圈、电阻 240 Ω → 保持电流 100 mA、功耗 2.4 W；线圈电感 100 mH（示意）→ 断开瞬间释放能量 ½LI² = 0.5 mJ，由钳位电路吸收。<\/p>\n<\/ul>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>预充超时是标准故障：规定时间内母线电压不达标 → 报 DTC、禁止闭合主接触器（状态机处理见 <a class=\"xlink\" href=\"#/lesson/SW-04\">SW-04<\/a>）；<\/li>\n<li>粘连检测在<strong>每次上电前<\/strong>执行（车辆静置、回路无电流时最可靠），检测失败则禁止上电；<\/li>\n<li>双路主动断开：主正/主负均为常开且独立诊断，单点粘连仍可断开回路；<\/li>\n<li>驱动芯片集成诊断（过流/断线/过温回读）已是主流，BMS 软件负责解释诊断位并联动 DTC（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>预充电阻按平均功率选型——40 J 脉冲能量才是选型量，平均功率会严重低估；<\/li>\n<li>预充判据随手写 90%——冲击电流翻倍，接触器寿命骤降；<\/li>\n<li>粘连检测只在下电后做一次——上电前必须重测，粘连可能发生在任意断开动作之后；<\/li>\n<li>续流二极管图省事——断开时间变长，紧急分断场景慢几百毫秒（对 FTTI 敏感，<a class=\"xlink\" href=\"#/lesson/SAFE-04\">SAFE-04<\/a>）。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：C = 1000 µF、V = 800 V 时预充电阻吸收的能量是多少？与 R 有关吗？ <strong>Q2<\/strong>：R = 100 Ω 不变、C 翻倍到 1000 µF，充到 95% 需要多久？ <strong>Q3<\/strong>：为什么粘连检测要选\"回路无电流\"的时机？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：E = ½ × 1000 µF × 800² = <strong>320 J<\/strong>；与 R 无关（R 只决定时间与峰值电流）。<\/li>\n<li>Q2：τ = 100 Ω × 1000 µF = 100 ms，3τ = <strong>300 ms<\/strong>——能量翻倍、时间翻倍，电阻选型与预充超时阈值都要重设。<\/li>\n<li>Q3：有电流时负载侧电压 = 电池电压 − 回路压降，\"测到电压\"无法区分是触点粘连还是正常导通；无电流时负载侧出现电压只能来自粘死的触点（或漏电，需排除）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-03：GB/T 38661-2020（BMS 对高压通断控制的产品级要求）<\/li>\n<li>S-13：UN R100（高压系统安全框架）；S-04：GB 18384-2020（整车安全要求）<\/li>\n<li>本课 400 V/500 µF/100 Ω/20 mΩ/24 V 线圈等参数均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>UN R100 原文<\/td><td>A<\/td><td>高压系统安全与失效安全原则<\/td><\/tr><tr><td>TE Connectivity / Panasonic 高压接触器选型手册<\/td><td>B<\/td><td>粘连特性、脉冲能量容量等关键参数（待补链）<\/td><\/tr><tr><td>ISO 26262:2018 Part 5 原文<\/td><td>A<\/td><td>硬件安全机制（驱动诊断）参考<\/td><\/tr><\/tbody><\/table>\n<h3>待核对项（本课）<\/h3>\n<ul>\n<li>预充判据\"95%/97~98%\"的行业惯例出处（本课按示意惯例处理）<\/li>\n<li>量产母线电容容量范围与预充电阻脉冲能量档位的典型数据<\/li>\n<li>齐纳钳位 vs 续流二极管的释放时间差量级（快断需求与 FTTI 的对应关系）<\/li>\n<\/ul>", "text": " 对应节点 hw-05 （../domains/03-硬件设计.md （项目文件 ../domains/03-硬件设计.md） ）｜ 前置： hw-04 ；高压侧细节联动 ../domains/05-高压.md （项目文件 ../domains/05-高压.md） ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为 教学示意值 。 1. 为什么执行器是\"最后一公里\" bms 测得再准、算得再对，最终落到物理世界的动作只有几个： 闭合/断开主接触器、控制预充、驱动加热/冷却 。继电器（接触器）该断不断（粘连）或该合不合（拒动），直接就是危害事件——节点约束点题： 驱动需诊断（短路/断路/粘连）；失效安全位置（常开/常闭）需按整车策略定 。 典型高压回路布局（示意）：主正接触器 + 主负接触器 + 与主正并联的\"预充接触器 + 预充电阻\"。失效安全策略： 主接触器选常开 ——失去驱动电源时自动断开高压（按整车策略确定，节点约束）。 2. 机制展开：驱动、诊断、预充逐个看 （1）线圈驱动 ：低压侧低边驱动（n-mos/npn 下拉线圈负端），线圈感性，断开瞬间需钳位（续流二极管/齐纳）保护驱动器。要点：钳位方式影响释放时间——续流二极管让磁场缓慢释放，继电器断开慢；齐纳钳位更快（快断对安全有利）。 （2）驱动诊断（三态检测，示意方法） 断路 ：线圈未通电时上拉检测，读不到回路 → 断线； 短路 ：驱动器过流检测/线圈电流异常； 粘连（welded） ： 闭合前 测负载侧电压——若主接触器断开时负载侧仍测到电池电压，说明触点粘死。 （3）预充（precharge） ：闭合主接触器前，先经预充电阻给逆变器母线电容充电，避免直接闭合时的巨大浪涌电流（手算实例）。预充完成判据：母线电压 ≥ 95% × 电池包电压（示意判据，与 sw-04 迁移条件一致）。 （4）执行器家族 ：除接触器外还有正温度系数加热膜（ptc）、液体加热器、冷却水泵/风扇——共同点是\"驱动+诊断\"成对出现，过温/断路/短路都要可检测。 3. 手算实例：预充电阻与粘连判据 场景 （教学示意值）：电池包 400 v，逆变器母线电容 c = 500 µf，预充电阻 r = 100 ω，主回路等效电阻 r_loop ≈ 20 mω。 step 1 — 预充电阻要吃掉多少能量 ： e = ½cv² = 0.5 × 500 µf × 400² = 40 j 。 关键洞察： 这个 40 j 与 r 无关 ——不管阻值多大，电容充到 400 v 就有 40 j 在电阻上变成热。所以预充电阻按 脉冲能量容量 选型（如 40 j/次，示意档位），不是按平均功率。 step 2 — 时间与峰值电流 ： 峰值电流（闭合瞬间）：i₀ = 400 ÷ 100 = 4 a 时间常数 τ = rc = 100 ω × 500 µf = 50 ms → 充到 95% 需 3τ = 150 ms 对比：若不预充直接闭合，浪涌 i = 400 ÷ 20 mω = 20000 a ——接触器会焊死，这就是预充存在的理由。 step 3 — 为什么判据是 95% 而不是 90% ： 90% 时剩余电压 40 v，直接闭合冲击 = 40 ÷ 20 mω = 2000 a；95% 时剩余 20 v → 冲击 1000 a （仍可观，实际设计常取 97~98% 或叠加限流策略，示意惯例）。判据每提高 5%，冲击减半。 step 4 — 线圈侧参数 ：24 v 线圈、电阻 240 ω → 保持电流 100 ma、功耗 2.4 w；线圈电感 100 mh（示意）→ 断开瞬间释放能量 ½li² = 0.5 mj，由钳位电路吸收。 4. 工程实态 预充超时是标准故障：规定时间内母线电压不达标 → 报 dtc、禁止闭合主接触器（状态机处理见 sw-04 ）； 粘连检测在 每次上电前 执行（车辆静置、回路无电流时最可靠），检测失败则禁止上电； 双路主动断开：主正/主负均为常开且独立诊断，单点粘连仍可断开回路； 驱动芯片集成诊断（过流/断线/过温回读）已是主流，bms 软件负责解释诊断位并联动 dtc（ sw-05 ）。 5. 常见误区 预充电阻按平均功率选型——40 j 脉冲能量才是选型量，平均功率会严重低估； 预充判据随手写 90%——冲击电流翻倍，接触器寿命骤降； 粘连检测只在下电后做一次——上电前必须重测，粘连可能发生在任意断开动作之后； 续流二极管图省事——断开时间变长，紧急分断场景慢几百毫秒（对 ftti 敏感， safe-04 ）。 6. 自测 q1 ：c = 1000 µf、v = 800 v 时预充电阻吸收的能量是多少？与 r 有关吗？ q2 ：r = 100 ω 不变、c 翻倍到 1000 µf，充到 95% 需要多久？ q3 ：为什么粘连检测要选\"回路无电流\"的时机？ 答案 q1：e = ½ × 1000 µf × 800² = 320 j ；与 r 无关（r 只决定时间与峰值电流）。 q2：τ = 100 ω × 1000 µf = 100 ms，3τ = 300 ms ——能量翻倍、时间翻倍，电阻选型与预充超时阈值都要重设。 q3：有电流时负载侧电压 = 电池电压 − 回路压降，\"测到电压\"无法区分是触点粘连还是正常导通；无电流时负载侧出现电压只能来自粘死的触点（或漏电，需排除）。 来源 s-03：gb/t 38661-2020（bms 对高压通断控制的产品级要求） s-13：un r100（高压系统安全框架）；s-04：gb 18384-2020（整车安全要求） 本课 400 v/500 µf/100 ω/20 mω/24 v 线圈等参数均为教学示意值 延伸资源（仅列可靠名称，链接待补） 资源 级别 说明 un r100 原文 a 高压系统安全与失效安全原则 te connectivity / panasonic 高压接触器选型手册 b 粘连特性、脉冲能量容量等关键参数（待补链） iso 26262:2018 part 5 原文 a 硬件安全机制（驱动诊断）参考 待核对项（本课） 预充判据\"95%/97~98%\"的行业惯例出处（本课按示意惯例处理） 量产母线电容容量范围与预充电阻脉冲能量档位的典型数据 齐纳钳位 vs 续流二极管的释放时间差量级（快断需求与 ftti 的对应关系） "}, {"id": "HW-06", "title": "课程 HW-06：通信收发器与电气接口", "dom": "HW", "verified": false, "html": "<blockquote><p>对应节点 <code>HW-06<\/code>（../domains/03-硬件设计.md <span class=\"fileref\">（项目文件 ../domains/03-硬件设计.md）<\/span>）｜ 前置：<a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a> ｜ 预计用时 45 min 数字规则：文中具体数字凡未挂标准/来源者均为<strong>教学示意值<\/strong>；显性/隐性电平为 ISO 11898-2（S-11）的标称概念。<\/p><\/blockquote>\n<h3>1. 为什么收发器是\"看不见的地基\"<\/h3>\n<p>MCU 的 TX/RX 引脚输出的是逻辑电平，不能直接驱动总线——收发器（Transceiver）负责把逻辑电平翻译成总线差分电平、仲裁冲突下的电气行为、以及整车最关心的<strong>唤醒/休眠<\/strong>。节点约束点题：<strong>波特率与节点负载；唤醒/休眠静态电流（mA 级目标）<\/strong>。BMS 是整车漏电投诉的高发嫌疑节点，休眠电流设计就在这颗小芯片上。<\/p>\n<h3>2. 机制展开：收发器职责逐项看<\/h3>\n<p><strong>（1）电平翻译（ISO 11898-2，S-11）<\/strong><\/p>\n<ul>\n<li>显性（Dominant）：CAN_H/CAN_L 差分约 2 V（标称），表示逻辑 0；<\/li>\n<li>隐性（Recessive）：差分约 0 V，表示逻辑 1；<\/li>\n<li>多节点\"线与\"：任何人发显性则总线为显性——这就是 CAN 仲裁的物理基础。<\/li>\n<p><strong>（2）端接（Termination）<\/strong>：总线两端各 120 Ω（标称），并联后总线直流负载 60 Ω。显性时收发器驱动电流 ≈ 2 V ÷ 60 Ω ≈ <strong>33 mA<\/strong>（标称电平估算）。端接缺失或阻值错 → 信号反射与电平异常，低速看不出问题、高速就翻车。<\/p>\n<p><strong>（3）唤醒与休眠（本课核心）<\/strong><\/p>\n<li>部分网络（Partial Networking）：收发器在 MCU 睡着后监听总线，只有匹配<strong>唤醒帧（WUP）或唤醒报文（WUF）<\/strong>才唤醒系统，其余流量被过滤——防\"总线一有动静全车醒\"；<\/li>\n<li>LIN（ISO 17987，S-12）：低成本主从总线，BMS 包内从控板（温度采集板等）的常用备选， LIN 唤醒通过显性电平持续一定时间实现。<\/li>\n<p><strong>（4）失效防护<\/strong>：收发器对总线短路、TXD 卡显性（防\"一节点卡死全车瘫痪\"）有内置保护；这些故障模式要有 DTC 联动（<a class=\"xlink\" href=\"#/lesson/SW-05\">SW-05<\/a>）。<\/p>\n<\/ul>\n<h3>3. 手算实例<\/h3>\n<h4>实例 1：位时序配置（采样点）<\/h4>\n<p>晶振 40 MHz，目标 500 kbit/s：<\/p>\n<ul>\n<li>分频取 4 → 时钟 10 MHz → 时间份额 Tq（Time Quantum）= 100 ns；<\/li>\n<li>每位 20 Tq → 位时间 = 2 µs → 500 kbit/s ✓<\/li>\n<li>采样点位置 = (同步段 + 传播段 + 相位段1) ÷ 总 Tq = 15 ÷ 20 = <strong>75%<\/strong>（经典 CAN 常用 75~80%，示意惯例）。<\/li>\n<\/ul>\n<h4>实例 2：休眠静态电流预算<\/h4>\n<p>板级目标 &lt; 100 µA（示意；整车对下电漏电的目标为 mA 级，节点约束）：<\/p>\n<table><thead><tr><th>通路<\/th><th>电流（教学示意值）<\/th><\/tr><\/thead><tbody><tr><td>CAN 收发器（部分网络模式）<\/td><td>8 µA<\/td><\/tr><tr><td>MCU 待机（RAM 保持）<\/td><td>25 µA<\/td><\/tr><tr><td>AFE × 3（休眠/低占空比）<\/td><td>3 × 2 µA = 6 µA<\/td><\/tr><tr><td>唤醒监测与漏检电路<\/td><td>5 µA<\/td><\/tr><tr><td><strong>合计<\/strong><\/td><td><strong>44 µA<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>结论：44 µA 对 100 µA 目标余量 2.3 倍——<strong>但任何一路选型失误（比如收发器选了 200 µA 的普通模式）直接超标<\/strong>。休眠预算表要在选型阶段就做，而不是测出来超标再返工。<\/p>\n<h3>4. 工程实态<\/h3>\n<ul>\n<li>CAN FD（S-11）：数据段提速（整车常用 2~5 Mbit/s 档，示意，与 <a class=\"xlink\" href=\"#/lesson/SYS-04\">SYS-04<\/a> 一致）——注意<strong>仲裁段位时序与数据段位时序分开配置<\/strong>，时钟误差容忍度不同；<\/li>\n<li>节点数与电气负载：节点数受收发器差分输入电阻限制（保证隐性电平恢复能力），上限具体数值随器件代次变化，待核对；<\/li>\n<li>网络管理（NM）睡眠协调由软件栈完成（<a class=\"xlink\" href=\"#/lesson/SW-03\">SW-03<\/a>），收发器提供\"唤醒源\"硬件基础；<\/li>\n<li>BMS 特有约束：包内从控板常用菊花链/私有链路（<a class=\"xlink\" href=\"#/lesson/HW-01\">HW-01<\/a>），对外才走 CAN/LIN——两级网络的休眠协调要一起设计。<\/li>\n<\/ul>\n<h3>5. 常见误区<\/h3>\n<ol>\n<li>端接随便加——每个节点自带端接会过载驱动（60 Ω 变成更小并联值），端接只在两端；<\/li>\n<li>\"总线有活动就唤醒\"——不过滤 WUF 的收发器等于没有部分网络，驻车耗电失控；<\/li>\n<li>CAN FD 数据段沿用仲裁段采样点配置——数据段更短更快，配置不当误码率飙升；<\/li>\n<li>忽略 TXD 卡显性保护——一个故障节点卡死总线，整车通信瘫痪。<\/li>\n<\/ol>\n<h3>6. 自测<\/h3>\n<p><strong>Q1<\/strong>：40 MHz 分频 2、每位 40 Tq，波特率多少？采样点在 Tq 30 处是多少？ <strong>Q2<\/strong>：休眠预算 44 µA 若收发器换成普通模式 200 µA，总电流超板级目标多少？ <strong>Q3<\/strong>：为什么隐性是\"0 V 差分\"却仍能被总线正确读取？<\/p>\n<details><summary>答案<\/summary>\n<ul>\n<li>Q1：20 MHz ÷ 40 = 500 kbit/s（Tq = 50 ns，位时间 2 µs）✓；采样点 = 30/40 = <strong>75%<\/strong>。<\/li>\n<li>Q2：44 − 8 + 200 = <strong>236 µA<\/strong>，超 100 µA 目标 136 µA——单颗器件毁掉整个预算。<\/li>\n<li>Q3：显性是\"主动驱动 2 V 差分\"，隐性是\"放开总线、由端接电阻把差分拉回 0\"——接收端以显性为准判 0，其余读 1（线与机制）。<\/li>\n<\/ul>\n<\/details>\n<h3>来源<\/h3>\n<ul>\n<li>S-11：ISO 11898 系列（CAN / CAN FD 物理层与链路层）<\/li>\n<li>S-12：ISO 17987（LIN）<\/li>\n<li>S-03：GB/T 38661-2020（BMS 通信能力的产品级要求）<\/li>\n<li>本课休眠电流表、40 MHz/20 Tq、75% 采样点均为教学示意值<\/li>\n<\/ul>\n<h3>延伸资源（仅列可靠名称，链接待补）<\/h3>\n<table><thead><tr><th>资源<\/th><th>级别<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>ISO 11898-2 原文<\/td><td>A<\/td><td>物理层电平/端接/输入电阻的权威定义<\/td><\/tr><tr><td>Bosch《CAN Specification》2.0 (1991)<\/td><td>B<\/td><td>CAN 协议原始规范，经典必读<\
